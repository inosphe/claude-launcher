name: improv-leader
description: >
  자유 진행 관제 리더 — 한 회차 = 운영 확인 -> 관제 대기(워커 요청 처리·
  규칙 충돌 조정·증거 수합·스윕 배치) -> 증거가 찬 통합 대기가 생기면
  (리더 self-decision, 직전 통합에서 5분이 지나야 열리는 창에 모아 배치로)
  master --no-ff 통합 -> (게이트, 이 정본에서는 리더 self-decision) 머지
  결과 트리의 전체 스윕 -> (리더 self-decision) 라이브 반영으로 마감, 또는
  (사용자 승인) 교대 종료.
  머지·반영은 사용자 승인 게이트를 지나지 않는다 — 무방비가 아니라 머지는
  스윕 단계의 전체 스윕이, 반영은 재기동 후 실제 서빙 확인이 받친다.
  그 전체 스윕은 언제나 spawn한 subagent가 돌린다 — 리더의 턴에서도,
  스텝의 verify로도 돌지 않는다. verify가 하는 일은 스윕을 돌리는 것이
  아니라 subagent가 남긴 영수증이 지금 tip에 대한 green인지 보는 것이다.
  태스크 하나마다 머지하고 스윕하지 않는다 — 통합 옵션의 interval(300초)이
  창을 만들고, 창 하나에 모인 후보가 한 배치, 스윕은 배치당 한 번이다.
  「한 번」은 창 전체를 통틀어서다: 관제 대기는 전체 스윕을 시키지 않고,
  통합 프리뷰를 쓸었으면 머지 후 스윕은 그 영수증을 재사용한다(같은 트리).
  요청이 늘어도 스윕은 늘지 않는다 — 그것이 창의 값이다.
  거절은 지금은 아니다일 뿐이다 — 관제 대기로 복귀할 뿐, 배치를 더 모으라는
  뜻이 아니다.
  통합 후보는 두 매체로 온다 — 로컬 브랜치(--no-ff 머지)와 원격 pull
  request(`gh pr merge`, merge commit; improv-worker-remote가 올린다) — 그리고
  표·창·게이트·스윕·마감은 매체와 무관하게 하나다: 같은 in_review 표에서
  같은 merge_ready 게이트로 심사하고, 같은 창에 모아, 배치당 스윕 한 번으로
  닫는다. 다른 것은 머지를 실행하는 명령과, PR 편성에서 원격 base를
  master와 같게 유지하는 push 두 줄뿐이다.
  테스트(스윕)와 머지 실행은 리더의 턴에서 일어나지 않는다 — 매번
  subagent를 spawn해 그 안에서 돌리고, 리더는 돌아온 수치·해시를 값싼
  읽기 명령으로 되확인해 심사에만 쓴다.
  recur가 끝난 회차마다 다음 회차를 요청하는 상주 서비스 루프이며, 그 시작은
  데몬이 대행한다(recur auto) — 리더의 마지막 스텝이 라이브 재기동이라 회차를
  닫는 턴이 그 재기동과 함께 죽고, 그러면 「드라이버가 start를 친다」가 성립할
  턴이 남지 않는다. 반복을 멈추는 것은 사용자다(claunch cflow request --cancel).
start: intake
# 다음 회차의 start를 데몬이 대행한다(RoundStartClock). plain recur는 그 start를
# 드라이버에게 맡기는데, 이 워크플로의 마지막 스텝 reflect는 라이브 데몬을
# 재기동하고 데몬은 붙은 터미널을 전부 데리고 내려간다 — 회차를 닫을 턴이 그
# 재기동과 함께 죽는다. 그리고 리더가 앉는 자리 done은 아무 클럭도 찌르지
# 않는다: cflow_clock.py의 _ACTIONABLE은 step과 select뿐이라 리마인더도
# stall ping도 done을 건너뛰고, RunEventClock의 round-done은 드라이버가 아니라
# 상위로 가는데(같은 파일) 리더에게는 상위가 없다. 그래서 12회차가 닫힌 뒤
# 13회차는 사람이 손으로 start를 불러 열렸다.
# auto는 그 자리를 둘 다 메운다 — 데몬이 라운드를 시작하고, round_block은 idle
# 세션도 깨운다(RoundStartClock._deliver에는 busy 검사가 없다).
# 고아 런 우려는 측정으로 걸렀다(claunch-usfz): 런은 (cwd, scope)로 키가 잡히고
# scope는 세션 이름이므로, 드라이버가 죽은 auto 런은 다른 세션의 start를 막지
# 않는다(별개 슬롯). 같은 이름으로 돌아오는 경로는 respawn과
# clear-sessions --logs 뒤의 이름 재활용 둘뿐이고, 앞의 것은 그 런의 주인이
# 돌아온 것이라 거절이 맞다.
recur: {auto: true}

# 관제 런은 leader 역할 세션만 몬다 — 워커가 이 런을 시작해 스스로 통합
# 권한을 얻는 사고를 시작 시점에 막는다.
filter_roles:
  type: whitelist
  roles: [leader]

# 위저드의 Role 행이 leader를 고르면 이 워크플로를 자동 선택한다 —
# own filter_roles가 whitelist로 leader를 받으므로 모순이 없다.
default_role: leader

# 이 런을 모는 세션이 spawn한 자식은 워크플로를 따로 대지 않아도 이 런에
# 붙는다 — improv-leader:improv-worker는 한 절차의 두 짝이고, 그 짝을
# 부모 쪽에 한 번 선언해 두는 자리가 여기다. 자식의 role이 아니라 부모가
# 도는 절차가 자식의 런을 정한다: role은 워크플로를 가로질러 따라다니므로,
# role=worker라는 이유로 improv-worker를 물리면 다른 절차를 도는 리더의
# 자식에게도 이 워커 런이 붙는다. 짝을 선언하지 않은 워크플로의 자식은
# 런 없이 시작한다 — 그게 정답이다. 한 자식만 예외로 두려면 spawn에
# workflow를 직접 대거나(덮어쓴다), workflow: '-'로 거절한다.
default_child_cflow: improv-worker

# 착지 큐(claunch-3u15l): 자식 워커의 착지 요청을 이 런의 상태로 둔다 —
# 리더의 컨텍스트 기억 대신. 항목은 워커가 integration-request를 떠날 때
# 데몬이 등록하고(issue·branch·tip·요청자·시각), landed는 데몬이 tip이
# master의 조상인지 git으로 재어 표시한다. 회차가 end로 전이할 때 엔진이
# landed·rejected를 버리고 나머지를 다음 회차로 이월한다(deferred는
# requested로). 무엇을 버리고 이월했는지는 다음 회차의 시작 블록과
# 페이로드의 landing_reset이 말한다.
landing_queue: {target: master}

steps:
  intake:
    title: 운영 확인
    instructions: |
      새 회차다. 첫 회차면 운영 조건을 사용자와 합의하고, 이후 회차면 변경
      사항이 없는지 한 줄로 확인하고 바로 넘어간다. 정할 만한 것:
      - 워커 편성: 몇 세션, 어느 워크스페이스, 지금 spawn할지 필요 시 spawn할지
        (spawn에 workflow를 대지 않으면 이 워크플로의 짝인 improv-worker가
        자동으로 붙는다 — default_child_cflow. 런 없이 심부름만 시킬 자식만
        workflow: '-'로 거절한다). 착지를 원격 PR로 올리는 워커는
        `workflow: improv-worker-remote`를 spawn에 명시한다(정본 워커의
        레이어 — 회차 모양은 같고 착지 매체만 PR이다). 그 편성의 전제
        셋을 첫 회차에 확인한다: 저장소 설정 `claunch.pr.remote`(PR을 여는
        원격 이름; `claunch.pr.base`는 base 브랜치, 기본 master), 그
        호스트에 인증된 gh CLI(`gh auth status --hostname <host>` — 사설
        GitHub Enterprise면 그 호스트), 그리고 원격 base가 master와 같다는
        것(`git rev-list --count <remote>/<base>..master`가 0 — 아니면 통합
        단계의 「PR 후보」 절이 먼저 push한다). 한 영역에
        워커가 몰리면 평면으로 두지 않고 mesh-delegate 스킬로 그 영역의
        중간 워커(workflow: improv-mid — 역할은 worker, 런은 그 영역의
        스택 PR 관제)를 두고 그 밑으로 옮긴다(reparent)
      - 테스트 분업: 워커는 바꾼 영역의 테스트만 표적으로 돌린다 — 전체
        스위트는 워커가 어떤 경로로도(손 명령도, 스텝 verify로도) 돌리지
        않는다. 전체 스윕(build+typecheck+전체 스위트)은 리더가 모아서
        배치(5분 창에 모인 머지)당 한 번 처리하고, **그 스윕도 그 밖의
        모든 스윕 수요도 subagent 하나에 하나씩 맡긴다. 리더는 스윕도
        머지도 자기 턴에서 직접 돌리지 않고, 스텝의 verify로도 돌리지
        않는다** — verify는 subagent가 남긴 영수증을 읽는 값싼 검사이지
        스윕이 아니다. 이 회차에도 그대로 적용됨을 확인만 하고
        넘어간다(규칙 본문은 관제 대기와 통합 단계가 각각 다시 말한다).
        별도 tester 세션은 더 이상 이 워크플로의 경로가 아니다: 스윕은
        상주가 필요 없는 1회성 작업인데 세션은 슬롯·메시 배선·유휴 관리를
        리더에게 되돌려준다. 이미 붙어 있는 tester가 있으면 교대 종료
        단계에서 정리한다
      - 상시 규칙: 정본·공용 규칙 결정은 단일 규칙으로 기록·공지한다,
        master 반영과 라이브 재기동은 리더의 self-decision으로 진행한다 —
        증거(수합 표·전체 스윕, 재기동 후 실제 서빙 확인)가 받치며,
        교대 종료만 사용자 승인을 지난다
      - 사용자에게 올릴 에스컬레이션의 기준(가치·우선순위·범위·권한에
        해당하는 것만, 선택지+권고안 형태로)
      - 보드 대조(회차의 첫 행동 — 컴팩션·재기동 뒤의 복구가 이것이다):
        `claunch beads list --status in_ready --status in_progress --status in_review
        --json`의 이슈마다 assignee 세션의 런 위치(claunch cflow status
        -t <세션> --json)와
        맞춰 본다. assignee 세션이 exited인 in_progress 이슈는 고아다 —
        `claunch beads comments add <id> "ORPHANED: <세션> exited, branch
        <브랜치>"` 후 `update <id> --status open`으로 되돌린다(재배정은
        관제 대기에서). in_review인데 assignee가 exited인 것은 갈래가 하나
        더 있다: 그 브랜치가 이미 실렸는지를 git으로 본다 — `git rev-list
        --parents --merges <tip>..master`의 부모 목록에 그 tip이 있는가
        (워커의 landed와 같은 질문이고, contains로 묻지 않는 이유도 같다).
        실렸으면 마감만 남은 것이므로 리더가 닫는다(`close <id> --reason
        "merged <해시>"`, 스윕 수치를 알면 붙인다) — 워커가 wrapup에 닿기
        전에 죽어서 못 닫은 것이고, 그대로 두면 표에 영원히 남는다.
        안 실렸으면 위와 같이 open으로 되돌린다. 보드에 없는데 돌고 있는 워커 런이 있으면 그 워커에게
        이슈를 만들어 올리라고 한다 — 리더가 대신 만들지 않는다.
      합의(또는 무변경 확인)와 보드 대조 결과를 보고에 남긴다.

      ── beads(br) 규칙 — 공통 ──
      일감의 정본은 beads다: 세션이 한 회차를 쓸 일, 다른 세션·회차로 넘어갈
      일은 이슈로 존재해야 한다(존재·제목·범위·완료 기준·assignee·상태·
      의존·부모). beads에 두지 않는 것: 실행 기록(cflow 저널), 승인·선택
      (cflow ask/select), 그리고 사건 — 대화·답장·정정, restack 공지, 창
      순번처럼 지금 이 순간에만 뜻이 있고 되짚어 읽히지 않는 것(mesh).
      ── 기록은 코멘트에, 신호는 메시지에 ──
      되짚어 읽힐 것은 전부 코멘트다: 증거 묶음(브랜치·tip·기능/머지 해시,
      테스트 수치와 그 축·트리·환경, 양방향 diff, 포함 관계, 스택 위치,
      merge-tree 결과), 심사 한계와 테스트가 세우지 못하는 것, 그리고 판정
      마커 — `LANDING REQUEST @ <hash>` / `REBASE REQUESTED @ <hash>` /
      `REMEASURE REQUESTED @ <hash>` /
      `REVIEWED: pass @ <hash>` / `CHANGES REQUESTED: <무엇을>` /
      `HOLD: <이유>` / `BLOCKED: <게이트>` / `merged <hash>`. 코멘트는 산문
      문단이 아니라 (축, 트리, 값)의 줄로 적는다 — 보드는 저장소에 커밋되므로
      산문은 무게만 늘리고 되짚을 때 읽히지 않는다. 긴 묶음은 파일로 붙인다:
      `claunch beads comments add <id> -f <파일>`.
      **같은 것을 메시지 본문에 다시 싣지 않는다.** 메시는 상대 터미널에
      타이핑되므로 본문은 수신자 수만큼 곱해 남의 컨텍스트에서 나가고, 기록으로
      보낸 것은 아무에게도 답을 요구하지 않으면서 그 값을 치른다. 메시지는
      nudge다 — 네 줄 안에 이슈 id와 상태, 코멘트 마커, 판정을 바꾸는 값 한 줄
      (델타·미해결 한계 유무), 상대가 할 일. 상대는 그 id로 당겨 읽는다
      (`claunch beads show <id> --json`, `claunch beads comments <id>`; 표
      전체는 `claunch beads list --status in_review --json` 한 번이다).
      이 갈래가 서지 않는 자리가 하나 있다: 다른 머신의 멤버는 이 저장소의
      보드에 닿지 않는다(`claunch mesh members`의 machine이 다르면 그렇다).
      그 상대에게만은 묶음을 메시지로 보낸다.
      정본 규칙(파서·직렬화·포맷 같은 공용 규약, 판정식, 기준선)은 이슈가
      아니지만 되짚어 읽히므로 보드에 산다: `--type doc` 이슈 하나를 세우고
      (assignee 없음 — `in_ready`로 전이하지 않는다) 갱신을 갈래로 나눠 쌓는다:
      **규범 내용(규약·정의·판정식)은 본문에 두고, 고칠 때 본문을 고친다.**
      코멘트에는 그 판정이 어떻게 서고 어떻게 정정됐는지의 이력을 쌓는다.
      doc에서만 앞 갈래가 뒤집히는 이유는 용도다 — 참조하러 온 사람은 본문
      하나를 읽고 닫으므로 본문이 지금 값이어야 한다. 규약을 코멘트로만
      쌓으면 본문이 낡고, 낡았다는 것을 알리는 경고도 exit code도 없다
      (`claunch-qj03` 실측).
      전원 브로드캐스트로 규칙을 배포하지 않는다 — 수신자 수만큼 곱해지는 데다
      나중에 합류한 사람에게는 닿지 않는다. 배포는 doc 이슈 id 한 줄이다.
      호출은 항상 `claunch beads <br 인자>` — 워크트리에서도 저장소 루트의
      .beads/beads.db 하나를 쓰고(--db를 대신 붙인다), 쓰기에 --actor
      $CLAUNCH_SESSION을 붙이며, DB가 없으면 `claunch beads`가 issues.jsonl에서
      스스로 만든다. 조회는 --json.
      **`.beads/issues.jsonl`을 직접 고치는 것은 금지다.** 보드의 실체는
      `.beads/beads.db`이고 jsonl은 그것을 내보낸 산출물이다. 손으로 쓴 줄은
      DB에 들어가지 않는다. 다음에 어느 세션이든 `claunch beads sync
      --flush-only`를 돌리면 DB 내용이 그 파일을 덮어쓰고, 손으로 쓴 내용은
      에러도 경고도 없이 사라진다. 반대로 jsonl에만 있고 DB에 없는 이슈가
      생기면 export의 stale 가드가 걸려 그 저장소의 flush가 전부 멈춘다
      (`claunch beads sync --help`). Edit·Write·`sed -i`·리다이렉션 어느
      것으로도 그 파일에 쓰지 않는다. 이슈를 만들고 고치고 닫는 길은
      `claunch beads` 하나다. jsonl에서 DB로 되돌리는 것이 정말 필요하면
      `claunch beads sync --import-only`이고, 그것도 사람의 판단이 있을 때다.
      이슈가 없을 때 만드는 자 = 그 일을 사람에게서 처음 받은 세션, 또는
      발견한 세션이다 — 리더가 아니다. 만들기 전에 `claunch beads search
      "<핵심어>" --json`과 open/in_ready/in_progress/in_review 목록으로 중복을 본다;
      있으면 create 대신 comments add. 규격: 제목 한 줄「무엇을 어떻게」,
      --description은 `## 목표 / ## 범위(포함·제외) / ## 완료 증거 기준 /
      ## 출처(누가·언제·원문)`, --labels에 출처 하나(user | user-direct |
      leader | handoff | found | review). 우선순위: P1 사용자가 보고한
      라이브 데몬·UI 고장과 master 빨강 / P2 사용자 지시·리더 배정(기본) /
      P3 인수인계·발견·후속·후보 / P4 아이디어. type은 task 기본, bug는
      회귀·결함, epic은 스택 부모, doc은 참조 전용(`in_ready`로 전이하지 않고 배정하지
      않는다). staged 순서: description이 먼저, --assignee가 마지막.
      상태 전이의 주인: open→in_ready는 리더(규격·우선순위 검토 완료) /
      open 또는 in_ready→in_progress는 assignee 워커(intake 끝,
      --external-ref에 run id; 터미널 사용자 직접 지시는 open에서 시작할 수 있음) /
      in_ready→open은 리더(규격·우선순위 재검토 필요) /
      in_progress→in_review는 assignee 워커
      (landing request) / in_review→in_progress는 리더(rebase·재측정 재요청)
      또는 요청을 철회하는 assignee 워커(`WITHDRAWN @ <tip>` 코멘트와 함께) /
      in_review→closed는 assignee 세션이다 — 누가 배정했든 그 이슈를 끝까지
      관리하는 것은 assignee다. assignee 세션이 종료돼도 in_ready는 검토 결과를 유지하고,
      다음 adoption이 종료된 assignee를 교체한다. 닫는 자리는 wrapup 하나, 닫을 자격은 landed가
      git으로 증명한 머지 커밋 해시다(`claunch beads close <id> --reason
      "merged <머지 해시>"`; 중간 워커는 자기 --parent 자식을 같은 방식으로
      닫는다). 리더가 닫는 것은 둘뿐이다: assignee가 비었거나 그 세션이
      exited인 고아와, 중간 워커 자신의 스택 이슈 — improv-mid에는 landed에
      해당하는 게이트가 없어 자기 착지를 git으로 증명할 수단이 없고, 증명
      없이 닫는 것은 이 규칙이 막으려던 바로 그것이다(중간 워커가 닫는 것은
      landed 증거가 있는 자기 --parent 자식뿐이다). 그 둘에 한해 리더가
      닫고, 사유에 스윕 수치를 붙일 수 있으면 붙인다 / 아무
      상태→blocked는 그 게이트에 걸린 세션(`BLOCKED: <스텝>`), 해소되면
      같은 세션이 되돌린다 / reopen은 리더만. update --status closed는
      없다 — close뿐이다.
      ── open 풀 판정 기준 ──
      open 이슈 수는 그 자체로 정보가 아니다 — 라벨·배정·코멘트 마커를
      가르지 않은 원값은 살아 있는 일감 수를 과대 센다. 측정은
      `claunch beads list --status open --limit 0 --json`으로 우선순위·
      assignee·첫 라벨·코멘트 마커를 센 뒤 말한다(기본 행 제한 50은 판정
      근거가 아니다).
      살아 있는 일감: assignee가 살아 있는 세션이고 intake에서 in_progress
      전이(external-ref에 run id)를 한 것 / 리더가 배정·보류를 코멘트로
      남긴 것 / 위 우선순위 절의 P1에 맞는 것.
      정리 대상은 셋이고 판정은 개별이다 — 여럿을 한 번에 닫는 일괄 변경은
      없다:
      (1) merged 해시가 코멘트에 있는데 open인 것 — 닫을 자격은 이미
          증명됐다. assignee가 살아 있으면 그 wrapup에서, 없거나 소멸했으면
          리더가 닫는다.
      (2) 같은 규격(목표·범위·출처·우선순위)의 중복 — 존재 쪽을 남기고
          중복 쪽을 닫는다(사유에 존재 쪽 id). create 전 search가 생성을
          막고, 이 갈래는 이미 생긴 중복의 처리다. assignee가 없거나
          소멸했으면 리더가 닫는다.
      (3) SESSION ENDED 코멘트가 있고 assignee 없이 3일 지난 open — 리더의
          정리 대상이며 재배정이 먼저다: 배정 후보·우선순위·최근 갱신
          가운데 하나라도 있으면 재배정하고, 셋 다 없으면 닫는다(사유에
          판정 근거, 재발하면 리더만이 reopen한다).
      ── 큐(queue)·배치(batch) 규칙 ──
      세션의 큐는 보드에서 assignee가 그 세션인 활성 이슈(open·in_ready·
      in_progress·in_review)다 — 세션 레코드에 따로 적지 않고 보드 하나가
      정본이다. 순서는 priority 오름차순, 같으면 created_at 순. 읽는 명령은
      `claunch beads list --assignee <세션> --status open --status in_ready
      --status in_progress --limit 0 --json`. 배정(assignee 쓰기)은 리더·
      운영자의 것이다(예외: 세션이 스스로 만든 이슈 — 아래 「스스로 만든
      이슈는 만든 세션이 처리한다」 절) — 대시보드 Beads 페이지의 Queues 탭에서 카드를 세션
      행으로 끌면 데몬이 `update <id> --assignee <세션>` 하나를 대신 치고
      `QUEUED`/`UNQUEUED` 코멘트를 남긴다; 상태(status)는 손대지 않는다.
      한 세션의 큐는 브랜치 하나 위에서 배치로 처리된다: 일감마다
      in_progress 전이 → 작업·테스트·커밋 → 다음 일감, 큐가 비면(또는 배치
      상한 5개에 닿으면) 배치의 이슈 전부를 in_review로 올려 착지 요청은 한
      번이다. 마커는 이슈마다 `LANDING REQUEST @ <tip>`이고 주 이슈(오프닝의
      `issue: <id>`)의 마커 뒤에 `batch: <id,...>`가 붙으며 증거 묶음은 그 주
      이슈 코멘트 하나에 있다. 리더는 같은 tip의 행들을 후보 하나로 심사해
      한 번 머지하고, 닫는 것은 assignee가 이슈마다 `merged <해시>`로 한다.
      착수하지 않은 큐 일감은 회차 마감 뒤 워커의 queue-recheck가 다시
      읽는다 — 착수할 수 있으면 같은 런 안에서 다음 회차의 주 이슈가 되고
      (intake로 루프), 착수할 수 없는 것(blocked·다른 저장소 영역)만
      `update <id> --assignee ""`와 `UNQUEUED: <세션> landed without it`
      코멘트로 풀에 되돌린다.
      ── 스스로 만든 이슈는 만든 세션이 처리한다 ──
      워커가 회차 중 스스로 만든 이슈(work의 `found`, wrapup의 `handoff`)는
      만든 세션이 같은 런 안에서 처리한다(claunch-034c4, 2026-09-23 사용자
      지시 — claunch-qac7 Q1의 「워커 자기 배정은 원칙적으로 금지, 좁은
      self 예외만 제안」을 대체한다). 만들고 assignee 없이 backlog로 두는
      것이 기본값이던 동안 그 이슈들은 처리되지 않고 쌓였다(s586). 그래서
      배정은 wrapup의 생성 이슈 정산에서 워커가 직접 친다 — 항목마다:
      (1) **spawn** — 살아 있는 자식(`children`)이 있고 그 이슈가 그 자식의
      영역이며 그 자식의 런이 아직 queue-recheck 앞에 있으면(`claunch
      cflow status -t <자식> --json`의 `step_id`가 queue-recheck·settle-*·
      end-*가 아니고 런이 done이 아니다 — 지난 자식은 큐를 다시 읽지
      않는다) 그 자식에게(`update <id> --assignee <자식> --add-label
      delegated` + `DELEGATED: from <원회차 id> to <자식>` 코멘트 + 자식에게
      mesh 한 줄 — 자식의 queue-next/queue-recheck가 보드로 읽는다; 자식이
      착수 전에 종료되면 데몬이 `delegated` 라벨을 보고 풀에 되돌리고
      `DELEGATION RELEASED` 코멘트를 남긴다), 또는 work의 위임 조건을
      만족하면 새 자식을 `--issue <id>`로 세운다; (2) **self** — 그 밖에는
      자기에게(`update <id> --assignee $CLAUNCH_SESSION` + `SELF-QUEUED:
      from <원회차 id>` 코멘트) — queue-recheck가 그것을 읽어 같은 런
      안에서 다음 회차로 돈다; (3) **pool** — assignee 없이 남기는 것은 이
      세션이 착수할 수 없는 것(다른 저장소 영역, blocked, 범위·우선순위를
      사용자나 리더가 정해야 하는 것)뿐이고, 그 처분은 상위에게 ask로
      묻는다. self에는 런 단위 상한이 있다: 이 런의 intake 방문 수
      (`claunch cflow status --json`의 `visits.intake`)가 10 이상이면 self
      대신 pool로 보낸다 — 엔진의 loop guard(max_visits 25)는 26번째
      intake에서 런을 사람의 승인(`loop_limit`)으로 세우는데, 그 전에 범위
      판단을 상위에게 넘기기 위해서다. 리더는 거부권을 가진다(`update <id>
      --assignee ""` + `UNQUEUED by leader: <이유>`); 거부된 이슈는
      pool과 같이 상위의 처분을 따른다. 세션이 만든 활성
      이슈가 전부 누군가의 손(살아 있는 세션의 assignee, 또는 리더의
      `HOLD:` 코멘트)에 있어야 세션이 끝난다 — 워커의 settle-check가
      그것을 확인하고, 미충족이면 settle-wait가 시계로 기다린다(사람이나
      상위에게 묻지 않는다). 타이머가 여섯 번 깨우는 동안에도 안 서면
      settle-stall로 사람이 처분한다. 그러므로 이 리더가 그 보드 쓰기를
      하는 자리는 wrapup의 pool ask와 거부권 둘이다 — pool ask에 답하지
      않으면 워커는 기다리다 사람에게 넘어간다.
      br가 실패하면(잠금·바이너리 없음) --lock-timeout 5000으로 한 번 더,
      그래도 안 되면 mesh fyi 첫 줄에 `NO-BEAD:` + 위 규격 그대로 — 리더가
      다음 관제 대기에서 대신 만들고 id를 답한다. 이슈 없이 착수하는
      것만은 금지다.
    done_when: |
      운영 조건 합의(첫 회차) 또는 무변경 확인(이후 회차)과 보드 대조 결과
      (고아 처리 포함)가 보고에 기록되어 있다.
    next: standby

  standby:
    title: 관제 대기
    instructions: |
      메시를 상대로 상주 근무한다. 수신이 곧 깨움이므로 폴링하지 않고,
      사건이 없으면 이 단계에 머문다. 처리한 것마다 보고에 누적한다:
      - 워커 요청 처리: 질문 응답, 재브리핑, 막힌 워커 확인(아래 침묵
        판독의 순서로), 필요 시 spawn/재배정
      - 위임: 일감이 쌓이거나 내 턴이 남의 작업으로 채워지면 그 자리에서
        자식 세션을 spawn해 넘긴다 — 리더의 손은 결정·통합·조정이고,
        생산은 워커의 몫이다. 슬롯은 `children`이 답하고(budget), 코드에
        닿는 자식은 워크트리를 하나씩 준다. **spawn에 workflow를 적지
        않는다** — 이 런의 짝(default_child_cflow: improv-worker)이 자식에
        붙고, 그게 이 워크플로가 짝을 선언하는 이유다. 예외는 셋이다:
        한 영역의 중간 워커는 workflow: improv-mid를 직접 대고(mesh-delegate
        스킬의 경로), 커밋·머지·테스트처럼 작업 하나를 위임하고 끝나는
        1회성 자식은 workflow: errand를 댄다(완료되면 런이 done이 되고
        데몬이 세션을 자동 종료한다 — 부모가 kill할 것이 없다), 런이
        필요 없는 심부름 자식은 workflow: '-'로 거절한다.
        자식에게는 이슈 id를 context에 실어 보낸다(아래 일감 등록).
      - 기준선 이동을 알리는 법: 통지의 뜻은 하나로 고정한다 — **「이
        해시로 잰 수치는 이제 낡았다, 새 master 위에서 재측정을 시작하라」**.
        그러므로 **대상은 이미 수치를 내고 착지 요청을 올린 세션(보드의
        in_review)뿐이고**, 주소는 `@in_review`다 — 데몬이 보드에서
        in_review 이슈의 assignee를 풀어 명단으로 기록한다. `'*'`는 쓰지
        않는다: 착지를 마치고 종료 승인을 기다리는 세션까지 받아 턴을
        하나씩 쓰고(138회차 공지: 판정 가능한 수신자 33명 중 31명이 이미
        끝난 세션, claunch-424v4), 그래서 `'*'` 발송에는 매번 BROADCAST
        경고가 돌아온다. 아직 착지 요청을 올리지 않은 세션에게는 base 갱신을
        요구하지 않는다(그들에게 base 신선도는 값이 0이고, 내가 지정한
        해시는 다음 착지에 낡는다). **표면이 겹쳐도 예외가 아니다** —
        겹침은 양쪽이 끝나야 알 수 있으므로 워커의 `rebase` 단계와 내
        머지 단계가 푼다. 겹치는 둘을 발견하면 재정렬을 시키는 것이 아니라
        **둘을 잇는다**(mesh-wire). 이 규칙을 어기면 워커가 산출 0인 턴을
        쓴다(판정: claunch-no-premature-rebase-lhcz — 근거·실측은 그 이슈에
        있다). 한 교대의 측정으로 전체 injection의 93.1%가 리더를
        거쳤다 — 리더의 공지가 곧 트래픽이고, 대상을 보드 상태로 좁히는
        것이 그 트래픽을 줄이는 자리다
      - 나에게 온 결정 답하기: 워커의 런이 나에게 위임한 결정(예:
        improv-worker/improv-mid의 착지 — 그 브랜치를 지금 통합 대기 표에
        올릴지, 동결시킬지)은 decide 메시지로 도착하고 `claunch cflow asks`
        에 서 있다. 이것은 남의 게이트를 대신 넘는 것이 아니라 내 결정이다
        — 아래 「approve/select/goto/abort 금지」와 혼동하지 않는다. 그 둘은
        사람의 문을 대신 넘는 경로이고, 이쪽은 워크플로가 나를 지목해 연
        문이다. answer 도구로 옵션 하나와 이유를 답한다(이유는 저널에
        남아 그 워커가 읽는다). 판단 근거는 보드에 있다: 그 워커가 커밋
        단계에서 남긴 코멘트(브랜치·해시·수치)가 그것이고 — `claunch beads
        comments <id>` — 모자라면 claunch cflow status/journal -t <세션>. 통합 대기 표의 상태를 아는 것이
        나이므로 이 결정이 나에게 온 것이다 — 답을 미루면 그 워커의 회차가
        선다(30분 뒤 timeout으로 사용자에게 넘어간다).
        착지가 아닌 결정(예: 워커의 생성 이슈 정산 — wrapup의 pool ask;
        spawn·self 배정은 워커가 이미 쳤고 fyi로 오며, 리더에게 남는 것은
        거부권 `UNQUEUED by leader:`다, claunch-034c4)은
        아래 착지 문단이 아니라 그 ask의 프롬프트가 읽을 것과 할 일을
        말한다 — 그 답은 보드 쓰기(배정·spawn·`HOLD:`·adopt)가 먼저이고
        answer는 그 뒤다. 쓰지 않고 답하면 워커의 settle-check가 같은 질문을
        다시 내고, 그 답이 서지 않으면 타이머가 여섯 번 깨운 뒤 사람이
        처분한다.
        **착지 결정이 오는 것 자체가 예외 신호다.** 깨끗한 요청은 워커가
        스스로 올려 나를 부르지 않는다 — improv-worker/improv-mid의 landing은
        기계 확인(작업 트리 깨끗, 표적 green, 미리 병합 충돌 0, 열린 제동
        마커 없음, 동결 지시 없음)이 전부 참이면 워커가 request를 고르고
        지나가고, 하나라도 깨졌을 때만 landing-review가 열려 나에게 온다.
        그러니 이 질문이 왔으면 먼저 **무엇이 깨졌는지**부터 읽는다: 그
        워커가 landing의 select reason에 적어 저널에 남겼다(`claunch cflow
        journal -t <그 세션> -n 10`). 그것을 안 읽고 request로 답하는 것은
        문을 없애는 것과 같다 — 이 문은 이제 예외만 오므로 매번 실질이 있다.
        반대로 여기서 내가 후보의 뒤처짐·충돌을 처음부터 다시 재지 않는다:
        그 심사는 integrate-preflight의 일이고, 착지 답에서 한 번 재고
        preflight에서 또 재면 내 턴 하나가 중복 심사에 쓰인다. 착지에서는
        「이 회차에 줄을 세울 것인가」만 답한다.
      - 침묵 판독: 워커가 오래 조용하면 추측하거나 바로 묻지 말고 먼저
        런 상태를 읽는다 — claunch cflow status -t <세션> --json (상세는
        claunch cflow journal -t <세션> -n 20). waiting_approval/
        waiting_selection = 사람 게이트 대기: 대신 넘지 말고 사용자에게
        선택지+권고안으로 에스컬레이션한다. 같은 step 장기 체류 = 직접
        물어 개입·재브리핑. 런 소멸·세션 exited = 확인 후 재배정.
        cflow CLI는 읽기(status/journal/asks)만 쓴다 — approve/select/
        goto/abort는 사람의 문이다(자기 게이트든 워커 게이트든 금지).
        게이트 앞에서는 대기가 프로토콜이고, 이탈 경로는 워크플로의
        on_decline/timeout이 이미 정해 두었다
      - 규칙 충돌 조정: 두 세션이 같은 정본 규칙을 다르게 정하려 하면
        근거를 대조해 단일 규칙으로 확정한다 — 합의 인증 전에 실제 근거를
        심사한다(한쪽이 끝내려고 접은 합의는 합의가 아니다). 확정본이 가는
        곳은 `--type doc` 이슈다(공용 규약·판정식·기준선마다 하나, assignee
        없음): 새로 세우거나 그 이슈에 코멘트로 쌓고, 메시에는 그 id와 무엇이
        바뀌었는지 한 줄만 낸다. 규칙 전문을 브로드캐스트하지 않는 이유는
        둘이다 — 본문이 수신자 수만큼 곱해지고, 나중에 합류한 워커에게는
        아예 닿지 않아 규칙이 회차와 함께 사라진다. 내가 승인한 예외도 같은
        자리에 산다: 그 워커의 이슈에 코멘트로 박아 두지 않으면, 나중에 낸
        넓은 공지가 내가 직접 승인한 예외와 충돌하고 **규칙을 지키려는
        워커일수록 그 충돌을 정면으로 맞는다**
      - 일감 등록(리더 손에 들어온 것만 — 워커 터미널로 간 지시는 그
        워커가 만든다): 사용자가 준 목표, 후보로 떠오른 것, 워커가 메시로만
        넘긴 인수인계·발견은 컨텍스트에 두지 말고 그 자리에서 이슈로 만든다
        — `claunch beads create "<제목>" --priority <P> --labels <user|leader>
        --description "<규격>"`. 규격·우선순위 검토를 마치면 `claunch beads
        update <id> --status in_ready`로 후보 풀에 올린다. 배정은 그 뒤
        `claunch beads update <id> --assignee <세션>`이 마지막이고, spawn의 context에
        `issue: <id>`를 싣는다(워커는 show로 읽는다). 사람 게이트에 걸린
        이슈는 `update <id> --status blocked` + `comments add <id> "BLOCKED:
        <게이트>"`, 풀리면 되돌린다.
      - 증거 수합: 통합 대기 표는 보드다 —
        `claunch beads list --status in_review --json` 한 번이 표 전체다.
        워커의 `LANDING REQUEST @ <tip>` 코멘트가 표의 행이고 증거 묶음
        (브랜치·tip·해시·수치·양방향 diff·포함 관계·심사 한계)이 그 안에
        있다. 워커 수치는 간소화 스위트 기준이다.
        **착지 큐**: 표의 행과 짝을 이루는 이 런의 상태다. 워커가 요청을
        올리면 데몬이 그 이슈를 `landing_queue`에 자동으로 등록하므로(페이로드의
        `landing_queue`, 도구 `landing_queue`로 목록) 「누가 요청했고 무엇이
        아직 안 실렸나」를 기억으로 들고 있지 않는다. 판정을 내리면 그
        자리에서 기록한다: 이번 회차에 태우기로 했으면 `waiting`, 다음
        회차로 미루면 `deferred`(회차가 끝날 때 requested로 이월된다),
        거절했으면 `rejected`. landed는 데몬이 git으로 표시한다 — 손으로
        적지 않는다. 회차 시작 블록이 지난 회차 끝에서 버린 것과 이월한
        것을 알려 주므로, 이월된 항목은 이번 회차의 표에서 먼저 본다.
        큐와 보드가 어긋나면(큐에는 requested인데 보드에서는 closed 등)
        그 블록에 경고 줄이 붙는다 — 보드가 일감의 정본이므로 보드를
        기준으로 확인하고 큐 항목을 옮긴다.
        **배치 행**: 같은 tip을 가리키는 `LANDING REQUEST @ <tip>` 행이
        여럿이면(주 이슈의 마커에 `batch: <id,...>`, 나머지에 `(batch of
        <주 이슈>)`) 그것은 워커 하나가 큐의 일감 여럿을 한 브랜치에 실은
        것이고 **브랜치 하나 = 후보 하나**다. 묶음은 주 이슈 코멘트에만
        있다. 행 수로 후보 수를 세지 않고, 심사·머지는 한 번이며, 닫기는
        assignee가 이슈마다 한다 — 리더가 대신 닫지 않는다.
        **PR 행**: 마커에 `pr: <url>`이 붙은 행(`LANDING REQUEST @ <tip> pr:
        <url>`)은 improv-worker-remote가 올린 후보다 — 브랜치는 원격에
        push돼 있고 그 tip을 가리키는 PR이 열려 있다. 표에서의 자리·증거·
        심사는 로컬 행과 같고, 다른 것은 머지 명령뿐이다(통합 단계의 「PR
        후보」 절). 그 한 조각이 두 경로를 가르므로 url을 빼고 옮겨 적지
        않는다. 표를 읽을 때 `gh pr view <url> --json state,headRefOid`로
        PR이 OPEN이고 headRefOid가 마커의 tip과 같은지 본다 — 다르면 요청이
        아니라 push가 덜 된 것이므로 워커에게 pr-open 재실행을 nudge한다.
        **표를 먼저 읽고 코멘트는 골라서 당긴다** — 여섯 줄을 다 펼치는 것은
        메시지로 받던 때와 같은 값을 치르는 것이다. 무엇을 당길지는 워커
        nudge의 값 한 줄(착지 델타, 미해결 한계 유무)이 정한다: 한계가
        있다고 적혔거나 델타가 예측과 어긋나면 그 이슈의 코멘트를 열고,
        나머지는 표의 행만으로 줄을 세운다.
        수치를 옮겨 적을 때는 (트리 해시, 축, 값)과 시작 시각을 함께 적는다
        — 축을 빼면 서로 다른 축의 수가 섞여 다음 사람이 엉뚱한 차이를
        얻는다. 메시지로만 오고 보드에 없는 완료 보고는 표에 없는 것이다 —
        그 워커에게 in_review 전이와 묶음 코멘트를 요구한다(리더가 대신
        만들지 않는다). 반대로 코멘트만 있고 nudge가 안 온 것은 표에는
        있으므로 심사한다 — 침묵은 요청의 결격이 아니다.
      - 분기 심사: 통합 대기로 올릴 때 master와의 분기(뒤처짐)를 함께
        재고, 뚜렷하게 벌어진(충돌 위험·큰 격차) 브랜치는 대기에서 분리해
        워커에게 rebase 후 재요청을 보낸다 — 만날 수 없는 기준선 위의
        브랜치가 통합 심사까지 오지 않게 한다.
        **이 단계를 떠나는 select의 reason에는 통합 후보 이슈 id 목록과
        id마다 증거 한 줄(브랜치·tip·수치)을 싣는다** — 표의 본체는 보드에
        있고, reason은 그 회차에 무엇을 심사했는지의 저널 기록이다. 관제
        대기는 select 단계라 report가 거부되고, 거절 때마다 다시 들어오므로
        통합 시도 1회당 기록 하나가 저널에 쌓인다
      - 스윕 배치: **관제 대기에서 전체 스윕을 시키지 않는다.** 전체 스윕이
        도는 자리는 통합 창 하나에 한 곳뿐이다 — 이 회차의 배치를 심사하는
        integrate/sweep이다. 이 자리에서 "전체 스윕이 필요하다"로 읽히는
        사건 셋은 전부 그 배치로 흘려보낸다:
        · 통합 대기가 쌓였다 → 그것은 스윕의 방아쇠가 아니라 **integrate의
          방아쇠**다. 여기서 따로 쓸면 같은 배치를 두 번 쓴다
        · 워커가 전체 확인을 요청했다(improv-worker의 표적 초록을 못 믿는
          세 경우) → 요청 하나에 스윕 하나를 붙이면 그것이 정확히
          **브랜치당 스윕**이고, 창이 막으려던 비용이 그대로 돌아온다.
          그 워커의 이슈에 `SWEEP REQUESTED: <이유>` 코멘트가 서 있으므로
          이번 배치의 스윕이 그 요청의 답이다 — close 사유에 그 수치를
          적으면 요청은 답해진 것이다. 요청이 창을 앞당기지도 않는다
        · 파급이 넓은 커밋이 보인다 → 그 커밋도 배치에 실려 있다. 배치에
          없다면 아직 아무것도 착지하지 않은 것이고, 착지하지 않은 것에
          대한 스윕은 판정이 아니다
        예외는 하나다: **master가 지금 빨갛다고 의심될 때**(직전 배치의
        스윕 이후 누군가 master를 움직였다) — 그때는 지금 서빙되는 트리에
        대한 판정이 없는 것이므로 subagent를 하나 spawn해 tip을 쓸린다.
        그 밖에는 이 단계에서 spawn하는 subagent에 전체 스위트를 담지
        않는다.
      - 지시는 ONE batch send(--section 워커별)로, 전원 공지는 정말 전원에게
        해당할 때만 '*'로. 그리고 리더의 말수는 그 자체가 관제 비용이다 —
        메시는 전원의 터미널에 타이핑되고, 답을 부르는 타입으로 n명에게
        보내면 답장 n개가 따라온다. 회차당 리더 발신 한두 개를 기준으로
        삼고, 넘어가면 아래 넷 중 무엇을 어겼는지 먼저 본다:
        · 기본 타입은 fyi다. say/ask는 그 답이 없으면 내 다음 행동이
          정해지지 않을 때만 쓴다 — 워커는 침묵을 미수신으로 읽도록
          브리핑돼 있어서, 답을 기대하는 타입은 답장을 의무로 만든다
        · 수신자는 그 내용으로 행동해야 하는 세션만이다. 알아두면 좋은
          것과 움직여야 하는 것을 같은 메시지에 싣지 않는다
        · 판정·규칙·발견은 보드에 적고 메시지에는 이슈 id만 싣는다.
          메시지에만 있는 판정은 다음 회차에 없다 — 컨텍스트가 잘리면
          같이 사라지고, 그 자리를 발견한 워커가 대신 이슈를 세우게 된다
        · **예외를 승인했으면 그 이슈에 코멘트로 박는다**(무엇을·누구에게·
          어느 ask에서). 예외는 1:1 메시지에 살고 일반 규칙은 브로드캐스트에
          사는데 둘이 같은 화면에 안 뜬다 — 그래서 나중에 낸 넓은 공지가
          내가 직접 승인한 예외와 충돌하고, **규칙을 지키려는 워커일수록
          그 충돌을 정면으로 맞는다.** 전원 공지를 내기 전에 in_review
          목록의 코멘트를 훑으면 예외가 한 화면에 모인다. 반대 방향도
          같다: 필터·정리·일괄 처리를 돌리기 전에 그 목록을 먼저 본다
        · 워커의 추론이 좋았다는 논평은 조율이 아니다. 채택했으면 무엇을
          채택했는지 한 줄, 틀렸으면 무엇이 틀렸는지 한 줄이다
      - 채팅으로 잠금을 구현하지 않는다: 공유 자원(테스트 창, 스윕
        basetemp, 라이브 서버)의 순번을 착수·종료 선언의 왕복으로 돌리면
        참가자 수에 비례해 메시지가 늘고, 한 명이 조용히 멈추면 줄 전체가
        선다. 테스트 측정은 `claunch window status`가 보여 주는 데몬 상태와
        `tools/sweep.py run`·`tools/changed_tests.py`의 자동 획득을 사용한다.
        다른 공유 자원도 보유자·시작 시각을 양쪽이 읽을 수 있는 상태로
        두고, 메시지는 그 상태가 바뀐 뒤의 통지로만 쓴다. 리더가
        릴레이로 사이에 서 있으면 먼저 connect로 직결부터 뚫는다 — 다만
        지시가 곧 배선은 아니므로, '서로 직접 내라'고 적기 전에 그 링크가
        실제로 enabled인지 확인한다(끊긴 사슬은 양쪽이 규약을 지켰다고
        믿는 채로 조용히 멈춘다)
      - 토폴로지 관리(리더 self-decision — 사용자 지시를 기다리지 않는다):
        두 워커 사이를 내가 두 번째로 중계하고 있거나 둘이 같은 파일·함수·
        계약을 만진다고 알려 오면 mesh-wire 스킬(connect 도구)로 직접
        연결한다. 한 파일·모듈·화면에 워커가 3명 이상 붙었거나 통합 큐가
        같은 영역 브랜치로 직렬화되면 mesh-delegate 스킬로 그 영역의 중간
        워커를 workflow: improv-mid로 spawn하고 해당 워커들을 reparent
        도구로 그 밑에 옮긴다 — 중간 워커는 자식들의 통합 요청을 스택
        PR(stacked pull request)로 처리한다: 자기 브랜치가 스택 베이스,
        자식 브랜치는 기준(베이스 또는 선행 자식)을 두고 순서대로 하나씩
        --no-ff 착지, 착지마다 남은 자식에게 restack 공지, 완결되면 스택
        전체를 브랜치 하나로 내게 통합 요청한다. 옮긴 워커에게는 부모와
        통합 대상 브랜치(스택 베이스)가 바뀌었음을 batch send로 알린다
        (그 워커의 브리핑은 여전히 나를 부모로 적고 있다). 그 밖의 트리
        재편 — 스택이 착지한 중간 워커의 자식을 내 밑으로 되돌리기, exited
        부모 밑에 남은 산 자식 입양, 워커를 그 작업이 속한 층으로 이동,
        효과 없는 위임 해제 — 은 mesh-retopology 스킬(reparent 도구)의
        절차대로: 옮기기 전에 그 세션의 런 위치를 읽고, 옮긴 뒤 batch
        send로 새 부모·통합 대상 브랜치를 알리고, 보드의 --parent를 맞춘다
      이 단계를 떠나는 방아쇠는 스스로 관측할 수 있는 사실이다: 통합 대기
      브랜치가 하나 이상이고 그 증거(브랜치·커밋 해시·테스트 수치·양방향
      diff)가 다 찼으면 곧바로 integrate를 고른다. 사람이 통합을 지시하기를
      기다리지 않는다 — 이 대기도 다음 단계 integrate의 게이트도 사람을
      지나지 않는다: 머지는 리더의 self-decision이며, master를 지키는
      방어는 머지 뒤 스윕 단계의 전체 스윕 verify와 이 저널 기록이다.
      한가하다는 이유로 회차를 닫지는 않는다.
      ── 통합 창(배치) ──
      integrate 옵션에는 interval(300초)이 걸려 있다: 직전 통합(그 옵션을
      마지막으로 택한 시각, 회차를 넘어 기억된다)에서 5분이 지나지 않았으면
      엔진이 선택을 거절하지 않고 **보류**한다 — status가 waiting_window로
      바뀌고 opens_at이 실린다. 그러면 턴을 끝내고 기다린다(폴링하지 않는다):
      창이 열리면 데몬이 확정해 integrate-preflight로 옮기고 이 터미널을
      깨운다(데몬이 없으면 그 시각 이후의 next 호출이 확정한다). 보류 중에도
      관제는 그대로 계속한다 — 새 후보가 in_review에 오르면 같은 옵션으로
      select를 다시 불러 reason(이슈 id 목록과 증거)을 갱신한다; 확정 시
      저널에 남는 것은 마지막 reason이다. 교대 종료 지시가 오면 wind-down을
      고르면 보류가 취소된다. 첫 통합은 기다리지 않는다(잴 직전이 없다).
      태스크 하나마다 머지하지 않는다 — 창 하나에 모인 후보가 한 배치다.
    select:
      # chooser: agent인 문은 엔진이 "에이전트가 일하는 중"으로 읽는다 —
      # 대시보드 버튼도, 사람에게 가는 런 이벤트도 없다. 그러므로 여기 조건은
      # 사람의 지시가 아니라 에이전트가 관측할 수 있는 사실이어야 한다.
      # 사람의 지시를 조건으로 걸면 아무도 모르는 채 런이 멈춘다(증거 다 찬
      # 브랜치를 세워 둔 채 90분 정차한 사고가 이 규칙의 출처다).
      prompt: |
        어느 사건이 발생했는가? 증거가 다 찬 통합 대기 브랜치가 하나라도
        있으면 지체 없이 integrate를 고른다(사람의 지시를 기다리지 않는다 —
        머지·반영은 리더 self-decision이고 방어는 스윕 단계의 verify가
        받는다). 직전 통합에서 5분이 안 됐으면 엔진이 그 선택을 창이 열릴
        때까지 보류한다(waiting_window) — 그 사이 후보가 늘면 같은 옵션으로
        다시 골라 reason을 갱신한다. 그런 브랜치도 교대 종료 지시도 없으면
        이 단계에 머물러 관제를 계속한다. master가 움직인 것을 알릴
        때는 그 통지가 「이 해시로 잰 수치는 낡았다」 하나만 뜻하게 한다 —
        아직 착지 요청을 올리지 않은 세션에게 재정렬을 요구하지 않는다
        (claunch-no-premature-rebase-lhcz).
      chooser: agent
      options:
        integrate:
          description: 통합 대기 브랜치의 증거가 찼다 — 리더 self-decision으로 머지 심사로(직전 통합에서 5분이 지나야 열린다)
          next: integrate-preflight
          # 통합 창: 이 옵션은 5분에 한 번만 지나간다. 안에서 고르면 엔진이
          # 보류했다가(waiting_window) 창이 열릴 때 데몬이 확정한다 — 태스크
          # 하나마다 머지·스윕하지 않고 창에 모인 후보를 한 배치로 통합한다.
          # 사람이 CLI/대시보드로 확정하면 창과 무관하게 지나간다(오버라이드).
          interval: 300
        wind-down:
          description: 사용자가 교대 종료를 지시 — 종료 승인 게이트로
          next: wrapup

  integrate-preflight:
    title: 통합 전 점검 (누가 이 트리에 서 있는가)
    instructions: |
      머지와 스윕은 이 체크아웃에서 일어난다 — 다음 단계에서 그 둘을
      실행하는 것은 리더가 아니라 spawn된 subagent지만, subagent가 서는
      트리도 바로 이 트리다. 대리 실행이 트리를 하나 더 만들어 주지는
      않으므로 이 점검은 여전히 리더의 일이다. 그 사이 다른 세션이 같은
      트리에 서서 편집하거나 브랜치를 바꾸면, 스윕은 네가 심사하려던
      트리에 대한 판정이 아니게 되고 머지는 남의 작업 위에서 일어난다.
      착수 전에 누가 서 있는지 확인하고 그 결과를 보고에 적는다:

          claunch cflow checkout

      peers가 이름과 함께 나오면 **그 이름을 보고에 그대로 적는다.**
      이 명령은 벽이 아니다 — 항상 exit 0이고, 진행 여부는 다음 단계에서
      리더가 증거에 근거해 self-decision으로 정한다. 네가 옮길 권한이 없는
      세션(다른 서브트리의
      것) 때문에 통합이 영구히 막히면 그 문은 첫날에 우회되고, 우회되는
      문은 없는 문이다. 이 점검의 값은 **막는 것이 아니라 모르고 지나가지
      못하게 하는 것**이다.

      측정 창 상태도 여기서 확인한다: `claunch window status`. 실제 전체
      스윕은 통합 프리뷰를 맡은 subagent가 `tools/sweep.py run`으로 실행하며,
      이 명령이 sweep 창을 획득하고 종료 후 해제한다. 워커의 표적 실행은
      `tools/changed_tests.py`가 targeted 창을 획득한다. 보유자·대기열은 데몬
      상태이므로 착수·종료 메시지로 순번을 구성하지 않는다. 이 단계의 status
      출력은 기존 보유자와 대기 유무를 보고에 남기는 진단 값이다.

      ── 통합 후보의 분기 심사 (재요청은 두 갈래다) ──
      PR 워크플로우처럼 「너무 차난(뒤처진)」 후보는 머지 문에 오르지
      않는다. 손으로 재지 않는다 — 워커의 정렬 단계 게이트가 부르는 것과
      **같은 스크립트**를 후보마다 부른다. 같은 명령이어야 워커가 통과시킨
      것을 여기서 되돌리는 일이 안 생긴다:
        uv run --no-sync python tools/merge_ready.py --branch <branch> --target master --checkout --allow-target-advance
      종료 코드가 판정이다:
      - 0 ready — 통합 후보다(대상이 이미 그 브랜치에 들어 있거나, 프리뷰
        머지 위 재측정이 끝나 있다)
      - 3 rebase — 미리 병합이 텍스트로 충돌한다. 재정렬 말고는 길이 없다.
      - 1 re-measure — 대상은 움직였지만 병합은 깨끗하고, 이전 프리뷰가
        없거나 프리뷰→착지 diff의 파일 목록·stable patch-id가 대상 이동분과
        다르다. 프리뷰 체인이 있으며 두 대조가 같으면 대상 이동은 정상이고
        0 ready로 통과한다.
        대상·후보 변경 파일은 반드시 각 merge-base에서 `git diff --name-only
        <merge-base>..<tip>`으로 읽는다. 양방향 `target..<branch>`는 후보가
        만진 파일 목록이 아니다. 전체 스윕 실패가 있으면 실패 테스트가 import
        하는 모듈과 파일 교집합을 먼저 보고, 겹치면 함수 단위까지 확인한다.
      - 2 cannot tell — 판정 불가. 「아니다」로 읽지 말고 무엇이 안 읽혔는지
        먼저 본다.
      - 4 dirty checkout — 브랜치 쪽은 준비됐는데 **머지가 일어날 워킹
        트리가 그 머지를 거절한다.** git이 머지를 시작하기 전에 거절하는
        경우가 둘이다: 그 머지가 쓰는 파일에서 트리가 더럽거나, **그
        트리의 인덱스에 staged된 변경이 하나라도 있거나**. 뒤엣것은
        경로를 가리지 않는다 — `--no-ff` 머지는 인덱스 전체가 HEAD와
        같기를 요구하므로, 병합이 만지지도 않는 파일이 staged면 그것이
        머지를 거절시킨다. 같은 변경이 staged되지 않고 작업 트리에만
        있으면 머지는 그대로 돈다(git 2.48.1 실측, 보드
        `claunch-tsh7`).
      ── --checkout 은 리더 경로에서만 켠다 ──
      `--checkout`은 워커가 부르는 명령에 없고 여기에만 있다. 위의 「같은
      스크립트」는 여전히 지켜진다 — 브랜치와 대상의 관계를 재는 계산은
      한 글자도 다르지 않고, `--checkout`은 **워커가 답할 수 없는 축**을
      하나 더 물을 뿐이다. 기본으로 꺼져 있는 이유가 그것이다: 같은
      스크립트가 워커의 정렬 게이트이고 **워커의 워크트리는 작업 중이라서
      더럽다.** 켜 두면 제 일을 하는 워커마다 4가 나온다.
      값 없이 그냥 `--checkout`이면 대상 브랜치가 체크아웃돼 있는 워크트리를
      git에게 물어 찾는다(`--checkout <경로>`로 직접 대도 된다). 경로를
      기억해 적는 쪽이 낡는다 — master는 체크아웃 사이를 옮겨 다니고,
      통합 브랜치는 아무 데도 체크아웃돼 있지 않은 때가 많다.
      ── 4가 나오면 ──
      **그 브랜치에 재요청을 보내지 않는다.** 재정렬도 재측정도 이것을
      고치지 못한다 — 막고 있는 것은 그 브랜치가 아니라 그 트리의 미커밋
      변경이고, 대개 다른 세션이 쓰는 중인 작업이다. 게이트 출력이 겹치는
      파일 이름을 그대로 낸다.
      **남의 미커밋을 stash·checkout·reset으로 치우지 않는다.** 그 세션에
      지시할 수 있는 것은 사용자뿐이다. 할 일은 둘이다: (1) 소유 세션이 내
      로스터 안이면 정리를 요청한다, (2) 밖이면 사실과 겹치는 파일 목록을
      값으로 사용자에게 올린다(선택지: 기다린다 / 통합 브랜치에 쌓고 트리가
      깨끗해질 때 한 번에 올린다 / 사용자가 그 세션을 정리한다).
      1이나 3이 나온 후보에서도 이 소견은 출력에 붙는다(`also, the working
      tree this merge would run in:`) — 트리를 치우는 데는 사람이 필요해서
      가장 느리므로, 브랜치 쪽이 준비될 때까지 미루지 않고 지금 읽는다.
      **이 검사가 있기 전에 이 자리가 두 회차 연속으로 물었다**(보드
      `claunch-merge-ready-dirty-checkout-7w7g`): 게이트는 두 번 다 0이었고
      두 번 다 사람이 `git status`를 따로 돌려서 발견했다.
      ── 원인이 남의 staged 변경이면 ──
      게이트 출력에 `and N staged entry(ies) the merge does not write`가
      붙어 있으면 막고 있는 것은 **병합과 무관한 파일**이다. 그 목록을
      머지 diff에서 찾지 마라 — 거기 없다. 인덱스가 HEAD와 다르다는 것이
      전부이고, 그것만으로 git은 머지를 시작하지 않는다.
      이 종류는 **시간이 지나면 풀린다.** 붙잡고 있는 세션이 커밋하거나
      되돌리면 사라지고, 그 순간 같은 후보가 그대로 얹힌다. 그러니 할 일은
      그 세션과 조정하는 것이지 **stash·`checkout --`·reset·clean으로
      밀어붙이는 것이 아니다** — 밀어붙이면 남의 작업이 없어진다.
      23회차에 실제로 이 자리를 만났다(보드 `claunch-tsh7`): 머지 세션
      s394가 s390-codex-enter를 얹으려 했고, 그때 s391이 인덱스에 staged해
      둔 `src/claude_launcher/workflows/errand.yaml`과
      `tests/test_cflow_errand.py`가 막았다. 밀어붙이지 않았기 때문에
      s391의 작업이 살았고, 그 커밋들이 착지해 인덱스가 정리되자 같은
      머지가 깨끗하게 얹혔다(46fa3102).
      **거리만으로 되돌리지 않는다.** behind가 0이면 master ⊆ 그 브랜치라
      --no-ff 머지는 텍스트로 충돌할 수 없고, 그때 거리를 이유로 재정렬을
      요구하는 것은 빈 요구다 — 요구한 만큼 리뷰어가 승인한 tip이 바뀐다.
      거리를 굳이 강제 근거로 쓰려면 숫자를 대라: `--max-behind N`이 그
      자리이고, 기본은 꺼져 있다.
      **「충돌 없음」도 통과 조건이 아니다.** merge-tree가 조용한 것은 텍스트가
      안 겹쳤다는 말이지 합쳐서 돈다는 말이 아니다. 이 저장소의 실례가
      90a07a9다 — 한 브랜치가 tools/ 게이트 전부에 sys.path 규칙을 세우는
      동안 master가 그 규칙을 안 지키는 다섯째 게이트를 들여왔다. 서로 다른
      파일이라 merge-tree는 깨끗했고, 합친 트리는 빨갰다. 그래서 behind > 0
      이면 충돌이 없어도 재측정을 요구한다.
      ── PR 후보 ──
      마커에 `pr: <url>`이 붙은 후보는 같은 게이트를 같은 인자로 지난다 —
      먼저 `git fetch <remote>`(원격 이름은 `git config --get
      claunch.pr.remote`) 뒤, 브랜치가 이 저장소의 워크트리에 있으면 로컬
      이름으로, 다른 머신의 워커면 `--branch <remote>/<브랜치>`로 부른다.
      대상은 여전히 master다: PR의 base는 원격 base 브랜치이고 그것은
      master의 push 사본이어야 하므로, `git rev-list --count
      <remote>/<base>..master`를 함께 재어 0이 아니면 그 수를 보고에 적는다
      — 통합 단계가 머지 전에 base를 push한다(워커는 base를 움직이지
      않는다). 그리고 `gh pr view <url> --json state,headRefOid,mergeable`로
      PR이 OPEN이고 headRefOid가 마커의 tip과 같은지 본다 — 다르면 게이트
      결과와 무관하게 후보가 아니다(워커의 pr-open이 덜 됐다).
      두 갈래는 요구가 다르므로 마커도 다르다. 어느 쪽이든 그 브랜치는 이번
      머지에서 빼고 `claunch beads update <id> --status in_progress` 뒤에:
      - 3이면 `comments add <id> "REBASE REQUESTED: master @ <hash>"`
      - 1이면 `comments add <id> "REMEASURE REQUESTED: master @ <hash>"` —
        재정렬을 요구하는 것이 아니다. 워커가 대상 tip 위에 프리뷰 머지를
        만들어 그 위에서 표적을 다시 재고 ref를 남기면 그것으로 갈음된다
        (게이트가 그 ref의 두 부모를 보고 0으로 답한다). 재정렬을 택하는
        것도 워커의 자유지만, 요구는 수치이지 재정렬이 아니다.
      메시로 보내는 것은 어느 마커가 붙었는지 가리키는 nudge 한 줄이다.
      워커 세션이 이미 끝났으면 사용자에게 respawn(claunch respawn)으로
      되살려 재요청을 이어가게 할지 알린다. 뒤처진 기준선을 master에 조용히
      얹지 않는다 — 게이트가 0으로 답하는 브랜치가 다시 심사에 오른 뒤 머지다.
    done_when: |
      claunch cflow checkout의 결과(peers 유무와 이름, 또는 확인 불가
      사유)가 보고에 있고, `claunch window status`의 보유자·대기 수가 함께
      있다.
      후보마다 merge_ready.py의 종료 코드와 그 `--checkout` 소견(겹치는
      파일이 있으면 그 이름들, 없으면 「몇 개 중 0개」)이 보고에 있다.
    next: integrate

  integrate:
    title: master 통합 (--no-ff)
    ask:
      # from 없음 + otherwise: self = 순수 사용자 게이트의 폐지. 리더가 수합
      # 표를 근거로 self-decision으로 통합을 진행한다 — 엔진은 이 문을
      # 'self'(unanswered)로 저널에 남기고 진행을 허가한다. master를 지키는
      # 방어는 사람 문이 아니라 머지 후 전체 스윕 verify와 이 저널 기록이다.
      # 스스로 합격이 아니라고 판정하면 이 스텝으로 들어가지 않는다(prompt의
      # 기준에 따라 관제 대기로 돌아간다).
      prompt: |
        지금 통합 대기인 브랜치의 수합 표 — 범위·브랜치·커밋 해시·테스트
        수치 — 는 관제 대기를 떠난 select의 reason에 실려 저널에 있다
        (select_confirmed 기록, 통합 시도 1회당 하나; 창에 보류됐다 풀린
        선택이면 by: window이고 reason은 보류 중 마지막으로 갱신한 것이다).
        보고 요약이 아니라
        그 표를 근거로 이번 통합을 self-decision으로 합격 판정한다. 증거가
        빈 브랜치가 하나라도 있으면 합격하지 않고(머지 없이) 관제 대기로
        돌아간다. 게이트가 0으로 답하지 않은 브랜치는 preflight에서
        재요청으로 빠졌다 — 충돌이면 rebase, 기준선이 움직였을 뿐이면
        재측정, 두 갈래다. 대상은 남은 후보들만이다. preflight가 이
        체크아웃에 서 있는 다른 세션을 보고했다면, 그들이 서 있는 채로
        스윕·머지를 진행할지 판정하고 그 사실을 이 저널 기록에 담는다.
        합격 판정과 함께 master --no-ff 머지를 진행한다 — 판정은 리더의
        것이고, 그 머지를 실제로 실행하는 것은 리더가 spawn하는
        subagent다.
      otherwise: self
    instructions: |
      지금 대기 중인 것을 통합한다 — 보통 브랜치 하나, 스윕이 도는 동안
      쌓였으면 여럿이다. 수를 채우려고 기다리지 않는다.
      머지 전에 수합 표를 워커 저널과 대조한다 — claunch cflow journal -t
      <세션> 으로 각 워커의 완료 보고를 읽어, in_review 전이 누락으로 표에서
      빠진 브랜치가 없는지 확인한다(표는 보드에 쌓이고 저널이 그 검산이다 —
      커밋까지 해 놓고 전이를 빠뜨린 워커는 보드에 아무 흔적이 없다).
      그리고 토폴로지를 명령으로 확인한다:
      - 브랜치 간 포함 관계(git branch --contains) — 한 브랜치가 나머지를
        모두 포함하면 그 하나만 머지하고, 아니면 차례로 머지한다
        (대기가 하나면 이 확인은 한 줄로 끝난다 — 생략하지는 않는다)
      - 배치(in_review 행 여럿이 같은 tip을 가리키는 것 — 관제 대기의
        「배치 행」)는 --no-ff 한 번으로 머지하고, 머지 통지에는 실린
        이슈 id를 전부 적는다 — assignee가 이슈마다 그 해시로 닫는다
      - git log master..<branch> / <branch>..master 로 양방향 차이를 확인.
        배치가 둘 이상이면 **머지할 때마다 master가 움직이므로 뒤에 선
        후보는 배치 안에서 낡는다** — preflight의 판정은 배치 시작 시점의
        것이다. 그래서 각 머지 직전에 그 후보에 대해 게이트를 한 번 더
        부른다: `uv run --no-sync python tools/merge_ready.py --branch
        <branch> --target master --checkout --allow-target-advance`. 3(충돌)이면 그 브랜치는
        머지하지 않고 preflight의 재요청 규칙으로 되돌린다 — 충돌 트리를
        master에 강제로 얹지 않는다. 1(재측정)이면 남은 후보를 먼저
        머지하고 이 브랜치는 재측정 요청으로 되돌린다.
        4(dirty checkout)이면 **그 브랜치가 아니라 머지가 일어날 트리가
        막고 있다** — 그 후보를 머지하지 않되 재요청도 보내지 않는다
        (재정렬도 재측정도 이것을 못 고친다). preflight의 「4가 나오면」
        절이 할 일을 말한다. 여기서 `--checkout`을 빼지 마라: 배치 안에서
        움직이는 것은 master만이 아니고, 이 자리가 머지 직전의 마지막
        측정이다.
      - 중간 워커(improv-mid)의 브랜치는 스택 하나가 후보 하나다: 요청에
        실린 스택 표(순서·자식 브랜치·기준·머지 해시·수치)를 git branch
        --merged <브랜치>로 검산하고 --no-ff 한 번으로 머지한다 — 그 안의
        자식 브랜치를 따로 머지하지 않는다. 뒤처짐·충돌로 재요청을 보낼
        때 중간 워커는 --rebase-merges로 재정렬(restack)한다 — 보통의
        rebase는 스택의 머지 커밋을 평탄화하므로, 재요청에 그 사실을 적는다
      ── PR 후보의 머지 (같은 배치, 다른 명령) ──
      preflight를 0으로 지난 PR 행(`pr: <url>`)은 로컬 후보와 같은 순서·같은
      배치에 선다. 다른 것은 머지를 실행하는 명령과 그 앞뒤의 base 동기화
      두 줄이고, 셋 다 subagent가 실행하고 리더가 되확인한다:
      1. **base를 먼저 맞춘다.** `git rev-list --count <remote>/<base>..master`가
         0이 아니면 `git push <remote> master:refs/heads/<base>` — PR의 base가
         master의 push 사본이어야 GHE가 만드는 머지 커밋의 트리가 로컬
         --no-ff 머지의 트리와 같다(프리뷰 스윕이 그 트리를 쓴다). 이 push는
         리더의 자기 판단 범위다(사용자 결정, 2026-09-11) — 단 그 증거는
         fast-forward다: `git merge-base --is-ancestor <remote>/<base> master`가
         0일 때만 push한다. 0이 아니면 원격 base에 로컬 master에 없는 커밋이
         있다는 뜻이고(누군가 원격에 직접 올렸다), 그것은 push로 덮을 일이
         아니라 사용자에게 올릴 일이다 — 이 PR 후보는 이번 배치에서 빼고
         이유를 그 이슈에 적는다. `--force`는 어느 경우에도 쓰지 않는다.
      2. **머지는 gh로, tip을 고정해서.** `gh pr merge <url> -R
         <host>/<owner>/<repo> --merge --match-head-commit <tip> --subject
         "<저장소 관례의 한 줄>"` — `--merge`가 merge commit(로컬 --no-ff와
         등가; squash·rebase는 워커의 착지 게이트가 tip을 못 찾는다)이고
         `--match-head-commit`이 리뷰어가 승인한 tip과 다른 것이 올라가
         있으면 거절한다. 원격 브랜치는 지우지 않는다.
      3. **master를 따라 올린다.** `git fetch <remote>` 뒤 master 체크아웃에서
         `git merge --ff-only <remote>/<base>`. 되확인은 `git log -1
         --format=%H%n%P master` — 둘째 부모가 그 tip이어야 한다. 이 ff가
         거절되면(그 사이 로컬 master가 움직였다) 배치를 멈추고 사유를
         보고에 적는다 — 원격과 로컬이 갈린 master 위에 다음 후보를 얹지
         않는다.
      PR 후보 뒤에 로컬 후보가 남았으면 그대로 --no-ff로 잇고, **배치가
      끝나면 한 번 더 `git push <remote> master:refs/heads/<base>`** — 로컬
      머지가 원격 base에 실려야 다음 PR의 diff가 이 배치 이후의 것이 된다.
      머지 통지의 fyi에는 PR url을 해시 옆에 싣는다. 이 절이 없을 때 PR
      후보는 표에 있어도 아무도 머지하지 않았다 — 워커는 base가 자기 tip을
      품기를 기다리고 리더는 로컬 브랜치만 봤다.

      ── 충돌 없음은 안전 판정이 아니다 ──
      git이 조용한 것은 텍스트가 안 겹쳤다는 뜻이지 합쳐서 돈다는 뜻이
      아니다. 한쪽이 지운 심볼을 다른 쪽이 부르거나, 한쪽이 추가한 호출을
      다른 쪽의 스텁·모의가 모르면, 머지는 깨끗하고 각 브랜치는 단독으로
      초록인데 합친 트리가 런타임에 죽는다. 그리고 **충돌 표시가 없다는
      사실 자체가 사람이 볼 지점을 없앤다** — 그래서 이 검사는 사람 눈이
      아니라 기계에 맡긴다:
      - 발동 조건은 「충돌이 보일 때」가 아니라 **「두 브랜치가 같은 모듈을
        만졌을 때」**다. git이 충돌을 보고했는지와 무관하다
      - 심볼 의존은 저장소의 머지 점검 스크립트가 본다(삭제된 정의 ∩ 추가된
        호출, 그리고 추가된 호출 ∩ 상대 스텁 세트의 여집합). 검사 로직을
        여기 옮겨 적지 않는다 — 두 자리에 적으면 갈린다. **명령은 이것이고
        `tools/`가 아니라 패키지 안에 있다**(다른 게이트는 전부 `tools/`에
        있어 여기서 찾다가 없다고 판단하기 쉽다):
          uv run --no-sync python -m claude_launcher.mergecheck <브랜치>...
      - 그 위에 통합 프리뷰(후보 브랜치를 임시 브랜치에 합친 트리)의 스윕을
        돌린다. 임포트만 해도 잡히는 종류가 여기서 걸린다. **이것은 스윕을
        한 번 더 도는 것이 아니라 이 배치의 스윕을 앞당겨 도는 것이다** —
        아래 「프리뷰 스윕이 곧 이 배치의 스윕이다」의 조건을 지키면 그
        영수증이 sweep 스텝의 게이트를 그대로 통과시킨다
      - **어떤 기계도 안 보는 자리를 찾으면 그 사실 자체가 결과물이다.**
        「충돌 0·초록」으로 끝내지 말고, 그 자리를 보는 검사를 만들어
        기계가 보는 곳으로 옮긴다 — 고장난 변형에서 정확히 그 검사만
        빨강이 되는지까지 확인해야 옮긴 것이다

      ── 실행은 subagent, 심사는 리더 ──
      이 단계의 두 실행 — 스윕과 머지 — 은 리더의 턴에서 일어나지 않는다.
      둘 다 subagent를 spawn해 그 안에서 돌린다. 이유는 셋이다: (1) 리더의
      컨텍스트는 관제용이다 — 스윕 출력과 머지 diff가 그 자리를 먹으면
      수합 표·규칙 조정이 밀려난다, (2) 실행과 심사를 갈라 두면 판정
      근거가 「내가 돌려봤다」가 아니라 subagent가 가져온 명시적 수치가
      된다, (3) 실패했을 때 리더가 그 자리에서 트리를 흔들며 고치는 일이
      구조적으로 막힌다. 규칙은 다음과 같다:
      - 한 subagent = 한 일이다. 스윕 하나, 머지 하나 — 둘을 한 과제에
        겹쳐 주지 않는다(겹치면 실패했을 때 어느 쪽이 죽었는지 저널이
        말하지 못한다)
      - 과제에는 대상 트리의 절대경로, 돌릴 명령, 돌려받을 것(합격/불합격,
        수치, 실패 테스트 이름과 첫 실패 줄, 머지면 커밋 해시와 diffstat)을
        박는다. 판단은 위임하지 않는다 — 무엇을 머지할지, 무엇을 이번
        통합에서 뺄지는 리더가 이미 정한 것이고 subagent는 그것을 실행한다
      - **돌아온 것은 산문이다.** 표와 보고에 올리기 전에 값싼 읽기 명령으로
        되확인한다: git rev-parse HEAD / git log -1 --format=%H / git show
        --stat <해시> / git branch --contains. 되확인 없이 「머지됐다」를
        보고에 적지 않는다 — subagent가 실제로 무엇을 했는지 아는 방법은
        그 트리를 읽는 것뿐이다
      - subagent가 실패를 가져오면 리더가 그 자리에서 고치지 않는다. 실패를
        그대로 보고에 적고, 원인이 워커 브랜치면 워커에게 재요청, 재시도가
        필요하면 실패 요약을 실어 새 subagent를 spawn한다
      - 프로젝트 레이어의 verify는 이 규칙의 예외가 아니다. 엔진이 돌리니
        리더의 턴이 아니라는 것은 맞지만, 그렇다고 **거기에 스윕을 걸어도
        된다는 뜻은 아니다** — 엔진은 그것을 스텝을 떠날 때 동기로 돌리므로
        전체 스위트를 걸면 회차가 그 자리에서 막히고, 손으로 친 명령이
        아니라 저널에도 스윕으로 안 남는다. verify에 담는 것은 스윕이
        아니라 **스윕이 돌았는지 보는 값싼 검사**다

      ── 프리뷰 스윕이 곧 이 배치의 스윕이다 ──
      대기가 여럿이거나 충돌 위험이 보이면 머지 확정 전에 subagent에게 통합
      프리뷰(후보 브랜치를 임시 브랜치에 합친 트리)의 스윕을 맡겨 실패를
      미리 걸러낸다. 그러면 master가 아직 깨끗한 동안 「합치면 죽는」 조합을
      잡는다 — 그리고 **그 스윕이 다음 단계의 스윕이 된다**. 배치당 스윕
      1회는 프리뷰를 포기해서가 아니라 프리뷰와 머지 후 스윕이 같은 트리를
      보게 해서 지킨다.
      그러려면 프리뷰를 **머지할 그대로** 짓는다: master tip에서 스크래치
      브랜치를 잘라, 같은 후보를 같은 순서로 --no-ff 머지한다. 그러면
      머지 커밋의 트리 해시가 프리뷰 tip의 트리 해시와 같고(그 사실 자체를
      `git rev-parse <프리뷰>^{tree}` 대 `master^{tree}`로 되확인한다),
      스윕 영수증은 tip sha가 없을 때 같은 트리의 초록을 받아들이므로
      (tools/sweep.py의 find_receipt_by_tree — 어느 sha의 영수증을 딛고
      섰는지 게이트 출력이 말해 준다) sweep 스텝이 다시 쓸지 않는다.
      두 해시가 다르면 그 사이 master가 움직였거나 순서·후보가 달라진
      것이다 — 그때는 프리뷰가 아니라 실제 tip에 대한 스윕을 새로 돌린다.
      프리뷰는 `--branch <프리뷰 브랜치>`로 영수증을 남긴다(스윕은 서 있는
      트리를 판정하므로 그 트리의 브랜치로 적어야 거짓 영수증이 안 된다).
      프리뷰를 건너뛴 배치는 머지 후 sweep 스텝에서 한 번 쓴다. 어느
      쪽이든 **한 창에 전체 스윕은 한 번이다.**
      머지는 반드시 --no-ff, 커밋 메시지는 저장소 관례(한 줄 요약 —
      「무엇을 어떻게」)를 따른다 — 명령과 메시지는 리더가 정해 과제에
      박고, 실행은 subagent가 한다. 배치의 브랜치가 여럿이면 차례로 전부
      머지한 뒤에야 다음 단계로 간다 — 스윕은 배치당 한 번, 머지마다가
      아니다. 머지 결과 트리의 전체 스윕은 이 단계가 아니라 다음 단계
      sweep의 일이다: 여기서는 되확인한 머지 커밋 해시·diffstat(브랜치마다)을
      보고에 남기고, 머지된 각 이슈에 MERGED 코멘트로 해시를 남긴다 —
      이 코멘트가 정본 기록이고, 필요한 사람은 언제든 그 이슈를 당겨
      읽을 수 있다.
      mesh 알림은 그 기록을 대신 실어 나르는 자리가 아니라 대상을
      좁힌 통지 자리다. 대상은 **착지 요청을 올려 in_review 상태인
      세션뿐이고**, 주소는 `@in_review` 하나다(`claunch mesh send
      <메시> @in_review "..."`, MCP send의 `to: "@in_review"`) — 데몬이
      보드에서 in_review 이슈의 assignee를 풀어 명단으로 기록한다. 방금
      머지된 이슈도 assignee가 wrapup에서 닫기 전까지 in_review이므로
      그 세션들도 받는다. 그래서 통지 한 건이 두 답을 싣는다: 새 master
      해시와 이번에 머지된 이슈 id 목록을 적고, **「목록에 자기 이슈가
      있거나 자기 tip이 이미 master에 있으면 착지 통지다(landed로 진행),
      그 밖이면 새 master 위에서 재측정하라(remeasure)」**로 끝맺는다 —
      워커의 await-landing이 그 둘을 그대로 가른다. 「이미 master에
      있으면」을 빼지 않는다: 앞 회차에 머지됐는데 assignee가 아직 닫지
      않은 이슈도 in_review라서 이 통지를 받고, 그 세션의 이슈는 이번
      목록에 없다 — 목록만 보면 착지한 일을 재측정으로 읽는다(143회차
      s753이 그렇게 정렬·리뷰를 다시 돌았다, claunch-dlq0o).
      **머지된 이슈 가운데 보드에서 in_review가 아닌 것**(재측정 재요청
      뒤 워커가 in_review로 되돌리지 않은 in_progress 등)의 assignee는
      선택자가 풀지 못한다 — 그 세션에게는 핸들을 명시한 착지 통지를
      따로 한 건 보낸다(`to: "<핸들>,<핸들>"`, 새 master 해시와 그
      세션의 이슈 id). 명단은 방금 남긴 MERGED 코멘트의 이슈들을
      보드에서 읽어 만든다(143회차 s707/claunch-t80om이 in_progress라
      착지 통지를 받지 못했다, claunch-dlq0o). 대기 프로브가 착지를
      따로 답하는 편성(이 저장소의 프로젝트 레이어: `merge_ready.py
      --landed-exit`)에서는 통지가 빠져도 워커가 프로브 주기 안에
      알게 된다 — 로컬 60초, 원격 120초, 그리고 그 정의가 들어간 뒤에
      시작한 런에 한해서다(런은 시작할 때 읽은 정의로 돈다). 그것은
      뒷받침이고 통지를 생략할 이유는 아니다. 재측정 요청이므로 intent는
      `say`다(fyi로 보내면 받는 쪽이 할 일이 없다고 읽는다). 보낸 뒤 목록
      밖의 in_review 이슈마다 `REMEASURE REQUESTED @ <새 tip>` 코멘트를
      남기고 in_progress로 옮긴다(공통 규칙의 in_review→in_progress) —
      옮기는 것은 보낸 **뒤**다, 먼저 옮기면 선택자가 그 세션을 풀지
      못한다. **최신 요청 tip이 이미 새 master에 있는 이슈는 목록
      밖이어도 이 처리에서 뺀다**: 그 이슈의 마지막 `LANDING REQUEST @
      <tip>` 코멘트의 tip에 `git merge-base --is-ancestor <tip> <새
      master>`가 0을 내면, 앞 회차에 머지됐고 assignee가 아직 닫지 않은
      이슈다. 재측정할 것이 없고, in_progress로 옮기면 착지한 일이 보드에서
      다시 구현 중으로 보인다(claunch-dlq0o). MERGED 코멘트가 있다는
      것만으로는 빼지 않는다 — 한 이슈가 두 번 착지할 수 있다:
      claunch-hik25는 MERGED 052f46ab 뒤 새 tip으로 다시 요청했고,
      그 요청은 재측정 대상이었다(REMEASURE REQUESTED @ b23c525a).
      `@in_review`가 아무도 풀지 못하면(착지 대기가 없다) 데몬이 발송을
      거절한다 — 그것이 답이고, 보낼 곳이 없다는 사실을 보고에 적는다.
      **구현 중인 세션, 착지를 마치고 종료를 기다리는 세션에게는 보내지
      않는다** — 구현 중인 세션은 자기 `rebase` 단계에서 그때의 master로
      다시 판정하므로 지금의 해시는 값이 0이고, 끝난 세션에게는 낡을
      수치가 없다. 파일이 겹쳐도 예외가 아니다(겹치는 둘은 mesh-wire로
      잇는다). **`'*'`는 이 통지에 쓰지 않는다** — `'*'`는 연결된 멤버
      전부에게 가고 수신자마다 턴 하나를 쓴다(138회차 공지: 판정 가능한
      수신자 33명 중 31명이 이미 끝난 세션, claunch-424v4). 데몬은
      `'*'` 발송마다 BROADCAST 경고를 돌려준다.
      재정렬(rebase) 요구는 싣지 않는다 — 재측정은 프리뷰 머지 위에서도
      되고, 재정렬은 워커의 정렬 단계가 고른다
      (claunch-no-premature-rebase-lhcz). 보낼 때 실리는 것은 해시와
      id뿐이다 —
      diffstat과 브랜치별 내역은 각 이슈의 코멘트에 있고, 필요한 사람이
      당겨 읽는다. 이슈는 아직 닫지 않는다 — 스윕 수치가 close 사유의
      절반이다.
    done_when: |
      이번에 승인된 통합 대기 브랜치가 전부 master에 머지되었고(로컬 후보는
      --no-ff, PR 후보는 `gh pr merge --merge --match-head-commit` 뒤 fetch·
      ff-only — 어느 쪽이든 master의 머지 커밋이 그 tip을 둘째 부모로
      갖는다), PR 편성이면 원격 base가 master와 같은 tip이며,
      머지 커밋 해시·diffstat이 보고에 있고 머지된 이슈마다 MERGED
      코멘트가 남았다. mesh 알림은 `@in_review` 한 건으로 나갔고(`'*'`가
      아니다), 새 master 해시와 머지된 이슈 id 목록, 「목록에 있거나 자기
      tip이 이미 master에 있으면 landed, 그 밖이면 새 master 위에서
      재측정」만 실었다(diffstat·내역은 코멘트에 두고 싣지 않았다).
      머지된 이슈 중 in_review가 아니던 것의 assignee에게는 핸들을
      명시한 착지 통지가 따로 나갔다(없었으면 없었다고 보고에 있다).
      목록 밖의 in_review 이슈 가운데 최신 LANDING REQUEST tip이 새
      master의 조상이 아닌 것마다 `REMEASURE REQUESTED @ <새 tip>`
      코멘트가 발송 뒤에 남았고, 그 tip이 이미 master에 있는 것은
      in_review 그대로다.
      선택자가 아무도 풀지 못해 거절됐으면 그 사실이 보고에 있다.
      그 알림에 **재정렬 요구가 실리지 않았다**
      (claunch-no-premature-rebase-lhcz).
      머지는 리더의 턴이 아니라 spawn된 subagent가 실행했고, 보고에 적힌
      해시는 리더가 읽기 명령으로 되확인한 값이다.
    next: sweep

  sweep:
    title: 배치 스윕 (머지 결과 트리 전체 검증)
    ask:
      # 통합과 스윕 사이의 문. 이 정본에서는 리더 self-decision(from 없음 +
      # otherwise: self)이다 — 배치가 닫혔고 master tip이 그 머지임을 리더가
      # 확인하는 자리이지 사람의 승인이 아니다. 다른 자율 cflow 선언은 같은
      # 자리를 다르게 둘 수 있다(from: [{role: reviewer}] 위임이나 사람 게이트)
      # — 문의 위치가 정본이고, 누가 여는지는 선언마다 정한다.
      prompt: |
        master --no-ff 머지가 끝났고 tip이 이번 배치의 머지 커밋이다(git
        rev-parse master 로 되확인한 값). 이 배치의 머지 결과 트리에 전체
        스윕(build+typecheck+전체 스위트)을 돌려 판정하는 단계로 들어간다.
        tip이 기대한 머지 커밋이 아니면(그 사이 다른 세션이 master를
        움직였다) 그 사실을 저널에 담고 지금의 tip을 스윕 대상으로 삼는다 —
        스윕은 실제로 서빙될 트리에 대한 판정이어야 한다.
      otherwise: self
    instructions: |
      머지 결과 트리의 전체 스윕(build+typecheck+전체 스위트)은 워커
      회차마다 돌리지 않은 스윕이 배치당 한 번 여기서 도는 것이다.

      **이미 돌았으면 여기서 또 돌지 않는다.** 앞 단계에서 통합 프리뷰를
      쓸었고 머지 커밋의 트리 해시가 그 프리뷰와 같으면, 이 스텝의 verify는
      그 영수증을 그대로 받아들이고 초록이 된다(같은 트리 = 같은 판정,
      게이트 출력이 어느 sha의 영수증을 딛고 섰는지 말해 준다). 그때
      이 단계가 하는 일은 스윕이 아니라 **보드 마감**이다 — 아래 close와
      chore(beads) 커밋. 배치당 스윕 1회는 이렇게 지켜진다: 프리뷰를 돈
      배치는 여기서 안 돌고, 안 돈 배치는 여기서 한 번 돈다.
      verify가 「no sweep receipt ... and none green for its tree」로
      빨갛다면 그것은 이 트리에 대한 판정이 정말로 없다는 뜻이다 —
      subagent를 하나 spawn해 tip을 쓸린다.

      ★ **스윕은 언제나 spawn한 subagent 안에서 돈다. 예외는 없다** — 리더의
      턴에서도, 이 스텝의 verify로도 돌지 않는다. 한 subagent = 한 일,
      대상 트리의 절대경로·명령·돌려받을 것을 박는다(통합 단계의 규칙
      그대로). 스윕 명령은 저장소마다 다르므로 정본은 명령을 박지 않는다.

      **verify를 스윕으로 쓰지 않는 이유**(이 규칙이 한때 반대였다):
      엔진은 verify를 이 스텝을 떠날 때 동기로 돌린다 — 즉 verify에 전체
      스위트를 걸면 「리더는 자기 턴에서 스윕을 돌리지 않는다」가 한 줄로
      무력화되고, 그것도 손으로 명령을 치지 않으므로 **가장 안 보이는
      스윕**이 된다(improv-worker의 review 스텝이 같은 함정을 이미 적어
      두었다). 그리고 verify의 결과는 런 안에만 산다: 스윕 도중 데몬이
      재기동하면 — 한 교대에 자발 재기동이 네 번 관측됐다 — 스윕도 판정도
      함께 사라진다.
      그래서 **실행과 판정을 가른다**: subagent가 스윕을 돌려 디스크에
      영수증(어느 커밋을 어떤 명령으로 돌아 몇 건이었는지)을 남기고, 이
      스텝의 verify는 그 영수증이 **지금 tip에 대한** green인지만 보는 값싼
      검사다. 그러면 subagent가 죽으면 영수증이 없어 게이트가 빨갛고,
      리더가 죽어도 영수증은 남아 재기동 뒤에 읽힌다.
      영수증을 만드는 트리는 깨끗해야 한다 — 남의 미커밋 파일이 있는
      공유 체크아웃에서 돈 스윕은 그 커밋에 대한 판정이 아니라 「그 커밋 +
      굴러다니던 것」에 대한 판정이다. 실제로 그렇게 나온 1562를 근거로
      여섯 이슈가 닫힌 뒤에야 잡혔다. 리더 전용 스윕 워크트리(짧은 경로,
      tip에 detach)가 이것을 한 번에 없앤다.

      스윕이 빨강이면 리더가 그 자리에서 트리를 고치지 않는다: 실패한
      테스트 이름과 첫 실패 줄을 보고에 적고 원인 브랜치의 워커에게
      후속 수정 브랜치로 재요청한다(master는 이미 움직였으므로 되돌리지
      않는다 — 되돌림이 필요할 만큼 크면 사용자에게 에스컬레이션). verify가
      있는 저장소에서는 그 verify가 초록이 될 때까지 이 단계를 떠나지
      못한다 — 그 초록을 만드는 것은 리더가 스윕을 다시 도는 것이 아니라
      **subagent를 다시 띄우는 것**이다.
      ── 보드 싣기 (닫는 것은 assignee, 싣는 것은 리더) ──
      머지된 이슈를 닫는 것은 그 이슈의 assignee 세션이고 자리는 각자의
      wrapup이다 — 리더가 대신 닫지 않는다. 리더가 닫는 것은 둘뿐이다:
      assignee가 exited라 스스로 못 닫은 고아(보드 대조에서 걸러진 것)와,
      중간 워커의 스택 부모 이슈. 그 둘에 한해 `claunch beads close <id>
      --reason "merged <머지 해시>, sweep N/M"`.
      리더의 자리는 그 다음이다 — 워커들의 close는 DB에만 쓰였으므로 싣는
      것이 남는다. 보드를 저장소에 싣는다 — `claunch
      beads sync --flush-only` 후 master에서 `git add .beads/issues.jsonl`,
      `git commit -m "chore(beads): close <id들>"`; 이 커밋도 subagent가
      실행하고 리더가 해시를 되확인한다. `.beads/`를 커밋하는 자리는 여기
      하나다(워커 브랜치는 그 파일을 건드리지 않으므로 충돌이 없다).
      PR 편성(`git config --get claunch.pr.remote`가 비어 있지 않다)이면 그
      커밋 뒤 `git push <remote> master:refs/heads/<base>`까지가 이 자리다 —
      원격 base가 master보다 뒤처진 채 회차를 닫으면 다음 PR 워커의
      remote-setup이 그 차이를 재어 리더에게 되묻는다.
    done_when: |
      이번 배치의 머지 결과 트리(master tip)에 대한 전체 스윕 수치(N/N, 축
      = 명령 전문, 트리 해시, 시작 시각)가 보고에 있고, 그 스윕이 **spawn된
      subagent 안에서** 돌았음과 그 subagent의 식별이 적혀 있다(리더의 턴도
      엔진 verify도 아니다 — 둘 다 이 스텝이 금지한 경로다). 그 스윕이
      프리뷰에서 앞당겨 돈 것이면 그 사실과 프리뷰 sha를 적는다 — 이 배치가
      전체 스위트를 몇 번 돌았는지가 저널에서 읽혀야 한다(정답은 1이다).
      스윕이 돈 트리가 깨끗했음(남의 미커밋 없음)이 적혀 있다. 이번
      배치에서 닫힌 이슈 수가 보고에 있고(닫은 주체는 각 assignee다),
      리더가 직접 닫은 고아·스택 부모가 있으면 그 id와 사유가 적혀 있으며,
      chore(beads) 커밋 해시가 보고에 있다.
    # 저장소 특화 verify는 정본이 아니라 프로젝트 레이어(.claunch/workflows/)에.
    # 여기 있던 것은 `pytest tests -q -n 8`, 전체 스위트 그 자체였다. 엔진은
    # verify를 스텝을 떠날 때 동기로 돌리므로(cflow/engine.py의 _run_verify)
    # 그 한 줄이 이 워크플로의 "리더는 스윕도 머지도 자기 턴에서 직접
    # 돌리지 않는다"를 무력화하고 있었다 — 178초 동안 리더의 next가 막혔고,
    # 손으로 친 명령이 아니라 저널에는 스윕이 돌았다는 사실조차 안 남았다.
    # 이제 스윕은 spawn된 subagent가 `tools/sweep.py run`으로 돌리고, 이
    # 줄은 그 subagent가 남긴 영수증만 읽는다(밀리초).
    # 영수증을 커밋 sha로 키를 잡는 이유: "충분히 최근인가"를 시계로 추측할
    # 필요가 없다. 영수증은 지금 게이트되는 tip의 것이거나 아니거나 둘 중
    # 하나다. 그리고 이 편이 재기동을 넘긴다 — 한 교대에 자발 재기동이 네
    # 번 관측됐고(claunch-3k9), claunch-bg-sweep-lost-on-restart-hq7이 가른
    # 두 축을 영수증이 함께 덮는다: subagent가 죽으면 영수증이 없어 빨강
    # (생산자), 리더가 죽어도 영수증은 디스크에 남는다(소비자).
    # 저장소 식별을 --git-common-dir로 잡으므로 워크트리가 달라도 같은 키다
    # (실측: 메인 체크아웃과 워커 워크트리가 같은 d8858fb08816). 리더가
    # 전용 스윕 워크트리(짧은 경로, tip에 detach)에서 돌린 영수증이 메인
    # 체크아웃의 게이트에서 그대로 읽히라고 그렇게 잡았다.
    # 더러운 트리는 영수증을 못 만든다: 남의 미커밋이 있는 공유 체크아웃에서
    # 돈 스윕은 그 커밋이 아니라 「그 커밋 + 굴러다니던 것」의 판정이다.
    # 실제로 그렇게 나온 1562/1563을 근거로 여섯 이슈가 닫힌 뒤에 잡혔다.
    # 스윕 명령 자체(-n 8, 짧은 세션별 basetemp와 그 MAX_PATH 근거)는
    # tools/sweep.py의 DEFAULT_COMMAND 주석으로 옮겼다 — 명령이 사는 곳에
    # 이유도 같이 산다. tests/test_sweep.py가 못박는다.
    verify: 'uv run --no-sync python tools/sweep.py check --branch master'
    next: reflect

  reflect:
    # 이 스텝은 checklist 게이트다: 넘어가는 판정을 에이전트가 아니라
    # 데몬이 내린다. 항목의 종료 코드가 전부 0이고 이 스텝의 report가
    # 제출돼 있을 때 런이 착지 통지(landed-notice)로 넘어가고, 그 스텝이
    # 끝나면 회차가 끝나 recur가 다음 회차를 요청한다.
    # 이 자리가 산문이었을 때 무슨 일이 있었는가: reflect는 오래 서술문뿐
    # 이었고, 재기동이 실제로 있었는지 아무것도 재지 않았다 — 리더에게는
    # 재기동을 인지할 경로조차 없어 300초 리마인더만 반복됐다(사용자 신고).
    # 그 뒤 verify와 awaits가 붙어 「재기동 없이 초록을 적는 것」과
    # 「재기동을 아무도 안 알려주는 것」을 각각 막았지만, 넘어가는 행위
    # 자체는 여전히 리더의 판단이었다. 체크리스트는 그 마지막 절반이다.
    # 에이전트의 이탈 경로는 없다(checklist 스텝에는 next:를 쓸 수 없다).
    checklist:
      prompt: 이 회차의 머지가 라이브 서버에 실제로 반영됐는가
      then: landed-notice
      poll: 30
      # 2중 게이트의 바깥쪽 절반. 이 게이트는 원래 무기한이었다 — deployed가
      # 참이 되지 않으면 런은 여기서 사람의 goto를 기다렸다. 2026-09-11에
      # 그 무기한이 교착이 됐다: 데몬이 미커밋 파일을 실은 채 기동했고
      # (deploy_check exit 3), 커밋해도 기동 스냅샷의 dirt는 재기동으로만
      # 지워지는데, 재기동은 방문(visit)당 한 번만 실행되어 이미 지나갔다.
      # 그래서 만료 간선이다: 600초(재기동 두 번 분량) 안에 deployed가 참이
      # 되지 않으면 데몬이 reflect-pregate로 옮긴다. 거기서 리더가 원인을
      # 정리한 뒤 reflect로 되돌아오면 새 visit이라 재기동이 다시 실행된다.
      # 만료는 goto가 아니다 — 워크플로가 선언한 간선이고 저널에는
      # checklist_expired로 남는다. 무한 루프는 max_visits가 막는다.
      otherwise:
        after: 600
        then: reflect-pregate
      items:
        # tools/deploy_check.py가 daemon.json의 started_at(부팅마다
        # 기록된다)과 master tip의 커밋 시각을 견준다: 데몬이 그 머지보다
        # 먼저 떠 있었다면 그 머지를 서빙할 수 없다. 0=머지 이후 재기동
        # 확인 / 1=재기동 없음 / 2=판정 불가(데몬 파일 없음·브랜치 없음).
        # 2와 타임아웃은 unknown으로 기록되고 unknown은 참이 아니다.
        # 읽기 전용이다 — daemon.json 한 번 읽기 + git log 한 번이라
        # 30초마다 다시 재도 값이 싸다(tools/deploy_check.py 도크스트링).
        # 이 검사가 증명하지 못하는 절반(재기동한 데몬이 정말 새 코드를
        # 서빙하는가)은 아래 done_when이 계속 사람에게 요구하고, report가
        # 제출돼야 게이트가 열리므로 그 절반이 저널에서 빠지지 않는다.
        # tests/test_deploy_check.py가 양방향과 판정 불가 두 갈래를 못박는다.
        - id: deployed
          describe: 라이브 데몬이 master의 이번 머지 이후에 재기동됐다
          check: 'uv run --no-sync python tools/deploy_check.py --branch master'
    # 대상은 cflow daemon으로 고정하지 않는다. RestartClock은 이 런의 CWD에서
    # 아래 프로젝트 스크립트 하나를 실행할 뿐이며, 다른 프로젝트는 같은
    # 상대 경로에 자기 서비스의 재기동 스크립트를 둔다. Windows와 WSL Linux는
    # 셸·프로세스 모델이 달라 명령을 따로 선언한다.
    restart:
      windows: 'powershell -NoProfile -ExecutionPolicy Bypass -File tools/restart_live.ps1'
      linux: 'bash tools/restart_live.sh'
      # 900초는 승인 게이트가 이 요청을 붙들 수 있는 최대치를 감싸는
      # 값이다. 스크립트 안의 `claunch daemon restart`는 이 런의 세션
      # 이름을 달고 나가므로 restart_gate에 요청을 올리고 답을 기다린다 —
      # 무응답이면 GATE_TIMEOUT(300초) 뒤에 승인으로 나가고, 사용자가
      # 웹 UI에서 연장하면 그 시한이 최대 TOTAL_BUDGET(870초)까지 밀린다.
      # 그보다 짧게 두면 대기가 끝나기 전에 여기서 셸이 죽어 저널에는
      # 「timed out」이 적히고 재기동은 그 뒤에 일어난다. 저널과 실제가
      # 갈리는 그 형태를 막는다. 900은 restart.timeout의 상한이기도 하다
      # (cflow.model) — 연장 예산이 870으로 끊기는 이유가 이것이다.
      timeout: 900
    title: 라이브 서버 반영
    ask:
      # 기동 중인 사용자 화면을 건드리는 일 — 머지와 별개로 반영도 리더
      # self-decision으로 진행한다(사용자 승인에서 해제). 방어는 재기동 후의
      # 실제 서빙 확인(done_when이 요구하는 증거)이다.
      prompt: |
        master 머지와 검증(build+test)이 끝났다. 기동 중인 라이브 서버는
        아직 머지 전 코드를 서빙한다. 리더 self-decision으로 지금 재기동해
        반영을 진행하고, 기동 후 새 머지 커밋이 실제로 서빙되는지 확인한
        증거(방법과 결과)를 보고에 남긴다. 이 회차는 반영이 일어난 여기서
        마감된다.
      otherwise: self
    instructions: |
      재기동은 리더가 실행하지 않는다 — 이 스텝에 진입하는 순간 데몬의
      RestartClock이 위 restart: 스크립트(tools/restart_live.*)를 실행하고,
      그 스크립트가 deploy_check로 「이미 서빙 중」이면 재기동을 건너뛰고
      그 외에는 `claunch daemon restart`를 부른다. 에이전트 세션은 그
      명령을 직접 실행할 권한이 없다(README「Who may restart or stop the
      daemon」). 그 명령은 이 런의 세션 이름을 달고 나가므로 웹 UI의 승인
      게이트에 요청으로 올라간다 — 사용자가 승인하거나 거절하고, 무응답이면
      300초 뒤에 승인으로 나간다(restart_gate.GATE_TIMEOUT). 사용자가 그
      카드에서 연장을 고르면 시한이 한 번에 300초씩, 최대 870초까지
      밀린다. 리더가 할 일은
      기동 후 새 머지 커밋의 기능이 실제로 서빙되는지 한 가지 이상 확인해
      증거(확인 방법과 결과)를 보고에 남기는 것이다. 게이트가 열리면 런은
      landed-notice로 가서 착지한 세션들에게 반영 결과를 알린 뒤 마감된다
      — recur가 다음 회차를 요청하고 데몬이 그것을 시작한다. 재기동으로
      이 턴이 죽어도 회차는 이어진다.

      이 게이트는 600초로 유한하다. 그 안에 deployed가 참이 되지 않으면
      데몬이 reflect-pregate로 옮기고, 거기서 원인을 정리한 뒤 되돌아오면
      재기동이 다시 실행된다. 기다리는 동안 deployed의 출력(deploy_check의
      판정문)을 읽어 둔다 — exit 3(체크아웃이 더러움)이면 어느 경로가
      미커밋인지가 거기 적혀 있고, 그것이 pregate에서 할 일이다.

      ── 재기동을 인지하는 규율 ──
      재기동을 거는 턴과 그 결과를 읽는 턴은 같은 턴이 아니다. 데몬은
      자기에게 붙은 터미널을 전부 데리고 내려가므로 재기동을 건 그 턴이
      데몬과 함께 죽고, 명령이 마지막에 무엇을 출력했든 그것을 읽을 턴은
      이미 없다. 되살아난 리더에게 이 사실은 「아무 일도 안 일어난 것」과
      구별되지 않는다 — 그래서 다시 건다. 그 반사를 넷으로 막는다.

      · **pid가 안 바뀌었으면 먼저 승인 대기인지 본다.** 재기동은 승인
        게이트를 지나므로 「pid가 그대로다」는 「실패했다」가 아니라 「아직
        안 나갔다」일 수 있다. 사용자가 답하지 않으면 300초 뒤에 승인으로
        나가고, 사용자가 연장을 고르면 그만큼 더 걸린다(최대 870초). 그
        사이에 할 일은 기다리는 것이다. 이 갈래를 모르고 규율을
        정확히 따른 리더가 실패로 판정하고 다시 건 사례가 있다
        (claunch-ensl, 2026-08-28).
      · **다시 걸기 전에 pid로 판정한다.** 재료는 둘이다. 하나는 데몬이
        부팅에서 요청자에게 배달하는 재기동 통지 블록이다 — 요청한
        세션에게만 가고, 그 세션이 busy여도 사라지지 않으며, 새 데몬이
        이미 듣고 있는 뒤에만 쓰인다. 그것이 도착해 있으면 그 자체가
        답이고 더 확인할 것이 없다. 다른 하나는 pid다: 재기동 전의 pid를
        적어 두었고 지금 pid가 그것과 다르면 새 데몬이다. 적어 두지
        않았다면 지금 판정할 재료가 없는 것이지 재기동이 실패한 것이
        아니다 — 다시 거는 것으로는 그 재료가 생기지 않고, 죽는 턴이
        하나 늘 뿐이다.
      · **재기동 직후의 `claunch daemon status` 한 번을 판정으로 쓰지
        않는다.** 재기동은 stop → 짧은 대기 → 기동 순서이고, 나가는
        데몬은 그 사이에도 대답한다. 그러니 「응답이 있다」는 새 데몬이
        섰다는 뜻이 아니라 옛 데몬이 아직 안 죽었다는 뜻일 수 있다. 읽을
        것은 응답 여부가 아니라 pid와 started_at이고, 그 둘이 재기동 전과
        다를 때에만 새 데몬이다.
      · **기동 시각이 tip 커밋보다 뒤라는 사실은 「이 회차가 반영했다」의
        증거가 아니다.** 그 조건은 「언젠가 누군가 재기동했다」까지만
        말하고, 아무도 시키지 않은 재기동도 그대로 통과한다. 반영의
        증거는 새 머지 커밋의 기능이 실제로 서빙되는 것을 하나라도 확인한
        결과뿐이며, 아래 done_when이 요구하는 것도 그것이다.
    done_when: |
      라이브 서버가 재기동되었고, 새 머지 커밋의 기능이 실제로 서빙됨을
      확인한 증거(방법과 결과)가 보고에 있다. 기동한 것이 새 데몬임을
      무엇으로 판정했는지도 적혀 있다 — 재기동 통지 블록이거나, 재기동
      전후의 pid다(응답이 있었다는 사실은 판정이 아니다).

  reflect-pregate:
    # 2중 게이트의 안쪽 절반. reflect의 checklist가 600초 안에 열리지 않으면
    # 데몬이 런을 여기로 옮긴다(checklist_expired). 여기는 결정 자리다:
    # 원인을 정리하고 reflect로 되돌아가 재기동을 다시 실행할지, 이 회차는
    # 반영 없이 마감할지. 되돌아가면 reflect는 새 visit이고 RestartClock이
    # restart: 를 다시 실행한다 — 그것이 이 스텝이 존재하는 이유다(같은
    # visit 안에서는 재기동이 한 번뿐이라 고친 뒤 다시 걸 방법이 없었다).
    # chooser는 agent, 곧 리더 자신이다(사용자 결정, 2026-09-11): 사람이
    # 자리에 없어도 회차가 멈추지 않는다. 무한 왕복은 max_visits(기본 25)가
    # 끊는다.
    title: 반영 재시도 판단
    instructions: |
      reflect의 deployed 게이트가 600초 안에 열리지 않아 여기로 왔다.
      저널의 checklist_expired 항목에 마지막 판정(deploy_check의 종료 코드와
      출력)이 있다 — 그것을 먼저 읽는다. 갈래는 종료 코드로 나뉜다.
      · exit 1(옛 코드를 서빙 중): 재기동이 실행되지 않았거나 실패했다.
        저널의 restart_completed/restart_interrupted와 재기동 통지 블록을
        대조하고 retry를 고른다.
      · exit 3(체크아웃이 더러움): 판정문에 적힌 미커밋 경로를 본다.
        리더의 것이면 커밋하거나 치우고, 다른 세션의 것이면 그 세션에
        커밋·정리를 요청해 응답을 받는다. 그다음 retry를 고른다 —
        기동 스냅샷에 남은 dirt는 재기동으로만 지워지므로 정리만으로는
        deployed가 참이 되지 않는다.
      · exit 2(판정 불가): 판정문이 말하는 원인(daemon.json 없음, 다른
        저장소, 알 수 없는 HEAD)을 고친 뒤 retry를 고른다.
      원인을 이 턴에 정리할 수 없으면 close를 고른다 — 회차는 반영 없이
      마감되고 다음 회차의 reflect가 다시 시도한다(마감 전에 landed-notice가
      착지한 세션들에게 「반영 안 됨」을 알린다). 어느 쪽이든 reason에
      종료 코드와 정리한 내용(또는 못 한 이유)을 적는다.
      `claunch daemon restart`를 여기서 직접 실행하지 않는다 — retry로
      reflect에 되돌아가면 데몬이 실행한다.
    select:
      prompt: |
        reflect의 deployed 게이트가 만료됐다. 원인을 정리했으면 retry로
        reflect에 되돌아가 재기동을 다시 실행하고, 이 턴에 정리할 수 없으면
        close로 이 회차를 반영 없이 마감한다.
      chooser: agent
      require_reason: true
      options:
        retry:
          description: 원인을 정리했다 — reflect로 되돌아가 재기동을 다시 실행한다(새 visit)
          next: reflect
        close:
          description: 이 턴에 정리할 수 없다 — 회차를 반영 없이 마감한다(착지 통지 뒤 end, 다음 회차의 reflect가 다시 시도)
          next: landed-notice

  landed-notice:
    # 회차가 끝나는 두 간선(reflect의 게이트 통과, reflect-pregate의 close)이
    # 모두 여기를 지나 end로 간다. 이 스텝이 생기기 전에는 두 간선이 곧바로
    # end였고, 착지한 세션에게 가는 통지는 integrate의 @in_review 한 건뿐이었다
    # — 재기동 전이고, integrate 밖에서 착지한 이슈(사용자가 승인한
    # out-of-band 머지)는 그 목록에 없었다. 실제로 일어났다(s469 8회차
    # run-b29a7986, 2026-09-24): integrate 통지(14:32Z)는 u8wjx.1·pmm5n만
    # 실었고, y9ax9·fh8u1·y9ax9.1은 queue_landed로만 기록됐다. reflect는
    # restart_interrupted → deployed exit 3 → checklist_expired → close로
    # 끝났고, 15:42:11 queue_reset이 landed 4건을 버린 뒤 done이 됐다. 반영이
    # 됐는지 안 됐는지를 착지한 세션 누구도 듣지 못했다(claunch-w9dvz).
    # 자리가 end 전이어야 하는 이유: 엔진의 _landing_reset은 end로 가는 전이
    # 안에서 landed 항목을 버린다. end 뒤에는 「이번 회차에 누가 착지했나」를
    # 읽을 곳이 없다.
    title: 착지·반영 통지 (큐 정리 전)
    instructions: |
      회차가 끝나기 직전이다. 이 스텝을 떠나 end로 가는 순간 엔진이 착지
      큐를 정리하고 landed 항목은 버려진다. 그러니 그 전에, 이번 회차에
      착지한 세션들에게 머지와 반영의 결과를 알린다. 대상은 **큐의 landed
      항목**이다 — integrate의 @in_review 통지와 달리, 리더가 머지하지 않은
      착지(사용자가 승인한 out-of-band 머지)도 큐에 landed로 잡혀 있으므로
      여기서 함께 통지된다.

      1. 목록: MCP `landing_queue` 도구를 인자 없이 부른다(목록을 내기 전에
         git으로 landed를 다시 잰다). status가 landed인 항목만 대상이다.
         항목마다 issue·tip·requested_by를 적어 둔다. requested·waiting·
         deferred 항목(다음 회차로 이월될 것)에는 통지하지 않는다 — 그
         세션들은 자기 재촉(nudge)과 프로브로 이미 최신 상태를 알고, 회차
         전환마다 이월자 전원에게 보내면 회차가 잦을수록 소음만 커진다.
         landed 항목이 하나도 없으면 보낼 것이 없다 — 「통지 대상 없음」과
         목록 출력을 보고에 적고 이 스텝을 끝낸다.
      2. 머지 해시: 항목마다 그 tip을 master에 실은 머지 커밋을 git으로
         찾는다 — `git rev-list --merges --ancestry-path <tip>..master |
         tail -1`(tip에서 가장 가까운 머지). 머지 커밋 없이 fast-forward로
         실렸으면 빈 출력이고, 그때는 tip 자체를 해시로 적는다.
      3. 반영 판정: 이 스텝에 어느 간선으로 왔는지가 판정이다. 새로 재지
         않는다.
         · reflect의 게이트가 열려서 왔다(저널의 `checklist_passed`,
           deployed ok) → **반영됨**. reflect 보고에 적은 서빙 확인 증거와
           지금 서빙 중인 master tip을 싣는다.
         · reflect-pregate의 close로 왔다(저널의 `checklist_expired` 뒤
           close) → **반영 안 됨**. deploy_check의 마지막 종료 코드와
           판정문 한 줄, 그리고 「다음 회차의 reflect가 재시도한다」를
           싣는다.
      4. 기록: landed 이슈마다 코멘트를 하나 남긴다 —
         `DEPLOYED @ <서빙 중인 master tip>` 또는
         `NOT DEPLOYED: deploy_check exit <n> (<판정문 요지>)`. 이슈가 이미
         닫혔어도 남긴다(코멘트는 닫힌 이슈에도 붙는다). 이것이 되짚어
         읽히는 기록이다(공통 규칙의 「기록은 코멘트에, 신호는 메시지에」).
      5. 통지: 요청 세션(requested_by)들에게 **핸들을 지정한 한 건**을
         보낸다 — MCP send의 `to`에 쉼표로 구분한 핸들(`s1,s2,...`).
         쉼표 목록을 나누는 것은 MCP send뿐이다: CLI `claunch mesh send`는
         `to`를 핸들 하나로 보내므로 `s1,s2`를 주면 「unknown
         recipient(s)」로 아무에게도 가지 않는다. CLI밖에 없으면 핸들마다
         한 번씩 보낸다. `'*'`와 `@in_review`는 쓰지 않는다 — 착지한 이슈는
         대개 이미 닫혔거나 닫히는 중이라 @in_review가 풀지 못하고, `'*'`는
         무관한 세션의 턴을 쓴다. intent는 `fyi`다(받는 쪽이 할 일은 없다).
         본문은 이 형태를 넘지 않는다:

             <회차> 착지·반영 통지. 반영: <됨 @ <master tip> | 안 됨 (deploy_check exit <n>)>.
             <이슈> merged <해시> (<세션>) / <이슈> merged <해시> (<세션>) ...

         **목록은 통째로 거절될 수 있다.** 데몬은 목록 중 하나라도 이
         메시의 멤버가 아니거나 나와 연결이 없으면 그 한 명을 빼는 대신
         전체를 거절한다(「unknown recipient(s)」 / 「has no connection
         to」). requested_by는 내 직계가 아닐 수 있다 — 중간 워커의 자식,
         out-of-band 머지의 요청자. 거절되면 오류가 이름을 댄 핸들을 빼고
         나머지에게 다시 보내고, 뺀 세션과 사유를 보고에 적는다. 그
         세션들 몫의 기록은 4번의 보드 코멘트다.
         이미 종료된 세션에게는 전달되지 않는다 — 전송 결과에 그렇게
         나오면 그것을 그대로 보고에 적는다. 보드 코멘트가 그 세션 몫의
         기록으로 남으므로 따로 할 일은 없다.
      이 스텝은 에이전트 스텝이다: reflect의 게이트는 데몬이 열지만, 여기를
      끝내 end로 보내는 것은 리더다. 재기동 뒤 리더의 턴이 늦으면 큐 정리와
      다음 회차의 시작도 그만큼 늦는다 — landed 항목이 통지 전에 버려지지
      않게 하려고 받아들인 비용이다.
      이 스텝에서 하지 않는 것: 큐 항목의 상태를 바꾸는 것(landed는 데몬이
      표시하고, 정리는 end 전이가 한다), 이슈를 닫는 것(assignee의
      wrapup이다), 재기동을 다시 거는 것(reflect-pregate의 retry다).
    done_when: |
      `landing_queue` 목록에서 읽은 landed 항목(issue·tip·requested_by)과
      항목별 머지 해시가 보고에 있다. 반영 판정(됨/안 됨)과 그 근거 — 어느
      간선으로 왔는지, 안 됨이면 deploy_check 종료 코드 — 가 보고에 있다.
      landed 이슈마다 DEPLOYED / NOT DEPLOYED 코멘트가 남았고, 요청 세션들에게
      핸들 지정 통지 한 건이 나갔으며 그 메시지 id와 전달 결과(종료된 수신자
      포함)가 보고에 있다. 목록이 거절돼 뺀 핸들이 있으면 그 핸들과 사유가
      보고에 있다. landed 항목이 없었으면 「통지 대상 없음」과 목록
      출력이 대신 보고에 있다.
    next: end

  wrapup:
    title: 교대 종료
    ask:
      # 워커 세션 종료는 진행 중이던 미전송 결과를 잃을 수 있다 — 사용자 확인을 지난다.
      prompt: |
        교대 종료를 확정하는가? 확정하면 워커들의 유휴 여부를 확인한 뒤
        세션을 종료(kill)하고 최종 보고를 남긴다. 통합 대기 브랜치가 남아
        있다면 보드(claunch beads list --status in_review)에 보인다 — 남긴
        채 종료해도 브랜치도 이슈도 유지된다.
      timeout: 900
      on_decline: standby
    instructions: |
      워커마다(그리고 옛 규칙으로 만들어 둔 tester 세션이 남아 있으면
      그것도) 진행 중인 작업이 있는지 먼저 물어
      확인하고, 응답과 별개로 claunch cflow status -t <세션> 으로 런 상태를
      교차 확인한다 — 응답 없는 워커의 유휴는 물어서 알 수 없다. 양쪽에서
      유휴가 확인된 세션만 kill로 종료해 슬롯을 반환한다. subagent는 세션이
      아니므로 이 정리의 대상이 아니다 — 다만 아직 돌고 있는 subagent가
      있으면 그 결과를 받은 뒤에 최종 보고를 쓴다(받지 못한 스윕 수치를
      기다리지 않고 닫으면 그 회차의 판정 근거가 저널에서 빈다). **정리하더라도
      basetemp는 지우지 않는다 — 포렌식 기록이고 저장소 밖에 있어 클린
      트리와 무관하다**(스윕의 시작·소요·워커 수·실행량이 거기에만 남는다;
      지워야 한다면 그 네 값을 먼저 보고에 적는다). 최종 보고: 교대 동안의 회차
      요약 — 처리한 요청, 확정한 규칙, 머지 커밋, 반영 여부, 남은 통합
      대기 브랜치 — 를 저널 기반으로 남기고, 보드의 잔량(`claunch beads list
      --status open --status in_progress --status in_review --json`)을
      붙인다. 이 런은 recur(auto)라서 종료 후에도
      다음 회차 요청이 접수되고 데몬이 그것을 시작한다 — 교대를 정말
      끝내려면 사용자가 요청을 철회해야 함을 안내한다
      (claunch cflow request --cancel).
    done_when: |
      유휴가 확인된 워커(와 남아 있던 tester) 세션이 모두 종료되었고, 교대 최종 보고
      (처리한 요청, 확정 규칙, 머지 커밋, 반영 여부, 남은 통합 대기)가
      기록되었다.
    next: end
