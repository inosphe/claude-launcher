# improv-worker 위에 얹는 레이어다 — 정본 워커의 스텝·게이트·산문 전체를
# `extends`로 물려받고, 착지 경로가 로컬 머지가 아니라 원격 pull request(PR)
# 라는 점에서 달라지는 자리만 적는다. 정본 스텝의 instructions는 하나도
# 덮어쓰지 않는다(improv-pm의 overlay 규칙과 같다): 산문을 다시 쓰면 같은
# 이름의 규칙이 이 워커에게만 다르게 도는 사고이고, 정본이 고쳐질 때 여기가
# 따라가지 못한다. 겹쳐 쓰는 것은 네 자리다 —
#   · branch-setup 뒤에 remote-setup 스텝을 끼운다(원격·gh·upstream 확정)
#   · peer-review의 pass 갈래를 pr-open 스텝으로 보낸다(push + PR 생성)
#   · landed 체크리스트의 항목을 원격 base 기준으로 바꾼다(fetch 뒤 판정)
#   · default_role을 지운다(위저드가 role=worker에 이 변형을 자동 선택하지
#     않는다 — 이 변형은 spawn의 workflow: 또는 위저드 행으로 명시해 고른다)
# 나머지 — intake의 beads 규칙, 표적 테스트, 착지 결정의 두 문, rebase 게이트,
# 배치·큐·정산·종료 — 는 정본 그대로 돈다. 정렬 게이트(merge_ready.py)와
# 착지 게이트(landed_check.py)는 정본과 같은 스크립트다: 둘 다 브랜치의 git
# upstream을 통합 대상으로 읽으므로 remote-setup이 upstream을
# `<remote>/<base>`로 두는 것으로 같은 게이트가 원격 base를 향해 서고, 원격이
# 움직인 것을 이 저장소가 보려면 fetch가 필요하므로 두 스크립트에 `--fetch`
# 옵션이 있다(대상이 추적하는 원격을 재기 전에 fetch한다 — 게이트 명령은
# `uv run --no-sync python tools/...` 한 줄이어야 한다는 저장소 규칙 때문에
# 셸의 `git fetch && ...`가 아니라 스크립트의 옵션이다).
#
# 왜 gh CLI인가 — GitHub Enterprise(사설 호스트)의 PR을 만들고 읽고 머지하는
# 표준 클라이언트이고, 호스트별 인증(`gh auth login --hostname <host>`,
# 비대화형이면 `GH_ENTERPRISE_TOKEN`)과 API v3 경로(`https://<host>/api/v3`)를
# 스스로 처리한다. REST를 직접 부르는 두 번째 경로는 두지 않는다 — 인증·
# 페이지네이션·오류 처리를 워크플로 산문에 두 번 적게 되고, 어느 한쪽만
# 고쳐지는 것이 정확히 이 저장소가 막으려는 드리프트다. gh가 없거나 인증이
# 안 된 머신에서는 remote-setup이 그 사실을 보고하고 사용자에게 올린다 —
# 세션은 대화형 로그인을 할 수 없다.
#
# 이 레이어가 전제하는 것 하나: 원격 base 브랜치(기본 master)가 통합의 정본이고
# 리더의 통합 단계가 그것을 최신으로 유지한다(improv-leader의 「PR 후보」 절).
# 원격 base가 로컬 master보다 뒤처져 있으면 PR의 diff는 이 회차의 것이 아니라
# 밀린 커밋 전부가 되므로, remote-setup이 그 사실을 재고 리더에게 올린다.
extends: improv-worker
name: improv-worker-remote
description: >
  improv-worker의 PR 변형 — 회차의 모양(목표 수립 -> 일감 확인 -> 브랜치 준비
  -> [작업 -> 표적 테스트 -> 커밋]* -> 착지 결정 -> 정렬 -> 동료 리뷰 -> 통합
  요청 -> 착지 대기 -> 착지 확인 -> 정리 -> 큐 재확인)은 정본과 같고, 착지의
  매체만 다르다: 통합 대상은 로컬 master가 아니라 원격(사설 GitHub
  Enterprise) base 브랜치이고, 통합 요청은 브랜치 push와 pull request이며,
  착지의 증거는 fetch한 원격 base가 동결된 tip을 merge commit으로 포함하는
  것이다. 머지 실행은 여전히 리더의 통합 단계 하나뿐이다(`gh pr merge`) —
  워커는 어떤 경로로도 base를 직접 움직이지 않는다. 하위 워커(자식)는 정본
  improv-worker로 돌아 내 브랜치에 --no-ff로 모인다 — 원격에 닿는 층은 이
  워커 하나다. 게이트(정렬·착지)는 정본과 같은 스크립트이고, 브랜치의 git
  upstream이 `<remote>/<base>`를 가리키는 것으로 대상이 정해진다.

# 위저드의 role=worker 자동 선택은 정본(improv-worker)의 것이다 — 두 워크플로가
# 같은 역할에 자원하면 우선순위·이름순으로 갈리는데, 그 갈림을 사람이 기억하게
# 두지 않는다. 이 변형은 명시적으로만 고른다(spawn `workflow:
# improv-worker-remote`, 위저드의 Workflow 행).
default_role: null

steps:
  branch-setup:
    next: remote-setup

  remote-setup:
    title: 원격 준비 (remote · gh · upstream)
    instructions: |
      피처 브랜치는 만들어졌다. 이 회차의 착지 매체가 PR이므로, 착수 전에
      원격·클라이언트·통합 대상을 사실로 확정하고 보고에 남긴다. 아래 네
      값은 뒤 스텝(정렬·PR 생성·착지 확인)이 그대로 읽는다.

      ── 1. 원격과 base ──
      원격 이름은 저장소 설정에서 읽는다 — `git config --get
      claunch.pr.remote`. 비어 있으면 추측하지 않는다(원격이 둘 이상인
      저장소에서 「github.com이 아닌 쪽」 같은 규칙은 다음 저장소에서
      틀린다): `git remote -v` 출력을 실어 터미널 사용자에게 어느 원격인지
      묻고, 답이 오면 `git config claunch.pr.remote <이름>`으로 적은 뒤
      진행한다 — 한 번 적히면 다음 회차·다음 세션은 묻지 않는다.
      base 브랜치는 `git config --get claunch.pr.base`, 비어 있으면 master다.
      호스트와 저장소 슬러그는 원격 URL에서 읽는다 — `git remote get-url
      <remote>`의 호스트가 `<host>`, 경로의 `<owner>/<repo>`(끝의 .git 제외)가
      슬러그다. gh 호출은 전부 `-R <host>/<owner>/<repo>`를 명시한다 — origin이
      github.com을 가리키는 저장소에서 gh가 다른 원격을 고르거나 물어보는
      일을 막는다(세션은 프롬프트에 답할 수 없다).

      ── 2. gh 클라이언트 ──
      `gh --version` 과 `gh auth status --hostname <host>` — 둘 다 exit 0이어야
      한다. 아니면 여기서 멈추고 사용자에게 올린다: 설치(GitHub CLI), 인증
      (`gh auth login --hostname <host>` 를 사용자가 한 번, 또는 데몬 환경에
      `GH_ENTERPRISE_TOKEN`). 세션은 대화형 로그인을 대신할 수 없고, 토큰을
      요구하거나 받아 적지 않는다. 기다리는 동안 이슈에 `BLOCKED: remote-setup
      (gh)` 코멘트를 남기고 상태를 blocked로 두며, 풀리면 같은 세션이
      되돌린다(공통 규칙).

      ── 3. push 안전장치 ──
      이 회차는 브랜치의 upstream을 `<remote>/<base>`로 둔다(아래 4). 그래서
      **bare `git push`는 이 회차 내내 금지**이고 push는 언제나 명시
      refspec이다: `git push <remote> HEAD:refs/heads/<브랜치>`. `git config
      --get push.default`가 `upstream`이나 `matching`이면 bare push가 base로
      갈 수 있으므로 진행하지 않고 사용자에게 올린다(비어 있음·simple·
      current·nothing은 안전하다 — simple은 이름이 다른 upstream으로의 bare
      push를 거절한다). 값을 보고에 적는다.

      ── 4. fetch · upstream · 기준선 ──
      `git fetch <remote>` 뒤 `git branch --set-upstream-to=<remote>/<base>`.
      이 한 줄이 통합 대상을 기계가 읽는 사실로 만든다: 정렬 게이트
      (tools/merge_ready.py)와 착지 게이트(tools/landed_check.py --target
      @{upstream})는 upstream을 대상으로 읽고, 정본 rebase 스텝의 「대상은 이
      브랜치의 git upstream」 문장이 그대로 이 브랜치에 성립한다.
      그다음 원격 base가 최신인지 잰다 — `git rev-list --count
      <remote>/<base>..master`(로컬 master가 없는 워크트리면 리더의 통합
      브랜치 이름으로). 0이 아니면 원격 base가 로컬 통합 브랜치보다 뒤처진
      것이고, 이 브랜치의 PR은 이 회차의 변경이 아니라 밀린 커밋 전부를
      싣게 된다. 그 수와 두 tip을 리더에게 ask로 올리고(리더의 통합 단계가
      base를 push한다 — improv-leader 「PR 후보」 절) 답이 올 때까지 여기서
      기다린다. 0이면 아직 커밋이 없는 브랜치에 한해 `git rebase
      <remote>/<base>`로 기준을 옮긴다(참조 이동뿐이다). 커밋이 이미 있으면
      옮기지 않는다 — 정본 work 스텝의 「작업 중에는 통합 대상을 따라가지
      않는다」가 여기서부터 적용된다.

      ── 이 회차의 원격 규칙(뒤 스텝이 참조한다) ──
      · 통합 대상 = `<remote>/<base>` = 이 브랜치의 upstream. 정본 산문의
        「통합 대상」「master」「상위 브랜치」는 전부 이것을 뜻한다.
      · push는 명시 refspec뿐이다. 재요청(rebase 뒤)의 push는
        `--force-with-lease`를 붙인다 — 리뷰어가 승인한 tip 위에 남이 쓴
        것이 있으면 거절된다.
      · 리더의 PR 머지 방식은 merge commit(로컬 --no-ff와 등가)이다. 그래서
        착지의 증거는 「fetch한 원격 base가 내 동결 tip을 포함한다」이고,
        닫을 때 적는 머지 해시는 `git rev-list --merges --parents
        <tip>..<remote>/<base>` 출력에서 내 tip을 부모로 갖는 줄의 첫
        해시다 — 리더의 fyi에 적힌 해시를 옮겨 적지 않는다(정본 landed의
        규칙 그대로). squash·rebase로 머지되면 게이트는 「아직」으로 남고,
        정본 landed의 「히스토리가 재작성된 경우」 절이 적용된다.
      · 원격 base가 뒤처지는 것을 워커가 push로 고치지 않는다 — base를
        움직이는 것은 리더의 통합 단계뿐이다(정본의 「워커는 master를
        직접 머지하지 않는다」와 같은 금지).
    done_when: |
      원격 이름·host·슬러그·base, gh 버전과 `gh auth status --hostname`의
      결과, `push.default` 값, upstream 설정 결과(`git rev-parse
      --abbrev-ref @{upstream}` 출력), 원격 base tip과 `<remote>/<base>..
      master` 카운트(0이 아니면 리더에게 올린 ask의 id)가 보고에 있다.
      gh나 인증이 없으면 BLOCKED 코멘트와 사용자 안내가 대신 있다.
    next: work

  peer-review:
    select:
      options:
        pass:
          next: pr-open

  pr-open:
    title: push · pull request (리뷰 통과 직후, 요청 직전)
    instructions: |
      동료 리뷰가 통과했다. 리뷰어가 본 tip이 원격에 올라가고 PR이 그 tip을
      가리키게 한 뒤, 정본의 통합 요청 스텝으로 간다 — 이 스텝은 요청의
      매체(브랜치·PR)를 만들고, 요청 자체(in_review 전이·LANDING REQUEST
      코멘트·nudge)는 다음 스텝이 정본대로 한다.

      ── push ──
      `git push <remote> HEAD:refs/heads/<브랜치>` — 재요청(await-landing에서
      rebase/remeasure로 돌아와 tip이 바뀐 경우)이면 `git push
      --force-with-lease <remote> HEAD:refs/heads/<브랜치>`. bare `git push`는
      쓰지 않는다(remote-setup의 규칙). 확인은 `git fetch <remote>` 뒤
      `git rev-parse <remote>/<브랜치>`가 HEAD와 같은 것이다.

      ── PR ──
      먼저 있는지 본다: `gh pr view <브랜치> -R <host>/<owner>/<repo> --json
      number,url,state,headRefOid`. 없으면(exit ≠ 0) 만든다:
        gh pr create -R <host>/<owner>/<repo> --base <base> --head <브랜치>
          --title "<이슈 id>: <커밋 관례의 한 줄 요약>" --body-file <파일>
      본문 파일에는 이슈 id(배치면 전부)와 목표 한 줄, 그리고 증거 묶음이
      보드 코멘트에 있다는 안내를 적는다 — 증거의 정본은 여전히 이슈
      코멘트다(「기록은 코멘트에」). 이미 있으면 새로 만들지 않고 `state`가
      OPEN인지, `headRefOid`가 HEAD와 같은지 확인한다(push가 반영되면 PR은
      스스로 갱신된다). CLOSED/MERGED인 PR을 되살리지 않는다 — 그런 PR이
      보이면 사정을 보고에 적고 새로 만든다.

      ── 다음 스텝이 쓸 값 ──
      PR url을 보고에 적는다. 정본 integration-request의 마커는 그 뒤에 이
      url을 붙인다 — `LANDING REQUEST @ <tip> pr: <url>`(배치면 `batch:
      <id,...>` 뒤에). 리더는 `pr:`가 붙은 행을 PR 후보로 읽어 `gh pr
      merge`로 머지하고, 붙지 않은 행은 로컬 --no-ff로 머지한다 — 행의 그
      한 조각이 두 경로를 가른다. nudge의 첫 줄에도 같은 url을 싣는다.
      브랜치 동결은 다음 스텝의 규칙 그대로다 — push 뒤 커밋을 더 얹지
      않는다.
    done_when: |
      `<remote>/<브랜치>`가 HEAD와 같은 tip이고, OPEN 상태의 PR이 그 tip
      (headRefOid == HEAD)을 가리키며, PR url·번호가 보고에 있다. bare push는
      쓰지 않았다.
    next: integration-request

  await-landing:
    title: 착지 대기 (PR — 요청은 착지가 아니다)
    # 정본 워커의 이 자리에는 merge_ready.py 프로브가 접붙어 있다(대상이
    # 움직여 판정이 뒤집혔는지). PR 편성에서 대상은 원격 base이고 fetch 없이는
    # 움직인 것이 이 저장소에 보이지 않으므로, 같은 프로브에 `--fetch`를
    # 붙인다(대상 upstream이 추적하는 원격을 재기 전에 fetch한다 —
    # remote-setup이 <remote>/<base>로 둔 것). 판정 스크립트는 정본과 같다.
    awaits:
      probe: 'uv run --no-sync python tools/merge_ready.py --fetch --landed-exit'
      poll: 120
      timeout: 30
      describe: '원격 base가 움직여 이 브랜치의 판정이 뒤집혔는지 (fetch 후 0 ready / 1 재측정 / 3 rebase / 5 착지)'

  landed:
    checklist:
      # 정본과 같은 두 항목이고 첫 항목의 질문만 원격으로 옮겼다. 정본은
      # 「내 tip을 부모로 갖는 머지 커밋이 다른 로컬 브랜치에 있는가」를
      # 묻는데, PR의 머지 커밋은 원격 base에만 생기고 fetch 전에는 이
      # 저장소에 없다. 그래서 `--fetch`로 대상이 추적하는 원격을 먼저
      # fetch하고(remote-setup이 upstream을 <remote>/<base>로 두었다)
      # `--target @{upstream}`으로 그 base가 tip을 포함하는지 묻는다. 정본
      # 스크립트 그대로다 — 원격 이름은 git 설정에 있고 이 문자열에는 없다.
      # 원격을 매번 부르므로 poll을 정본(60)보다 넓힌다.
      poll: 120
      items:
        - id: merged
          describe: fetch한 원격 base(@{upstream})가 동결된 내 tip을 포함한다 — PR이 merge commit으로 착지했다
          check: 'uv run --no-sync python tools/landed_check.py --fetch --target @{upstream}'
        - id: frozen
          describe: 추적 파일에 미커밋 변경이 없다(브랜치가 동결된 상태다)
          check: 'git diff --quiet && git diff --cached --quiet'
