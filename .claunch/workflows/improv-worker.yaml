name: improv-worker
description: >
  자유 진행 워커 — 터미널 사용자(또는 리더 브리핑)가 주는 목표 하나가 한
  회차다: 목표 수립 -> 작업 -> 테스트(간소화 스위트, verify) -> 커밋·보고
  -> (사용자가 결정) 착지: 리더에게 master 통합 요청 또는 브랜치 동결 ->
  정리 -> 종료. master 머지는 리더 전권이다 — 워커는 어떤 경로로도 master를
  직접 머지하지 않는다. 전체 스윕 테스트(build+typecheck 포함)도 워커 몫이
  아니다 — 리더가 통합 시점에 모아서 한 번에 돌린다. 이 워크플로우는
  recur하지 않는다 — 한 세션이 한 회차(목표 하나)를 돌고, 회차가 끝나면
  세션 자체를 종료(kill)한다. 목표 하나 = 세션 하나 = 저널 하나다.
start: intake

# 이 런의 드라이버는 worker 역할 세션이다 — 리더가 실수로 워커 런을 몰지
# 못하게 막는다. 메시 밖 단독 세션은 역할이 없어 필터가 성립하지 않으므로
# 그대로 시작되고, 그 사실이 저널에 남는다.
filter_roles:
  type: whitelist
  roles: [worker]

steps:
  intake:
    title: 목표 수립
    instructions: |
      새 회차다 — 이번 회차의 목표 하나를 확정한다. 출처는 둘 중 하나다:
      터미널 사용자의 직접 지시, 또는 리더의 브리핑. 목표가 아직 없으면
      여기서 대기한다(회차는 목표가 생길 때 시작된다). 다음을 정해 보고에
      남긴다:
      - 목표와 범위(무엇이 포함되고 무엇이 제외되는가)
      - 작업 브랜치 계획: 새 기능(feature) 목표면 새 피처 브랜치를 만들어
        그 위에서 작업한다 — 기존 브랜치에 다른 기능을 얹지 않는다(같은
        목표의 이어지는 수정만 예외). 지금 경로가 워크트리 브랜치면 그
        위의 피처 브랜치, master 작업 디렉터리면 새 피처 브랜치 —
        master에는 직접 커밋도 머지도 하지 않는다(master 반영은 리더의
        통합 단계 전권)
      - 작업 위치 점검: 부모 세션(이 세션을 만든 세션 — 생성 브리핑의
        parent)과 같은 체크아웃에 서 있으면, 작업 전에 새 워크트리를
        만들어 그 안에서 진행한다 — 한 체크아웃을 두 세션이 공유하면
        서로의 편집과 브랜치 전환을 밟는다. 판별 절차: 자기 이름은
        $CLAUNCH_SESSION, 부모 이름은 생성 브리핑에 있고, 각 세션의
        cwd는 `claunch sessions` 목록이 보여준다(들여쓰기가 부모-자식).
        자기 쪽 `git rev-parse --show-toplevel`과 부모 cwd에서의 같은
        명령(`git -C <부모 cwd> rev-parse --show-toplevel`)이 같은
        경로를 내면 공유다(경로 표기 차이를 git이 흡수한다). 부모
        cwd를 알 수 없으면(레코드 소거, 데몬 무응답) 보수적으로
        판정한다: `git rev-parse --git-dir`와 `--git-common-dir`가
        같으면 메인 체크아웃에 서 있는 것이므로 공유로 간주한다.
        새 워크트리는 관례 위치에 피처 브랜치로 만든다
        (git worktree add .claude/worktrees/<이름> -b <피처 브랜치>).
      - 완료 증거 기준: 테스트 수치(suite green N/N, 신규 K), 커밋 해시
      정본·공용 규칙(파서, 직렬화, 포맷, 공용 문서)에 닿는 목표면 착수 전에
      리더에게 fyi로 알려 다른 세션의 확정 규칙·진행 중 작업과 충돌하는지
      확인한다 — 같은 규칙을 두 세션이 다르게 정하는 사고를 여기서 막는다.
      메시에 속해 있으면 목표 요지를 리더에게 fyi로 남긴다.
    done_when: |
      목표·범위, 브랜치 계획(새 기능이면 새 피처 브랜치), 작업 위치
      판정(부모와 체크아웃 공유 여부 — 공유였다면 새 워크트리로 이동
      완료), 완료 증거 기준이 보고에 기록되어 있고, 정본 규칙에 닿는
      목표라면 리더 fyi까지 나갔다.
    next: work

  work:
    title: 작업 실행
    instructions: |
      피처 브랜치에서 목표를 구현한다. 커밋은 작고 초점 있게, 범위 밖
      (master, 공용 문서, 다른 세션의 워크트리)은 건드리지 않는다. 작업 중
      정본 규칙과 어긋나는 선택지가 나타나면 혼자 정하지 말고 리더에게
      물어 단일 규칙으로 기록되게 한다. 보고에는 바꾼 파일과 접근 방식
      요지를 남긴다.
    done_when: |
      intake에서 정한 범위의 구현이 피처 브랜치 커밋으로 존재하고(범위 밖
      파일은 건드리지 않았다), 바꾼 파일 목록과 접근 방식 요지가 보고에
      있다.
    next: review

  review:
    title: 테스트 (간소화)
    instructions: |
      바꾼 영역을 덮는 유닛테스트를 추가·확장하고 이 저장소의 간소화
      스위트(유닛테스트만)를 돌린다. 스위트 명령은 저장소마다 다르므로
      정본은 명령을 박지 않는다 — 저장소별 명령은 프로젝트 레이어
      (.claunch/workflows/ 오버라이드)가 verify로 담고, 오버라이드가
      없으면 보고의 수치와 저널이 판정 근거다. 전체 스윕(build+typecheck
      포함)은 여기서 돌리지 않는다 — 시간이 길어 회차를 막고, 리더가 통합
      시점에 배치로 한 번만 돌리는 것이 이 편성의 규칙이다. 보고에는
      수치(전체 N/N, 신규 K)와 커버한 시나리오를 남기고 "간소화 스위트
      기준"임을 명시한다. 실제 화면·CLI 동작 확인이 의미 있는 변경이면 그
      증거(방법과 결과)도 함께 남긴다.
    done_when: |
      바꾼 영역을 덮는 신규·확장 테스트가 존재하고, 보고에 수치(전체 N/N,
      신규 K)와 "간소화 스위트 기준" 명시가 있다.
    # 저장소 특화 verify는 정본이 아니라 프로젝트 레이어(.claunch/workflows/)에.
    # --no-sync인 이유: 게이트의 검증 명령이 환경을 변형해서는 안 된다. sync는
    # .venv를 재설치하려 들고, 그 안의 claunch.exe로 떠 있는 데몬이 파일을
    # 잡고 있으면 교체에 실패해(os error 5) 검증이 아니라 게이트가 막힌다 —
    # 워크트리 준비는 작업 중에 'uv sync --extra test' 한 번으로 끝내고,
    # verify는 이미 준비된 환경을 쓰기만 한다(--extra test는 sync 없이는
    # 의미가 없어 함께 뺀다. 그 한 번의 sync가 -n 8이 쓰는 xdist도 함께
    # 깔아 두므로, 준비되지 않은 워크트리에서는 verify가 아니라 준비가
    # 먼저다).
    # -n 8: 이 스위트는 병렬 안전하다(무거운 e2e는 전부 OS 임시 포트,
    # conftest는 테스트마다 tmp 홈+env 격리). 폭이 8인 건 실측 결과다 —
    # 직렬 532s, n=4 230s, n=8 178s, n=auto(이 머신 32) 184s. 32 워커는
    # 8보다 빠르지도 않으면서(프로세스·I/O 바운드라 코어를 더 줘도 안 는다)
    # PTY 타이밍 테스트를 굶겨 3회 중 1회 산발 실패를 냈다. 게다가 게이트는
    # 세션 6개가 동시에 돌린다: 6×8=48은 감당하지만 6×32=192는 아니다.
    # basetemp가 짧고 세션별이어야 하는 건 취향이 아니라 한계다: xdist가
    # basetemp 아래 popen-gwN/을 끼우는데, 트랜스크립트 테스트는 cwd 절대경로를
    # 슬러그로 파일명에 되감는다 — basetemp 한 글자가 두 번 쓰여 경로 =
    # 2×basetemp+162. 260자(MAX_PATH)를 넘으면 FileNotFoundError다. 실측:
    # basetemp 48자는 258자로 통과, 49자는 260자로 실패(한 글자 차이), 옛
    # pt-* 는 272자. C:/t/<세션>은 178~204자로 여유 ~56자. 그리고 pytest는
    # 시작할 때 basetemp를 자기 것으로 비우니 고정 경로면 동시에 도는 워커끼리
    # 서로의 tmp를 지운다. verify는 cmd.exe를 거치므로 %CLAUNCH_SESSION%이 그
    # 자리에서 세션 이름으로 확장된다. tests/test_project_layer_override.py가 못박는다.
    verify: 'uv run --no-sync pytest tests -q -m "not worktree" -n 8 --basetemp="C:/t/%CLAUNCH_SESSION%"'
    next: commit

  commit:
    title: 커밋·보고
    instructions: |
      저장소 관례(한 줄 요약 — 「무엇을 어떻게」)로 커밋한다. 워크트리
      브랜치 위에서 작업했으면 피처 브랜치를 워크트리 브랜치에 --no-ff로
      머지해 한 갈래로 정리한다 — 이 머지의 상한은 워크트리 브랜치까지다.
      master는 어떤 경우에도 머지 대상이 아니다(머지는 리더 전권).
      그리고 완료 보고를 만든다: 목표, 브랜치,
      기능 커밋·머지 커밋 해시, 테스트 수치. 메시에 속해 있으면 같은 내용을
      리더에게 fyi로 보낸다 — 이 증거 묶음이 머지 심사의 근거가 된다.
    done_when: |
      커밋(워크트리 작업이면 --no-ff 머지까지)이 만들어졌고, 목표·브랜치·
      커밋 해시·테스트 수치가 담긴 완료 보고가 기록되었다(메시 가입 시
      리더 fyi 포함). master는 움직이지 않았다.
    next: landing

  landing:
    title: 착지 결정
    select:
      # 착지는 사용자 권한 — 워커가 스스로 master행을 정하지 않는다.
      # 어느 쪽을 골라도 워커가 master를 머지하는 일은 없다 — 머지는 리더 전권.
      prompt: |
        이번 목표가 브랜치에 커밋되고 스위트가 green이다. 지금 리더에게
        master 통합 심사를 요청하는가, 아니면 브랜치를 동결해 두고(리더의
        일괄 통합 대기 등) 이 회차를 마감하는가? 어느 쪽이든 master 머지
        자체는 리더의 통합 단계에서 실행된다 — 이 워커가 하지 않는다.
        워커에게: 제안은 select 도구로 남기되 확정은 사용자의 것이다 —
        CLI(claunch cflow select)로 스스로 확정하지 않는다. 결정까지
        대기가 프로토콜이다.
      chooser: user
      options:
        request:
          description: 지금 리더에게 통합 요청 — 먼저 통합 대상 브랜치로 rebase해 최신화한 뒤 증거 묶음을 만들어 올린다(머지 실행은 리더)
          next: rebase
        hold:
          description: 브랜치 동결(추가 커밋 없음) — 통합은 나중에, 정리로
          next: wrapup

  rebase:
    title: 리베이스 (머지 요청 전 정렬)
    instructions: |
      일반적인 pull request처럼 — 요청은 rebase 후에 한다. 통합 대상
      브랜치(요청을 받을 상위 브랜치: 리더면 master, 상위 워커면 그
      브랜치)가 내 브랜치의 분기점 이후 앞으로 움직였으면 지금 rebase로
      정렬한다. 원격이 있는 편성이면 먼저 대상을 fetch한다(로컬 전용
      편성은 불필요).

      분기 판별: `git merge-base <대상> <브랜치>`가 대상 tip인지, 또는
      `git rev-list <브랜치>..<대상>`이 비어 있는지 본다 — 비어 있으면
      대상이 분기 이후 안 움직인 것이고 rebase할 게 없다. 그 사실을
      보고에 한 줄 남기고 넘어간다. 비어 있지 않으면 분기가 벌어진
      것이다: `git rebase <대상>`로 내 변경을 대상 위에 얹는다. 충돌은
      대상이 정한 방향을 먼저 읽고 그 위에 내 변경을 얹어 해결한다 —
      지웠다고 보고하지 않는다.

      rebase했으면 간소화 스위트를 다시 돌려 여전히 green임을 확인하고,
      그 수치와 rebase 후 브랜치 tip 해시를 보고에 남긴다 — 이 재확인이
      없으면 rebase가 안전함을 아무도 보장하지 않는다.

      ── 금지의 경계 ──
      이 rebase는 내 브랜치의 기준점만 옮긴다 — master를 체크아웃해
      커밋하거나 master로 머지·push하는 금지는 그대로 살아 있다.
    done_when: |
      통합 대상 브랜치와의 분기 판별이 보고에 있고, 분기가 벌어졌으면
      rebase(충돌 해결 포함)와 간소화 스위트 재확인 수치·rebase 후 tip
      해시가, 안 벌어졌으면 그 한 줄이 있다. master는 건드리지 않았다.
    next: integration-request

  integration-request:
    title: master 통합 요청 (머지는 리더 전권)
    instructions: |
      이 단계는 통합을 요청하는 단계다 — 머지를 실행하는 단계가 아니다.

      ── 금지: 워커는 master를 직접 머지하지 않는다 ──
      master로의 git merge 실행, master 체크아웃 후 커밋·리베이스·
      cherry-pick, fast-forward로 슬쩍 반영, master로의 push — 전부
      금지다. 사용자가 승인했다는 이유로도, 리더가 응답이 없다는 이유로도,
      충돌이 없어 안전해 보인다는 이유로도 예외가 아니다. master 반영
      경로는 리더 워크플로우(improv-leader)의 통합 단계 하나뿐이다.
      이 런에서 master를 움직였다면 그 자체가 사고다.

      요청은 리더가 심사할 수 있는 증거 묶음으로 만든다:
      - 목표·범위, 브랜치 이름, 기능 커밋·머지 커밋 해시, 테스트 수치
        (간소화 스위트 기준임을 명시 — 전체 스윕은 리더의 통합 단계에서
        배치로 한 번 돈다)
      - git log master..<branch> / <branch>..master 양방향 차이 —
        master가 분기 이후 움직였으면 그 사실과 예상 충돌 지점을 명시
        (요청 전 rebase로 정렬했으므로 뒤처짐은 없어야 정상이다 — 남아
        있으면 rebase가 충분하지 않았던 것이므로 그 사실을 함께 적는다)
      - rebase했으면 그 사실과 rebase 전후 tip 해시, 재확인된 간소화
        스위트 수치
      - 이 브랜치가 다른 세션의 브랜치를 포함하면(git branch --contains)
        함께 실리는 작업이 무엇인지 명시
      이 묶음을 보고에 남기고 리더에게 통합 요청으로 보낸 뒤, 브랜치를
      동결한다(추가 커밋 없음). 리더가 없는 편성(메시 미가입)이면 같은
      묶음을 보고로 남기고 사용자에게 통합은 리더 세션 또는 사용자
      본인의 몫임을 안내한다 — 그 경우에도 이 워커가 대신 머지하지 않는다.
      리더가 rebase 재요청을 보내면(분기가 다시 벌어졌거나 미리 병합이
      충돌한다는 것) 브랜치를 동결 해제하고 rebase 단계로 돌아가 최신
      master 위로 다시 정렬한 뒤, 갱신된 증거 묶음으로 재요청한다 —
      PR 워크플로우처럼 재요청은 rebase 후에 간다.
    done_when: |
      증거 묶음(목표·범위, 브랜치, 해시, 수치, 양방향 diff, 포함 관계)이
      보고에 있고 리더에게 통합 요청이 나갔으며(리더 부재 시 사용자 안내로
      대체), 브랜치는 동결 상태다. master는 움직이지 않았다.
    next: wrapup

  wrapup:
    title: 회차 마감·정리
    instructions: |
      회차 잔류물을 정리하고 증거를 보고에 남긴다:
      - 잔류 테스트 서버·headless 브라우저 프로세스 종료 — 부모만 죽고
        자식 node가 살아남는 경우가 있으니 포트 점유(예: Get-NetTCPConnection)
        로 확인한다
      - 임시 파일(.tmp, DB 사본, 픽스처, 브라우저 프로필) 삭제, git status
        클린 확인
      최종 보고: 이 회차의 목표·커밋·테스트 수치·착지 상태(리더에게 통합
      요청됨 / 동결 — 브랜치 이름)를 요약한다. master는 이 런이 건드리지
      않았어야 정상이다. 동결 브랜치가 남았으면 리더에게 fyi로
      알려 통합 대기 목록에 오르게 한다.

      ── 세션 종료 ──
      이 워크플로우는 recur하지 않는다 — 이 회차가 이 세션의 처음이자
      마지막 작업이다. 최종 보고와 리더 fyi까지 마쳤으면 next로 런을
      end까지 진행해 done으로 만들고, 그 다음 마지막 행동으로 자기
      세션을 종료한다:
        claunch kill-session $CLAUNCH_SESSION
      (mesh의 kill 도구는 자기 자신을 거부한다 — 하위 세션 전용이므로
      자기 종료는 이 CLI 경로만 있다.) 이 명령이 데몬에 닿는 순간 이
      pane이 닫히므로, 종료 뒤에 할 일을 남겨 두지 마라 — 보고·fyi·런
      done이 전부 이 명령보다 앞이다. 순서를 지켜야 하는 이유: 먼저
      죽으면 런이 wrapup에 걸린 채 남고, 보고가 안 나간 채 죽으면 이
      회차의 증거가 세션과 함께 사라진다.
    done_when: |
      잔류 프로세스·임시 파일이 정리되어 git status가 클린하고, 회차 최종
      보고(목표·커밋·수치·착지 상태)가 기록되었다. (세션 종료 자체는 이
      게이트 뒤의 일이다 — done 이후 claunch kill-session으로 실행한다.)
    next: end
