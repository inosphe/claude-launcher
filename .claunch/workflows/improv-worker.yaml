name: improv-worker
description: >
  자유 진행 워커 — 터미널 사용자(또는 리더 브리핑)가 주는 목표 하나가 한
  회차다. 세션에 배정된 일감(큐)이 여럿이면 착지 요청 전까지 일감마다
  작업·테스트·커밋을 반복하고, 큐가 비면 배치 전체를 한 번에 착지 요청한다:
  목표 수립 -> 일감 확인(배정 이슈가 없으면 보드 탐색과 사용자
  확정) -> 브랜치 준비 -> [작업 -> 테스트(표적 실행, verify) -> 커밋·보고 -> 다음 일감]*
  -> 착지: 기계 확인이 깨끗하면 워커가 스스로 통합 요청, 깨졌을 때만
  상위 세션이 결정(요청 또는 브랜치 동결)
  -> 착지 대기: 답이 없으면 10분 간격으로 상위에 재촉을 반복하고, 상위가
  거절하면 그 거절을 보드에 정산한 뒤 사용자 승인 게이트를 거쳐 작업으로
  되감는다(승인 없이 되감기지 않는다)
  -> 착지 확인(머지가 git에 있는지 기계가 본다) ->
  정리 -> 큐 재확인(배정 일감이 남았으면 목표 수립으로 루프) -> 종료.
  master 머지는 리더 전권이다 — 워커는 어떤 경로로도 master를
  직접 머지하지 않는다. 이 금지에는 예외가 없다 — 터미널 사용자(운영자)가
  세션에 직접 "머지까지 해줘"라고 지시해도 워커는 실행하지 않는다. 할 일은
  하나다: 그 브랜치를 in_review로 올리고 LANDING REQUEST 코멘트를 남긴 뒤
  대기하며, 운영자에게는 "머지는 리더가 게이트를 거쳐 처리한다"고 말한다
  (실측 2026-09-20, claunch-97knp: 워커가 운영자 지시를 이 규칙보다 우선해
  네 건을 직접 --no-ff 머지했고, 사용자 판정으로 예외 없음이 확정됐다).
  워커가 하위 워커(improv-worker 자식 세션)를 둔
  중첩 편성이면 브랜치도 중첩된다 — 자식 브랜치들을 자기 브랜치에
  --no-ff로 모아 트리 구조를 보존하고, 상위 세션에는 다시 --no-ff 머지를
  요청한다. 머지 실행은 언제나 한 단계 위 세션의 몫이다. 부모가 중간
  워커(improv-mid)면 내 브랜치는 그 브랜치 위의 스택 PR(stacked pull
  request) 한 층이다 — 통합 요청은 그 부모에게, 기준 브랜치 대비로
  가고, 착지마다 오는 restack 공지에 기준 위로 다시 얹는다.
  전체 스윕 테스트(build+typecheck 포함)는 워커 몫이
  아니다 — 워커는 바꾼 영역의 테스트만 표적으로 돌리고, 전체는 리더가
  통합 시점에 모아 한 번, spawn한 subagent 안에서 돌린다. 이 워크플로우는
  recur하지 않는다 — 한 회차는 큐 하나·착지 하나다(큐의 일감이 여럿이어도
  브랜치와 착지는 하나다). 회차가 끝나면 wrapup 뒤의 queue-recheck가
  보드를 다시 읽어, 이 세션에 배정된 일감이 남아 있으면 같은 런 안에서
  intake로 돌아가 다음 회차(새 목표·새 브랜치·새 착지)를 돌고, 없으면
  end-gate를 지나 세션 자체를 종료(kill)한다. 착지 하나 = 회차 하나이고,
  저널은 런 하나다 — 회차마다 visit 카운터가 오른다. 큐를 채우는 것은
  리더·운영자의 배정과, wrapup의 생성 이슈 정산에서 워커가 스스로 만든
  이슈를 자기에게 배정하는 것(claunch-034c4)이다. 세션이 회차 중 만든
  이슈는 세 갈래로 간다 — 자식에게 배정(발견 즉시 work에서, 또는 wrapup
  정산에서 살아 있는 자식에게), 자기에게 배정해 다음 회차에 직접(self),
  착수할 수 없는 것만 풀(pool) — 그리고 그 전부가 누군가의 손에 있어야 세션이 끝난다
  (settle-check → settle-wait → settle-stall → end-gate).
start: intake

# 이 런의 드라이버는 worker 역할 세션이다 — 리더가 실수로 워커 런을 몰지
# 못하게 막는다. 메시 밖 단독 세션은 역할이 없어 필터가 성립하지 않으므로
# 그대로 시작되고, 그 사실이 저널에 남는다.
filter_roles:
  type: whitelist
  roles: [worker]

# 위저드의 Role 행이 worker를 고르면 이 워크플로를 자동 선택한다 —
# own filter_roles가 whitelist로 worker를 받으므로 모순이 없다.
default_role: worker

# 중첩 편성의 짝 — 이 런을 도는 워커가 spawn한 하위 워커도 이 런을 돈다
# (설명문과 intake가 말하는 "improv-worker 자식 세션"이 이것이다).
# 자식에게 런을 주고 싶지 않으면 spawn에 workflow: '-'를 댄다.
default_child_cflow: improv-worker

steps:
  intake:
    title: 목표 수립
    instructions: |
      새 회차다 — 이번 회차의 목표 하나를 확정한다. 출처는 둘 중 하나다:
      터미널 사용자의 직접 지시, 또는 리더의 브리핑. 목표가 아직 없으면
      여기서 대기한다(회차는 목표가 생길 때 시작된다). 다음을 정해 보고에
      남긴다:
      - 목표와 범위(무엇이 포함되고 무엇이 제외되는가)
      - 브랜치 요지: 목표·범위에서 짧은 이름 요지를 정한다. 실제 브랜치
        이름과 생성은 이슈 귀속을 확인한 뒤 `branch-setup` 단계에서 한다.
        이렇게 해야 재사용한 세션·워크트리에서도 이전 회차의 브랜치를
        새 목표에 재사용하지 않는다.
      - 스택 기준(부모가 중간 워커일 때): 부모가 리더가 아니라 워커
        (improv-mid를 도는 중간 워커 — 생성 task나 리더의 reparent 공지가
        말해 준다)면 내 브랜치는 스택 PR(stacked pull request)의 한 층이다.
        통합 대상은 master가 아니라 부모의 브랜치(스택 베이스)이거나 부모가
        지정한 선행 자식 브랜치(내가 그 결과 위에서 작업할 때)다 — 그
        기준 브랜치와 스택 순서를 보고에 적는다. 내 브랜치가 master에서
        잘렸는데 기준의 tip이 master와 다르면 착수 전에 `git rebase
        <기준>`으로 얹는다(커밋 전이면 참조 이동뿐이다). 완료 보고·통합
        요청의 수신자도 리더가 아니라 그 부모다.
      - 완료 증거 기준: 테스트 수치(suite green N/N, 신규 K), 커밋 해시
      - 선행 맥락(search): 목표를 확정하고 이슈를 만들기 전에 MCP `search`
        도구(Search anything — 모든 보드의 이슈와 코멘트, 세션의 오프닝
        태스크·노트·브리핑·보고를 한 번에 순위화한다)로 목표의 핵심어를
        검색한다. 쿼리는 목표 문장 하나, 필요하면 핵심 파일·기능 이름으로
        한두 번 더 한다(kind 기본값 all; 이 보드의 이슈만 볼 때 `beads`,
        세션만 볼 때 `sessions`). 결과 행의 `sessions`는 그 기록에 붙은
        세션의 현재 상태이고, 전문은 행의 `read` 값을 `search_read`에
        넘겨 읽는다. 같은 목표를 이미 다룬 이슈(중복), 이 목표가 기대는
        선행 작업, 지금 같은 영역을 잡고 있는 살아 있는 세션이 보이면 그
        id·세션과 관계 한 줄을 보고에 남긴다 — 중복이면 새 이슈를 만들지
        않고 그 이슈를 읽기 규칙대로 잡거나(take/join) 사유와 함께 사용자·
        리더에게 올린다. 관련된 것이 없으면 「선행 맥락 없음(쿼리: …)」을
        남긴다. 도구가 「not configured」로 거절하면 `claunch beads search
        "<핵심어>" --json`으로 대신하고 그 사실을 적는다.
      - 이슈(beads): 생성 task/context에 `issue: <id>`가 있으면(리더가 배정했든
        데몬이 오프닝 task에서 등록했든) `claunch beads show <id> --json`으로
        읽는다 — 그 본문이 목표이고, 같은 일로 이슈를 또 만들지 않는다.
        읽은 본문이 비었거나 자리표시 절뿐이면(데몬이 등록만 하고 규격은
        assignee 몫으로 남긴 형태) 새 이슈를 만들지 말고 오프닝 task
        설명으로 그 본문을 규격(`## 목표 / ## 범위 / ## 완료 증거 기준 /
        ## 출처`)에 맞춰 채운다 — 배정은 이미 서 있고, 비어 있던 것은
        내용이다.
        터미널 사용자의 직접 지시면 지금 만든다: `claunch beads create "<제목>"
        --type task --priority 2 --labels user-direct --assignee
        $CLAUNCH_SESSION --description "<규격>"`. 리더가 배정한 이슈가 따로
        있는데 사용자 지시가 다르면 사용자 쪽을 잡고, 리더 배정 이슈는
        `claunch beads update <그 id> --status open`으로 되돌린 뒤 `claunch
        beads comments add <그 id> "DECLINED: user-direct <새 id> took
        precedence"`를 남긴다(리더가 재배정한다) — 판단 없이 기계적으로.
        어느 쪽이든 마지막에 `claunch beads update <id> --status in_progress
        --external-ref <run id>` — 이 전이가 회차의 시작이고, id는 intake
        fyi에 함께 실린다. 전이하는 것은 주 이슈 하나다 — 큐의 나머지는
        아래 큐 항목이 다룬다.
        어느 경로에도 해당하지 않아 이슈가 서지 않았으면 여기서
        지어내지 않는다 — 그 사실과 사유만 보고에 적고, 판정과 처리는
        다음 단계(일감 확인)가 맡는다. 사유는 추측이 아니라
        오프닝에서 읽는다: 생성 요청이 무이슈였으면 오프닝에 `no issue:`로
        시작하는 줄이 있고, 그 줄이 두 답 중 어느 쪽인지까지 말한다
        — 「wait for instructions」(보드를 뒤지지 말고 오프닝 태스크가
        목표다, 태스크도 없으면 사용자의 지시를 기다린다) 또는
        「assign yourself」(보드에서 스스로 골라 잡는 것이 이 세션의
        일이다). 그 줄이 아예 없으면 무이슈 지시가 아니라 이슈가 서지
        못한 것이다.
        재방문 회차(queue-recheck가 next-round로 보낸 것 — status의 visit이
        2 이상)면 오프닝의 `issue: <id>`는 앞 회차의 것이고 이미 닫혔거나
        HOLD다. 이때의 주 이슈는 큐의 첫 일감(priority 오름차순 → created_at)
        이다 — 그 id를 `claunch beads show <id> --json`으로 읽고 위와 같은
        규칙으로 규격을 채우고 in_progress로 전이한다. 앞 회차의 브랜치·
        보고서·handoff 이슈는 그 회차의 것으로 남고, 브랜치는 branch-setup이
        새로 판다.
        후속 구현 이슈(assignee 없이 만들어진 것 — wrapup의 인수인계 규칙)도
        이 읽기 규칙이 그대로 목표 경로다: 규격의 출처(원회차 id와 HOLD/마감
        코멘트)가 연결이다.
      - 큐(이 세션에 배정된 나머지 일감): 공통 규칙의 큐 명령
        (`claunch beads list --assignee $CLAUNCH_SESSION --status open
        --status in_ready --status in_progress --limit 0 --json`)으로
        읽는다. 지금 in_progress로 전이하는 것은 주 이슈 하나뿐이고,
        나머지는 상태를 손대지 않은 채 순서(priority 오름차순 → created_at)
        대로 id·제목을 보고에 적는다 — 그 목록이 이 회차의 배치 후보이고,
        커밋 뒤 queue-next가 같은 명령으로 다시 읽어 다음 일감을 고른다.
        큐가 주 이슈 하나뿐이면 배치는 그 하나이고 루프는 한 번 돈다.
        주 이슈와 무관하거나 같은 브랜치에 실으면 안 되는 일감(다른
        정본 규칙, 다른 저장소 영역, blocked)이 큐에 있으면 그 판정과
        사유를 함께 적는다 — queue-next가 drained를 고를 근거다.
      정본·공용 규칙(파서, 직렬화, 포맷, 공용 문서)에 닿는 목표면 착수 전에
      리더에게 fyi로 알려 다른 세션의 확정 규칙·진행 중 작업과 충돌하는지
      확인한다 — 같은 규칙을 두 세션이 다르게 정하는 사고를 여기서 막는다.
      메시에 속해 있으면 목표 요지를 이슈 id와 함께 리더에게 fyi로 남긴다.

      ── beads(br) 규칙 — 공통 ──
      일감의 정본은 beads다: 세션이 한 회차를 쓸 일, 다른 세션·회차로 넘어갈
      일은 이슈로 존재해야 한다(존재·제목·범위·완료 기준·assignee·상태·
      의존·부모). beads에 두지 않는 것: 실행 기록(cflow 저널), 승인·선택
      (cflow ask/select), 그리고 사건 — 대화·답장·정정, restack 공지, 창
      순번처럼 지금 이 순간에만 뜻이 있고 되짚어 읽히지 않는 것(mesh).
      ── 기록은 코멘트에, 신호는 메시지에 ──
      되짚어 읽힐 것은 전부 코멘트다: 증거 묶음(브랜치·tip·기능/머지 해시,
      테스트 수치와 그 축·트리·환경, 양방향 diff, 포함 관계, 스택 위치,
      merge-tree 결과), 심사 한계와 테스트가 세우지 못하는 것, 그리고 판정
      마커 — `LANDING REQUEST @ <hash>` / `REBASE REQUESTED @ <hash>` /
      `REMEASURE REQUESTED @ <hash>` /
      `REVIEWED: pass @ <hash>` / `CHANGES REQUESTED: <무엇을>` /
      `HOLD: <이유>` / `BLOCKED: <게이트>` / `merged <hash>`. 코멘트는 산문
      문단이 아니라 (축, 트리, 값)의 줄로 적는다 — 보드는 저장소에 커밋되므로
      산문은 무게만 늘리고 되짚을 때 읽히지 않는다. 긴 묶음은 파일로 붙인다:
      `claunch beads comments add <id> -f <파일>`.
      **같은 것을 메시지 본문에 다시 싣지 않는다.** 메시는 상대 터미널에
      타이핑되므로 본문은 수신자 수만큼 곱해 남의 컨텍스트에서 나가고, 기록으로
      보낸 것은 아무에게도 답을 요구하지 않으면서 그 값을 치른다. 메시지는
      nudge다 — 네 줄 안에 이슈 id와 상태, 코멘트 마커, 판정을 바꾸는 값 한 줄
      (델타·미해결 한계 유무), 상대가 할 일. 상대는 그 id로 당겨 읽는다
      (`claunch beads show <id> --json`, `claunch beads comments <id>`; 표
      전체는 `claunch beads list --status in_review --json` 한 번이다).
      이 갈래가 서지 않는 자리가 하나 있다: 다른 머신의 멤버는 이 저장소의
      보드에 닿지 않는다(`claunch mesh members`의 machine이 다르면 그렇다).
      그 상대에게만은 묶음을 메시지로 보낸다.
      정본 규칙(파서·직렬화·포맷 같은 공용 규약, 판정식, 기준선)은 이슈가
      아니지만 되짚어 읽히므로 보드에 산다: `--type doc` 이슈 하나를 세우고
      (assignee 없음 — `in_ready`로 전이하지 않는다) 갱신을 갈래로 나눠 쌓는다:
      **규범 내용(규약·정의·판정식)은 본문에 두고, 고칠 때 본문을 고친다.**
      코멘트에는 그 판정이 어떻게 서고 어떻게 정정됐는지의 이력을 쌓는다.
      doc에서만 앞 갈래가 뒤집히는 이유는 용도다 — 참조하러 온 사람은 본문
      하나를 읽고 닫으므로 본문이 지금 값이어야 한다. 규약을 코멘트로만
      쌓으면 본문이 낡고, 낡았다는 것을 알리는 경고도 exit code도 없다
      (`claunch-qj03` 실측).
      전원 브로드캐스트로 규칙을 배포하지 않는다 — 수신자 수만큼 곱해지는 데다
      나중에 합류한 사람에게는 닿지 않는다. 배포는 doc 이슈 id 한 줄이다.
      호출은 항상 `claunch beads <br 인자>` — 워크트리에서도 저장소 루트의
      .beads/beads.db 하나를 쓰고(--db를 대신 붙인다), 쓰기에 --actor
      $CLAUNCH_SESSION을 붙이며, DB가 없으면 `claunch beads`가 issues.jsonl에서
      스스로 만든다. 조회는 --json.
      **`.beads/issues.jsonl`을 직접 고치는 것은 금지다.** 보드의 실체는
      `.beads/beads.db`이고 jsonl은 그것을 내보낸 산출물이다. 손으로 쓴 줄은
      DB에 들어가지 않는다. 다음에 어느 세션이든 `claunch beads sync
      --flush-only`를 돌리면 DB 내용이 그 파일을 덮어쓰고, 손으로 쓴 내용은
      에러도 경고도 없이 사라진다. 반대로 jsonl에만 있고 DB에 없는 이슈가
      생기면 export의 stale 가드가 걸려 그 저장소의 flush가 전부 멈춘다
      (`claunch beads sync --help`). Edit·Write·`sed -i`·리다이렉션 어느
      것으로도 그 파일에 쓰지 않는다. 이슈를 만들고 고치고 닫는 길은
      `claunch beads` 하나다. jsonl에서 DB로 되돌리는 것이 정말 필요하면
      `claunch beads sync --import-only`이고, 그것도 사람의 판단이 있을 때다.
      이슈가 없을 때 만드는 자 = 그 일을 사람에게서 처음 받은 세션, 또는
      발견한 세션이다 — 리더가 아니다. 만들기 전에 `claunch beads search
      "<핵심어>" --json`과 open/in_ready/in_progress/in_review 목록으로 중복을 본다;
      있으면 create 대신 comments add. 규격: 제목 한 줄「무엇을 어떻게」,
      --description은 `## 목표 / ## 범위(포함·제외) / ## 완료 증거 기준 /
      ## 출처(누가·언제·원문)`, --labels에 출처 하나(user | user-direct |
      leader | handoff | found | review). 우선순위: P1 사용자가 보고한
      라이브 데몬·UI 고장과 master 빨강 / P2 사용자 지시·리더 배정(기본) /
      P3 인수인계·발견·후속·후보 / P4 아이디어. type은 task 기본, bug는
      회귀·결함, epic은 스택 부모, doc은 참조 전용(`in_ready`로 전이하지 않고 배정하지
      않는다). staged 순서: description이 먼저, --assignee가 마지막.
      상태 전이의 주인: open→in_ready는 리더(규격·우선순위 검토 완료) /
      open 또는 in_ready→in_progress는 assignee 워커(intake 끝,
      --external-ref에 run id; 터미널 사용자 직접 지시는 open에서 시작할 수 있음) /
      in_ready→open은 리더(규격·우선순위 재검토 필요) /
      in_progress→in_review는 assignee 워커
      (landing request) / in_review→in_progress는 리더(rebase·재측정 재요청) /
      in_review→closed는 assignee 세션이다 — 누가 배정했든 그 이슈를 끝까지
      관리하는 것은 assignee다. assignee 세션이 종료돼도 in_ready는 검토 결과를 유지하고,
      다음 adoption이 종료된 assignee를 교체한다. 닫는 자리는 wrapup 하나, 닫을 자격은 landed가
      git으로 증명한 머지 커밋 해시다(`claunch beads close <id> --reason
      "merged <머지 해시>"`; 중간 워커는 자기 --parent 자식을 같은 방식으로
      닫는다). 리더가 닫는 것은 둘뿐이다: assignee가 비었거나 그 세션이
      exited인 고아와, 중간 워커 자신의 스택 이슈 — improv-mid에는 landed에
      해당하는 게이트가 없어 자기 착지를 git으로 증명할 수단이 없고, 증명
      없이 닫는 것은 이 규칙이 막으려던 바로 그것이다(중간 워커가 닫는 것은
      landed 증거가 있는 자기 --parent 자식뿐이다). 그 둘에 한해 리더가
      닫고, 사유에 스윕 수치를 붙일 수 있으면 붙인다 / 아무
      상태→blocked는 그 게이트에 걸린 세션(`BLOCKED: <스텝>`), 해소되면
      같은 세션이 되돌린다 / reopen은 리더만. update --status closed는
      없다 — close뿐이다.
      ── open 풀 판정 기준 ──
      open 이슈 수는 그 자체로 정보가 아니다 — 라벨·배정·코멘트 마커를
      가르지 않은 원값은 살아 있는 일감 수를 과대 센다. 측정은
      `claunch beads list --status open --limit 0 --json`으로 우선순위·
      assignee·첫 라벨·코멘트 마커를 센 뒤 말한다(기본 행 제한 50은 판정
      근거가 아니다).
      살아 있는 일감: assignee가 살아 있는 세션이고 intake에서 in_progress
      전이(external-ref에 run id)를 한 것 / 리더가 배정·보류를 코멘트로
      남긴 것 / 위 우선순위 절의 P1에 맞는 것.
      정리 대상은 셋이고 판정은 개별이다 — 여럿을 한 번에 닫는 일괄 변경은
      없다:
      (1) merged 해시가 코멘트에 있는데 open인 것 — 닫을 자격은 이미
          증명됐다. assignee가 살아 있으면 그 wrapup에서, 없거나 소멸했으면
          리더가 닫는다.
      (2) 같은 규격(목표·범위·출처·우선순위)의 중복 — 존재 쪽을 남기고
          중복 쪽을 닫는다(사유에 존재 쪽 id). create 전 search가 생성을
          막고, 이 갈래는 이미 생긴 중복의 처리다. assignee가 없거나
          소멸했으면 리더가 닫는다.
      (3) SESSION ENDED 코멘트가 있고 assignee 없이 3일 지난 open — 리더의
          정리 대상이며 재배정이 먼저다: 배정 후보·우선순위·최근 갱신
          가운데 하나라도 있으면 재배정하고, 셋 다 없으면 닫는다(사유에
          판정 근거, 재발하면 리더만이 reopen한다).
      ── 큐(queue)·배치(batch) 규칙 ──
      세션의 큐는 보드에서 assignee가 그 세션인 활성 이슈(open·in_ready·
      in_progress·in_review)다 — 세션 레코드에 따로 적지 않고 보드 하나가
      정본이다. 순서는 priority 오름차순, 같으면 created_at 순. 읽는 명령은
      `claunch beads list --assignee <세션> --status open --status in_ready
      --status in_progress --limit 0 --json`. 배정(assignee 쓰기)은 리더·
      운영자의 것이다(예외: 세션이 스스로 만든 이슈 — 아래 「스스로 만든
      이슈는 만든 세션이 처리한다」 절) — 대시보드 Beads 페이지의 Queues 탭에서 카드를 세션
      행으로 끌면 데몬이 `update <id> --assignee <세션>` 하나를 대신 치고
      `QUEUED`/`UNQUEUED` 코멘트를 남긴다; 상태(status)는 손대지 않는다.
      한 세션의 큐는 브랜치 하나 위에서 배치로 처리된다: 일감마다
      in_progress 전이 → 작업·테스트·커밋 → 다음 일감, 큐가 비면(또는 배치
      상한 5개에 닿으면) 배치의 이슈 전부를 in_review로 올려 착지 요청은 한
      번이다. 마커는 이슈마다 `LANDING REQUEST @ <tip>`이고 주 이슈(오프닝의
      `issue: <id>`)의 마커 뒤에 `batch: <id,...>`가 붙으며 증거 묶음은 그 주
      이슈 코멘트 하나에 있다. 리더는 같은 tip의 행들을 후보 하나로 심사해
      한 번 머지하고, 닫는 것은 assignee가 이슈마다 `merged <해시>`로 한다.
      착수하지 않은 큐 일감은 회차 마감 뒤 워커의 queue-recheck가 다시
      읽는다 — 착수할 수 있으면 같은 런 안에서 다음 회차의 주 이슈가 되고
      (intake로 루프), 착수할 수 없는 것(blocked·다른 저장소 영역)만
      `update <id> --assignee ""`와 `UNQUEUED: <세션> landed without it`
      코멘트로 풀에 되돌린다.
      ── 스스로 만든 이슈는 만든 세션이 처리한다 ──
      워커가 회차 중 스스로 만든 이슈(work의 `found`, wrapup의 `handoff`)는
      만든 세션이 같은 런 안에서 처리한다(claunch-034c4, 2026-09-23 사용자
      지시 — claunch-qac7 Q1의 「워커 자기 배정은 원칙적으로 금지, 좁은
      self 예외만 제안」을 대체한다). 만들고 assignee 없이 backlog로 두는
      것이 기본값이던 동안 그 이슈들은 처리되지 않고 쌓였다(s586). 그래서
      배정은 wrapup의 생성 이슈 정산에서 워커가 직접 친다 — 항목마다:
      (1) **spawn** — 살아 있는 자식(`children`)이 있고 그 이슈가 그 자식의
      영역이며 그 자식의 런이 아직 queue-recheck 앞에 있으면(`claunch
      cflow status -t <자식> --json`의 `step_id`가 queue-recheck·settle-*·
      end-*가 아니고 런이 done이 아니다 — 지난 자식은 큐를 다시 읽지
      않는다) 그 자식에게(`update <id> --assignee <자식> --add-label
      delegated` + `DELEGATED: from <원회차 id> to <자식>` 코멘트 + 자식에게
      mesh 한 줄 — 자식의 queue-next/queue-recheck가 보드로 읽는다; 자식이
      착수 전에 종료되면 데몬이 `delegated` 라벨을 보고 풀에 되돌리고
      `DELEGATION RELEASED` 코멘트를 남긴다), 또는 work의 위임 조건을
      만족하면 새 자식을 `--issue <id>`로 세운다; (2) **self** — 그 밖에는
      자기에게(`update <id> --assignee $CLAUNCH_SESSION` + `SELF-QUEUED:
      from <원회차 id>` 코멘트) — queue-recheck가 그것을 읽어 같은 런
      안에서 다음 회차로 돈다; (3) **pool** — assignee 없이 남기는 것은 이
      세션이 착수할 수 없는 것(다른 저장소 영역, blocked, 범위·우선순위를
      사용자나 리더가 정해야 하는 것)뿐이고, 그 처분은 상위에게 ask로
      묻는다. self에는 런 단위 상한이 있다: 이 런의 intake 방문 수
      (`claunch cflow status --json`의 `visits.intake`)가 10 이상이면 self
      대신 pool로 보낸다 — 엔진의 loop guard(max_visits 25)는 26번째
      intake에서 런을 사람의 승인(`loop_limit`)으로 세우는데, 그 전에 범위
      판단을 상위에게 넘기기 위해서다. 리더는 거부권을 가진다(`update <id>
      --assignee ""` + `UNQUEUED by leader: <이유>`); 거부된 이슈는
      pool과 같이 상위의 처분을 따른다. 세션이 만든 활성
      이슈가 전부 누군가의 손(살아 있는 세션의 assignee, 또는 리더의
      `HOLD:` 코멘트)에 있어야 세션이 끝난다 — 워커의 settle-check가
      그것을 확인하고, 미충족이면 settle-wait가 시계로 기다린다(사람이나
      상위에게 묻지 않는다). 타이머가 여섯 번 깨우는 동안에도 안 서면
      settle-stall로 사람이 처분한다. 그러므로 이 리더가 그 보드 쓰기를
      하는 자리는 wrapup의 pool ask와 거부권 둘이다 — pool ask에 답하지
      않으면 워커는 기다리다 사람에게 넘어간다.
      br가 실패하면(잠금·바이너리 없음) --lock-timeout 5000으로 한 번 더,
      그래도 안 되면 mesh fyi 첫 줄에 `NO-BEAD:` + 위 규격 그대로 — 리더가
      다음 관제 대기에서 대신 만들고 id를 답한다. 이슈 없이 착수하는
      것만은 금지다.
    done_when: |
      목표·범위와 브랜치 요지, 완료 증거 기준, 선행 맥락 검색 결과(관련
      이슈·세션과 관계, 또는 「선행 맥락 없음(쿼리: …)」), 이슈 id와
      in_progress 전이(이슈가 서지
      않았으면 그 사실과 사유 — 다음 단계가 가른다), 큐의 나머지 일감
      목록(없으면 「큐 없음」)이 보고에 기록되어
      있고, 정본 규칙에 닿는 목표라면 리더 fyi까지 나갔다.
    next: issue-check

  issue-check:
    title: 일감 확인 (이 회차는 어느 이슈의 것인가)
    select:
      # 이 문이 chooser: agent인 이유 — 넷 다 보드와 생성 기록에서 읽을 수
      # 있는 사실이고, 게으름의 경로가 없다: 일이 적은 쪽(claimed·바로
      # work)은 이슈가 실제로 서 있어야 성립하고(commit 단계부터 코멘트가
      # 전부 그 id를 요구하므로 거짓 claimed는 바로 다음 스텝에서 막힌다),
      # 일이 많은 쪽(unclaimed)만이 탐색과 사용자 대기로 이어진다.
      # 무이슈 답이 둘로 갈린 이유 — 보드에는 둘 다 「아무것도 없다」로
      # 똑같이 보이고, 차이는 세션이 그 없음을 어떻게 다뤄야 하는가에만
      # 있다. 한 답이 둘을 겸했을 때 세션은 그것을 추론해야 했고, 무이슈로
      # 만들어진 세션이 보드에서 일감을 찾아 나선 것이 그 추론이다.
      chooser: agent
      require_reason: true
      prompt: |
        intake가 끝났다. 착수 전에 이 회차가 어느 일감(beads 이슈)의
        것인지 확정한다. 판정은 기억이 아니라 기록으로 한다:
        `claunch beads list --status in_progress --json`에 자기 세션
        ($CLAUNCH_SESSION)이 assignee인 이슈가 있는가(intake의 전이가
        실제로 보드에 쓰였는가), 없다면 오프닝에 join 안내(「너는
        assignee가 아니다」)와 이슈 id가 있는가, 그것도 없다면 오프닝에
        `no issue:`로 시작하는 줄이 있는가.
        그 줄이 있으면 생성 요청이 명시적으로 무이슈를 답한 것이고, 줄
        자체가 두 답 중 어느 쪽인지 말한다: 「wait for instructions」
        (`--no-issue`, 웹 폼의 「No issue — wait for my instructions」,
        바디 `beads: false`)이면 no-issue-wait, 「assign yourself」
        (`--no-issue-auto`, 웹 폼의 「No issue — it picks its own off the
        board」, 바디 `beads: "none-auto"`)이면 no-issue-auto다.
        무엇을 확인해 무엇이 나왔는지 reason에 적는다 — 그 줄을 봤으면
        어느 문구였는지 그대로 옮긴다.
        판정이 모호하면 unclaimed를 고른다 — 탐색과 사용자 확정이 한 번
        더 도는 쪽이, 이슈 없는 회차가 조용히 지나가는 쪽보다 싸다.
        특히 `no issue:` 줄이 보이지 않으면 무이슈 지시로 읽지 않는다:
        그 줄이 없다는 것은 요청이 무이슈였다는 뜻이 아니라 이슈가 서지
        못했다는 뜻이고, 둘은 다른 사건이다.
      options:
        claimed:
          description: 이슈가 서 있다 — intake의 전이(assignee)거나 join 참가. 브랜치 준비로 간다
          next: workspace-check
        no-issue-wait:
          description: 오프닝의 `no issue:` 줄이 「wait for instructions」다 — 보드를 뒤지지 않는다. 오프닝 태스크가 목표이고, 태스크도 없으면 사용자가 지시를 줄 때까지 기다린다
          next: workspace-check
        no-issue-auto:
          description: 오프닝의 `no issue:` 줄이 「assign yourself」다 — 보드에서 스스로 일감을 골라 잡는 것이 이 세션의 일이다. 사용자 확정은 생성 시점에 이미 받았다
          next: issue-auto
        unclaimed:
          description: 이슈도 없고 오프닝에 `no issue:` 줄도 없다 — 보드에서 연관 일감을 탐색하고 사용자 확정을 받는다
          next: issue-search

  issue-auto:
    title: 보드에서 스스로 일감 잡기 (무이슈 auto)
    instructions: |
      오프닝이 「no issue — assign yourself」라고 말한다: 배정된 이슈는
      없고, 보드에서 스스로 골라 잡는 것이 이 세션이 만들어진 이유다.
      그래서 이 갈래에는 사용자 확정(issue-decision)이 없다 — 그 확정은
      무이슈 답이 아예 없는 세션의 것이고, 여기서는 사용자가 생성 시점에
      이미 답했다. 같은 이유로 새 이슈를 민팅하지도 않는다: 사용자가
      요청한 것은 「보드에 있는 것을 잡아라」이지 「일감을 하나 만들어라」가
      아니다.
      후보는 `claunch beads list --status open --limit 0 --json`과
      `claunch beads list --status in_ready --limit 0 --json`으로 읽고,
      공통 규칙의 「open 풀 판정 기준」으로 살아 있는 일감과 정리 대상을
      가른 뒤 하나를 고른다. 순서는 priority 오름차순 → created_at.
      후보마다 MCP `search`로 그 이슈 id를 한 번 검색하면 이미 그 일을
      다룬 세션 기록(브리핑·보고)과 관련 이슈가 함께 나온다 — 누군가
      이미 끝냈거나 다른 이슈가 대체한 일감을 다시 잡지 않도록 이것으로
      확인한다.
      고른 이슈는 여기서 바로 잡는다 — 판정은 데몬 adoption과 같은
      규칙이다: assignee가 비었거나 그 세션이 종료됐으면 `claunch beads
      update <id> --assignee $CLAUNCH_SESSION`으로 잡고 이어서 `claunch
      beads update <id> --status in_progress --external-ref <run id>`,
      살아 있는 세션이 붙잡고 있으면 assignee와 상태를 손대지 않고
      `claunch beads comments add <id> "JOINED: $CLAUNCH_SESSION — <이번
      목표 요지>"`로 참가만 한다.
      고를 것이 없으면 지어내지 않는다: 「후보 없음」과 그 근거를 보고에
      적고 이슈 없이 오프닝 태스크만 가지고 진행한다.
      메시에 속해 있으면 무엇을 잡았는지 이슈 id와 함께 리더에게 fyi로
      남긴다 — 리더가 배정하지 않은 이슈를 이 세션이 가져간 것이므로,
      그 사실이 리더에게 닿지 않으면 같은 이슈가 두 번 배정된다.
    done_when: |
      고른 이슈 id 하나와 그 판정 근거(상태·assignee·그 세션의 생존
      여부·take인가 join인가), 잡기 명령의 결과(take면 in_progress 전이,
      join이면 JOINED 코멘트), 그리고 고르지 않은 상위 후보와 그 사유가
      보고에 있다. 고를 것이 없었으면 「후보 없음」과 그 근거가 있다.
    next: workspace-check

  issue-search:
    title: 연관 일감 탐색 (보드 기록에서)
    instructions: |
      이 세션에는 배정된 이슈가 없다. 착수 전에 보드에서 이 목표와 연관된
      기존 일감을 찾는다 — 보드를 읽는 데에는 허락이 필요 없고, 찾은 것을
      잡는 결정이 다음 단계의 사용자 몫이다.
      MCP `search` 도구(kind 기본값 all — 이슈·코멘트와 세션 기록을 함께
      본다; 전문은 행의 `read`를 `search_read`로), `claunch beads search
      "<핵심어>" --json`, open/in_ready/in_progress 목록(`claunch beads
      list --status open --json` 등)으로 후보를 모으고,
      후보마다 다음을 보고에 남긴다: id, 제목, 상태, assignee와 그 세션의
      생존 여부(살아 있는 세션이 붙잡고 있으면 잡기(take)가 아니라
      참가(join)가 된다 — 데몬 adoption과 같은 판정이다), 그리고 이번
      목표와 연관된다고 본 근거 한 줄. 후보가 없으면 「후보 없음」을
      남긴다. 다음 단계에서 결정하는 사용자가 읽는 것이 이 보고다.
    done_when: |
      후보 목록(각각 id·제목·상태·assignee·생존 판정·연관 근거) 또는
      「후보 없음」이 보고에 있다.
    next: issue-decision

  issue-decision:
    title: 일감 결정 (사용자 확정)
    select:
      # 이 문이 chooser: user인 이유 — 셋 중 둘이 사용자의 것이다: 기존
      # 일감을 잡는 것은 남이 세운 기록에 이 회차를 귀속시키는 결정이고,
      # 이슈 없이 진행하는 것은 일감의 정본(beads)에 이 회차가 안 남는
      # 결정이다. 에이전트의 선택은 제안으로만 기록되고, 확정은 사람의
      # `claunch cflow select`(또는 대시보드의 옵션 버튼)다. 이 갈래에는
      # 배정 이슈도 무이슈 지시도 없는 세션만 오므로, 사람을 세우는
      # 비용은 그 예외 편성에만 든다.
      # 공용 블록의 「이슈 없이 착수하는 것만은 금지다」와의 관계: 그
      # 문장은 br 실패(NO-BEAD) 경로가 조용히 무이슈로 흐르는 것을 막는
      # 것이고, 여기 none은 사람이 저널에 남기는 명시적 동의다 — br가
      # 실패해 이슈를 못 세운 상황은 none이 아니라 NO-BEAD 경로다.
      chooser: user
      require_reason: true
      prompt: |
        이 세션에는 배정된 beads 이슈가 없고, 직전 단계 보고에 보드에서
        찾은 연관 일감 후보(또는 「후보 없음」)가 있다. 이 회차를 어디에
        귀속할지 확정한다. adopt를 고르면 어느 id인지 reason에 적는다 —
        에이전트는 제안 시점에 추천 갈래와 근거(adopt면 후보 id)를
        reason에 적어 두고, 확정을 기다린다.
        모호하면 create 쪽으로 — 기록이 하나 더 있는 쪽이, 있어야 할
        기록이 없는 쪽보다 싸다.
      options:
        adopt:
          description: 보고의 후보 하나를 이 회차의 일감으로 잡는다(id는 reason에) — 잡거나 참가하는 것은 다음 단계가 실행한다
          next: issue-adopt
        create:
          description: 오프닝 task 설명에서 새 이슈를 민팅한다 — 규격과 민팅은 다음 단계가 실행한다
          next: issue-create
        none:
          description: 이슈 없이 이 회차를 진행한다 — 이 확정이 명시적 동의로 저널에 남고, 회차 기록은 cflow 저널·커밋·회차 보고서에만 남는다
          next: workspace-check

  # adopt와 create가 서로 다른 스텝인 이유 (2026-09-21, 사용자 지시).
  # 한동안 둘 다 `next: issue-claim`이었고, 그 한 스텝이 프롬프트 산문에서
  # 「adopt였으면 … create였으면 …」으로 갈라졌다. 그래서 엔진이 보는 그래프
  # 위에서는 두 선택이 같은 전이 하나였고 — 이 회차의 출발점이 그것이다 —
  # 갈래는 사람이 reason에 적은 산문에만 남았다. 그 산문은 기계가 읽을 수
  # 있는 입력이 아니다: require_reason은 reason이 비지 않았다는 것만 보장하고,
  # adopt가 요구하는 id가 그 안에 어떤 형식으로 있는지는 보장하지 않는다.
  # 실제로 그 산문을 다시 파싱해야 아는 것을 스텝이 지고 있었다.
  # 스텝을 나눈 뒤에도 id는 여전히 reason에서 온다(select에는 응답자가 값을
  # 실어 보내는 통로가 없다 — 옵션 이름 하나와 reason 하나가 전부다). 나뉘어
  # 달라진 것은 그 id를 어느 절차에 넣을지가 산문 해석이 아니라 전이 자체가
  # 정한다는 점이고, `claunch cflow status`와 대시보드가 둘 중 어느 쪽인지
  # 말한다는 점이다.
  issue-adopt:
    title: 일감 잡기 (adopt)
    instructions: |
      확정된 id를 reason에서 읽는다. 읽어낼 수 없으면 지어내지 않는다 — 그
      사실을 보고에 적고 상위에 한 줄로 묻는다(사람의 확정 reason이 유일한
      전달 통로이고, 그 통로가 비면 이 스텝은 진행할 수 없다). id를 읽었으면
      `claunch beads show <id> --json`으로 다시 읽고 다음을 판정한다.

      assignee가 비었거나 그 세션이 종료됐으면 `claunch beads update <id>
      --assignee $CLAUNCH_SESSION`으로 잡고, 이어서 `claunch beads update
      <id> --status in_progress --external-ref <run id>` — intake가 말하는
      회차 시작 전이가 이 자리로 미뤄진 것이다.
      살아 있는 세션이 붙잡고 있으면 assignee를 손대지 않고 참가만 한다:
      `claunch beads comments add <id> "JOINED: $CLAUNCH_SESSION — <이번 목표
      요지>"` — 데몬의 adoption 판정과 같은 규칙이고, 이때 상태 전이는 보유
      세션의 것이므로 하지 않는다.
      그 이슈의 본문과 이번 목표가 정확히 같지 않으면 본문을 덮지 말고 이
      회차가 맡는 범위를 코멘트로 남긴다.
      메시에 속해 있으면 목표 요지를 이슈 id와 함께 리더에게 fyi로 남긴다
      (intake에서 미뤄 둔 그 fyi다).
    done_when: |
      확정된 이슈 id가 보고에 있고, assignee가 자신이면 in_progress 전이가
      함께 기록되어 있다(join이면 JOINED 코멘트와 참가 사실).
    next: workspace-check

  issue-create:
    title: 일감 민팅 (create)
    instructions: |
      intake의 규격 그대로 새 이슈를 만든다 — 제목 한 줄 「무엇을 어떻게」,
      --description은 `## 목표 / ## 범위(포함·제외) / ## 완료 증거 기준 /
      ## 출처(누가·언제·원문)`(원문은 오프닝 task 설명), --labels에는 목표의
      실제 출처 하나(터미널 직접 지시면 user-direct, 리더 브리핑이면
      leader). staged 순서는 description이 먼저, --assignee
      $CLAUNCH_SESSION이 마지막.
      만든 뒤 `claunch beads update <id> --status in_progress --external-ref
      <run id>`로 회차를 시작 상태로 만든다.
      메시에 속해 있으면 목표 요지를 이슈 id와 함께 리더에게 fyi로 남긴다
      (intake에서 미뤄 둔 그 fyi다).
    done_when: |
      새 이슈 id가 보고에 있고, in_progress 전이와 external-ref가 함께
      기록되어 있다.
    next: workspace-check

  # ── 작업 위치 확인 ─────────────────────────────────────────────
  # 이 세 스텝이 issue-check/issue-auto/issue-decision/issue-adopt/
  # issue-create에서 오던 branch-setup 간선 여섯 개를 받는다. 자리를 여기로
  # 잡은 이유는 「어디서 일할 것인가」가 실제로 확정되는 마지막 지점이
  # branch-setup 직전이기 때문이다. 그 앞은 목표와 이슈 귀속을 정하는
  # 구간이라 위치를 판정할 근거(일감의 저장소)가 아직 손에 없고, 그 뒤는
  # 이미 브랜치가 서고 커밋이 쌓이기 시작한 구간이다.
  # 사용자 지시(2026-09-22, claunch-vc5ma): 「종종 improv-worker cflow 에서
  # 전혀 엉뚱한 저장소 경로 혹은 워크트리에서 작업을 시작하는 경우가 있는데
  # intake 이후에 작업 내용에 대해 경로가 타당한지를 체크하는 게이트를
  # 만들어줘. 합치한다면 문제없이 진행하고 합치 하지 않는다면 유저 승인
  # (approve)를 요구하는 게이트를 만들어줘.」
  workspace-check:
    title: 작업 위치 확인 (이 일감이 사는 저장소인가)
    select:
      # chooser가 agent인 이유와, 그것이 자기 편의가 되지 않게 하는 장치.
      # match를 고르면 사람 문 하나를 건너뛰므로, 고르는 자와 득 보는 자가
      # 같아지는 그 형태다. 그래서 match의 종점을 branch-setup이 아니라
      # workspace-ok로 두었다 — 그 스텝을 떠날 때 같은 판정이 verify로 한 번
      # 더 돌고, 거짓 match는 거기서 걸려 런이 나아가지 못한다. 거기서
      # 빠져나가는 길은 request_goto로 workspace-gate를 요청하는 것뿐이고,
      # 그것은 mismatch를 골랐을 때 도달하는 바로 그 승인이다. 즉 거짓
      # match로 아낄 수 있는 것이 없다.
      # mismatch 쪽에는 verify를 걸지 않는다. 그 갈래의 통과 조건은 명령이
      # 아니라 사람의 승인이고, 사람이 승인한 뒤에도 기계가 같은 불합치를
      # 다시 빨갛게 내면 승인이 아무것도 열지 못한다.
      chooser: agent
      prompt: |
        일감 귀속이 끝났다. 브랜치를 파기 전에 「지금 서 있는 곳이 이 회차의
        일이 속한 저장소인가」를 한 번 판정한다. 위치가 틀렸을 때 잃는 것은
        브랜치가 아니라 회차다: 엉뚱한 체크아웃에서 판 브랜치는 아무도
        심사하지 않는 트리에 쌓이고, 통합 요청에 가서야 그 사실이 드러난다.

        판정은 짐작이 아니라 명령의 종료 코드로 한다. 이 저장소에서는
        `uv run --no-sync python tools/workspace_check.py`가 그 명령이고
        (0 합치 / 1 불합치 / 2 판정 불가), 그 파일이 없는 저장소에서는 아래
        세 축을 직접 재고 무엇을 돌려 무엇이 나왔는지 reason에 적는다.

        세 축을 따로 재고 따로 보고한다. 축 하나가 재지 못하는 것은 흔하고
        그것만으로 불합치가 되지는 않는다. 참이 하나도 없이 셋 다 「재지
        못함」이면 판정 불가다.
        1. 일감의 저장소. 이슈가 description 앞머리에 적는 workspace 이름과,
           그 이슈를 민팅한 보드의 저장소(`source_repo_path`)다. 지금
           디렉터리가 그 저장소 안이어야 한다. 이슈 없는 회차에는 이 축이
           서지 않는다.
        2. 세션의 등록 위치. 데몬이 이 세션을 스폰한 디렉터리의 저장소다.
           디렉터리끼리가 아니라 저장소끼리 견준다 — branch-setup이 워크트리를
           파고 그리로 옮겨 가는 것은 워크플로가 시킨 일이므로, 둘째 회차부터
           세션은 스폰된 자리에 서 있지 않다. 저장소를 벗어난 것만 이 축이
           잡는다.
        3. 링크된 워크트리의 점유. 살아 있는 다른 세션이 같은 워크트리에 서
           있으면 작업 트리 하나에 기록자가 둘이고, 뒤에 온 쪽의
           `git switch -c`가 앞선 쪽의 파일을 밀어낸다. 메인 체크아웃은 이
           축에서 제외한다 — 공유는 흔하고, branch-setup이 워크트리를 파서
           그 경우를 스스로 푼다.

        모호하면 mismatch를 고른다. 승인 게이트 하나는 사람의 짧은 확인
        한 번이고, 틀린 위치에서 도는 회차는 작업·테스트·커밋·착지 요청
        한 바퀴다. 판정 불가도 mismatch로 보낸다: 재지 못한 것은 맞다고 잰
        것이 아니다.
        반대로 세 축이 서고 전부 참인데 「그래도 물어보는 편이 안전하지
        않나」로 mismatch를 고르지도 않는다 — 그 선택은 회차마다 사람을
        세우고, 그렇게 서는 문은 읽히지 않게 된다.
      options:
        match:
          description: 판정이 합치다 — 사람을 세우지 않고 브랜치 준비로 간다. 이 판정은 다음 스텝을 떠날 때 같은 명령으로 다시 잰다
          next: workspace-ok
        mismatch:
          description: 판정이 불합치이거나 어느 축도 재지 못했다 — 지금 위치에서 진행할지를 사용자에게 묻는다
          next: workspace-gate

  workspace-ok:
    title: 작업 위치 합치 (판정을 기계가 다시 잰다)
    instructions: |
      기계 판정이 합치였다. 이 스텝에서 할 일은 그 판정을 보고에 남기는 것
      하나다. 이 자리의 통과 조건은 보고가 아니라 이 스텝을 떠날 때 도는
      `verify:`이고, 그것이 앞 select의 match를 다시 재는 장치다(이 저장소에서는
      프로젝트 레이어가 `tools/workspace_check.py`를 접붙인다 — 그 파일이 없는
      저장소에서는 아래 done_when이 그 자리를 대신한다).

      보고에는 축별 줄과 종료 코드를 그대로 옮긴다. 어느 축이 「재지 못함」
      이었는지도 적는다: 합치 판정이 세 축 전부로 섰는지 한 축으로 섰는지는
      나중에 이 회차의 위치를 되짚는 사람이 필요로 하는 값이다.

      게이트가 여기서 빨갛게 나오면 앞 select의 match가 틀렸다는 뜻이다. 그때
      할 일은 보고를 고쳐 다시 내는 것이 아니다 — 승인 문으로 간다:
      `request_goto`에 `step: workspace-gate`와 사유(게이트 출력 그대로)를
      실어 사람에게 올린다. 승인 없이 이 자리를 지나가는 길은 없다.
    done_when: |
      작업 위치 판정의 종료 코드와 축별 줄이 보고에 있고, 판정이 합치다
      (불합치·판정 불가인데 이 스텝에 서 있는 것은 앞 select가 틀렸다는
      뜻이고, 그 처리는 위 instructions가 적는다).
    # 앞 select의 match를 여기서 기계가 다시 잰다. 이 무장이 없으면
    # workspace-check는 「사람 문 하나를 건너뛰는 선택지를 에이전트가 스스로
    # 고르는」 형태로 남는다 — 고르는 자와 득 보는 자가 같은 그 형태다.
    # verify가 붙어 있으면 거짓 match로 아낄 수 있는 것이 없어진다: 종료
    # 코드가 0이 아니면 런은 이 스텝을 떠나지 못하고, 빠져나가는 유일한 길이
    # request_goto로 workspace-gate를 요청하는 것, 즉 mismatch를 골랐을 때
    # 도달했을 바로 그 승인이다.
    # 종료 코드가 판정이고 0만 통과다: 1 불합치(일감의 저장소·세션의 등록
    # 위치·링크된 워크트리의 점유 중 하나가 깨졌다) / 2 판정 불가(데몬에
    # 닿지 못했거나, 이슈도 세션 레코드도 읽히지 않아 어느 축도 서지 않았다).
    # 2를 통과시키지 않는 이유는 재지 못한 것이 맞다고 잰 것이 아니기
    # 때문이다 — 그 자리는 사람의 승인이 받는다.
    # 읽기 전용이다. git rev-parse 두 번과 데몬 GET 세 번이 전부이고
    # 아무것도 쓰지 않는다.
    # tools/workspace_check.py가 yaml을 임포트하지 않는 이유는 게이트 규칙
    # 때문이다: `uv run --no-sync`는 워크트리 .venv를 비워 두므로
    # cli_beads.repo_root·beads_meta.workspace_of·workspaces.get이 닿는
    # store가 임포트되지 않는다. 그 해석은 데몬이 이미 해 두었고
    # (`GET /api/beads/<id>`가 워크스페이스 이름·등록 여부·경로를 함께 낸다),
    # 도구는 그것을 읽는다. tests/test_gates_run_this_checkout.py가 이 규칙에
    # 이 게이트도 함께 묶는다.
    verify: 'uv run --no-sync python tools/workspace_check.py'
    next: branch-setup

  workspace-gate:
    title: 작업 위치 불합치 — 사용자 승인
    # 왜 사람 문인가 — 이 판정을 대신 답할 수 있는 역할이 없다. 「이 세션이
    # 여기서 일해도 되는가」는 코드나 테스트에서 읽히는 사실이 아니라 이
    # 세션을 그 자리에 세운 사람의 의도이고, 상위 세션은 그 의도를 알기는
    # 해도 자기 워커의 위치를 스스로 승인하면 이 문이 막으려던 것을 그대로
    # 통과시킨다. `from`이 없으므로 응답자는 사람뿐이다(model.py: 「A human
    # is never an entry in `from`」).
    # timeout을 두지 않는다. 답이 없는 동안 이 런은 서 있고, 서 있는 것이
    # 맞다 — 시간으로 저절로 열리면 틀린 위치의 회차가 승인 없이 그대로
    # 돌고, 그것이 이 문이 막으려던 바로 그 사건이다.
    # on_decline을 두지 않는다. 사람 문에는 거절 입력이 없고(engine.approve
    # 뿐), 위치가 틀렸을 때의 올바른 처분은 다른 스텝으로 보내는 것이 아니라
    # 런을 접고 맞는 자리에서 다시 세우는 것이다 — 그 명령을 아래 prompt가
    # 적는다.
    ask:
      prompt: |
        이 회차의 작업 위치 판정이 합치하지 않았다. 워커가 서 있는 저장소가
        이 일감이 속한 저장소와 다르거나(불합치), 어느 축도 재지 못했다
        (판정 불가). 다음 스텝이 브랜치를 파는 자리이므로, 승인하지 않는
        동안에는 아무것도 만들어지지 않는다.

        지금 서 있는 위치 그대로 이 회차를 진행하는 것을 승인하는가?

        허가하면: 런이 브랜치 준비로 넘어가 이 디렉터리에서 피처 브랜치를
        파고, 이 회차의 커밋이 그 트리에 쌓인다. 위치가 실제로 틀렸다면 그
        커밋들은 통합 대상이 없는 저장소에 있으므로 착지하지 못하고, 회차
        하나를 맞는 자리에서 다시 세워야 한다.
        보류하면: 런은 이 게이트에 서 있고 세션은 살아 있다. 아직 브랜치도
        커밋도 만들지 않았으므로 잃는 것은 없다. 위치를 바로잡은 뒤 — 맞는
        워크스페이스에서 세션을 다시 띄우거나, 점유가 사유였다면 그 워크트리를
        쓰던 세션을 정리한 뒤 — 승인하면 그때의 위치에서 이어진다.
        이 세션이 여기서 일해서는 안 된다고 판단되면 런을 접는다:
        `claunch cflow abort`, 또는 대시보드의 Archive.

        판단 근거: 판정 명령의 출력이 앞 스텝의 보고에 축별로 들어 있다
        (`claunch cflow journal -n 3`). 손으로 다시 재려면 이 저장소에서는
        `uv run --no-sync python tools/workspace_check.py`이고, 세 축은
        일감의 저장소 / 세션의 등록 위치 / 링크된 워크트리의 점유다.
    instructions: |
      사용자가 지금 위치에서 진행하는 것을 승인했다. 이 스텝에서 할 일은
      기록 둘이다.

      보드에 남긴다: 이 회차 이슈에 `WORKSPACE OVERRIDE: <지금 저장소>
      (기대: <일감의 저장소>)` 한 줄과, 어느 축이 어떤 값으로 깨졌는지를
      (축, 값)의 줄로 붙인다. 이 브랜치가 왜 그 트리에 서 있는지를 나중에
      읽는 자리가 그 코멘트다. 이슈 없는 회차면 남길 곳이 없으므로 그
      사실을 보고에 적는다.
      메시에 속해 있으면 상위 세션에 fyi 한 줄 — 이 회차의 브랜치가 어느
      저장소에 서는지. 상위의 통합 대기 표는 그 값을 전제로 서 있다.

      그리고 **같은 턴에서** next를 밟아 브랜치 준비로 넘어간다 — 승인은
      났는데 아무것도 진행되지 않는 턴을 만들지 않는다.
    done_when: |
      사용자가 승인했고, 이 회차 이슈에 WORKSPACE OVERRIDE 코멘트가 서 있으며
      (이슈 없는 회차면 그 사실이 보고에 있다), 상위 세션에 fyi가 나갔다
      (상위가 없거나 닿지 않으면 그 사실을 적는다).
    next: branch-setup

  branch-setup:
    title: 작업 브랜치 준비
    instructions: |
      목표·범위와 이슈 귀속이 확정됐다. 이제 구현 전에 이번 회차만을 위한
      새 피처 브랜치를 만든다. 세션이나 워크트리를 재사용해도 이전 회차의
      브랜치를 계속 사용하지 않는다. master에는 직접 커밋하거나 머지하지
      않는다.

      먼저 목표·범위에서 만든 요지로 이름을 정한다. 이름은 항상 자기
      세션($CLAUNCH_SESSION)을 접두사로 둔 `<세션>-<요지>` 형식이다.
      같은 세션을 재사용해 이름이 이미 있으면 새로운 순번을 덧붙인다
      (`<세션>-<요지>-2` 등). 기존 브랜치를 선택하거나 덮어쓰지 않는다.
      하위 워커를 스폰할 계획이면 각 자식에도 별도 워크트리와 브랜치를
      주고, 자식 결과는 이후 커밋 단계에서 `--no-ff`로 모은다.

      브랜치 기준은 상위 통합 대상이다. 부모가 중간 워커면 부모 브랜치
      (또는 부모가 지정한 선행 자식 브랜치)를 기준으로 한다. 그 밖에는
      이 회차 시작 시점의 통합 대상 브랜치를 기준으로 한다. 기준을
      확인할 수 없으면 추정하여 현재 브랜치를 기준으로 삼지 말고, 상위에
      물어 답을 기록한 뒤 진행한다.

      작업 위치도 이 단계에서 판정한다. 부모 세션과 같은 체크아웃이면
      새 워크트리에서 작업한다. 자기 이름은 `$CLAUNCH_SESSION`, 부모
      이름은 생성 브리핑에 있고, 각 세션의 cwd는 `claunch sessions` 목록이
      보여준다. 자기 쪽 `git rev-parse --show-toplevel`과 부모 cwd에서의
      같은 명령(`git -C <부모 cwd> rev-parse --show-toplevel`)이 같은
      경로를 내면 공유다. 부모 cwd를 알 수 없으면 `git rev-parse
      --git-dir`와 `--git-common-dir`가 같은지 확인한다. 같으면 메인
      체크아웃이므로 공유로 간주한다.

      공유면 `git worktree add .claude/worktrees/<이름> -b <피처 브랜치>
      <기준>`으로 새 워크트리와 브랜치를 함께 만들고 그 경로로 이동한다.
      공유가 아니면 깨끗한 작업 트리인지 `git status --short`로 확인한 뒤
      `git switch -c <피처 브랜치> <기준>`을 실행한다. 미커밋 변경이 있으면
      버리거나 다른 회차의 브랜치에 새 목표를 올리지 않는다. 변경의 소유자와
      기준을 확인해 새 워크트리를 만들거나 상위에 보고한다.

      보고에는 목표에서 정한 요지, 새 브랜치·워크트리 경로, 기준 브랜치와
      기준 해시, 공유 판정, 실행한 생성 명령을 남긴다.
    done_when: |
      목표·범위에 맞는 새 세션 접두사 피처 브랜치가 존재하고, 작업 위치가
      그 브랜치를 가리킨다. 공유 체크아웃이면 새 워크트리 경로로 이동했으며,
      재사용한 세션·워크트리의 기존 브랜치는 선택하거나 덮어쓰지 않았다.
      보고에는 브랜치·기준 해시·작업 위치·공유 판정·생성 명령이 있다.
    next: work

  work:
    title: 작업 실행
    instructions: |
      피처 브랜치에서 목표를 구현한다. 커밋은 작고 초점 있게, 범위 밖
      (master, 공용 문서, 다른 세션의 워크트리)은 건드리지 않는다.

      **작업 중에는 통합 대상을 따라가지 않는다.** base를 최신으로 맞추는
      것은 이 단계의 일이 아니라 `rebase` 단계의 일이고, 그 단계는 착지
      요청을 고른 뒤에 온다 — 즉 **아직 요청하지 않은 회차에게 base
      신선도는 값이 0이다.** 커밋 전이면 리베이스는 참조 이동뿐이고, 커밋
      뒤라도 대상은 다시 움직이므로 미리 맞춘 값은 낡는다(한 교대에 상위가
      지정한 base가 12분 만에 두 번 낡은 것이 실측됐다). 그래서 상위의
      기준선 이동 통지는 **「이 해시로 잰 수치는 이제 낡았다」** 하나만
      뜻하고, 「지금 리베이스해라」가 아니다. 통지를 받고 할 일은 없다 —
      낡은 것은 아직 만들지도 않은 증거 묶음이다.

      **예외는 없다. 표면이 겹쳐도 마찬가지다.** 겹침은 양쪽이 끝나야
      정확히 알 수 있고, 그것을 푸는 기계는 전부 뒤에 있다: 내 `rebase`
      단계(`merge_ready.py`), 상위의 머지 단계(`mergecheck`, 통합 프리뷰
      스윕). 작업 중에 상위가 할 수 있는 유용한 일은 재정렬을 시키는 것이
      아니라 **겹치는 상대와 나를 잇는 것**(mesh-wire)뿐이고, 그 뒤 경계는
      우리 둘이 정한다. **상위(리더 또는 중간 워커)가** 그 밖의 형태로 base
      갱신·restack을 요구하면 이 문단을 근거로 거절하고 그 사실을 보고에
      적는다 — 한 교대에 그 요구가 실제로 나왔고, 거절한 워커가 옳았다
      (판정: claunch-no-premature-rebase-lhcz).

      작업 중
      정본 규칙과 어긋나는 선택지가 나타나면 혼자 정하지 말고 리더에게
      물어 단일 규칙으로 기록되게 한다. 범위 밖의 결함·회귀를 발견하면
      고치지 말고 그 자리에서 이슈로 남긴다 — `claunch beads create "<제목>"
      --type bug --priority 3 --labels found --parent <이 회차 이슈 id>
      --description "<규격>"`(assignee 없음) — 그리고 자기 일을 계속한다;
      발견한 세션이 만드는 자다.

      ── 발견은 서브 런으로 처리한다 ──
      그 절차(범위 판정 → 이슈 등록 → 위임 판정)는 `found-issue` 정의의
      서브 런으로 돈다: cflow `start` 툴에 `workflow: found-issue`,
      `sub: found-<n>`(발견마다 번호), `inputs: {parent: <이 회차 이슈 id>,
      summary: <한 줄 요지>}`를 주어 세운다. 그 뒤 `report`·`next`·
      `select`에 `run: found-<n>`을 주어 그 런만 진행시키고, 이 메인 런은
      이 스텝에 그대로 둔다 — run을 생략한 호출은 언제나 메인 런이다.
      발견마다 슬롯 하나이고 한 세션에 동시에 셋까지다. 이 스텝의
      awaits가 서브 런들의 종료를 데몬에게 재게 하므로, 서브 런이 끝나면
      통지가 온다 — 직접 폴링하지 않는다(손으로 볼 때는 `claunch cflow
      sub-done --all`, 0 = 도는 서브 런 없음). 판정·이슈 id·자식 세션은
      서브 런의 저널에 남고, 아래 보고에는 그 id들만 옮겨 적는다. 이
      스텝을 떠나기 전에 세운 서브 런은 전부 끝나 있어야 한다 — wrapup의
      생성 이슈 정산이 그 판정을 읽는다.

      ── 발견 즉시 가르는 것 하나: 위임(child) ──
      만든 이슈가 다음 넷을 전부 만족하면 지금 자식 세션에 넘긴다 — spawn
      `--issue <id>`(데몬이 자식을 assignee로 쓴다; 스폰은 공통 규칙이
      허용하는 배정 경로다): (1) 이 회차 브랜치와 파일·영역이 겹치지
      않는다, (2) 규격이 지금 서 있다, (3) 이 세션의 컨텍스트가 필요 없다,
      (4) 부모 회차의 착지 전에 끝나는 크기다 — 그리고 `children`이 남은
      슬롯을 답한다. 넷 중 하나라도 아니면 여기서 넘기지 않는다: wrapup의
      생성 이슈 정산이 self/spawn/pool로 가른다. 위임을 일찍 정하는 이유는
      병렬 시간이고, 직접 처리를 늦게 정하는 이유는 그것이 다음 회차의
      일이기 때문이다.
      자식의 태스크에 반드시 적는 세 줄: **기준 브랜치 = 내 브랜치 @
      <tip>, 통합 대상 = 그 브랜치(master 아님 — 내 commit 스텝이 --no-ff로
      모은다), 완료 보고·착지 요청 수신자 = 나**. intake의 스택 절은 중간
      워커(improv-mid)를 부모로 상정해 쓰여 있어, 일반 워커의 자식은 이 세
      줄이 없으면 master를 대상으로 읽는다. 스폰은 `worktree: <내 세션>-
      <요지>`와 `rebase_onto: <내 브랜치>`로 내 브랜치 위에 자른다.
      보고에는 바꾼 파일과 접근 방식 요지, 발견 이슈 id, 위임한 자식
      (세션·이슈 id)을 남긴다.
    done_when: |
      intake에서 정한 범위의 구현이 피처 브랜치 커밋으로 존재하고(범위 밖
      파일은 건드리지 않았다), 바꾼 파일 목록과 접근 방식 요지, 범위 밖
      발견이 있었다면 그 이슈 id, 위임한 자식이 있으면 그 세션·이슈 id가
      보고에 있다.
    # 이 스텝에서 세운 found-issue 서브 런이 끝나면 데몬이 알린다 — 그
    # awaits는 프로젝트 레이어가 접붙인다(이 저장소의 게이트 규칙: 명령은
    # 이 체크아웃의 tools/ 스크립트를 uv run으로 부른다). 다른 저장소는
    # `awaits: {sub: all}`로 같은 것을 적는다(claunch cflow sub-done --all).

    # 회차의 목표·범위·브랜치가 여기서 처음 전부 서 있다. 대시보드의 세션
    # 요약을 여기서 다시 쓰게 해 두면, 밖에서 보는 사람이 읽는 답이 이번
    # 회차의 것이 된다. 터미널에는 아무것도 타이핑되지 않는다.
    triggers: [briefing]
    # 이 스텝에서 세운 found-issue 서브 런이 끝나면 데몬이 알린다 — 그
    # awaits는 프로젝트 레이어가 접붙인다(이 저장소의 게이트 규칙: 명령은
    # 이 체크아웃의 tools/ 스크립트를 uv run으로 부른다). 다른 저장소는
    # `awaits: {sub: all}`로 같은 것을 적는다(claunch cflow sub-done --all).
    # 이 저장소의 그 probe. tools/sub_done.py는 `claunch cflow sub-done
    # --all`과 같은 종료 코드를 내되 이 체크아웃에서 돈다(0 = 도는 서브 런
    # 없음, 1 = 아직 도는 것이 있음, 2 = 판정 불가). 첫 측정은 기준선이라
    # 울리지 않고, 서브 런이 끝나 1→0으로 바뀔 때 한 번 알린다.
    awaits:
      probe: 'uv run --no-sync python tools/sub_done.py --all'
      describe: 이 회차가 세운 found-issue 서브 런이 전부 끝났다
    next: test-decision

  test-decision:
    title: 표적 테스트 실행 여부 결정
    select:
      chooser: agent
      require_reason: true
      prompt: |
        이번 변경에 표적 테스트를 실행할지 자율적으로 결정한다. 변경된
        영역의 회귀 위험, 테스트가 제공하는 검증 가치, 실행 비용을 확인하고
        `run` 또는 `skip`을 선택한다. 선택과 동시에 판단 근거를 reason으로
        기록한다. 판단이 불명확하면 `run`을 선택한다.
      options:
        run:
          description: 표적 테스트를 실행하고 결과를 기록한다.
          next: review
        skip:
          description: 표적 테스트를 생략하고 생략 사유를 기록한 뒤 진행한다.
          next: test-skipped

  test-skipped:
    title: 표적 테스트 생략 기록
    instructions: |
      표적 테스트를 생략한 선택과 reason을 보고에 그대로 기록한다. 테스트
      결과를 실행한 것처럼 작성하지 않으며, 생략으로 남는 검증 범위를
      명시한다.
    done_when: |
      표적 테스트 생략 선택의 reason, 생략 대상, 남은 검증 범위가 보고에
      기록되어 있다.
    next: commit

  review:
    title: 테스트 (표적)
    instructions: |
      바꾼 영역을 덮는 유닛테스트를 추가·확장하고, **바꾼 영역의 테스트만**
      돌린다. 스위트 명령은 저장소마다 다르므로 정본은 명령을 박지
      않는다 — 저장소별 명령은 프로젝트 레이어(.claunch/workflows/
      오버라이드)가 verify로 담고, 오버라이드가 없으면 보고의 수치와
      저널이 판정 근거다. 보고에는 수치(돌린 모듈 N개 M/M, 신규 K)와
      커버한 시나리오를 남기고 **무엇을 골라 돌렸는지(모듈 목록)**를
      명시한다. 실제 화면·CLI 동작 확인이 의미 있는 변경이면 그
      증거(방법과 결과)도 함께 남긴다.

      ★ **전체 스위트는 워커가 어떤 경로로도 돌리지 않는다.** 표적
      실행만이 이 스텝의 몫이고, 전체 스윕(build+typecheck+전체 스위트)은
      리더가 통합 시점에 배치로 한 번, 그것도 spawn한 subagent 안에서
      돌린다. 이 금지는 손으로 치는 명령만이 아니라 **이 스텝의 verify
      필드에도 적용된다** — 아래 「무엇을 검증했는가」가 못박듯 verify는
      그 스텝을 떠날 때 엔진이 돌리는 스윕이고, 손으로 치지 않으므로
      가장 안 보이는 스윕이다. 오버라이드를 쓰는 저장소는 그 자리에
      전체 스위트가 아니라 표적 선택 명령을 담는다.

      왜 표적인가 — 두 가지가 실측으로 확인됐다:
      · **시간**: 전체 스위트는 회차를 막는다. 이 저장소 기준 -n 8로 178초,
        직렬 532초다.
      · **오염**: 워커가 도는 전체 스위트는 판정이 아니라 잡음이 된다.
        세션 여섯이 각자 -n 8로 같은 스텝을 떠나면 48 프로세스가 서로의
        측정을 흔들고, 저널에는 스윕이 돌았다는 사실조차 안 남는다.
        게다가 깨끗한 브랜치의 워커는 남의 미커밋 파일을 함께 수집한
        공유 체크아웃보다 **항상 몇 건 적게 나오고, 그것을 자기가 깼다고
        읽는다** — 실제로 오염된 1562와 깨끗한 1559가 둘 다 "정본
        대조군"으로 돌아다녔다. 표적 실행은 이 축을 아예 만들지 않는다.

      선택이 비면 그것은 통과다 — 산문·워크플로 yaml·문서만 바꾼 회차가
      실제로 있다(그런 회차를 빨갛게 만들면 게이트를 통과하려고 테스트를
      꾸미게 된다). 빈 선택 뒤에 서는 것은 이 스텝의 done_when이다:
      보고에 수치와 시나리오를 요구하는 쪽이 그 자리를 받친다.

      ★★ **표적 게이트가 초록인 것은 트리가 초록이라는 뜻이 아니다.**
      좁힌 선택은 좁힌 만큼 못 본다 — 이것은 이 방식의 부작용이 아니라
      정의다. 선택은 「바뀐 파일 → 그것을 검사하는 테스트」 매핑으로
      만들어지는데, 그 매핑이 완전하다고 보증하는 것은 아무것도 없다.
      **이 규칙을 도입한 회차 자신이 그 자리에서 회귀를 통과시켰다**:
      리더 sweep verify를 pin하던 테스트 하나가 매핑에 없어 게이트가
      초록이었고, 나중에 돈 전체 스위트가 그 빨강을 찾았다.
      그래서 다음 셋 중 하나라도 해당하면 **표적 초록을 완료로 읽지 말고
      전체 스위트를 요청한다** — 요청하는 자리는 하나다: 그 이슈에
      `SWEEP REQUESTED: <셋 중 어느 것인가>` 코멘트를 남기고, 착지 요청
      묶음에도 그 사실을 한 줄로 적는다:
      · 워크플로·설정·스키마처럼 **여러 테스트가 이름으로 참조하는 파일**을
        바꿨다 — 매핑이 놓칠 수 있는 자리가 정확히 여기다
      · 공용 함수·시그니처·직렬화 포맷을 바꿨다(호출자가 어디 있는지
        선택이 모른다)
      · 고른 모듈 수가 **바꾼 파일 수에 비해 이상하게 적다** — 그것은
        「영향이 적다」가 아니라 「매핑이 비어 있다」의 신호일 수 있다.
        의심되면 `grep -rl "<바꾼 파일 이름>" tests/`로 직접 대조한다.
      전체 스위트를 도는 것 자체는 여전히 워커의 몫이 아니다 — 요청하는
      것이 워커의 몫이고, 도는 것은 리더가 배치로, subagent 안에서 한다.
      **리더에게 지금 스윕을 돌려 달라고 청하지 않는다.** 스윕 하나가
      요청 하나에 붙으면 그것이 브랜치당 스윕이고, 5분 통합 창이 막으려던
      비용이 그대로 돌아온다 — 창의 뜻은 그 안에 들어온 요청 전부가 스윕
      하나를 함께 쓴다는 것이다. 코멘트는 창을 앞당기지 않고, 이 브랜치가
      실릴 배치의 스윕이 그 요청의 답이다(리더의 close 사유에 그 수치가
      적힌다). 표적 초록만으로 착지 요청을 올리는 것은 막히지 않는다 —
      막히는 것은 「내 브랜치만을 위한 전체 스위트」다.

      ── 관련 표면: 테스트가 못 보는 거울을 사람이 본다 ──
      표적 선택은 「바뀐 파일 → 그것을 검사하는 테스트」만 잇는다. 그
      바깥에 테스트가 원리상 못 보는 것이 하나 있다: **같은 계약을 손으로
      거울처럼 베껴 둔 다른 파일**이다. 이 저장소의 spawn/new-session
      페이로드는 CLI 플래그·위저드 둘·웹 모달 두 모드·MCP 툴·API 라우트
      둘이 각자 쓰고, 「워크플로 없음」의 `"-"` 상수는 네 자리에 있다.
      한 사본만 고친 회차는 초록으로 착지한다 — 사본마다 자기 테스트는
      통과하고, 사본끼리 같은지를 묻는 테스트는 없다. 실측: 웹 모달의
      spawn 모드가 빈 workflow 행에 `"-"`를 안 보내는 불일치가 기존
      테스트 전부를 통과한 채 살아 있었다(claunch-3uef ASSESSMENT 1.2,
      claunch-ozpf). 같은 모양의 거울 누락이 세 번 더 있었고 각각 커밋
      두세 개를 더 써서 맞췄다.
      그래서 이 스텝은 수치 옆에 문장 하나를 더 요구한다. 저장소에 관련
      표면 도출 도구가 있으면 그것을 돌린다 — 이 저장소는
      `uv run --no-sync python tools/related_surfaces.py --base auto`
      (git 공변경 이력 · 명시 거울 표 · 그 파일을 이름으로 부르는
      테스트, 세 출처를 합쳐 파일마다 왜 올라왔는지를 적어 준다; 마지막
      줄이 `related surfaces: N to check, M touched by this diff, T naming
      tests (the gate runs them)`이고 — 이름으로 부르는 테스트는 표적
      게이트가 같은 규칙으로 골라 돌리므로 세지 않고 기록만 한다 — 그
      N이 아래 문장의 N이다).
      보고에는 **「관련 표면 N개 중 M개 점검, 나머지는 <사유>」** 한 줄을
      적는다 — 점검했다는 것은 그 파일을 열어 이번 변경이 거기에도
      들어가야 하는지를 봤다는 뜻이고, 안 봤으면 안 봤다고 적는다. 표면
      전부를 고치라는 요구가 아니다(거울이 아닌 공변경 이웃이 섞여
      있다) — 요구는 어느 것을 보고 어느 것을 안 봤는지가 보고에 있는
      것이고, 그 문장이 없으면 다음 사람은 거울이 있었다는 사실조차
      모른 채 심사한다. 도구가 없는 저장소는 바꾼 파일과 같은 계약을
      베낀 파일을 손으로 적는다(없으면 「관련 표면 없음」).

      ── 무엇을 검증했는가 ──
      수치는 그 자체로 판정이 아니다. 어느 트리를 어느 환경에서, 무엇과
      나란히 돌린 수치인지가 붙어야 판정이 된다.

      · 검증 대상 트리: 런 cwd가 검증하려는 트리와 다르면 스위트 명령에
        `--directory <절대경로>`를 박는다(워커는 자기 워크트리, 리더는
        master 체크아웃 — 방향이 반대다). --directory가 보장하는 것은
        cwd이고 그래서 rootdir·pythonpath가 그 트리를 가리킨다 = 검증
        대상의 절반. 나머지 절반(인터프리터·패키지·플러그인)은 그
        워크트리에서 `uv sync --extra test`를 1회 돌려야 자기 것이 된다:
        pytest는 콘솔 스크립트라 PATH에서 풀리고 uv는 워크트리 Scripts를
        앞에 얹을 뿐 메인 것을 걷어내지 않으므로, 워크트리 venv가 비어
        있으면 죽지 않고 조용히 메인 패키지로 돈다. 「내 소스를 남의
        패키지로」 검증한 상태가 아무 신호 없이 지나간다.
      · 어느 트리를 쟀는가는 스위트 안에서 답한다 — 표적 선택에
        `tests/test_tree_isolation.py`를 넣고, 그 모듈이 선택에 있었다는
        것을 보고에 적는다. 그 모듈은 지금 돌고 있는 pytest가 임포트한
        `claude_launcher.__file__`이 이 rootdir의 `src`인지 검사하고
        (`test_the_suite_imports_the_tree_it_is_run_from`), 자식 프로세스에
        같은 트리를 넘기는 PYTHONPATH 관용구도 검사한다
        (`test_a_child_process_is_handed_the_tree_the_suite_is_reading`).
        스위트 안에서 도는 검사라 스위트와 갈릴 수 없다는 것이 이 형태의
        값이다. 표적 선택은 바뀐 파일에서 만들어지므로 이 모듈이 저절로
        들어오지는 않는다 — 넣지 않으면 이 축은 안 잰 것이다.
        **이 모듈이 답하는 것은 트리 축 하나다.** 패키지 축(인터프리터·
        플러그인이 자기 워크트리 것인가)은 바로 앞 항목의
        `uv sync --extra test` 1회가 답한다. 두 축은 따로 답해진다.
      · 여기 있던 것은 맨 인터프리터를 띄워 `pytest.__file__`과
        `xdist.__version__`을 찍던 프로브였고 철회됐다(claunch-v5yp).
        명령을 여기 다시 적지 않는다 — 이 산문에 박혀 있었다는 것이
        그것이 매 회차 재배포된 경로다. 틀린 자리가 셋이다:
        1. venv의 editable 설치가 맨 인터프리터에 메인 체크아웃 src를
           올리는데, pytest는 `pyproject.toml`의 `pythonpath=["src"]`를 ini
           파일이 있는 디렉터리 기준으로 풀어 `sys.path` 맨 앞에 꽂는다
           (`_pytest/config` `_decode_value`: `dp = self.inipath.parent` →
           `_configure_python_path`: `sys.path.insert(0, ...)`). 앞쪽
           삽입이라 pytest가 이긴다. 워크트리 `.venv`가 비어 있어도 스위트는
           워크트리를 읽는데 프로브만 메인을 가리킨다 = 위양성이다.
        2. `pytest.__file__`은 질문이 아니다. 질문은 어느 소스 트리를
           쟀는가 하나이고, 메인 venv의 pytest가 워크트리 src를 재는 것은
           정상이다.
        3. `uv run --no-sync`로 부르므로 빈 `.venv`에서는 명령 자체가
           ModuleNotFoundError로 죽는다 — 확인이 정작 필요한 상황에서
           실행되지 않는다.
        이 위양성은 실제로 두 세션에게 필요 없는 venv 재동기화를 시켰고
        멀쩡한 초록 하나를 잠깐 무효화했다. 그 기록은
        `tests/test_tree_isolation.py` 도크스트링에 있다.
      · 보고 규약은 순서가 있다. 뒤엣것은 앞엣것이 정해져야 뜻을 갖는다:
        1순위 **시작 시각과 소요 시간** — 구간이 정해진다. 잊었으면
              basetemp 디렉터리의 CreationTime이 시작 시각을 초 단위로
              돌려준다. 그래서 `--basetemp`는 실행마다 유일해야 한다:
              재사용하면 그 자리가 덮여 **연표가 지워진다**(충돌 방지보다
              이쪽이 큰 값이다). 덮이는 것은 실행이 끝날 때가 아니라 **다음
              실행이 시작될 때**다 — pytest는 명시된 basetemp를 시작 시점에
              rm_rf한다(`_pytest/tmpdir.py` getbasetemp). `-n`을 주면 첫
              테스트가 아니라 노드 기동 시점이라 더 이르다.
              **게이트는 이제 유일하게 준다 — 손댈 것이 없다.**
              tools/changed_tests.py가 `C:/t/<세션>c<MMDDHHMMSS>`를 만든다:
              세션은 접두사에 남아 프로세스 스캔이 여전히 주인을 짚고,
              세대는 접미사가 진다. 자기 세션의 오래된 것은 여덟 세대를
              넘기면 그 스크립트가 스스로 걷는다(남의 세션 것은 그 세션의
              증거라 건드리지 않는다).
              이 문단이 오래 틀려 있었다는 것을 남긴다. 여기 있던 지시는
              「유일 접미사는 스냅샷에 손으로 박아라, 엔진이 verify에 env를
              주입하지 않아 cmd가 확장할 수 있는 것은 `%CLAUNCH_SESSION%`
              뿐이다」였다. 그 제약은 **게이트 경로에 걸리지 않는다** —
              verify 다섯이 전부 파이썬 도구이고(changed_tests · sweep ·
              landed_check · report_check · deploy_check), 어느 verify 문자열에도
              `--basetemp`이 없다. 값을 고르는 자리는 cmd의 확장이 아니라
              파이썬 함수 안에 늘 있었다. 확장 제약을 전제로 세운 우회를
              회차마다 다시 박지 마라.
              **손으로 돌릴 때**는 이름을 직접 준다:
              `changed_tests.py --basetemp C:/t/<세션>-<요지>`, 또는 pytest에
              그대로. 다른 실행이 쓰고 있는 이름만은 재사용하지 마라 —
              살아 있는 실행의 fixture가 조용히 사라지고(실측: 7.6초 뒤
              마커 소실), 파일이 잠겨 있으면 대신 INTERNALERROR/WinError 32로
              터진다. 즉 이 결함은 평소에 조용하다.
              (cmd 문자열로 유일성을 만들어야 하는 자리가 생기면 `%RANDOM%`은
              쓰지 마라: 시스템 시계 시드라 해상도가 낮아 근접 호출이 같은
              값을 낸다 — 실측 3회 연속 동일값. `%TIME%`은 콜론 때문에
              경로로 못 쓴다.)
        2순위 **트리 해시** — 구간과 reflog로 검산된다. 스윕 도중 master가
              움직였으면 해시는 시작 시각 없이 정해지지 않는다.
        3순위 **통과·수집 수** — 해시가 확정될 때만 기준선과 비교한다.
              여섯 세션이 실제로 돌려 맞춘 대조라 지금 서 있는 검사다.
        4순위 **시간 배수** — 해시와 `-n`이 같을 때만. 근거 강도가 3순위와
              다르므로 한 쌍으로 적지 않는다: **검증 사례 1건 — 같은 트리·
              같은 명령·같은 `-n 8`으로 돈 5회에서 단독 3회(평균 64.3초)
              대 78초짜리 실제 스윕과 겹친 2회(평균 99.1초) = 1.54배.**
              겹침 여부와 상대의 규모는 라벨이 아니라 `C:/t` 연표에서
              복원해 확인했다(잔챙이 실행 다섯은 전부 2.4초 이하라 오염
              강도에서 제외됐고, 단독 3회는 직전 실행 종료 시각으로 단독임이
              확인됐다). **표본 5, 임계값은 미정** — 방향은 섰지만 어느
              배수부터 의심할지는 아직 정하지 않았다.
              그리고 같은 5회의 통과 수·실패 수·결과 집합은 전부 동일했다:
              **겹침은 시간을 늘렸지만 판정은 흔들지 않았다** — 시간을 못
              쓰는 것이 판정을 못 한다는 뜻은 아니므로, 배수 칸이 빈 수치도
              증거로 선다.
        그리고 수치는 항상 **(트리 해시, 축, 값)** 셋으로 적는다. 축을
        빼면 서로 다른 것을 센 수치가 같은 이름으로 돌아다닌다 — 실제로
        `-m "not worktree"` 축의 약 1450과 필터 없는 축의 1558이 둘 다
        "정본 대조군"으로 유통됐고, 100건 넘게 갈리는 것을 한동안 아무도
        안 물었다. 지금 이 편성에는 축이 셋이다: 워커의 **표적 선택**
        (회차마다 다르므로 고른 모듈 목록이 곧 축이다), 리더 스윕의
        **필터 없는 전체**, 그리고 과거 기록에 남아 있는 `-m "not
        worktree"`. 축을 옮길 때는 값만 옮기지 말고 축 이름을 같이
        옮긴다. (트리, 환경)도 함께 적는다.
        기준선 수집 수는 `--collect-only`(-n 없이, 1초 미만, 창을 쓰지
        않는다)로 얻는다 — 기준선을 얻으려고 스위트를 돌리지 않는다.
        수집 수는 「무엇을 돌릴 예정인가」이지 「무엇이 실제로 돌았는가」가
        아니다. 실행 축은 그 브랜치들을 실제로 합친 프리뷰 스윕이 덮는다 —
        각자 단독 수치만 있으면 그 칸은 비어 있는 것이다.
      · **죽은 실행의 세 값이 전부 `C:/t`에서 복원된다** — 라벨이나 산수로
        추정하지 마라. 세 값의 성격은 **시작 = 상한**(basetemp 생성이 명령
        시작보다 몇 초 늦다), **소요 = 하한**, **종료 = 하한**이고,
        **셋 다 같은 방향으로 보수적이라 겹침 판정에서 거짓 음성만 만든다**:
          시작 = basetemp 생성 시각
          종료 = **재귀 전체(파일 포함)의 최대 LastWriteTime — 종료의
                 「하한」이지 소요 추정치가 아니다** — 정확히는 「basetemp에
                 마지막으로 쓴 시각」이다. **끝까지 tmp를 쓰는 실행에서는**
                 실측과 1% 안쪽이었지만(11건), 마지막 90초 동안 tmp 쓰기가
                 없던 실행에서는 49% 짧게 나왔다. **그 반례는 깊이와 무관해
                 재귀에도 그대로 걸린다** — 아무 데도 안 썼으면 아무리 깊이
                 내려가도 그 시각을 못 만든다. **소요 근사로 쓰면 최대
                 절반이 잘리고 「겹친 게 없다」는 거짓 음성이 나온다.**
                 `Get-ChildItem <basetemp> -Recurse -Force |
                  Sort LastWriteTime -Desc | Select -First 1`
                 **이건 계측으로 고를 문제가 아니라 정의상 정해진다**:
                 세 후보(최상위 / popen-gw* 최대 / 재귀 전체 최대)는 전부
                 실제 종료의 하한이고 후보 집합이 포함관계(① ⊂ ② ⊂ ③)라
                 최대값은 후보를 넓히면 줄지 않는다 — **③ ≥ ② ≥ ①이 항상
                 참이고, 하한은 클수록 좋으므로 ③이 지배한다.** 어느 표본을
                 재도 ②가 ③보다 나을 수 없다. (참고로 한 기준 표본에서
                 ①은 실제의 0.8%, ②는 94%, ③은 98.3%였고, 다른 표본에서는
                 ②=③이었다 — 격차는 실행마다 다르므로 격차를 재서 고르면
                 결론이 흔들린다. 디렉터리 mtime은 자식이 추가·삭제될 때만
                 갱신되고 마지막 쓰기는 그 안의 파일에서 일어난다.)
                 workers=0이면 popen-gw*가 없으므로 재귀가 유일한 길이다
          규모 = `basetemp/popen-gw*` 개수(= 그 실행의 `-n`)
        **최상위 LastWrite는 종료가 아니다** — pytest가 하위에만 쓰므로
        일찍 멈춘다(실측 반례: 생성 21:26:34, 최상위 21:26:39, 실제 소요
        335.8초). 최상위로 교집합을 내면 「겹친 것이 없다」는 거짓 음성이
        나온다. **복원값은 어느 변종이든 하한이고 양쪽 끝이 다 잘린다**:
        **앞** — basetemp에 쓰기가 없는 수집·임포트 구간이 안 잡힌다
        (복원 0.2초 대 보고 2.50초); **뒤** — 마지막 구간에 워커 tmp 쓰기가
        없으면 그만큼 잘린다(복원 94.7초 대 실측 186.84초, 49% 손실).
        두 사례를 함께 읽어야 「하한」이 양방향이라는 것이 보인다.
        ②(popen-gw 디렉터리들의 최대)를 안 쓰는 이유가 하나 더 있다:
        **일관되게 낮은 게 아니라 때때로 맞고 때때로 낮아서** 보정할 수가
        없다(같은 세션의 손 실행 셋은 ②=③, 게이트분만 8초 벌어졌다 —
        마지막 쓰기가 디렉터리에 일어나면 같아지고 파일 내용으로 끝나면
        벌어진다).
        ★ **하한끼리 비교하면 「겹쳤다」는 확정할 수 있어도 「안 겹쳤다」는
        확정할 수 없다.** 오차가 한 방향(늘 실제보다 이르다)이라 거짓
        음성만 만들고 거짓 양성은 만들지 않기 때문이다. 그래서 **복원으로
        낸 「겹침 없음」은 전부 재확인 대상이고, 「겹침 있음」은 그대로
        유효하다** — 결론을 쓸 때도 「안 겹쳤다」가 아니라 「겹쳤다는 것을
        뒷받침하지 않는다」까지만 적는다. 정량 기준: **비겹침을 말하려면
        간격이 최소 2분은 되어야 하고, 그보다 좁으면 「미확정」으로 적는다**
        — 마지막 92초 동안 tmp에 안 쓴 실행이 실측됐으므로 수십 초짜리
        간격은 그 맹점 안에 통째로 들어간다.
        **규모와 지속 시간을 함께 읽어라**: 워커 0 + 수 초 = 탐침,
        규모 판별은 이 표로 한다:
          워커 ≥ 1 → xdist 스윕, 규모 = 워커 수. **실행량은 `popen-gw*`
                     안을 세야 나온다** — 워커가 있으면 최상위 하위는 늘
                     워커 수(예: 8)로 보이므로, 그 수를 직렬의 하위 수와
                     나란히 놓으면 규모를 거꾸로 읽는다
          워커 0 + 하위 수십 이하 + 수 초 → 탐침(무게 없음)
          워커 0 + 하위 수백 + 수 분 → **직렬 전체 스윕 — 창을 쓴다**
        `-n`이 없다는 것은 xdist를 안 썼다는 뜻이지 가볍다는 뜻이 아니다.
        실측에서 직렬 전체(하위 995, 387초+)가 `-n 8`(62~103초)보다 네 배
        오래 창을 물었다. 그리고 **개수로 규모를 읽지 마라** —
        직렬 실행도 프로세스는 여럿으로 보이고, 오늘 겹침 오귀속이 전부
        그 자리에서 났다. basetemp를 재사용하면 마지막 실행의 워커 수만
        남으므로, 유일 이름 규칙이 이 복원 전체의 전제다.
      · 겹침 판정의 시각은 **[생성, 종료]**로 잡는다(위 세 값으로 채운다).
      · 통과 수를 **귀속**에 쓰는 용법(이 수는 어느 트리에서만 나올 수
        있는가)은 `-q`가 rootdir을 지운 수치를 구제한다. 순서를 지켜라:
        **1순위는 rootdir을 안 지우는 것이고**, 이 서명은 이미 지워진
        수치를 사후에 건지는 도구다 — 뒤집으면 「어차피 수로 알 수 있으니
        `-q`로 돌려도 된다」가 되어 방금 겪은 문제로 되돌아간다. 그리고
        서명은 후보 트리들의 케이스 수가 서로 구별될 때만 트리를 지목한다:
        0개 추가는 서명이 없고, 같은 수를 더한 트리가 둘이면 서명이 겹친다.
      · 게이트 verify도 사후 복원된다 — 저널이 유일한 기록이 아니다.
        저널에는 명령 문자열만 남지만, `C:/t`의 basetemp가 나머지를 갖고
        있다: 시작·소요(하한)·규모에 더해 **실행량 = workers>0이면
        Σ(각 `popen-gw*`의 하위 개수), 아니면 basetemp 하위 개수.** 실측
        8건에서 그 실행이 보고한 수와 맞았고(실패가 있던 회차에서는
        통과 + 실패 = 실행량으로 맞았다) 값이 970·973·1075·1127로 갈리므로
        상수가 아니라 실제로 추적한다. **남는 것은 「어느 테스트가
        실패했는가」뿐이다.** 단 **실행량 ≈ 통과 + 실패이고 skip은 안
        센다** — skip은 tmp 픽스처가 돌기 전에 걸러진다. 수집 수와 비교할
        때는 skip 수를 빼라(이 저장소의 `-m "not worktree"` 축은 늘 1건을
        건너뛰므로 실행량 기준선은 970이다). 그리고 **테스트별 tmp가
        아닌 디렉터리가 섞이면 그만큼 늘어난다** — 모듈 스코프
        `tmp_path_factory` 하나가 하위를 하나 더 만들어 983 대신 985가
        나온 실사례가 있다. 즉 실행량은 「tmp를 쓴 단위 수」이지 테스트
        수 자체가 아니다. **그리고 이 값만 새는 방향이 반대다** —
        시작(상한)·소요·종료(하한)는 전부 보수적인데 실행량은 **과대 쪽**
        이다. 대조하기 전에 그 트리에 모듈·세션 스코프 tmp 픽스처가 있는지
        보고, 있으면 그 수만큼 빼거나 규모 지표로만 써라. 지금 이 저장소에
        그런 픽스처가 없어서 수가 정확히 맞는 것이고 파일 하나가 추가되면
        깨진다 — 저장소 상태의 성질이지 방법의 성질이 아니다.
      · 이 복원은 **basetemp가 안 덮였을 때만** 된다. 유일 이름 규칙과
        대체재가 아니라 보완재다 — 이름을 재사용하면 앞 실행의 연표도
        게이트 수치도 함께 지워진다.
      · 그래도 보고에 적을 수치는 자기가 재서 적는 편이 낫다 — 복원은
        가능하지만 다음 사람이 디스크를 뒤져야 하고, basetemp가 재사용되면
        그 자리가 덮인다. 그리고 같은 트리·같은 명령의 손 실행이 있으면
        **게이트 verify의 간접 대조군**이 된다(게이트는 stdout이 없어
        직접 대조가 안 되는데, 두 실행의 실행량·워커 수·소요가 나란히
        서면 서로를 검산한다) — 「수치는 자기가 돌려서 적는다」는 규율이
        그 대조군을 자동으로 만든다.
      · 단서: 이 저장소에서 실행량이 통과 수와 정확히 맞는 것은 `home`
        픽스처가 사실상 모든 테스트에 tmp를 만들기 때문이다 — **그건 이
        저장소의 성질이지 방법의 성질이 아니다.** 여기서는 정확한 값으로
        써도 되고, 다른 저장소에서는 「tmp를 쓴 테스트 수」로만 읽어라.
      · **추론하기 전에 자기 기록을 연다.** 남의 관측으로 추론하는 것보다
        자기 저널·로그를 여는 편이 늘 싸고, 답이 이미 거기 있는 경우가
        많다.

      ── claunch window가 측정 창을 배정한다 ──
      테스트 실행 전후의 획득·해제는 실행 도구가 처리한다. 프로세스 스캔과
      메시 선언으로 순번을 관리하지 않는다.
      · `tools/changed_tests.py`는 targeted 창을 획득한다. 머신 전체에서
        targeted 실행은 최대 5개이며, 각 실행은 선택된 테스트 모듈만 돈다.
      · `tools/sweep.py run`은 sweep 창을 획득한다. sweep은 용량 1이며
        targeted 실행을 포함한 다른 측정과 동시에 부여되지 않는다. sweep
        대기가 생기면 새 targeted 부여가 중단되고, 진행 중인 targeted가
        끝난 뒤 sweep이 시작된다.
      · `pytest`를 직접 실행해도 `tests/conftest.py`가 범위를 판정해 같은 창을
        획득한다. `tests` 전체 또는 인자 없는 실행은 sweep, 파일·nodeid를
        지정한 실행은 targeted다. 도구가 이미 획득한 경우 전달된 grant를
        재사용하므로 중복 획득이 발생하지 않는다.
      · 현재 상태는 `claunch window status`로 읽는다. 보유자·대기열·획득
        시각·용량이 데몬 상태로 출력된다. 이 출력은 진단과 보고에 사용하며,
        획득 판정은 실행 도구가 수행한다.
      · 창 부여 응답의 `advisory_n`은 CPU 수와 현재 활성 실행 수를 반영한다.
        `sweep.py`와 `changed_tests.py`는 기본 xdist `-n`에 이 값을 적용하고,
        영수증의 `window` 필드에 class·holder·source·wait_seconds·advisory_n을
        기록한다.
      · 데몬 또는 창 API를 사용할 수 없으면 sweep은 데몬 상태 디렉터리의 OS
        파일 잠금으로 직렬화한다. targeted는 용량 제한을 적용할 수 없다는
        경고와 함께 현재 기본 폭으로 실행된다. 운영자가 `CLAUNCH_WINDOW=off`를
        지정하면 모든 강제가 해제되고 시작 시 경고가 출력된다.
      · 표적 실행의 예상 시간이 길면 백그라운드에서 실행하고, 그동안 변경
        범위 검토와 기록 정리를 진행한다. 완료 전에 같은 트리를 다시 측정하지
        않는다. 영수증이 생성되면 후속 게이트는 같은 트리와 선택을 재사용한다.

      ── 재는 것과 주장하는 것 ──
      · 어떤 명령에 대한 주장인지와 실제로 실행한 명령이 같은지 먼저
        확인한다 — `python -c`로 `pytest`를 대신 재지 않는다.
      · 독립 확인은 결론이 같은지가 아니라 방법이 다른지를 본다. 같은
        방법으로 두 번 재면 표본만 늘어난 것이다.
      · 층이 다른 두 관측이 충돌하면, 어느 쪽도 틀리지 않고 둘을 가르는
        조건이 아직 안 드러난 것이다.
      · 철회도 근거가 닿는 데까지만 한다 — 「확정되지 않았다」와
        「아니다」는 다르다.
      · 「X로 읽지 마라」는 항상 「대신 Y로 읽어라」와 함께 쓴다. 금지만
        주면 재는 쪽이 흔들리고, 대체 측정을 주면 안 흔들린다.
      · 시각 범위로 증거를 거를 때는 **그 범위 자체가 미확정인지 먼저
        본다** — 미확정이면 범위 없이 훑는다. 남이 준 창 안에서만 찾으면
        그 창이 틀렸을 때 화면에 이미 있던 증거를 라벨이 가린다.
      · **표본 하나로 기법을 확정하지 않는다** — 두 변종이 그 표본에서만
        우연히 같은 값을 내면 차이가 안 보인다(위 종료 시각 셋이 그랬다:
        하위가 얕은 표본에서는 ②와 ③이 같다).
      · 기존 프로세스 스캔과 디스크 재구성은 시작 직후 1~3초 구간을 확인하지
        못했다. 창 상태의 acquired_at과 영수증의 wait_seconds를 기준으로
        실행 구간을 확인한다.
      · **좁혀 적은 판정은 전파되면서 넓어진다** — 「s35에 대해 겹침
        없음」이 한 다리 건너 「겹침 없음」이 된다. 판정을 옮길 때는
        그것이 무엇에 대한 판정이었는지를 같이 옮겨라.
      · **두 수치가 안 맞는데 아무도 안 묻는 자리를 발견 신호로 쓴다.**
        서로의 결론은 부지런히 깎으면서 서로의 수치가 어긋나는 것은
        지나치기 쉽다 — 오늘 1~3초와 8초가 같은 공지에 나란히 실린 채로
        지나갔다.
      · **두 규칙이 각자 맞는데 서로를 무력화하는 자리를 아무도 안 본다.**
        각 규칙은 자기 자리에서만 읽히고 한 화면에 같이 뜨지 않기 때문이다
        — 정리 규칙이 포렌식 기록을 지우던 자리가 그 실례다.
    done_when: |
      바꾼 영역을 덮는 신규·확장 테스트가 존재하고, 보고에 수치(M/M,
      신규 K)와 **골라 돌린 모듈 목록**이 있다(전체 스위트를 돌린 수치가
      아니다 — 그것은 이 스텝의 것이 아니다). 수치에는 트리 해시와
      (트리, 환경)이 붙어 있고, 실행 영수증의 window 필드(class·source·
      wait_seconds·advisory_n)가 보고에 있다. 관련 표면 문장이 있다 —
      「관련 표면 N개 중 M개 점검, 나머지는 <사유>」(도구가 있는 저장소는
      그 출력의 마지막 줄이 N의 출처다; 표면이 없으면 「관련 표면 없음」).
    # 저장소 특화 verify는 정본이 아니라 프로젝트 레이어(.claunch/workflows/)에.
    # 여기 있던 것은 `pytest tests -m "not worktree" -n 8`, 즉 1558건 중 약
    # 1450건(93%)이었다. 스텝의 산문은 줄곧 "전체 스윕은 여기서 돌리지
    # 않는다"였는데 명령은 사실상 전체를 돌렸다 — 산문과 명령이 정면으로
    # 어긋난 자리이고, 사용자가 "자꾸 워커가 full suite를 돌린다"고 신고한
    # 것이 바로 이 줄이다.
    # 표적 실행으로 바꾼 근거는 세 가지다:
    #  · 시간 — 전체는 -n 8로 178초, 직렬 532초다. 회차마다 이것을 물고 간다.
    #  · 오염 — 세션 여섯이 각자 -n 8로 같은 스텝을 떠나면 48 프로세스가
    #    서로의 측정을 흔든다. 그리고 깨끗한 브랜치의 워커는 남의 미커밋을
    #    함께 수집한 공유 체크아웃보다 항상 몇 건 적게 나오고 그것을 자기가
    #    깼다고 읽는다(오염된 1562 대 깨끗한 1559가 둘 다 "정본 대조군"으로
    #    돌아다닌 실사례). 표적 실행은 이 축을 아예 만들지 않는다.
    #  · 보이지 않음 — 이 파일의 review 산문이 스스로 적는다: verify 필드가
    #    있으면 그 스텝을 떠나는 것이 스윕 시작이고, 손으로 치지 않으므로
    #    가장 안 보이는 스윕이다.
    # changed_tests.py의 선택 규칙은 넷이고 전부 파일에서 읽는다: (1) 바뀐
    # tests/test_*.py는 그대로, (2) 바뀐 src|tools/<name>.py는 tests/test_<name>.py가
    # 있으면 함께, (2b) 그 모듈을 임포트하는 테스트 모듈, (2c) 임포트하지 않고
    # 그 파일 이름을 문자열로 부르는 테스트 모듈, (3) 비-python 파일은 그것을
    # 이름으로 부르는 테스트와 EXPLICIT_GUARDS.
    # 2b·2c는 claunch-u1h가 더했다. 규칙 2만 있던 동안 소스 모듈 107개 중
    # 60개가 아무것도 선택하지 않았고(같은 이름의 테스트가 없다), 네 회차가
    # 그 간격을 쟀다 — daemon/mesh.py의 회차에서는 선택되지 않은
    # test_mesh_wire.py가 실제 실패 3건을 들고 있었다. 넓히기는 직접 임포트
    # 까지다: 전이 폐포는 소스 모듈 중앙값이 스위트의 42%를 골라 리더의
    # 전체 스윕과 구별되지 않는다(직접 임포트의 중앙값은 88건/2489건).
    # 고른 것이 없으면 통과다 — 산문·yaml만 바꾸는 회차가
    # 실재하고(이 저장소에서 같은 날 하나 착지했다), 그것을 빨갛게 만들면
    # 게이트를 통과하려고 테스트를 꾸미게 된다. 그 자리는 done_when이 받친다.
    # --no-sync인 이유는 아래 스윕 쪽과 같다: sync가 데몬이 물고 있는
    # .venv/Scripts/claunch.exe를 교체하려다 os error 5로 게이트를 막는다.
    # 워크트리 준비는 작업 중 'uv sync --extra test' 한 번으로 끝낸다.
    # -n과 basetemp는 스크립트가 고른 모듈 수에 맞춰 스스로 정한다(1개면
    # 직렬, 그 이상이면 최대 4 — 이 스위트의 비용은 CPU가 아니라 프로세스
    # 스폰이라 모듈 몇 개에 8을 띄우면 안 띄우느니만 못하다).
    # tests/test_changed_tests.py와 tests/test_project_layer_override.py가 못박는다.
    #
    # --base가 master 고정이 아니라 auto인 이유(claunch-eghh). 이 편성의 워커
    # 브랜치는 통합 브랜치 위에 얹힌다. 그 브랜치를 master에 대고 재면 자기
    # 변경이 아니라 배치 전체를 잰다 — 한 날에 세 세션이 같은 자리에서
    # 93/119(78%), 95/119(80%), 1945 tests / 221.75s를 쟀고 그 회차들이 실제로
    # 바꾼 파일은 4~6개였다. 이 스텝 산문이 금지하는 전체 스위트를 같은 스텝의
    # verify가 돌리고 있었다.
    # auto는 그 브랜치의 upstream을 읽는다 — 정렬 게이트(tools/merge_ready.py)가
    # 통합 대상을 알아내는 것과 같은 ref다. 그래서 선택과 정렬이 같은 것을 말한다.
    # upstream이 없으면 master로 내려가되 조용히 내려가지 않는다: 어느 축으로
    # 쟀는지와 그것을 정하는 한 명령(git branch --set-upstream-to=<통합 브랜치>)을
    # stderr에 낸다. exit code는 안 바뀐다 — upstream이 없는 것은 고칠 일이지
    # 판정을 거부할 일이 아니다.
    # timeout이 기본값(model.DEFAULT_VERIFY_TIMEOUT = 900)이면 이 게이트는
    # 이 부류의 정상 회차에서 잘린다. 워크플로 yaml을 바꾸는 회차는 그
    # 파일을 이름으로 부르는 테스트가 규칙 3a로 전부 들어와 17모듈이
    # 되는데, 같은 선택을 손으로 잰 값이 947초였다(s151, 2026-08-26,
    # 복원 하한 908초·popen-gw 4개로 「멈춘 게 아니라 잘렸다」 확인).
    # 900은 표적 선택이 작던 때의 값이고, 정상 경우가 상한을 넘는
    # 게이트는 우회하는 버릇을 가르친다 — 그것이 이 스텝 산문이 막으려는
    # 바로 그것이다. 그래서 상한을 올린다.
    #
    # 대가는 명시한다: 진짜 멈춘 게이트를 30분 뒤에 안다. 그 대가를 받는
    # 이유는 잘린 게이트가 「빨강」으로 보이면서 실제로는 판정이 없는
    # 것이고, 없는 판정은 늦은 판정보다 나쁘기 때문이다. 이 값은 비용이
    # 내려가면 되돌릴 자리다 — claunch-bl0e가 그 비용을 재고 있다.
    verify:
      command: 'uv run --no-sync python tools/changed_tests.py --base auto'
      timeout: 1800
    next: commit

  commit:
    title: 커밋·보고
    instructions: |
      저장소 관례(한 줄 요약 — 「무엇을 어떻게」)로 커밋한다.

      ── 커밋 하나를 만들 때마다, 그 자리에서 두 가지 ──
      회차가 끝난 뒤에 몰아서 하지 않는다. 몰아서 적은 것은 기억에서
      적은 것이고, 기억은 해시를 틀린다.
      1) **스탬프** — 커밋 메시지의 마지막 문단에 트레일러를 단다:
         `Claunch-Session: $CLAUNCH_SESSION`, 그리고 linked worktree에서
         작업 중이면 `Claunch-Worktree: <체크아웃 이름>`(commit-stamp
         스킬의 철자 그대로 — 철자가 곧 색인이다). 이것이 이 커밋을
         **세션 메타데이터에 싣는 유일한 동작**이다: 데몬은 따로 받아
         적지 않고 이 트레일러를 읽어 세션 상세 패널의 Commits 블록과
         `/api/sessions/<세션>/meta`의 `commits`를 만든다. 그래서 스탬프
         없는 커밋은 「기록되지 않은」 것이 아니라 **이 세션의 것이
         아닌** 커밋이다. 회차 보고서(HTML)가 사람이 읽는 산출물이라면
         이쪽은 기계가 읽는 짝이고, 둘 다 세션이 닫힌 뒤에 남는다.
         확인은 `claunch commits` — 방금 만든 해시가 그 목록에 있어야
         한다. 없으면 트레일러를 빠뜨린 것이다(이미 push하지 않은
         직전 커밋이면 `git commit --amend`로 고친다; 남의 커밋은
         고치지 않는다).
      2) **이슈 코멘트 한 줄** — `claunch beads comments add <id>
         "COMMIT <해시> — <한 줄 요약>"`. id는 **그 커밋이 속한 일감의
         이슈**다 — 배치 회차면 일감마다 다르고, 주 이슈에 몰아 적으면
         다른 일감의 이슈는 커밋 없이 닫히게 된다. 이슈가 이 회차의 정본
         기록이고(「기록은 코멘트에, 신호는 메시지에」), 커밋은 되짚어
         읽히는 것이다. 이 줄은 상위에게 보내는 nudge가 아니다 —
         **메시로 보내지 않는다.** 커밋마다 메시지를 보내면 상대
         터미널에 커밋 수만큼 타이핑된다. 상위에게 가는 한 줄은 이
         스텝 끝의 nudge 하나뿐이다.
      3) **상태 점검 갱신은 요청받고 한다** — 이 스텝을 떠나는 순간
         데몬이 아래 `triggers:` 선언을 읽어 상태 점검 재보고 요청을 이
         터미널에 타이핑한다. 그 요청이 도착하면 `status_checks` 도구로
         활성 항목의 id·질문·현재 보고 값을 읽고, `report_status_checks`
         도구로 활성 id 각각에 현재 사실에 맞는 `yes` 또는 `no`를
         보고한다. 비활성 id는 보고하지 않고, 설정은 사용자가 바꿀 수
         있으므로 이전에 읽은 목록을 재사용하지 않는다. 요청이 오기 전에
         미리 보고하지 않는다 — 활성 항목이 하나도 없으면 요청 자체가
         오지 않으며, 그 사실은 런 저널에 `trigger_skipped`로 남는다.
      머지 커밋(--no-ff)에는 스탬프도 코멘트도 요구하지 않는다 — 그
      커밋들이 무엇인지는 접힌 커밋들이 이미 말한다.

      워크트리
      브랜치 위에서 작업했으면 피처 브랜치를 워크트리 브랜치에 --no-ff로
      머지해 한 갈래로 정리한다 — 이 머지의 상한은 워크트리 브랜치까지다.
      단 이 상한은 **한 워크트리에 회차가 하나일 때**의 규칙이다. 접기
      전에 워크트리 브랜치의 상태를 먼저 본다 — 다음 둘 중 하나라도
      해당하면 접지 않고 **피처 브랜치 자체가 인계 단위**다:
      · **은퇴**: `git branch --contains <워크트리 브랜치> --list master`가
        master를 내놓으면 그 브랜치는 이미 통합돼 임무가 끝났다. 접으면
        master보다 뒤처진 갈래를 되살리는 셈이다.
      · **동결·심사 중**: 그 브랜치가 통합 대기로 올라가 있으면 접는 순간
        남이 심사 중인 브랜치의 tip이 내 손에 움직인다. 심사 중에 되돌릴
        수 없는 쪽을 고르지 않는다 — 머지는 나중에 언제든 할 수 있다.
      두 경우 모두 접지 않은 이유를 보고에 적는다. 회차가 여러 번 도는
      워크트리에서는 워크트리 브랜치가 여러 목표가 쌓인 곳이 되므로,
      무관한 목표를 한 갈래에 얹지 않는 것이 상한 규칙보다 우선한다.
      하위 워커를 둔 회차면 완료 보고가 온 자식 브랜치를 각각 자신의
      워크트리 브랜치에 --no-ff로 머지해 모은다 — 자식 하나당 머지 커밋
      하나, fast-forward로 뭉개지 않아 브랜치 이력이 트리 구조로 남게
      한다(자식이 손자 브랜치를 같은 방식으로 모았으면 그 트리가 통째로
      실린다). 아직 작업 중인 자식 브랜치는 모으지 않고 그 사실을 보고에
      남긴다 — 그리고 그 자식이 고아가 되지 않게 착지 요청 전에 리더에게
      adopt(reparent) ask를 보낸다: 내가 착지·종료하면 자식의 통합
      대상(내 브랜치)은 동결·은퇴 상태가 되고, reparent는 리더의 스킬
      (mesh-retopology)이라 워커는 요청만 할 수 있다. 그 자식의 세션·이슈
      id는 증거 묶음의 심사 한계에 적는다(settle-check가 같은 것을 다시
      본다). 단, 리더가 mesh-delegate로 세운 전담 중간 워커는 이
      워크플로가 아니라 improv-mid로 돌며 자식 착지는 거기 스택 착지
      절차(순서·restack 공지 포함)가 맡는다 — 여기 규칙은 한 회차 안에서
      스스로 자식을 둔 워커의 것이다.
      master는 어떤 경우에도 머지 대상이 아니다(머지는 리더 전권).
      그리고 완료 보고를 만든다: 목표, 브랜치, 기능 커밋·머지 커밋 해시,
      테스트 수치. 이 묶음이 가는 곳은 이슈 코멘트다 —
      `claunch beads comments add <id> -f <파일>` — 상위가 착지 결정을 내리는
      근거가 그것이기 때문이다. 메시에 속해 있으면 상위에게는 nudge 한 줄만
      보낸다: `<id> 커밋 끝 — <브랜치> @ <tip>, tests N/M(표적), 묶음은
      코멘트에.` 같은 내용을 메시지 본문에 다시 싣지 않는다.
      **큐에 일감이 남아 있으면 이 nudge는 보내지 않는다** — 일감마다
      보내면 상위 터미널에 일감 수만큼 타이핑된다. 배치의 nudge는
      integration-request의 하나다.
    done_when: |
      커밋(워크트리 작업이면 --no-ff 머지까지, 단 워크트리 브랜치가 이미
      master에 포함된 은퇴 상태면 접기 없이 피처 브랜치가 인계 단위이고
      그 판별과 이유가 보고에 있다)이 만들어졌고, 완료 보고가 온 자식
      브랜치가 있으면 각각 --no-ff 머지 커밋으로 모였으며, 이 회차가 만든
      기능 커밋이 전부 `Claunch-Session` 트레일러를 달아 `claunch commits`가
      그것들을 내놓고(= 세션 메타데이터에 실렸다), 커밋마다 이슈에
      `COMMIT <해시> — <요약>` 코멘트가 하나씩 남았으며, 목표·브랜치·
      커밋 해시·테스트 수치가 담긴 완료 보고가 기록되고 같은 묶음이 이슈
      코멘트로도 남았다. 메시에 가입한 상태면 상위에게 nudge 한 줄이
      나갔다(큐에 일감이 남아 있으면 보내지 않았다). master는 움직이지
      않았다.
    # 상태 점검 재보고 요청은 이 스텝을 떠날 때 데몬이 타이핑한다. 이
    # 스텝의 완료 조건이 아닌 이유는 발화 시점이다 — 커밋이 다 서 있어야
    # 답이 현재 값이 되고, 그 시점은 보고가 끝난 뒤다.
    triggers:
      - do: checks
        at: leave
    next: queue-next

  queue-next:
    title: 다음 일감 (큐가 남았는가)
    select:
      # chooser: agent인 이유 — 판정 재료가 전부 보드에 있다(큐 명령 한
      # 번). 일이 많은 쪽(next)은 이슈가 실제로 서 있어야 성립하고, 일이
      # 적은 쪽(drained)은 착지 절차 전체로 이어지므로 게으름의 경로가
      # 없다. 배치 상한은 여기서 센다 — 브랜치 하나에 실린 일감이 많을수록
      # 거절·rebase 재요청이 배치 전체를 막고, 무관한 일감이 한 머지에
      # 실린다.
      chooser: agent
      require_reason: true
      prompt: |
        커밋이 끝났다. 큐를 다시 읽는다 — 기억이 아니라 보드로:
        `claunch beads list --assignee $CLAUNCH_SESSION --status open
        --status in_ready --limit 0 --json`. 작업 중에 새로 배정된 일감도
        여기서 처음 보인다. 무엇이 나왔는지(id 목록과 이번 배치에 이미
        실린 일감 수)를 reason에 적는다.
        · 남은 일감이 있고, 이 배치에 실린 일감이 5개 미만이며, 다음
          일감이 같은 브랜치에 얹어도 되는 것(같은 영역, blocked 아님,
          intake가 무관하다고 적지 않은 것)이면 **next**다.
        · 남은 일감이 없으면 **drained**다. 남았더라도 배치가 5개에
          닿았거나, 남은 것이 전부 무관·차단·다른 저장소 영역이면
          drained다 — 그 일감들은 큐에 그대로 두고(상태·assignee 손대지
          않는다) 착지 뒤 queue-recheck가 다시 읽는다(착수할 수 있으면
          다음 회차, 아니면 그때 풀에 되돌린다).
        모호하면 drained다 — 착지 한 번이 더 도는 쪽이, 무관한 일감이
        한 머지에 실리는 쪽보다 싸다.
      options:
        next:
          description: 큐의 다음 일감을 이 배치에 싣는다 — 전이·범위 기록은 다음 단계가 한다
          next: item-intake
        drained:
          description: 큐가 비었거나 배치 상한·무관 일감으로 여기서 끊는다 — 배치 전체를 착지 절차로 넘긴다
          next: landing

  item-intake:
    title: 다음 일감 착수
    instructions: |
      queue-next가 고른 다음 일감을 이 배치에 싣는다. 순서는 큐의
      순서(priority 오름차순 → created_at)이고, 그 첫 것을 `claunch beads
      show <id> --json`으로 읽는다 — 본문이 목표이고, 비었거나 자리표시
      절뿐이면 intake의 규칙대로 규격을 채운다. 그리고 `claunch beads
      update <id> --status in_progress --external-ref <run id>` — 이
      전이가 이 일감의 시작이다.
      보고에 남길 것: 일감 id·제목, 이 배치에서의 순번(n번째 / 지금까지
      실린 id 목록), 범위, 완료 증거 기준. 브랜치는 그대로다 — 새 브랜치를
      만들지 않고, 통합 대상도 intake에서 정한 그것이다.
      같은 파일·같은 규칙에 닿는 일감이 앞 일감과 충돌하는 결정을
      요구하면 혼자 정하지 말고 리더에게 묻는다(work의 규칙 그대로).
    done_when: |
      다음 일감의 id가 in_progress로 전이됐고(--external-ref에 run id),
      배치 순번·범위·완료 증거 기준이 보고에 있다.
    next: work

  landing:
    title: 착지 결정 (깨끗하면 스스로 요청한다)
    select:
      # 이 문이 왜 agent가 되었는가 — 저널이 답했다.
      # 이 저장소의 landing 결정 22건이 전부 request이고 hold는 0건이다
      # (.cflow/runs/*/journal.jsonl 에서 step=='landing': select_confirmed
      # request 18건 + ask_answered request 2건, 그리고 위임 도입 후의 두
      # 건은 각각 63초·37초 걸렸다). 22번 물어 22번 같은 답이 나오는 문은
      # 결정이 아니라 통과 의례다. 그런데 그 의례에는 값이 셋 붙어 있었다:
      #  · 리더 턴 하나. ask-19ed7b의 답에서 리더는 master/tip/rev-list/
      #    merge-tree/diff --stat 을 직접 다시 읽었다 — 자기 integrate-
      #    preflight에서 또 읽는 바로 그 값이다.
      #  · 배치 축소. 리더 s115의 integrate-preflight 보고(2026-08-26T
      #    03:30:32Z)가 스스로 적었다: 「s120 건은 자기 런의 landing이 사람
      #    게이트에 걸려 아직 배치에 들어올 수 없다」…「두 건을 함께 싣는
      #    편이 rebase 1회와 스윕 1회를 아낀다」. 착지 문 하나가 서면 통합
      #    창에 모이는 후보가 줄고 스윕이 늘어난다 — 리더의 5분 창이 막으려던
      #    바로 그것을 이 문이 도로 만들었다.
      #  · 막힌 워커 = 살아 있는 세션. 착지가 늦는 만큼 슬롯이 쌓인다.
      #
      # 위치도 틀려 있었다. 이 문은 rebase(뒤처짐·충돌을 실제로 재는 곳)와
      # peer-review 앞이다. 옛 prompt가 재겠다던 「대기 중 다른 브랜치와
      # 충돌하는지」는 rebase가 다시 재고 리더의 integrate-preflight가
      # rev-list/merge-tree로 또 재며, 「스윕 배치 타이밍」은 리더의 standby
      # select와 integrate self-decision이 정한다. 정보가 가장 적은 시점에,
      # 하류가 어차피 다시 내리는 판정을 앞당겨 물었던 것이다.
      #
      # 그래서 위임을 없애지 않고 예외 쪽으로 옮겼다 — landing-review가 옛
      # landing 그대로다(후보·otherwise·timeout 동일). 여기서 agent가 고를
      # 수 있는 것은 request와 escalate뿐이고, hold에 워커 혼자 닿는 길은
      # 없다. 옛 주석이 chooser: agent를 거절한 사유(「hold가 rebase와 증거
      # 묶음을 건너뛰므로 고르는 자와 득 보는 자가 같아진다」)는 그대로
      # 지켜진다: agent가 고를 수 있는 request는 더 많은 일이므로 게으름의
      # 경로가 아니고, 일을 줄이는 hold는 여전히 상위 세션의 답이다.
      #
      # 사용자의 문도 닫히지 않았다. chooser: agent인 select도 터미널의
      # 사용자가 `claunch cflow select request|escalate`(또는 대시보드의
      # 옵션 버튼)로 언제든 닫을 수 있다 — 다만 이 자리는 사람을 세워 두는
      # 곳이 아니므로 워커는 고르고 지나간다.
      chooser: agent
      prompt: |
        이번 목표가 브랜치에 커밋됐고 표적 테스트가 green이다. 이 요청에
        「특별히 이슈가 없는가」를 기계로 확인해 스스로 정한다 — 상위
        세션에 물어 그 턴을 하나 쓰는 것은 확인이 깨졌을 때뿐이다.

        ── 먼저: 실을 델타가 있는가 ──
        아래 다섯은 「깨끗한가」를 묻는다. 그 앞에 「실을 것이 있는가」가
        있고, 이것이 0이면 다섯이 전부 참이어도 request가 아니다:
            git rev-list --count $(git merge-base <통합 대상> HEAD)..HEAD
        0이면 **escalate**다. hold가 아니다 — 동결은 여전히 상위의 답이고,
        워커가 직접 닿아서는 안 된다(아래 hold 원칙 그대로).
        이 판별식은 내가 정하는 것이 아니라 보드의 정본이다:
        claunch-hold-round-cannot-close-hkkh 에 s131이 세우고 리더가 채택한
        델타-0 변별자와 **같은 값이어야 한다** — 같은 것을 두 자리에서 다르게
        재면 한쪽을 고쳐도 다른 쪽이 남는다.
        왜 이 갈래가 필요한가: 커밋 0건으로 끝나는 회차(분석 회차, 이미
        master에 포함된 은퇴 브랜치)는 다섯을 **전부** 통과한다 — 트리가
        깨끗하고(1), 변경이 없으니 수치가 자명하게 tip의 것이고(2),
        merge-base == HEAD라 미리 병합에 충돌이 없고(3), 마커도 동결 지시도
        없다(4·5). 다섯이 다 참인데 실을 것이 없다. 실측 사례가 있다:
        2026-08-26 s154/claunch-ggfd/run-bd6e63b8 — 프로덕션 변경 0건,
        브랜치가 이미 master에 있었고 리더가 hold로 답했다. 이 갈래가 없으면
        그 회차가 스스로 request를 올려 rebase·증거 묶음·동료 리뷰를 태우고
        상위의 거절 턴까지 쓴다 — 리더 턴 하나를 아끼려다 워커 왕복 셋과
        거절 턴 하나를 쓰는 것이라, 이 문이 하려던 것과 정확히 반대다.

        ── 그다음: 다섯이 전부 참이면 request다 ──
        하나라도 아니면 escalate다.
        참·거짓은 짐작이 아니라 명령의 출력으로 정하고, 무엇을 돌려 무엇이
        나왔는지 reason에 적는다(그 reason이 저널에 남아 상위가 읽는다).
        1. 작업 트리가 깨끗하다 — `git status --porcelain` 이 0줄
        2. 그 표적 수치가 **지금 올리는 tip에 대한 것**이다. review에서 잰
           뒤 커밋 단계가 소스를 더 얹었으면(자식 브랜치 --no-ff 머지,
           보완 커밋) 그 수치는 다른 트리의 판정이다. 판별과 처방:
           `git diff --name-only <수치를 잰 커밋> HEAD` 가 0줄이면 그대로
           참이고, 아니면 지금 tip에서 표적 선택을 한 번 더 돌려 그 수치로
           갈아 끼운다 — 그것도 못 하면 escalate다. 「초록이었다」는 어느
           트리에서 초록이었는지가 붙어야 판정이다
        3. 통합 대상 위로 미리 병합이 깨끗하다 —
           `git merge-tree $(git merge-base <대상> HEAD) <대상> HEAD` 에
           충돌 표시 0행(대상은 intake에서 정한 통합 대상: master, 또는
           부모가 중간 워커면 그 스택 베이스)
        4. 내 이슈에 열린 제동 마커가 없다 — `claunch beads comments <id>`
           에 CHANGES REQUESTED / HOLD / BLOCKED 중 해소되지 않은 것이 없다
           (배치 회차면 실린 이슈마다 본다 — 하나라도 있으면 escalate)
        5. 상위가 걸어 둔 동결·정지 지시가 없다(메시로 온 freeze/hold 공지,
           리더가 승인한 예외 코멘트 포함)

        확인이 깨졌거나 — 미리 병합이 충돌한다, 통합 대상이 무엇인지 모르겠다,
        마커가 있는데 해소됐는지 판단이 안 선다 — 내가 정할 수 없는 사정이면
        escalate다. 모르는 것을 request로 밀지 않는다.
        반대로 다섯이 다 참인데 「그래도 물어보는 편이 안전하지 않나」로
        escalate하지도 않는다: request는 상위의 통합 대기 표에 줄 서는 것일
        뿐이고 머지 실행도 배치 편성도 rebase 재요청도 여전히 상위의 것이다.
        이 문이 지키는 것은 master가 아니라 상위 세션의 턴이다 — 그 턴을
        아끼는 것이 지금 이 편성에서 가장 비싼 자원을 아끼는 것이다.
      options:
        request:
          description: 확인 다섯이 전부 참 — 통합 대상 위로 rebase해 최신화한 뒤 증거 묶음을 만들어 상위에 요청한다(머지 실행은 상위 세션)
          next: rebase
        escalate:
          description: 확인이 하나라도 깨졌다 — 착지 여부를 상위 세션에 묻는다
          next: landing-review

  landing-review:
    title: 착지 결정 (상위 세션에 묻는다)
    select:
      # landing의 기계 확인이 깨졌을 때만 들어오는 자리다. 옛 landing의
      # 위임이 그대로 여기로 옮겨 왔다 — 후보 그룹도, otherwise도, timeout도
      # 같다. 바뀐 것은 빈도뿐이다: 매 회차가 아니라 예외인 회차만 온다.
      #
      # 착지는 상위 세션의 결정이다 — 사람 문이 아니다. 이 문이 되돌릴 수
      # 없는 것을 지키지 않기 때문이다: request 갈래의 종점(integration-
      # request)은 master 머지를 명시적으로 금지하므로 요청은 상위의 통합
      # 대기 표에 줄 서는 것뿐이고, hold 갈래도 wrapup의 HOLD 코멘트와 상위
      # fyi로 같은 표에 돌아온다. 양쪽 다 가역이고, master를 지키는 방어는
      # 리더의 머지 전권과 통합 후 전체 스윕이지 이 select가 아니다. 리더
      # 쪽에는 이미 같은 판정이 내려져 있다 — improv-leader의 integrate는
      # 실제 master 머지인데도 사람 문을 폐지하고 self-decision으로 돈다.
      #
      # 사람 문이 아니라는 것과 사람이 못 들어온다는 것은 다르다. 위임은
      # 결정을 런에게서 가져가는 것이지 사용자에게서 가져가는 것이 아니다 —
      # 이 질문이 상위에게 나가 있는 동안에도 터미널의 사용자는 언제든
      # `claunch cflow select request|hold`(또는 대시보드의 옵션 버튼)로
      # 같은 결정을 내릴 수 있고, 그 답이 상위의 답보다 먼저 성립한다.
      # 엔진이 그렇게 동작한다: 사람의 select는 열린 ask를 그 자리에서 닫고
      # (engine._settled_by_person), 제쳐진 응답자에게는 질문이 닫혔다는
      # 통지가 간다. 저널에는 override로 누구를 제쳤는지가 남는다.
      # 그러니 충돌은 없다 — 먼저 온 답이 아니라 사용자의 답이 이긴다.
      # 다만 문이지 게이트가 아니다: 워커는 이 결정을 사용자에게 올려
      # 세워 두고 기다리지 않는다. 상위에게 나가 있다는 사실과 사용자가
      # 원하면 직접 답할 수 있다는 한 줄만 보고에 남기고 턴을 끝낸다.
      prompt: |
        너에게 딸린 워커 하나가 이번 목표를 자기 브랜치에 커밋했고 표적
        테스트가 green이다. 지금 그 브랜치를 네 통합 대기 표에 올리게
        하는가(워커는 먼저 통합 대상 위로 rebase한 뒤 증거 묶음을 만들어
        요청을 보낸다), 아니면 브랜치를 동결해 두고 이 회차를 마감하게
        하는가?

        이 질문이 너에게 온 것 자체가 값이다. 깨끗한 요청은 워커가 스스로
        올려 너를 부르지 않는다 — 워커의 기계 확인(작업 트리 깨끗, 표적
        green, 미리 병합 충돌 0, 열린 제동 마커 없음, 동결 지시 없음) 중
        하나가 깨졌을 때만 이 문이 열린다. 무엇이 깨졌는지는 그 워커가
        select의 reason에 적어 저널에 남겼다: `claunch cflow journal -t
        <그 세션> -n 10` 이 그것이고, 거기부터 읽는다.

        나머지 판단 근거는 보드에 있다: 그 워커가 커밋 단계에서 남긴 코멘트
        (목표·브랜치·커밋 해시·테스트 수치)가 그것이다 — `claunch beads
        show <id> --json`, `claunch beads comments <id>`. 모자라면
        `claunch cflow status -t <그 세션> --json`이 나머지를 말해 준다.
        지금 줄을 세울 여력이 있는지, 대기 중인 다른 브랜치와 충돌하는지,
        스윕 배치 타이밍이 맞는지 — 그 표의 상태를 아는 것은 너다.

        어느 쪽을 골라도 이 워커가 머지하는 일은 없다. 머지 실행은 상위
        세션의 몫이고, master 머지는 그중 리더의 통합 단계에서만 일어난다.

        이 질문에는 문이 둘이다. 터미널의 사용자도 같은 결정을 동시에
        내릴 수 있고, 사용자가 먼저 답하면 네 답은 성립하지 않는다 —
        그때는 질문이 닫혔다는 통지가 너에게 간다. 밀린 것이 아니라
        규칙이다: 충돌하면 사용자 지침이 이긴다. 그러니 답할 수 있으면
        지금 답하고, 근거가 없으면 추측하지 말고 abstain으로 넘긴다.
      # 누가 답하는가 — 통합 대기 표의 주인, 곧 이 워커의 상위 세션이다.
      # 부모가 중간 워커(improv-mid)면 그 역할도 worker이므로 첫 그룹이
      # 받고(scope: ancestor + 스폰 시 wired라 닿는 상위는 직속 부모뿐이다),
      # 평면 편성이면 첫 그룹이 아무도 못 맞춰 skip되고 리더가 받는다 —
      # skip 사유는 저널에 남는다. chooser: agent는 여기 쓰지 않는다: hold가
      # rebase와 증거 묶음을 건너뛰므로 고르는 자와 득 보는 자가 같아진다.
      # (앞 스텝 landing이 chooser: agent인 것은 모순이 아니다 — 거기서
      # agent가 닿을 수 있는 것은 request뿐이고, hold는 이 문에만 있다.)
      # 상위가 없는 단독 편성이거나 30분 안에 답이 없으면 이 질문은 사람
      # 앞에 선다(otherwise: human) — 그때는 사용자가 유일한 응답자다.
      # 그 전까지도 사용자의 문은 닫혀 있지 않다: 위 주석대로 병행이고,
      # 사용자가 답하면 그 답이 이긴다. timeout은 사용자를 기다리는 시계가
      # 아니라 상위가 침묵할 때 질문이 굳지 않게 하는 시계다.
      chooser:
        from:
          - {role: worker, scope: ancestor}
          - {role: leader, scope: ancestor}
        otherwise: human
        timeout: 1800
      options:
        request:
          description: 지금 상위 세션에 통합 요청 — 먼저 통합 대상 브랜치로 rebase해 최신화한 뒤 증거 묶음을 만들어 올린다(머지 실행은 상위 세션)
          next: rebase
        hold:
          description: 브랜치 동결(추가 커밋 없음) — 통합은 나중에, 정리로
          next: wrapup

  rebase:
    title: 정렬 (요청 전 — rebase, 또는 프리뷰 머지 위 재측정)
    instructions: |
      일반적인 pull request 워크플로우와 같다 — 요청은 정렬 후에 한다.
      통합 대상 브랜치(상위 세션이 머지할 브랜치: 상위가 리더면 master,
      상위가 워커면 그 워커의 브랜치)가 내 브랜치의 분기점 이후 앞으로
      움직였으면 여기서 처리한 뒤 요청한다. 원격이 있는 편성이면 먼저
      대상을 fetch한다(로컬 전용 편성은 불필요).

      판정은 손으로 하지 않는다 — 상위와 내가 같은 명령으로 같은 답을
      얻어야 왕복이 사라진다. 리더의 preflight가 부르는 것과 같은
      스크립트다:
        uv run --no-sync python tools/merge_ready.py --allow-target-advance
      대상은 이 브랜치의 git upstream이고, 없으면 master다. 부모가 중간
      워커여서 대상이 master가 아니면 지금 한 번 적어 둔다 —
      `git branch --set-upstream-to=<기준>` — 이 한 줄이 없으면 게이트는
      master를 묻고, 내가 착지하지도 않을 브랜치 위로의 재정렬을 요구한다.
      (`--target <기준>`으로 직접 대도 되지만, 게이트는 워크플로우에 박힌
      고정 문자열이라 그 자리에는 기준을 쓸 수 없다.)

      ── 답은 넷(편성에 따라 다섯)이고, 셋만 내 일이다 ──
      · ready(0) — 대상이 이미 내 브랜치에 들어 있거나(behind=0), 재측정이
        끝났거나, 내 프리뷰가 남아 있고 프리뷰→현재 착지 diff의 파일 목록과
        stable patch-id가 이전 대상→현재 대상 diff와 같다. 마지막 경우는
        기준선 이동을 정상으로 받아들이며 프리뷰가 없으면 이 예외를 쓰지
        않는다. 전체 스윕 실패를 이 대조로 별건 처리하려면 대상·브랜치 변경은
        각 merge-base에서 읽고, 실패 테스트의 import 모듈과 파일 교집합을
        먼저 확인하며 겹치는 경우 함수 단위까지 확인한다.
      · rebase(3) — 미리 병합이 텍스트로 충돌한다. 이것만이 재정렬을
        강제하는 근거다:
          git rebase <대상>
        충돌이 나면 대상이 정한 방향을 먼저 읽고 그 위에 내 변경을 얹어
        해결한다 — 충돌을 지웠다고 보고하지 않는다. 재정렬 후에는 표적
        테스트를 다시 돌려 그 수치와 새 tip 해시를 보고에 남긴다.
      · re-measure(1) — 대상은 움직였지만 병합은 깨끗하다. 브랜치는
        문제없이 합쳐진다; 낡은 것은 **증거**다. 내 표적 수치는 내 base
        에서 쟀고, base가 움직였으면 그 수치는 실제로 착지할 트리를 설명
        하지 않는다. 「충돌 없음」은 텍스트가 안 겹쳤다는 말일 뿐이고
        의미 충돌에는 아무 말도 안 한다 — 이 저장소의 실례가 90a07a9다
        (한 브랜치가 tools/ 게이트 전부에 규칙을 세우는 동안 master가
        그 규칙을 안 지키는 다섯째 게이트를 들여왔다. 다른 파일이라
        merge-tree는 깨끗했고, 합친 트리는 빨갰다).
        여기서 재정렬은 선택지 중 하나일 뿐이다. 더 싼 쪽이 있고 상위도
        그것을 받는다 — 실제로 일어날 머지를 만들어 그 위에서 다시 재면
        브랜치 자체는 안 움직이므로 리뷰어가 승인한 tip이 그대로 착지한다:
          git worktree add --detach <tmp> <대상>
          git -C <tmp> merge --no-ff <브랜치>
          <tmp에서 표적 테스트 실행 — 수치를 보고와 코멘트에>
          git update-ref refs/claunch/preview/<브랜치> $(git -C <tmp> rev-parse HEAD)
        마지막 줄이 요점이다: 게이트는 그 ref의 두 부모가 정확히 내 tip과
        대상 tip인지만 본다. 대상이 또 움직이면 부모가 안 맞아 판정이 저절로
        re-measure로 돌아온다 — 아무도 안 보고 있을 때 기준선이 낡는 그
        순간이 바로 그 자리다. 게이트가 증명하는 것은 그 트리가 존재했고
        무엇과 무엇을 합쳤는가까지다; 거기서 테스트를 정말 돌렸는지는
        여전히 내 말이고 상위가 심사한다. 그러니 수치를 지어내면 그것은
        게이트를 속이는 것이 아니라 심사를 속이는 것이다.
      · cannot tell(2) — 대상 브랜치가 없거나 저장소를 못 읽었다. 게이트를
        `|| true`로 통과시키지 말고 무엇이 안 읽혔는지 적는다.
      · landed(5) — 대상이 이미 내 tip을 담고 있다. 이 코드는 게이트를
        `--landed-exit`로 부르는 편성에서만 나온다(이 저장소의 프로젝트
        레이어가 이 스텝의 verify와 착지 대기 프로브를 그렇게 부른다).
        손으로 친 위 명령은 같은 상태를 `ready: landed -- ...`, exit 0으로
        답한다 — 출력 첫 줄이 그 문구면 같은 상태다. 정렬할 것도 재측정할
        것도 없다: 착지한 일을 재측정 요청으로 읽고 여기 다시 온 것이다
        (143회차 s753, claunch-dlq0o). verify가 5로 막으므로 이 스텝을
        next로 떠날 수 없고, 이 스텝에서 landed로 가는 갈래도 없다 —
        `request_goto`에 `step: landed`와 사유(게이트 출력 그대로)를 실어
        사람에게 올린다. 커밋을 더 얹어 게이트를 초록으로 만들지 않는다.

      ── 금지의 경계 ──
      이 rebase는 내 브랜치의 기준점을 옮기는 것이지 master를 움직이는
      것이 아니다. master를 체크아웃해 커밋하거나 master로 push/merge하는
      금지(「워커는 master를 직접 머지하지 않는다」)는 이 단계에서도 그대로
      살아 있다. 상위가 재요청을 보내면(rebase 재요청이면 미리 병합이
      충돌한다는 것, 재측정 요청이면 기준선이 움직였다는 것) 브랜치를
      동결 해제하고 이 단계를 다시 밟아 게이트가 ready라고 답할 때까지
      정렬한 뒤 갱신된 증거 묶음으로 재요청한다 — PR 워크플로우처럼
      재요청은 정렬 후에 간다.

      ── 스택 위에서 (restack) ──
      부모가 중간 워커면 대상은 intake에서 적은 기준 브랜치(스택 베이스
      또는 선행 자식 브랜치)다. 중간 워커가 restack 공지를 보내면(다른
      자식이 베이스에 착지해 tip이 움직였다, 또는 베이스가 master 위로
      재정렬됐다) 이 단계를 다시 밟는다: `git rebase <기준>` — 베이스에
      --no-ff로 이미 실린 커밋은 upstream에 있으므로 rebase가 건너뛰고 내
      커밋만 다시 얹힌다. 재확인 후 요청을 이미 올렸으면 갱신된 묶음으로
      재요청하고, 아직이면 새 기준 tip을 보고에 적어 둔다.
    done_when: |
      tools/merge_ready.py가 ready(0)라고 답하고, 그 답에 이르기까지 한
      일이 보고에 있다: 처음부터 ready였으면 그 사실 한 줄, 충돌이었으면
      rebase(충돌 해결 포함)와 재확인한 표적 수치·새 tip 해시, 기준선이
      움직였을 뿐이었으면 재정렬했는지 프리뷰 머지 위에서 재측정했는지와
      그 수치, 그리고 프리뷰라면 남긴 ref와 그 머지 커밋 해시.
      master는 건드리지 않았다.
    # 이 스텝의 산문이 지금까지 done_when 하나로 서 있었다 — 「분기 유무를
    # git merge-base로 판별해」는 규칙이지 검사가 아니고, 아무도 다시 재지
    # 않았다. 그 사이 판정을 실제로 내리던 것은 리더의 거절이었다: 워커가
    # 요청을 올리고, 리더가 손으로 rev-list와 merge-tree를 치고, 메시로
    # 되돌려 보낸다. 리더 턴 하나 + 왕복 하나 + 보드 전이 둘이 그 값이다.
    # 그게 판단이면 그 값을 치를 만하지만, 두 git 명령의 결과다.
    # merge_ready.py가 그 두 명령이고, 리더의 preflight가 같은 것을 부른다 —
    # 두 자리에 같은 판정식을 적지 않는 것이 요점이다. 종료 코드가 판정이고
    # 0만 통과다: 3 rebase(미리 병합 충돌) / 1 재측정(대상은 움직였지만
    # 병합은 깨끗 — 낡은 것은 코드가 아니라 증거다) / 2 판정 불가.
    # 1을 통과시키면 90a07a9가 다시 일어난다: 텍스트로 안 겹친 두 브랜치가
    # 합쳐서 빨갰다. 그래서 「충돌 없음」은 통과 조건이 아니다.
    # 읽기 전용이고 git만 부른다 — awaits로 다시 재도 안전한 드문 verify라
    # await-landing이 같은 명령을 프로브로 쓴다.
    # --landed-exit는 그 프로브를 위한 것이고(착지를 5로 답해야 대기 중인
    # 워커가 착지를 듣는다), 여기서는 5가 곧 거절이다: 이미 대상에 실린
    # tip으로 정렬을 다시 밟는 것은 착지한 일을 재측정으로 오인한 경우뿐이다
    # (143회차 s753, claunch-dlq0o). 그때 할 일은 이 스텝의 instructions가
    # 적는다(landed(5) 갈래 — request_goto로 landed).
    # tests/test_merge_ready.py가 갈래들을 못박는다.
    verify: 'uv run --no-sync python tools/merge_ready.py --landed-exit'
    next: peer-review

  peer-review:
    title: 동료 리뷰 (리베이스 후, 요청 직전)
    instructions: |
      이 단계는 네가 답하는 자리가 아니다 — 질문은 리뷰어에게(없으면 상위
      리더에게) 나가 있다. 네가 할 일은 답할 사람이 읽을 것을 갖춰 두고
      턴을 끝내는 것이다.

      이 자리가 리베이스 바로 뒤인 것이 요점이다: 리뷰어가 보는 트리가
      상위가 머지할 트리와 같아야 한다. 그래서 네가 남길 `REVIEWED: pass
      @ <hash>`와 다음 단계의 `LANDING REQUEST @ <hash>`는 같은 해시다 —
      다르면 그 사이에 뭔가 커밋된 것이고, 그건 리뷰를 안 거친 변경이다.

      갖출 것은 commit과 rebase 단계에서 이미 만들었다: 목표·범위, 브랜치,
      커밋 해시, 표적 테스트 수치, 그리고 리베이스가 있었으면 재정렬 후
      tip과 재확인 수치. 그 묶음이 없으면 지금 만든다 — `claunch beads
      comments add <id> -f <파일>`. 답하는 세션은 네 런 상태를 읽지
      않는다; 보드와 브랜치가 그가 보는 전부다.

      메시에 속해 있으면 nudge 한 줄만 보낸다: `<id> 리뷰 요청 —
      <브랜치> @ <tip>, 근거는 코멘트에.` 같은 내용을 본문에 다시 싣지
      않는다. 그리고 기다리지 않는다 — 질문이 누구에게 나가 있는지 한
      줄만 보고에 남기고 턴을 끝낸다.
    select:
      # 누가 답하는가 — 리뷰는 competence 결정이라 형제가 정상 답변자다.
      # 그래서 첫 그룹에 scope를 두지 않는다(기본 any). 착지 결정은
      # authority 결정이라 scope: ancestor로 묶여 있다 — 두 문의 종류가
      # 다르고, 그래서 한 문에 합치지 않았다: 합치면 리뷰어가 통합
      # 순서까지 정하게 된다.
      #
      # 자리가 rebase 바로 뒤인 이유. 리베이스는 트리를 바꾸는 단계다 —
      # 충돌 해결은 사람이 쓰는 코드고, tip 해시가 달라진다. 리뷰가 그
      # 앞에 있으면 리뷰어가 본 트리와 상위가 머지할 트리가 체계적으로
      # 다르다. 그리고 리더의 재요청은 await-landing에서 rebase로 돌아
      # 오므로, 리뷰가 rebase 뒤에 있어야 그 순환이 매번 다시 리뷰를
      # 탄다 — 앞에 두면 재정렬된 트리는 정의상 리뷰를 안 거친다.
      # 착지 결정(landing) 뒤인 것도 같은 계산이다: hold로 얼어붙을
      # 브랜치에 리뷰어의 턴을 쓰지 않는다. 그 답은 예약이 아니므로
      # (표는 in_review 이슈로 채워지고 그 전이는 다음 단계다) 리뷰가
      # 되돌려도 상위가 잃는 것은 이미 쓴 턴 하나뿐이다.
      #
      # 리뷰어가 없는 편성이 정상이다. 그때 첫 그룹은 아무도 못 맞춰
      # skip되고(사유는 저널에 남는다) 상위 리더가 받는다. 데몬이
      # 역할·배선·생존을 그 순서로 보고 각각 다른 사유를 적는다
      # (cflow/responders.py Pool.match) — 역할이 없는 것과, 있는데 안
      # 닿는 것과, 닿는데 죽은 것은 고치는 방법이 서로 다르기 때문이다.
      # 선언 하나가 편성에 따라 리뷰어 게이트도 되고 리더 부담도 된다.
      #
      # 첫 그룹의 connect: true — 이 셋 중 「있는데 안 닿는 것」에만
      # 걸린다. 배선이 없는 것은 사고가 아니라 이 편성의 기본값이다:
      # 스폰된 세션은 부모하고만 연결된 채 태어나고 그 밖의 간선은 상위가
      # 명시적으로 긋는다. 즉 워커가 형제 리뷰어에 닿지 못하는 것이 정상
      # 상태이고, 회차마다 사람이 손으로 이어 주지 않는 한 이 그룹은 계속
      # 비어 있다. connect: true는 그 자리에서 데몬 권한으로 워커–리뷰어
      # 간선을 만들고 후보를 다시 맞춘다(cflow/responders.py wire).
      #
      # 무엇을 안 하는가가 범위다. 역할을 든 멤버가 아예 없으면 이어 줄
      # 것이 없어 사유가 그대로고, remote·exited도 그대로 skip된다. 이
      # 런이 스폰한 세션은 애초에 후보에서 빠져 있으므로(Pool.eligible)
      # 워커가 자기 승인자를 만들어 낼 수 없다는 성질은 그대로다. 간선은
      # 워커–리뷰어 한 쌍뿐이라 리뷰어끼리는 여전히 떨어져 있다 — 두
      # 리뷰어를 떼어 두는 것이 두 의견을 얻는 방법이고, 이 선언은 그
      # 판정에 손대지 않는다. 만들어진 간선은 ask 레코드의 wired와 저널의
      # ask_wired에 남아, 사람이 판정으로 그은 간선과 구별된다.
      #
      # 둘째 그룹에는 붙이지 않았다. 착지 결정은 authority 결정이라
      # scope: ancestor로 묶여 있고, 자기 지휘 계통 밖으로 길을 만드는
      # 것은 그 묶음이 막으려던 바로 그것이다. 리뷰는 competence
      # 결정이라 「누구든 그 역할을 든 형제」가 정상 답변자다.
      #
      # 이 선언이 덮지 못하는 구멍이 하나 남는다: 배선이 있어도 responder가
      # 죽거나 마감을 넘기면 otherwise: self:pass로 같은 자리에 온다. 그 통과가
      # 「승인 없이 진행」으로 남는 것은 엔진의 저널이고 워커·리더의 표에는
      # 표시가 없다 — 별도 이슈 claunch-p5z7이다(s127 제기).
      #
      # otherwise: human을 쓰지 않는다 — 리뷰어가 없는 편성에서 워커 수만큼
      # 사용자를 세운다. otherwise: self:pass는 리더까지 기권했을 때의 밸브다.
      # 옵션 이름이 붙지 않은 bare self와의 차이가 요점이다:
      # bare self는 선택을 워커에게 돌려주고, 이 단계는 워커가 답하는 자리가
      # 아니라고 위에서 선언했으므로 둘이 만나면 교착이다(실측: s313
      # run-07d11afe, 사람이 손으로 select를 칠 때까지 6시간 정지 —
      # claunch-wdzd). self:pass는 선택을 아무에게도 돌려주지 않는다 —
      # 엔진이 선언된 기본 옵션 pass를 아무도 고르지 않은 채로 집행하고,
      # 그 통과는 승인이 아니라 무응답으로 저널에 남는다
      # (ask_unanswered_proceeded와 select_confirmed by: unanswered).
      # master를 지키는 것은 이 문이 아니라 리더의 머지 전권과
      # 통합 후 전체 스윕이다 — 착지 결정이 사람 문을 폐지할 때 쓴 것과
      # 같은 판정이다. 이 문은 게이트가 아니라 문이다.
      #
      # timeout이 이 단계의 안전장치다. 없으면 deadline이 안 걸리고
      # (engine._deadline은 timeout이 없으면 None을 준다) 데몬 시계가 돌
      # 것이 없어져, 리뷰어가 질문을 받아 놓고 침묵하면 런이 영구히
      # 굳는다 — 역할이 없을 때가 아니라 있는데 안 답할 때가 위험하다.
      prompt: |
        이 메시의 워커 하나가 한 회차의 목표를 자기 브랜치에 커밋했고
        표적 테스트가 green이다. 착지 요청을 올리기 전에 동료 판정을
        구하는 자리다 — 통과인가, 고칠 것이 있는가?

        질문을 보낸 세션이 그 워커다. 이슈 id는 그 세션이 assignee인
        in_progress 항목이다 — `claunch beads list --status in_progress
        --json`. 근거는 보드와 브랜치에 있다: `claunch beads comments <id>`
        (목표·범위·브랜치·해시·수치)와 `git log --oneline <base>..<tip>`,
        `git diff <base>..<tip>`.

        보는 것은 셋이다: 커밋이 그 목표를 실제로 달성했는가, 범위 밖을
        건드리지 않았는가, 표적 테스트가 그 목표를 실제로 덮는가. 스타일과
        취향은 여기서 다루지 않는다 — 이 문이 막는 것은 잘못된 변경이지
        다른 변경이 아니다.

        판정은 이 답과 별개로 네가 보드에 남긴다:
        `claunch beads comments add <id> "REVIEWED: pass @ <tip>"` 또는
        `claunch beads comments add <id> "CHANGES REQUESTED: <무엇을>"`.
        고칠 것을 고르면 무엇을 고쳐야 하는지가 그 코멘트에 있어야 한다 —
        선택지만으로는 워커가 무엇을 할지 모른다. 상태는 건드리지 않는다:
        이슈는 그대로 in_progress이고, 표를 움직이는 것은 워커의 착지
        요청이다.

        근거를 못 읽었으면 추측하지 말고 abstain으로 넘긴다. 기권은 다음
        그룹으로 넘어가고, 아무도 답하지 않으면 리뷰 없이 통과한다 — 그
        경우 방어선은 리더의 통합 후 전체 스윕이다.
      chooser:
        from:
          - {role: reviewer, connect: true}
          - {role: leader, scope: ancestor}
        otherwise: self:pass
        timeout: 900
      options:
        pass:
          description: 리뷰 통과 — 상위 통합 요청으로 간다
          next: integration-request
        changes:
          description: 고칠 것이 있다 — 작업 실행으로 돌아간다(무엇을 고칠지는 보드의 CHANGES REQUESTED 코멘트다)
          next: work

  integration-request:
    title: 상위 통합 요청 (머지는 상위 세션 전권)
    instructions: |
      이 단계는 통합을 요청하는 단계다 — 머지를 실행하는 단계가 아니다.
      요청 대상은 자신을 스폰한 상위 세션이다: 상위가 리더면 master 통합
      심사 요청(머지는 리더 워크플로우의 통합 단계), 상위가 워커면 내
      브랜치를 그 워커의 브랜치에 --no-ff로 머지해 달라는 요청(실행은
      상위 워커의 커밋 단계 — 트리 구조가 한 단계씩 위로 접힌다).
      첫 행동은 보드다 — 요청의 본체는 코멘트이고 메시지는 그것을 가리키는
      nudge다: `claunch beads update <id> --status in_review` 와, 아래 증거
      묶음을 담은 `claunch beads comments add <id> -f <파일>` (그 코멘트의 첫
      줄은 `LANDING REQUEST @ <tip>`). 상위의 통합 대기 표는 이 in_review
      목록이고, 이 전이가 없으면 요청은 표에 없다. rebase 재요청을 받아
      재정렬한 뒤에는 같은 전이와 새 마커 코멘트를 다시 낸다(상위가
      in_progress로 되돌려 두었다).
      ── 배치 회차(이 브랜치에 실린 일감이 둘 이상) ──
      실린 이슈 **전부**를 in_review로 전이한다 — 하나라도 in_progress로
      남으면 그 일감은 표에 없고, 머지 뒤 닫을 자격도 그 이슈에는 서지
      않는다. 증거 묶음은 주 이슈(오프닝의 `issue: <id>`) 코멘트 하나에
      담고 그 첫 줄은 `LANDING REQUEST @ <tip> batch: <id1,id2,...>`다.
      나머지 이슈에는 한 줄만 남긴다: `LANDING REQUEST @ <tip> (batch of
      <주 이슈 id>)`. 리더는 같은 tip의 행들을 후보 하나로 읽는다 —
      묶음을 이슈마다 복사하지 않는다. nudge도 하나이고 첫 줄에 id 목록을
      싣는다.

      ── 금지: 워커는 master를 직접 머지하지 않는다 ──
      master로의 git merge 실행, master 체크아웃 후 커밋·리베이스·
      cherry-pick, fast-forward로 슬쩍 반영, master로의 push — 전부
      금지다. 사용자가 승인했다는 이유로도, 리더가 응답이 없다는 이유로도,
      충돌이 없어 안전해 보인다는 이유로도 예외가 아니다. master 반영
      경로는 리더 워크플로우(improv-leader)의 통합 단계 하나뿐이다.
      이 런에서 master를 움직였다면 그 자체가 사고다.

      증거 묶음은 그 코멘트에 담는다 — 상위가 심사하는 자리가 거기다:
      - 목표·범위, 브랜치 이름, 기능 커밋·머지 커밋 해시, 테스트 수치
        (표적 실행임을 명시하고 돌린 모듈을 적는다 — 전체 스윕은 리더의
        통합 단계에서 배치로 한 번, subagent 안에서 돈다)
      - git log <상위 브랜치>..<branch> / <branch>..<상위 브랜치> 양방향
        차이(상위가 리더면 상위 브랜치는 master) — 상위 브랜치가 분기
        이후 움직였으면 그 사실과 예상 충돌 지점을 명시 (요청 전 rebase
        단계에서 정렬했으므로 뒤처짐은 없어야 정상이다 — 남아 있으면
        rebase가 충분하지 않았던 것이므로 그 사실을 함께 적는다)
      - rebase했으면 그 사실과 rebase 전후 tip 해시, 재확인된 표적
        테스트 수치
      - 이 브랜치가 다른 세션의 브랜치를 포함하면(git branch --contains)
        함께 실리는 작업이 무엇인지 명시 — 하위 워커 브랜치를 --no-ff로
        모은 회차면 어느 자식의 어떤 브랜치가 어떤 머지 커밋으로
        실렸는지 트리 구조를 그대로 적는다
      - 스택 위치(부모가 중간 워커면): 기준 브랜치와 요청 시점의 그 tip
        해시(내 분기점과 같아야 한다 — 다르면 restack이 덜 된 것이다),
        스택 순서, 그리고 `git merge-tree $(git merge-base <기준> <branch>)
        <기준> <branch>` 프리뷰가 깨끗하다는 것. 중간 워커는 이 묶음을
        기준 대비로 심사해 자기 브랜치에 --no-ff로 착지하고, 남은 자식들
        에게 restack 공지를 보낸다(improv-mid의 착지 절차).
      이 묶음은 코멘트와 보고(cflow 저널)에 남는다. 상위 세션에는 nudge만
      보낸다 — 묶음을 메시지 본문에 다시 싣지 않는다. 네 줄이면 된다:

          <세션> -> <상위> [ask] <id> in_review — LANDING REQUEST @ <tip>.
          증거 묶음·양방향 diff·심사 한계 코멘트에 있다.
          착지 델타 전체 +N / 워커 축 +M. 미해결 한계 <있음/없음>.
          브랜치 동결했다. 판정 부탁.

      셋째 줄이 nudge에 값이 실리는 유일한 자리다 — 상위는 그 한 줄로
      코멘트를 당겨 읽을지 표만 보고 줄을 세울지를 정한다. 빼면 상위는 매번
      전부 당겨 읽거나(아낀 것이 없다) 안 읽고 판정한다(더 나쁘다).
      상위가 다른 머신이면 이 갈래가 서지 않는다(보드를 공유하지 않는다) —
      그 경우에만 묶음을 메시지로 보낸다. 보낸 뒤 브랜치를 동결한다(추가
      커밋 없음). 상위가 없는 편성(메시 미가입)이면 코멘트와 보고로 남기고
      사용자에게 통합은 리더 세션 또는 사용자 본인의 몫임을 안내한다 — 그
      경우에도 이 워커가 대신 머지하지 않는다.
      리더가 rebase 재요청을 보내면(분기가 다시 벌어졌거나 미리 병합이
      충돌한다는 것) 브랜치를 동결 해제하고 rebase 단계로 돌아가 최신
      대상 위로 다시 정렬한 뒤, 갱신된 증거 묶음으로 재요청한다.
    done_when: |
      이슈가 in_review로 전이되었고(배치면 실린 이슈 전부) 증거 묶음(목표·
      범위, 브랜치, 해시, 수치, 양방향 diff, 포함 관계 — 자식 브랜치를
      모았으면 그 트리까지, 배치면 `batch:` id 목록)이
      `LANDING REQUEST @ <tip>` 코멘트에 담겼으며, 상위 세션에는 그것을
      가리키는 nudge가 나갔다(묶음을 메시지 본문에 다시 싣지 않았다 — 상위가
      다른 머신이거나 부재면 각각 묶음 전송·사용자 안내로 대체). 브랜치는
      동결 상태다. master는 움직이지 않았다.
    # 상위가 세션 레일을 읽는 시점이 바로 여기다 — 요청이 나간 직후.
    # enqueue-landing: 이 스텝을 떠나는 순간(= await-landing 진입) 데몬이
    # 이 워커의 in_review 이슈와 tip을 부모 런의 착지 큐(landing_queue:를
    # 선언한 워크플로, 예: improv-leader)에 등록한다. 재요청으로 다시
    # 지나가면 같은 이슈 항목의 tip이 갱신된다. 부모가 큐를 선언하지
    # 않았으면 trigger_skipped로 남고 아무 일도 없다.
    triggers:
      - briefing
      - do: enqueue-landing
        at: leave
    next: await-landing

  await-landing:
    title: 착지 대기 (요청은 착지가 아니다)
    # 이 회차가 done이 되는 조건은 「요청했다」가 아니라 「머지됐다」다.
    # 이 스텝이 생기기 전 integration-request는 곧바로 wrapup으로 갔고,
    # wrapup은 같은 턴에 세션을 죽이라고 지시했다 — 브랜치가 남의 대기표에
    # 서 있는 채로 회차가 done이 됐다. 거절된 요청, 답 없는 rebase 재요청,
    # 배치 스윕에서 조용히 빠진 브랜치를 아무도 알아채지 못했다: 알아챌
    # 세션이 이미 죽어 있었기 때문이다.
    #
    # select인 이유: 결과가 셋이고 셋 다 실재한다(착지, 충돌로 인한 재정렬,
    # 기준선 이동으로 인한 재측정). select에는 verify를 걸
    # 수 없으므로(엔진 규칙 — model.py "'verify' is not allowed on a select
    # step") 기계 확인은 다음 스텝(landed)이 진다. 여기서 고르는 것은
    # 「무엇이 왔는가」이고, 「정말 머지됐는가」는 기계가 본다.
    # 다만 select에도 awaits는 걸린다 — 금지된 것은 verify뿐이고, awaits는
    # 명시 probe만 요구한다(model.py의 _parse_step). 그 자리가 이 대기에서
    # 값을 낸다: 여기 서 있는 동안 대상이 움직여 판정이 뒤집히는 것을
    # 데몬이 먼저 본다.
    # improv-mid의 await-landing과 같은 자리·같은 이름이다 — 그쪽은 기계
    # 확인이 없어 agent의 자기 신고로 끝나고, 이쪽은 그 뒤에 게이트가 있다.
    select:
      chooser: agent
      prompt: |
        상위 세션의 답이 왔는가?

        · 머지됐다는 통지(머지 커밋 해시)가 왔거나, 프로브가 착지로
          뒤집혔으면 landed — 다음 스텝의 기계 확인으로 넘어간다. 통지도
          프로브도 없이 짐작으로 고르지 마라: 다음 스텝이 git으로 다시
          보므로 안 실렸으면 거기서 막힌다.
        · **rebase·remeasure를 고르기 전에 착지부터 확인한다**: `git
          merge-base --is-ancestor <동결 tip> <통합 대상>`. 참이면 무엇이
          왔든 landed다. 상위의 기준선 통지는 보드 상태(in_review)로
          주소를 잡으므로, 앞 회차에 이미 머지됐는데 아직 닫지 않은
          이슈에게도 가고, 그 통지의 머지 목록에는 내 이슈가 없다 — 그걸
          재측정 요청으로 읽으면 착지한 일을 정렬·리뷰부터 다시 돈다
          (claunch-dlq0o, 143회차 s753).
        · rebase 재요청이 왔으면(미리 병합이 텍스트로 충돌한다) rebase —
          동결을 해제하고 정렬 단계로 돌아가 최신 대상 위로 재정렬한 뒤
          갱신된 묶음으로 재요청한다.
        · 재측정 요청이 왔으면(대상이 움직여 내 표적 수치가 착지할 트리를
          설명하지 않는다 — 병합 자체는 깨끗하다) remeasure — 같은 정렬
          단계로 돌아가되 재정렬은 선택지 중 하나일 뿐이다. 프리뷰 머지
          위에서 다시 재면 브랜치가 안 움직이므로 리뷰어가 승인한 tip이
          그대로 착지한다.
        · 상위가 「이 회차에는 싣지 않는다」고 답했으면(보드 코멘트의
          `HOLD:` / `CHANGES REQUESTED:`, 또는 같은 뜻의 메시지) declined.
          그것도 답이므로 계속 기다리지 않는다. rebase·remeasure와 섞지
          마라 — 그 둘은 「고쳐서 다시 올려라」이고, declined는 「이 요청은
          여기서 끝났다」다.
        · 넷 다 아니면 nudge. 답이 아직 없다는 것 자체가 상태이고, 이
          스텝의 기본 동작이다.

        ── 답이 없을 때: nudge ──
        이 자리는 오래 「셋 다 아니면 고르지 않고 머문다」였다. 그래서
        상위가 조용하면 회차가 상한 없이 서 있었다 — 요청이 배치 스윕에서
        조용히 빠진 것인지, 상위가 아직 표를 안 본 것인지, 상위 세션 자체가
        끝난 것인지를 가를 신호가 이쪽에 하나도 없었기 때문이다. 침묵은 셋
        모두와 똑같이 생겼다.
        nudge가 그 자리를 대신한다: 상위에게 재촉 한 줄을 보내는 스텝을
        거쳐 이 대기로 돌아온다. 침묵이 길어질수록 상위의 표에 같은 행이
        다시 뜨고, 상위가 이미 끝난 세션이면 전송 실패가 그것을 말해 준다.

        이 옵션에는 10분 간격이 걸려 있다(`interval: 600`). 간격 안에
        고르면 거절이 아니라 **보류**다 — 런이 `waiting_window`로 서고,
        창이 열리는 순간 데몬의 WindowClock이 런을 움직이며 이 세션을
        깨운다. 그러니 여기서 할 일은 하나다: **nudge를 고르고 턴을
        끝낸다.** 시계를 보는 것은 데몬이지 네가 아니다.
        보류 중에 상위의 답이 오거나 프로브가 뒤집히면 그때 해당 옵션을
        고른다 — 다른 옵션을 고르면 보류는 취소된다. 같은 nudge를 다시
        고르면 보류는 유지되고 reason만 최신으로 갈린다.

        기다리는 동안 조건을 손으로 폴링하지 마라 — nudge를 고른 뒤에는
        턴을 끝내고 idle로 있으면 된다. 착지는 남이 만드는 상태이고,
        상위의 fyi와 창 열림이 깨우는 신호다. 슬롯 하나를 무는 값으로
        「요청했는데 안 실렸다」를 잡는 것이 이 대기의 값이다.
        그리고 상위의 답만이 신호는 아니다 — 이 자리에는 데몬이 다시 재는
        프로브가 걸려 있어(awaits), 내가 idle인 동안 대상이 움직여 판정이
        뒤집히면 그것을 말해 준다. 상위의 거절을 기다려서 알게 되던 것을
        기계가 먼저 말하는 자리가 여기다. 프로브가 re-measure/rebase로
        뒤집혔다고 말하면 상위의 재요청을 기다리지 말고 그 갈래를 고른다 —
        그편이 상위의 턴 하나와 왕복 하나를 아낀다. 착지(landed)로
        뒤집혔다고 말하면 상위의 통지를 기다리지 말고 landed를 고른다 —
        상위의 착지 통지가 이 세션에 닿지 않는 경우가 실제로 있었다(이슈가
        in_progress로 남아 in_review 대상 통지에서 빠졌다, claunch-dlq0o).
        프로브가 착지를 따로 답하는지는 이 저장소의 프로브가 정한다 —
        답하지 않는 프로브라면 위의 조상 확인이 그 자리를 채운다.
      options:
        landed:
          description: 상위가 머지했다는 통지를 받았거나 프로브·조상 확인이 착지를 말한다 — 기계 확인으로
          next: landed
        rebase:
          description: rebase 재요청을 받았다(미리 병합 충돌) — 동결 해제, 재정렬 후 재요청
          next: rebase
        remeasure:
          description: 재측정 요청을 받았다(기준선이 움직였다, 병합은 깨끗) — 동결 해제, 프리뷰 머지 위 재측정 또는 재정렬 후 재요청
          next: rebase
        # 답이 없을 때의 기본 갈래. `interval`은 엔진의 paced option이고
        # (model.py의 Cadence 절), 간격 안의 select는 거절이 아니라 보류다:
        # 런이 waiting_window로 서고 데몬의 WindowClock이 창이 열릴 때 런을
        # 옮기며 세션을 깨운다. 즉 재촉의 시계가 에이전트 밖에 있다 — 이
        # 대기가 무한정이던 이유가 「깨우는 것이 상위의 답뿐」이었으므로,
        # 고치는 자리도 거기다.
        # 600초인 이유: 상위(리더)의 통합은 300초 창에 배치로 모이고 스윕이
        # 그 뒤에 붙는다. 그 한 주기보다 짧게 재촉하면 상위가 아직 배치를
        # 닫지도 못한 시점에 같은 행을 다시 밀어 넣는 것이라, 재촉이 값을
        # 내는 것이 아니라 상위의 턴을 먹는다. 두 주기가 간격의 바닥이다.
        # 창 기록(state.windows)은 슬롯의 것이라 런보다 오래 산다 — 그래서
        # 한 세션이 두 번째 회차를 돌면 그 회차의 첫 nudge도 앞 회차의
        # 마지막 nudge를 기준으로 페이싱된다. 회차 사이 간격이 10분보다
        # 짧을 때만 보이는 차이이고, 그때 보류되는 것은 맞는 동작이다.
        # 상한은 엔진의 max_visits다(기본 25). 재촉이 그만큼 돌아도 답이
        # 없으면 루프 가드가 사람 앞에 런을 세운다(waiting_approval,
        # reason: loop_limit) — 약 4시간이고, 그 지점에서 사람이 물어야 할
        # 것은 「한 번 더 재촉하면 달라지는가」다.
        nudge:
          description: 답이 아직 없다 — 상위에 재촉 한 줄을 보내고 이 대기로 돌아온다(10분에 한 번)
          interval: 600
          next: landing-nudge
        declined:
          description: 상위가 이 회차에 싣지 않기로 했다(HOLD / CHANGES REQUESTED) — 거절을 정산하고 사용자 승인을 거쳐 재작업으로
          next: landing-declined
    # 이 대기가 이 워크플로에서 가장 긴 자리다 — 리더의 통합은 300초 창에
    # 배치로 모이고 스윕이 그 뒤에 붙는다. 그 사이 다른 워커가 착지해
    # master가 움직이면 여기 얼어 있는 브랜치의 증거가 낡는데, 워커는
    # idle이라 아무것도 모른다. 지금까지 그 사실을 알려 주던 채널이 리더의
    # 거절이었다: 알림을 사람 턴으로 사는 셈이다.
    # awaits가 그 채널을 기계로 바꾼다 — 데몬이 이 자리에 서 있는 동안
    # 프로브를 다시 재고, 종료 코드가 **바뀔 때만** 말한다(model.py의
    # Awaits: 출력은 비교에서 뺀다). 그래서 두 실패가 같은 코드면 안 된다:
    # 낡음(1)에서 충돌(3)로 넘어간 브랜치가 아무 소리도 못 내게 된다.
    # select 스텝에 verify는 못 걸지만 awaits는 걸린다 — 금지된 것은
    # verify뿐이고, awaits는 명시 probe만 요구한다(model.py _parse_step).
    # 명령은 정렬 스텝의 게이트와 같은 것이다. 착지한 브랜치가 「낡았다」로
    # 읽히지 않는 것이 여기서 특히 중요하다: --no-ff 착지 뒤에는 대상이
    # 내 tip보다 앞서므로, 순진한 「대상이 앞섰나」 프로브는 일이 성공한
    # 바로 그 순간 뒤집힌다. merge_ready.py가 조상 관계를 먼저 보는 이유다.
    # --landed-exit: 착지를 0이 아닌 5로 답하게 한다. 없으면 착지 전의
    # ready와 착지 후의 landed가 둘 다 0이라 프로브가 뒤집히지 않고, 워커는
    # 착지를 리더의 통지로만 알았다 — 보드 상태로 주소를 잡는 통지는
    # in_progress로 남은 이슈를 놓치고, 앞 회차에 머지됐는데 아직 닫지 않은
    # 이슈에게는 다음 회차 통지가 재측정 요청으로 읽혔다(claunch-dlq0o).
    # 정렬 게이트(rebase의 verify)는 이 플래그 없이 돈다: 게이트에게 착지한
    # 브랜치는 막을 것이 없는 ready다.
    # poll 60/timeout 25 — MAX_AWAITS_TIMEOUT(30)과 timeout<=poll 규칙 안이다.
    awaits:
      probe: 'uv run --no-sync python tools/merge_ready.py --landed-exit'
      poll: 60
      timeout: 25
      describe: '통합 대상이 움직여 이 브랜치의 판정이 뒤집혔는지 (0 ready / 1 재측정 / 3 rebase / 5 착지)'

  landing-nudge:
    title: 착지 재촉 (대기 자리로 되돌아온다)
    # await-landing의 nudge 옵션이 오는 자리이고, 여기서 하는 일은 메시지
    # 하나다. 별도 스텝인 이유는 둘이다: select 스텝에는 instructions를 쓸
    # 수 없어(model.py의 _parse_step — select가 있으면 instructions는
    # 선택이고, 이 스텝의 절차는 프롬프트에 넣기에는 select가 고르는 것과
    # 다른 종류다) 재촉의 절차를 적을 곳이 마땅치 않고, 저널에 재촉이 스텝
    # 방문으로 남아야 「몇 번 불렀는데 답이 없다」가 밖에서 읽히는 값이 된다.
    instructions: |
      상위 세션의 답이 아직 없다. 재촉 한 줄을 보내고 대기 자리로
      돌아간다. 이 스텝에서 하지 않는 것부터 적는다.

      · 브랜치를 건드리지 않는다. 동결은 그대로다 — 커밋도, rebase도,
        force push도 없다. 재촉은 상태를 바꾸는 행동이 아니다.
      · 보드에 코멘트를 새로 쌓지 않는다. 증거 묶음은 integration-request
        가 남긴 `LANDING REQUEST @ <tip>` 코멘트 하나에 이미 있고, 재촉은
        되짚어 읽힐 기록이 아니라 지금 이 순간의 신호다(공통 규칙의
        「기록은 코멘트에, 신호는 메시지에」). 같은 이슈에 재촉 코멘트를
        n개 쌓으면 다음에 그 이슈를 읽는 사람이 판정과 잡음을 갈라야 한다.
      · 요청을 다시 만들지 않는다. 이슈는 이미 in_review이고 그 상태가
        상위의 대기 표다.

      보내는 것은 두 줄이다. 첫 줄에 이슈 id와 tip(원격 편성이면 PR url도
      — pr-open이 적어 둔 것), 둘째 줄에 요청 시각 이후 지난 시간과 이번이
      몇 번째 재촉인지, 그리고 그동안 판정을 바꾼 값이 있으면 그것 하나.

          <세션> -> <상위> [nudge] <id> in_review — LANDING REQUEST @ <tip>.
          <n>번째 재촉, 요청 후 <t>분. 프로브 <ready/재측정/rebase>, 미해결 한계 <있음/없음>.

      둘째 줄이 재촉을 재촉 이상으로 만드는 자리다. 같은 말을 반복하는
      알림은 읽는 사람이 건너뛰는 법을 먼저 배우게 한다 — 바뀐 값이 실려야
      상위가 「아직 안 봤다」와 「보고 미뤘다」를 가른다. 바뀐 것이 없으면
      없다고 적는다. 프로브 값은 이 세션이 받은 awaits 통지에서 읽는다.

      상위에게 보낼 수 없으면(메시 미가입, 전송 실패, 상위 세션 종료) 그
      사실이 답이다 — 재촉을 반복할 대상이 없다는 뜻이므로 보고에 그
      실패를 그대로 적고 터미널 사용자에게 알린다. 상위가 이미 끝난
      세션이면 이 요청을 이어받을 자리가 없으므로, 다음을 정하는 것은
      사용자다.
    done_when: |
      상위 세션에 재촉 메시지가 나갔고 그 메시지 id와 이번이 몇 번째
      재촉인지가 보고에 있다. 보낼 수 없었으면 그 실패(대상·사유)와
      사용자에게 알린 사실이 대신 보고에 있다 — 보낼 곳이 없는 것과 안
      보낸 것은 다르다. 브랜치는 동결 상태 그대로이고 보드에는 재촉
      코멘트를 쌓지 않았다.
    next: await-landing

  landing-declined:
    title: 착지 거절 정산 (실패 상태)
    # 이 스텝이 생기기 전, 거절에는 선언된 길이 없었다. landed의
    # instructions가 「상위가 이 회차에 안 싣기로 했으면 … 런을 넘겨 주는
    # 것(`claunch cflow goto wrapup`)은 사용자다」라고 적고 있었고, 그것이
    # 유일한 출구였다 — 선언되지 않은 전이를 사람이 손으로 만들어 주는
    # 경로다. 그래서 거절당한 회차는 두 갈래로 끝났다: 사람이 goto를 쳐
    # 주면 착지 없이 마감, 안 쳐 주면 await-landing에 그대로 서 있기.
    # 「거절당했으니 고쳐서 다시 한다」는 어느 쪽도 아니었는데, 실제로
    # 가장 흔한 것이 그것이다.
    # 이 스텝은 그 세 번째를 선언한다. 여기서는 정산만 하고(기록·동결
    # 해제·상태 되돌리기) 재작업 재개는 다음 스텝의 사람 게이트가 연다 —
    # 정산을 게이트 뒤에 두면 승인이 늦는 동안 이슈가 in_review로 얼어
    # 상위의 표에 아무도 안 미는 행으로 남는다.
    instructions: |
      상위 세션이 이 회차의 착지를 거절했다. 이 스텝은 그 거절을
      정산하는 자리다 — 재작업은 아직 시작하지 않는다.

      ── 1. 거절을 읽는다 ──
      무엇이 거절됐고 무엇을 고치라는 것인지 확정한다. 정본은 보드다:
      `claunch beads comments <id>`의 `CHANGES REQUESTED: <무엇을>` /
      `HOLD: <이유>` 마커가 그것이고, 메시지로만 왔으면 그 문면을 읽는다.
      사유가 없거나 「무엇을 고치면 되는지」가 서지 않으면 여기서
      추측하지 말고 상위에게 한 줄로 되묻는다 — 근거 없는 재작업은 다음
      회차에서 같은 거절을 다시 받는다.

      ── 2. 보드를 정산한다 ──
      실린 이슈 **전부**를 in_review에서 되돌린다:
      `claunch beads update <id> --status in_progress`. 배치 회차면 주
      이슈뿐 아니라 `batch:` 목록의 이슈가 전부 대상이다. 하나라도
      in_review로 남으면 상위의 통합 대기 표에 아무도 안 미는 행이 남는다.
      그리고 거절 사실을 이슈 코멘트로 남긴다 — 되짚어 읽힐 기록이다:
      `DECLINED: <상위 세션> @ <tip> — <사유 한 줄>`. 상위가 이미 남긴
      마커가 있으면 그것을 복사하지 말고 이 줄에서 가리킨다.

      ── 3. 동결을 푼다 ──
      이 브랜치는 integration-request 이후 동결 상태였다. 재작업을 하려면
      풀어야 하고, 푸는 것은 사실 선언 하나다 — 이 스텝 이후의 커밋이
      허용된다는 것. 되돌릴 것은 없다: 이미 한 커밋은 그대로 두고 그 위에
      고친다. 브랜치를 지우거나 reset하지 않는다. 원격 편성이면 PR도 닫지
      않는다(같은 브랜치에 커밋이 더 붙으면 PR이 스스로 갱신된다).

      ── 4. master는 여전히 건드리지 않는다 ──
      거절은 「워커는 master를 직접 머지하지 않는다」의 예외가 아니다.
      거절당했으니 직접 넣겠다는 경로는 이 워크플로에 없다.

      보고에는 거절 사유(상위의 원문 그대로), 되돌린 이슈 id 목록과 그
      전이 출력, 남긴 `DECLINED:` 코멘트, 그리고 재작업의 범위 요지를
      적는다 — 다음 스텝의 사람 게이트가 읽는 것이 그 요지다.
    done_when: |
      거절 사유가 상위의 원문으로 보고에 있고(사유가 서지 않아 되물었으면
      그 사실과 보낸 메시지 id), 이 브랜치에 실린 이슈가 전부 in_review에서
      in_progress로 되돌아갔으며(전이 출력을 보고에 붙인다), `DECLINED:`
      코멘트가 남았고, 재작업의 범위 요지가 보고에 있다. master는 움직이지
      않았고 브랜치·PR을 지우거나 되감지 않았다.
    next: rework-gate

  rework-gate:
    title: 재작업 재개 사용자 승인
    # 왜 사람 게이트인가 — 이 자리가 워크플로에서 유일하게 「회차가 앞으로
    # 되감기는」 전이다. work로 돌아가면 이 런은 같은 브랜치 위에서 작업·
    # 테스트·커밋·착지를 다시 돌고, 그 한 바퀴는 세션 슬롯과 상위의 심사
    # 턴을 한 번 더 쓴다. 자동으로 되감으면 거절 → 재작업 → 같은 거절이
    # 사람 눈에 안 띈 채로 도는 것이 가능해진다 — 사용자가 명시적으로
    # 확인한 뒤에 진행하라는 것이 이 게이트의 지시다(claunch-693w).
    # `from`이 없으므로 응답자는 사람뿐이다(model.py: 「A human is never an
    # entry in `from`」). 상위 세션에 위임하지 않는 이유는 상위가 방금
    # 거절한 당사자여서다 — 되감을지를 거절한 쪽에 다시 묻는 것은 같은
    # 결정을 한 사람에게 두 번 주는 것이고, 그 답은 이미 나와 있다.
    # timeout을 두지 않는다: 답이 없는 동안 이 런은 서 있고, 서 있는 것이
    # 맞다. 이 게이트가 시간으로 저절로 열리면 위 문단의 되감기 루프가
    # 그대로 돌아온다.
    # on_decline은 사람의 `claunch cflow goto landing-declined-hold`로만
    # 닿는다 — 사람 게이트에는 거절 입력이 없다(engine.approve뿐).
    ask:
      prompt: |
        상위 세션이 이 회차의 착지를 거절했고, 워커가 그 거절을
        정산했다(이슈는 in_progress로 돌아갔고 브랜치 동결은 풀렸다).

        이 브랜치 위에서 재작업을 재개하는 것을 승인하는가?

        허가하면: 런이 작업 단계로 되감기고, 같은 브랜치 위에서 작업·
        테스트·커밋·착지 요청을 한 바퀴 더 돈다. 세션 슬롯과 상위의 심사
        턴이 한 번 더 든다.
        보류하면: 런은 이 게이트에 서 있고 세션은 살아 있다. 브랜치와
        커밋은 그대로 남으므로 잃는 것은 없고, 나중에 승인해도 같은
        자리에서 이어진다.
        착지 없이 이 회차를 마감하려면(재작업이 이 세션의 일이 아니라고
        판단되면) `claunch cflow goto landing-declined-hold` — 거기서
        브랜치를 인수인계 이슈로 넘기고 정리로 간다.

        판단 근거: 거절 사유와 재작업 범위 요지가 앞 스텝의 보고에 있다
        (`claunch cflow journal -n 3`), 거절 마커는
        `claunch beads comments <이슈 id>`에 있다.
      on_decline: landing-declined-hold
    instructions: |
      사용자가 재작업 재개를 승인했다. 이 스텝에서 할 일은 인계 한 줄이다.

      상위 세션에 fyi를 보낸다: 거절을 받아 재작업으로 돌아간다는 사실과,
      이슈 id, 무엇을 고칠 것인지 한 줄. 상위의 통합 대기 표에서 이 행이
      왜 사라졌는지를 아는 자리가 그 한 줄뿐이다.
      그리고 **같은 턴에서** next를 밟아 작업 단계로 넘어간다 — 예고만 쓰고
      턴을 끝내면 승인은 났는데 아무것도 진행되지 않는다.

      작업 단계로 돌아가면 그곳의 규칙이 그대로 적용된다. 특히 「작업
      중에는 통합 대상을 따라가지 않는다」가 살아 있다 — 거절이 rebase
      요구였더라도 재정렬은 여기서 하지 않고 `rebase` 단계가 한다.
    done_when: |
      사용자가 재작업 재개를 승인했고, 상위 세션에 재작업 사실을 알리는
      fyi가 나갔다(메시지 id를 보고에 적는다). 상위가 없거나 닿지 않으면 그
      사실을 대신 적는다.
    next: work

  landing-declined-hold:
    title: 착지 거절 후 마감 (재작업 없이)
    # rework-gate의 on_decline이 가리키는 자리다. 사람 게이트에는 거절
    # 입력이 없으므로 여기에 닿는 길은 사람의 `claunch cflow goto
    # landing-declined-hold` 하나이고, 그 우회는 저널에 남는다.
    # end-hold와 같은 모양이고 다루는 것이 다르다: end-hold는 세션을 살려
    # 두는 결정이고, 이쪽은 이 회차를 착지 없이 닫는 결정이다.
    instructions: |
      사용자가 재작업 재개 대신 이 회차의 마감을 골랐다(`claunch cflow
      goto landing-declined-hold`). 브랜치는 거절당한 채로 남고, 이 회차는
      착지 없이 닫힌다.

      먼저 왜 마감인지 읽는다 — goto 기록과 사람의 말이 저널에 있다
      (`claunch cflow journal -n 5`); 없으면 터미널 사용자에게 묻는다.

      그다음 남는 것을 누군가의 손에 둔다. 이 브랜치의 일감은 아직 끝나지
      않았고 착지도 안 됐으므로, 여기서 그냥 닫으면 거절 사유와 이미 한
      작업이 아무 데도 연결되지 않는다:
      · 이슈를 `HOLD: <상위 세션>이 착지를 거절, 재작업은 이 세션의 일이
        아님 — 브랜치 <이름> @ <tip>` 코멘트로 표시한다. 상태는
        in_progress 그대로 두고 닫지 않는다 — 머지되지 않았으므로 닫을
        자격(`merged <해시>`)이 없다.
      · 재작업이 별건이면 인수인계 이슈를 만든다:
        `claunch beads create "<제목>" --priority 3 --labels handoff
        --parent <이 회차 이슈 id> --description "<규격>"`(assignee 없음).
        규격의 출처 절에 이 회차 이슈 id와 거절 사유, 브랜치 이름·tip을
        적는다 — 다음 사람이 그 브랜치를 찾을 유일한 연결이다.
      · 상위에게 fyi 한 줄: 이 회차는 착지 없이 마감하고 브랜치는 남으며,
        인수인계 이슈 id는 무엇인지.

      그리고 정리 단계로 넘어간다 — 그곳의 생성 이슈 정산이 여기서 만든
      이슈를 읽는다.
    done_when: |
      마감 사유가 보고에 있고, 이 회차 이슈에 `HOLD:` 코멘트가 남았으며
      (닫지 않았다), 재작업을 별건으로 넘겼으면 그 인수인계 이슈 id와
      브랜치·tip이 규격에 적혀 있고, 상위에 보낸 fyi의 메시지 id가 보고에
      있다.
    next: wrapup

  landed:
    title: 착지 확인 (체크리스트 — 기계가 재고 기계가 넘긴다)
    # 이 스텝은 checklist 게이트다. 앞의 스텝들과 다른 점 하나: 여기서
    # 「넘어간다」를 판정하는 것은 에이전트가 아니라 데몬이다. 항목마다
    # 명령이 하나씩 붙어 있고 종료 코드가 답이며(0=참), 전부 참이고 이
    # 스텝의 report가 제출돼 있을 때에만 런이 wrapup으로 옮겨진다.
    # 왜 산문이 아니라 목록인가: 이 판정은 오래 instructions 57줄과
    # done_when 5줄로 서 있었고, 밖에서 보는 사람은 「지금 무엇이 참인가」를
    # 물을 곳이 에이전트의 서술뿐이었다. 기계 게이트가 존재하는 이유가
    # 정확히 그 서술에 기대지 않는 것이다. 이제 claunch cflow status와
    # 대시보드가 같은 목록을 그린다.
    # 에이전트의 이탈 경로는 없다(checklist 스텝에는 next:를 쓸 수 없다).
    # 착지 없이 마감해야 하는 회차의 우회는 사람의 `claunch cflow goto
    # wrapup` 하나이고, 그 우회는 저널에 남는다.
    checklist:
      prompt: 동결된 tip이 통합 대상에 실제로 실렸는가
      then: wrapup
      poll: 60
      items:
        # 「어떤 브랜치가 내 tip을 contains 하는가」가 아니라 「내 tip을
        # 부모로 갖는 머지 커밋이 있는가」를 묻는다. 실측 사례가 있다 —
        # 워커 하나가 아무것도 착지하지 않은 tip을 동결해 두었는데 그 위에
        # 스택된 자식 브랜치 때문에 contains 검사가 「실렸다」고 답했다.
        # contains는 후손도 잡고, 후손은 통합이 아니다.
        # tools/landed_check.py가 그 질문이고, 종료 코드는 0=착지 /
        # 1=아직 / 2=판정 불가다. 2와 타임아웃은 unknown으로 기록되고
        # unknown은 참이 아니다 — 답을 못 낸 검사가 게이트를 여는 일은
        # 없다. tests/test_landed_check.py가 그 갈래를 못박는다.
        - id: merged
          describe: 동결된 내 tip을 부모로 갖는 머지 커밋이 통합 대상에 있다
          check: 'uv run --no-sync python tools/landed_check.py'
        # 동결의 기계 절반. 추적 중인 파일이 수정돼 있으면 지금 트리는
        # 내가 요청한 tip이 아니고, 그러면 위 항목이 초록이어도 그것은
        # 다른 내용에 대한 초록이다.
        - id: frozen
          describe: 추적 파일에 미커밋 변경이 없다(브랜치가 동결된 상태다)
          check: 'git diff --quiet && git diff --cached --quiet'
    instructions: |
      체크리스트가 재는 동안 이 스텝에서 할 일은 기록이다 — 통과 판정은
      네가 내리지 않는다.

      상위가 머지했다고 말한 것을 git에서 직접 확인한다. 통지는 증거가
      아니다 — 해시를 잘못 적은 fyi, 머지했다가 되돌린 배치, 다른 브랜치를
      실은 회차가 모두 「머지했다」로 도착한다.

      보고에 남길 것: 동결된 내 tip, 그것을 실은 머지 커밋 해시, 실린 대상
      브랜치, 확인에 쓴 명령과 그 출력. 항목별 종료 코드는 게이트가 열릴 때
      데몬이 저널에 `checklist_passed`로 남기므로 옮겨 적지 않아도 된다 —
      네가 적는 것은 기계가 못 재는 절반이다.

      report를 미루지 마라. 항목이 전부 참이어도 이 스텝의 report가 없으면
      런은 여기 그대로 서 있는다. report가 게이트를 여는 것은 아니다 —
      빨간 항목 위에서는 report가 있어도 아무것도 움직이지 않는다.

      ── 항목이 참이 되지 않으면 ──
      기다린다. 이 스텝을 통과하지 못한 채 wrapup으로 가는 길은 없고, 그것이
      이 스텝의 존재 이유다. 상위가 rebase 재요청을 보냈으면 앞 스텝으로
      돌아가 rebase를 다시 밟는다. 상위가 이 회차에 안 싣기로 했으면 앞
      스텝(await-landing)의 declined 갈래가 그 경로다 — `claunch cflow goto
      await-landing`으로 돌아가 declined를 고르면 거절이 보드에 정산되고,
      재작업 재개는 사용자 승인 게이트(rework-gate)가, 착지 없는 마감은 그
      게이트의 `landing-declined-hold`가 받는다. 사람이 goto로 wrapup에
      직행하는 우회는 여전히 열려 있지만, 그 경로로 가면 거절 사유와
      브랜치가 보드에 연결되지 않은 채 남는다.
      스스로 master에 머지해서 이 게이트를 통과시키는 것은
      「워커는 master를 직접 머지하지 않는다」 위반이다: 게이트를 초록으로
      만드는 것이 목적이 되는 순간 이 스텝은 지키려던 것을 정확히 반대로
      지킨다.

      리베이스·squash로 해시가 새로 찍혀 내 tip이 그대로 실리지 않았으면
      merged 항목은 「아직」으로 답한다. 그때는 무엇이 어떤 해시로 실렸는지
      사람이 읽을 수 있게 적는다 — 게이트를 우회하는 것이 아니라, 우회가
      필요한 상황임을 기록하는 것이다.
    done_when: |
      기계가 재지 못하는 절반이 보고에 있다: 동결된 내 tip, 상위가 통지한
      머지 커밋 해시와 대상 브랜치, 그리고 히스토리가 재작성돼 tip이 그대로
      실리지 않았으면 무엇이 어떤 해시로 실렸는지. 착지 자체는 체크리스트의
      merged 항목이 답하므로 여기서 다시 주장하지 않는다.
    # 머지가 확인된 순간에 저장소 전체를 두고 묻는 상태 점검(master가
    # 초록인가, 미커밋 변경이 없는가)의 답이 바뀐다. 이 스텝을 떠나는
    # 것은 데몬이므로(checklist.then) 요청도 데몬이 보낸다.
    triggers:
      - do: checks
        at: leave

  wrapup:
    title: 회차 마감·정리
    # 아래 첫 문단은 자리가 곧 기능이다 — 옮기거나 지우지 마라. 리마인더
    # 재발화는 instructions를 앞에서부터 _INSTRUCTIONS_LIMIT(1200자)만 싣고,
    # 이 스텝의 지시는 그 네 배가 넘는다. 그래서 그 문단이 세 산출물을 전부
    # 이름한다 — 뒤쪽 산문이 잘려도 무엇을 내야 하는지는 남는다.
    #
    # 이 스텝에 문장을 더할 때는 창 안에 무엇이 남는지 **먼저 재라**:
    #   yaml.safe_load(...)['steps']['wrapup']['instructions'][:1200]
    # 2026-08-28 측정 (이 문단이 생긴 회차, claunch-n0cw):
    #   지시 전체 6221자 / 창 1200자 — 80.7%가 재발화에 안 실린다
    #   창 안:  첫 문단(정리 17·보고서 29·두괄식 77·산출물 104·handoff 57)
    #           · 보드 정리 · 「다음 사람에게 넘길 것」 도입부(1147)
    #   창 밖:  handoff 생성 명령(`claunch beads create` 1194에서 시작,
    #           `--labels handoff` 1251에서 끝 — 1200이 t[1194:1200]의
    #           「claunc」 한가운데 떨어져 명령 이름조차 안 실린다.
    #           그래도 「handoff 이슈를 만들어라」와 그 이유는 첫 문단이
    #           싣는다) · 「담을 것」 규격 전체 · 「메시 메시지에만 남긴
    #           인수인계는 다음 회차에 없다」 · 세션 종료 절
    #           · 보고서를 결과물 축으로 쓰라는 규격(2299)과 「바뀐 뒤에
    #             무엇이 어떻게 동작하는가」 절(2644) — 창 안 첫 문단이
    #             「이 회차가 만든 산출물 자체를 담는다」로 결과물 쪽을
    #             가리키므로 재발화가 이 축에 대해 완전히 비지는 않는다
    # 2026-09-02 재측정 (queue-recheck 회차, claunch-qac7): 지시 전체 7845자.
    #   더한 문장(협소한 후속·자기 배정 금지·assign/hold ask·루프 종료 절)은
    #   전부 1200 뒤에 있고, 창 안 내용은 그대로다 — 창 끝은 여전히 HOLD
    #   코멘트 명령 한가운데(t[1200]이 「<브랜치>」 뒤)다.
    # 한 줄을 앞으로 당기는 것은 다음 문장이 들어올 때까지의 임시 처방이다.
    # 구조 해소는 「담을 것」 규격을 스킬로 분리하는 것이고(claunch-d6v6가
    # 같은 축을 다른 문장에서 만났다), 그 판정은 이 회차에 나지 않았다.
    instructions: |
      이 스텝이 내는 것은 셋: **깨끗한 트리**, **회차 보고서 HTML 한 장**,
      **넘길 것마다 handoff 이슈**. 보고서는 「한 것과 나온 것」으로 시작하고
      이 회차가 만든 산출물 자체를 담는다(규격은 아래 「담을 것」).
      인수인계는 이슈로만 남는다 — 메시에만 적은 것은 다음 회차에 없다.

      회차 잔류물을 정리하고 증거를 보고에 남긴다:
      - 잔류 테스트 서버·headless 브라우저 프로세스 종료 — 부모만 죽고
        자식 node가 살아남는 경우가 있으니 포트 점유(예: Get-NetTCPConnection)
        로 확인한다
      - 임시 파일(.tmp, DB 사본, 픽스처, 브라우저 프로필) 삭제, git status
        클린 확인
      - **basetemp는 지우지 않는다 — 포렌식 기록이다.** 이 정리의 목적은
        작업 트리를 깨끗이 두는 것인데 basetemp는 저장소 밖(예: C:/t)에
        있어 git status에 안 잡힌다. 그 안에 이 회차 실행들의 시작 시각·
        소요·워커 수·실행량이 남아 있고, 그것이 나중에 「이 수치가 무엇에
        대한 판정이었나」를 되짚는 유일한 원자료다. 그래도 지워야 하는
        사정이 있으면 **지우기 전에 (시작 · 소요 · 워커 수 · 실행량)
        네 값을 보고에 적어** 기록을 저널로 옮긴다. 보존 기간은 **그 배치가
        랜딩할 때까지**다 — 랜딩하면 수치가 심사에 쓰이고 나므로 지워도
        된다. 기한을 안 적으면 영구 보존으로 읽히거나, 디스크가 차서
        임의로 지우다 필요한 것을 날린다
      - 보드 정리: 이 이슈를 끝까지 관리하는 것은 assignee인 너다 — 누가
        배정했든. 그러니 마감도 여기서 한다.
        landed로 왔으면(착지가 git으로 증명됐다) 네 이슈를 닫는다:
        `claunch beads close <id> --reason "merged <머지 해시>"` — 해시는
        landed에서 네가 직접 확인한 값이다. 상위의 fyi에 적힌 해시를 그대로
        옮기지 마라: landed가 통지를 증거가 아니라고 부른 이유가 그것이다.
        배치 회차면 **실린 이슈마다** 같은 사유로 닫는다 — 머지는 하나여도
        닫기는 이슈 수만큼이고, 주 이슈만 닫으면 나머지는 in_review에
        영구히 남는다.
        hold로 동결했으면 닫지 않는다 — `claunch beads comments add <id> "HOLD:
        <이유>, <브랜치> @ <tip>"`(상태는 그대로 in_progress — 상위가 본다;
        배치면 실린 이슈마다).
        큐에 남았는데 착수하지 않은 일감(queue-next가 drained로 끊은
        것)은 여기서 손대지 않는다 — 상태도 assignee도 그대로다. 다음
        스텝 queue-recheck가 그것을 보드에서 다시 읽어 다음 회차의 주
        이슈로 삼거나, 착수할 수 없는 것만 풀에 되돌린다.
        다음 사람에게 넘길 것(범위 밖으로 미룬 일, 알아낸 결함, 후속)은
        항목마다 `claunch beads create "<제목>" --priority 3 --labels handoff
        --description "<규격>"`(assignee 없음) — 마감 fyi에 그 id들을 적는다.
        협소하게 해석한다: 이 회차의 범위에서 직접 미룬 일과 작업 중
        알아낸 결함만 만든다. 떠오른 개선 아이디어(P4)는 만들지 않고
        보고서의 「아는 구멍」에 한 줄로 남긴다. 만들 때는 assignee 없이
        만들고, 배정은 아래 「생성 이슈 정산」 절에서 항목마다 한 번에
        친다 — 만든 이슈를 backlog로 두고 끝내지 않는다(claunch-034c4).
        메시 메시지에만 남긴 인수인계는 다음 회차에 없다.

        후속 구현 이슈(이 회차가 만든 것)의 해소 경로:
        - 배정 — 아래 정산의 spawn(자식)·self(자기)가 기본이고, 착수할 수
          없는 것만 pool로 상위가 처분한다. beads 공통 규칙의 상태 전이
          주인이 그대로 적용된다(open→in_progress는 배정받은 워커의
          intake 시작 — self면 이 세션의 다음 회차 intake).
        - 닫기 — 만든 회차에서는 닫지 않는다. 닫는 것은 배정받은 세션이고
          (self면 이 세션의 다음 회차), 그 회차의 landed가 git으로 증명한
          머지 커밋 해시로 닫는다(중간 워커가 자기 --parent 자식을 닫는
          규칙과 같다).
        - 목표 경로 — 후속 이슈가 다음 회차의 목표가 되는 경로는 intake의
          `issue: <id>` 읽기 규칙 그대로다. 그래서 규격의 출처에 원회차
          이슈 id와 그 HOLD/마감 코멘트를 남긴다.
        - 연결 — 원회차가 이미 닫힌 뒤에 만들어지면(닫힌 이슈에는 후속이
          붙지 않는다) 규격의 출처가 유일한 연결이다.

        ── 생성 이슈 정산 — spawn/self/pool 세 갈래로 배정 ──
        `br`에는 생성자로 거르는 옵션이 없다(`--assignee`뿐, `list
        --help` 확인됨) — 그래서 정본이 읽기 명령 하나를 못박는다.
        이 회차에서 만든 활성 이슈(work의 `found`, 여기서 만드는
        `handoff`)를 정확히 이 명령으로 모은다 — 매 회차 즉석 스크립트를
        새로 짜지 않는다:
        `claunch beads list --status open --status in_ready --limit 0
        --json | uv run --no-sync python -c "import json,os,sys; d =
        json.load(sys.stdin)['issues']; print(json.dumps([i for i in d if
        i.get('created_by') == os.environ['CLAUNCH_SESSION']],
        ensure_ascii=False))"`
        (settle-check가 세션 종료 전에 같은 명령으로 다시 읽는다 — 두
        자리가 같은 것을 읽어야 정산의 「됐다」가 갈리지 않는다.)
        항목마다 배정을 정하고 **이 자리에서 직접 친다** — 후속 구현 이슈를
        만들었을 때만이 아니라 위 명령이 하나라도 돌려주면 이 절을 밟는다
        (공통 블록 「스스로 만든 이슈는 만든 세션이 처리한다」, claunch-034c4):
        - **spawn** — 살아 있는 자식(`children`)이 있고 그 이슈가 그 자식의
          영역(같은 파일·모듈·UI 면)이며, 그 자식의 런이 아직 큐를 다시
          읽는 자리 앞에 있으면 — `claunch cflow status -t <자식> --json`의
          `step_id`가 queue-recheck·settle-check·settle-wait·settle-stall·
          end-gate·end-hold가 아니고 status가 done이 아니다 — 그 자식에게:
          `claunch beads update <id> --assignee <자식> --add-label delegated`
          + `claunch beads comments add <id> "DELEGATED: from <원회차 id> to
          <자식>"` + 자식에게 mesh 한 줄(이슈 id, 기준 브랜치). 자식의
          queue-next/queue-recheck가 보드로 읽어 자기 회차에서 처리한다.
          `delegated` 라벨은 자식이 착수하기 전에 종료됐을 때 데몬이 그
          배정을 풀에 되돌리는 표지다(`DELEGATION RELEASED` 코멘트) — 빼면
          종료된 assignee를 단 채 표지 없이 남는다. 이미 그 자리를 지난
          자식에게는 넘기지 않는다: 그 자식은 큐를 다시 읽지 않는다. 맞는 자식이 없어도 work 스텝의 위임
          조건(겹치지 않음·규격·컨텍스트 불필요·크기)을 지금 만족하면 새
          자식을 spawn `--issue <id>`로 세운다.
        - **self** — spawn이 아닌 것 중 이 저장소에서 이 세션이 착수할 수
          있는 것은 전부 자기에게: `claunch beads update <id> --assignee
          $CLAUNCH_SESSION` + `claunch beads comments add <id> "SELF-QUEUED:
          from <원회차 id>"`. 규격이 모자라면 배정 전에 description을
          채운다(staged 순서: description이 먼저, --assignee가 마지막).
          queue-recheck가 이것을 읽어 같은 런 안에서 다음 회차로 돈다.
          런 단위 상한: `claunch cflow status --json`의 `visits.intake`가
          10 이상이면 self를 치지 않고 pool로 보낸다(근거 「self 상한
          도달: intake <n>회」). 엔진의 loop guard는 26번째 intake에서 런을
          사람의 승인(`loop_limit`)으로 세운다 — 그 전에 남은 일의 범위를
          상위가 정하게 한다.
        - **pool** — 이 세션이 착수할 수 없는 것, 그리고 self 상한에 닿은
          것이다: 다른 저장소 영역, blocked, 범위·우선순위를 사용자나
          리더가 정해야 하는 것. assignee 없이 두고 상위의 처분을 묻는다.
        마감 알림은 한 통이다 — 항목마다 (id, 갈래, 한 줄 근거)를 싣는다.
        pool 항목이 없으면 fyi다(배정은 이미 보드에 있다; 상위는 거부권
        `update <id> --assignee ""` + `UNQUEUED by leader: <이유>`를
        가진다). pool 항목이 하나라도 있으면 ask로 보내 그 처분을 묻는다:
        상위가 `HOLD: <이유>` 코멘트를 남기거나 다른 세션에 배정한다.
        이 알림은 HTML 회차 보고서를 쓰기 전에 보낸다(상위가 거부하거나
        답할 시간이 그 사이에 생긴다). 답은 이슈의 코멘트로 남고, 이
        회차의 진행을 막지 않는다 — queue-recheck는 답을 기다리지 않고
        보드를 읽는다(next-round의 self 판정은 `--assignee`가 실제로 이
        세션인지로 가른다). **세션 종료 전에 모두가 정산됐는지는 뒤의
        settle-check가 기계로 다시 확인한다** — pool ask에 상위가 아직
        답하지 않았어도 여기서는 진행을 막지 않고, 막는 자리는
        settle-check/settle-wait다.
        워커가 하지 않는 것 둘: `beads sync`(리더가 통합 뒤에 한 번),
        `.beads/`를 커밋하는 것(리더가 master에서만). 네 close는 DB에만
        쓰이고 그것을 저장소에 싣는 것은 리더의 자리다 — 그래서 워커
        브랜치끼리 그 파일로 충돌하지 않는다.
      최종 보고: 이 회차의 목표·이슈 id(배치면 전부)·커밋·테스트 수치·
      착지 상태(상위 세션에 통합 요청됨 / 동결 — 브랜치 이름)·풀에
      되돌린 일감 id를 요약한다. master는 이 런이
      건드리지 않았어야 정상이다. 동결 브랜치가 남았으면 상위 세션에
      fyi로 알려 통합 대기 목록에 오르게 한다.

      ── 회차 보고서 (HTML 한 장 — 이 회차의 마지막 산출물이다) ──
      바로 위의 최종 보고는 이 대화에만 남는다. 저널은 스텝별 기록이고,
      메시 fyi는 한 사람에게 한 번 간다. 세션이 닫히면 그 셋이 전부 사람
      손에서 사라진다 — 그래서 회차마다 **읽을 수 있는 HTML 한 장**을
      남긴다. 세션이 죽은 뒤에도 남는 유일한 산출물이다.

      쓸 자리를 네가 정하지 않는다 — `claunch report path --issue <이슈 id>`가
      찍어 주는 경로 그대로 쓴다(배치 회차면 주 이슈 id 하나로 한 장 — 실린
      일감 전부를 그 한 장에 담고, 「회차의 목표와 범위」 절에 id를 모두
      적는다):
      `<데몬 dir>/reports/<세션>/<UTC스탬프>-<이슈>.html`.
      저장소 밖이라 이 파일을 쓰는 것이 git status를 더럽히지 않고
      (바로 위의 「클린 확인」과 서로 몸싸움하지 않는다), 같은 세션·같은
      이슈면 같은 경로를 다시 주므로 고쳐 쓰면 덮인다(반쪽짜리 보고서
      두 장이 생기지 않는다). 다른 데서 쓴 페이지를 옮길 땐
      `claunch report save <파일>`.

      두괄식으로 쓴다 — 결론이 위, 과정이 아래다. 이 페이지를 여는 사람은
      대개 「그래서 뭘 했고 뭐가 나왔나」만 알면 되고, 근거까지 읽을 사람은
      스크롤한다. 순서를 뒤집으면 그 사람이 목표·범위·측정을 다 지나야
      결과물에 닿는다. 아래 항목 순서가 곧 페이지의 절 순서다.

      페이지를 꿰는 축은 **결과물이지 작업 이력이 아니다.** 커밋과 이슈는
      이 회차가 그 결과에 닿은 경로이고, 경로를 절 단위로 늘어놓으면 읽는
      사람이 그것을 스스로 합쳐 결과를 재구성해야 한다. 그 합치는 일을
      보고서가 대신하는 것이 이 페이지의 용도다.

      담을 것 — 최종 보고와 같은 사실을, 사람이 브라우저에서 읽는 형태로:

      · **한 것과 나온 것** (맨 위, 스크롤 없이 읽히는 자리). 세 줄이면
        된다: 이 회차가 무엇을 했는가 / 그래서 무엇이 생겼는가 / 지금
        어떤 상태인가(착지했다·요청 올렸다·동결이다, 이슈 id와 tip).
        제목만 보고 닫는 사람도 이 세 줄은 읽는다.

      · **바뀐 뒤에 무엇이 어떻게 동작하는가.** 이 회차가 끝난 뒤의 상태를
        그 자체로 서술한다 — 전에는 이랬고 지금은 이렇다. 읽는 사람이
        알고 싶은 것은 「커밋이 몇 개였나」가 아니라 「이제 이것이 무엇을
        하는가」다. 그래서 페이지를 **커밋 단위나 이슈 단위로 나누지
        마라** — 그 순서는 만든 사람이 일한 순서이지 읽는 사람이 이해하는
        순서가 아니다. 절 제목이 해시와 이슈 id면, 그 변경이 무슨 일을
        하는지가 페이지 어디에도 안 남는다. 해시와 커밋 개수는 아래
        「증거」 절에, 이슈 id는 「회차의 목표와 범위」 절에 둔다.

      · **이 회차가 만든 것 자체.** 사람이나 에이전트가 실제로 읽거나 보게
        되는 산출물이 있으면 **그것을 페이지에 그대로 싣는다** — 새 문구,
        설정 기본값, API 응답 형태, 화면, 명령의 출력. 다음 항목의 파일
        목록과 근거는 이것을 설명하지, **대신하지 않는다.**
        산출물이 코드뿐이면 이 절은 비워도 된다 — 그때는 diff가 그 자리를
        받친다. 없는 산출물을 지어내지 마라(빈 절을 빨갛게 만들면 절을
        채우려고 꾸미게 된다 — review의 빈 선택 조항과 같은 이유다).
        이 항목이 있는 이유는 실측이다: 아래 다섯 항목을 전부 채우고
        verify를 통과한 보고서가, 그 회차의 산출물인 문장 다섯 줄을 한 줄도
        담지 않은 채 나왔다(2026-08-28, claunch-7leu/claunch-2l3f). 나머지
        항목은 전부 과정과 메타데이터라서, 다 채워도 「무엇을 만들었는가」를
        아무도 묻지 않는다.

      · 회차의 목표와 범위(제외한 것 포함), 이슈 id
      · 무엇을 왜 그렇게 했는가 — 바꾼 파일과 그 선택의 근거
      · 증거: 커밋 해시, 테스트 수치(표적 실행이면 무엇을 골랐는지),
        빨갛다가 고친 것 — 해시를 기억에서 적지 마라, `claunch commits`가
        이 세션의 스탬프된 커밋을 이미 시간순으로 내놓는다(대시보드 세션
        상세의 Commits 블록이 같은 목록이다). 이 HTML은 사람이 읽는
        산출물이고 그 목록은 기계가 읽는 짝이다 — 둘이 어긋나면
        어긋난 쪽은 이 페이지다
      · 착지 상태(상위 세션에 통합 요청됨 / 동결 — 브랜치 이름과 tip)
      · 다음 사람에게 넘기는 것 — handoff 이슈 id, 못 한 것, 아는 구멍

      자기 칭찬이 아니라 다음 사람이 읽을 인수인계다. 실패와 건너뛴 것이
      빠진 보고서는 이 스텝을 통과해도 목적을 통과하지 못한다.

      단독 파일로 쓴다 — 외부 CSS·스크립트·이미지를 부르지 않는다. 데몬이 이
      페이지를 CSP sandbox로 내주므로 바깥을 부르는 것은 어차피 막히고,
      링크가 죽은 페이지는 몇 주 뒤면 아무것도 아니다.

      데몬이 이 파일을 세션-비즈 뷰에 색인한다 — 대시보드 세션 레일의
      Reports 블록에서 열린다. **파일 이름이 곧 색인이다**(시각과 이슈를
      이름이 진다) — 손으로 다른 이름으로 바꾸면 색인에서 빠지고, 빈
      파일을 그 자리에 놓는 것은 이 스텝의 verify가 거절한다(형식·<html
      태그·최소 크기 셋을 본다). 확인은 `claunch report ls`.

      ── 세션 종료 (회차의 일부다 — 선택이 아니다) ──
      이 워크플로우는 recur하지 않는다 — 다음 회차가 있다면 그것은 같은
      런 안의 루프(queue-recheck → intake)이지 새 런이 아니다. 최종 보고와
      상위 fyi까지 마쳤으면 next로 queue-recheck에 간다: 배정 큐가 남았으면
      intake로 돌아가고, 없으면 end-gate를 지나 런을 end까지 진행해
      done으로 만든다. **세션을 죽이라는 명령은 실행하지
      않는다** — 데몬이 done 전이를 보는 즉시, 이 회차의 종결 기록을
      이 세션의 transcript에 내구 기록(append+flush — WAL)한 뒤 세션을
      끝내 슬롯을 돌려준다. 이 워크플로우에 `claunch kill-session`은 더
      없다 — 네가 세션을 종료하는 것은 데몬 몫을 훔치는 것이고, 보고만
      하고 명령을 안 누르던 옛 실패(이 저장소의 가장 흔한 미완료)는
      구조적으로 사라졌다: 데몬은 done을 기다리고, done은 보고를 쓴
      같은 턴에서만 온다.

      단, 이 스텝 다음이 바로 end가 아니다 — `queue-recheck`와 `end-gate`가
      서 있고, end-gate에서 상위 세션이 종료를 허가한다. 그 게이트가 생긴
      이유는 하나다: 피어는 이 세션이 종료된 것을 모르고 계속 메시지를
      보낸다(데몬은 그 메시지를
      전달하지 못하고 송신자에게 실패를 되돌려준다). 다음 두 문단은 그
      게이트 뒤에도 그대로 적용된다 — 보고를 쓴 바로 그 턴에 next를 밟아
      end-gate까지 진행한다.

      ★ **이 워크플로우에서 이제 네 손에 남은 실패 지점은 하나다 —
      done으로 진행하지 않고 턴을 끝내는 것.** next-round로 루프하는
      회차도 같다 — 보고를 쓴 같은 턴에서 next로 queue-recheck를 밟고
      select까지 한다. 데몬은 done을 기다리므로,
      보고까지 쓰고 next를 밟지 않은 채 그만두면 세션은 done을 기다리는
      슬롯 점유로 남는다. 보고를 쓴 **같은 턴에서** next로 end까지 밟아
      런을 done으로 만든다 — 데몬이 그 뒤(종결 기록, 종료)를 맡는다.
      종료를 미루던 옛 네 망설임은 전부 이 구조에 흡수됐다:
      · 「사용자가 이 터미널에 있어 pane을 임의로 닫기 그렇다」 —
        pane을 닫는 것은 이제 데몬이고, 이 워크플로우의 end가 곧 그
        승인이다. 사용자는 이 회차가 끝나면 세션이 가도 좋은 채로
        띄웠다.
      · 「리더가 rebase 재요청·restack을 보낼 수 있다」 — 브랜치와
        bead는 세션과 무관하게 남고, 리더는 죽은 세션의 브랜치도
        머지한다. 정말 사람 손이 필요하면 `claunch respawn`이 있다.
        **살아서 대기하는 것은 도움이 아니라 슬롯 점유다.**
      · 「머지 착지를 확인하고 닫겠다」 — 그 확인은 이미 끝났다. 앞의
        landed 스텝이 머지를 git에서 보고 통과시켰기 때문에 이 스텝에
        도달한 것이고, 여기서 다시 기다릴 것은 없다. (동결로 마감한
        회차라면 애초에 착지가 없으니 기다릴 것도 없다.)
      · 「닫아도 될까요?」라고 사용자에게 되묻는 것 — **묻지 마라.**
        종료는 네 결정이 아니라 워크플로우의 마지막 단계다. 물어볼
        것은 없고, 남은 것은 보고와 next다.

      **예외는 하나뿐이다**: 이 세션의 사용자가 이 회차 안에서
      「닫지 말고 있어라」를 **명시적으로 말했을 때**. 리더의 말은
      해당하지 않고(리더는 세션이 아니라 브랜치를 기다린다), 네 추측도
      해당하지 않는다. 그 경우 **`claunch keep-alive $CLAUNCH_SESSION`**을
      실행해 이 세션에 keep-alive 플래그를 세운다 — 데몬은 종결 기록만
      남기고 세션은 건드리지 않는다(기록은 남는다 — 이 플래그는 킬을
      막지, 기록을 막지 않는다). 그리고 최종 보고에 「사용자 지시로 종료
      보류」를 한 줄 남겨, 다음 사람이 이 세션이 왜 살아 있는지 알게
      한다. 그 컨텍스트가 다 쓰여 더는 지킬 것이 없으면
      **`claunch keep-alive $CLAUNCH_SESSION off`**로 플래그를 내리고
      end로 진행한다 — 그 뒤의 종료는 데몬이 맡는다.

      done으로 진행한 뒤에는 **예고하지 마라**. 「이제 끝냅니다」를
      써 놓고 턴을 끝내지 말고, 보고를 쓴 **같은 턴에서** next로 end까지
      밟아라 — 예고는 그 턴을 마지막으로 만들어 done이 다음 턴으로
      밀리는 옛 실패 모양 그대로다.
    # 이 스텝에 verify를 두지 않는다 — 정본은 어느 저장소에서나 돌고 verify는
    # 그 저장소의 것이기 때문이다(test_cflow_layers의
    # test_the_improv_workflows_carry_no_repo_specific_verify가 정본 셋 전부에
    # 대해 그것을 못박는다). 기계 검사를 원하는 저장소는 프로젝트 레이어
    # (.claunch/workflows/)에서 이 스텝에 verify를 얹는다 — stat 한 번과 앞 4KB
    # 읽기가 전부라 review가 경고하는 「안 보이는 스윕」이 아니다.
    # **`verify: 'claunch report check'`로 적지 마라.** 여기 그렇게 적혀 있었고,
    # 그대로 옮겨 적은 저장소에서 게이트가 exit 2를 냈다: PATH의 claunch는 검사받는
    # 체크아웃이 아니라 마지막에 설치된 것이다. 게이트 명령은 검사받는 트리의
    # 파일을 이름으로 불러야 한다(이 저장소의 오버라이드가 그 형태의 실례다). 얹지 않은 저장소에서는 위 산문만 남고,
    # 그것이 이 층 나눔이 받아들이는 대가다: 산문은 어디서나 읽히고
    # 게이트는 그 명령이 실제로 도는 곳에서만 선다.
    done_when: |
      잔류 프로세스·임시 파일이 정리되어 git status가 클린하고, 회차 최종
      보고(목표·이슈 id·커밋·수치·착지 상태, 인수인계 이슈 id)가 기록되었으며,
      같은 사실을 담은 HTML 회차 보고서가 `claunch report path`가 찍은 자리에
      쓰여 있다(`claunch report ls`가 보여 준다 — 이 스텝의 verify가 같은 것을 본다).
      그 보고서는 **「한 것과 나온 것」으로 시작하고**(무엇을 했는가 · 무엇이
      생겼는가 · 지금 어떤 상태인가), 이 회차가 사람이나 에이전트가 읽게 될
      산출물을 만들었으면 **그 산출물 자체가 페이지에 실려 있다** — 바꾼 파일
      목록과 근거만으로는 이 조항을 만족하지 않는다. 산출물이 코드뿐인
      회차는 그 절이 비어도 된다. 또한 페이지가 **결과물을 축으로 서술되어
      있다** — 커밋 하나나 이슈 하나가 절 하나가 되는 구성은 이 조항을
      만족하지 않는다. 해시와 이슈 id는 증거 절에 모인다.
      (세션 종료는 이 게이트 뒤의 일이다 — done 이후 데몬이 종결 기록을
      남기고 종료한다. 게이트 뒤라는 것은 '나중에'도 '선택'도 아니고
      '이 게이트를 통과한 직후'라는 뜻이다: 이 보고를 쓴 같은 턴에서
      next로 queue-recheck를 밟는다 — 큐가 남았으면 intake로, 아니면
      end-gate를 지나 end까지 밟아 done으로 만든다. 데몬이 그 뒤를 맡는다.)
    # 회차가 닫히는 자리다. 대시보드 요약을 여기서 한 번 더 쓰면, 세션이
    # 끝난 뒤 레일에 남는 답이 이 회차의 결과가 된다.
    triggers: [briefing]
    # 이 스텝의 verify는 파일 하나를 stat하고 앞 4KB를 읽는 것이 전부다 —
    # 이 파일이 review 스텝에서 경고하는 「안 보이는 스윗」이 아니다.
    # 산문이 「항상 보고서를 남긴다」고 말하고 기계가 안 보면, 보고서는
    # 바쁘 회차에서 가장 먼저 빠지는 줄이 된다 — 종료 직전에 있고,
    # 안 써도 이 턴은 끝나기 때문이다. 그래서 게이트로 묶는다.
    # 이 형태인 이유 — 앞서 두 철자가 각각 다른 방식으로 틀렸다.
    #  · `claunch report check`: PATH의 claunch는 이 체크아웃이 아니라 설치된
    #    것이라 검사받는 트리의 코드를 안 부른다(실측: 'invalid choice: report',
    #    exit 2). 시끄러워서 첫 통과 시도에 걸렸다.
    #  · `python -m claude_launcher.cli report check`: 그 고침인데 더 조용하다.
    #    src 레이아웃이라 -m은 cwd에서 패키지를 못 찾고 site-packages에서
    #    가져와야 하는데, --no-sync는 워크트리 .venv를 영원히 비워 두겠다는
    #    약속이고 uv는 ambient VIRTUAL_ENV를 (경고하고) 무시한다. 손으로 sync한
    #    적 없는 워크트리에서는 ModuleNotFoundError, exit 1(실측).
    # 그래서 게이트는 이 체크아웃의 파일을 이름으로 부르고, 그 파일이 자기
    # __file__ 기준으로 이 체크아웃의 src를 sys.path 앞에 꽂는다. .venv도 PATH도
    # 답을 바꾸지 못한다. 나머지 세 게이트도 같은 형태이고,
    # tests/test_gates_run_this_checkout.py가 넷 전부를 이 규칙에 묶는다.
    # --no-sync 자체의 이유는 따로다 — 살아 있는 데몬이 claunch.exe를 물고 있어
    # 게이트 안의 sync가 os error 5로 막힌 실사례가 있다.
    verify: 'uv run --no-sync python tools/report_check.py'
    next: queue-recheck

  queue-recheck:
    title: 큐 재확인 (다음 회차가 있는가)
    # wrapup 뒤, end-gate 앞. 이 스텝이 생기기 전에는 회차 하나가 곧 세션
    # 하나였다 — 착지가 끝나면 큐에 남은 일감을 풀에 되돌리고 세션을
    # 끝냈다. 그래서 리더가 한 세션에 일감 여럿을 배정해도 첫 배치가
    # 착지하는 순간 나머지는 배정이 풀렸고, 다음 세션이 spawn·intake·
    # 브랜치를 처음부터 다시 밟아야 했다. 이 스텝은 그 자리에서 보드를 한
    # 번 더 읽고, 배정이 남아 있으면 같은 런 안에서 intake로 돌아간다.
    # chooser: agent인 이유 — 판정 재료가 전부 보드에 있다(큐 명령 한 번).
    # 루프 쪽(next-round)은 이슈가 실제로 서 있어야 성립하고 intake의
    # in_progress 전이가 그것을 다시 확인하며, 종료 쪽(done)은
    # settle-check를 거쳐 end-gate의 승인이 뒤에 있다. 게으름의 경로가
    # 없다. 무한 루프의 백스톱은 엔진의 max_visits(intake 방문 수)다.
    # 배정은 여기서 쓰지 않는다 — 큐를 채우는 것은 리더·운영자이거나,
    # wrapup 정산이 이 세션이 만든 이슈를 자기에게 배정한 것(self)이다.
    # 그 self가 루프를 잇는 것은 의도된 경로다(claunch-034c4, 2026-09-23
    # 사용자 지시: 스스로 만든 이슈를 backlog로 두지 않고 같은 루프에서
    # 처리한다 — claunch-qac7 Q1의 제안·확정 절차를 대체했다). scope·
    # 우선순위의 개입 지점은 리더의 거부권(UNQUEUED by leader)과 pool
    # ask로 남는다.
    select:
      chooser: agent
      require_reason: true
      prompt: |
        회차가 마감됐다(이슈 닫힘 또는 HOLD, 보고서 씀). 큐를 다시 읽는다 —
        기억이 아니라 보드로: `claunch beads list --assignee $CLAUNCH_SESSION
        --status open --status in_ready --status in_progress --limit 0 --json`.
        wrapup 정산에서 자기에게 배정한 이슈(`SELF-QUEUED:`)도 이 목록에
        있다 — 상위가 거부했으면(`UNQUEUED by leader:`) 빠져 있다. pool
        ask의 답(상위가 이 세션에 배정한 것)도 여기 나타난다.
        답을 기다리지 않는다 — 보드가 답이다.
        무엇이 나왔는지(id 목록과 각각의 판정)를 reason에 적는다.
        · 착수할 수 있는 일감이 하나라도 있으면 **next-round**다 — 이 저장소
          영역의 일이고, blocked가 아니고, 규격이 있거나 intake에서 채울 수
          있는 것. 나머지 일감은 상태·assignee를 손대지 않고 둔다 — 다음
          회차의 intake가 같은 명령으로 큐 전체를 다시 읽는다.
        · 남은 일감이 없으면 **done**이다. 남았더라도 전부 착수할 수 없는
          것(blocked, 다른 저장소 영역, 이 세션이 할 수 없는 것)이면
          done이다 — 그때만 그 일감을 풀에 되돌린다: 이슈마다 `claunch beads
          update <id> --assignee ""`와 `claunch beads comments add <id>
          "UNQUEUED: $CLAUNCH_SESSION landed without it"`. 세션이 끝난 뒤
          배정만 남은 이슈는 다음 세션이 잡기 전까지 아무도 붙잡지 않은 채
          배정된 것으로 보인다.
          되돌린 것 가운데 이 세션이 만든 이슈(`SELF-QUEUED:` 코멘트가
          있는 것)가 있으면, 그 id들로 wrapup의 pool ask와 같은 형식
          (id, pool, 한 줄 근거 — 왜 착수할 수 없게 됐는가)의 ask 한 통을
          지금 상위에게 보낸다. 그 이슈들은 wrapup에서 self였으므로 pool
          ask에 실린 적이 없고, 뒤의 settle-wait는 상위에게 다시 요청하지
          않는다 — 여기가 그 처분을 묻는 유일한 자리다.
        여기서 스스로 자기 배정을 치지 않는다 — 배정은 wrapup 정산에서
        이미 쳤다(claunch-034c4). 이 스텝이 쓰는 것은 done의 되돌리기와
        그 ask뿐이다.
        `SELF-QUEUED:` 이슈는 이 세션이 만든 일이므로 착수할 수 있으면
        next-round다 — 그것을 풀에 되돌리고 done으로 끝내면 만든 일감이
        backlog에 쌓이는 원래의 결함이 그대로 돌아온다.
        그 밖에 모호하면 done이다 — 세션 하나가 더 뜨는 쪽이, 규격 없는
        일감에 회차 하나가 도는 쪽보다 싸다.
      options:
        next-round:
          description: 배정 큐가 남았다 — 같은 런 안에서 intake로 돌아가 다음 회차(새 목표·새 브랜치·새 착지)를 시작한다
          next: intake
        done:
          description: 큐가 비었거나 남은 것이 전부 착수 불가다(풀에 되돌렸다) — 생성 이슈 정산 확인으로 간다
          next: settle-check

  settle-check:
    title: 생성 이슈 정산 확인 (세션 종료 전 게이트)
    # queue-recheck의 done과 end-gate 사이. 배정 큐가 비었다는 것과 이
    # 세션이 만든 이슈가 전부 누군가의 손에 있다는 것은 다른 사실이다 —
    # wrapup에서 spawn/self/pool로 배정해도 리더가 pool을 아직 안 봤거나
    # 자식이 아직 안 끝났으면 세션이 조용히 사라질 수 있다(s478, s483이 유실된
    # 자리, claunch-380z). 이 스텝은 그것을 기계로 확인한다.
    select:
      chooser: agent
      require_reason: true
      prompt: |
        이 세션이 만든 활성 후속 이슈가 전부 정산됐는지 보드로 확인한다 —
        wrapup의 정산 절과 같은 명령(`br`에 생성자 필터가 없어 못박은
        것): `claunch beads list --status open --status in_ready --limit 0
        --json | uv run --no-sync python -c "import json,os,sys; d =
        json.load(sys.stdin)['issues']; print(json.dumps([i for i in d if
        i.get('created_by') == os.environ['CLAUNCH_SESSION']],
        ensure_ascii=False))"`. 항목마다 판정한다 —
        정산됨: (a) assignee가 있고 그 세션이 살아 있다(`claunch sessions`
        또는 `claunch cflow status -t <세션>`으로 exited가 아님을 확인),
        또는 (b) `claunch beads comments <id>`에 해소되지 않은 `HOLD:`
        마커가 있다. 그 외(assignee 없음, assignee가 종료된 세션, 마커
        없음)는 미정산이다. assignee가 **이 세션 자신**인 것도 미정산이다
        — 이 세션은 곧 끝나므로 그 배정은 누구의 손도 아니다; 착수할 수
        있었으면 queue-recheck가 next-round를 냈어야 했다
        (claunch-034c4). 그런 항목이 보이면 unsettled를 고르기 전에
        queue-recheck의 done 규칙을 그 항목에 적용한다(풀에 되돌리고
        `UNQUEUED:` 코멘트, 이 세션이 만든 것이면 pool ask 한 통) — 그러지
        않으면 settle-wait는 재요청을 하지 않으므로 아무도 처분을 요청받지
        못한 채 settle-stall까지 간다. 한 일을 reason에 적는다.
        살아 있는 자식(`children`)이 있고 리더의 adopt(reparent)가
        확인되지 않으면 그것도 미정산이다 — commit 단계에서 adopt ask를
        보냈으면 그 답을 `claunch cflow asks`나 mesh 기록에서 확인한다.
        무엇을 확인해 무엇이 나왔는지(이슈마다 판정, 자식 유무)를
        reason에 적는다.
        모호하면 unsettled다 — 리더에게 한 번 더 묻는 쪽이, 유실된 채
        세션이 사라지는 쪽보다 싸다.
      options:
        settled:
          description: 생성 이슈 전부 정산됐고 살아 있는 자식도 없다(또는 adopt 완료) — 세션 종료 승인으로 간다
          next: end-gate
        unsettled:
          description: 미정산 항목이 있다 — 상위(리더)에게 정산을 요청하고 대기한다
          next: settle-wait

  settle-wait:
    title: 생성 이슈 정산 대기 (시계가 깨운다)
    # 여기 있던 것은 위임 select였다: 리더에게 `acted` 하나를 묻고 곧바로
    # settle-check로 돌아갔다. 그 응답이 만드는 값이 없다는 것이 이 회차의
    # 출발점이다. 스텝 자신의 프롬프트가 "판정은 기계가 다시 읽는다, 이 답은
    # 신호일 뿐이다"라고 적고 있었고 실제로 그랬다 — 응답이 무엇이든 다음
    # settle-check는 같은 보드를 다시 읽으므로, 응답자가 보드를 고치지
    # 않았으면 `acted`를 골라도 루프는 끝나지 않고 고쳤으면 `acted` 없이도
    # 끝난다. 응답이 결과에 닿지 못한다.
    # 그 무가치한 응답이 사람에게까지 갔다. 이 회차가 그랬다: 라우팅할 상위가
    # 없어(데몬이 만든 세션은 스폰 계통에 부모가 없다) otherwise: human으로
    # 떨어졌고, 사람은 자기가 하지도 않은 보드 쓰기를 「했다」고 확언하는 버튼
    # 하나를 앞에 두게 됐다.
    # 고치는 방향은 cflow-author가 이름 붙여 둔 안티패턴이다 — 「명령이 답할
    # 수 있는 것을 사람에게 묻는 것」. 정산 여부는 보드를 읽으면 답할 수 있는
    # 사실이고, 묻는 대신 시계를 쓴다. 기다림의 주체가 상위의 답이 아니라
    # 보드의 변화이므로 깨우는 것도 데몬의 타이머다 — 라우팅되든 안 되든
    # (상위가 있든 없든) 똑같이 동작한다.
    # end-hold는 여전히 못 쓴다: 사람이 `goto`로 보내는 keep-alive 경로이고
    # 런을 done으로 마감해 여기서 다시 확인으로 돌아올 수 없다.
    # `then`이 settle-check를 다시 밟으므로 예산은 라운드 안에서 누적되고,
    # 다 쓰면 settle-stall로 간다 — 무한 대기가 아니라 유한 대기다.
    timer:
      every: 600
      max: 6
      then: settle-check
      after: settle-stall
    instructions: |
      이 세션이 만든 이슈가 정산되기를 기다린다. 아무에게도 묻지 않는다 —
      깨우는 것도 데몬의 시계가 한다.

      하지 않는 것부터 적는다:
      · 상위에게 재촉을 보내지 않는다. 상위는 wrapup의 정산 알림(pool
        항목이 있으면 ask)으로 이미 요청받았고, 그 답이 이 자리의 조건을
        만든다. 여기서 한 번 더 밀면 같은 요청이 두 번 간다.
      · 보드에 코멘트를 쓰지 않는다. 이 세션이 칠 배정(spawn·self)은
        wrapup에서 이미 쳤고, 여기 남은 것(pool, 리더가 거부한 것)의
        정산은 리더·운영자의 쓰기다.
      · 브랜치·워크트리를 건드리지 않는다.

      이 스텝은 타이머 스텝이다. 데몬이 `every`초마다 런을 settle-check로
      옮겨 이 세션을 깨우고, 깨어나서 할 일은 settle-check가 시키는 것
      하나뿐이다 — 보드를 다시 읽고 정산 여부를 판정한다. 바뀐 것이 없으면
      그대로 다시 이 자리다. 턴을 끝내고 idle로 있으면 되고, 손으로 폴링하지
      않는다. `max`번 깨워도 조건이 안 서면 런이 settle-stall로 가서 그때
      사람이 판단한다.
    next: settle-check

  settle-stall:
    title: 생성 이슈 정산 교착 (사람)
    # 위 타이머의 `after:`가 오는 자리. 여섯 번 깨우는 동안 보드가 변하지
    # 않았다는 뜻이고, 그때는 사람이 판단할 재료가 있다 — 기다릴 것인가,
    # 이 세션을 끝낼 것인가. 여기 오는 선택은 settle-wait가 만들던 무가치한
    # `acted`와 다르다: 응답이 런의 다음 상태를 실제로 정한다(proceed는
    # end-gate로, keep-waiting은 settle-check로 — 다른 곳이다).
    # settle-check가 아니라 여기에 사람을 세우는 이유: settle-check의 판정은
    # 보드가 하고(그래서 사람이 확인할 것이 없다), 사람에게 남는 것은 보드가
    # 끝내 답하지 않았을 때의 처분뿐이다. 그 처분은 settle-check의 두 갈래
    # 어디에도 없다 — 그래서 별도 스텝이다.
    select:
      chooser: user
      require_reason: true
      prompt: |
        이 세션이 만든 이슈가 아직 정산되지 않았다(살아 있는 assignee가 없고
        `HOLD:` 마커도 없다). 타이머가 여섯 번 깨우는 동안 보드가 변하지
        않았다는 뜻이다 — 리더가 아직 답하지 않았거나, 답할 세션이 없거나,
        정산 대상이 아닌 무언가가 남아 있다.

        남은 것이 무엇인지는 `claunch cflow journal -t <세션>`의 settle-check
        보고와 `claunch beads list --status open --status in_ready --limit 0
        --json`(생성자 필터는 settle-check의 프롬프트에 있다)로 확인한다.
        정산됐다고 판정한 근거가 아니라 「무엇이 남았는가」를 보러 가는 것이다.

        판단은 사람의 것이다: 이 세션을 지금 끝내도 그 이슈가 유실되지
        않는지(열린 채로 남아 다음 adoption이 이어받을 수 있는지)를 보고
        고른다. 무엇을 보고 골랐는지 reason에 적는다.
      options:
        proceed:
          description: 정산 없이 이 세션을 끝낸다 — 남은 이슈는 열린 채로 남고, 이어받을 자리는 다음 회차의 adoption이 정한다
          next: end-gate
        keep-waiting:
          description: 더 기다린다 — 보드가 바뀔 때까지 settle-check로 돌아가 시계를 다시 건다
          next: settle-check

  end-gate:
    title: 세션 종료 사용자 승인
    # 이 런이 done이 되는 순간 데몬이 이 세션을 종료한다
    # (daemon/cflow_clock.py의 RunEventClock kill-on-end). 종료는 세션과
    # 작업 산출물의 보존 기간에 관한 사용자 결정이므로 상위 세션이나 워커가
    # 대신 승인하지 않는다. timeout도 두지 않는다. 사용자가 승인할 때까지
    # done에 도달하지 않으므로 데몬의 종료 절차도 시작되지 않는다.
    # on_decline: end-hold는 사람 게이트에 거절 입력이 없어 decline으로는
    # 도달하지 않는다(engine.approve만 있다) — 사람이 `claunch cflow goto
    # end-hold`로 보내는 경로이고, 그 절차는 end-hold가 적는다.
    ask:
      prompt: |
        이 워커의 회차가 끝났다(정리·최종 보고·HTML 회차 보고서까지).
        이 런이 done이 되면 데몬이 종결 기록을 쓴 뒤 이 세션을 종료한다.
        세션 종료를 승인하는가?

        허가하면: pane이 닫히고 슬롯이 반환된다. 브랜치와 beads 이슈는
        세션과 무관하게 남아 상위 세션이 그대로 통합할 수 있고, 다시 사람
        손이 필요하면 `claunch respawn <세션>`이 있다.
        보류하면: 승인 게이트는 열린 상태로 유지되고 세션은 살아 있다.
        사람 게이트에는 거절 입력이 없으므로(`claunch cflow approve`뿐)
        `on_decline`은 사람의 `claunch cflow goto end-hold`로만 닿는다 —
        세션을 의도적으로 살려 둘 사유가 확정되면 그 명령으로 종료 보류
        경로(keep-alive)를 선택한다.

        판단 근거: `claunch cflow journal -t <세션>`, `claunch beads show <이슈> --json`.
      on_decline: end-hold
    instructions: |
      사용자가 종료를 승인했다. 남은 것은 하나다 — 이 세션과 대화하던 피어에게 종료를
      미리 알린다. 메시에서 너와 연결된 멤버 중 이번 회차에 서로 메시지를
      주고받은 쪽에게 fyi 한 줄을 보낸다: 이 회차가 끝나 세션이 곧 종료된다는
      사실과, 대신 읽을 자리(브랜치 이름, 이슈 id). 상위 세션은 이 대상이
      아니다 — 데몬이 실제 종료 시점에 같은 사실을 상위에게 보낸다
      (kill-on-end 종료 통지).
      그리고 **같은 턴에서** next로 end까지 밟아 런을 done으로 만든다 —
      예고만 쓰고 턴을 끝내면 세션은 done을 기다리는 슬롯 점유로 남는다.
    done_when: |
      사용자가 종료를 승인했고, 연결된 피어에게 종료 예고 fyi가
      나갔다(메시지 id를 보고에 적는다). 주고받은 피어가 없었으면 그 사실을
      적는다 — 보낼 곳이 없는 것과 안 보낸 것은 다르다.
    next: end

  end-hold:
    title: 종료 보류 (사용자 보류)
    instructions: |
      사용자가 종료를 보류했다(`claunch cflow goto end-hold`). 이 세션은
      살아 있어야 하므로 먼저
      `claunch keep-alive $CLAUNCH_SESSION`을 실행해 플래그를 세운다 — 이
      플래그가 없으면 런이 done이 되는 즉시 데몬이 세션을 끝낸다(플래그는
      킬만 막고 종결 기록은 그대로 남는다).
      그다음 보류 사유를 읽는다 — goto 기록과 사람의 말이 저널에 있다
      (`claunch cflow journal -n 5`); 없으면 터미널 사용자에게 묻는다.
      사유가 추가 작업이면 그것은 이 회차의
      범위 밖이다: 이슈로 남기고(`claunch beads create "<제목>" --priority 3
      --labels handoff --description "<규격>"`) 그 id를 보고에 적는다.
      상위에게는 fyi 한 줄로 이 세션이 keep-alive로 살아 있다는 사실과 그
      이슈 id를 알린다 — 데몬은 살아남은 세션에 대해서는 아무 통지도 보내지
      않는다(종료 통지는 실제로 종료된 세션에만 붙는다).
      이 런은 여기서 done으로 마감하고, 세션은 keep-alive로 다음 지시를
      기다린다. 플래그를 내리는 것은 사람 또는 상위의 지시다:
      `claunch keep-alive $CLAUNCH_SESSION off`.
    done_when: |
      keep-alive 플래그가 세워졌고(명령의 출력을 보고에 붙인다), 보류 사유와
      그에 따라 만든 handoff 이슈 id(있다면), 상위에 보낸 fyi의 메시지 id가
      보고에 있다.
    # 이 스텝의 판정이 done_when 하나로 서 있었다 — 「keep-alive 플래그가
    # 세워졌고」는 에이전트가 자기 행동을 스스로 판정하는 산문이다. 그런데
    # 이 스텝은 거절을 집행하는 자리이고, 킬을 막는 조건은 하나뿐이다:
    # daemon/cflow_clock.py의 `if session.sdef.keep_alive: ... return`.
    # 명령을 실행하지 않으면 런은 그대로 done에 닿고 데몬이 세션을 끝낸다 —
    # 거절이 아무 일도 하지 않는다. 산문 판정을 종료 코드로 옮긴 회차가
    # 이 파일의 landed 스텝을 checklist로 바꾼 그 회차이므로, 같은 파일에
    # 산문 판정을 새로 들여놓지 않는다.
    # 조회 경로는 CLI가 아니라 데몬 API다: `claunch keep-alive <세션>`은
    # off 없이 부르면 플래그를 세우므로(cli_sessions.py가 조건 없이 post)
    # CLI로 물으면 답이 참이 된다. GET /api/sessions/{name}이 keep_alive를
    # 평평하게 내고 값을 바꾸지 않는다 — keepalive_check.py가 그 길이다.
    # 종료 코드: 0 서 있음 / 1 안 서 있음(명령을 실행하라) / 2 판정 불가
    # (이름 없음·데몬 미도달·그런 세션 없음). 1과 2를 가른 이유는 고치는
    # 방법이 다르기 때문이다.
    # 한계: 이 무장은 이 저장소의 프로젝트 레이어에만 있다. 패키지 정본은
    # tools/를 갖고 다니지 않으므로 다른 저장소의 improv-worker는 여전히
    # done_when 산문뿐이다 — 읽기 전용 조회를 CLI에 두는 후속 이슈가 있다.
    verify: 'uv run --no-sync python tools/keepalive_check.py'
    next: end
