# brief — a briefing secretary on the poll cadence.
#
# poll의 형제 워크플로다: 같은 두 계층 기계장치(스텝 `timer:` + `recur:
# {auto: true}` — 데몬이 발화시키고, 라운드 예산이 차면 데몬이 다음 라운드를
# 연다)를 그대로 선언한다. 패키지 워크플로는 레이어 해석 없이 단독으로
# 로드되어야 한다는 불변식이 있어서 extends 대신 자체 선언을 쓴다 —
# 캐던스가 poll과 어긋나지 않는지 tests/test_cflow_brief.py가 계측한다.
name: brief
description: >-
  브리핑 비서: 주기적으로 채널(mesh history/owed, 보드 판정)의 변화를 읽어
  사용자에게 한 줄 브리핑한다. context = JSON {"mesh": <이름>, "note": ...
  } 또는 mesh 이름 하나. 라운드당 `max`회, 예산 소진 시 데몬이 다음 라운드를
  연다(recur auto). poll과 같은 기반, 브리핑 절차를 얹은 것.
recur: {auto: true}
# 타이머 발화가 방문으로 세어지므로 라운드 재작업 예산은 max + 2를 넘겨야
# 한다(20회 폴링 + 도착). poll과 같은 값.
max_visits: 60
steps:
  poll:
    instructions: |
      이번 라운드의 브리핑을 한다. `context`가 JSON이면 `mesh`(기본: 현재
      메시), `note`(무엇을 보고 있는지)로 읽고, 아니면 context 전체를 mesh
      이름으로 본다.

      연속성 파일: `<run 디렉터리>/brief-last.json` — windows.json과 같은
      자리에 두고, archiving이 건드리지 않는다. {"last_seen": "<마지막으로
      보고한 메시지 id>"} 형태. 없으면 처음부터 읽는다.

      1. 읽는다 — `claunch mesh history <mesh> -n 15`, `claunch mesh owed
         <mesh>`, 필요한 판정·이슈는 `claunch beads comments <id>`.
      2. 선별한다 — last_seen 이후의 메시지만. ask는 답변 owed, fyi는
         흡수, leader 판정·게이트 변화·배치 상태는 한 줄로 요약한다.
      3. 보고한다 — 사용자에게 한 줄 브리핑: "새 메시지 N (ask M · owed K)
         — <판정/변화 한 줄>". 변화가 없으면 'no change' 한 줄. 같은 내용을
         report {summary, details?}로 접수한다.
      4. last_seen을 갱신하고 'next'.
    done_when: 채널을 읽고, 새 내용(또는 no change)을 한 줄 브리핑으로
      보고했으며, last_seen을 갱신했다.
    next: wait
  wait:
    # timed wait — poll과 같은 캐던스: 데몬이 every초마다 'poll'로 run을
    # 옮기고, max회를 채우면 after(end)로 닫아 다음 라운드를 연다.
    timer:
      every: 300
      max: 22
      then: poll
      after: end
    instructions: |
      Timed wait. 데몬이 run을 'poll'로 옮기면 보고하라(payload의 opens_at).
      턴을 마쳐라 — 직접 폴링하지 않는다. 이 라운드를 조기에 닫으려면 한 줄
      report 후 next(다음 라운드는 데몬이 시작한다).
    next: end
