name: improv-leader
description: >
  자유 진행 관제 리더 — 한 회차 = 운영 확인 -> 관제 대기(워커 요청 처리·
  규칙 충돌 조정·증거 수합·스윕 배치) -> 사건에 따라 (사용자 승인) master --no-ff
  일괄 통합 -> (사용자 승인) 라이브 반영으로 마감, 또는 (사용자 승인) 교대 종료.
  반영을 거절하면 관제 대기로 복귀해 같은 회차에서 통합 배치를 더 모은다.
  recur가 끝난 회차마다 다음 회차를 요청하는 상주 서비스 루프이며,
  반복을 멈추는 것은 사용자다(claunch cflow request --cancel).
start: intake
recur: true

# 관제 런은 leader 역할 세션만 몬다 — 워커가 이 런을 시작해 스스로 통합
# 권한을 얻는 사고를 시작 시점에 막는다.
filter_roles:
  type: whitelist
  roles: [leader]

steps:
  intake:
    title: 운영 확인
    instructions: |
      새 회차다. 첫 회차면 운영 조건을 사용자와 합의하고, 이후 회차면 변경
      사항이 없는지 한 줄로 확인하고 바로 넘어간다. 정할 만한 것:
      - 워커 편성: 몇 세션, 어느 워크스페이스, 지금 spawn할지 필요 시 spawn할지
        (spawn 시 workflow: improv-worker 로 워커 런을 물려준다)
      - 테스트 분업: 워커는 간소화 스위트(npm test)만 돌린다. 전체 스윕
        (build+typecheck+전체 스위트)은 리더가 모아서 배치로 처리한다 —
        통합 단계의 verify가 배치당 한 번 돌고, 그 외의 스윕 수요는 테스트
        전용 tester 세션에 맡긴다. tester(역할 specialist, 워크플로우 없이
        스윕 요청에 응답하는 상주 세션)가 메시에 연결되어 있지 않으면 mesh
        스킬의 spawn으로 만든다
      - 상시 규칙: 정본·공용 규칙 결정은 단일 규칙으로 기록·공지한다,
        master 반영과 라이브 재기동은 사용자 승인 게이트를 지난다
      - 사용자에게 올릴 에스컬레이션의 기준(가치·우선순위·범위·권한에
        해당하는 것만, 선택지+권고안 형태로)
      합의(또는 무변경 확인)를 보고에 남긴다.
    done_when: |
      운영 조건 합의(첫 회차) 또는 무변경 확인(이후 회차)이 보고에 기록되어
      있다.
    next: standby

  standby:
    title: 관제 대기
    instructions: |
      메시를 상대로 상주 근무한다. 수신이 곧 깨움이므로 폴링하지 않고,
      사건이 없으면 이 단계에 머문다. 처리한 것마다 보고에 누적한다:
      - 워커 요청 처리: 질문 응답, 재브리핑, 막힌 워커 확인(아래 침묵
        판독의 순서로), 필요 시 spawn/재배정
      - 침묵 판독: 워커가 오래 조용하면 추측하거나 바로 묻지 말고 먼저
        런 상태를 읽는다 — claunch cflow status -t <세션> --json (상세는
        claunch cflow journal -t <세션> -n 20). waiting_approval/
        waiting_selection = 사람 게이트 대기: 대신 넘지 말고 사용자에게
        선택지+권고안으로 에스컬레이션한다. 같은 step 장기 체류 = 직접
        물어 개입·재브리핑. 런 소멸·세션 exited = 확인 후 재배정.
        cflow CLI는 읽기(status/journal/asks)만 쓴다 — approve/select/
        goto/abort는 사람의 문이다(자기 게이트든 워커 게이트든 금지).
        게이트 앞에서는 대기가 프로토콜이고, 이탈 경로는 워크플로의
        on_decline/timeout이 이미 정해 두었다
      - 규칙 충돌 조정: 두 세션이 같은 정본 규칙을 다르게 정하려 하면
        근거를 대조해 단일 규칙으로 확정하고 메시 전체에 fyi로 기록한다 —
        합의 인증 전에 실제 근거를 심사한다(한쪽이 끝내려고 접은 합의는
        합의가 아니다)
      - 증거 수합: 워커 완료 보고에서 브랜치·커밋 해시·테스트 수치를
        수합 표로 관리한다. 워커 수치는 간소화 스위트 기준이므로 표에
        그렇게 표기한다. 이 표가 통합 심사의 근거다. 동결 브랜치는
        통합 대기 목록에 올린다
      - 스윕 배치: 전체 스윕이 필요해지면(통합 대기가 쌓였거나, 워커가
        전체 확인을 요청하거나, 정본 규칙 변경처럼 파급이 넓은 커밋이
        보이면) 워커에게 시키지 말고 tester에게 배치 하나로 모아 보낸다.
        tester가 연결되어 있지 않으면 먼저 mesh 스킬의 spawn으로 만든다
        (역할 specialist). 결과 수치는 수합 표에 "스윕 기준"으로 기록한다
      - 지시는 ONE batch send(--section 워커별)로, 전원 공지는 정말 전원에게
        해당할 때만 '*'로
      이 단계를 떠나는 것은 사용자의 지시라는 사건뿐이다 — 스스로 한가하다는
      이유로 회차를 닫지 않는다.
    select:
      prompt: |
        어느 사건이 발생했는가? 사용자의 지시가 없는 동안은 이 단계에 머물러
        관제를 계속한다(선택하지 않는다).
      chooser: agent
      options:
        integrate:
          description: 사용자가 통합을 지시 — 통합 대기 브랜치의 머지 심사로
          next: integrate
        wind-down:
          description: 사용자가 교대 종료를 지시 — 종료 승인 게이트로
          next: wrapup

  integrate:
    title: master 일괄 통합 (--no-ff)
    ask:
      # from 없음 = 순수 사용자 게이트. master 반영은 사용자 권한이다.
      prompt: |
        통합 대기 브랜치들의 수합 표 — 범위·브랜치·커밋 해시·테스트 수치 —
        가 저널의 관제 대기 단계에 있다. 보고 요약이 아니라 그 표를 근거로
        심사하라. 증거가 빈 브랜치가 하나라도 있으면 거절하라. master
        --no-ff 머지를 승인하는가?
      timeout: 3600
      on_decline: standby
    instructions: |
      머지 전에 수합 표를 워커 저널과 대조한다 — claunch cflow journal -t
      <세션> 으로 각 워커의 완료 보고를 읽어, fyi 누락으로 표에서 빠진
      브랜치가 없는지 확인한다(표는 mesh fyi로만 쌓이므로 저널이 검산이다).
      그리고 토폴로지를 명령으로 확인한다:
      - 브랜치 간 포함 관계(git branch --contains) — 한 브랜치가 나머지를
        모두 포함하면 그 하나만 머지하고, 아니면 차례로 머지한다
      - git log master..<branch> / <branch>..master 로 양방향 차이를 확인,
        master가 분기 이후 움직였으면 충돌 여부를 먼저 본다
      배치가 크거나 충돌 위험이 보이면 머지 확정 전에 tester에게 통합
      프리뷰(후보 브랜치를 임시 브랜치에 합친 트리)의 스윕을 맡겨 실패를
      미리 걸러낸다 — tester가 없으면 mesh 스킬의 spawn으로 만든다.
      머지는 반드시 --no-ff, 커밋 메시지는 저장소 관례(한 줄 요약 —
      「무엇을 어떻게」)를 따른다. 머지 결과 트리에서 전체
      스윕(build+typecheck+전체 스위트)을 돌린다 — 워커 회차마다
      돌리지 않은 스윕이 여기서 배치당 한 번 도는 것이다. 스윕 명령은
      저장소마다 다르므로 정본은 명령을 박지 않는다 — 저장소별 명령은
      프로젝트 레이어(.claunch/workflows/ 오버라이드)가 verify로 담고,
      오버라이드가 없으면 스윕 결과 수치를 보고에 남기는 것이 판정
      근거다. 머지 커밋 해시·diffstat을 보고에 남기고, 메시 전체에
      fyi로 알린다: master가 움직였고, 머지된 브랜치는 동결이며, 신규
      작업은 새 master 기준 브랜치로.
    done_when: |
      승인된 배치의 통합 대기 브랜치가 전부 --no-ff로 master에 머지되었고,
      머지 결과 트리의 전체 스윕 수치와 머지 커밋 해시·diffstat이 보고에
      있으며 메시 전체 fyi 공지가 나갔다.
    # 저장소 특화 verify는 정본이 아니라 프로젝트 레이어(.claunch/workflows/)에.
    next: reflect

  reflect:
    title: 라이브 서버 반영
    ask:
      # 기동 중인 사용자 화면을 건드리는 일 — 머지 승인과 별개로, 방문마다 새로 묻는다.
      prompt: |
        master 머지와 검증(build+test)이 끝났다. 기동 중인 라이브 서버는
        아직 머지 전 코드를 서빙한다. 지금 재기동해 반영하는가? 거절하면
        머지는 유지된 채 재기동 없이 관제 대기로 복귀한다 — 통합 대기가
        더 쌓이면 다음 통합 배치 후 다시 묻고, 회차는 실제 반영이 일어날
        때(또는 교대 종료) 마감된다.
      timeout: 1800
      on_decline: standby
    instructions: |
      라이브 서버를 재기동하고, 기동 후 새 머지 커밋의 기능이 실제로
      서빙되는지 한 가지 이상 확인해 증거(확인 방법과 결과)를 보고에
      남긴다. 이 회차는 여기서 마감된다 — recur가 다음 회차를 요청한다.
    done_when: |
      라이브 서버가 재기동되었고, 새 머지 커밋의 기능이 실제로 서빙됨을
      확인한 증거(방법과 결과)가 보고에 있다.
    next: end

  wrapup:
    title: 교대 종료
    ask:
      # 워커 세션 종료는 진행 중이던 미전송 결과를 잃을 수 있다 — 사용자 확인을 지난다.
      prompt: |
        교대 종료를 확정하는가? 확정하면 워커들의 유휴 여부를 확인한 뒤
        세션을 종료(kill)하고 최종 보고를 남긴다. 통합 대기 브랜치가 남아
        있다면 저널의 수합 표에 보인다 — 남긴 채 종료해도 브랜치는 유지된다.
      timeout: 900
      on_decline: standby
    instructions: |
      워커·tester마다 진행 중인 작업(스윕 실행 포함)이 있는지 먼저 물어
      확인하고, 응답과 별개로 claunch cflow status -t <세션> 으로 런 상태를
      교차 확인한다 — 응답 없는 워커의 유휴는 물어서 알 수 없다. 양쪽에서
      유휴가 확인된 세션만 kill로 종료해 슬롯을 반환한다. 최종 보고: 교대 동안의 회차
      요약 — 처리한 요청, 확정한 규칙, 머지 커밋, 반영 여부, 남은 통합
      대기 브랜치 — 를 저널 기반으로 남긴다. 이 런은 recur라서 종료 후에도
      다음 회차 요청이 접수된다 — 교대를 정말 끝내려면 사용자가 요청을
      철회해야 함을 안내한다(claunch cflow request --cancel).
    done_when: |
      유휴가 확인된 워커·tester 세션이 모두 종료되었고, 교대 최종 보고
      (처리한 요청, 확정 규칙, 머지 커밋, 반영 여부, 남은 통합 대기)가
      기록되었다.
    next: end
