name: improv-pm
description: >
  PM(계획·편성) 런 — 목표 하나를 받아 이슈로 나누고, 자식마다 절차 파일
  (overlay)을 써서 자식 세션을 편성하고, 자식의 결과를 기계 검사로 받아
  재계획하거나 인계한다: 관리 범위 확인 -> 계획(이슈·overlay 작성) ->
  검증(cflow show) -> 편성(spawn, workflow에 overlay 경로) -> 대기(사건이
  올 때까지 머문다) -> 정산(자식 런·보드 대조) -> [재계획 | 인계] ->
  종료 승인. PM은 생산하지 않고 통합하지 않는다 — 코드는 자식이 쓰고, master
  머지는 리더 전권이며, 자식의 착지 요청은 그 자식의 상위 계통으로 간다.
  절차는 실행 중에 바뀌지 않는다: 데몬이 런 시작 시점에 overlay를
  스냅샷하므로, 재계획은 언제나 「지금 회차를 끝내고 새 파일로 새 런」이다.
  자식 사이의 의존은 메시지가 아니라 overlay 안의 기계 검사(checklist·
  awaits·verify)로 적는다 — 「B가 끝나면 알려 줄게」는 계약이 아니다.
start: intake

# 대기 ⇄ 정산 ⇄ 재계획이 자식 하나당 여러 바퀴 돈다 — 자식 수의 몇 배가
# 상한이다.
max_visits: 200

# 이 런의 드라이버는 pm 역할 세션이다 — 워커가 이 런을 시작해 스스로
# 편성 권한을 갖는 사고를 시작 시점에 막는다.
filter_roles:
  type: whitelist
  roles: [pm]

# 위저드의 Role 행이 pm을 고르면 이 워크플로를 자동 선택한다.
default_role: pm

# 이 런을 모는 세션이 spawn에 workflow를 대지 않으면 자식은 improv-worker를
# 돈다. PM의 정상 경로는 spawn마다 overlay 경로를 대는 것이고, 이 짝은
# 「overlay 없이도 자식이 절차 없이 뜨지는 않는다」는 바닥이다.
default_child_cflow: improv-worker

steps:
  intake:
    title: 관리 범위 확인
    instructions: |
      새 회차다 — 이 PM이 무엇을 편성하는지 확정한다. 출처는 둘 중 하나다:
      터미널 사용자의 직접 지시, 또는 리더의 브리핑(생성 task). 목표가 아직
      없으면 여기서 대기한다. 다음을 보고에 남긴다:
      - 목표와 관리 범위: 어느 이슈(epic 또는 부모 이슈)와 어느 저장소
        영역이 내 것인가. 범위 밖의 일감은 리더에게 돌려보낸다.
      - 이미 살아 있는 것: `children`(spawn 도구)과 `claunch beads list
        --status in_progress --limit 0 --json`으로 내가 만든 자식과 그
        자식이 잡은 이슈를 읽는다. 재시작·컴팩션 뒤에도 이 읽기가 정본이다.
      - 리더와의 경계: 아래 공통 규칙에서 리더의 것인 배정(assignee 쓰기)과
        규격 검토(open→in_ready)를, 리더가 내 관리 범위의 이슈에 한해 나에게
        위임한 것이다 — 범위 밖 이슈에는 손대지 않는다. master 통합·전체
        스윕·배포는 리더의 것이고, 나는 어떤 경로로도 머지하지 않는다.
      - 생성 파일 자리: overlay는 `<저장소>/.cflow/generated/` 아래에
        `<내 세션>-<이슈 id>.yaml`로 쓴다. 이 디렉터리는 gitignore된 런
        상태이고, spawn의 workflow가 경로를 받는 유일한 자리다.

      ── beads(br) 규칙 — 공통 ──
      일감의 정본은 beads다: 세션이 한 회차를 쓸 일, 다른 세션·회차로 넘어갈
      일은 이슈로 존재해야 한다(존재·제목·범위·완료 기준·assignee·상태·
      의존·부모). beads에 두지 않는 것: 실행 기록(cflow 저널), 승인·선택
      (cflow ask/select), 그리고 사건 — 대화·답장·정정, restack 공지, 창
      순번처럼 지금 이 순간에만 뜻이 있고 되짚어 읽히지 않는 것(mesh).
      ── 기록은 코멘트에, 신호는 메시지에 ──
      되짚어 읽힐 것은 전부 코멘트다: 증거 묶음(브랜치·tip·기능/머지 해시,
      테스트 수치와 그 축·트리·환경, 양방향 diff, 포함 관계, 스택 위치,
      merge-tree 결과), 심사 한계와 테스트가 세우지 못하는 것, 그리고 판정
      마커 — `LANDING REQUEST @ <hash>` / `REBASE REQUESTED @ <hash>` /
      `REMEASURE REQUESTED @ <hash>` /
      `REVIEWED: pass @ <hash>` / `CHANGES REQUESTED: <무엇을>` /
      `HOLD: <이유>` / `BLOCKED: <게이트>` / `merged <hash>`. 코멘트는 산문
      문단이 아니라 (축, 트리, 값)의 줄로 적는다 — 보드는 저장소에 커밋되므로
      산문은 무게만 늘리고 되짚을 때 읽히지 않는다. 긴 묶음은 파일로 붙인다:
      `claunch beads comments add <id> -f <파일>`.
      **같은 것을 메시지 본문에 다시 싣지 않는다.** 메시는 상대 터미널에
      타이핑되므로 본문은 수신자 수만큼 곱해 남의 컨텍스트에서 나가고, 기록으로
      보낸 것은 아무에게도 답을 요구하지 않으면서 그 값을 치른다. 메시지는
      nudge다 — 네 줄 안에 이슈 id와 상태, 코멘트 마커, 판정을 바꾸는 값 한 줄
      (델타·미해결 한계 유무), 상대가 할 일. 상대는 그 id로 당겨 읽는다
      (`claunch beads show <id> --json`, `claunch beads comments <id>`; 표
      전체는 `claunch beads list --status in_review --json` 한 번이다).
      이 갈래가 서지 않는 자리가 하나 있다: 다른 머신의 멤버는 이 저장소의
      보드에 닿지 않는다(`claunch mesh members`의 machine이 다르면 그렇다).
      그 상대에게만은 묶음을 메시지로 보낸다.
      정본 규칙(파서·직렬화·포맷 같은 공용 규약, 판정식, 기준선)은 이슈가
      아니지만 되짚어 읽히므로 보드에 산다: `--type doc` 이슈 하나를 세우고
      (assignee 없음 — `in_ready`로 전이하지 않는다) 갱신을 갈래로 나눠 쌓는다:
      **규범 내용(규약·정의·판정식)은 본문에 두고, 고칠 때 본문을 고친다.**
      코멘트에는 그 판정이 어떻게 서고 어떻게 정정됐는지의 이력을 쌓는다.
      doc에서만 앞 갈래가 뒤집히는 이유는 용도다 — 참조하러 온 사람은 본문
      하나를 읽고 닫으므로 본문이 지금 값이어야 한다. 규약을 코멘트로만
      쌓으면 본문이 낡고, 낡았다는 것을 알리는 경고도 exit code도 없다
      (`claunch-qj03` 실측).
      전원 브로드캐스트로 규칙을 배포하지 않는다 — 수신자 수만큼 곱해지는 데다
      나중에 합류한 사람에게는 닿지 않는다. 배포는 doc 이슈 id 한 줄이다.
      호출은 항상 `claunch beads <br 인자>` — 워크트리에서도 저장소 루트의
      .beads/beads.db 하나를 쓰고(--db를 대신 붙인다), 쓰기에 --actor
      $CLAUNCH_SESSION을 붙이며, DB가 없으면 `claunch beads`가 issues.jsonl에서
      스스로 만든다. 조회는 --json.
      **`.beads/issues.jsonl`을 직접 고치는 것은 금지다.** 보드의 실체는
      `.beads/beads.db`이고 jsonl은 그것을 내보낸 산출물이다. 손으로 쓴 줄은
      DB에 들어가지 않는다. 다음에 어느 세션이든 `claunch beads sync
      --flush-only`를 돌리면 DB 내용이 그 파일을 덮어쓰고, 손으로 쓴 내용은
      에러도 경고도 없이 사라진다. 반대로 jsonl에만 있고 DB에 없는 이슈가
      생기면 export의 stale 가드가 걸려 그 저장소의 flush가 전부 멈춘다
      (`claunch beads sync --help`). Edit·Write·`sed -i`·리다이렉션 어느
      것으로도 그 파일에 쓰지 않는다. 이슈를 만들고 고치고 닫는 길은
      `claunch beads` 하나다. jsonl에서 DB로 되돌리는 것이 정말 필요하면
      `claunch beads sync --import-only`이고, 그것도 사람의 판단이 있을 때다.
      이슈가 없을 때 만드는 자 = 그 일을 사람에게서 처음 받은 세션, 또는
      발견한 세션이다 — 리더가 아니다. 만들기 전에 `claunch beads search
      "<핵심어>" --json`과 open/in_ready/in_progress/in_review 목록으로 중복을 본다;
      있으면 create 대신 comments add. 규격: 제목 한 줄「무엇을 어떻게」,
      --description은 `## 목표 / ## 범위(포함·제외) / ## 완료 증거 기준 /
      ## 출처(누가·언제·원문)`, --labels에 출처 하나(user | user-direct |
      leader | handoff | found | review). 우선순위: P1 사용자가 보고한
      라이브 데몬·UI 고장과 master 빨강 / P2 사용자 지시·리더 배정(기본) /
      P3 인수인계·발견·후속·후보 / P4 아이디어. type은 task 기본, bug는
      회귀·결함, epic은 스택 부모, doc은 참조 전용(`in_ready`로 전이하지 않고 배정하지
      않는다). staged 순서: description이 먼저, --assignee가 마지막.
      상태 전이의 주인: open→in_ready는 리더(규격·우선순위 검토 완료) /
      open 또는 in_ready→in_progress는 assignee 워커(intake 끝,
      --external-ref에 run id; 터미널 사용자 직접 지시는 open에서 시작할 수 있음) /
      in_ready→open은 리더(규격·우선순위 재검토 필요) /
      in_progress→in_review는 assignee 워커
      (landing request) / in_review→in_progress는 리더(rebase·재측정 재요청) /
      in_review→closed는 assignee 세션이다 — 누가 배정했든 그 이슈를 끝까지
      관리하는 것은 assignee다. assignee 세션이 종료돼도 in_ready는 검토 결과를 유지하고,
      다음 adoption이 종료된 assignee를 교체한다. 닫는 자리는 wrapup 하나, 닫을 자격은 landed가
      git으로 증명한 머지 커밋 해시다(`claunch beads close <id> --reason
      "merged <머지 해시>"`; 중간 워커는 자기 --parent 자식을 같은 방식으로
      닫는다). 리더가 닫는 것은 둘뿐이다: assignee가 비었거나 그 세션이
      exited인 고아와, 중간 워커 자신의 스택 이슈 — improv-mid에는 landed에
      해당하는 게이트가 없어 자기 착지를 git으로 증명할 수단이 없고, 증명
      없이 닫는 것은 이 규칙이 막으려던 바로 그것이다(중간 워커가 닫는 것은
      landed 증거가 있는 자기 --parent 자식뿐이다). 그 둘에 한해 리더가
      닫고, 사유에 스윕 수치를 붙일 수 있으면 붙인다 / 아무
      상태→blocked는 그 게이트에 걸린 세션(`BLOCKED: <스텝>`), 해소되면
      같은 세션이 되돌린다 / reopen은 리더만. update --status closed는
      없다 — close뿐이다.
      ── open 풀 판정 기준 ──
      open 이슈 수는 그 자체로 정보가 아니다 — 라벨·배정·코멘트 마커를
      가르지 않은 원값은 살아 있는 일감 수를 과대 센다. 측정은
      `claunch beads list --status open --limit 0 --json`으로 우선순위·
      assignee·첫 라벨·코멘트 마커를 센 뒤 말한다(기본 행 제한 50은 판정
      근거가 아니다).
      살아 있는 일감: assignee가 살아 있는 세션이고 intake에서 in_progress
      전이(external-ref에 run id)를 한 것 / 리더가 배정·보류를 코멘트로
      남긴 것 / 위 우선순위 절의 P1에 맞는 것.
      정리 대상은 셋이고 판정은 개별이다 — 여럿을 한 번에 닫는 일괄 변경은
      없다:
      (1) merged 해시가 코멘트에 있는데 open인 것 — 닫을 자격은 이미
          증명됐다. assignee가 살아 있으면 그 wrapup에서, 없거나 소멸했으면
          리더가 닫는다.
      (2) 같은 규격(목표·범위·출처·우선순위)의 중복 — 존재 쪽을 남기고
          중복 쪽을 닫는다(사유에 존재 쪽 id). create 전 search가 생성을
          막고, 이 갈래는 이미 생긴 중복의 처리다. assignee가 없거나
          소멸했으면 리더가 닫는다.
      (3) SESSION ENDED 코멘트가 있고 assignee 없이 3일 지난 open — 리더의
          정리 대상이며 재배정이 먼저다: 배정 후보·우선순위·최근 갱신
          가운데 하나라도 있으면 재배정하고, 셋 다 없으면 닫는다(사유에
          판정 근거, 재발하면 리더만이 reopen한다).
      ── 큐(queue)·배치(batch) 규칙 ──
      세션의 큐는 보드에서 assignee가 그 세션인 활성 이슈(open·in_ready·
      in_progress·in_review)다 — 세션 레코드에 따로 적지 않고 보드 하나가
      정본이다. 순서는 priority 오름차순, 같으면 created_at 순. 읽는 명령은
      `claunch beads list --assignee <세션> --status open --status in_ready
      --status in_progress --limit 0 --json`. 배정(assignee 쓰기)은 리더·
      운영자의 것이다 — 대시보드 Beads 페이지의 Queues 탭에서 카드를 세션
      행으로 끌면 데몬이 `update <id> --assignee <세션>` 하나를 대신 치고
      `QUEUED`/`UNQUEUED` 코멘트를 남긴다; 상태(status)는 손대지 않는다.
      한 세션의 큐는 브랜치 하나 위에서 배치로 처리된다: 일감마다
      in_progress 전이 → 작업·테스트·커밋 → 다음 일감, 큐가 비면(또는 배치
      상한 5개에 닿으면) 배치의 이슈 전부를 in_review로 올려 착지 요청은 한
      번이다. 마커는 이슈마다 `LANDING REQUEST @ <tip>`이고 주 이슈(오프닝의
      `issue: <id>`)의 마커 뒤에 `batch: <id,...>`가 붙으며 증거 묶음은 그 주
      이슈 코멘트 하나에 있다. 리더는 같은 tip의 행들을 후보 하나로 심사해
      한 번 머지하고, 닫는 것은 assignee가 이슈마다 `merged <해시>`로 한다.
      착수하지 않은 큐 일감은 회차 마감 뒤 워커의 queue-recheck가 다시
      읽는다 — 착수할 수 있으면 같은 런 안에서 다음 회차의 주 이슈가 되고
      (intake로 루프), 착수할 수 없는 것(blocked·다른 저장소 영역)만
      `update <id> --assignee ""`와 `UNQUEUED: <세션> landed without it`
      코멘트로 풀에 되돌린다. 워커가 자기 후속 이슈를 스스로 배정해 큐를
      채우는 것은 원칙적으로 금지다 — 배정은 위 문장대로 리더·운영자의
      것이다. 예외는 하나뿐이고 좁다(claunch-qac7 Q1: A→B, 2026-09-04
      사용자 지시): wrapup의 생성 이슈 정산에서, (1) 원회차 이슈에
      연결되고(`--parent` 자식이거나, 원회차가 닫힌 뒤면 규격의 출처에
      원회차 id) (2) 같은 저장소 영역·같은 정본 규칙이고 (3) 규격이 서
      있고 (4) P3이고 (5) 한 회차 크기인 후속에 한해, 회차당 최대 2건을
      `--assignee $CLAUNCH_SESSION`과 `SELF-QUEUED: from <원회차 id>`
      코멘트로 자기 큐에 넣는다. 리더는 거부권을 가진다(`update <id>
      --assignee ""` + `UNQUEUED by leader: <이유>`). 세션이 만든 활성
      이슈가 전부 누군가의 손(살아 있는 세션의 assignee, 또는 리더의
      `HOLD:` 코멘트)에 있어야 세션이 끝난다 — 워커의 settle-check가
      그것을 확인하고, 미충족이면 settle-wait가 시계로 기다린다(사람이나
      상위에게 묻지 않는다). 타이머가 여섯 번 깨우는 동안에도 안 서면
      settle-stall로 사람이 처분한다. 그러므로 이 리더가 그 보드 쓰기를
      하는 자리는 wrapup의 정산 ask 하나다 — 거기서 답하지 않으면 워커는
      기다리다 사람에게 넘어간다.
      br가 실패하면(잠금·바이너리 없음) --lock-timeout 5000으로 한 번 더,
      그래도 안 되면 mesh fyi 첫 줄에 `NO-BEAD:` + 위 규격 그대로 — 리더가
      다음 관제 대기에서 대신 만들고 id를 답한다. 이슈 없이 착수하는
      것만은 금지다.
    done_when: |
      목표·관리 범위·살아 있는 자식과 이슈 목록·리더와의 경계가 보고에
      있고, 범위의 부모 이슈 id가 확정돼 있다.
    next: plan

  plan:
    title: 계획 — 이슈와 절차 파일
    instructions: |
      목표를 자식 하나가 한 회차에 끝낼 크기로 나눈다. 갈래마다 (1) 보드에
      이슈를 세우고(공통 규칙의 규격·라벨·우선순위; 부모 이슈에 `--parent`),
      (2) 그 자식만의 절차 파일(overlay)을 쓴다.

      ── overlay가 담는 것 ──
      파일은 짧다. `extends: improv-worker` 한 줄로 워커 정본 전체를
      물려받고, 이 자식에게만 다른 것만 적는다:
      - 스텝의 `verify`: 이 갈래의 표적 검증 명령(예: 바꾼 영역의 테스트).
      - 대기 스텝: 다른 자식의 결과 위에서 시작해야 하면 `checklist` 스텝
        하나를 `branch-setup` 앞에 끼운다 — 항목의 `check`는 git 또는
        보드를 읽는 명령이다(예: `git merge-base --is-ancestor <선행 tip>
        HEAD`, `claunch beads show <선행 이슈> --json`의 상태 확인). 데몬이
        전부 참일 때 런을 옮긴다. 메시지로 「끝나면 알려 줄게」를 약속하지
        않는다.
      - 파일 머리글: `# generated-by: <내 세션> issue=<이슈 id> at=<UTC>`.
      바꾸지 않는 것: 기존 스텝의 instructions 산문, 그리고 게이트
      (peer-review, landing, landed, end-gate). 산문을 다시 쓰면 워커
      정본의 규칙이 이 자식에게만 다르게 도는 사고가 되고, 게이트를 빼면
      착지 증거 없이 회차가 닫힌다. 스텝을 더하고 `next`를 잇고 `verify`·
      `checklist`·`done_when`을 붙이는 것까지가 overlay의 권한이다.

      ── 의존 관계 ──
      자식 B가 자식 A의 결과 위에서 작업해야 하면, B의 overlay에 A의 tip
      또는 A의 이슈 상태를 재는 checklist를 넣고, B의 spawn에 `rebase_onto:
      <A의 브랜치>`를 준다. A가 끝나기 전에 B를 띄울지, A 뒤에 띄울지는
      슬롯과 대기 비용으로 정하고 보고에 적는다. 부모 이슈의 close를 자식이
      기다리게 하는 순환은 만들지 않는다(자식은 통합을 기다리고, 부모는
      자식을 기다린다 — 둘 다 걸면 아무도 못 움직인다).

      보고에는 갈래마다 이슈 id, overlay 경로, 의존(선행 이슈·기준 브랜치),
      그리고 자식에게 줄 task 한 줄을 남긴다.
    done_when: |
      갈래마다 이슈 id·overlay 절대 경로·의존·task가 보고에 있고, 파일이
      실제로 `.cflow/generated/` 아래에 쓰여 있다.
    next: validate

  validate:
    title: 절차 파일 검증
    instructions: |
      spawn 전에 파일마다 `claunch cflow show <overlay 절대 경로>`를 돌린다.
      이 명령이 파서·그래프 검사(도달 가능한 종료, 순환 경고, 레이어 합성)를
      돌리고 `extends`의 기반을 실제로 찾는다. 출력의 첫 줄(이름·경로)과
      `extends:` 줄, 경고 줄을 보고에 옮긴다.
      실패한 파일은 고쳐서 다시 돌린다 — 파일이 깨진 채 spawn하면 데몬이
      400으로 거절하므로 세션은 생기지 않지만, 그 왕복은 여기서 아낀다.
      overlay가 기존 스텝의 instructions를 덮어썼는지도 여기서 본다:
      `claunch cflow show`의 스텝 목록에서 정본에 없는 스텝은 더한 것이고,
      정본의 스텝 제목이 바뀌었으면 덮어쓴 것이다 — 덮어쓴 것은 되돌린다.
    done_when: |
      spawn할 모든 overlay에 대해 `claunch cflow show` 출력이 보고에 있고,
      경고가 있으면 왜 받아들이는지 적혀 있다.
    next: spawn

  spawn:
    title: 편성 — 자식 세션 생성
    instructions: |
      갈래마다 spawn 도구로 자식을 만든다. 필드:
      - `workflow`: overlay의 **절대 경로**. 데몬이 이 경로가 내 디렉터리
        또는 자식 디렉터리의 `.cflow/generated/` 안인지 확인하고, 파일을
        합성해 본 뒤에만 세션을 만든다. 시작 시점에 스냅샷되므로 이후 파일을
        고쳐도 그 자식은 바뀌지 않는다.
      - `issue`: 그 갈래의 이슈 id(데몬이 assignee로 배정한다).
      - `worktree`: `<자식 세션>-<요지>` — 코드를 만지는 자식은 저마다
        체크아웃을 갖는다. 선행 자식 위에서 시작하면 `rebase_onto`.
      - `task`: 한 줄 — 목표와 완료 증거. 절차는 파일에 있으니 task에 절차를
        다시 쓰지 않는다.
      - `role`: worker.
      spawn 정책이 거절하면(`spawn.<키>`) 재시도하지 말고 보고에 적는다 —
      한도는 사용자의 설정이다. 만든 자식마다 세션 이름·이슈·overlay 경로를
      보고에 남기고, 부모 이슈 코멘트에 `PLANNED: <세션> <이슈> <overlay>`
      한 줄씩 적는다.
    done_when: |
      계획한 갈래 전부가 세션으로 떠 있거나(이름·이슈·경로가 보고에), 뜨지
      못한 갈래마다 거절 사유가 보고에 있다.
    next: standby

  standby:
    title: 대기 — 사건이 올 때까지
    instructions: |
      여기서는 폴링하지 않는다. 턴을 끝내고 idle로 있으면 된다 — 자식의
      보고, 데몬의 stall 통지, 리더의 요청, 사용자의 지시가 깨우는 신호다.
      깨어나면 무엇이 왔는지 reason에 적고 갈래를 고른다.
      자식이 「끝났다」고 말한 것은 사건이지 판정이 아니다 — 판정은 정산
      단계가 런 상태와 보드로 한다.
    select:
      prompt: |
        무슨 사건이 왔는가?
        · 자식의 회차가 끝났거나 멈췄다(보고·stall 통지·세션 종료) → reconcile
        · 새 목표·범위 변경·추가 갈래가 왔다(사용자·리더) → plan
        · 내 관리 범위를 넘기고 종료할 때가 됐다(사용자 지시, 남은 갈래 없음) → handoff
        셋 다 아니면 고르지 않고 머문다.
      chooser: agent
      require_reason: true
      options:
        reconcile:
          description: 자식의 런·보드를 대조해 다음 조치를 정한다
          next: reconcile
        plan:
          description: 새 갈래 또는 재계획 — 이슈와 overlay를 쓴다
          next: plan
        handoff:
          description: 관리 범위를 인계하고 종료 승인으로 간다
          next: handoff

  reconcile:
    title: 정산 — 자식 런과 보드 대조
    instructions: |
      자식마다 기록으로 판정한다 — 기억이나 자식의 말이 아니라:
      - `claunch cflow status -t <자식> --json`: 현재 스텝·status. `done`이면
        회차가 닫힌 것이고, `waiting_*`면 그 게이트에 서 있는 것이다.
      - `claunch beads show <이슈> --json`, `claunch beads comments <이슈>`:
        `LANDING REQUEST @ <tip>`, `merged <해시>`, `HOLD:`, `BLOCKED:`가
        무엇을 말하는가. 닫는 것은 assignee(자식)다 — 내가 대신 닫지 않는다.
      - `children`: 세션이 살아 있는가, exited인가.
      판정은 셋이다:
      · 정상 진행 — 손대지 않는다. standby로 돌아간다.
      · 결과 없이 끝남(exited인데 착지 마커 없음, 회차가 BLOCKED에 멈춤) —
        재계획이다. 이슈는 open으로 되돌리고(데몬의 SESSION ENDED 처리를
        확인), 새 overlay(같은 이슈, 필요하면 checklist 보강)로 새 자식을
        띄운다. 살아 있는 런은 절대 고치지 않는다 — `claunch cflow goto`는
        사람의 것이다.
      · 범위가 틀림(자식이 범위 밖을 건드리거나 규격이 모자람) — 이슈
        코멘트에 `CHANGES REQUESTED: <무엇을>`을 남기고 자식에게 nudge
        한 줄을 보낸다.
      무엇을 읽어 무엇을 판정했는지 자식마다 reason에 적는다 — 살아 있거나
      끝난 자식마다 (읽은 명령, 판정, 조치) 한 줄씩이다.
    select:
      prompt: 정산 결과 다음 조치는?
      chooser: agent
      require_reason: true
      options:
        continue:
          description: 손댈 것이 없다 — 대기로 돌아간다
          next: standby
        replan:
          description: 결과 없이 끝난 갈래가 있다 — 새 overlay로 새 자식을 편성한다
          next: plan
        done:
          description: 범위의 갈래가 전부 착지했다 — 인계·종료로 간다
          next: handoff

  handoff:
    title: 인계
    instructions: |
      내 관리 범위를 기록으로 넘긴다. 부모 이슈에 코멘트 하나:
      - 갈래별 최종 상태(이슈 id, 세션, 착지 해시 또는 미착지 사유)
      - 살아 있는 자식 목록 — 리더가 adopt(mesh-retopology)해야 하는 것
      - 남은 계획(쓰였지만 띄우지 않은 overlay 경로)
      그 뒤 리더에게 nudge 네 줄(이슈 id, 코멘트 마커, 살아 있는 자식 수,
      adopt 요청)을 보낸다. 살아 있는 자식이 있으면 리더의 adopt 확인 전에는
      다음 스텝으로 가지 않는다 — 부모가 사라진 자식은 보고할 곳이 없다.
      `.cflow/generated/` 아래 내 세션 이름으로 시작하는 파일 중 spawn에
      쓰이지 않은 것은 지운다. 쓰인 것은 런의 source로 저널에 남아 있으므로
      둔다.
    done_when: |
      부모 이슈에 인계 코멘트가 있고, 살아 있는 자식이 없거나 리더의 adopt가
      확인됐으며, 미사용 overlay가 정리됐다.
    next: end-gate

  end-gate:
    title: 종료 승인
    ask:
      prompt: |
        이 PM의 관리 범위가 인계됐다(부모 이슈 코멘트). 이 런이 done이 되면
        데몬이 이 세션을 종료한다. 세션 종료를 승인하는가?
        보류하면 대기 단계로 돌아가 다음 사건을 기다린다.
      on_decline: standby
    instructions: |
      승인이 나면 이 회차의 최종 보고(갈래별 결과 한 줄씩)를 남기고 끝낸다.
    done_when: |
      갈래별 최종 결과가 한 줄씩 보고에 있고, 인계 코멘트의 이슈 id가 적혀 있다.
    next: end
