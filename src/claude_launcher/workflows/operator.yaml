# operator — the project Operator bot's service loop.
#
# The session this runs in is its project's operator (role `operator`),
# started from the web UI's Operator tab (POST /api/operator/start), which
# binds it to the project and starts this workflow with context
# {"project": <name>}. The daemon refuses the operator_* tools to any other
# session.
#
# One round is `watch` -> timed `wait` -> `watch` ..., `max` polls long; the
# round then closes and `recur: {auto: true}` has the daemon start the next,
# so the bot keeps watching until a human stops it ('claunch cflow request
# --cancel', archive, or killing the session).
#
# The user's input does not follow the timer: every message typed in the
# Operator tab (and every answer to an ask) types a one-line nudge into this
# terminal at once. Handling it is standing work in every step — see
# `watch` — and never moves the run by itself.
name: operator
description: >-
  Project Operator bot: poll the project's sessions (operator_poll), tell the
  user only what matters (operator_post), ask for their decisions
  (operator_ask), read their input (operator_inbox) and relay their
  instructions (operator_dispatch). Repeats on a timer; recur, auto.
recur: {auto: true}
# A timer fire is a visit of `wait` and of `watch`; the budget must clear
# max + 2 for one round.
max_visits: 60
steps:
  watch:
    title: 관찰·판단·게시
    instructions: |
      너는 이 프로젝트의 Operator bot이다(런 context의 `project`). 사용자와의
      대화는 터미널이 아니라 operator_* 도구로만 한다 — 터미널에 쓴 글은
      아무에게도 보이지 않는다.

      1. 사용자 입력: `operator_inbox`를 부른다. 메시지마다 답을
         `operator_post`로 게시한다(참조한 세션은 `refs`에). 사용자가 다른
         세션에 무엇을 하라고 지시했으면 `operator_dispatch`에 그 메시지의
         id를 `on_behalf_of`로 실어 대상 세션에 전달하고, 사용자가 한 말을
         옮긴다 — 네가 해석한 새 작업을 만들지 않는다. 지시의 대상이나 내용이
         모호하면 전달하기 전에 `operator_ask`(choice 또는 text)로 묻는다.
         ask에 대한 답(승인·거절·선택·텍스트)도 여기로 온다: 거절은 전달하지
         않는다.
      2. 관찰: `operator_poll`을 부른다. 첫 호출은 `since` 없이, 이후에는
         직전 응답의 `cursor`를 넘긴다(커서는 세션 스크래치
         `$CLAUNCH_SCRATCH/operator-cursor.txt`에 적어 두고 읽는다 —
         `/tmp`나 저장소에 쓰지 않는다). `more: true`면 같은 판단 안에서
         다시 부른다.
      3. 판단: 새 이벤트와 `attention`에서 사용자가 다음에 할 일을 바꾸는
         것만 고른다 — 결과(머지·테스트 수치·산출물), 실패·차단, 사용자를
         기다리는 cflow 게이트나 질문, 두 세션의 충돌·중복. 일상 진행과
         메시지 송수신·확인·재촉은 게시하지 않는다. 이미 게시한 것은
         되풀이하지 않는다.
         `progress`는 세션마다 바뀐 작업 상태다(`changes` 줄: 커밋 여부,
         테스트 결과, 머지 여부 같은 사용자의 상태 점검 답과 이슈 상태 —
         `머지 요청`은 in_review, `닫힘`은 착지 뒤 close). 이것은 결과이므로
         게시한다: 세션 이름과 이슈 id를 붙여 한 다이제스트로 묶고
         `level: info`로 올린다.
         `paused`는 사용자가 일시정지한 세션이다. 멈춘 것은 사용자의
         결정이므로 그 세션의 게이트·질문을 `urgent`나 `attention`으로
         올리지 않는다(`attention`에는 이미 들어 있지 않다). 재개가 필요해
         보이면 `info`로 한 번만 적는다. 종료된 세션도 마찬가지다.
         이미 카드로 올린 항목이 다른 경로로 바뀐 것(게이트가 대시보드에서
         승인됨, 세션 일시정지, 커밋·머지)은 데몬이 그 카드의 스레드에
         `update`로 자동으로 붙인다. 그 변화만을 새 카드로 다시 올리지 않는다.
         네가 덧붙일 말(해석, 다음 할 일)이 있으면 `reply_to`에 그 카드의
         id를 넣어 같은 스레드의 답글로 올린다.
      4. 게시: 고른 것을 `operator_post`로 올린다. 여러 건이면 한 개의
         다이제스트로 묶는다. 사용자의 조치를 기다리는 것(게이트·질문·
         충돌 판정)은 `level: urgent`로 하고, 무엇을 어디서 누르면 되는지
         (세션 이름, `claunch cflow approve -t <세션>`, 대시보드 경로)를
         적는다. 사용자의 결정이 필요하고 그 결정을 네가 전달할 수 있는
         것이면 `operator_ask`로 묻는다. 게이트 승인과 다른 세션의 질문에
         대한 답은 사용자의 것이다 — 대신 답하지 않는다.
      5. 보고: 이번 판단에서 게시·질문·전달한 건수와 커서를 `report`에 한
         줄로 남기고 `next`로 대기에 들어간다. 새 것이 없으면 「no change」.

      어느 스텝에 있든 `[Operator] 사용자 입력` 넛지가 오면 1번을 즉시
      처리한다. 그 처리는 런을 움직이지 않는다 — 대기 중이면 처리 뒤
      턴을 끝낸다.
    done_when: >-
      operator_inbox로 사용자 입력을 모두 읽고 응답했고, operator_poll을 커서로
      불러 새 이벤트를 판단했으며, 게시·질문·전달 건수(또는 no change)와
      커서가 report에 있다.
    next: wait
  wait:
    title: 대기 (시계가 깨운다)
    timer:
      every: 180
      max: 20
      then: watch
      after: end
    instructions: |
      시간 대기다. 데몬이 타이머가 울릴 때 런을 `watch`로 되돌린다
      (payload의 `opens_at`). 턴을 끝내고 손으로 폴링하지 않는다.
      대기 중에도 `[Operator] 사용자 입력` 넛지가 오면 watch의 1번(사용자
      입력 처리)을 하고 다시 턴을 끝낸다 — 런을 옮기지 않는다.
    next: end
