cflow: 2
name: sim-run
kind: procedure
description: >-
  월드 모델 시뮬레이션 한 번(claunch-efnbt.6, docs/simulation.md). 범위를 정하고
  모델을 세워 걷고, 커버리지가 기준에 못 미치면 보강해 다시 걷고, 결과를 판정
  값(assessment)과 한계로 돌려준다. 판정(consistent·gaps·inconclusive)은 정상
  종료의 값이고, 기술적으로 실행할 수 없을 때만 fail이다. 전수 탐색과 오류 주입
  시험은 아직 claunch에 없으므로 그 필드는 null이고 한계에 적힌다.

# ── 이 파일의 자리 ──────────────────────────────────────────────────────
# 지금은 정적 `call: sim-run`으로 부른다(컴파일 시 펼침). 실행 중인 작업에서
# 부르고 같은 작업으로 돌아오는 동적 호출, 독립 procedures 경로, 호출을 허용할
# 작업 목록은 claunch-4avda(s173)의 범위다. 반환·대기 계약은 claunch-efnbt.6의
# DRAFT-2와 claunch-4avda의 CALL-CONTRACT-1이 정한다.
#
# 기다림의 정본은 시뮬레이션의 실행 기록이다: sim_start 응답의 run.seq를 기억하고
# 같은 seq의 run.ended_at이 찰 때까지 기다린다(끝남 알림은 다시 볼 신호일 뿐).
# 다른 seq가 보이면 다른 실행이 끼어든 것이다.

params:
  purpose: {type: str, default: spec, description: "spec(원천 문서를 확인) 또는 design(설계안 검토, 원천 없이 provisional 규칙)"}
  question: {type: str, required: true, description: 이 시뮬레이션으로 확인할 것 한 문장}
  sources: {type: list, default: null, description: spec일 때 모델을 세울 파일·glob}
  sim: {type: str, default: "", description: 이어 받을 시뮬레이션 id(비우면 새로 만든다)}
  # 아래 기본값은 검증된 기준이 아닌 제안값이다(claunch-4avda CALL-CONTRACT-2). 호출자가 바꾼다.
  coverage_ratio: {type: float, default: 0.5, description: "(제안값) 도달 칸 비율 기준"}
  time_budget_s: {type: int, default: 1800, description: "(제안값) 실행 한 번을 기다리는 최대 초"}

returns:
  ok:
    assessment: str
    findings: str
    adequacy: str
    sim_id: str
    run_seq: int
    model_hash: str
    coverage: dict
    exhaustive: "dict?"
    controls: "dict?"
    open: dict
    limits: list
  fail:
    reason: str
    partial: dict

nodes:
  sim-scope:
    title: 시뮬레이션 범위
    prompt: |
      확인할 것: ${params.question}
      목적: ${params.purpose} / 원천: ${params.sources} / 이어 받을 시뮬레이션: ${params.sim}

      이 단계는 이미 정해진 질문의 모델 범위를 구체화한다. 새 목표나 승인이 필요해
      보이면 시뮬레이션을 만들지 말고 fail(reason: needs_goal)로 돌아간다.

      1. 모델이 대표하는 것과 대표하지 않는 것(동시성, 부분 실패, 사용성 등)을 적는다.
      2. 시뮬레이션을 만든다: sim_create(title, goal=확인할 것, sources, from=이어 받을
         시뮬레이션). purpose가 spec인데 인용할 원천이 없으면 fail(reason:
         sources_missing)로 돌아간다.
      3. 시뮬레이션 id와 한계 목록을 보고한다.
    returns:
      ok: {sim_id: str, limits: list}
      fail: {reason: str, partial: dict}
    effects: [sim.write]
  sim-build:
    title: 모델 작성
    prompt: |
      시뮬레이션 ${result['sim-scope'].value.sim_id}의 모델을 세운다(sim_guide를 먼저 읽는다).
      목적이 spec이면 규칙과 불변식은 원천을 글자 그대로 인용하고, 원천이 정하지 않은
      것만 provisional로 둔다. design이면 provisional로 두되 설계안 이름을 goal에 적는다.
      실행 세션 프로필이 설정되어 있으면 이 단계를 건너뛴다 — 실행 세션이 원천에서
      모델을 세운다. sim_patch가 거절하면 이유대로 고쳐 다시 제출한다.
      승인된 모델을 세우지 못하면 fail(reason: model_rejected)로 돌아간다.
    returns:
      ok: {model_hash: str}
      fail: {reason: str, partial: dict}
    effects: [sim.write]
  sim-walk:
    title: 시뮬레이션 실행
    prompt: |
      sim_start ${result['sim-scope'].value.sim_id}를 부르고 응답의 run.seq를 기억한다.
      - 응답에 runner가 있으면 데몬의 실행 세션이 라운드를 진행한다. 같은 seq의
        run.ended_at이 찰 때까지 기다린다(sim_show로 확인한다. 끝남 알림은 다시 볼
        신호이고 판정은 run 기록으로 한다).
      - runner가 없으면 기다리기만 해서는 진행되지 않는다. 이 작업이 라운드를 진행한다:
        run.ended_at이 찰 때까지 sim_gaps로 열린 발견을 읽고 sim_patch(원천 인용)나
        sim_resolve(dismiss·ask)로 답한다. 받아들여진 sim_patch마다 데몬이 라운드를
        다시 돌리고, 열린 발견 0 또는 max_rounds에서 run이 끝난다. 더 답할 수 없으면
        sim_stop으로 run을 끝낸다.
      - 다른 seq가 보이면 fail(reason: superseded).
      - ${params.time_budget_s}초 안에 끝나지 않으면 sim_stop 후 timeout(partial에 run).
      run.failed가 참이면 fail(reason: runner_failed, partial에 run과 마지막 라운드).
      끝나면 마지막 라운드에서 커버리지를 계산한다:
        rules_fired, rules_total(sim_show의 model_stats), cells_reached, cells,
        criterion "미실행 규칙 0 그리고 도달 칸 비율 ${params.coverage_ratio} 이상(제안값)",
        met(기준 통과 여부).
    returns:
      ok: {run_seq: int, model_hash: str, coverage: dict}
      fail: {reason: str, partial: dict}
      timeout: {partial: dict}
    effects: [sim.write]
  sim-reinforce:
    title: 커버리지 보강
    prompt: |
      직전 실행의 커버리지가 기준에 못 미쳤다: ${prev.coverage}
      실행되지 않은 규칙과 도달하지 못한 칸을 보고, 그 상태에서 시작하는 checkpoint를
      모델에 더하거나 budget·horizon 설정을 늘린다(sim_patch, sim_configure).
      모델의 의미를 바꾸는 수정(규칙 제거, 가드 추가로 사건을 막기)은 하지 않는다.
    returns:
      ok: {}
    effects: [sim.write]
  sim-report:
    title: 시뮬레이션 결과 정리
    prompt: |
      시뮬레이션 ${result['sim-scope'].value.sim_id}의 결과를 정리한다(sim_show, sim_findings,
      sim_proposals).
      - open: {questions, proposals, ambiguous} — 사용자 결정을 기다리는 수.
      - findings: clear(열린 발견·미결 질문·편집 제안·ambiguous 판정 0) | gaps(하나 이상).
      - adequacy: adequate(커버리지 기준 통과) | inadequate(보강 뒤에도 미달).
      - assessment는 두 필드에서 정한다. 둘 다 보존하므로 호출자는 필드로도 판단할 수 있다:
        findings가 gaps이면 gaps(찾은 빈칸은 커버리지와 무관하게 사실이다);
        아니고 adequacy가 inadequate이면 inconclusive; 둘 다 아니면 consistent.
      - exhaustive, controls: 현재 claunch에 없는 검사다. null로 두고 limits에
        "전수 탐색 미지원", "오류 주입 시험 미지원"을 더한다. 수행했다고 보고하지 않는다.
      - limits: 범위 단계의 한계 + 위 미지원 + 커버리지 미달 사유.
      사용자에게 보이는 글은 시뮬레이션 설정 language로 쓴다.
    returns:
      ok: {assessment: str, findings: str, adequacy: str, open: dict, exhaustive: "dict?", controls: "dict?", limits: list}
    effects: [sim.read]

body:
  - sim-scope
  - sim-build
  - sim-walk
  - id: walk-again
    loop:
      while: "$result['sim-walk'].value.coverage.met == false"
      max: 2
      do:
        seq: [sim-reinforce, sim-walk]
  - sim-report
  - return: ok
    value:
      assessment: "$result['sim-report'].value.assessment"
      findings: "$result['sim-report'].value.findings"
      adequacy: "$result['sim-report'].value.adequacy"
      sim_id: "$result['sim-scope'].value.sim_id"
      run_seq: "$result['sim-walk'].value.run_seq"
      model_hash: "$result['sim-walk'].value.model_hash"
      coverage: "$result['sim-walk'].value.coverage"
      exhaustive: "$result['sim-report'].value.exhaustive"
      controls: "$result['sim-report'].value.controls"
      open: "$result['sim-report'].value.open"
      limits: "$result['sim-report'].value.limits"
