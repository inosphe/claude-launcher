cflow: 2
name: stack-v2
description: >-
  자식 세션들의 브랜치를 모으는 스택의 관제 런(v1 stack의 v2 포트). 메인 런
  (improv-worker-v2)의 side 런으로 세션 수명 동안 돈다(slot `<세션>+stack`).
  입력 issue = 스택을 연 회차의 이슈 id(첫 STACK 표가 여기 붙는다), base =
  스택을 연 시점의 내 회차 브랜치 tip. 자식의 통합 요청을 심사해 스택 브랜치
  `<세션>-stack`에 --no-ff로 착지시키고, 메인 런이 착지를 요청할 때마다 컷을
  내며, 메인 런이 master에 착지하면 스택을 새 master 위로 옮긴다. 입력 remote가
  있으면 스택 브랜치를 그 원격에 두고, 자식은 그 브랜치를 base로 PR을 연다
  (stacked PR, docs/cflow-v2.md 10a).

# ── v1 stack.yaml에서 무엇이 문법으로 옮겨 갔는가 ─────────────────────────
# - 서브 런(kind: subflow, runs/<세션>/sub/stack/) -> side 런(docs/cflow-v2.md 2.9).
#   메인 정의의 `sides: {stack: stack-v2}`가 선언하고, 메인 런의 work 작업이
#   flow_start(side: stack)로 세운다. 세션이 끝나면 데몬이 중단한다.
# - 마일스톤 넷(publishes/awaits, `claunch cflow published`의 종료 코드) ->
#   log 컬렉션 `signals`. 쓰는 런이 자기 log에 쓰고, 읽는 런이 fresh()로 본다:
#     메인 -> 스택  cut-wanted  메인 stack-cut을 떠날 때 (main:signals)
#     스택 -> 메인  cut         이 정의의 cut을 떠날 때 (side:stack:signals)
#     메인 -> 스택  frozen      메인 integration-request를 떠날 때
#     메인 -> 스택  landed      메인 landed에 들어갈 때
#   소비는 이름별 cursor다(consume {from, name}): landed를 처리해도
#   cut-wanted는 그대로 fresh다. v1의 「떠날 때 본 게시 횟수」와 같은 뜻이다.
# - standby의 select(chooser agent) + 산문 순서 규칙 -> choose의 when 가드.
#   가드가 막지 못하는 판단(심사 통과 여부, 사용자 지시)만 산문에 남았다.
# - landing_queue: {target: '{session}-stack', reset_at: cut} -> landing 컬렉션
#   (improv-common의 landing-queue 타입, TARGET {session}-stack, reset_at cut).
# - verify로 걸던 「새 게시 없이 떠나지 않는다」(cut, submitted, restack) ->
#   옵션의 when 가드. 가드가 거짓이면 그 옵션을 고를 수 없다.
# - stacked PR(claunch-yq80p.2 단계 B): 자식 PR의 base = 원격의 `<세션>-stack`.
#   이 런이 그 브랜치를 원격에 두고 로컬과 같은 tip으로 유지한다. landing 레코드에
#   pr_url이 있으면 그 PR을 gh로 머지하고(리더의 PR 후보와 같은 절차), 없으면
#   로컬 --no-ff다. 입력 remote가 없으면 스택은 로컬에만 있고 자식은 로컬 착지다.
# - 세션 수명: 회차 경계가 없으므로 노드 방문이 끝없이 쌓인다 -> max_visits: 0
#   (방문 상한 없음, check 경고 unbounded-visits). 관제 루프는 자기 max를 갖는다.

include: [improv-common]

max_visits: 0

inputs:
  issue:
    type: string
    label: 회차 이슈
    help: 스택을 연 메인 런 회차의 이슈 id. 첫 STACK 표가 여기 붙는다
    required: true
  base:
    type: string
    label: 기준 tip
    help: 스택을 연 시점의 내 회차 브랜치 tip(전체 SHA)
    required: true
  remote:
    type: string
    label: 원격
    help: >-
      스택 브랜치를 둘 원격 이름(메인 런 landing.remote). 비우면 스택은 로컬에만
      있고 자식 PR은 열리지 않는다
  repo:
    type: string
    label: 저장소
    help: gh -R 값(<host>/<owner>/<repo>, 메인 런 landing.repo). remote와 함께 준다

collections:
  # 자식의 착지 요청이 쌓이는 자리. 자식 런의 enqueue-landing trigger가
  # 부모 세션에서 landing을 선언한 런 — 이 side 런 — 으로 넣는다(2.8).
  # landed는 데몬의 watch가 표시한다: 자식 tip이 스택 브랜치의 조상인가.
  # 이 런은 세션이 끝날 때까지 끝나지 않으므로, 착지·거절로 정리된 항목은
  # 컷마다 비운다(reset_at: cut — 컷이 이 스택의 회차 경계다).
  landing:
    type: landing-queue
    env: {TARGET: "{session}-stack"}
    lifecycle:
      reset_at: [cut]
      drop: settled
      remap: {deferred: requested}
      inherit: true
  signals: {type: signals}

nodes:
  open:
    title: 스택 개설
    prompt: |
      이 side 런은 메인 런(improv-worker-v2)의 work 작업에서 첫 자식을
      spawn할 때 세웠다. 메인 런은 그 사이 자기 작업에 그대로 서 있다. 이
      런의 도구 호출(flow_status·flow_report·flow_select·flow_collection)에는
      언제나 `side: stack`을 준다 — side를 생략한 호출은 메인 런이다.

      - 스택 브랜치: `<세션>-stack`을 입력 base(${data.inputs.base})에서
        자르고, 전용 워크트리에 체크아웃한다 —
        `git worktree add <내 워크트리의 형제 경로>/<세션>-stack -b
        <세션>-stack ${data.inputs.base}`. 착지는 전부 그 워크트리에서 하고,
        내 회차 워크트리는 건드리지 않는다: 두 런이 한 워크트리를 나눠 쓰면
        한 쪽의 미커밋 변경이 다른 쪽의 판정에 섞인다.
        **스택 브랜치에는 머지 커밋만 쌓인다.** 기능 커밋은 자식의 몫이다.
      - 자식의 기준(base): 기본은 스택 브랜치다(부채꼴 — 서로 독립인
        자식들). 한 자식이 다른 자식의 결과 위에서 작업해야 하면 그
        자식의 브랜치를 기준으로 삼는다(사슬 — 아래가 먼저 착지한다).
      - 자식 spawn(이후에도 같다): role worker, workflow improv-worker-v2,
        `worktree: <세션>-<요지>`, **`rebase_onto: <세션>-stack`**, `issue:
        <자식 이슈 id>`(`claunch beads create ... --parent <회차 이슈>`로
        먼저 만든다). task에 반드시 세 줄: **기준 브랜치 = <세션>-stack @
        <tip>, 통합 대상 = 그 브랜치(master 아님), 완료 보고·착지 요청
        수신자 = 나.** 1회성 심부름 자식은 스택 워커가 아니므로 workflow:
        errand를 댄다.
      - 넘겨받은 자식(reparent — mesh-delegate로 상위가 옮겨 준 워커):
        그 브랜치는 master에서 잘렸다. 같은 세 줄(기준 브랜치 = <세션>-stack
        @ <tip>, 통합 대상, 수신자)을 한 번의 batch send로 알리고, 커밋이
        있으면 `git rebase <세션>-stack`으로 얹은 뒤 요청하라고 적는다 —
        그 자식의 브리핑은 아직 옛 부모를 부모로 말한다. 표에 「작업 중」으로
        올린다.
      - 원격의 스택 브랜치(stacked PR): 입력 remote=${data.inputs.remote},
        repo=${data.inputs.repo}. remote가 있으면 스택 브랜치를 만든 직후
        원격에 둔다 — `git push <remote> <세션>-stack:refs/heads/<세션>-stack`
        (명시 refspec, bare push 금지) 뒤 `git ls-remote <remote>
        refs/heads/<세션>-stack`의 SHA가 로컬 tip과 같은지 확인한다. 원격에 같은
        이름의 브랜치가 이미 있고 tip이 다르면 덮지 않는다: 이전 세션의 스택일
        수 있으니 그 SHA를 보고와 STACK 코멘트에 적고, 원격 스택 없이(remote가
        빈 것과 같이) 진행한다. 이 원격 브랜치가 자식 PR의
        base다 — 자식의 착지 매체 판정(`claunch cflow2 pr-preflight --base
        <세션>-stack`)은 이 브랜치가 원격에 있어야 PR을 고른다. 기준 브랜치
        줄은 `<세션>-stack @ <전체 SHA> @ <remote>/<세션>-stack`으로 적는다.
        remote가 비었으면 이 push를 하지 않고, 자식은 로컬 착지로 간다.
      - 다른 머신의 자식(remote 편성: `claunch mesh members`의 machine이 나와
        다르다): 그 자식은 이 머신의 브랜치를 볼 수 없고 원격의 스택 브랜치만
        본다 — remote가 비었으면 그 자식을 둘 수 없다(보고에 적고 메인 런에
        알린다).
      - 스택 표: 자식 세션 | 브랜치 | 기준 | 상태(작업 중 / 요청됨 / 착지
        <머지 해시> / 컷 <n> / 넘어감) — 이 표가 컷의 근거이고, 사는 곳은
        보드 코멘트다(`claunch beads comments add ${data.inputs.issue} -f <파일>`,
        첫 줄 `STACK @ <스택 tip>`). 메시지로 돌리지 않는다.
    done_when: |
      스택 브랜치 `<세션>-stack`과 그 워크트리 경로, 시작 tip(= 입력 base),
      첫 자식의 세션·이슈 id, `STACK @ <tip>` 코멘트가 보고에 있다. 입력
      remote가 있으면 원격 스택 브랜치(`<tip> @ <remote>/<세션>-stack`, ls-remote로
      확인한 값) 또는 두지 못한 사유가 보고에 있다.
    returns:
      ok: {branch: str, worktree: str, tip: str, children: list, remote_ref: "str?"}
    effects: [git.branch, git.push, fs.write, session.spawn, board.write, mesh.send]

  land:
    title: 스택 착지 (자식 브랜치 -> 스택 브랜치, --no-ff)
    prompt: |
      스택 워크트리에서 자식 브랜치 하나를 착지한다. 대상은 landing
      컬렉션의 요청(`flow_collection` action list, side stack)이거나 메시
      메시지로 온 요청(다른 머신의 자식 — 그 자식의 trigger는 이 데몬에
      닿지 않으므로 `flow_collection` push로 직접 등록한다)이다:
      ${col.landing}

      - 심사(기준 브랜치 대비 — master 대비가 아니다): (a) 기준 대비 양방향
        diff, (b) 요청이 선 기준 tip이 지금 스택 tip(또는 기준 자식의 tip)과
        같다, (c) 표적 테스트 수치(트리 해시 포함), (d) `git merge-tree
        $(git merge-base <세션>-stack <자식>) <세션>-stack <자식>` 프리뷰가
        깨끗하다 — 하나라도 비면 머지하지 않고 되돌려 보충을 요청한다
        (`flow_collection` set status deferred, 결과 skipped).
      - 충돌이 있으면 머지하지 않는다. 충돌 지점을 적어 그 자식에게 restack
        요청(기준 위로 rebase 후 재요청)을 보내고 표에 「restack 필요」로
        적는다(결과 skipped).
      - 머지: 레코드에 pr_url이 없으면(로컬 후보) `git merge --no-ff <자식
        브랜치>` — 자식 하나당 머지 커밋 하나. fast-forward로 뭉개지 않아야
        스택이 트리로 남는다. 입력 remote가 있으면 머지 뒤 `git push <remote>
        <세션>-stack:refs/heads/<세션>-stack`(fast-forward, --force 금지)로 원격
        스택 브랜치를 로컬과 같게 둔다 — 다음 자식 PR의 diff가 이 머지 이후의
        것이 된다.
      - PR 후보(레코드에 pr_url·pr_number가 있다 — 자식 PR의 base는
        `<세션>-stack`이어야 한다; 레코드의 base가 다르면 머지하지 않고 되돌린다):
        리더의 PR 후보와 같은 절차를 스택 브랜치에 적용한다(docs/cflow-v2.md 10a).
        (1) 원격 스택 브랜치가 로컬 tip과 같은지 `git ls-remote`로 확인한다 —
        다르면 원격에 이 런이 모르는 커밋이 있다는 뜻이니 머지하지 않고 사유를
        적는다(skipped). (2) `gh pr view <번호> -R <repo> --json
        state,mergeable,headRefOid,baseRefName` — mergeable이 UNKNOWN이면 수 초 뒤
        다시 조회한다(실측: 계산이 늦다). CONFLICTING이면 restack 요청으로 간다.
        (3) `gh pr merge <번호> -R <repo> --merge --match-head-commit <레코드 tip>`
        — `--merge`가 merge commit이다(squash·rebase는 tip을 잃는다). 다른 tip이
        올라가 있으면 gh가 거절한다; 그때는 머지하지 않고 그 자식에게 재요청을
        요구한다. 원격 브랜치는 지우지 않는다. (4) `git fetch <remote>` 뒤 스택
        워크트리에서 `git merge --ff-only <remote>/<세션>-stack`, 되확인은
        `git log -1 --format=%H%n%P <세션>-stack` — 둘째 부모가 레코드 tip이어야
        한다. ff가 거절되면(로컬 스택이 그 사이 움직였다) 멈추고 사유를 적는다
        (결과 skipped — PR은 원격에서 이미 머지됐으므로 사유에 그 사실을 적는다).
      - 확인: 착지 결과 트리에서 바꾼 영역의 표적 테스트를 한 번 돌린다
        (창 확보와 수치 표기는 improv-worker-v2 review와 같다). 수치는
        「스택 브랜치 기준」으로 적는다. landing 레코드의 landed 표시는
        데몬의 watch가 한다(자식 tip이 스택 브랜치의 조상인가) — 손으로
        landed를 쓰지 않는다.
      - 보드: `claunch beads close <자식 이슈> --reason "landed <머지 해시>
        on <세션>-stack"`(PR이면 PR url을 덧붙인다) — 닫을 자격은 그 머지 해시다. 표를
        `STACK @ <새 tip>` 코멘트로 갱신한다.
      - ONE batch send(자식마다 section). **미착지 자식을 둘로 가른다.**
        · 착지한 자식: 「착지됨(머지 해시) — 브랜치 동결 유지, 네 wrapup을
          진행하라」
        · 착지 요청을 이미 올린 자식: restack 공지 — 「스택이 <옛 tip> ->
          <새 tip>. `git rebase <네 기준>` 후 표적 테스트를 재확인하고
          갱신된 묶음으로 재요청하라」
        · 아직 요청하지 않은 자식: 새 tip만 알린다 — 「스택 tip이 <새
          tip>이다. 이 해시 이전에 잰 수치는 낡았다. 지금 할 일은 없다」.
          재정렬을 요구하지 않는다(판정: claunch-no-premature-rebase-lhcz).
      - 원격 스택 브랜치는 어느 경로든 머지 뒤 로컬과 같은 tip이다(위 push
        또는 ff). 자식들의 rebase와 PR diff가 그 원격 브랜치를 읽는다.
      master도 내 회차 브랜치도 머지 대상이 아니다 — 내 회차 브랜치에
      스택을 싣는 것은 메인 런의 stack-merge가 컷 하나당 한 번 한다.
    done_when: |
      자식 브랜치 하나가 --no-ff 머지 커밋으로 스택 브랜치에 실렸고(또는
      심사 미달·충돌로 착지하지 않고 보충·restack 요청을 보낸 사실이 적혔고),
      표적 테스트 수치와 새 스택 tip, 닫은 자식 이슈 id, `STACK @ <새 tip>`
      코멘트가 보고에 있으며, batch 공지가 나갔다. PR 후보였으면 PR url과
      머지 커밋의 둘째 부모가 레코드 tip이라는 확인이, 입력 remote가 있으면
      원격 스택 브랜치가 새 tip과 같다는 ls-remote 값이 보고에 있다.
    returns:
      ok: {child: str, merge: str, tip: str}
      skipped: {child: str, reason: str}
    effects: ["git.merge:stack-branch", git.push, test.run, board.write, mesh.send]

  cut:
    title: 컷 (부모의 착지에 실을 것을 끊어 내놓는다)
    prompt: |
      메인 런이 착지를 요청하려 한다(cut-wanted). 스택 표를 둘로 나눈다:
      - **실림**: 마지막 컷 뒤에 스택 브랜치에 착지한 자식 전부(머지 해시).
      - **넘어감**: 아직 작업 중인 자식, 심사에서 되돌린 자식 — 다음 컷의
        후보다. 그들에게는 아무것도 요구하지 않는다(새 tip이 없으므로
        알릴 것도 없다).
      컷 tip은 지금 스택 브랜치의 tip이다. 입력 remote가 있으면 원격 스택
      브랜치가 같은 tip인지 `git ls-remote`로 확인하고 코멘트에 `<컷 tip> @
      <remote>/<세션>-stack`으로 적는다(다르면 push로 맞춘 뒤 적는다 —
      fast-forward만). 실린 것이 없으면 컷 tip은
      마지막 컷 tip과 같고, 그것도 컷이다 — 메인 런은 머지할 것이 없다는
      것을 그 해시로 안다.
      메인 런의 회차 이슈에 `CUT <n> @ <컷 tip>` 코멘트를 남긴다: 실림
      (자식 세션·이슈·머지 해시) / 넘어감(자식 세션·이슈·사유). 메인 런의
      stack-merge는 그 코멘트를 읽어 컷 tip을 머지한다.
      이 작업을 ok로 떠나는 순간 엔진이 이 런의 signals에 `cut`을 쓰고
      (메인 런의 cut-wait가 풀린다) cut-wanted를 소비하며, landing의 정리된
      항목(landed, rejected)을 비운다(lifecycle reset_at cut).
    done_when: |
      컷 번호와 컷 tip, 실림/넘어감 두 목록(세션·이슈·머지 해시 또는 사유)이
      보고에 있고, 메인 런의 회차 이슈에 `CUT <n> @ <컷 tip>` 코멘트가 있다.
    returns:
      ok: {n: int, tip: str, carried: list, deferred: list}
    effects: [git.push, board.write]
    do:
      - {consume: {from: "main:signals", name: cut-wanted}, when: "$outcome == 'ok'"}
      - push: {to: signals, item: {name: "'cut'", tip: "$result.cut.value.tip"}}
        when: "$outcome == 'ok'"

  submitted:
    title: 제출 통지 (컷을 실은 부모 브랜치가 통합 요청됐다)
    prompt: |
      메인 런이 컷을 실은 회차 브랜치로 상위에 통합을 요청했다(frozen).
      이번 컷에 실린 자식들에게 ONE batch send로 알린다: 「네 작업이 <내
      회차 브랜치> @ <tip>에 실려 <회차 이슈>로 통합 요청됐다」. 할 일을
      요구하지 않는 fyi다. 같은 컷으로 다시 요청한 것이면(rebase·재측정 후
      재요청) 알리지 않고 보고에 그렇게만 적는다.
    done_when: |
      요청된 회차 브랜치·tip·회차 이슈와 알린 자식(또는 재요청이라 알리지
      않았다는 사실)이 보고에 있다.
    returns:
      ok: {branch: str, tip: str, told: list}
    effects: [mesh.send]
    do:
      - {consume: {from: "main:signals", name: frozen}, when: "$outcome == 'ok'"}

  restack:
    title: 스택 이전 (부모가 master에 착지한 뒤)
    prompt: |
      메인 런의 회차가 master에 착지했다(landed). 컷에 실렸던 머지들은
      이제 master에 있다 — 다만 메인 런의 rebase(`--rebase-merges`)가
      해시를 새로 찍었을 수 있으므로, 스택 브랜치의 옛 커밋은 master의
      조상이 아닐 수 있다. 그래서 마지막 컷 뒤의 것만 옮긴다:
      `git -C <스택 워크트리> rebase --rebase-merges --onto master <마지막 컷
      tip> <세션>-stack` (컷 뒤에 착지한 것이 없으면 스택 브랜치는 master
      tip이 된다). 충돌이 나면 멈추고(`git rebase --abort`) 충돌한 자식
      머지를 적어 결과 conflict로 보고한다 — 스스로 푼 트리를 스택에 얹지
      않는다. 사용자가 고른다.
      넘어간 자식(작업 중)에게 ONE batch send: 「스택이 <옛 tip> -> <새
      tip>으로 옮겨졌다. 지금 할 일은 없다. 네 rebase 단계에서 `git rebase
      --onto <세션>-stack <옛 스택 tip>`으로 네 커밋만 다시 얹어라」.
      입력 remote가 있으면 옮긴 스택 브랜치를 원격에 `git push
      --force-with-lease=<세션>-stack:<옛 tip> <remote> <세션>-stack:refs/heads/<세션>-stack`
      으로 다시 push하고, 공지의 tip을 `<전체 SHA> @ <remote>/<세션>-stack`으로
      적는다(이 push만 재작성이다 — 옮긴 것이므로). 열린 자식 PR은 base가 같은
      이름이라 그대로 남고, 자식의 rebase 뒤 push가 PR diff를 새 기준 위로 맞춘다.
      표를 `STACK @ <새 tip>` 코멘트로 갱신한다(다음 회차 이슈가 아직 없으면
      방금 착지한 회차 이슈에).
    done_when: |
      옛 스택 tip과 새 스택 tip, 옮긴 머지 수(0일 수 있다), 공지한 자식,
      `STACK @ <새 tip>` 코멘트가 보고에 있다. 충돌로 멈췄으면 그 사실과
      충돌 지점이 있다.
    returns:
      ok: {old_tip: str, tip: str, moved: int}
      conflict: {at: str}
    effects: ["git.rebase:stack-branch", git.push, mesh.send, board.write]
    do:
      - {consume: {from: "main:signals", name: landed}, when: "$outcome == 'ok'"}

  seal:
    title: 스택 마감
    prompt: |
      스택 워크트리를 치운다(`git worktree remove <경로>`). 스택 브랜치는
      지우지 않는다 — 착지한 머지들의 기록이다. 마지막 `STACK @ <tip>`
      표에 「마감」을 적는다. 이 런이 끝나면 메인 런의 `side('stack').live`가
      거짓이 되고, 메인 런의 착지·정산은 스택을 더 기다리지 않는다.
    done_when: |
      스택 워크트리를 지웠고, 마지막 스택 tip과 마감 코멘트가 보고에 있다.
    returns:
      ok: {tip: str}
    effects: [fs.write, board.write]

body:
  - open
  - id: standby-loop
    # 세션 수명의 관제 루프. 사건 하나가 한 회차다. 상한에 닿으면 런이 사람의
    # 승인(loop_limit)에 선다 — 그만큼 사건이 쌓인 세션이면 사람이 볼 만하다.
    loop:
      while: "true"
      max: 500
      do:
        id: standby
        choose:
          chooser: agent
          require_reason: true
          prompt: |
            자식들을 상대로 상주 근무한다. 수신(자식의 요청, 메인 런의 신호)이
            깨움이므로 폴링하지 않는다. 사건이 없으면 고르지 않고 머문다.
            - 자식 요청 처리: 질문 응답, 재브리핑, 막힌 자식 확인. 침묵은 추측하지
              않고 런 상태를 먼저 읽는다 — `claunch cflow2 status -t <자식 세션> --json`.
              자식이 사람의 선택을 기다리는 것은 그 자식의 사용자 게이트다: 대신
              넘지 않는다.
            - 자식끼리 같은 함수·계약을 만진다고 알려 오면 mesh-wire 스킬(connect)로
              둘을 직접 잇는다. 재정렬을 시키지 않는다.
            - 착지 큐(landing): ${col.landing}

            고를 수 있는 옵션은 엔진이 신호로 가른다(가드가 거짓인 옵션은 막혀 있다).
            · **restack** — 메인 런이 master에 착지했다(main:signals의 새 landed).
              다른 무엇보다 먼저다: 스택 브랜치가 옛 기준 위에 서 있는 동안 착지한
              것은 전부 다시 옮겨야 한다. 이 신호가 있는 동안 land·cut·submitted는
              막혀 있다.
            · **land** — 심사할 자식 요청이 있다(landing의 requested, 또는 메시로 온
              remote 자식의 요청). cut-wanted가 새 것이어도 착지를 요청한 자식이
              남아 있으면 land가 먼저다 — **컷 규칙: 착지를 요청한 자식은
              기다린다.** 그래서 requested·waiting 레코드가 있는 동안 cut은 막혀 있다.
              심사에서 떨어진 요청은 기다리지 않는다(deferred로 되돌리고 표에
              「넘어감」).
            · **cut** — 메인 런이 컷을 요청했고(새 cut-wanted) 요청한 자식이 남아
              있지 않다. 아직 작업 중인 자식은 기다리지 않는다 — 다음 컷으로
              넘어간다. 작업 중인 자식을 이번 컷에 싣는 것은 **사용자가 그렇게
              지시했을 때만**이고, 그때는 그 자식이 착지할 때까지 cut을 고르지
              않는다(reason에 지시의 출처를 적는다).
            · **submitted** — 메인 런이 컷을 실은 브랜치로 통합을 요청했다(새 frozen).
            · **seal** — 살아 있는 자식이 없고(`children`), 마지막 컷 뒤에 착지한
              것이 없으며(`git rev-list --count <마지막 컷 tip>..<세션>-stack`이 0),
              메인 런이 세션 종료로 가고 있다(queue-recheck의 done 뒤). 스택이 이
              세션과 함께 끝난다.
          options:
            restack:
              description: 메인 런이 master에 착지했다(landed) — 스택을 새 master 위로 옮긴다
              when: "fresh('main:signals', 'landed')"
              then:
                id: restack-run
                seq: [restack]
                on:
                  conflict: {call: restack-conflict}
            land:
              description: 심사할 자식 요청 하나를 스택 브랜치에 --no-ff로 착지(또는 되돌림)
              when: "not fresh('main:signals', 'landed')"
              then:
                id: land-run
                seq: [land]
                on:
                  skipped: []
            cut:
              description: 메인 런이 컷을 요청했다(cut-wanted) — 지금까지 착지한 것을 끊어 내놓는다
              when: >-
                fresh('main:signals', 'cut-wanted') and not fresh('main:signals', 'landed')
                and count('landing', 'requested') == 0 and count('landing', 'waiting') == 0
              then: cut
            submitted:
              description: 메인 런이 컷을 실은 브랜치로 통합을 요청했다(frozen) — 실린 자식에게 알린다
              when: "fresh('main:signals', 'frozen') and not fresh('main:signals', 'landed')"
              then: submitted
            seal:
              description: 자식도 컷 안 된 착지도 없고 세션이 끝난다 — 스택을 닫는다
              when: "count('landing', 'requested') == 0 and count('landing', 'waiting') == 0"
              then:
                - seal
                - {break: standby-loop}

procedures:
  restack-conflict:
    description: >-
      스택 이전(restack)이 충돌로 멈췄다. 스택 브랜치는 옛 기준 위에 그대로 있다.
      사람이 충돌을 풀고 이전을 마쳤는지, 아니면 이 신호를 넘기는지 고른다.
    body:
      id: restack-conflict-choice
      choose:
        chooser: user
        require_reason: true
        prompt: |
          스택 이전이 충돌로 멈췄다(restack 보고의 충돌 지점). 사람이 스택 워크트리에서
          충돌을 풀고 이전을 마쳤으면 resolved를, 이번 landed 신호를 처리하지 않고 넘기려면
          skip을 고른다. 무엇을 보고 골랐는지 reason에 적는다.
        options:
          resolved:
            description: 사람이 충돌을 풀고 스택 이전을 마쳤다 — landed 신호를 소비하고 관제로 돌아간다
            then:
              id: restack-resolved
              seq: []
              do:
                - {consume: {from: "main:signals", name: landed}}
          skip:
            description: 이전하지 않고 관제로 돌아간다 — landed 신호는 남아 restack만 고를 수 있다
            then: []
