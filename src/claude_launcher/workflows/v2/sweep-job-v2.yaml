cflow: 2
name: sweep-job-v2
description: >-
  배치 스윕 하나를 지켜보는 일회성 자식 세션의 워크플로. 스윕 자체는 데몬 큐 실행기가
  테스트 창에서 낮은 우선순위로 돌린다. 이 런은 결과가 나올 때까지 probe로 기다리고,
  주기마다 대기 중 세션이 idle hold로 내려가지 않도록 알림(nudge)을 받는다. 창을 쥔 동안과
  창을 기다리는 동안의 알림 문구가 다르다. 실패하면 배치를 분해해 원인 머지를 좁히고
  리더에게 보고한 뒤 끝난다. 판정이 나지 않은 채 대기 상한(알림 8회, 약 2시간)에 닿으면
  timed_out 한 줄을 보고하고 끝난다 — 결과는 데몬 통지가 리더에게 전한다.

# 왜 이 워크플로가 있는가 (claunch-yfkt2)
# 스윕 자식이 테스트 창을 기다리는 동안 에이전트 턴이 없으면 데몬의 idle hold가 그
# 세션의 프로그램을 내린다(daemon/hold.py). 깨우는 것은 mesh 메시지나 cflow 통지뿐이다.
# wait의 timeout이 런을 옮기면 데몬 clock이 드라이버에 「the run moved」 블록을
# 보내므로(docs/cflow-v2.md 6.5), 주기 wait가 곧 주기 nudge다. 판정은 probe(데몬이 실행,
# 에이전트 턴 없음)가 하고, 에이전트는 깨어났을 때 `claunch delayed-sweep nudge`가
# 돌려주는 문구 한 줄을 읽는 일만 한다.
#
# 대기 상한 (claunch-1rsgm)
# 감시 세션은 단발성이다. 큐에서 순번을 기다리는 job은 몇 시간에서 며칠까지 걸리고, 그
# 동안 세션을 붙들면 CHILDREN_MAX(3) 슬롯이 대기 중 감시자로 차 버린다. 그래서 wait가
# 900초마다 timeout으로 런을 옮기는 횟수에 상한(8회, 약 2시간)을 둔다. 상한에 닿으면
# timed-out 단계가 한 줄을 보고하고 런이 끝난다(kill-on-end). 판정은 감시 세션에
# 의존하지 않는다: 데몬 Clock이 NOTIFIED 상태가 된 job의 결과 블록
# (`claunch delayed-sweep: result`)을 소유 리더에게 직접 전달한다
# (daemon/delayed_sweep.Clock.tick). 상한 뒤에도 같은 job에 감시 세션을 다시 세우지
# 않는다(Clock.watched) — 다시 필요하면 `claunch delayed-sweep retry-watcher`다.
# loop.max는 상한이 아니다: loop가 max에 닿으면 사람을 기다리므로(loop_limit) 상한은
# `$visits.nudge`로 건다.
#
# 이 런은 recur도 escalate도 선언하지 않는다: done에 닿으면 데몬이 세션을 종료한다
# (kill-on-end, oneshot-job-v2와 같다).
#
# 이 런을 도는 세션의 메시 역할. 위임 자식과 같은 이유로 필요하다(claunch-k3acp):
# 핸들이 `sN`이라 역할이 추론되지 않고, 워크플로가 역할을 선언하지 않으면 어휘의
# 기본값(free-role)으로 떨어진다. 감시 세션도 하나의 job을 받아 끝나는 세션이므로
# `oneshot`이다. 데몬이 스폰 본문을 직접 만들기 때문에(daemon/delayed_sweep.Clock
# .watch_body) 그 값도 거기서 함께 실린다 — 두 곳이 같은 이름을 쓰는지는 테스트가
# 지킨다.
default_role: oneshot

inputs:
  job:
    type: string
    label: 검증 작업 id
    help: 지켜볼 지속 큐 작업(배치 tip)의 id. 데몬이 세션을 만들 때 채운다
    required: true
  database:
    type: string
    label: 큐 DB 경로
    default: ""

nodes:
  attend:
    title: 스윕 작업 인수
    prompt: |
      이 세션은 지속 큐의 스윕 작업 하나를 지켜보려고 만들어졌다. 스윕은 데몬이
      테스트 창에서 낮은 우선순위(-1)로 돌린다. 직접 테스트를 돌리지 않는다 —
      두 번째 스윕은 양쪽 수치를 함께 무효로 만든다.
      먼저 지금 상태를 읽는다:
        `claunch delayed-sweep nudge --job ${data.inputs.job} --database ${data.inputs.database}`
      (두 값이 비어 있으면 오프닝 태스크가 적은 명령을 쓴다.) 출력 첫 단어가
      DONE이면 바로 report로 간다. 그 밖이면 기다리는 것이 이 세션의 일이다.
      이 단계에서 할 일은 상태 한 줄을 보고에 옮기는 것뿐이다.
    done_when: nudge 출력 한 줄이 보고에 있다
    returns:
      ok: {state: str}
    effects: [fs.read]

  nudge:
    title: 주기 알림
    prompt: |
      대기 시간이 한 주기 지났다. 아래를 읽고 그대로 따른다:
        `claunch delayed-sweep nudge --job ${data.inputs.job} --database ${data.inputs.database}`
      · TEST WINDOW HELD: 스윕이 창을 쥐고 돌고 있다. 아무것도 하지 않는다.
        프로세스를 죽이거나 다시 돌리지 않는다.
      · WAITING FOR WINDOW / QUEUED: 창 대기다(스윕은 단위 테스트보다 뒤에 선다).
        아무것도 하지 않는다. 대기가 길다는 것은 고장이 아니다.
      · DONE: 결과가 났다. 보고하고 다음 대기로 돌아가면 곧 결과 단계로 넘어간다.
      보고에는 읽은 첫 단어만 싣는다. 이 단계에서 파일을 만들거나 메시지를
      보내지 않는다.
    done_when: nudge 출력의 첫 단어가 보고에 있다
    returns:
      ok: {word: str}
    effects: [fs.read]

  timed-out:
    title: 대기 상한 도달
    prompt: |
      판정 없이 대기 상한에 닿았다. 이 세션은 여기서 끝난다. 결과는 데몬이 리더에게
      통지하므로(`claunch delayed-sweep: result` 블록) 기다리지 않는다.
      현재 상태를 읽어 한 줄로 보고한다:
        `claunch delayed-sweep nudge --job ${data.inputs.job} --database ${data.inputs.database}`
      보고에는 timed_out, 작업 id(${data.inputs.job}), nudge 출력의 첫 단어를 싣는다.
      메시지나 이슈 코멘트를 만들지 않는다. 테스트를 돌리거나 작업을 취소하지 않는다.
    done_when: timed_out, 작업 id, 큐 상태 첫 단어가 보고에 있다
    returns:
      ok: {job: str, state: str}
    effects: [fs.read]

  result:
    title: 스윕 결과 처리
    prompt: |
      스윕이 판정에 닿았다. 큐의 기록을 읽는다:
        `claunch delayed-sweep status --repo <작업의 repo> --database ${data.inputs.database}`
      (작업의 repo는 `job-state` 출력과 status의 jobs[].repo에 있다.)
      · passed: 결과를 지속 큐가 이미 기록했고 데몬이 리더에게 통지한다. 보고만
        하고 끝난다. 이슈 코멘트나 메시지를 추가로 만들지 않는다.
      · failed: 영수증(receipt 경로)과 실패 테스트 이름·오류 꼬리를 읽는다. 배치였다면
        (`status`에서 covered_by가 이 작업을 가리키는 항목이 있다) 먼저
        `claunch delayed-sweep unbatch --job ${data.inputs.job} --database ${data.inputs.database}`로 덮었던 머지를 개별
        작업으로 풀어 원인 머지를 좁히게 한다. 원인이 어느 머지인지 확정되면 그 SHA와
        이슈를 보고에 적는다. 확정하지 못했으면 「원인 미상」이라고 쓴다.
        수정은 하지 않는다 — 리더의 handle-regression이 수정 자식을 만든다.
      · stuck 또는 cancelled: 상세(detail)를 그대로 보고에 옮긴다.
      리더에게는 mesh로 한 줄(작업 id, 상태, 영수증 경로)만 보낸다. 긴 증거는
      영수증 파일이 정본이다.
    done_when: 판정(passed/failed/stuck/cancelled)과 근거(영수증 경로, 실패면 좁힌 머지 또는 「원인 미상」)가 보고에 있다
    returns:
      ok: {status: str, receipt: "str?", suspect: "str?"}
    effects: [fs.read, fs.write, mesh.send]

body:
  seq:
    - attend
    - id: watch
      loop:
        while: "true"
        max: 20
        do:
          seq:
            - id: sweep-wait
              wait:
                probe: ["claunch", "delayed-sweep", "job-state", "--job", "$CFLOW_IN_JOB",
                        "--database", "$CFLOW_IN_DATABASE"]
                poll: 60
                seconds: 900
                describe: 스윕 작업(또는 그 배치 tip)이 판정에 닿았다
              on:
                timeout: &wait-lapsed
                  cond:
                    - if: "$visits.nudge != null and $visits.nudge >= 7"
                      then: {seq: [timed-out, {break: watch}]}
                    - else: {seq: [nudge, {continue: watch}]}
                undecidable: *wait-lapsed
            - result
            - {break: watch}
