cflow: 2
name: improv-worker-v2
description: >
  자유 진행 워커(v1 improv-worker의 v2 포트) — 터미널 사용자(또는 리더
  브리핑)가 주는 목표 하나가 한 회차다. 세션에 배정된 일감(큐)이 여럿이면
  착지 요청 전까지 일감마다 작업·테스트·커밋을 반복하고, 큐가 비면 배치
  전체를 한 번에 착지 요청한다. 착지는 기계 확인이 깨끗하면 워커가 스스로
  통합을 요청하고, 깨졌을 때만 상위 세션이 결정한다. 요청은 착지가 아니다 —
  머지가 git에 있는지 기계가 본 뒤에 회차가 닫힌다. 상위가 거절하면 그
  거절을 보드에 정산하고 사용자 승인을 거쳐 재작업한다. 머지 실행은 언제나
  한 단계 위 세션의 몫이고, master 머지는 리더 전권이다(규칙
  no-master-merge). 하위 워커를 둔 중첩 편성이면 자식 브랜치들은 세션 수명의
  스택 브랜치에 --no-ff로 모이고, 착지마다 그 컷이 회차 브랜치에 --no-ff로 한
  번 머지된다. 전체 스윕 테스트는 워커 몫이 아니다 — 워커는 바꾼 영역의
  테스트만 표적으로 돌린다. 이 표적 단위 테스트가 리더의 머지 관문이고, 전체
  스위트는 머지 뒤에 리더의 지속 큐가 머지 5건 단위 배치로 낮은 우선순위에서
  돌린다(감시 자식 세션이 주기 알림으로 지켜본다). 착지
  하나 = 회차 하나이고, 배정 큐가 남아 있으면 같은 런 안에서 다음 회차를
  돈다(회차 수 상한 없음). 세션이 만들었거나 배정받은 일감이 전부 closed여야
  세션이 끝난다(예외는 리더의 HOLD).
  회차 구간은 procedures(resolve-issue, workspace, item, land, settle,
  worker-round)로 내보내므로 PM의 생성 파일이 include + call로 쓸 수 있다.

# ── 병행 기간의 메타 ────────────────────────────────────────────────────
# default_role을 두지 않는다: v1 improv-worker가 worker 역할의 기본값이고,
# 둘이 함께 기본값을 주장하면 위저드·폼의 자동 선택이 바뀐다. filter_roles는
# v1과 같다(리더가 실수로 워커 런을 몰지 못하게 막는다).
filter_roles:
  type: whitelist
  roles: [worker]
# 이 런을 도는 워커가 spawn한 하위 워커도 이 런을 돈다.
default_child_cflow: improv-worker-v2

# self-improve는 공용 라이브러리의 프로시저다(claunch-c4e6f.1).
include: [improv-common, self-improve-common]

# 회차 수에 상한을 두지 않는다(claunch-0b8dx, 2026-10-07 사용자 결정): 런은
# 배정 큐가 빌 때까지 돌고, 끝나는 조건은 settle-check의 「모든 일감 closed」다.
# 회차마다 같은 노드를 다시 지나므로 방문 수가 회차 수에 비례해 쌓인다 ->
# max_visits: 0(방문 상한 없음, check 경고 unbounded-visits).
max_visits: 0

# 세션 수명의 side 런(docs/cflow-v2.md 2.9). 첫 자식을 둘 때 work가 세운다.
sides:
  stack: stack-v2

# ── v1 스텝 → v2 노드 대응표 ─────────────────────────────────────────────
# v1 improv-worker.yaml의 41 스텝이 각각 어느 v2 노드(작업 이름, 또는 조합자
# id)에 실렸는가. tests/test_cflow2_improv_worker.py가 같은 표를 들고 v1
# 스텝 전부가 있는지, 오른쪽 이름이 컴파일된 IR에 실제로 있는지 검사한다.
#   intake                -> intake, prior-context(실패하면
#                            prior-context-fallback), intake-issue
#   issue-check           -> issue-check            (choose, resolve-issue)
#   issue-auto            -> issue-auto
#   issue-search          -> issue-search
#   issue-decision        -> issue-decision         (ask-user)
#   issue-adopt           -> issue-adopt
#   issue-create          -> issue-create
#   workspace-check       -> workspace-check        (choose, workspace)
#   workspace-ok          -> workspace-ok           (mismatch -> on 핸들러)
#   workspace-gate        -> workspace-gate         (ask: 사람)
#   branch-setup          -> branch-setup
#   work                  -> work                   (group found 안)
#   test-decision         -> test-decision          (choose)
#   test-skipped          -> test-skipped
#   review                -> review, targeted-test
#   commit                -> commit
#   queue-next            -> queue-next             (choose, worker-round)
#   item-intake           -> item-intake
#   stack-cut             -> stack-cut              (cond side('stack').live)
#   stack-merge           -> cut-wait(wait), stack-merge
#   landing               -> landing                (choose, when $params.allow)
#   landing-review        -> landing-review, landing-review-leader (ask: 착지 요청을 받을 세션)
#   rebase                -> merge-ready, rebase   (loop align)
#   reviewer-ensure       -> reviewer-ensure
#   peer-review           -> peer-review            (ask: 리뷰어)
#   integration-request   -> integration-request
#   await-landing         -> await-landing          (choose, loop await)
#   landing-withdraw      -> landing-withdraw
#   landing-nudge         -> landing-nudge          (await-landing의 nudge 갈래)
#   landing-declined      -> landing-declined
#   rework-gate           -> rework-auto(자율 예산 안), rework-decision(예산 소진 뒤),
#                            rework-budget, rework-gate
#   landing-declined-hold -> landing-declined-hold
#   landed                -> landed-wait(wait), landed   (confirm-landed)
#   wrapup                -> wrapup, round-report(위임)
#   queue-recheck         -> queue-recheck          (choose, 프로시저)
#   stack-round           -> stack-round            (choose)
#   settle-check          -> settle-check           (choose, retry settle-poll)
#   settle-wait           -> settle-wait            (retry의 between, unsettled interval 600)
#   settle-stall          -> settle-stall           (ask-user)
#   end-gate              -> end-deadline(timeout 300), end-decision(ask-user),
#                            auto-release(정리), release-decision(ask-user: end|hold|new-task)
#                            (v1의 게이트는 end-decision이 맡는다. 5분 기한·정리·재질문은
#                            claunch-q4cqy. 두 게이트의 end는 정리를 지나거나 곧바로
#                            런을 마감한다 — claunch-q4cqy.6.)
#   end-notice            -> end-notice (종료 게이트 앞 — settle의 retrospective 직후에
#                            피어에게 종료를 예고한다. 게이트 안에 두면 오래 선 세션의
#                            무효화된 캐시를 다시 prefill 해야 한다 -- claunch-aobd0 /
#                            claunch-q4cqy.6)
#   end-hold              -> end-hold (keep-alive + delivery-hold)
#   (v2 전용)              -> end-new-task            (end-decision의 new-task, claunch-kgfr5)
#   (v2 전용)              -> category-tag, category-refresh
#                            (워크스페이스 카테고리 자동 갱신 — intake 뒤·코딩 전과
#                            wrapup 뒤, 제안이 아니라 즉시 반영. claunch-06fwj)
#   (v2 전용)              -> knowledge-recall, knowledge-record
#                            (워크스페이스 지식 기록 — category-tag 뒤 참조,
#                            category-refresh 뒤 기록. 시작 입력 knowledge_recall·
#                            knowledge_record가 켠다. claunch-269q1)
#   (v2 전용)              -> end-watch(loop), self-improve(call — self-improve-common의
#                            프로시저: review, discuss, align(ask-user), register)
#                            (end-decision의 self-improve, claunch-c4e6f / .1)
#
# ── v1에서 무엇이 문법으로 옮겨 갔는가 ───────────────────────────────────
# - 스텝 사이의 next/select 간선 61개 -> 조합자 트리. 산문에서 「다음 단계로
#   간다」류 문장을 지웠다.
# - stack-cut/stack-merge의 skip: true + editable + 에이전트의 set_state ->
#   land의 cond가 side('stack').live(stack side 런이 살아 있는가)를 본다.
# - stack 서브 런(v1 stack.yaml, sub: stack) -> side 런 stack-v2(sides: 선언,
#   docs/cflow-v2.md 2.9). 마일스톤 publishes/awaits -> 이 런의 log `signals`
#   (cut-wanted, frozen, landed, rebased)와 stack 런의 `side:stack:signals`(cut). 컷 대기
#   (cut-wait)는 엔진이 판정하는 wait until fresh(...)다.
# - found-issue 서브 런(work에서 손으로 start) -> work를 감싼 group `found`.
# - await-landing <-> landing-nudge 순환(interval: 600) -> loop await 안의
#   choose 옵션 nudge의 interval: 600(docs 「choose interval」). 루프 전체를
#   멈추는 every가 아니다 -- 재촉 간격 안에서도 landed·rebase·declined를 고를
#   수 있어야 한다(claunch-jbk5w). 상한 25에 닿으면 런이 사람의 승인(loop_limit)에 선다.
# - rework 간선(peer-review changes, landing-withdraw, rework-gate -> work) ->
#   land가 rework로 끝나고 worker-round의 try/catch가 배치 루프를 다시 돈다.
#   착지 거절(declined) 뒤의 되감기는 `rework-budget`이 `$visits['rework-gate']`로
#   예산을 보고 가른다: 3회까지는 `rework-auto`(사람 없이) -> `rework-gate`,
#   그 뒤는 `rework-decision`(사람 승인) -> `rework-gate`. 사용자 지시 2026-10-26.
# - settle-wait의 timer(every 600, max 6, after settle-stall) -> retry
#   settle-poll(max 7 = 첫 확인 + 여섯 번 깨움)과 catch unsettled. 10분 간격은
#   retry의 every가 아니라 settle-check의 unsettled 옵션 interval이 진다 --
#   간격 동안에도 settled를 고를 수 있어야 한다(claunch-jbk5w, await와 같은 이유).
# - wrapup 뒤 queue-recheck -> intake 루프 -> 본문 loop rounds. 세션 정산
#   (settle-check, 회고, 종료 예고, end-watch)은 그 루프의 finally다 — 모든
#   경로가 지난다(spec.paths.settle-before-end). 종료 예고는 게이트 앞이다
#   (claunch-q4cqy.6).
# - master 머지 금지 산문 7곳 -> rules.no-master-merge(+ spec.invariants).
#
# ── 옮기지 못한 것(후속) ─────────────────────────────────────────────────
# - 저장소 특화 verify(workspace_check, changed_tests, report_check 등)는 v1과
#   같이 정본에 박지 않는다. v2 프로젝트 레이어(.claunch/workflows/v2/)가 아직
#   없으므로 workspace-ok의 재측정은 산문과 반환값(mismatch)이 진다.
# - reviewer-ensure가 부르는 응답자 판정은 `claunch cflow2 responders`다 — v1의
#   `claunch cflow responders`는 v1 런만 찾으므로 v2 런에서는 판정을 내지
#   못한다(claunch-3va8h).

# ── 시작 입력(docs/cflow-v2.md 2.6) ─────────────────────────────────────
# 새 세션·자식 spawn 폼이 이 선언으로 입력 칸을 그린다. 값은 런 데이터
# $data.inputs에 실리고, invariants·acceptance는 엔진이 규칙·모니터·마감 확인으로
# 바꾼다(cflow2/inputs.py). goal은 필수가 아니다: 데몬이 오프닝 태스크로 이슈를
# 만들거나(issue: <id>) 리더 브리핑이 목표를 주는 기존 경로가 그대로 살아 있어야
# 하므로, 비어 있으면 intake가 지금까지처럼 이슈·사용자·브리핑에서 목표를 정한다.
inputs:
  goal:
    type: text
    label: 목표
    help: 이번 회차가 끝났을 때 참이어야 할 것. 비우면 이슈 본문·사용자 지시·리더 브리핑에서 intake가 정한다
    placeholder: 예) cflow2 check의 must-pass 오탐을 고친다
    default: ""
  issue:
    type: string
    label: beads 이슈
    help: 이 회차가 맡을 기존 이슈 id(선택). 오프닝 태스크의 issue:와 같은 뜻이다
    placeholder: claunch-xxxxx
    default: ""
    # 런이 시작된 이슈. 비워 두고 시작한 뒤 사용자·부모가 지정하면 flow_input으로
    # 한 번 채운다(docs 2.6). 회차가 확정한 이슈의 기록은 이 입력이 아니다.
    set_by: [agent]
  scope:
    type: list
    label: 범위(경로·glob)
    help: 이 회차가 고쳐도 되는 경로. 비우면 경로 제한이 없다 — intake는 범위를 기능 수준으로 적고, 바꿀 파일은 coding-plan이 고른다. 범위 밖은 scope-discipline 규칙대로 이슈로 남긴다
  invariants:
    type: invariants
    label: 불변식
    help: 런 내내 지켜야 할 것. probe(셸 명령, 종료 코드 0 = 지켜짐)를 주면 데몬이 주기적으로 재고 어기면 런을 세운다
  acceptance:
    type: acceptance
    label: 완료 기준
    help: 런이 끝나기 전에 충족돼야 할 것. probe가 있으면 엔진이 마감 직전에 재고(0 = 충족), 없으면 마지막 작업에서 스스로 대조한다
  max_rounds:
    type: int
    label: 최대 회차 수
    help: 이 런이 도는 회차의 상한(비우면 큐가 빌 때까지)
    # 회차 루프의 while이 회차마다 읽는다. 사람이 런 도중에 바꿀 수 있다
    # (claunch cflow2 input --user, 웹 런 페이지 — docs 2.6, claunch-umq1f).
    set_by: [user]
  require_coding_approval:
    type: bool
    default: false
    label: 코딩 시작 전 사용자 승인
    help: 켜면 일감별 구현·재작업 전에 변경 계획을 제시하고 사용자 승인을 기다린다. 승인은 이번만 허용(approve-once)과 앞으로도 허용(approve-always — 이 런의 이후 일감은 묻지 않는다) 중에서 고른다. 끄면 기존처럼 자동 진행한다
    # 회차 상한과 다른 결정이라 폼에서 자기 블록을 쓴다(claunch-kzun2).
    # 무그룹으로 두면 max_rounds와 한 블록에 짝지어 서서 무엇에 대한
    # 스위치인지가 블록 제목으로 드러나지 않았다.
    group: 코딩 승인
    # item의 coding-approval-check가 일감마다 읽으므로, 사람이 런 도중에 켜면
    # 다음 일감부터 승인 게이트가 선다(claunch-umq1f). 에이전트는 쓰지 못한다.
    set_by: [user]
  # PR 착지 매체를 정하는 두 스위치(claunch-qke6g). 폼에서 한 블록으로 묶여
  # gh 준비 상태 줄과 함께 놓인다.
  force_pr:
    type: bool
    label: PR 강제(force to make PR)
    precheck: gh
    group: PR
    help: 착지를 PR로만 한다. PR을 만들 수 없으면(gh 미설치·미로그인·원격 없음) 로컬 착지로 바꾸지 않고 BLOCKED로 멈춘다
  force_no_pr:
    type: bool
    label: PR 금지(force not to make PR)
    group: PR
    help: PR을 만들지 않고 기존의 로컬 착지(리더의 --no-ff 머지)만 쓴다. 둘 다 끄면 PR을 먼저 시도하고, 만들 수 없으면 사유를 남기고 로컬 착지로 대체한다
  relation:
    type: enum
    choices: [stacked, independent]
    default: stacked
    label: 부모와의 관계
    help: >-
      stacked — 부모의 스택 브랜치(<부모>-stack, 부모가 리더면 master) 위에서 작업하고
      착지 요청을 부모에게 낸다(부모 착지에 실린다, PR이면 base = 부모 스택 브랜치).
      independent — 대상 브랜치(master) 위에서 작업하고 리더 착지 큐에 직접 요청한다
      (부모는 상태만 본다). 아직 master에 없는 부모 쪽 코드가 필요하면 stacked다
  # reviewer-ensure가 자식 리뷰어를 세울 때 쓰는 profile/harness(claunch-gqgcz).
  # 둘 다 비우면 지금처럼 리뷰어가 이 세션의 profile과 harness를 물려받는다.
  # spawn의 profile selector(PROFILE[:HARNESS], harness만이면 :HARNESS)로
  # 합쳐 넘기므로 데몬의 spawn.allow_profile 게이트가 그대로 적용된다.
  # options:는 값을 데몬이 채우는 목록에서 고르게 한다(claunch-iq1xc, docs 2.6):
  # 폼은 combobox로 그리고, 목록 밖의 값은 시작에서도 런 도중 변경에서도 거절된다.
  reviewer_profile:
    type: string
    label: 리뷰어 profile
    group: 리뷰어
    help: >-
      reviewer-ensure가 세우는 자식 리뷰어의 profile(claunch ls의 이름). 비우면 이 세션의
      profile을 물려받는다. 다른 profile로 세우려면 ~/.claude-launcher/.claunch.yaml의 spawn.allow_profile이
      켜져 있어야 한다
    placeholder: 예) work
    default: ""
    options: {from: profiles, empty: session}
    # reviewer-ensure가 회차마다 읽으므로, 사람이 런 도중에 바꾸면 그 뒤에 세우는
    # 리뷰어부터 적용된다(claunch-gqgcz.1). 이미 살아 있는 리뷰어는 그대로 쓴다.
    set_by: [user]
  reviewer_harness:
    type: string
    label: 리뷰어 harness
    group: 리뷰어
    help: >-
      자식 리뷰어의 harness(claunch harnesses의 이름). 비우면 리뷰어 profile의 기본
      harness다. profile만 비우고 이것만 주면 이 세션의 profile에서 harness만 바꾼다.
      그 profile이 허용하는 harness여야 한다(목록은 리뷰어 profile, 비었으면 이 세션의
      profile에서 harness 정책이 허용하는 것이다)
    placeholder: 예) codex
    default: ""
    # 리뷰어 profile을 바꿔 이 값이 그 profile에서 허용되지 않게 되면 그 변경은
    # 거절된다 — 이 값을 먼저 바꾸거나 비운다.
    options: {from: harnesses, of: reviewer_profile}
    set_by: [user]
  # 난이도 기반 세션 라우팅(claunch-yl0to). 켜면 coding-plan이 일감마다 난이도와
  # 위임 권장을 내고, 쉬운 일감은 이 세션의 대화를 fork한 자식이 하위 설정으로
  # 구현한다(lower-profile-delegation). 끄면 지금처럼 이 세션이 직접 구현한다.
  session_routing:
    type: bool
    default: false
    label: 난이도 기반 세션 라우팅
    # 위임 자식 둘을 여는 스위치다 — 폼에서 그 두 칸 위의 한 줄을 다 쓴다.
    group: 라우팅
    wide: true
    help: >-
      켜면 일감마다 변경 계획(coding-plan)이 난이도(easy/hard)와 위임 권장을 내고, 쉬운
      일감은 이 세션의 대화를 fork한 자식 세션이 하위 profile·모델로 구현한다(이 세션의
      브랜치에 직접 커밋, 리뷰·착지는 이 세션). 코딩 승인이 켜져 있으면 그 게이트에서
      직접/위임을 고른다. 끄면 기존처럼 이 세션이 직접 구현한다
    # item이 일감마다 읽으므로 사람이 런 도중에 켜면 다음 일감부터 적용된다.
    set_by: [user]
  # 작업 병렬 fork(claunch-dm09i). 켜면 work가 일감을 조각(최대 5개)으로 나눠
  # 이 세션의 quick-fork(대화 전체를 복사한 자식, 같은 체크아웃)에 맡기고, 모든
  # fork가 돌아온 뒤 slice-merge가 모아 커밋한다. 끄면 지금처럼 work 혼자 구현한다.
  parallel_fork:
    type: bool
    default: false
    label: 작업 병렬 fork
    # 코딩 승인처럼 자기 블록을 쓴다: 라우팅의 위임 자식과는 다른 결정이다.
    group: 병렬 작업
    help: >-
      켜면 work가 일감을 서로 겹치지 않는 파일 집합의 조각(최대 5개)으로 나눠, 이 세션의
      대화를 복사한 quick-fork 세션들에게 동시에 맡긴다(같은 워크트리·브랜치). fork는
      자기 조각의 파일만 고치고 커밋하지 않으며, 전부 돌아오면 이 세션이 모아서 검토하고
      커밋한다. auto-compact까지 100k 토큰 미만이 남았으면 fork를 만들지 않고 이 세션이
      그 조각을 직접 한다. 끄면 기존처럼 이 세션이 혼자 구현한다
    # item이 일감마다 읽으므로 사람이 런 도중에 켜면 다음 일감부터 적용된다.
    set_by: [user]
  # 위임 자식의 profile과 model preset. 비우면 데몬 설정(웹 Settings의
  # daemon.delegate_profile / daemon.delegate_model), 그것도 비면 내장
  # 기본값(store.DAEMON_DEFAULTS)이다. route-delegate가 그 순서로 정한다.
  delegate_profile:
    type: string
    label: 위임 자식 profile
    group: 라우팅
    help: >-
      session_routing으로 위임할 때 자식 세션의 profile(claunch ls의 이름). 비우면 데몬
      설정 delegate_profile(웹 Settings)을 쓴다. 이 세션과 다른 profile이면
      ~/.claude-launcher/.claunch.yaml의 spawn.allow_profile이 켜져 있어야 한다
    placeholder: 예) ds4
    default: ""
    options: {from: profiles, empty: delegate}
    set_by: [user]
  delegate_model:
    type: string
    label: 위임 자식 model preset
    group: 라우팅
    help: >-
      위임 자식의 모델. 위임 자식 profile(비었으면 데몬 설정 delegate_profile)의 harness가
      받는 값만 고를 수 있다. preset 이름(default, small, large, xlarge, subagent)이면 자식
      profile에서 그 자리의 모델로 바뀐다 — claude는 preset 다섯이 모두 되고, codex와 그 밖의
      harness는 profile의 provider가 그 role의 모델을 선언한 preset만 된다. 그 harness의 모델
      선택지(claude의 haiku·sonnet·opus·fable, codex의 luna·sol 등)도 고를 수 있다(preset이
      아닌 값은 spawn.allow_args 필요). 비우면 데몬 설정 delegate_model(웹 Settings)을 쓴다
    placeholder: 예) small
    default: ""
    options: {from: models, of: delegate_profile}
    set_by: [user]
  # 회차의 시뮬레이션 강도(claunch-qrh0a). off가 아니면 full 회차마다 한 번,
  # 착지 매체를 정한 뒤·코딩 전에 sim-check가 sim-run을 동적 호출로 부른다.
  # required면 착지 절차 앞의 sim-gate가 미결 0이 될 때까지 착지를 막는다.
  # 모델·프로필은 정하지 않는다 — Settings의 Simulation models 기본값이다.
  # off는 YAML 1.1에서 불리언이므로 따옴표로 쓴다.
  simulation:
    type: enum
    choices: ["off", advisory, required]
    default: "off"
    label: 시뮬레이션
    help: >-
      off — 시뮬레이션을 돌리지 않는다. advisory — 회차마다 코딩 전에 이슈 본문과 지금
      코드를 원천으로 시뮬레이션을 한 번 돌리고, 결과(gap·불변식 위반 수)를 착지 요청
      증거에 싣는다(착지를 막지 않는다). required — advisory와 같이 돌리고, 미결(열린
      발견·미결 질문·편집 제안)이 0일 때만 착지 요청으로 넘어간다. 실행 세션·판정
      모델은 Settings의 Simulation models 기본값이다
    # sim-check는 full 회차마다, sim-gate는 착지 절차마다 읽으므로 사람이 런 도중에
    # 바꾸면 다음 회차·다음 착지부터 적용된다.
    set_by: [user]
  # 워크스페이스 지식 기록(claunch-269q1). 참조(pre)는 category-tag 뒤, 기록(post)은
  # category-refresh 뒤에 선다. 참조를 켠 런과 끈 런을 비교하려고(A/B) 참조의 기본은
  # 꺼짐, 기록의 기본은 켜짐이다. 회차마다 cond가 다시 읽으므로 사람이 런 도중에
  # 바꾸면 다음 회차부터 적용된다.
  knowledge_recall:
    type: bool
    default: false
    label: 지식 기록 참조
    help: >-
      켜면 회차마다 코딩 전에 워크스페이스 지식 기록(Knowledge 탭 — 의사결정·비전·니즈·원칙·교훈)을
      knowledge_search로 찾아 이번 회차의 목표와 관련된 기록을 읽고 작업 기준에 반영한다. 끄면
      참조하지 않는다(A/B 비교용)
    group: 지식 기록
    set_by: [user]
  knowledge_record:
    type: bool
    default: true
    label: 지식 기록 남기기
    help: >-
      켜면 회차 마감 뒤(카테고리 갱신 다음) 이번 회차에서 확정된 의사결정·사용자 니즈·원칙·교훈을
      knowledge_record로 남긴다. 끄면 기록하지 않는다
    group: 지식 기록
    set_by: [user]

collections:
  # 이 런이 stack side 런에 보내는 신호(cut-wanted, frozen, landed, rebased). stack 런은
  # fresh('main:signals', NAME)로 읽는다. stack이 서 있지 않으면 쓰지 않는다.
  signals: {type: signals}
  # 이 세션이 연 PR(claunch-yq80p.5). 회차가 바뀌어도 남아(inherit) 다음
  # 회차의 pr-open이 「열린 PR에 이어 붙일지, 후속 PR로 링크할지」를 이
  # 목록으로 정한다. watch가 MERGED를 재서 상태를 옮긴다.
  prs:
    kind: queue
    key: number
    item: {number: int, url: str, branch: str, base: str, issues: list, round: "str?"}
    status:
      values: [open, merged, closed]
      initial: open
      settled: [merged, closed]
    access:
      push: [driver]
      set: [driver, daemon]
      remove: [driver]
    watch:
      every: 300
      probe: 'test "$(gh pr view "$CFLOW_ITEM_URL" --json state -q .state)" = MERGED'
      on: {0: {set: {status: merged}}}
    lifecycle:
      reset_at: [finish]
      drop: settled
      inherit: true

input_constraints:
  - assert: not ($inputs.force_pr and $inputs.force_no_pr)
    fields: [force_pr, force_no_pr]
    message: PR 강제와 PR 금지는 함께 켤 수 없다

params:
  verify:
    type: str
    default: ""
    description: 저장소의 표적 테스트 명령(비우면 저장소의 표적 선택 도구). PM이 call worker-round with로 넘긴다

data:
  recheck: {next: next-round, mode: full}
  land_out: {}
  # 주 이슈(claunch-60539): resolve-issue가 확정한 {issue, how}를 확정할 때마다
  # 덮어쓴다. issue는 beads id이고, 이슈 없이 진행하면 null이다. 귀속을 다시
  # 확정하지 않는 회차(stack-round 등)에서는 마지막 확정 값이 남는다.
  # 시작 입력 inputs.issue는 런을 시작할 때 준 값(데몬이 주입한 Board 이슈)으로
  # 남고, 회차가 실제로 귀속된 이슈는 이 값이 말한다.
  claim: {issue: null, how: null}
  # 이 회차의 착지 매체(landing-medium이 회차 시작에, pr-publish가 PR을 연 뒤
  # 채운다). integration-request의 push trigger가 pr_url·pr_number를 착지
  # 큐 레코드에 싣는다(claunch-yq80p.5).
  landing: {medium: local, reason: "", remote: null, repo: null, base: null,
            pr_url: null, pr_number: null}
  work_report: {}
  # 이번 일감을 누가 구현하는가(claunch-yl0to). route-* 작업이 확정할 때마다
  # 덮어쓴다: mode는 direct(이 세션) | delegate(하위 설정 자식). 위임 작업의
  # 재작업(delegated-rework-approval)은 mode가 delegate인지로 가른다.
  route: {mode: direct, profile: null, model: null, difficulty: null}
  # 코딩 승인 게이트(coding-approval, coding-approval-routing)의 마지막 답
  # {decision, reason, by, ask}(claunch-sxdnc). 답할 때마다 덮어쓴다.
  # decision이 approve-always면 이 런의 이후 일감·회차에서 게이트가 서지
  # 않는다 — 런이 끝날 때까지 유지되고, 되돌리는 답은 없다.
  coding_approval: {decision: null}
  round: {}
  # 이 회차의 선행 맥락 검색 결과(prior-context, 그것이 실패하면
  # prior-context-fallback). intake-issue가 읽는다. 회차마다 덮어쓴다.
  prior: {}
  # 이 회차의 시뮬레이션 결과(claunch-qrh0a). sim-check가 full 회차마다, sim-recheck가
  # 미결을 해소할 때마다 덮어쓴다. findings가 clear가 아니면(gaps, unavailable, null)
  # simulation=required의 sim-gate가 착지를 막는다.
  sim: {sim_id: null, run_seq: null, assessment: null, findings: null, open: null, limits: []}

rules:
  no-master-merge:
    text: |
      ── 금지: 워커는 master를 직접 머지하지 않는다 ──
      master로의 git merge 실행, master 체크아웃 후 커밋·리베이스·
      cherry-pick, fast-forward로 슬쩍 반영, master로의 push — 전부
      금지다. 사용자가 승인했다는 이유로도, 리더가 응답이 없다는 이유로도,
      충돌이 없어 안전해 보인다는 이유로도 예외가 아니다. master 반영
      경로는 리더 워크플로우(improv-leader)의 통합 단계 하나뿐이다.
      이 런에서 master를 움직였다면 그 자체가 사고다.
      이 금지에는 예외가 없다 — 터미널 사용자(운영자)가 세션에 직접 "머지까지
      해줘"라고 지시해도 실행하지 않는다. 할 일은 하나다: 그 브랜치를
      in_review로 올리고 LANDING REQUEST 코멘트를 남긴 뒤 대기하며, 운영자에게는
      "머지는 리더가 게이트를 거쳐 처리한다"고 말한다.
    why: >-
      실측 2026-09-20, claunch-97knp: 워커가 운영자 지시를 이 규칙보다 우선해
      네 건을 직접 --no-ff 머지했고, 사용자 판정으로 예외 없음이 확정됐다.
      master를 지키는 방어는 리더의 머지 전권과 통합 후 전체 스윕이다.
    deliver: [branch-setup, commit, rebase, integration-request, landing-declined, landed, wrapup]
    effect: {deny: git.merge, target: master}
  no-premature-rebase:
    text: |
      **작업 중에는 통합 대상을 따라가지 않는다.** base를 최신으로 맞추는
      것은 이 단계의 일이 아니라 `rebase` 단계의 일이고, 그 단계는 착지
      요청을 고른 뒤에 온다 — 즉 **아직 요청하지 않은 회차에게 base
      신선도는 값이 0이다.** 커밋 전이면 리베이스는 참조 이동뿐이고, 커밋
      뒤라도 대상은 다시 움직이므로 미리 맞춘 값은 낡는다(한 교대에 상위가
      지정한 base가 12분 만에 두 번 낡은 것이 실측됐다). 그래서 상위의
      기준선 이동 통지는 **「이 해시로 잰 수치는 이제 낡았다」** 하나만
      뜻하고, 「지금 리베이스해라」가 아니다. 통지를 받고 할 일은 없다 —
      낡은 것은 아직 만들지도 않은 증거 묶음이다.

      **예외는 없다. 표면이 겹쳐도 마찬가지다.** 겹침은 양쪽이 끝나야
      정확히 알 수 있고, 그것을 푸는 기계는 전부 뒤에 있다: 내 `rebase`
      단계(`merge_ready.py`), 상위의 머지 단계(`mergecheck`, 통합 프리뷰
      스윕). 작업 중에 상위가 할 수 있는 유용한 일은 재정렬을 시키는 것이
      아니라 **겹치는 상대와 나를 잇는 것**(mesh-wire)뿐이고, 그 뒤 경계는
      우리 둘이 정한다. **상위(리더 또는 스택을 둔 부모 워커)가** 그 밖의 형태로 base
      갱신·restack을 요구하면 이 문단을 근거로 거절하고 그 사실을 보고에
      적는다 — 한 교대에 그 요구가 실제로 나왔고, 거절한 워커가 옳았다
      (판정: claunch-no-premature-rebase-lhcz).
    why: >-
      한 교대에 상위가 지정한 base가 12분 만에 두 번 낡은 것이 실측됐고, 같은
      교대에 상위의 restack 요구를 거절한 워커가 옳았다
      (claunch-no-premature-rebase-lhcz).
    deliver: [work, rework-gate]
  record-tries:
    text: |
      ── 시도 기록: 대화가 압축되기 전에 남긴다 ──
      이 회차의 탐색과 시행착오는 대화 안에만 있으면 compact에서 사라지고,
      회차 보고서를 쓰는 round-report에도 닿지 않는다(그 노드는 자식 세션이나
      서브에이전트로 돌면 이 대화를 전혀 보지 못한다). 기록이 남는 자리는 둘이다:
      · 그 자리에서 — 방향을 바꿨거나, 막혔거나, 세운 가설이 틀린 것으로
        드러났으면 그 순간 이 회차 이슈에 한 줄을 남긴다:
        `claunch beads comments add <이슈 id> "TRIED: <무엇을 했나> -> <무엇이
        나왔나> (<그래서 어떻게 했나>)"`. 노드가 끝날 때까지 미루지 않는다 —
        긴 노드 안에서는 compact가 보고보다 먼저 온다.
      · 노드가 끝날 때 — 보고의 `tried`에 이 노드에서 시도한 것을 항목당 한
        줄로 싣는다(위 코멘트와 같은 줄이어도 된다). 곧장 됐으면 빈 목록이다.
        없는 시행착오를 지어내지 않는다.
      남길 것: 버린 접근과 버린 이유, 빨갛다가 고친 것(무엇이 왜 빨갰나),
      예상과 다르게 나온 측정, 사용자·상위의 결정으로 방향이 바뀐 지점.
      남기지 않을 것: 성공한 명령의 나열, 커밋 메시지나 보고의 다른 필드에
      이미 있는 값.
    why: >-
      claunch-qs4l9: s933 런 저널에서 탐색이 가장 많은 work 노드의 text가 0자·45자였고,
      round-report는 wrapup 반환값만 받아 대화에만 있던 판단과 실패 경위를 보고서에
      실을 수 없었다.
    deliver: [work, review, targeted-test, rebase]

# ── 카테고리 갱신 절차(claunch-06fwj) ──────────────────────────────────
# 회차 앞(intake 뒤·코딩 전)과 wrapup 뒤의 두 노드가 같은 산문을 쓴다. 산문을
# 두 자리에 적으면 갈리므로 조각 하나를 ${frag:...}로 전개한다.
# 이 호출은 제안이 아니다: 사용자 결정(2026-10-23, claunch-06fwj)으로 에이전트의
# `category_assign {new}`는 기본이 즉시 등록이고, 제안 큐는 사람이 체크박스로
# 고를 때(`proposal: true`)만 쓴다. 겹치는 라벨은 여전히 409로 거절되므로 트리에
# 한 키워드가 두 노드로 갈라지지는 않는다.
fragments:
  category-tag: |
    이 세션과 그 이슈를 워크스페이스 카테고리 트리에 배치한다. 이 호출은
    제안이 아니라 즉시 반영이다 — 새 카테고리를 만들 때 `proposal`을 주지
    않는다(claunch-06fwj, 사용자 결정).
    1. MCP `category_tree`로 이 워크스페이스의 트리와 어휘를 읽는다.
       필요하면 `category_search`로 후보를 찾고, `category_items`로 그 노드에
       이미 무엇이 있는지 본다.
    2. 기존 노드 가운데 이번 회차의 목표를 가장 잘 나타내는, 가장 구체적인
       노드를 고른다. 기존 라벨의 동의어는 새 노드가 아니라 그 노드다.
    2a. 고르기 전에 트리가 **평평한지** 본다: 같은 상위 주제의 노드가 최상위에
       여럿 흩어져 있고 이번 회차가 그 주제에 속하면, 노드를 하나 더 얹지 말고
       `category_assign {fold: {label, nodes: [<그 노드들의 id>], parent_id},
       reason}`으로 흡수한다. 흡수된 노드들의 라벨·별칭은 새 노드의 별칭이
       되고, 그 항목·하위 노드는 새 노드로 옮겨진다. 이번 회차의 작업이 한
       주제 안에서 두 갈래로 갈리면 `{split: {parent_id, parts: [{label,
       items: [<ref>]}, ...]}}`로 그 갈래들을 한 번에 만든다 — 항목을 안 적은
       part가 나머지를 가져간다(claunch-2gb7l).
    2b. 트리는 한 노드의 자식이 넷 안팎인 log4 모양으로 자라게 한다 — 한 노드에
       잎(세션)을 계속 늘어놓거나 한 단계에 노드를 계속 늘어놓지 않는다
       (claunch-xvb5o). 2·3에서 정한 자리에 배치하기 전에 두 가지를 센다.
       · **세션 넷 이상이면 나눈다(A → (B, C))**: 고른 노드 A에 직접 달린
         세션을 `category_items {node_id: A, descendants: false}`로 세어 넷
         이상이면 A에 그대로 달지 않는다. A의 항목을 주제로 두세 갈래로 나눠
         `category_assign {split: {parent_id: A, parts: [{label: B, items:
         [<ref>...]}, {label: C, items: [...]}]}, items: [<A의 기존 항목 전부>,
         <이 세션>, <이 세션의 이슈>], reason}`으로 하위 노드를 만들고, 기존
         항목과 이 세션을 그 하위 노드들에 나눠 놓는다. `items`를 주면 이
         세션과 이슈가 자동으로 들어가지 않으므로 직접 넣는다. A에 남길 것이
         없도록 모든 항목이 어느 part에 들어가야 한다 — 항목을 적지 않은 part
         하나가 나머지를 받는다.
       · **형제 노드 넷 이상이면 묶는다(F → (D, E))**: 배치할 단계(고른
         노드의 부모 아래, 또는 새 노드를 만들 부모 아래)에 노드가 넷 이상이고
         그 가운데 한 라벨로 부를 수 있는 주제를 함께하는 노드 D, E(둘 이상)가
         있으면 `category_assign {group: {label: F, nodes: [D, E], place:
         <이 세션이 갈 노드: D·E 가운데 하나나 그 아래>}, reason}`으로 새
         부모 F 아래에 묶는다. D, E는 항목·하위 노드를 그대로 가진 채 옮겨지고
         라벨도 남는다 — 하나로 합쳐 없애는 `fold`와 다르다. 이 세션이 D·E
         어디에도 맞지 않고 F 아래 새 노드가 필요하면 `place`를 비워 F에 둔
         뒤, 3의 `new {parent_id: F}`로 그 새 노드를 만들어 옮긴다.
       · 묶을 주제가 보이지 않거나 나눌 갈래가 서지 않으면 억지로 만들지
         않는다 — 그 판단을 보고의 note에 한 줄 적는다.
    3. 맞는 노드가 없으면 가장 가까운 노드의 자식으로(가까운 것이 없으면
       최상위로) 짧은 키워드 라벨·다른 표기의 별칭·한 줄 설명을 만들고
       `category_assign {new: {parent_id, label, aliases, description},
       reason}`으로 지금 만든다. 기존 라벨·별칭과 겹치면 도구가 409로 그
       노드를 알려 준다 — 새 이름을 짓지 말고 그 노드에 배정한다.
    4. `category_assign`을 정확히 한 번 부른다(2b의 group 뒤에 F 아래 새
       노드가 필요한 경우만 두 번이다). `items`를 생략하면 이 세션과
       그 이슈가 배치된다. 이번 회차에 만든 인수인계 이슈도 같은 주제면
       `items`에 함께 넣는다.
    5. 보고에 결과를 적는다: 배치된 경로, 새로 만든 라벨(있으면), 도구를 쓸 수
       없었으면 그 사유. 카테고리는 회차를 막지 않는다 — 도구가 없거나
       (「not configured」) 데몬에 닿지 않으면 한 줄로 사유를 적고
       assigned=false로 보고한 뒤 다음 단계로 간다.

nodes:
  # ── 회차 시작 ────────────────────────────────────────────────────────
  intake:
    title: 목표 수립
    # 목표 수립 단계: 이 단계에 서 있는 동안 세션은 시뮬레이션을 실행할 수
    # 없다(sim_start·sim_round 거절, 모델 작성·조회는 허용). 판정은
    # sim/run_gate.py, 근거는 claunch-efnbt.9.
    sims: deny
    prompt: |
      새 회차다 — 이번 회차의 목표 하나를 확정한다.

      ── 시작 입력 ──
      런을 시작한 사람이 폼(또는 --input)으로 준 값이다. 첫 회차에서는 이것이
      목표의 출처다. 빈 값은 「주지 않았다」는 뜻이다.
      - 목표: ${data.inputs.goal}
      - 이슈: ${data.inputs.issue}
      - 시작 입력 범위(고쳐도 되는 경로): ${data.inputs.scope}
      오프닝에 `start issue pending:`으로 시작하는 줄이 있으면 이 세션은 「기존
      이슈, 아직 고르지 않음」으로 만들어졌다(claunch-5p2j4): 데몬은 이슈를
      만들지도 배정하지도 않았고, 시작 이슈는 나중에 지정된다. 보드를 뒤지거나
      이슈를 만들지 않고, 사용자나 부모가 이슈 id를 알려 줄 때까지 여기서
      대기한다. 알려 주면 그 이슈 본문이 목표의 출처다. 읽기와 잡기
      (assignee·in_progress), 시작 입력 issue에 그 id를 기록하는 것은
      intake-issue가 한다.
      목표가 비어 있거나 둘째 회차부터는 출처가 둘 중 하나다: 터미널 사용자의
      직접 지시, 또는 리더의 브리핑(이슈가 주어졌으면 그 이슈 본문). 목표가
      아직 없으면 여기서 대기한다(회차는 목표가 생길 때 시작된다). 범위가
      주어졌으면 그 밖의 경로는 이 회차의 범위 밖이다(scope-discipline). 사용자
      불변식·완료 기준이 선언됐으면 아래 규칙 절에 실려 있다.
      이 단계가 읽는 것은 오프닝·이슈 본문·보드(이슈와 코멘트)까지다(아래 스택
      기준의 git 참조 확인 — 기준 tip 비교와 rebase — 은 예외다). 코드와
      테스트를 읽어 바꿀 파일을 고르는 일은 coding-plan이 하고, 데이터 조회·
      측정·원인 조사로 질문에 답하는 일은 work가 한다 — 여기서 미리 하면 그
      결과를 받는 단계가 없고 같은 탐색을 coding-plan에서 다시 한다. 태스크가
      질문이면 목표는 「질문 <요지>에 근거와 함께 답한다」이고, 답은 아직 몰라도
      목표는 선다. 다음을 정해 보고에 남긴다:
      - 목표와 범위(무엇이 포함되고 무엇이 제외되는가) — 기능·동작 수준으로
        적는다. 파일 경로는 시작 입력 범위가 주어졌을 때만 옮겨 적는다.
      - 브랜치 요지: 목표·범위에서 짧은 이름 요지를 정한다. 실제 브랜치
        이름과 생성 여부는 이슈 귀속을 확인한 뒤 `branch-setup` 단계에서
        정한다 — 그 단계가 지금 있는 브랜치를 그대로 쓸 수 있는지 먼저 보고,
        쓸 수 없을 때만 이 요지로 새로 판다.
      - 스택 기준(부모가 워커이고 relation이 stacked일 때 — 지금
        relation=${data.inputs.relation}): 부모가 리더가 아니라 워커(stack 서브
        런을 둔 워커 — 생성 task나 reparent 공지가 말해 준다)면 내 브랜치는
        스택 PR(stacked pull request)의 한 층이다. relation이 independent면 이
        항목은 없다: 기준은 master이고 통합 요청의 수신자는 리더다. 통합 대상은 master가
        아니라 부모의 스택 브랜치(`<부모 세션>-stack`)이거나 부모가
        지정한 선행 자식 브랜치(내가 그 결과 위에서 작업할 때)다 — 그
        기준 브랜치와 스택 순서를 보고에 적는다. 내 브랜치가 master에서
        잘렸는데 기준의 tip이 master와 다르면 착수 전에 `git rebase
        <기준>`으로 얹는다(커밋 전이면 참조 이동뿐이다). 완료 보고·통합
        요청의 수신자도 리더가 아니라 그 부모다.
      - 완료 증거 기준: 완료를 무엇으로 보일지 종류만 적는다(예: 대상 테스트
        green과 신규 테스트, 커밋 해시; 질문이면 답과 그 근거). 수치(suite
        green N/N, 신규 K)는 work·wrapup이 잰 뒤 채운다 — 지금 재지 않는다.
    done_when: |
      목표·범위와 브랜치 요지, 스택 기준(부모가 워커일 때), 완료 증거 기준이
      보고에 기록되어 있다. 범위와 증거 기준은 기능·종류 수준이면 충분하다.
    returns:
      ok: {goal: str, scope: str, branch_gist: str, base: "str?", evidence: str}
    effects: [fs.read]

  prior-context:
    title: 선행 맥락 검색
    sims: deny
    prompt: |
      이번 회차의 목표: ${result.intake.value.goal}
      범위: ${result.intake.value.scope}
      - 선행 맥락(search): 목표를 확정하고 이슈를 만들기 전에 MCP `search`
        도구(Search anything — 모든 보드의 이슈와 코멘트, 세션의 오프닝
        태스크·노트·브리핑·보고를 한 번에 순위화한다)로 목표의 핵심어를
        검색한다. 쿼리는 목표 문장 하나, 필요하면 핵심 파일·기능 이름으로
        한두 번 더 한다(kind 기본값 all; 이 보드의 이슈만 볼 때 `beads`,
        세션만 볼 때 `sessions`). 결과 행의 `sessions`는 그 기록에 붙은
        세션의 현재 상태이고, 전문은 행의 `read` 값을 `search_read`에
        넘겨 읽는다. 같은 목표를 이미 다룬 이슈(중복), 이 목표가 기대는
        선행 작업, 지금 같은 영역을 잡고 있는 살아 있는 세션이 보이면 그
        id·세션과 관계 한 줄을 보고에 남긴다(중복이면 그 id를 duplicate에).
        관련된 것이 없으면 「선행 맥락 없음(쿼리: …)」을
        남긴다. 도구가 「not configured」로 거절하면 `claunch beads search
        "<핵심어>" --json`으로 대신하고 그 사실을 적는다.
      찾은 것을 판정하는 것(중복이면 잡을지·올릴지)은 이 검색의 몫이 아니다 —
      결과만 반환한다.
    done_when: |
      선행 맥락 검색 결과(관련 이슈·세션과 관계, 또는 「선행 맥락 없음(쿼리: …)」)가
      보고에 있다.
    # 드라이버가 직접 한다(claunch-onbdf). 읽기 전용 headless 위임에서는 쓰기
    # 도구와 함께 Bash·MCP도 막혀 이 단계의 셸 명령·MCP search가 돌지 않았다
    # (시험 런에서 실패하거나 검색 없이 끝났다). 그 실행기는 claunch-xjbrh에서
    # 제거됐다.
    executor: [inline]
    returns:
      ok: {query: str, summary: str, related: list, duplicate: "str?"}
    effects: [fs.read]

  prior-context-fallback:
    title: 선행 맥락 검색 (대체)
    sims: deny
    prompt: |
      선행 맥락 검색(prior-context)이 ok 결과 없이 끝났다 — 결과를 쓸 수
      없다. 실패 사유: ${result['prior-context'].value.reason}
      이 검색은 회차를 막는 단계가 아니다(v1 intake와 같다). 직접 한 번 검색한다:
      `claunch beads search "<목표의 핵심어>" --json`(필요하면 핵심 파일·기능
      이름으로 한 번 더). 이번 회차의 목표: ${result.intake.value.goal}
      같은 목표를 이미 다룬 이슈(중복), 이 목표가 기대는 선행 작업이 보이면 그
      id와 관계 한 줄을 남긴다(중복이면 그 id를 duplicate에). 없으면 「선행
      맥락 없음(쿼리: …)」을 남긴다. summary 첫머리에 「검색 실패로 대체 검색」을
      적는다.
    done_when: |
      대체 검색 결과(관련 이슈와 관계, 또는 「선행 맥락 없음(쿼리: …)」)와 검색
      실패 사실이 보고에 있다.
    returns:
      ok: {query: str, summary: str, related: list, duplicate: "str?"}
    effects: [fs.read]

  intake-issue:
    title: 일감 등록·큐 확인
    sims: deny
    prompt: |
      선행 맥락 검색 결과: ${data.prior.summary}
      (중복 후보: ${data.prior.duplicate})
      중복이면 새 이슈를 만들지 않고 그 이슈를 읽기 규칙대로 잡거나(take/join)
      사유와 함께 사용자·리더에게 올린다.
      - 이슈(beads): 생성 task/context에 `issue: <id>`가 있으면(리더가 배정했든
        데몬이 오프닝 task에서 등록했든) `claunch beads show <id> --json`으로
        읽는다 — 그 본문이 목표이고, 같은 일로 이슈를 또 만들지 않는다.
        오프닝의 `start issue pending:` 뒤에 사용자나 부모가 지정한 id도 같은
        규칙으로 읽고 잡으며, 시작 입력 기록은 아래 시작 입력 절대로 한다.
        읽은 본문이 비었거나 자리표시 절뿐이면(데몬이 등록만 하고 규격은
        assignee 몫으로 남긴 형태) 새 이슈를 만들지 말고 오프닝 task
        설명으로 그 본문을 규격(`## 목표 / ## 범위 / ## 완료 증거 기준 /
        ## 출처`)에 맞춰 채운다 — 배정은 이미 서 있고, 비어 있던 것은
        내용이다.
        터미널 사용자의 직접 지시면 지금 만든다: `claunch beads create "<제목>"
        --type task --priority 2 --labels user-direct --assignee
        $CLAUNCH_SESSION --description "<규격>"`. 그 지시가 이 세션이 잡고
        있는 이슈의 후속(같은 기능에 대한 추가 요청)이면 `--parent <그 이슈
        id>`를 붙이고, 관계없는 새 일이면 붙이지 않는다. 리더가 배정한 이슈가 따로
        있는데 사용자 지시가 다르면 사용자 쪽을 잡고, 리더 배정 이슈는
        `claunch beads update <그 id> --status open`으로 되돌린 뒤 `claunch
        beads comments add <그 id> "DECLINED: user-direct <새 id> took
        precedence"`를 남긴다(리더가 재배정한다) — 판단 없이 기계적으로.
        어느 쪽이든 마지막에 `claunch beads update <id> --status in_progress
        --external-ref <run id>/<id>` — 이 전이가 회차의 시작이고, id는 intake
        fyi에 함께 실린다. 전이하는 것은 주 이슈 하나다 — 큐의 나머지는
        아래 큐 항목이 다룬다. external-ref는 보드에서 이슈마다 유일해야
        하고 한 런은 이슈를 여럿 잡으므로(회차 재진입, 배치의 둘째 이후
        일감) run id만 쓰지 않고 `<run id>/<id>`로 쓴다 — run id만 쓰면
        같은 런의 둘째 이슈에서 보드가 거절한다(claunch-7r1qr.1).
        시작 입력 issue(지금 값: 「${data.inputs.issue}」)는 이 런이 시작된
        이슈다. 그 값이 비어 있고, 시작 뒤에 사용자나 부모(리더)가 이
        런의 시작 이슈를 id로 지정했을 때에만 `flow_input`(name `issue`,
        value 그 id)으로 채운다 — MCP를 쓸 수 없으면 `claunch cflow2 input
        issue <id>`. 이 회차가 스스로 고르거나 만들거나 확정한 이슈는 시작
        입력이 아니므로 이 도구로 적지 않는다(그 기록은 워크플로가 따로
        남긴다). 값이 이미 있으면 쓰지 않는다(엔진도 거절한다).
        어느 경로에도 해당하지 않아 이슈가 서지 않았으면 여기서
        지어내지 않는다 — 그 사실과 사유만 보고에 적고, 판정과 처리는
        여기서 하지 않는다. 사유는 추측이 아니라
        오프닝에서 읽는다: 생성 요청이 무이슈였으면 오프닝에 `no issue:`로
        시작하는 줄이 있고, 그 줄이 두 답 중 어느 쪽인지까지 말한다
        — 「wait for instructions」(보드를 뒤지지 말고 오프닝 태스크가
        목표다, 태스크도 없으면 사용자의 지시를 기다린다) 또는
        「assign yourself」(보드에서 스스로 골라 잡는 것이 이 세션의
        일이다). 그 줄이 아예 없으면 무이슈 지시가 아니라 이슈가 서지
        못한 것이다.
        재방문 회차(같은 런의 두 번째 이후 회차 — `claunch cflow2 status
        --json`의 `visits.intake`가 2 이상)면 오프닝의 `issue: <id>`는 앞 회차의 것이고 이미 닫혔거나
        HOLD다. 이때의 주 이슈는 큐의 첫 일감(priority 오름차순 → created_at)
        이다 — 그 id를 `claunch beads show <id> --json`으로 읽고 위와 같은
        규칙으로 규격을 채우고 in_progress로 전이한다. 앞 회차의 브랜치·
        보고서·handoff 이슈는 그 회차의 것으로 남는다 — 작업 브랜치는
        branch-setup이 다시 정하고, 이 회차가 앞 회차 브랜치를 그대로 쓸지는
        그 단계의 재사용 판정이 답한다.
        후속 구현 이슈(assignee 없이 만들어진 것 — wrapup의 인수인계 규칙)도
        이 읽기 규칙이 그대로 목표 경로다: 규격의 출처(원회차 id와 HOLD/마감
        코멘트)가 연결이다.
      - 큐(이 세션에 배정된 나머지 일감): 공통 규칙의 큐 명령
        (`claunch beads list --assignee $CLAUNCH_SESSION --status open
        --status in_ready --status in_progress --limit 0 --json`)으로
        읽는다. 지금 in_progress로 전이하는 것은 주 이슈 하나뿐이고,
        나머지는 상태를 손대지 않은 채 순서(priority 오름차순 → created_at)
        대로 id·제목을 보고에 적는다 — 그 목록이 이 회차의 배치 후보다.
        큐가 주 이슈 하나뿐이면 배치는 그 하나다.
        주 이슈와 같은 연속 작업(series)인 일감 — 주 이슈와 같은 parent의
        형제, 주 이슈의 자식·후속, 주 이슈(또는 배치에 실릴 일감)에 의존하는
        것 — 은 영역(daemon·web UI·워크플로)이 달라도 이 배치의 후보다:
        연속 작업은 한 브랜치에 커밋을 쌓아 PR 하나로 착지시킨다
        (claunch-7r1qr — 연속 작업의 일감마다 커밋 1개짜리 PR이 따로
        머지되던 것을 막는다). 배치 안 일감에만 막힌 의존은 blocked로 세지
        않는다(같은 브랜치에서 앞 커밋이 그 의존을 채운다).
        주 이슈와 무관하거나 같은 브랜치에 실으면 안 되는 일감(다른
        정본 규칙, 다른 저장소 영역, 배치 밖 일감에 막힌 blocked)이 큐에
        있으면 그 판정과 사유를 함께 적는다 — 배치를 거기서 끊을 근거다.
        사용자가 연속 작업을 여러 단계로 나눠 주면 단계마다 회차를 따로
        잡지 않는다: 단계마다 주 이슈의 자식 이슈를 만들어 자기에게
        배정하고(`--parent <주 이슈> --labels user-direct --assignee
        $CLAUNCH_SESSION`, 순서가
        있으면 `claunch beads dep add <뒤 단계> <앞 단계>`) 한 배치로 돈다.
      정본·공용 규칙(파서, 직렬화, 포맷, 공용 문서)에 닿는 목표면 착수 전에
      리더에게 fyi로 알려 다른 세션의 확정 규칙·진행 중 작업과 충돌하는지
      확인한다 — 같은 규칙을 두 세션이 다르게 정하는 사고를 여기서 막는다.
      메시에 속해 있으면 목표 요지를 이슈 id와 함께 리더에게 fyi로 남긴다.

      ${frag:beads-common}
    done_when: |
      이슈 id와 in_progress 전이(이슈가 서지 않았으면 그 사실과 사유), 큐의
      나머지 일감 목록(없으면 「큐 없음」)이 보고에 기록되어 있고, 정본 규칙에
      닿는 목표라면 리더 fyi까지 나갔다.
    returns:
      ok: {issue: "str?", queue: list, no_issue: "str?"}
    effects: [board.write, mesh.send]

  # ── 일감 귀속 (resolve-issue) ────────────────────────────────────────
  issue-auto:
    title: 보드에서 스스로 일감 잡기 (무이슈 auto)
    sims: deny
    prompt: |
      오프닝이 「no issue — assign yourself」라고 말한다: 배정된 이슈는
      없고, 보드에서 스스로 골라 잡는 것이 이 세션이 만들어진 이유다.
      그래서 이 갈래에는 사용자 확정(issue-decision)이 없다 — 그 확정은
      무이슈 답이 아예 없는 세션의 것이고, 여기서는 사용자가 생성 시점에
      이미 답했다. 같은 이유로 새 이슈를 민팅하지도 않는다: 사용자가
      요청한 것은 「보드에 있는 것을 잡아라」이지 「일감을 하나 만들어라」가
      아니다.
      후보는 `claunch beads list --status open --limit 0 --json`과
      `claunch beads list --status in_ready --limit 0 --json`으로 읽고,
      공통 규칙의 「open 풀 판정 기준」으로 살아 있는 일감과 정리 대상을
      가른 뒤 하나를 고른다. 순서는 priority 오름차순 → created_at.
      후보마다 MCP `search`로 그 이슈 id를 한 번 검색하면 이미 그 일을
      다룬 세션 기록(브리핑·보고)과 관련 이슈가 함께 나온다 — 누군가
      이미 끝냈거나 다른 이슈가 대체한 일감을 다시 잡지 않도록 이것으로
      확인한다.
      고른 이슈는 여기서 바로 잡는다 — 판정은 데몬 adoption과 같은
      규칙이다: assignee가 비었거나 그 세션이 종료됐으면 `claunch beads
      update <id> --assignee $CLAUNCH_SESSION`으로 잡고 이어서 `claunch
      beads update <id> --status in_progress --external-ref <run id>/<id>`,
      살아 있는 세션이 붙잡고 있으면 assignee와 상태를 손대지 않고
      `claunch beads comments add <id> "JOINED: $CLAUNCH_SESSION — <이번
      목표 요지>"`로 참가만 한다.
      고를 것이 없으면 지어내지 않는다: 「후보 없음」과 그 근거를 보고에
      적고 issue는 null로 둔다. 이 갈래는 이슈를 만들지 않지만, 다음 단계
      (resolve-issue)가 issue가 null이면 오프닝 태스크로 이슈를 만든다 —
      이슈 없이 진행하는 회차는 착지 요청이 큐에 실리지 않는다.
      메시에 속해 있으면 무엇을 잡았는지 이슈 id와 함께 상위 세션(나를
      스폰한 부모, 부모가 없으면 리더)에게 fyi로 남긴다 — 상위가 배정하지
      않은 이슈를 이 세션이 가져간 것이므로, 그 사실이 상위에게 닿지 않으면
      같은 이슈가 두 번 배정된다. 부모가 워커면(stack 자식) 리더에게 따로
      보내지 않는다: 이 브랜치를 올리는 것은 부모이고, 리더는 부모의 착지
      요청에서 이 이슈를 본다.
    done_when: |
      고른 이슈 id 하나와 그 판정 근거(상태·assignee·그 세션의 생존
      여부·take인가 join인가), 잡기 명령의 결과(take면 in_progress 전이,
      join이면 JOINED 코멘트), 그리고 고르지 않은 상위 후보와 그 사유가
      보고에 있다. 고를 것이 없었으면 「후보 없음」과 그 근거가 있다.
    returns:
      ok: {issue: "str?", how: str}
    effects: [board.write, mesh.send]

  issue-search:
    title: 연관 일감 탐색 (보드 기록에서)
    sims: deny
    prompt: |
      이 세션에는 배정된 이슈가 없다. 착수 전에 보드에서 이 목표와 연관된
      기존 일감을 찾는다 — 보드를 읽는 데에는 허락이 필요 없고, 찾은 것을
      잡는 결정은 사용자 몫이다.
      MCP `search` 도구(kind 기본값 all — 이슈·코멘트와 세션 기록을 함께
      본다; 전문은 행의 `read`를 `search_read`로), `claunch beads search
      "<핵심어>" --json`, open/in_ready/in_progress 목록(`claunch beads
      list --status open --json` 등)으로 후보를 모으고,
      후보마다 다음을 보고에 남긴다: id, 제목, 상태, assignee와 그 세션의
      생존 여부(살아 있는 세션이 붙잡고 있으면 잡기(take)가 아니라
      참가(join)가 된다 — 데몬 adoption과 같은 판정이다), 그리고 이번
      목표와 연관된다고 본 근거 한 줄. 후보가 없으면 「후보 없음」을
      남긴다. 결정하는 사용자가 읽는 것이 이 보고다.

    done_when: |
      후보 목록(각각 id·제목·상태·assignee·생존 판정·연관 근거) 또는
      「후보 없음」이 보고에 있다.
    returns:
      ok: {candidates: list}
    effects: [fs.read]

  issue-adopt:
    title: 일감 잡기 (adopt)
    sims: deny
    prompt: |
      확정된 id를 reason에서 읽는다. 읽어낼 수 없으면 지어내지 않는다 — 그
      사실을 보고에 적고 상위에 한 줄로 묻는다(사람의 확정 reason이 유일한
      전달 통로이고, 그 통로가 비면 이 스텝은 진행할 수 없다). id를 읽었으면
      `claunch beads show <id> --json`으로 다시 읽고 다음을 판정한다.

      assignee가 비었거나 그 세션이 종료됐으면 `claunch beads update <id>
      --assignee $CLAUNCH_SESSION`으로 잡고, 이어서 `claunch beads update
      <id> --status in_progress --external-ref <run id>/<id>` — intake가 말하는
      회차 시작 전이가 이 자리로 미뤄진 것이다.
      살아 있는 세션이 붙잡고 있으면 assignee를 손대지 않고 참가만 한다:
      `claunch beads comments add <id> "JOINED: $CLAUNCH_SESSION — <이번 목표
      요지>"` — 데몬의 adoption 판정과 같은 규칙이고, 이때 상태 전이는 보유
      세션의 것이므로 하지 않는다.
      그 이슈의 본문과 이번 목표가 정확히 같지 않으면 본문을 덮지 말고 이
      회차가 맡는 범위를 코멘트로 남긴다.
      메시에 속해 있으면 목표 요지를 이슈 id와 함께 상위 세션(부모, 부모가
      없으면 리더)에게 fyi로 남긴다(intake에서 미뤄 둔 그 fyi다).
    done_when: |
      확정된 이슈 id가 보고에 있고, assignee가 자신이면 in_progress 전이가
      함께 기록되어 있다(join이면 JOINED 코멘트와 참가 사실).
    returns:
      ok: {issue: str, how: str}
    effects: [board.write, mesh.send]

  issue-create:
    title: 일감 민팅 (create)
    sims: deny
    prompt: |
      intake의 규격 그대로 새 이슈를 만든다 — 제목 한 줄 「무엇을 어떻게」,
      --description은 `## 목표 / ## 범위(포함·제외) / ## 완료 증거 기준 /
      ## 출처(누가·언제·원문)`(원문은 오프닝 task 설명), --labels에는 목표의
      실제 출처 하나(터미널 직접 지시면 user-direct, 리더 브리핑이면
      leader). staged 순서는 description이 먼저, --assignee
      $CLAUNCH_SESSION이 마지막.
      만든 뒤 `claunch beads update <id> --status in_progress --external-ref
      <run id>/<id>`로 회차를 시작 상태로 만든다.
      메시에 속해 있으면 목표 요지를 이슈 id와 함께 상위 세션(부모, 부모가
      없으면 리더)에게 fyi로 남긴다(intake에서 미뤄 둔 그 fyi다).
      이 작업은 세 자리에서 불린다: resolve-issue의 무이슈 갈래(no-issue-wait,
      고를 것이 없던 no-issue-auto, intake-issue가 이슈를 못 잡은 claimed)와
      착지 요청 직전의 방어 게이트(ensure-issue)다. 앞의 둘은 회차 시작이고,
      게이트에서는 작업과 커밋이 이미 끝나 있으니 ## 목표 / ## 범위는 지금까지
      한 일(브랜치, 커밋)로 쓰고 ## 출처에 「착지 요청 직전에 이슈 없음을 발견해
      만듦」을 적는다. 만들기 전에 `claunch beads search "<핵심어>" --json`으로
      중복을 보고, 같은 일의 이슈가 있으면 만들지 않고 그것을 잡는다(assignee가
      비었거나 이 세션이면 잡고, 남이 붙잡고 있으면 JOINED 코멘트).
    done_when: |
      새 이슈 id(또는 중복으로 잡은 기존 이슈 id)가 보고에 있고, in_progress
      전이와 external-ref가 함께 기록되어 있다.
    returns:
      ok: {issue: str}
    effects: [board.write, mesh.send]

  # ── 작업 위치 (workspace) ────────────────────────────────────────────
  workspace-ok:
    title: 작업 위치 합치 (판정을 기계가 다시 잰다)
    prompt: |
      기계 판정이 합치였다. 이 작업에서 할 일은 같은 판정을 한 번 더 재고 그
      결과를 보고에 남기는 것이다. 이 재측정이 앞 선택의 match를 다시 재는
      장치다: `claunch workspace check`를 실행한다
      (0 합치 / 1 불합치 / 2 판정 불가). 검사 구현은 claunch에 내장되어 있어
      워크스페이스에 별도 스크립트를 설치할 필요가 없다.

      보고에는 축별 줄과 종료 코드를 그대로 옮긴다. 어느 축이 「재지 못함」
      이었는지도 적는다: 합치 판정이 세 축 전부로 섰는지 한 축으로 섰는지는
      나중에 이 회차의 위치를 되짚는 사람이 필요로 하는 값이다.

      재측정이 합치가 아니면 앞 선택의 match가 틀렸다는 뜻이다. 그때 할 일은
      보고를 고쳐 다시 내는 것이 아니다 — 결과를 `mismatch`로 내고, 판정
      명령의 출력을 그대로 싣는다. 그 결과는 사람의 승인 문으로 간다. 승인
      없이 이 자리를 지나가는 길은 없다.
    done_when: |
      작업 위치 판정의 종료 코드와 축별 줄이 보고에 있고, 판정이 합치다
      (불합치·판정 불가인데 이 스텝에 서 있는 것은 앞 select가 틀렸다는
      뜻이고, 그 처리는 위 instructions가 적는다).
    returns:
      ok: {code: int, axes: str}
      mismatch: {code: int, output: str}
    effects: [fs.read]

  workspace-gate:
    title: 작업 위치 불합치 — 사용자 승인
    # 응답자는 사람뿐이다(from 없음). timeout을 두지 않는다 — 시간으로
    # 저절로 열리면 틀린 위치의 회차가 승인 없이 돈다.
    ask:
      prompt: |
        이 회차의 작업 위치 판정이 합치하지 않았다. 워커가 서 있는 저장소가
        이 일감이 속한 저장소와 다르거나(불합치), 어느 축도 재지 못했다
        (판정 불가). 다음 스텝이 브랜치를 파는 자리이므로, 승인하지 않는
        동안에는 아무것도 만들어지지 않는다.

        지금 서 있는 위치 그대로 이 회차를 진행하는 것을 승인하는가?

        허가하면: 런이 브랜치 준비로 넘어가 이 디렉터리에서 작업 브랜치를
        정하고, 이 회차의 커밋이 그 트리에 쌓인다. 위치가 실제로 틀렸다면 그
        커밋들은 통합 대상이 없는 저장소에 있으므로 착지하지 못하고, 회차
        하나를 맞는 자리에서 다시 세워야 한다.
        보류하면: 런은 이 게이트에 서 있고 세션은 살아 있다. 아직 브랜치도
        커밋도 만들지 않았으므로 잃는 것은 없다. 위치를 바로잡은 뒤 — 맞는
        워크스페이스에서 세션을 다시 띄우거나, 점유가 사유였다면 그 워크트리를
        쓰던 세션을 정리한 뒤 — 승인하면 그때의 위치에서 이어진다.
        이 세션이 여기서 일해서는 안 된다고 판단되면 런을 접는다:
        `claunch cflow2 abort --reason <사유>`, 또는 대시보드의 Archive.

        판단 근거: 판정 명령의 출력이 앞 스텝의 보고에 축별로 들어 있다
        (`claunch cflow2 journal -n 3`). 다시 재려면
        `claunch workspace check`를 실행한다. 세 축은
        일감의 저장소 / 세션의 등록 위치 / 링크된 워크트리의 점유다.
    prompt: |
      사용자가 지금 위치에서 진행하는 것을 승인했다. 이 스텝에서 할 일은
      기록 둘이다.

      보드에 남긴다: 이 회차 이슈에 `WORKSPACE OVERRIDE: <지금 저장소>
      (기대: <일감의 저장소>)` 한 줄과, 어느 축이 어떤 값으로 깨졌는지를
      (축, 값)의 줄로 붙인다. 이 브랜치가 왜 그 트리에 서 있는지를 나중에
      읽는 자리가 그 코멘트다. 이슈 없는 회차면 남길 곳이 없으므로 그
      사실을 보고에 적는다.
      메시에 속해 있으면 상위 세션에 fyi 한 줄 — 이 회차의 브랜치가 어느
      저장소에 서는지. 상위의 통합 대기 표는 그 값을 전제로 서 있다.

      그리고 **같은 턴에서** 이 작업의 결과를 보고한다 — 승인은 났는데
      아무것도 진행되지 않는 턴을 만들지 않는다.
    done_when: |
      사용자가 승인했고, 이 회차 이슈에 WORKSPACE OVERRIDE 코멘트가 서 있으며
      (이슈 없는 회차면 그 사실이 보고에 있다), 상위 세션에 fyi가 나갔다
      (상위가 없거나 닿지 않으면 그 사실을 적는다).
    effects: [board.write, mesh.send]

  branch-setup:
    title: 작업 브랜치 준비
    prompt: |
      목표·범위와 이슈 귀속이 확정됐다. 구현 전에 이 회차가 어느 브랜치에서
      일할지 정한다. 먼저 지금 있는 브랜치로 이 회차를 받을 수 있는지 보고,
      받을 수 없을 때만 새로 판다. 회차마다 새 브랜치를 파는 이유는 이
      회차의 커밋을 남의 심사·머지에서 떼어 놓는 것이고, 그 목적은 아래
      조건을 만족하는 이미 있는 브랜치로도 선다.

      ── 1. 지금 있는 브랜치를 쓸 수 있는가 ──
      다음 네 조건을 전부 만족하는 브랜치는 그대로 쓴다.
      · 통합 대상이 아니다 — 기준 브랜치(master, 또는 스택 자식이면 부모의
        스택 브랜치) 자신은 작업 브랜치가 아니다.
      · 이미 착지하지 않았다 — `git branch --contains <브랜치> --list <기준>`이
        기준을 내놓으면 그 갈래는 이미 통합돼 임무가 끝났다. 그 위에 얹은
        커밋은 기준보다 뒤처진 갈래에 쌓인다.
      · 동결·심사 중이 아니다 — 그 브랜치가 착지 요청으로 올라가 있으면
        거기에 커밋하는 순간 남이 심사 중인 tip이 내 손에 움직인다.
      · 이 회차의 목표를 담을 자리다 — 그 브랜치의 마지막 커밋이 이 목표와
        같은 일이거나, 그 브랜치가 이 세션의 회차 브랜치거나, 아래 2의
        함께 쓰는 세션이 지정한 작업선이다.

      ── 2. 어느 브랜치를 쓰는가 ──
      · **이 세션의 이번 회차 브랜치가 이미 있다** — 재시작·재진입으로 이
        단계에 다시 섰고 앞선 실행이 이미 브랜치를 팠거나, 이 런의 앞 회차가
        같은 목표로 쓴 브랜치가 남아 있으면 그것을 쓴다. 같은 요지로
        `<세션>-<요지>-2`를 또 파지 않는다.
      · **지금 체크아웃을 다른 세션이 함께 쓴다** — 공유 판정은 아래 3이다.
        그 체크아웃이 이미 서 있는 브랜치가 이 일의 작업선이면 그 브랜치를
        그대로 쓴다(s1762·s1803 사례: 공유 워크트리에 회차마다 새 브랜치를
        파서 한 작업선이 갈래로 쪼개졌다). 두 세션이 같은 작업 트리에
        커밋하는 자리이므로, 함께 쓰는 세션 이름과 같은 목표라는 근거를
        이슈 코멘트에 남기고 쓰기 순서는 그 세션과 메시로 맞춘다.
        후보가 둘 이상이거나 함께 쓰는 세션이 다른 목표를 말하고 있으면
        추측하지 않는다 — 그 세션에 묻고, 답이 없으면 상위에 보고한 뒤
        진행한다.
      · **위 둘이 아니다** — 새로 판다.

      새로 팔 때 이름은 목표·범위에서 만든 요지로 정한다. 이름은 항상 자기
      세션($CLAUNCH_SESSION)을 접두사로 둔 `<세션>-<요지>` 형식이다. 같은
      세션의 브랜치와 이름이 이미 있으면 새 순번을 덧붙인다
      (`<세션>-<요지>-2` 등). 이미 있는 브랜치를 덮어쓰지 않는다.
      하위 워커를 스폰할 계획이면 각 자식에도 별도 워크트리와 브랜치를
      주고, 자식 결과는 stack side 런이 스택 브랜치에 `--no-ff`로 모은다
      (work의 「자식을 두면」 절).

      브랜치 기준은 시작 입력 relation(=${data.inputs.relation})이 정한다.
      · stacked(기본): 상위 통합 대상이 기준이다. 부모가 스택을 둔 워커면 부모의
        스택 브랜치(또는 부모가 지정한 선행 자식 브랜치), 부모가 리더면 이 회차
        시작 시점의 통합 대상 브랜치(master)다.
      · independent: 부모가 워커여도 통합 대상 브랜치(master)가 기준이다. 착지
        요청은 부모가 아니라 리더의 착지 큐로 간다(integration-request). 부모의
        스택 브랜치에 있는 코드가 필요해지면 혼자 기준을 바꾸지 않는다 — 부모에게
        알리고 답(relation을 바꿔 다시 세운다)을 기다린다. 기준을
      확인할 수 없으면 추정하여 현재 브랜치를 기준으로 삼지 말고, 상위에
      물어 답을 기록한 뒤 진행한다.

      작업 위치도 이 단계에서 판정한다. 부모 세션과 같은 체크아웃이면
      새 워크트리에서 작업한다. 자기 이름은 `$CLAUNCH_SESSION`, 부모
      이름은 생성 브리핑에 있고, 각 세션의 cwd는 `claunch sessions` 목록이
      보여준다. 자기 쪽 `git rev-parse --show-toplevel`과 부모 cwd에서의
      같은 명령(`git -C <부모 cwd> rev-parse --show-toplevel`)이 같은
      경로를 내면 공유다. 부모 cwd를 알 수 없으면 `git rev-parse
      --git-dir`와 `--git-common-dir`가 같은지 확인한다. 같으면 메인
      체크아웃이므로 공유로 간주한다. 이 판정은 위 2의 「다른 세션이 함께
      쓴다」 항목과 같은 값이어야 한다 — 재사용을 고를 때 근거로 쓴 그
      판정이다.

      브랜치를 새로 파는 경우에만 생성 명령을 친다. 공유면 `git worktree
      add .claude/worktrees/<이름> -b <피처 브랜치> <기준>`으로 새 워크트리와
      브랜치를 함께 만들고 그 경로로 이동한다. 공유가 아니면 깨끗한 작업
      트리인지 `git status --short`로 확인한 뒤 `git switch -c <피처 브랜치>
      <기준>`을 실행한다. 미커밋 변경이 있으면 버리거나 다른 회차의 브랜치에
      새 목표를 올리지 않는다. 변경의 소유자와 기준을 확인해 새 워크트리를
      만들거나 상위에 보고한다.

      재사용을 골랐으면 브랜치를 만들지 않고 그 브랜치로 이동하는 명령만
      친다(`git switch <브랜치>`, 워크트리 안이면 이미 그 자리다). 그
      브랜치의 미커밋 변경은 내 것이 아니다 — 버리지 않고, 소유 세션과
      무엇을 할지 메시로 맞춘 뒤 진행한다. 재사용한 브랜치에 내 회차의
      커밋이 다른 회차의 커밋과 섞여 쌓이는 것은 이 선택의 값이므로,
      보고와 착지 요청에 어느 회차분이 어디까지인지 해시로 남긴다.

      보고에는 목표에서 정한 요지, 브랜치(새로 팠는지 재사용했는지와 근거),
      워크트리 경로, 기준 브랜치와 기준 해시, 공유 판정, 실행한 명령을
      남긴다. 재사용이면 재사용 근거와 함께 쓰는 세션 이름을 적는다.
    done_when: |
      이 회차가 작업 위치로 삼은 브랜치가 정해졌고 — 새로 판 경우 목표·범위에
      맞는 세션 접두사 이름이고, 재사용한 경우 1의 네 조건을 만족한다는 근거가
      보고에 있다 — 작업 위치가 그 브랜치를 가리킨다. 공유 체크아웃에서
      새로 팠으면 새 워크트리 경로로 이동했고, 재사용했으면 그 브랜치의 기존
      커밋을 덮어쓰지 않았다. 보고에는 브랜치·재사용 여부와 근거·기준 해시·
      작업 위치·공유 판정·실행한 명령이 있다.
    returns:
      ok: {branch: str, base: str, base_hash: str, worktree: "str?", shared: bool}
    effects: [fs.write, git.branch]

  # ── 착지 매체 (claunch-yq80p.5) ──────────────────────────────────────
  local-landing-policy:
    title: 로컬 착지 정책 검사
    prompt: |
      관리 정책이 없는 저장소에서만 로컬 착지로 진행한다. 관리 대상이 있거나
      정책을 읽을 수 없으면 PR 경로를 복구한다. 이 검사 실패를 승인으로 덮지 않는다.
    done_when: 저장소에 PR 전용 정책이 없음을 verifier가 확인했다
    verify: [claunch, reposync, verify, allow-local]
    effects: [fs.read]

  remote-setup:
    title: 착지 매체 결정 (PR · 로컬)
    prompt: |
      ── 관리 대상 정책 우선 ──
      먼저 repo_sync local_status 또는 claunch cflow2 pr-preflight로 대상 정책을
      조회한다. pr_only=true이면 아래의 로컬 통합·직접 base push·PR 실패 시
      local fallback·force_no_pr 경로는 사용할 수 없다. 정책 조회 실패도 보류다.
      child 결과를 받는 stack도 등록된 protected target이면 PR만 허용한다.
      지정된 target authority가 정확한 head/base와 독립 검증을 확인하고 PR을
      통합한다. 권한이 명확하지 않으면 구체적인 계획으로 사용자 승인을 받는다.
      manager는 로컬 복제만 맡으며 merge/push 권한을 받지 않는다.
      원격 착지 증거와 각 host의 로컬 반영은 구분하고, 로컬 FF는 manager에게
      요청한다. 한 host의 반영 실패로 PR을 다시 merge하지 않는다.
      이하의 로컬 방식은 관리 대상이 아닌 경우에만 적용한다.

      이 회차의 작업 브랜치가 정해졌다(branch-setup). 이 회차의 착지 매체를
      정한다 — PR(원격 base로 pull request, 상위가 `gh pr merge`로 머지) 또는
      로컬(상위가 내 브랜치를 --no-ff로 머지). 시작 입력: force_pr=${data.inputs.force_pr},
      force_no_pr=${data.inputs.force_no_pr}(둘이 함께 켜지는 일은 시작 검사가
      막는다).

      ── 1. 사실 수집 ──
      `claunch cflow2 pr-preflight --compact`를 실행한다. 출력 JSON의 ready,
      remote, repo(`-R`에 쓰는 `<host>/<owner>/<repo>`), base, gh, account,
      blockers를 보고에 그대로 옮긴다. 종료 코드 0이 ready다. 이 명령은 읽기만
      한다(설치·로그인·설정 쓰기 없음).
      스택 자식이면(relation stacked이고 intake의 스택 기준이 있다:
      ${result.intake.value.base}) 그 기준을
      `--base <기준 브랜치>`로 준다 — 내 PR의 base는 master가 아니라 부모의
      `<부모 세션>-stack`(또는 부모가 지정한 선행 자식 브랜치)이다(stacked PR).
      preflight는 그 브랜치가 원격에 있는지 `git ls-remote`로 재고 base_sha를
      싣는다. 원격에 없으면 blocker다: 부모의 스택이 로컬에만 있다는 뜻이고,
      아래 판정대로 로컬 착지(부모가 내 브랜치를 스택에 --no-ff로 머지)로 간다.
      원격에 있어도 그것이 부모가 둔 스택인지는 따로 확인한다 — 같은 이름의
      이전 세션 브랜치가 남아 있을 수 있다. 부모가 알린 기준 줄에 원격 ref
      꼬리(`<부모 세션>-stack @ <SHA> @ <remote>/<부모 세션>-stack`)가 없으면
      preflight 결과와 무관하게 로컬 착지다(reason: "parent stack is local"). 꼬리가
      있으면 `git fetch <remote>` 뒤 `git merge-base --is-ancestor <꼬리의 SHA>
      <base_sha>`가 0이어야 한다(스택은 그 뒤로 머지만 쌓인다). 0이 아니면 PR을
      열지 않고 로컬 착지로 가며, 두 SHA를 부모에게 알린다.
      상위 세션이 다른 머신인지도 확인한다 — `claunch mesh ls`에서 상위의
      machine 열이 local이 아니면 원격 편성이다. 원격 편성에서는 로컬 착지가
      성립하지 않는다(상위가 내 커밋을 가진다는 보장이 없다 — 머신을 넘는
      커밋 참조는 `<sha> @ <remote>/<ref>`로만 쓴다).

      ── 2. 판정 ──
      · force_no_pr가 켜져 있고 원격 편성이 아니면 **local**(reason: "force_no_pr").
        pr-preflight의 결과와 무관하다.
      · force_no_pr가 켜져 있는데 원격 편성이면 outcome **blocked**(reason: 원격
        편성에서는 로컬 착지를 할 수 없다).
      · ready면 **pr**. 아래 3을 마친 뒤 반환한다.
      · ready가 아니고 force_pr가 꺼져 있고 원격 편성이 아니면 **local**. reason은
        blockers를 `; `로 이은 것이다. 이 회차 이슈에 `LANDING MEDIUM: local
        (PR 불가: <reason>)` 코멘트를 남긴다 — PR이 기본인데 이 회차가 로컬로
        간 이유가 보드에 남아야 한다.
      · ready가 아니고 force_pr가 켜져 있거나 원격 편성이면 outcome **blocked**.
        reason은 blockers다. 이슈에 `BLOCKED: remote-setup (<reason>)`을 남긴다.
        설치·로그인은 사용자가 한다 — 세션은 대화형 로그인을 할 수 없고 토큰을
        요구하거나 받아 적지 않는다.

      ── 3. pr일 때 원격 준비 (v1 improv-worker-remote remote-setup과 같다) ──
      · push 안전장치: 이 회차의 push는 언제나 명시 refspec이다(`git push
        <remote> HEAD:refs/heads/<브랜치>`). `git config --get push.default`가
        upstream이나 matching이면 bare push가 base로 갈 수 있으므로 blocked로
        올린다. 값을 보고에 적는다.
      · `git fetch <remote>` 뒤 `git branch --set-upstream-to=<remote>/<base>`
        (스택 자식이면 base는 `--base`로 준 기준 브랜치다).
        정렬 게이트(tools/merge_ready.py)와 착지 게이트(`claunch gate landed-check
        --target @{upstream}`)가 이 upstream을 통합 대상으로 읽는다. 원격 편성의
        rebase 기준도 이것이다 — 로컬 master가 아니라 `<remote>/<base>`.
      · 원격 base가 로컬 통합 브랜치보다 뒤처졌는지 잰다: `git rev-list --count
        <remote>/<base>..master`(스택 자식이면 master 대신 부모가 알린 스택 tip). 0이 아니면 그 수와 두 tip을 상위에 알리고
        답을 기다린다(base를 push하는 것은 상위의 통합 단계다 — 워커는 base를
        움직이지 않는다).
    done_when: |
      보고에 pr-preflight 출력(ready·remote·repo·base·blockers)과 원격 편성
      여부가 있고, 판정(pr/local/blocked)과 그 이유가 그 사실에서 나온다. pr이면
      push.default 값과 `git rev-parse --abbrev-ref @{upstream}` 출력이 있다.
      local이면 `LANDING MEDIUM:` 코멘트가, blocked면 `BLOCKED:` 코멘트가 이슈에
      있다.
    returns:
      ok: {medium: str, reason: str, remote: "str?", repo: "str?", base: "str?"}
      blocked: {reason: str}
    effects: [fs.read, git.branch, board.write, mesh.send]

  pr-open:
    title: push · pull request (리뷰 통과 직후, 요청 직전)
    prompt: |
      ── 관리 대상 정책 우선 ──
      먼저 repo_sync local_status 또는 claunch cflow2 pr-preflight로 대상 정책을
      조회한다. pr_only=true이면 아래의 로컬 통합·직접 base push·PR 실패 시
      local fallback·force_no_pr 경로는 사용할 수 없다. 정책 조회 실패도 보류다.
      child 결과를 받는 stack도 등록된 protected target이면 PR만 허용한다.
      지정된 target authority가 정확한 head/base와 독립 검증을 확인하고 PR을
      통합한다. 권한이 명확하지 않으면 구체적인 계획으로 사용자 승인을 받는다.
      manager는 로컬 복제만 맡으며 merge/push 권한을 받지 않는다.
      원격 착지 증거와 각 host의 로컬 반영은 구분하고, 로컬 FF는 manager에게
      요청한다. 한 host의 반영 실패로 PR을 다시 merge하지 않는다.
      이하의 로컬 방식은 관리 대상이 아닌 경우에만 적용한다.

      동료 리뷰가 통과했다. 리뷰어가 본 tip을 원격에 올리고 PR이 그 tip을
      가리키게 한다. 요청 자체(in_review 전이·LANDING REQUEST 코멘트·nudge)는
      다음 단계(integration-request)가 한다.
      원격 정보: remote=${data.landing.remote}, repo=${data.landing.repo},
      base=${data.landing.base}. gh 호출에는 전부 `-R <repo>`를 붙인다.

      ── push ──
      `git push <remote> HEAD:refs/heads/<브랜치>`. 재요청(rebase·remeasure로
      돌아와 tip이 바뀐 경우)이면 `git push --force-with-lease <remote>
      HEAD:refs/heads/<브랜치>`. 이것이 `stale info`로 거절되면 이 세션이
      모르는 push가 원격에 있다는 뜻이다 — 덮지 말고 failed로 끝낸다.
      bare `git push`는 쓰지 않는다. 보낸 뒤 원격이
      그 커밋을 가졌는지 확인한다: `git ls-remote <remote> refs/heads/<브랜치>`의
      SHA가 HEAD와 같아야 한다(저장소에 tools/commit_check.py가 있으면
      `--pushed`로 같은 확인을 한다). 다르면 PR로 넘어가지 않는다.

      ── 이 세션이 이미 연 PR ──
      이 세션의 PR 목록(회차를 넘어 남는다): ${col.prs}
      · 같은 브랜치의 open PR이 있으면 새로 만들지 않는다 — push가 그 PR을
        갱신한다. `gh pr view <번호> -R <repo> --json state,headRefOid`로
        OPEN이고 headRefOid가 HEAD인지 확인한다. push 직후에는 이전 SHA가
        남아 있을 수 있으므로(실측) 다르면 수 초 뒤 다시 조회하고 판정한다.
        재작업·후속 수정이 같은 PR에 모이는 경로가 이것이다. 목록에 없어도
        `gh pr create`가 `already exists:`로 거절하면 그 줄의 url이 이 브랜치의
        열린 PR이다 — 같은 처리를 한다.
      · 이번 회차의 이슈가 목록의 다른 PR의 이슈와 연관되면(같은 parent, 그
        이슈의 후속 수정, 같은 기능의 다음 단계) 새 PR 본문 첫 줄에
        `Follow-up of #<번호>`를 적고, 그 PR에 `gh pr comment <번호> -R <repo>
        --body "Follow-up: <새 PR url>"`을 남긴다. 사용자가 PR 목록에서 흐름을
        따라갈 수 있게 하는 연결이다.

      ── PR ──
      스택 자식이면 base는 부모의 `<부모 세션>-stack`이고(remote-setup이 정한
      값), 착지 요청 수신자인 부모의 stack 런이 이 PR을 `gh pr merge`로 스택
      브랜치에 머지한다. 본문 첫 줄에 `Stacked on <부모 세션>-stack`을 적는다.
      없으면 만든다: `gh pr create -R <repo> --base <base> --head <브랜치>
      --title "<이슈 id>: <커밋 관례의 한 줄 요약>" --body-file <파일>`. 본문에는
      이슈 id(배치면 전부), 목표 한 줄, 증거 묶음이 보드 코멘트에 있다는 안내,
      연관 PR 링크를 적는다. 배치 회차(실린 일감이 둘 이상)면 PR 하나가 연속
      작업 전체다: 제목의 이슈 id는 실린 일감의 공통 parent(없으면 주 이슈)이고
      요약은 연속 작업 전체를 말한다. 본문에 일감마다 한 줄(`<id> <제목> —
      <커밋 해시들>`, `git log --format='%h %s' <base>..HEAD`로 대조)을 실린
      순서대로 적는다. 증거의 정본은 이슈 코멘트다. 본문 파일은
      $CLAUNCH_SCRATCH에 쓴다. CLOSED/MERGED인 PR은 되살리지 않는다.
      PR을 만들 수 없으면(push 거절, gh 오류) outcome **failed**로 끝내고 reason에
      명령과 출력을 적는다 — 다음 처리는 시작 입력(force_pr)에 따라 런이 정한다.
    done_when: |
      `git ls-remote <remote> refs/heads/<브랜치>`의 SHA가 HEAD와 같고, OPEN PR이
      그 tip(headRefOid == HEAD)을 가리키며, PR url·번호가 반환값에 있다. bare
      push는 쓰지 않았다. 연관 PR이 있었으면 양쪽 링크가 있다.
    returns:
      ok: {url: str, number: int, branch: str, base: str, tip: str, issues: list}
      failed: {reason: str}
    do:
      - push: {to: prs, item: {number: "$result['pr-open'].value.number",
                               url: "$result['pr-open'].value.url",
                               branch: "$result['pr-open'].value.branch",
                               base: "$result['pr-open'].value.base",
                               issues: "$result['pr-open'].value.issues"}}
        when: "$outcome == 'ok'"
    effects: [fs.write, git.push, board.write]

  # ── 일감 하나 (item) ─────────────────────────────────────────────────
  # ── 시뮬레이션(claunch-qrh0a) ─────────────────────────────────────────
  # 시작 입력 simulation이 off가 아닐 때만 선다. 시뮬레이션 한 번의 절차는
  # sim-run 프로시저가 정하고(범위 → 모델 → 실행 → 보강 → 정리), 이 두 작업은
  # 그것을 부르고 결과를 회차 데이터 data.sim과 이슈에 남긴다.
  sim-check:
    title: 코딩 전 시뮬레이션
    calls: [sim-run]
    prompt: |
      시작 입력 simulation=${data.inputs.simulation}이다. 코딩 전에 이 회차 목표의
      규칙을 시뮬레이션으로 한 번 확인한다. 원천은 이슈 본문과 지금 코드다 — 구현은
      아직 없으므로 여기서 잡는 것은 요구사항과 기존 코드의 빈칸, 규칙 충돌, 불변식
      위반이다.
      - 목표: ${result['intake'].value.goal}
      - 범위: ${result['intake'].value.scope}
      - 이슈: ${data.claim.issue}

      1. `flow_call`로 sim-run을 부른다(procedure `sim-run`). with:
         - question: 위 목표를 확인 질문 한 문장으로 쓴 것
         - purpose: spec
         - sources: 목표가 닿는 기존 코드·문서 경로. 범위에 경로가 있으면 그 안에서
           고르고, 없으면(intake는 범위를 기능 수준으로 적는다) 목표와 지금 코드에서
           이 단계가 찾는다. 이슈 규칙은 파일이 아니므로 모델에서 `issue:<이슈 id>`
           참조로 인용한다
         실행 세션·판정 프로필과 모델은 넘기지 않는다 — Settings의 Simulation
         models 기본값이 들어간다. callee 런은 `flow_status`의 `calls[].scope`를
         scope로 주고 flow_* 도구로 진행한다.
      2. 호출이 끝나면 이 작업에 `call_result`가 실린다. ok면 시뮬레이션을 이 회차
         이슈에 잇는다: `sim_configure`(<sim_id>, issue: <이슈 id>).
      3. 이슈에 한 줄을 남긴다: `claunch beads comments add <이슈 id> "SIMULATION @
         <sim_id> run <run_seq>: <assessment> (findings <findings>, adequacy
         <adequacy>, open q<questions>/p<proposals>/a<ambiguous>)"`.
      4. 찾은 gap은 이 회차 구현의 재료다. 구현으로 메울 수 있는 빈칸은 work가 다루고,
         사용자가 정해야 할 질문은 시뮬레이션 페이지에 열린 채로 둔다.

      `call_result`가 fail이면(프로필 없음, 런타임 없음 등) 이 작업을 fail로
      보고하지 않는다. ok로 보고하되 assessment·findings를 `unavailable`로 두고
      reason을 limits에 적으며, 이슈에도 `SIMULATION unavailable: <reason>`을
      남긴다. advisory면 회차는 그대로 진행하고, required면 착지 전 sim-gate가
      다시 세운다.
    done_when: |
      sim-run을 한 번 불렀고, 그 결과(또는 실행할 수 없었던 사유)가 보고와 이슈
      코멘트에 있다.
    returns:
      ok:
        sim_id: "str?"
        run_seq: "int?"
        assessment: str
        findings: str
        open: "dict?"
        limits: list
    effects: [sim.write, board.write]
  sim-recheck:
    title: 착지 전 시뮬레이션 미결 해소
    calls: [sim-run]
    prompt: |
      시작 입력 simulation=required다. 착지 요청은 시뮬레이션의 미결(열린 발견·미결
      질문·편집 제안·ambiguous 판정)이 0일 때만 나간다. 지금 값: ${data.sim}

      1. 미결을 읽는다: `sim_show`, `sim_findings`, `sim_proposals`(시뮬레이션
         ${data.sim.sim_id}; null이면 아직 실행된 적이 없다 — 3으로 간다).
      2. 미결마다 처리한다.
         - 구현이 규칙을 빠뜨렸거나 어겼다: 코드를 여기서 고치지 않는다. outcome
           `rework`로 보고한다(reason에 고칠 것). 착지 절차가 일감을 작업부터 다시
           돌리고, 고친 뒤 이 게이트가 다시 선다. rework 값은 data.sim에 그대로
           묶이므로 reason과 함께 지금 시뮬레이션의 sim_id·run_seq·assessment·
           findings·open·limits를 위 값(마지막 실행 결과)대로 싣는다 — 빠뜨리면
           다시 선 이 작업이 sim_id를 잃고 모델과 답한 질문을 버린 채 새로 만든다.
         - 원천이 정하지 않아 사용자가 정할 질문이다: 사용자가 시뮬레이션 페이지에서
           답할 때까지 이 작업을 보고하지 않고 기다린다(답이 오면 터미널에
           `[claunch simulation]` 줄이 온다). 기다리는 동안 이슈에 `BLOCKED:
           sim-gate (<sim_id>: 미결 <수>)`를 남기고, 해소되면 같은 세션이 지운다는
           코멘트를 남긴다.
         - 모델이 원천을 잘못 읽었다: `sim_patch`로 모델을 고친다.
      3. 다시 실행한다: `flow_call`로 sim-run(sim: ${data.sim.sim_id}, purpose: spec,
         question은 sim-check와 같은 질문, sources는 지금 코드를 포함). 시뮬레이션이
         없었으면 sim-check의 1과 같이 새로 부른다.
      4. `call_result`의 findings가 clear일 때만 ok로 보고한다. 이슈에 `SIMULATION @
         <sim_id> run <run_seq>: <assessment> (sim-gate)` 한 줄을 남긴다. clear가 아니면
         ok로 보고하지 않고 2로 돌아간다.
      시뮬레이션을 실행할 수 없으면(Settings에 모델이 없는 등) 사람의 설정이
      필요하다 — 이슈에 `BLOCKED: sim-gate (unavailable: <reason>)`을 남기고 기다린다.
      simulation을 off나 advisory로 바꾸는 것은 사람이다(런 입력 변경).
    done_when: |
      다시 실행한 시뮬레이션의 findings가 clear이고(ok), 아니면 구현을 다시 할
      이유가 reason에 있다(rework).
    returns:
      ok:
        sim_id: str
        run_seq: int
        assessment: str
        findings: str
        open: "dict?"
        limits: list
      # bind는 outcome과 무관하게 값을 대입한다(runtime._complete) — rework도
      # 같은 모양을 실어야 sim-gate가 다시 돌 때 data.sim.sim_id가 남는다.
      rework:
        reason: str
        sim_id: "str?"
        run_seq: "int?"
        assessment: str
        findings: str
        open: "dict?"
        limits: list
    effects: [sim.write, board.write]
  coding-plan:
    title: 코딩 승인 요청 준비
    prompt: |
      이번 일감의 구현 전에 사용자에게 제시할 변경 계획을 작성한다.
      이슈와 관련 코드는 읽을 수 있지만 아직 코드·테스트를 수정하거나
      구현을 자식에게 위임하지 않는다.
      현재 일감의 이슈 id, 목표, 변경할 파일과 접근 방법, 검증 방법,
      기대 효과와 리스크를 brief에 기록한다. 재작업이면 수정 사유와
      이번에 변경할 범위를 포함한다. 앞 계획이 거절됐으면(reject) 그 사유
      (`claunch cflow2 journal -t $CLAUNCH_SESSION`의 마지막 ask 답)를
      반영해 다시 쓰고, 무엇을 바꿨는지 brief 첫 줄에 적는다.

      ── 난이도 판정 (시작 입력 session_routing = ${data.inputs.session_routing}) ──
      session_routing이 true일 때만 판정한다(false면 아래 세 필드를 비운다).
      바꿀 파일과 접근 방법이 정해진 지금 이 일감의 난이도를 easy/hard로
      판정하고(difficulty), 누가 구현할지 권장한다(recommend: direct |
      delegate). 판정 근거(why)는 계획에서 읽은 사실로 쓴다:
      · hard 쪽 근거 — 바꿀 파일이 여러 모듈 경계를 넘는다, 워크플로 yaml·
        데몬·직렬화 포맷처럼 여러 테스트와 세션이 기대는 공용 규칙을
        바꾼다, 설계 판단이 아직 남아 있다, 이 세션의 대화에만 있는 맥락이
        구현 중 계속 필요하다.
      · easy 쪽 근거 — 바꿀 범위가 한두 파일에 갇혀 있다, 규격과 완료
        기준이 brief만으로 서 있다, 같은 형태의 선례가 저장소에 있다.
      easy면 delegate, hard면 direct를 권장한다. 둘이 갈리면 hard다 — 위임이
      실패해 돌아오는 비용(재작업 게이트 한 번과 자식 한 세션)이 직접
      구현하는 비용보다 크다. 위임을 권장하면 brief에 자식에게 넘길 작업
      단위(파일, 할 일, 완료 기준)를 한 단락으로 적는다 — 위임 자식이 그
      단락을 그대로 받는다.
    done_when: |
      사용자가 구현 착수 여부를 판단할 구체적인 계획과 근거가 brief에 있다.
      session_routing이 true면 difficulty·recommend·why도 있다.
    returns:
      ok: {brief: str, difficulty: "str?", recommend: "str?", why: "str?"}
    effects: [fs.read]

  coding-approval:
    title: 코딩 시작 전 사용자 승인
    ask:
      prompt: |
        시작 입력 require_coding_approval이 켜져 있어 구현 착수 전에
        사용자 승인이 필요하다. 아래 계획에 따라 코딩을 시작할지 결정한다.

        ${result['coding-plan'].value.brief}

        approve-once: 이번 일감만 승인한다. 위 범위의 구현과 검증을
        진행하고, 다음 일감에서는 다시 묻는다.
        approve-always: 이번 일감을 승인하고, 이 런의 이후 일감·회차에서는
        이 승인을 다시 묻지 않는다(변경 계획도 다시 쓰지 않는다).
        reject: 구현하지 않고 거절 사유를 반영해 변경 계획을 다시 쓴다
        (coding-plan으로 돌아간다). 이유를 함께 적는다.
        보류: 답하지 않으면 코드 변경 없이 이 단계에서 기다린다.
        변경으로 인한 리스크는 계획에 기재된 내용과 같다.
      otherwise: human
      # 사용자의 응답을 바로 기다리는 승인: 대시보드 알림 채널(코너 카드·알림
      # 기록·종의 대기 수)에 다른 승인 게이트와 같이 뜬다(claunch-x76l8.1).
      urgent: true
      # 승인 답이 둘이라 승인 형태가 아니라 결정 형태다(claunch-sxdnc).
      # `approve`는 질문의 내장 답이라 선택지 이름이 될 수 없다
      # (cflow2/question.RESERVED_NAMES). 두 승인은 결과 ok로 끝나 work로
      # 가고, item이 그 답을 $data.coding_approval에 묶는다 — approve-always면
      # coding-approval-check가 이후 일감에서 이 게이트를 세우지 않는다.
      # 거절은 계획을 다시 쓰라는 답이다(claunch-yl0to): item의 plan-loop가
      # 결과 rejected를 받아 coding-plan으로 돌아간다.
      options:
        approve-once: {outcome: ok, description: 이번 일감만 승인한다 — 다음 일감에서 다시 묻는다}
        approve-always: {outcome: ok, description: 이번 일감을 승인하고 이 런의 이후 일감에서는 묻지 않는다}
        reject: {outcome: rejected, description: 구현하지 않고 계획을 다시 쓴다}
    prompt: 사용자의 답을 기다린다. 이 작업은 ask가 답을 받으면 끝난다.
    effects: [fs.read]

  coding-approval-routing:
    title: 코딩 시작 전 사용자 승인 (직접 / 위임)
    # require_coding_approval과 session_routing이 둘 다 켜졌을 때의 승인
    # (claunch-yl0to). 답이 넷이라 승인 형태가 아니라 결정 형태(options)다.
    # `approve`는 질문의 내장 답이라 선택지 이름이 될 수 없다
    # (cflow2/question.RESERVED_NAMES) — 그래서 approve-as-planned다.
    ask:
      prompt: |
        시작 입력 require_coding_approval과 session_routing이 켜져 있다. 아래
        계획으로 코딩을 시작할지, 시작하면 누가 구현할지 결정한다.

        ${result['coding-plan'].value.brief}

        난이도: ${result['coding-plan'].value.difficulty} / 권장:
        ${result['coding-plan'].value.recommend}
        근거: ${result['coding-plan'].value.why}

        approve-as-planned: 계획의 권장(direct면 이 세션, delegate면 하위
        설정 자식)대로 구현한다.
        approve-no-delegate: 이 세션이 직접 구현한다.
        approve-down-delegate: 이 세션의 대화를 fork한 자식이 하위 profile·
        모델로 구현한다(이 브랜치에 직접 커밋, 리뷰·착지는 이 세션).
        approve-always: 계획의 권장대로 구현하고, 이 런의 이후 일감·회차에서는
        이 승인을 다시 묻지 않는다(이후 일감도 계획의 권장대로 간다).
        reject: 구현하지 않고 이유를 반영해 계획을 다시 쓴다.
        위의 세 승인은 이번 일감만의 승인이다 — 다음 일감에서 다시 묻는다.
        답하지 않으면 코드 변경 없이 이 단계에서 기다린다.
      otherwise: human
      urgent: true
      # approve-always는 coding-approval의 것과 같은 이름·뜻이다(claunch-sxdnc):
      # item이 답을 $data.coding_approval에 묶고, coding-approval-check가
      # 이후 일감에서 두 승인 게이트를 세우지 않는다.
      options:
        approve-as-planned: {description: 계획의 권장(직접 또는 위임)대로 구현한다 — 이번 일감만}
        approve-no-delegate: {description: 이 세션이 직접 구현한다 — 이번 일감만}
        approve-down-delegate: {description: 하위 설정 자식에게 fork 위임한다 — 이번 일감만}
        approve-always: {description: 계획의 권장대로 구현하고 이 런의 이후 일감에서는 묻지 않는다}
        reject: {description: 구현하지 않고 계획을 다시 쓴다}
    prompt: 사용자의 답을 기다린다. 이 작업은 ask가 답을 받으면 끝난다.
    effects: [fs.read]

  route-planned:
    title: 구현 주체 확정 (계획의 권장)
    prompt: |
      이번 일감을 누가 구현할지 coding-plan의 권장으로 정한다: recommend =
      「${result['coding-plan'].value.recommend}」, difficulty =
      「${result['coding-plan'].value.difficulty}」. recommend가 delegate면
      route-delegate의 지시대로, 그 밖(direct, 비어 있음)이면 route-direct의
      지시대로 하고 그 값을 보고한다. 권장이 비어 있으면 direct다.
    done_when: |
      이슈에 `ROUTED:` 코멘트가 있고 mode가 보고에 있다.
    returns:
      ok: {mode: str, profile: "str?", model: "str?", difficulty: "str?"}
    effects: [fs.read, board.write]

  route-direct:
    title: 구현 주체 확정 (이 세션)
    prompt: |
      이번 일감은 이 세션이 직접 구현한다. 회차 이슈(${data.claim.issue})에
      한 줄을 남긴다: `claunch beads comments add <이슈 id> "ROUTED:
      <difficulty 또는 -> → direct — <근거: 계획의 권장 / 사용자의 답 /
      위임 재작업 게이트의 rework-direct>"`. mode는 direct다.
    done_when: |
      이슈에 `ROUTED: … → direct` 코멘트가 있다.
    returns:
      ok: {mode: str, profile: "str?", model: "str?", difficulty: "str?"}
    effects: [board.write]

  route-delegate:
    title: 구현 주체 확정 (하위 설정 자식)
    prompt: |
      이번 일감은 이 세션의 대화를 fork한 자식이 하위 설정으로 구현한다.
      자식의 profile과 model을 이 순서로 정한다 — 앞이 비었을 때만 뒤로 간다:
      1. 시작 입력: delegate_profile 「${data.inputs.delegate_profile}」,
         delegate_model 「${data.inputs.delegate_model}」
      2. 데몬 설정(웹 Settings의 위임 카드): `claunch daemon config
         delegate_profile`, `claunch daemon config delegate_model` — 값이
         없으면 내장 기본값(ds4 / small)이 출력된다. 명령이 `unknown daemon
         setting`으로 거절되면(설치본이 이 키를 모르는 버전) 내장 기본값을
         쓰고 그 사실을 보고에 적는다.
      model이 preset 이름(default, small, large, xlarge, subagent)이면 그대로
      둔다 — spawn이 자식 profile의 그 자리 모델로 바꾼다(harness마다 다르다:
      claude는 profile이 선언한 그 role의 모델 id, 없으면 그 자리의 별칭
      haiku·opus·fable; codex는 profile이 선언한 모델 id만 — 선언이 없으면
      spawn이 거절한다).
      회차 이슈(${data.claim.issue})에 한 줄을 남긴다: `claunch beads
      comments add <이슈 id> "ROUTED: <difficulty 또는 -> → <profile>:<model>
      — <근거>"`. mode는 delegate다.
    done_when: |
      이슈에 `ROUTED: … → <profile>:<model>` 코멘트가 있고 profile·model이 보고에 있다.
    returns:
      ok: {mode: str, profile: str, model: str, difficulty: "str?"}
    effects: [fs.read, board.write]

  delegate-work:
    title: 위임 구현 (fork한 하위 설정 자식)
    prompt: |
      이번 일감의 구현을 이 세션의 대화를 fork한 자식에게 맡긴다
      (lower-profile-delegation, claunch-yl0to). 자식 설정: profile
      「${data.route.profile}」, model 「${data.route.model}」.

      1. spawn — MCP `spawn`(또는 `claunch spawn`)에 `fork: true`,
         `profile: <위 profile>`, `model: <위 model>`, `role: worker`,
         `workflow: oneshot-job-v2`, `issue: ${data.claim.issue}`를 준다.
         `worktree`·`cwd`·`workspace`는 주지 않는다 — fork한 대화는 이
         디렉터리에서만 열리므로 자식은 이 워크트리의 이 브랜치
         (${result['branch-setup'].value.branch})에서 일한다. 거절되면
         (spawn.allow_profile·allow_args, profile 이름 오류, 대화 기록 없음)
         다시 시도하지 않고 결과를 failed로 낸다 — 거절 문구가 reason이다.
      2. task에 적을 것:
         · 너는 부모의 대화를 이어받은 위임 자식이다. 부모의 런(scope
           `$CLAUNCH_SESSION@main` 등)을 flow_* 도구로 움직이지 않는다 — 네
           런은 oneshot-job-v2 하나다.
         · 할 일: coding-plan brief의 위임 단락(아래)을 구현하고, 바꾼 영역의
           표적 테스트를 돌리고, 이 브랜치에 커밋한다. 새 브랜치를 만들지
           않고, rebase·push·머지·이슈 상태 변경을 하지 않는다.
         · 멈출 때(escalate): 예상보다 어렵다, 계획 밖의 파일을 고쳐야 한다,
           설계 판단이 필요하다, 표적 테스트를 초록으로 만들지 못한다 — 그
           자리에서 멈추고 보고한다.
         · 보고: 부모에게 mesh 한 통. 완료면 `DELEGATE DONE: <커밋 해시들>
           — <바꾼 파일> — <표적 테스트 수치>`, 멈췄으면 `DELEGATE ESCALATE:
           <사유> — 지금까지의 커밋 <해시들 또는 없음> — 남은 일 <…>`. 보고 뒤
           oneshot-job-v2의 finish에서 done을 골라 세션을 끝낸다.
         · 위임 단락: ${result['coding-plan'].value.brief}
      3. 기다리는 동안 이 워크트리의 파일을 고치지 않는다 — 한 작업 트리에
         기록자가 둘이 된다. 턴을 끝내고 자식의 보고를 기다린다(mesh가 이
         세션을 깨운다). spawn이 승인 대기(spawn-pending)로 돌아오면 그 규칙을
         따른다.
      4. 보고를 받으면 `git log --oneline ${result['branch-setup'].value.base_hash}..HEAD`
         로 자식의 커밋이 이 브랜치에 있는지 확인하고, 이슈에 `DELEGATED
         WORK: <자식> @ <tip> — <DONE|ESCALATE>` 코멘트를 남긴다.
      결과: 완료면 ok(work와 같은 보고 형태에 child·commits), 자식이 멈췄으면
      escalated, spawn이 거절됐거나 자식이 보고 없이 종료됐으면 failed.
    done_when: |
      자식의 보고(DELEGATE DONE/ESCALATE) 또는 spawn 거절 문구가 보고에 있고,
      ok면 자식의 커밋이 이 브랜치에 있다(git log 출력).
    returns:
      ok: {files: list, summary: str, tried: list, found: "list?", delegated: "list?",
           child: str, commits: list}
      escalated: {reason: str, child: "str?", commits: list, remaining: str}
      failed: {reason: str, child: "str?"}
    effects: [fs.read, board.write, session.spawn, mesh.send]

  delegated-rework-approval:
    title: 위임 작업의 재진행 승인
    # 입력 변수 없이 항상 사람의 게이트다(claunch-yl0to): 위임 자식이 멈췄거나
    # 실패했을 때, 위임 작업에 부모의 표적 테스트가 실패했을 때, 리뷰·착지
    # 심사가 위임 작업에 rework를 요구했을 때 열린다.
    ask:
      prompt: |
        이번 일감은 하위 설정 자식에게 위임해 구현했다(profile
        「${data.route.profile}」, model 「${data.route.model}」). 그 결과를 다시
        진행해야 한다. 무엇이 이 질문을 열었는지:
        · 위임 결과: ${result['delegate-work'].outcome} —
          ${result['delegate-work'].value}
        · 부모의 표적 테스트 실패: ${result['targeted-test'].value.failed}건
        · 리뷰·착지 심사의 rework 사유: ${data.land_out.reason}
        (값이 `${...}` 그대로 보이면 그 경로는 이번 원인이 아니다.)

        rework-direct: 이 세션이 직접 이어서 고친다.
        rework-delegate: 같은 하위 설정으로 다시 위임한다(위 사유를 자식에게
        넘긴다).
        reject: 이 계획을 버리고 사유를 반영해 변경 계획부터 다시 쓴다.
      otherwise: human
      urgent: true
      options:
        rework-direct: {description: 이 세션이 직접 이어서 고친다}
        rework-delegate: {description: 같은 하위 설정으로 다시 위임한다}
        reject: {description: 변경 계획부터 다시 쓴다}
    prompt: 사용자의 답을 기다린다. 이 작업은 ask가 답을 받으면 끝난다.
    effects: [fs.read]

  work:
    title: 작업 실행
    prompt: |
      피처 브랜치에서 목표를 구현한다. 커밋은 작고 초점 있게 만든다.

      시작 입력 simulation이 off가 아니면(지금 ${data.inputs.simulation}) 코딩 전
      시뮬레이션 결과가 ${data.sim}에 있다. 찾은 gap 가운데 구현으로 메울 수 있는
      것은 이 작업에서 다룬다. required면 착지 전에 같은 시뮬레이션을 다시 돌려
      미결이 0이어야 한다(sim-gate).

      작업 중
      정본 규칙과 어긋나는 선택지가 나타나면 혼자 정하지 말고 리더에게
      물어 단일 규칙으로 기록되게 한다.

      ── 발견은 그룹 `found`로 처리한다 ──
      범위 밖 발견의 절차(범위 판정 → 이슈 등록 → 위임 판정)는 `found-issue`
      프로시저다. 발견마다 `flow_fork`에 `group: found`와 `with: {parent: <이
      회차 이슈 id>, summary: <한 줄 요지>}`를 주어 멤버 하나를 세우고, 그
      멤버의 작업과 선택을 진행한다. 발견마다 멤버 하나이고 한 세션에 동시에
      셋까지다. 세운 멤버가 전부 끝나야 이 작업이 끝난다 — 직접 폴링하지
      않는다. 판정·이슈 id·자식 세션은 멤버의 결과에 남고, 아래 보고에는 그
      id들만 옮겨 적는다 — wrapup의 생성 이슈 정산이 그 판정을 읽는다.
      (stack side 런은 세션 수명이라 이 그룹에 들지 않는다.)

      ── 작업 병렬 fork: 그룹 `slices` (지금 parallel_fork=${data.inputs.parallel_fork}) ──
      parallel_fork가 true일 때만 이 절이 적용된다. false면 그룹 `slices`는
      멤버를 받지 않으므로(`can_fork: false`) 아래를 건너뛰고 혼자 구현한다.
      true면 구현에 들어가기 전에 일감을 조각으로 나눌 수 있는지 먼저 본다.
      조각은 서로 겹치지 않는 파일 집합(소유 경로)을 가진 독립 작업이다 —
      같은 파일을 두 조각이 고쳐야 하거나 앞 조각의 결과가 있어야 시작할 수
      있는 일은 한 조각이다. 나눌 것이 없으면 혼자 구현한다(조각 0개).
      나누면 조각마다 `flow_fork`에 `group: slices`와 `with: {goal: <조각의
      목표 한두 문장>, paths: [<소유 경로>...], tests: <그 조각의 표적 테스트
      파일, 없으면 "">}`를 준다. 한 회차에 다섯 조각까지다(group limit 5).
      fork는 이 세션의 대화를 복사한 quick-fork이고 이 체크아웃에서 동시에
      돈다 — 엔진이 조각마다 그 세션을 세우고, 세울 수 없으면(auto-compact까지
      100k 토큰 미만, 스폰 정책 거절) 그 조각의 task가 이 런에 돌아온다: 그때는
      그 조각을 직접 한다. 이 세션은 남은 부분(어느 조각에도 주지 않은 파일)만
      고친다. **조각을 하나라도 세웠으면 이 작업에서 커밋하지 않는다** — fork가
      같은 index를 쓰는 동안 커밋하면 남의 staged 변경이 섞이고, 커밋은 모든
      조각이 돌아온 뒤 slice-merge가 한 번에 한다. 조각을 세우지 않았으면
      지금처럼 이 작업에서 커밋한다. 보고의 summary에 조각 목록(goal·paths)을
      적는다.

      ── 발견 즉시 가르는 것 하나: 위임(child) ──
      만든 이슈가 다음 넷을 전부 만족하면 지금 자식 세션에 넘긴다 — spawn
      `--issue <id>`(데몬이 자식을 assignee로 쓴다; 스폰은 공통 규칙이
      허용하는 배정 경로다): (1) 이 회차 브랜치와 파일·영역이 겹치지
      않는다, (2) 규격이 지금 서 있다, (3) 이 세션의 컨텍스트가 필요 없다,
      (4) 부모 회차의 착지 전에 끝나는 크기다 — 그리고 `children`이 남은
      슬롯을 답한다. 넷 중 하나라도 아니면 여기서 넘기지 않는다: wrapup의
      생성 이슈 정산이 self/spawn/pool로 가른다. 위임을 일찍 정하는 이유는
      병렬 시간이고, 직접 처리를 늦게 정하는 이유는 그것이 다음 회차의
      일이기 때문이다.

      ── 자식의 관계: stacked / independent (claunch-yq80p.9) ──
      자식 워커를 spawn할 때 관계를 정해 그 자식 런의 시작 입력으로 준다:
      spawn의 `workflow: improv-worker-v2`, `cflow_inputs: {relation: <관계>}`
      (생략하면 stacked). 판단 기준은 하나다 — **자식이 아직 master에 없는
      코드(내 회차 브랜치나 스택 브랜치에만 있는 것)를 필요로 하면 stacked, 아니면
      independent.** 「같은 기능의 일부」나 「내가 리뷰하고 싶다」는 기준이 아니다:
      independent 자식도 상태는 내가 본다.
      · stacked: 기준 = 내 스택 브랜치, 착지 = 내 stack 런이 스택 브랜치에
        머지하고 내 착지에 실린다(PR이면 base = 원격의 스택 브랜치). 보드는 자식
        이슈를 내 회차 이슈의 자식으로 만들고(`--parent <회차 이슈>`) 내 회차
        이슈가 그 자식 이슈에 막힌다(`claunch beads dep add <회차 이슈> <자식
        이슈>`, blocks).
      · independent: 기준 = master, 착지 = 그 자식이 리더 착지 큐에 직접
        요청한다(엔진의 `leader:landing` push). 내 착지와 무관하게 먼저 또는
        나중에 착지한다. 보드는 `--parent` 없이 만들고 related로 잇는다
        (`claunch beads dep add <자식 이슈> <회차 이슈> -t related`). 내 일은
        상태 관제다(멈춤·실패·완료를 `claunch cflow2 status -t <자식> --json`으로
        확인) — 리뷰·rebase 통지·컷은 없다.
      고른 관계와 근거(어떤 미착지 코드가 필요한가, 또는 필요 없음)를 자식 이슈에
      `RELATION: <관계> — <근거>` 코멘트로 남긴다. 판단이 갈리면(필요한 코드가
      곧 착지할 예정 등) 상위에 묻는다.

      ── 자식을 두면: stack side 런 ──
      stack side 런은 stacked 자식이 있을 때만 필요하다 — independent 자식만
      두면 세우지 않는다.
      자식(하위 워커)의 브랜치는 내 회차 브랜치에 직접 모으지 않고, 세션
      수명의 스택 브랜치 `<내 세션>-stack`에 모은다. 그 관제는 이 정의가
      `sides:`로 선언한 side 런 `stack`(정의 stack-v2)이 맡는다. **첫 stacked 자식을
      spawn하거나 넘겨받을 때(reparent — mesh-delegate) 한 번** 세운다:
      `flow_start`에 `side: stack`, `inputs: {issue: <이 회차 이슈 id>, base:
      <내 회차 브랜치의 지금 tip(전체 SHA)>, remote: <원격>, repo: <저장소>}`.
      remote·repo는 이 회차의 착지 매체가 pr일 때 그 값(지금 medium=${data.landing.medium},
      remote=${data.landing.remote}, repo=${data.landing.repo})이고, local이면
      뺀다 — 그러면 스택은 로컬에만 있고 자식은 로컬 착지다. remote가 있으면
      stack 런이 `<내 세션>-stack`을 원격에 두고, 자식 PR의 base가 그 원격
      브랜치다(stacked PR). 이미 서 있으면(flow_status의
      `sides.stack.live`가 true) 다시 세우지 않는다. 그 런은 세션이 끝날
      때까지 돌고, 세션이 끝나면 데몬이 중단한다. 착지 절차는 그 런이 살아
      있는지(`side('stack').live`)를 엔진이 직접 보고 컷을 요청하고 받는다 —
      보고에 따로 실을 값은 없다. 자식 spawn의 세부(기준 브랜치, task의 세 줄,
      rebase_onto, 넘겨받은 자식의 재정렬)는 stack 런의 open이 적고, 자식의
      요청 심사·착지는 그 런의 standby·land가 한다 — 그 런의 flow_* 호출에는
      `side: stack`을 준다. 두 런이 만나는 자리는 신호 log다: 이 런의
      stack-cut이 컷을 요청하고(signals에 cut-wanted), cut-wait가 stack 런의 컷
      (side:stack:signals의 cut)을 기다려 stack-merge가 스택 브랜치를 --no-ff로
      한 번 머지하며, integration-request와 착지 확인이 제출(frozen)과
      착지(landed)를 알린다. 신호는 엔진이 쓴다 — 손으로 쓰지 않는다.
      자식의 태스크에 반드시 적는 세 줄: **기준 브랜치 = `<내 세션>-stack`
      @ <tip>, 통합 대상 = 그 브랜치(master도 내 회차 브랜치도 아님),
      완료 보고·착지 요청 수신자 = 나**. 스폰은 `worktree: <내 세션>-
      <요지>`와 `rebase_onto: <내 세션>-stack`으로 스택 위에 자른다.
      이 회차의 목표가 자식 스택뿐이면(위임 전용 회차 — mesh-delegate로 선
      워커의 첫 회차) 기능 커밋 0건이 정상이다: 스택을 세우고 자식을
      넘겨받은 것이 이 회차의 작업이고, 착지분은 stack-merge의 컷 머지다.
      보고에는 바꾼 파일과 접근 방식 요지, 발견 이슈 id, 위임한 자식
      (세션·이슈 id), stack side 런을 세웠으면 그 사실을 남긴다.
    done_when: |
      intake에서 정한 범위의 구현이 피처 브랜치 커밋으로 존재하고(위임
      전용 회차면 커밋 대신 stack side 런과 넘겨받은 자식 목록이다)(범위 밖
      파일은 건드리지 않았다), 바꾼 파일 목록과 접근 방식 요지, 범위 밖
      발견이 있었다면 그 이슈 id, 위임한 자식이 있으면 그 세션·이슈 id(승인
      대기가 길어지면 `pending <요청 id>`, spawn-pending)가 보고에 있다.
    rules: [spawn-pending]
    # v1 work 스텝의 triggers: [briefing]. 들어가는 순간 데몬이 드라이버
    # 세션의 LLM 브리핑을 다시 구성한다(docs/cflow-v2.md 2.8).
    triggers: [briefing]
    returns:
      ok: {files: list, summary: str, tried: list, found: "list?", delegated: "list?",
           stack_open: "bool?"}
    effects: [fs.write, git.commit, board.write, session.spawn, mesh.send]

  slice-merge:
    title: 병렬 조각 모으기
    prompt: |
      work가 세운 조각(그룹 `slices`)이 전부 돌아왔다. 조각마다 with(goal·paths·
      tests)와 결과(outcome, value의 files·summary·tests): ${result.slices.value.members} 조각이 없었으면(members가
      비었다) 할 일은 work의 보고를 그대로 옮기는 것뿐이다 — 커밋도 확인도
      하지 않는다.

      조각이 있었으면 이 체크아웃의 변경 전부가 아직 커밋되지 않은 상태다.
      1. 경계 검사: `git status --porcelain`의 경로 각각이 어느 조각의 paths
         또는 work가 직접 고친 파일에 드는지 대조한다. 어느 쪽에도 들지 않는
         경로, 두 조각에 걸친 경로가 있으면 그 diff를 읽고 이 회차의 범위
         안인지 판정한다 — 범위 밖이면 되돌리지 말고 그 조각을 맡았던
         fork의 요약과 함께 이슈 코멘트에 남긴 뒤 사용자·상위에 묻는다.
      2. 실패한 조각(outcome이 ok가 아닌 것): 그 조각의 paths에 남은 변경을
         읽고 직접 마무리하거나, 마무리할 수 없으면 그 사유를 보고에 적는다.
      3. 검토: 조각마다 `git diff -- <paths>`를 읽고 그 조각의 목표와 맞는지,
         조각 사이의 인터페이스(함수 이름·인자·데이터 형태)가 서로 맞는지 본다.
         어긋나면 여기서 고친다.
      4. 커밋: 조각 단위로 커밋한다 — `git add -- <그 조각의 paths>` 뒤
         `git commit`(메시지에 조각의 목표). work가 직접 고친 부분도 따로
         커밋한다. 이 시점에는 fork가 모두 끝났으므로 index를 쓰는 것은 이
         세션뿐이다.
      보고의 files는 work의 files와 조각들의 files를 합친 목록, summary는 조각별
      한 줄 요지와 커밋 해시, tried는 위 1~3에서 고치거나 되돌린 것이다. found·
      delegated·stack_open은 work의 보고에서 옮긴다.
    done_when: |
      조각이 없었으면 work의 보고가 옮겨져 있다. 조각이 있었으면 `git status
      --porcelain`이 비었고(이 회차 범위의 변경이 전부 커밋됐다), 조각별 커밋
      해시와 경계 검사 결과가 보고에 있다.
    returns:
      ok: {files: list, summary: str, tried: list, found: "list?", delegated: "list?",
           stack_open: "bool?"}
    effects: [fs.write, git.commit, board.write]

  test-skipped:
    title: 표적 테스트 생략 기록
    prompt: |
      표적 테스트를 생략한 선택과 reason을 보고에 그대로 기록한다. 테스트
      결과를 실행한 것처럼 작성하지 않으며, 생략으로 남는 검증 범위를
      명시한다.

      ── 생략 마커: 뒤 단계가 읽는 자리 ──
      이 일감의 이슈에 코멘트 하나를 남긴다:
      `claunch beads comments add <id> "TESTS SKIPPED @ <HEAD 해시>: <사유
      한 줄> — files: <바뀐 파일 목록>"`. 이 코멘트가 이 생략의 정본
      기록이다. 착지 결정(landing), 정렬(rebase), 동료 리뷰, 통합 요청은 이
      마커가 있으면 표적 수치를 요구하지 않고, 재측정 대신 이 판정이 아직
      맞는지만 다시 본다(마커 해시 이후에 바뀐 파일이 셀프 게이트 셋을 여전히
      만족하는가). 마커를 남긴 뒤 같은 일감에 동작을 바꾸는 커밋을 더 얹었으면
      그 마커는 낡은 것이다 — 이 단계로 돌아오지 말고 착지 결정이 escalate로
      처리한다.
      보고의 수치 칸은 비우지 않고 `tests: skipped (TESTS SKIPPED @ <해시>)`로
      적는다. 「0/0 green」처럼 실행한 것으로 읽히는 값을 쓰지 않는다.
    done_when: |
      표적 테스트 생략 선택의 reason, 생략 대상, 남은 검증 범위가 보고에
      기록되어 있고, 이슈에 `TESTS SKIPPED @ <해시>:` 코멘트가 있다.
    returns:
      ok: {reason: "str?", files: "list?", uncovered: "str?", marker: "str?"}
    effects: [fs.read, board.write]

  review:
    title: 테스트 (표적) — 작성과 선택
    prompt: |
      바꾼 영역을 덮는 유닛테스트를 추가·확장하고, **바꾼 영역의 테스트만**
      돌린다. 스위트 명령은 저장소마다 다르므로 정본은 명령을 박지
      않는다 — 저장소별 명령은 호출하는 쪽이 `verify` 파라미터로 넘기고
      (지금 값: `${params.verify}`), 없으면 보고의 수치와 저널이 판정
      근거다. 보고에는 커버한 시나리오를 남기고 **무엇을 골라 돌릴지(모듈
      목록)**를 명시한다. 실제 화면·CLI 동작 확인이 의미 있는 변경이면 그
      증거(방법과 결과)도 함께 남긴다.
      실행과 수치는 별도 컨텍스트의 측정 작업(targeted-test)이 맡는다 — 이
      작업은 테스트를 쓰고, 돌릴 모듈을 고르고, 아래 두 판정(전체 스위트
      요청, 관련 표면)을 낸다. 앞 측정이 실패를 냈으면(실패
      ${result['targeted-test'].value.failed}건 중 새 실패
      ${result['targeted-test'].value.new_failed}건, 영수증
      `${result['targeted-test'].value.receipt}`) 새 실패부터 고친다. 기준
      커밋에서도 실패하는 기존 실패(영수증의 `preexisting`, 지금
      ${result['targeted-test'].value.preexisting})는 이 회차가 고칠 대상이
      아니다 — targeted-test가 그것을 보고와 보드에 남기고, 루프는 새 실패
      수로 끝난다(claunch-wuaup).


      ★ **전체 스위트는 워커가 어떤 경로로도 돌리지 않는다.** 표적
      실행만이 이 스텝의 몫이고, 전체 스윕(build+typecheck+전체 스위트)은
      머지 뒤에 리더의 지속 큐가 머지 5건 단위 배치로, 격리된 스냅샷
      워크트리에서 단위 테스트보다 낮은 우선순위(-1)로 돌린다. 이 스텝의
      표적 단위 테스트가 리더가 머지를 결정하는 유일한 테스트 관문이다. 이 금지는 손으로 치는 명령만이 아니라 **이 스텝의 verify
      필드에도 적용된다** — 아래 「무엇을 검증했는가」가 못박듯 verify는
      그 스텝을 떠날 때 엔진이 돌리는 스윕이고, 손으로 치지 않으므로
      가장 안 보이는 스윕이다. 오버라이드를 쓰는 저장소는 그 자리에
      전체 스위트가 아니라 표적 선택 명령을 담는다.

      왜 표적인가 — 두 가지가 실측으로 확인됐다:
      · **시간**: 전체 스위트는 회차를 막는다. 이 저장소 기준 -n 8로 178초,
        직렬 532초다.
      · **오염**: 워커가 도는 전체 스위트는 판정이 아니라 잡음이 된다.
        세션 여섯이 각자 -n 8로 같은 스텝을 떠나면 48 프로세스가 서로의
        측정을 흔들고, 저널에는 스윕이 돌았다는 사실조차 안 남는다.
        게다가 깨끗한 브랜치의 워커는 남의 미커밋 파일을 함께 수집한
        공유 체크아웃보다 **항상 몇 건 적게 나오고, 그것을 자기가 깼다고
        읽는다** — 실제로 오염된 1562와 깨끗한 1559가 둘 다 "정본
        대조군"으로 돌아다녔다. 표적 실행은 이 축을 아예 만들지 않는다.

      선택이 비면 그것은 통과다 — 산문·워크플로 yaml·문서만 바꾼 회차가
      실제로 있다(그런 회차를 빨갛게 만들면 게이트를 통과하려고 테스트를
      꾸미게 된다). 빈 선택 뒤에 서는 것은 이 스텝의 done_when이다:
      보고에 수치와 시나리오를 요구하는 쪽이 그 자리를 받친다.

      ★★ **표적 게이트가 초록인 것은 트리가 초록이라는 뜻이 아니다.**
      좁힌 선택은 좁힌 만큼 못 본다 — 이것은 이 방식의 부작용이 아니라
      정의다. 선택은 「바뀐 파일 → 그것을 검사하는 테스트」 매핑으로
      만들어지는데, 그 매핑이 완전하다고 보증하는 것은 아무것도 없다.
      **이 규칙을 도입한 회차 자신이 그 자리에서 회귀를 통과시켰다**:
      리더 sweep verify를 pin하던 테스트 하나가 매핑에 없어 게이트가
      초록이었고, 나중에 돈 전체 스위트가 그 빨강을 찾았다.
      그래서 다음 셋 중 하나라도 해당하면 **표적 초록을 완료로 읽지 말고
      전체 스위트를 요청한다** — 요청하는 자리는 하나다: 그 이슈에
      `SWEEP REQUESTED: <셋 중 어느 것인가>` 코멘트를 남기고, 착지 요청
      묶음에도 그 사실을 한 줄로 적는다:
      · 워크플로·설정·스키마처럼 **여러 테스트가 이름으로 참조하는 파일**을
        바꿨다 — 매핑이 놓칠 수 있는 자리가 정확히 여기다
      · 공용 함수·시그니처·직렬화 포맷을 바꿨다(호출자가 어디 있는지
        선택이 모른다)
      · 고른 모듈 수가 **바꾼 파일 수에 비해 이상하게 적다** — 그것은
        「영향이 적다」가 아니라 「매핑이 비어 있다」의 신호일 수 있다.
        의심되면 `grep -rl "<바꾼 파일 이름>" tests/`로 직접 대조한다.
      전체 스위트를 도는 것 자체는 여전히 워커의 몫이 아니다 — 요청하는
      것이 워커의 몫이고, 도는 것은 리더가 배치로, subagent 안에서 한다.
      **리더에게 지금 스윕을 돌려 달라고 청하지 않는다.** 스윕 하나가
      요청 하나에 붙으면 그것이 브랜치당 스윕이고, 5분 통합 창이 막으려던
      비용이 그대로 돌아온다 — 창의 뜻은 그 안에 들어온 요청 전부가 스윕
      하나를 함께 쓴다는 것이다. 코멘트는 창을 앞당기지 않고, 이 브랜치가
      실릴 배치의 스윕이 그 요청의 답이다(리더의 close 사유에 그 수치가
      적힌다). 표적 초록만으로 착지 요청을 올리는 것은 막히지 않는다 —
      막히는 것은 「내 브랜치만을 위한 전체 스위트」다.

      ── 관련 표면: 테스트가 못 보는 거울을 사람이 본다 ──
      표적 선택은 「바뀐 파일 → 그것을 검사하는 테스트」만 잇는다. 그
      바깥에 테스트가 원리상 못 보는 것이 하나 있다: **같은 계약을 손으로
      거울처럼 베껴 둔 다른 파일**이다. 이 저장소의 spawn/new-session
      페이로드는 CLI 플래그·위저드 둘·웹 모달 두 모드·MCP 툴·API 라우트
      둘이 각자 쓰고, 「워크플로 없음」의 `"-"` 상수는 네 자리에 있다.
      한 사본만 고친 회차는 초록으로 착지한다 — 사본마다 자기 테스트는
      통과하고, 사본끼리 같은지를 묻는 테스트는 없다. 실측: 웹 모달의
      spawn 모드가 빈 workflow 행에 `"-"`를 안 보내는 불일치가 기존
      테스트 전부를 통과한 채 살아 있었다(claunch-3uef ASSESSMENT 1.2,
      claunch-ozpf). 같은 모양의 거울 누락이 세 번 더 있었고 각각 커밋
      두세 개를 더 써서 맞췄다.
      그래서 이 스텝은 수치 옆에 문장 하나를 더 요구한다. 저장소에 관련
      표면 도출 도구가 있으면 그것을 돌린다 — 이 저장소는
      `uv run --no-sync python tools/related_surfaces.py --base auto`
      (git 공변경 이력 · 명시 거울 표 · 그 파일을 이름으로 부르는
      테스트, 세 출처를 합쳐 파일마다 왜 올라왔는지를 적어 준다; 마지막
      줄이 `related surfaces: N to check, M touched by this diff, T naming
      tests (the gate runs them)`이고, 그 N이 아래 문장의 N이다.
      이름으로 부르는 테스트는 표적 게이트의 실제 선택
      (`tools/changed_tests.py --list`)과 대조해 두 갈래로 적힌다: 선택에
      든 것은 `gate     <경로>  [test]  for <파일>` 줄로 나와 T에만 세고
      N에는 넣지 않는다 — 게이트가 그 모듈을 돌린다. 그 테스트가 이번
      diff에서 바뀐 파일이기도 하면 줄 머리만 `touched`로 바뀌고 셈은
      같다(T). 선택에 들지 않은 것은
      `CHECK    <경로>  [test:unselected]  for <파일>` 줄로 나와 N에
      든다 — 예: 바뀐 파일이 테스트 모듈이면 게이트는 그 모듈만
      돌리므로, 그 모듈의 노드 id를 문자열로 가진 다른 테스트는 게이트
      밖에 있다(claunch-wt12o.1.2)).
      보고에는 **「관련 표면 N개 중 M개 점검, 나머지는 <사유>」** 한 줄을
      적는다 — 점검했다는 것은 그 파일을 열어 이번 변경이 거기에도
      들어가야 하는지를 봤다는 뜻이고, 안 봤으면 안 봤다고 적는다. 표면
      전부를 고치라는 요구가 아니다(거울이 아닌 공변경 이웃이 섞여
      있다) — 요구는 어느 것을 보고 어느 것을 안 봤는지가 보고에 있는
      것이고, 그 문장이 없으면 다음 사람은 거울이 있었다는 사실조차
      모른 채 심사한다. 도구가 없는 저장소는 바꾼 파일과 같은 계약을
      베낀 파일을 손으로 적는다(없으면 「관련 표면 없음」).
    done_when: |
      바꾼 영역을 덮는 신규·확장 테스트가 존재하고, 골라 돌릴 **모듈 목록**이
      정해졌으며, 관련 표면 문장이 있다 — 「관련 표면 N개 중 M개 점검, 나머지는
      <사유>」(도구가 있는 저장소는 그 출력의 마지막 줄이 N의 출처다; 표면이
      없으면 「관련 표면 없음」). 전체 스위트를 요청할 사유가 있으면
      `SWEEP REQUESTED:` 코멘트가 남았다.
    returns:
      ok: {modules: list, surfaces: str, tried: list, sweep_requested: "str?"}
    effects: [fs.write, board.write]

  targeted-test:
    title: 테스트 (표적) — 실행과 수치
    prompt: |
      바꾼 영역의 테스트만 돌리고 수치를 보고한다. 전체 스위트는 어떤 경로로도
      돌리지 않는다.
      돌릴 모듈: ${result.review.value.modules}
      저장소의 표적 명령: `${params.verify}` — 비어 있으면 저장소의 표적 선택
      도구를 쓴다(이 저장소는 `uv run --no-sync python tools/changed_tests.py`).

      ── 기존 실패와 새 실패 (claunch-wuaup) ──
      실패에는 출처가 둘이다: 이 변경이 만든 실패(새 실패)와, 기준 커밋
      (branch-setup의 base_hash, 이 브랜치의 merge-base)에서도 이미 실패하는
      테스트(기존 실패). tests 루프는 **새 실패 수**로 끝난다 — 기존 실패를
      고치려고 회차가 돌지 않게 하기 위해서다. 실측: master `2ba6082a`에서도
      실패하는 Windows 전용 21건(claunch-mli4r)이 선택에 들어오자 루프가
      끝나지 않았고, 사람이 QA로 「세 모듈 제외 후 재측정」을 정해야 했으며,
      그 제외 실행은 손으로 친 pytest라 영수증을 남기지 않았다.
      · 이 저장소의 표적 도구는 실행이 빨강이면 같은 선택을 merge-base의 임시
        워크트리에서 한 번 더 돌려 실패 node id를 비교한다. 기준에서도 실패한
        것은 영수증의 `preexisting`, 나머지는 `new_failures`이고 `base_commit`·
        `base_seconds`·`base_cached`가 함께 남는다. 새 실패가 0이면 종료
        코드는 0이다(영수증의 `exit_code`는 pytest가 낸 값 그대로 1이다).
        기준 실행은 같은 창 부여 안에서 돌아 대기 시간을 더하지 않고, 같은
        기준·선택의 두 번째부터는 캐시를 읽는다. 끄려면 `--no-compare-base`.
      · 그 비교가 없는 저장소(다른 표적 명령)에서는 실패한 node id만
        `git worktree add --detach <임시 경로> <base_hash>`에서 같은 명령으로
        돌려 직접 가르고, 무엇을 돌렸는지 보고에 적는다. 임시 경로는
        `$CLAUNCH_SCRATCH` 아래에 둔다.
      · 일부러 빼야 하는 테스트는 손으로 pytest를 치지 않고 도구에
        `--deselect <nodeid>`(반복 가능) 또는 `--known-failures <파일>`(줄마다
        node id, `#` 주석)로 준다 — 제외 내역이 영수증의 `deselected`·
        `known_failures`와 영수증 키에 남는다.
      · 보고: `failed`는 전체 실패 수, `new_failed`는 새 실패 수,
        `preexisting`은 기존 실패 node id 목록이다. 비교를 하지 못했으면
        `new_failed`를 비우지 말고 `failed`와 같은 값으로 적는다(가르지 못한
        실패는 새 실패로 센다).
      · 기존 실패가 있으면 이 회차 이슈에 `PREEXISTING FAILURES @ <base_commit>:
        <건수>` 코멘트와 node id 목록(영수증 경로 포함)을 남긴다. 그 실패를
        추적하는 이슈가 보드에 없으면(`claunch beads search "<모듈 이름>"
        --json`) found 이슈를 하나 만든다(`--labels found`, 규격대로, 본문에
        node id 목록·base_commit·영수증 경로). 있으면 그 이슈에 같은 코멘트를
        남긴다. 착지 요청의 증거 묶음에도 이 줄이 실린다(integration-request).

      ── 무엇을 검증했는가 ──
      수치는 그 자체로 판정이 아니다. 어느 트리를 어느 환경에서, 무엇과
      나란히 돌린 수치인지가 붙어야 판정이 된다.

      · 검증 대상 트리: 런 cwd가 검증하려는 트리와 다르면 스위트 명령에
        `--directory <절대경로>`를 박는다(워커는 자기 워크트리, 리더는
        master 체크아웃 — 방향이 반대다). --directory가 보장하는 것은
        cwd이고 그래서 rootdir·pythonpath가 그 트리를 가리킨다 = 검증
        대상의 절반. 나머지 절반(인터프리터·패키지·플러그인)은 그
        워크트리에서 `uv sync --extra test`를 1회 돌려야 자기 것이 된다:
        pytest는 콘솔 스크립트라 PATH에서 풀리고 uv는 워크트리 Scripts를
        앞에 얹을 뿐 메인 것을 걷어내지 않으므로, 워크트리 venv가 비어
        있으면 죽지 않고 조용히 메인 패키지로 돈다. 「내 소스를 남의
        패키지로」 검증한 상태가 아무 신호 없이 지나간다.
      · 어느 트리를 쟀는가는 스위트 안에서 답한다 — 표적 선택에
        `tests/test_tree_isolation.py`를 넣고, 그 모듈이 선택에 있었다는
        것을 보고에 적는다. 그 모듈은 지금 돌고 있는 pytest가 임포트한
        `claude_launcher.__file__`이 이 rootdir의 `src`인지 검사하고
        (`test_the_suite_imports_the_tree_it_is_run_from`), 자식 프로세스에
        같은 트리를 넘기는 PYTHONPATH 관용구도 검사한다
        (`test_a_child_process_is_handed_the_tree_the_suite_is_reading`).
        스위트 안에서 도는 검사라 스위트와 갈릴 수 없다는 것이 이 형태의
        값이다. 표적 선택은 바뀐 파일에서 만들어지므로 이 모듈이 저절로
        들어오지는 않는다 — 넣지 않으면 이 축은 안 잰 것이다.
        **이 모듈이 답하는 것은 트리 축 하나다.** 패키지 축(인터프리터·
        플러그인이 자기 워크트리 것인가)은 바로 앞 항목의
        `uv sync --extra test` 1회가 답한다. 두 축은 따로 답해진다.
      · 여기 있던 것은 맨 인터프리터를 띄워 `pytest.__file__`과
        `xdist.__version__`을 찍던 프로브였고 철회됐다(claunch-v5yp).
        명령을 여기 다시 적지 않는다 — 이 산문에 박혀 있었다는 것이
        그것이 매 회차 재배포된 경로다. 틀린 자리가 셋이다:
        1. venv의 editable 설치가 맨 인터프리터에 메인 체크아웃 src를
           올리는데, pytest는 `pyproject.toml`의 `pythonpath=["src"]`를 ini
           파일이 있는 디렉터리 기준으로 풀어 `sys.path` 맨 앞에 꽂는다
           (`_pytest/config` `_decode_value`: `dp = self.inipath.parent` →
           `_configure_python_path`: `sys.path.insert(0, ...)`). 앞쪽
           삽입이라 pytest가 이긴다. 워크트리 `.venv`가 비어 있어도 스위트는
           워크트리를 읽는데 프로브만 메인을 가리킨다 = 위양성이다.
        2. `pytest.__file__`은 질문이 아니다. 질문은 어느 소스 트리를
           쟀는가 하나이고, 메인 venv의 pytest가 워크트리 src를 재는 것은
           정상이다.
        3. `uv run --no-sync`로 부르므로 빈 `.venv`에서는 명령 자체가
           ModuleNotFoundError로 죽는다 — 확인이 정작 필요한 상황에서
           실행되지 않는다.
        이 위양성은 실제로 두 세션에게 필요 없는 venv 재동기화를 시켰고
        멀쩡한 초록 하나를 잠깐 무효화했다. 그 기록은
        `tests/test_tree_isolation.py` 도크스트링에 있다.
      · 보고 규약은 순서가 있다. 뒤엣것은 앞엣것이 정해져야 뜻을 갖는다:
        1순위 **시작 시각과 소요 시간** — 구간이 정해진다. 잊었으면
              basetemp 디렉터리의 CreationTime이 시작 시각을 초 단위로
              돌려준다. 그래서 `--basetemp`는 실행마다 유일해야 한다:
              재사용하면 그 자리가 덮여 **연표가 지워진다**(충돌 방지보다
              이쪽이 큰 값이다). 덮이는 것은 실행이 끝날 때가 아니라 **다음
              실행이 시작될 때**다 — pytest는 명시된 basetemp를 시작 시점에
              rm_rf한다(`_pytest/tmpdir.py` getbasetemp). `-n`을 주면 첫
              테스트가 아니라 노드 기동 시점이라 더 이르다.
              **게이트는 이제 유일하게 준다 — 손댈 것이 없다.**
              tools/changed_tests.py가 `C:/t/<세션>c<MMDDHHMMSS>`를 만든다
              (POSIX 호스트에서는 `C:/t`가 상대 경로로 해석되어 체크아웃
              안에 만들어지므로, 상위 디렉터리가 `<런처 홈>/basetemp`다 —
              `claude_launcher/pytest_basetemp.py`, claunch-wt12o.5):
              세션은 접두사에 남아 프로세스 스캔이 여전히 주인을 짚고,
              세대는 접미사가 진다. 자기 세션의 오래된 것은 여덟 세대를
              넘기면 그 스크립트가 스스로 걷는다(남의 세션 것은 그 세션의
              증거라 건드리지 않는다).
              이 문단이 오래 틀려 있었다는 것을 남긴다. 여기 있던 지시는
              「유일 접미사는 스냅샷에 손으로 박아라, 엔진이 verify에 env를
              주입하지 않아 cmd가 확장할 수 있는 것은 `%CLAUNCH_SESSION%`
              뿐이다」였다. 그 제약은 **게이트 경로에 걸리지 않는다** —
              verify 다섯이 전부 파이썬 도구이고(changed_tests · sweep ·
              landed_check · report_check · deploy_check), 어느 verify 문자열에도
              `--basetemp`이 없다. 값을 고르는 자리는 cmd의 확장이 아니라
              파이썬 함수 안에 늘 있었다. 확장 제약을 전제로 세운 우회를
              회차마다 다시 박지 마라.
              **손으로 돌릴 때**는 이름을 직접 준다:
              `changed_tests.py --basetemp C:/t/<세션>-<요지>`(POSIX에서는
              `<런처 홈>/basetemp/<세션>-<요지>`), 또는 pytest에
              그대로. 다른 실행이 쓰고 있는 이름만은 재사용하지 마라 —
              살아 있는 실행의 fixture가 조용히 사라지고(실측: 7.6초 뒤
              마커 소실), 파일이 잠겨 있으면 대신 INTERNALERROR/WinError 32로
              터진다. 즉 이 결함은 평소에 조용하다.
              (cmd 문자열로 유일성을 만들어야 하는 자리가 생기면 `%RANDOM%`은
              쓰지 마라: 시스템 시계 시드라 해상도가 낮아 근접 호출이 같은
              값을 낸다 — 실측 3회 연속 동일값. `%TIME%`은 콜론 때문에
              경로로 못 쓴다.)
        2순위 **트리 해시** — 구간과 reflog로 검산된다. 스윕 도중 master가
              움직였으면 해시는 시작 시각 없이 정해지지 않는다.
        3순위 **통과·수집 수** — 해시가 확정될 때만 기준선과 비교한다.
              여섯 세션이 실제로 돌려 맞춘 대조라 지금 서 있는 검사다.
        4순위 **시간 배수** — 해시와 `-n`이 같을 때만. 근거 강도가 3순위와
              다르므로 한 쌍으로 적지 않는다: **검증 사례 1건 — 같은 트리·
              같은 명령·같은 `-n 8`으로 돈 5회에서 단독 3회(평균 64.3초)
              대 78초짜리 실제 스윕과 겹친 2회(평균 99.1초) = 1.54배.**
              겹침 여부와 상대의 규모는 라벨이 아니라 `C:/t` 연표에서
              복원해 확인했다(잔챙이 실행 다섯은 전부 2.4초 이하라 오염
              강도에서 제외됐고, 단독 3회는 직전 실행 종료 시각으로 단독임이
              확인됐다). **표본 5, 임계값은 미정** — 방향은 섰지만 어느
              배수부터 의심할지는 아직 정하지 않았다.
              그리고 같은 5회의 통과 수·실패 수·결과 집합은 전부 동일했다:
              **겹침은 시간을 늘렸지만 판정은 흔들지 않았다** — 시간을 못
              쓰는 것이 판정을 못 한다는 뜻은 아니므로, 배수 칸이 빈 수치도
              증거로 선다.
        그리고 수치는 항상 **(트리 해시, 축, 값)** 셋으로 적는다. 축을
        빼면 서로 다른 것을 센 수치가 같은 이름으로 돌아다닌다 — 실제로
        `-m "not worktree"` 축의 약 1450과 필터 없는 축의 1558이 둘 다
        "정본 대조군"으로 유통됐고, 100건 넘게 갈리는 것을 한동안 아무도
        안 물었다. 지금 이 편성에는 축이 셋이다: 워커의 **표적 선택**
        (회차마다 다르므로 고른 모듈 목록이 곧 축이다), 리더 스윕의
        **필터 없는 전체**, 그리고 과거 기록에 남아 있는 `-m "not
        worktree"`. 축을 옮길 때는 값만 옮기지 말고 축 이름을 같이
        옮긴다. (트리, 환경)도 함께 적는다.
        기준선 수집 수는 `--collect-only`(-n 없이, 1초 미만, 창을 쓰지
        않는다)로 얻는다 — 기준선을 얻으려고 스위트를 돌리지 않는다.
        수집 수는 「무엇을 돌릴 예정인가」이지 「무엇이 실제로 돌았는가」가
        아니다. 실행 축은 그 브랜치들을 실제로 합친 프리뷰 스윕이 덮는다 —
        각자 단독 수치만 있으면 그 칸은 비어 있는 것이다.
      · **죽은 실행의 세 값이 전부 `C:/t`에서 복원된다** — 라벨이나 산수로
        추정하지 마라. 세 값의 성격은 **시작 = 상한**(basetemp 생성이 명령
        시작보다 몇 초 늦다), **소요 = 하한**, **종료 = 하한**이고,
        **셋 다 같은 방향으로 보수적이라 겹침 판정에서 거짓 음성만 만든다**:
          시작 = basetemp 생성 시각
          종료 = **재귀 전체(파일 포함)의 최대 LastWriteTime — 종료의
                 「하한」이지 소요 추정치가 아니다** — 정확히는 「basetemp에
                 마지막으로 쓴 시각」이다. **끝까지 tmp를 쓰는 실행에서는**
                 실측과 1% 안쪽이었지만(11건), 마지막 90초 동안 tmp 쓰기가
                 없던 실행에서는 49% 짧게 나왔다. **그 반례는 깊이와 무관해
                 재귀에도 그대로 걸린다** — 아무 데도 안 썼으면 아무리 깊이
                 내려가도 그 시각을 못 만든다. **소요 근사로 쓰면 최대
                 절반이 잘리고 「겹친 게 없다」는 거짓 음성이 나온다.**
                 `Get-ChildItem <basetemp> -Recurse -Force |
                  Sort LastWriteTime -Desc | Select -First 1`
                 **이건 계측으로 고를 문제가 아니라 정의상 정해진다**:
                 세 후보(최상위 / popen-gw* 최대 / 재귀 전체 최대)는 전부
                 실제 종료의 하한이고 후보 집합이 포함관계(① ⊂ ② ⊂ ③)라
                 최대값은 후보를 넓히면 줄지 않는다 — **③ ≥ ② ≥ ①이 항상
                 참이고, 하한은 클수록 좋으므로 ③이 지배한다.** 어느 표본을
                 재도 ②가 ③보다 나을 수 없다. (참고로 한 기준 표본에서
                 ①은 실제의 0.8%, ②는 94%, ③은 98.3%였고, 다른 표본에서는
                 ②=③이었다 — 격차는 실행마다 다르므로 격차를 재서 고르면
                 결론이 흔들린다. 디렉터리 mtime은 자식이 추가·삭제될 때만
                 갱신되고 마지막 쓰기는 그 안의 파일에서 일어난다.)
                 workers=0이면 popen-gw*가 없으므로 재귀가 유일한 길이다
          규모 = `basetemp/popen-gw*` 개수(= 그 실행의 `-n`)
        **최상위 LastWrite는 종료가 아니다** — pytest가 하위에만 쓰므로
        일찍 멈춘다(실측 반례: 생성 21:26:34, 최상위 21:26:39, 실제 소요
        335.8초). 최상위로 교집합을 내면 「겹친 것이 없다」는 거짓 음성이
        나온다. **복원값은 어느 변종이든 하한이고 양쪽 끝이 다 잘린다**:
        **앞** — basetemp에 쓰기가 없는 수집·임포트 구간이 안 잡힌다
        (복원 0.2초 대 보고 2.50초); **뒤** — 마지막 구간에 워커 tmp 쓰기가
        없으면 그만큼 잘린다(복원 94.7초 대 실측 186.84초, 49% 손실).
        두 사례를 함께 읽어야 「하한」이 양방향이라는 것이 보인다.
        ②(popen-gw 디렉터리들의 최대)를 안 쓰는 이유가 하나 더 있다:
        **일관되게 낮은 게 아니라 때때로 맞고 때때로 낮아서** 보정할 수가
        없다(같은 세션의 손 실행 셋은 ②=③, 게이트분만 8초 벌어졌다 —
        마지막 쓰기가 디렉터리에 일어나면 같아지고 파일 내용으로 끝나면
        벌어진다).
        ★ **하한끼리 비교하면 「겹쳤다」는 확정할 수 있어도 「안 겹쳤다」는
        확정할 수 없다.** 오차가 한 방향(늘 실제보다 이르다)이라 거짓
        음성만 만들고 거짓 양성은 만들지 않기 때문이다. 그래서 **복원으로
        낸 「겹침 없음」은 전부 재확인 대상이고, 「겹침 있음」은 그대로
        유효하다** — 결론을 쓸 때도 「안 겹쳤다」가 아니라 「겹쳤다는 것을
        뒷받침하지 않는다」까지만 적는다. 정량 기준: **비겹침을 말하려면
        간격이 최소 2분은 되어야 하고, 그보다 좁으면 「미확정」으로 적는다**
        — 마지막 92초 동안 tmp에 안 쓴 실행이 실측됐으므로 수십 초짜리
        간격은 그 맹점 안에 통째로 들어간다.
        **규모와 지속 시간을 함께 읽어라**: 워커 0 + 수 초 = 탐침,
        규모 판별은 이 표로 한다:
          워커 ≥ 1 → xdist 스윕, 규모 = 워커 수. **실행량은 `popen-gw*`
                     안을 세야 나온다** — 워커가 있으면 최상위 하위는 늘
                     워커 수(예: 8)로 보이므로, 그 수를 직렬의 하위 수와
                     나란히 놓으면 규모를 거꾸로 읽는다
          워커 0 + 하위 수십 이하 + 수 초 → 탐침(무게 없음)
          워커 0 + 하위 수백 + 수 분 → **직렬 전체 스윕 — 창을 쓴다**
        `-n`이 없다는 것은 xdist를 안 썼다는 뜻이지 가볍다는 뜻이 아니다.
        실측에서 직렬 전체(하위 995, 387초+)가 `-n 8`(62~103초)보다 네 배
        오래 창을 물었다. 그리고 **개수로 규모를 읽지 마라** —
        직렬 실행도 프로세스는 여럿으로 보이고, 오늘 겹침 오귀속이 전부
        그 자리에서 났다. basetemp를 재사용하면 마지막 실행의 워커 수만
        남으므로, 유일 이름 규칙이 이 복원 전체의 전제다.
      · 겹침 판정의 시각은 **[생성, 종료]**로 잡는다(위 세 값으로 채운다).
      · 통과 수를 **귀속**에 쓰는 용법(이 수는 어느 트리에서만 나올 수
        있는가)은 `-q`가 rootdir을 지운 수치를 구제한다. 순서를 지켜라:
        **1순위는 rootdir을 안 지우는 것이고**, 이 서명은 이미 지워진
        수치를 사후에 건지는 도구다 — 뒤집으면 「어차피 수로 알 수 있으니
        `-q`로 돌려도 된다」가 되어 방금 겪은 문제로 되돌아간다. 그리고
        서명은 후보 트리들의 케이스 수가 서로 구별될 때만 트리를 지목한다:
        0개 추가는 서명이 없고, 같은 수를 더한 트리가 둘이면 서명이 겹친다.
      · 게이트 verify도 사후 복원된다 — 저널이 유일한 기록이 아니다.
        저널에는 명령 문자열만 남지만, `C:/t`의 basetemp가 나머지를 갖고
        있다: 시작·소요(하한)·규모에 더해 **실행량 = workers>0이면
        Σ(각 `popen-gw*`의 하위 개수), 아니면 basetemp 하위 개수.** 실측
        8건에서 그 실행이 보고한 수와 맞았고(실패가 있던 회차에서는
        통과 + 실패 = 실행량으로 맞았다) 값이 970·973·1075·1127로 갈리므로
        상수가 아니라 실제로 추적한다. **남는 것은 「어느 테스트가
        실패했는가」뿐이다.** 단 **실행량 ≈ 통과 + 실패이고 skip은 안
        센다** — skip은 tmp 픽스처가 돌기 전에 걸러진다. 수집 수와 비교할
        때는 skip 수를 빼라(이 저장소의 `-m "not worktree"` 축은 늘 1건을
        건너뛰므로 실행량 기준선은 970이다). 그리고 **테스트별 tmp가
        아닌 디렉터리가 섞이면 그만큼 늘어난다** — 모듈 스코프
        `tmp_path_factory` 하나가 하위를 하나 더 만들어 983 대신 985가
        나온 실사례가 있다. 즉 실행량은 「tmp를 쓴 단위 수」이지 테스트
        수 자체가 아니다. **그리고 이 값만 새는 방향이 반대다** —
        시작(상한)·소요·종료(하한)는 전부 보수적인데 실행량은 **과대 쪽**
        이다. 대조하기 전에 그 트리에 모듈·세션 스코프 tmp 픽스처가 있는지
        보고, 있으면 그 수만큼 빼거나 규모 지표로만 써라. 지금 이 저장소에
        그런 픽스처가 없어서 수가 정확히 맞는 것이고 파일 하나가 추가되면
        깨진다 — 저장소 상태의 성질이지 방법의 성질이 아니다.
      · 이 복원은 **basetemp가 안 덮였을 때만** 된다. 유일 이름 규칙과
        대체재가 아니라 보완재다 — 이름을 재사용하면 앞 실행의 연표도
        게이트 수치도 함께 지워진다.
      · 그래도 보고에 적을 수치는 자기가 재서 적는 편이 낫다 — 복원은
        가능하지만 다음 사람이 디스크를 뒤져야 하고, basetemp가 재사용되면
        그 자리가 덮인다. 그리고 같은 트리·같은 명령의 손 실행이 있으면
        **게이트 verify의 간접 대조군**이 된다(게이트는 stdout이 없어
        직접 대조가 안 되는데, 두 실행의 실행량·워커 수·소요가 나란히
        서면 서로를 검산한다) — 「수치는 자기가 돌려서 적는다」는 규율이
        그 대조군을 자동으로 만든다.
      · 단서: 이 저장소에서 실행량이 통과 수와 정확히 맞는 것은 `home`
        픽스처가 사실상 모든 테스트에 tmp를 만들기 때문이다 — **그건 이
        저장소의 성질이지 방법의 성질이 아니다.** 여기서는 정확한 값으로
        써도 되고, 다른 저장소에서는 「tmp를 쓴 테스트 수」로만 읽어라.
      · **추론하기 전에 자기 기록을 연다.** 남의 관측으로 추론하는 것보다
        자기 저널·로그를 여는 편이 늘 싸고, 답이 이미 거기 있는 경우가
        많다.

      ── claunch window가 측정 창을 배정한다 ──
      테스트 실행 전후의 획득·해제는 실행 도구가 처리한다. 프로세스 스캔과
      메시 선언으로 순번을 관리하지 않는다.
      · `tools/changed_tests.py`는 targeted 창을 획득한다. 머신 전체에서
        targeted 실행은 최대 3개(`window_targeted_cap`)이며, 각 실행은 선택된
        테스트 모듈만 돈다.
      · `tools/sweep.py run`은 sweep 창을 획득한다. sweep은 용량 1이며
        targeted 실행을 포함한 다른 측정과 동시에 부여되지 않는다. sweep
        대기가 생기면 그 뒤에 선 targeted 부여가 중단되고, 진행 중인
        targeted가 끝난 뒤 sweep이 시작된다.
      · `pytest`를 직접 실행해도 `tests/conftest.py`가 범위를 판정해 같은 창을
        획득한다. `tests` 전체 또는 인자 없는 실행은 sweep, 파일·nodeid를
        지정한 실행은 targeted다. 도구가 이미 획득한 경우 전달된 grant를
        재사용하므로 중복 획득이 발생하지 않는다.
      · 현재 상태는 `claunch window status`로 읽는다. 보유자·대기열·획득
        시각·용량·작업자 예산 사용량이 데몬 상태로 출력된다. 이 출력은 진단과
        보고에 사용하며, 획득 판정은 실행 도구가 수행한다.
      · 끝난 실행의 대기·보유 시간과 결과는 `claunch window history`(MCP
        `window_history`, 웹 Window 페이지)로 읽는다. 시간은 데몬이 창 상태에서
        직접 기록하고, 결과는 `tests/conftest.py`가 pytest 종료 시 자동으로
        보고하므로 세션이 따로 보고할 것은 없다. 이 로그는 최대 7일만 보관되고
        그보다 오래된 줄은 삭제된다 — 회차가 인용할 근거는 여전히 영수증이다.
      · 창 부여 응답의 `advisory_n`은 그 실행이 쓸 수 있는 xdist 작업자
        수다. 클래스별 상한(targeted 4, sweep 8), 요청한 폭, 머신 전체 작업자
        예산(`window_worker_budget` 12)의 남은 양 가운데 가장 작은 값이다.
        `sweep.py`와 `changed_tests.py`는 xdist `-n`에 이 값을 적용하고,
        `tests/conftest.py`는 직접 입력한 `-n`도 이 값으로 줄인다. 영수증의
        `window` 필드에 class·holder·source·wait_seconds·advisory_n을
        기록한다.
      · 데몬 또는 창 API를 사용할 수 없으면 두 클래스 모두 데몬 상태
        디렉터리의 OS 파일 잠금으로 제한된다. targeted는 슬롯 잠금 3개 중
        하나를 잡고, sweep은 sweep 잠금과 슬롯 잠금 전부를 잡아 직렬화한다.
        `CLAUNCH_WINDOW=off`는 운영자 셸에서만 강제를 해제하고 시작 시 경고를
        출력한다. 관리 세션 안(`CLAUNCH_SESSION` 설정)에서는 경고와 함께
        무시된다.

      ── targeted 실행의 동시성 규칙 ──
      targeted 실행도 머신 자원을 쓰는 측정이다. 한 머신에 세션 스무 개와
      프리뷰 워크트리 여러 개가 함께 돌 때 flaky 실패가 반복되었고, 그 부하의
      상당 부분은 창이 세지 않던 병렬 실행이었다(claunch-8kald).
      · **한 세션은 targeted 창을 한 번에 하나만 가진다**
        (`window_targeted_per_session` 1). 서브에이전트는 같은
        `CLAUNCH_SESSION`으로 돌므로, 서브에이전트 여럿에게 pytest를 나눠
        맡겨도 동시에 도는 것은 하나이고 나머지는 대기열에 선다. 병렬로
        돌리고 싶은 모듈은 나누지 말고 한 번의 실행에 묶는다 — 한 실행 안의
        xdist 작업자가 그 병렬을 맡는다.
      · 실행 하나를 백그라운드로 돌리는 동안 같은 세션에서 두 번째 pytest를
        시작하지 않는다. 두 번째 실행은 첫 실행의 창이 해제될 때까지 대기하고,
        대기 시간이 영수증의 wait_seconds에 남는다.
      · 필요한 폭만 요청한다. 모듈 하나는 직렬로 돌고 작업자 하나로 계산된다.
        `-n`을 크게 적어도 부여된 폭 이상으로는 늘어나지 않는다.
      · 창이 거절되면 응답의 사유(`reason`: sweep 보유, 용량, 세션당 제한,
        작업자 예산)를 보고에 옮긴다. 거절을 피하려고 `CLAUNCH_WINDOW`를
        바꾸거나 창 밖에서 pytest를 돌리지 않는다.
      · **대기열 순서 조정과 즉시 부여는 운영자의 명령이다.**
        `claunch window prioritize <grant_id>`와 `claunch window force
        <grant_id>`(그리고 `acquire --force`)는 관리 세션 안에서 거절되고,
        웹 UI Window 페이지의 Top·Force 버튼도 운영자의 자리다. 급한 측정이
        있으면 사용자에게 순서 조정이나 force를 요청한다.
      · 표적 실행은 예상 시간과 관계없이 가능하면 항상 백그라운드로 시작한다
        (하네스의 `run_in_background`). 백그라운드 실행을 쓸 수 없는
        하네스에서만 포그라운드로 돌린다. 실행이 끝나기를 기다리는 동안 변경
        범위 검토와 기록 정리를 진행하고, 완료 전에 같은 트리를 다시 측정하지
        않는다. 영수증이 생성되면 후속 게이트는 같은 트리와 선택을 재사용한다.
      · 백그라운드 실행의 끝은 그 프로세스로 기다린다. 하네스가 끝에 보내는
        완료 알림(Claude Code Bash의 `run_in_background`)이 오면 따로 기다리지
        않는다. 셸에서 기다려야 하면 띄울 때 `$!`로
        pid를 받아 `while kill -0 <pid> 2>/dev/null; do sleep 2; done`으로
        기다린다. `pgrep -f "<명령 문자열>"`로 기다리지 않는다 — 그 루프를
        돌리는 셸의 명령줄에도 같은 문자열이 있어 자기 자신에 매치되고,
        테스트가 끝난 뒤에도 끝나지 않는다(claunch-ersj2: 2026-10-15 s712의
        대기 루프가 테스트 종료 뒤 25분 넘게 돌았다).
      · pytest가 아닌 테스트·빌드 명령의 window 사용법은 프롬프트 팩
        `non-pytest-project`에 있다(그 팩이 오프닝에 없으면 `prompt_pack`으로 읽는다).

      ── 재는 것과 주장하는 것 ──
      · 어떤 명령에 대한 주장인지와 실제로 실행한 명령이 같은지 먼저
        확인한다 — `python -c`로 `pytest`를 대신 재지 않는다.
      · 독립 확인은 결론이 같은지가 아니라 방법이 다른지를 본다. 같은
        방법으로 두 번 재면 표본만 늘어난 것이다.
      · 층이 다른 두 관측이 충돌하면, 어느 쪽도 틀리지 않고 둘을 가르는
        조건이 아직 안 드러난 것이다.
      · 철회도 근거가 닿는 데까지만 한다 — 「확정되지 않았다」와
        「아니다」는 다르다.
      · 「X로 읽지 마라」는 항상 「대신 Y로 읽어라」와 함께 쓴다. 금지만
        주면 재는 쪽이 흔들리고, 대체 측정을 주면 안 흔들린다.
      · 시각 범위로 증거를 거를 때는 **그 범위 자체가 미확정인지 먼저
        본다** — 미확정이면 범위 없이 훑는다. 남이 준 창 안에서만 찾으면
        그 창이 틀렸을 때 화면에 이미 있던 증거를 라벨이 가린다.
      · **표본 하나로 기법을 확정하지 않는다** — 두 변종이 그 표본에서만
        우연히 같은 값을 내면 차이가 안 보인다(위 종료 시각 셋이 그랬다:
        하위가 얕은 표본에서는 ②와 ③이 같다).
      · 기존 프로세스 스캔과 디스크 재구성은 시작 직후 1~3초 구간을 확인하지
        못했다. 창 상태의 acquired_at과 영수증의 wait_seconds를 기준으로
        실행 구간을 확인한다.
      · **좁혀 적은 판정은 전파되면서 넓어진다** — 「s35에 대해 겹침
        없음」이 한 다리 건너 「겹침 없음」이 된다. 판정을 옮길 때는
        그것이 무엇에 대한 판정이었는지를 같이 옮겨라.
      · **두 수치가 안 맞는데 아무도 안 묻는 자리를 발견 신호로 쓴다.**
        서로의 결론은 부지런히 깎으면서 서로의 수치가 어긋나는 것은
        지나치기 쉽다 — 오늘 1~3초와 8초가 같은 공지에 나란히 실린 채로
        지나갔다.
      · **두 규칙이 각자 맞는데 서로를 무력화하는 자리를 아무도 안 본다.**
        각 규칙은 자기 자리에서만 읽히고 한 화면에 같이 뜨지 않기 때문이다
        — 정리 규칙이 포렌식 기록을 지우던 자리가 그 실례다.
    done_when: |
      보고에 수치(M/M, 신규 K)와 **골라 돌린 모듈 목록**이 있다(전체 스위트를
      돌린 수치가 아니다 — 그것은 이 스텝의 것이 아니다). 수치에는 트리 해시와
      (트리, 환경)이 붙어 있고, 실행 영수증의 window 필드(class·source·
      wait_seconds·advisory_n)가 보고에 있다. 실패가 있었으면 새 실패 수
      (`new_failed`)와 기존 실패 목록(`preexisting`)이 보고에 있고, 기존
      실패가 있으면 이슈에 `PREEXISTING FAILURES @` 코멘트가 남았다.
    # 드라이버가 직접 한다(claunch-onbdf). 읽기 전용 headless 위임에서는 쓰기
    # 도구와 함께 Bash·MCP도 막혀 이 단계의 셸 명령·MCP search가 돌지 않았다
    # (시험 런에서 실패하거나 검색 없이 끝났다). 그 실행기는 claunch-xjbrh에서
    # 제거됐다.
    executor: [inline]
    returns:
      ok:
        modules: list
        passed: int
        failed: int
        new_failed: "int?"
        preexisting: "list?"
        new: "int?"
        tree: str
        env: str
        receipt: str
        tried: list
        window: "dict?"
        started_at: "str?"
        seconds: "float?"
    effects: [test.run, fs.read]

  commit:
    title: 커밋·보고
    prompt: |
      저장소 관례(한 줄 요약 — 「무엇을 어떻게」)로 커밋한다.

      ── 커밋 하나를 만들 때마다, 그 자리에서 두 가지 ──
      회차가 끝난 뒤에 몰아서 하지 않는다. 몰아서 적은 것은 기억에서
      적은 것이고, 기억은 해시를 틀린다.
      1) **스탬프** — 커밋 메시지의 마지막 문단에 트레일러를 단다:
         `Claunch-Session: $CLAUNCH_SESSION`, 그리고 linked worktree에서
         작업 중이면 `Claunch-Worktree: <체크아웃 이름>`(commit-stamp
         스킬의 철자 그대로 — 철자가 곧 색인이다). 이것이 이 커밋을
         **세션 메타데이터에 싣는 유일한 동작**이다: 데몬은 따로 받아
         적지 않고 이 트레일러를 읽어 세션 상세 패널의 Commits 블록과
         `/api/sessions/<세션>/meta`의 `commits`를 만든다. 그래서 스탬프
         없는 커밋은 「기록되지 않은」 것이 아니라 **이 세션의 것이
         아닌** 커밋이다. 회차 보고서(HTML)가 사람이 읽는 산출물이라면
         이쪽은 기계가 읽는 짝이고, 둘 다 세션이 닫힌 뒤에 남는다.
         확인은 `claunch commits` — 방금 만든 해시가 그 목록에 있어야
         한다. 없으면 트레일러를 빠뜨린 것이다(이미 push하지 않은
         직전 커밋이면 `git commit --amend`로 고친다; 남의 커밋은
         고치지 않는다).
      2) **이슈 코멘트 한 줄** — `claunch beads comments add <id>
         "COMMIT <해시> — <한 줄 요약>"`. id는 **그 커밋이 속한 일감의
         이슈**다 — 배치 회차면 일감마다 다르고, 주 이슈에 몰아 적으면
         다른 일감의 이슈는 커밋 없이 닫히게 된다. 이슈가 이 회차의 정본
         기록이고(「기록은 코멘트에, 신호는 메시지에」), 커밋은 되짚어
         읽히는 것이다. 이 줄은 상위에게 보내는 nudge가 아니다 —
         **메시로 보내지 않는다.** 커밋마다 메시지를 보내면 상대
         터미널에 커밋 수만큼 타이핑된다. 상위에게 가는 한 줄은 이
         스텝 끝의 nudge 하나뿐이다.
      3) **상태 점검 갱신은 요청받고 한다** — 이 작업이 끝나면 데몬이
         상태 점검 재보고 요청을 이 터미널에 타이핑한다. 그 요청이 도착하면 `status_checks` 도구로
         활성 항목의 id·질문·현재 보고 값을 읽고, `report_status_checks`
         도구로 활성 id 각각에 현재 사실에 맞는 `yes` 또는 `no`를
         보고한다. 비활성 id는 보고하지 않고, 설정은 사용자가 바꿀 수
         있으므로 이전에 읽은 목록을 재사용하지 않는다. 요청이 오기 전에
         미리 보고하지 않는다 — 활성 항목이 하나도 없으면 요청 자체가
         오지 않으며, 그 사실은 런 저널에 `trigger_skipped`로 남는다.
      머지 커밋(--no-ff)에는 스탬프도 코멘트도 요구하지 않는다 — 그
      커밋들이 무엇인지는 접힌 커밋들이 이미 말한다.

      워크트리
      branch-setup이 이 세션의 브랜치를 새로 판 경우에만 이 절이 적용된다.
      그때 브랜치 위에서 작업했으면 피처 브랜치를 워크트리 브랜치에 --no-ff로
      머지해 한 갈래로 정리한다 — 이 머지의 상한은 워크트리 브랜치까지다.
      branch-setup이 이미 그 워크트리의 브랜치를 재사용했다면 접을 갈래가
      없으므로 머지하지 않는다(내 커밋이 그 브랜치에 그대로 쌓여 있다).
      단 이 상한은 **한 워크트리에 회차가 하나일 때**의 규칙이다. 접기
      전에 워크트리 브랜치의 상태를 먼저 본다 — 다음 둘 중 하나라도
      해당하면 접지 않고 **피처 브랜치 자체가 인계 단위**다:
      · **은퇴**: `git branch --contains <워크트리 브랜치> --list master`가
        master를 내놓으면 그 브랜치는 이미 통합돼 임무가 끝났다. 접으면
        master보다 뒤처진 갈래를 되살리는 셈이다.
      · **동결·심사 중**: 그 브랜치가 통합 대기로 올라가 있으면 접는 순간
        남이 심사 중인 브랜치의 tip이 내 손에 움직인다. 심사 중에 되돌릴
        수 없는 쪽을 고르지 않는다 — 머지는 나중에 언제든 할 수 있다.
      두 경우 모두 접지 않은 이유를 보고에 적는다. 회차가 여러 번 도는
      워크트리에서는 워크트리 브랜치가 여러 목표가 쌓인 곳이 되므로,
      무관한 목표를 한 갈래에 얹지 않는 것이 상한 규칙보다 우선한다.
      하위 워커를 둔 회차면 자식 브랜치를 여기서 모으지 않는다 — 자식은
      stack side 런이 스택 브랜치 `<세션>-stack`에 착지시키고, 이 회차에는
      착지 전에 stack-merge가 컷 하나를 --no-ff로 한 번 싣는다(work의
      「자식을 두면」 절). 자식이 손자 브랜치를 같은 방식으로 모았으면 그
      트리가 통째로 실린다. 아직 작업 중인 자식은 컷에서 다음 착지로
      넘어가고 이 세션에 그대로 남는다 — 그래서 착지 요청 전에 리더에게
      adopt(reparent)를 청하지 않는다. 자식이 남았는데 세션이 끝나야 할
      때만(settle-check) 리더에게 adopt ask를 보낸다. reparent는 리더의
      스킬(mesh-retopology)이라 워커는 요청만 할 수 있다.
      그리고 완료 보고를 만든다: 목표, 브랜치, 기능 커밋·머지 커밋 해시,
      테스트 수치(표적 테스트를 생략한 일감이면 `tests: skipped (TESTS SKIPPED
      @ <해시>)`). 이 묶음이 가는 곳은 이슈 코멘트다 —
      `claunch beads comments add <id> -f <파일>` — 상위가 착지 결정을 내리는
      근거가 그것이기 때문이다. 메시에 속해 있으면 상위에게는 nudge 한 줄만
      보낸다: `<id> 커밋 끝 — <브랜치> @ <tip>, tests N/M(표적), 묶음은
      코멘트에.` 같은 내용을 메시지 본문에 다시 싣지 않는다.
      **큐에 일감이 남아 있으면 이 nudge는 보내지 않는다** — 일감마다
      보내면 상위 터미널에 일감 수만큼 타이핑된다. 배치의 nudge는
      integration-request의 하나다.
    done_when: |
      커밋(워크트리 작업이면 --no-ff 머지까지, 단 워크트리 브랜치가 이미
      master에 포함된 은퇴 상태면 접기 없이 피처 브랜치가 인계 단위이고
      그 판별과 이유가 보고에 있다)이 만들어졌고(위임 전용 회차면 기능
      커밋 0건과 그 사유가 보고에 있다 — 자식 브랜치는 여기서 모으지 않고
      stack side 런이 스택에 싣는다), 이 회차가 만든
      기능 커밋이 전부 `Claunch-Session` 트레일러를 달아 `claunch commits`가
      그것들을 내놓고(= 세션 메타데이터에 실렸다), 커밋마다 이슈에
      `COMMIT <해시> — <요약>` 코멘트가 하나씩 남았으며, 목표·브랜치·
      커밋 해시·테스트 수치가 담긴 완료 보고가 기록되고 같은 묶음이 이슈
      코멘트로도 남았다. 메시에 가입한 상태면 상위에게 nudge 한 줄이
      나갔다(큐에 일감이 남아 있으면 보내지 않았다). master는 움직이지
      않았다.
    # v1 commit 스텝의 {do: checks, at: leave}. 이 작업을 떠나는 순간 데몬이
    # 상태 점검 재보고 요청을 타이핑한다(위 프롬프트 3번).
    triggers:
      - {do: checks, at: leave}
    returns:
      ok: {commits: list, tip: str}
    effects: [git.commit, "git.merge:worktree-branch", board.write, mesh.send]

  item-intake:
    title: 다음 일감 착수
    prompt: |
      고른 다음 일감을 이 배치에 싣는다. 순서는 큐의
      순서(priority 오름차순 → created_at)이고, 그 첫 것을 `claunch beads
      show <id> --json`으로 읽는다 — 본문이 목표이고, 비었거나 자리표시
      절뿐이면 intake의 규칙대로 규격을 채운다. 그리고 `claunch beads
      update <id> --status in_progress --external-ref <run id>/<id>` — 이
      전이가 이 일감의 시작이다.
      보고에 남길 것: 일감 id·제목, 이 배치에서의 순번(n번째 / 지금까지
      실린 id 목록), 범위, 완료 증거 기준. 브랜치는 그대로다 — 새 브랜치를
      만들지 않고, 통합 대상도 intake에서 정한 그것이다.
      같은 파일·같은 규칙에 닿는 일감이 앞 일감과 충돌하는 결정을
      요구하면 혼자 정하지 말고 리더에게 묻는다(work의 규칙 그대로).
    done_when: |
      다음 일감의 id가 in_progress로 전이됐고(--external-ref에 `<run id>/<id>`),
      배치 순번·범위·완료 증거 기준이 보고에 있다.
    returns:
      ok: {issue: str, n: int}
    effects: [board.write]

  # ── 착지 (land) ──────────────────────────────────────────────────────
  stack-cut:
    title: 컷 요청 (자식 스택에서 이번 착지에 실을 것을 받는다)
    prompt: |
      이번 착지에 자식 스택을 싣는다. 이 작업을 ok로 떠나면 엔진이 이 런의
      signals에 cut-wanted를 쓴다 — stack 런에 가는 컷 요청이 그것이다.
      컷 규칙은 stack 런이 지킨다: 착지를 이미
      요청한 자식은 기다리고, 작업 중인 자식은 다음 컷으로 넘긴다. 작업
      중인 자식을 이번 착지에 싣는 것은 사용자가 지시했을 때만이다 —
      그런 지시가 있으면 그 자식과 지시의 출처를 보고에 적는다(stack 런의
      standby가 그 자식의 착지까지 컷을 미룬다).
      지금 스택 표의 상태(요청됨·작업 중 자식 수)를 보고에 적는다.
    done_when: |
      컷 요청 시점의 스택 tip과 자식별 상태(요청됨·작업 중), 사용자가
      포함을 지시한 자식이 있으면 그 지시의 출처가 보고에 있다.
    returns:
      ok: {stack_tip: str, children: list}
    effects: [fs.read]
    do:
      # 지난 회차가 컷 없이 cut-wait를 떠났으면(timeout → cut-unreachable에서
      # confirmed) 그 뒤에 온 컷은 지난 요청의 답이다. 새 요청 전에 소비해 이번
      # cut-wait가 그 컷으로 풀리지 않게 한다(claunch-yq80p.2 리뷰 X1).
      - {consume: {from: "side:stack:signals", name: cut}, when: "$outcome == 'ok' and side('stack').live"}
      - push: {to: signals, item: {name: "'cut-wanted'", tip: "$result['stack-cut'].value.stack_tip"}}
        when: "$outcome == 'ok'"

  stack-merge:
    title: 컷 머지 (스택 브랜치 -> 내 회차 브랜치, --no-ff 1회)
    prompt: |
      stack 런이 컷을 냈다. 이 회차 이슈의 `CUT <n> @ <컷 tip>` 코멘트를
      읽고, 내 회차 워크트리에서 컷 tip을 한 번 머지한다:
        git merge --no-ff <컷 tip> -m "merge: <세션>-stack cut <n>"
      컷 tip이 이미 내 브랜치의 조상이면(실린 것이 없는 컷) 머지하지 않고
      그 사실을 적는다. 머지 뒤 바꾼 영역의 표적 테스트를 돌린다(review
      절과 같은 창·표기). 이 머지 커밋은 착지 요청의 증거 묶음에 「어느
      자식이 어떤 머지로 실렸는가」의 트리로 들어간다.
      스택 머지는 컷 하나당 이 한 번뿐이다 — 자식 브랜치를 내 회차
      브랜치에 하나씩 직접 머지하지 않는다.
    done_when: |
      컷 번호와 컷 tip, 만든 머지 커밋 해시(또는 실린 것이 없어 머지하지
      않았다는 사실), 실린 자식(세션·이슈·스택 머지 해시)과 표적 테스트
      수치가 보고에 있다.
    returns:
      ok: {cut: int, cut_tip: str, merge: "str?", children: list}
    effects: ["git.merge:round-branch", test.run, board.write]

  landing-review:
    title: 착지 결정 (상위 세션에 묻는다)
    # 질문은 상위 세션에게 간다 — 사람 문이 아니다. 응답자 순서는 v1과 같다:
    # 부모가 스택을 둔 워커면 그 워커, 평면 편성이면 리더(조상, 루트 워커에게는
    # 형제). 상위가 없거나 30분 안에 답이 없으면 사람 앞에 선다. 사용자는 그
    # 전에도 언제든 같은 결정을 내릴 수 있고, 그 답이 이긴다. hold는 rebase와
    # 증거 묶음을 건너뛰므로 워커(agent)가 고를 수 없다.
    ask:
      prompt: &landing_review_ask |
        워커 세션 하나가 이번 목표를 자기 브랜치에 커밋했고 표적 테스트가
        green이다. 그 세션은 이 질문을 보낸 세션이다(질문 목록의 from_session.
        사람이 받았으면 이 질문이 떠 있는 세션). 지금 그 브랜치를 상위 세션의
        통합 대기 표에 올리게 하는가(워커는 먼저 통합 대상 위로 rebase한 뒤
        증거 묶음을 만들어 요청을 보낸다), 아니면 브랜치를 동결해 두고 이
        회차를 마감하게 하는가?

        이 질문이 열린 사유는 둘 중 하나다. (1) 워커의 기계 확인(실을 커밋
        1건 이상, 작업 트리 깨끗, 표적 green, 미리 병합 충돌 0, 열린 제동 마커
        없음, 동결 지시 없음) 중 하나가 깨졌다. (2) 확인은 통과했지만 워커가
        착지 경로를 스스로 정할 수 없다고 판단했다. 확인이 전부 통과하고 경로가
        분명하면 워커는 이 질문 없이 직접 요청을 올린다. 어느 사유인지는 워커가
        select의 reason에 적어 저널에 남겼다: `claunch cflow2 journal -t <그 세션>
        -n 10` 이 그것이고, 거기부터 읽는다.

        이 질문은 먼저 그 워커의 상위 세션(스택을 둔 부모 워커, 또는 리더)에게
        간다. 응답할 상위 세션이 없거나 30분 안에 답이 없으면 사람에게 온다.
        판단 기준은 같다. request를 고르면 워커는 통합 대기 표(부모 워커의 스택,
        또는 리더의 착지 큐)에 요청을 올린다. 이 브랜치를 그 밖의 경로로 착지시킬
        계획이면 hold다 — 예: 사람이 직접 머지한다, quick-fork 세션이면 web UI의
        merge로 결과를 원 세션에 넘기고 원 세션이 착지를 처리한다.

        나머지 판단 근거는 보드와 런 상태에 있다. 그 워커의 이슈 id는
        `claunch cflow2 status -t <그 세션> --json`의 data.claim.issue이고, 바꾼 파일과 요지는 같은 출력의 data.work_report다.
        브랜치·커밋 해시·tip·테스트 수치는 그 워커가 커밋 단계에서 이슈에 남긴
        코멘트(`COMMIT <해시>` 줄과 증거 묶음)에 있다 — `claunch beads show <id>
        --json`, `claunch beads comments <id>`.
        지금 줄을 세울 여력이 있는지, 대기 중인 다른 브랜치와 충돌하는지, 스윕
        배치 타이밍이 맞는지는 통합 대기 표를 가진 상위 세션이 판단한다.

        어느 쪽을 골라도 이 워커가 머지하는 일은 없다. 머지 실행은 상위
        세션의 몫이고, master 머지는 그중 리더의 통합 단계에서만 일어난다.

        이 질문에는 문이 둘이다. 터미널의 사용자도 같은 결정을 동시에 내릴
        수 있고, 사용자가 먼저 답하면 상위 세션의 답은 성립하지 않는다 — 그때는
        질문이 닫혔다는 통지가 상위 세션에 간다. 충돌하면 사용자 지침이 이긴다.
        그러니 상위 세션은 답할 수 있으면 지금 답하고, 근거가 없으면 추측하지
        말고 abstain으로 넘긴다.
      from:
        - {role: worker, scope: ancestor}
        - {role: leader, scope: ancestor}
        - {role: leader, scope: sibling}
      otherwise: human
      timeout: 1800
      options: &landing_review_options
        request: {outcome: ok, description: 지금 상위 세션에 통합 요청 — 먼저 통합 대상 브랜치로 rebase해 최신화한 뒤 증거 묶음을 만들어 올린다(머지 실행은 상위 세션)}
        hold: {outcome: hold, description: 브랜치 동결(추가 커밋 없음) — 통합은 나중에}
    prompt: &landing_review_prompt |
      착지 여부를 상위 세션에 물었다(아래 질문). 워커는 이 결정을 사용자에게
      올려 세워 두고 기다리지 않는다 — 질문이 상위에게 나가 있다는 사실과,
      사용자가 원하면 `claunch cflow2 select`로 직접 답할 수 있다는 한 줄만
      보고에 남긴다. 결과는 상위(또는 사용자)의 답 그대로다: request면 ok,
      hold면 hold.
    returns:
      ok: {}
      hold: {reason: "str?"}
    effects: [mesh.send]

  landing-review-leader:
    title: 착지 결정 (리더에게 묻는다 — independent)
    # landing-review와 같은 질문이다(문구·선택지는 앵커로 공유). 다른 것은
    # 응답자뿐이다: relation이 independent인 회차의 착지 요청은 부모 워커가
    # 아니라 리더의 착지 큐로 가므로(integration-request의 leader:landing),
    # 그 요청을 올릴지 묻는 질문도 부모 워커를 건너뛰고 리더에게 간다
    # (claunch-yq80p.12). 리더가 없거나 30분 안에 답이 없으면 사람 앞에 선다.
    # 셋째 그룹이 root인 이유(claunch-jdre5): 부모가 리더가 아닌 워커(예: 다른
    # 워커 아래에 선 워커)에게는 루트에 선 리더가 ancestor도 sibling도 아니고
    # collateral이다. 그 편성에서 앞의 두 그룹이 모두 비면 리더가 메시에 있는데도
    # 사람 앞에 서고, 그 ask에는 기한이 없어 런이 무기한 대기한다. root는 메시에
    # 부모가 없는 세션 — 운영자가 직접 띄운 세션 — 만 받으므로 후보가 넓어지지
    # 않고, 순서는 그대로 사슬 → 형제 → 루트다(가까운 쪽이 먼저 답한다).
    # 세 그룹 모두 connect: true다(claunch-u7nu3). 응답자 후보는 이 런과 wire된
    # 멤버뿐인데, 기본 auto_link는 child↔parent·root↔root·reviewer↔worker만
    # 잇는다 — 다른 워커 아래 선 independent 자식은 루트 리더와 이어져 있지
    # 않아 리더가 메시에 있어도 ask가 곧바로 사람 앞에 섰다. connect는 그
    # 역할을 이미 가진 로컬 멤버와의 간선 하나만 만든다(cflow/responders.wire).
    ask:
      prompt: *landing_review_ask
      from:
        - {role: leader, scope: ancestor, connect: true}
        - {role: leader, scope: sibling, connect: true}
        - {role: leader, scope: root, connect: true}
      otherwise: human
      timeout: 1800
      options: *landing_review_options
    prompt: *landing_review_prompt
    returns:
      ok: {}
      hold: {reason: "str?"}
    effects: [mesh.send]

  merge-ready:
    title: 정렬 상태 측정 (merge_ready)
    prompt: |
      통합 대상 대비 이 브랜치의 정렬 상태를 잰다. 판정은 손으로 하지 않는다 —
      상위와 내가 같은 명령으로 같은 답을 얻어야 왕복이 사라진다. 리더의
      preflight가 부르는 것과 같은 스크립트다:
        uv run --no-sync python tools/merge_ready.py --allow-target-advance
      대상은 이 브랜치의 git upstream이고, 없으면 master다. 기준 브랜치가
      master가 아니면(intake의 스택 기준: ${result.intake.value.base}) upstream이
      그것을 가리키는지 먼저 보고, 아니면 `--target <기준>`으로 직접 댄다.
      원격이 있는 편성이면 먼저 대상을 fetch한다(로컬 전용 편성은 불필요).
      종료 코드와 출력 첫 줄을 그대로 반환한다 — 0 ready, 1 re-measure,
      2 cannot tell, 3 rebase, 5 landed(`--landed-exit` 편성). 손으로 친 명령은
      착지 상태를 `ready: landed -- ...`, exit 0으로 답한다 — 출력 첫 줄이 그
      문구면 code를 5로 반환한다. 게이트를 `|| true`로 통과시키지 않는다.
    done_when: |
      tools/merge_ready.py의 종료 코드와 출력 첫 줄, 쓴 대상 브랜치가 보고에 있다.
    # 드라이버가 직접 한다(claunch-onbdf). 읽기 전용 headless 위임에서는 쓰기
    # 도구와 함께 Bash·MCP도 막혀 이 단계의 셸 명령·MCP search가 돌지 않았다
    # (시험 런에서 실패하거나 검색 없이 끝났다). 그 실행기는 claunch-xjbrh에서
    # 제거됐다.
    executor: [inline]
    returns:
      ok: {code: int, verdict: str, target: str, output: str}
    effects: [fs.read]

  rebase:
    title: 정렬 (요청 전 — rebase, 또는 프리뷰 머지 위 재측정)
    prompt: |
      측정 결과: 종료 코드 ${result['merge-ready'].value.code} —
      `${result['merge-ready'].value.verdict}` (대상 ${result['merge-ready'].value.target}).
      일반적인 pull request 워크플로우와 같다 — 요청은 정렬 후에 한다.
      통합 대상 브랜치(상위 세션이 머지할 브랜치: 상위가 리더면 master,
      상위가 워커면 그 워커의 브랜치)가 내 브랜치의 분기점 이후 앞으로
      움직였으면 여기서 처리한 뒤 요청한다. 원격이 있는 편성이면 먼저
      대상을 fetch한다(로컬 전용 편성은 불필요).

      판정은 손으로 하지 않는다 — 위 측정은 리더의 preflight가 부르는 것과
      같은 스크립트(`uv run --no-sync python tools/merge_ready.py
      --allow-target-advance`)의 답이고, 정렬 뒤에는 같은 명령으로 다시 잰다.
      대상은 이 브랜치의 git upstream이고, 없으면 master다. 부모가 중간
      워커여서 대상이 master가 아니면 지금 한 번 적어 둔다 —
      `git branch --set-upstream-to=<기준>` — 이 한 줄이 없으면 게이트는
      master를 묻고, 내가 착지하지도 않을 브랜치 위로의 재정렬을 요구한다.
      (`--target <기준>`으로 직접 대도 되지만, 게이트는 워크플로우에 박힌
      고정 문자열이라 그 자리에는 기준을 쓸 수 없다.)

      ── 답은 넷(편성에 따라 다섯)이고, 셋만 내 일이다 ──
      · ready(0) — 대상이 이미 내 브랜치에 들어 있거나(behind=0), 재측정이
        끝났거나, 내 프리뷰가 남아 있고 프리뷰→현재 착지 diff의 파일 목록과
        stable patch-id가 이전 대상→현재 대상 diff와 같다. 마지막 경우는
        기준선 이동을 정상으로 받아들이며 프리뷰가 없으면 이 예외를 쓰지
        않는다. 전체 스윕 실패를 이 대조로 별건 처리하려면 대상·브랜치 변경은
        각 merge-base에서 읽고, 실패 테스트의 import 모듈과 파일 교집합을
        먼저 확인하며 겹치는 경우 함수 단위까지 확인한다.
      · rebase(3) — 미리 병합이 텍스트로 충돌한다. 이것만이 재정렬을
        강제하는 근거다:
          git rebase <대상>
        충돌이 나면 대상이 정한 방향을 먼저 읽고 그 위에 내 변경을 얹어
        해결한다 — 충돌을 지웠다고 보고하지 않는다. 재정렬 후에는 표적
        테스트를 다시 돌려 그 수치와 새 tip 해시를 보고에 남긴다(표적
        테스트를 생략한 일감은 아래 「생략한 일감」 절대로 한다).
      · re-measure(1) — 대상은 움직였지만 병합은 깨끗하다. 브랜치는
        문제없이 합쳐진다; 낡은 것은 **증거**다. 내 표적 수치는 내 base
        에서 쟀고, base가 움직였으면 그 수치는 실제로 착지할 트리를 설명
        하지 않는다. 「충돌 없음」은 텍스트가 안 겹쳤다는 말일 뿐이고
        의미 충돌에는 아무 말도 안 한다 — 이 저장소의 실례가 90a07a9다
        (한 브랜치가 tools/ 게이트 전부에 규칙을 세우는 동안 master가
        그 규칙을 안 지키는 다섯째 게이트를 들여왔다. 다른 파일이라
        merge-tree는 깨끗했고, 합친 트리는 빨갰다).
        여기서 재정렬은 선택지 중 하나일 뿐이다. 더 싼 쪽이 있고 상위도
        그것을 받는다 — 실제로 일어날 머지를 만들어 그 위에서 다시 재면
        브랜치 자체는 안 움직이므로 리뷰어가 승인한 tip이 그대로 착지한다:
          git worktree add --detach <tmp> <대상>
          git -C <tmp> merge --no-ff <브랜치>
          uv sync --extra test --directory <tmp>
          uv run --directory <tmp> --no-sync python tools/changed_tests.py --repo <tmp> --base <대상>
          git update-ref refs/claunch/preview/<브랜치> $(git -C <tmp> rev-parse HEAD)
        가운데 두 줄이 측정이고, 수치는 보고와 코멘트에 옮긴다. `--repo <tmp>`를
        빼면 changed_tests는 데몬에게 이 세션의 체크아웃을 물어 그 트리를
        잰다 — `cd <tmp>` 뒤에 그냥 돌린 실행은 세션 트리의 영수증을 재사용하거나
        세션 트리를 다시 돌리고, 둘 다 프리뷰를 녹색으로 다시 잰 것처럼 보인다
        (claunch-873ys; 그 경우 changed_tests가 `WARNING: the working directory
        is in another work tree`를 낸다). `uv sync`를 빼면 <tmp>에 환경이
        없어 changed_tests가 거절한다(claunch-7sj).
        마지막 줄이 요점이다: 게이트는 그 ref의 두 부모가 정확히 내 tip과
        대상 tip인지만 본다. 대상이 또 움직이면 부모가 안 맞아 판정이 저절로
        re-measure로 돌아온다 — 아무도 안 보고 있을 때 기준선이 낡는 그
        순간이 바로 그 자리다. 게이트가 증명하는 것은 그 트리가 존재했고
        무엇과 무엇을 합쳤는가까지다; 거기서 테스트를 정말 돌렸는지는
        여전히 내 말이고 상위가 심사한다. 그러니 수치를 지어내면 그것은
        게이트를 속이는 것이 아니라 심사를 속이는 것이다.
      · cannot tell(2) — 대상 브랜치가 없거나 저장소를 못 읽었다. 게이트를
        `|| true`로 통과시키지 말고 무엇이 안 읽혔는지 적는다.
      · landed(5) — 대상이 이미 내 tip을 머지로 담고 있다(내 tip이 대상의
        머지 커밋의 둘째 부모 쪽에 있다). 이 코드는 게이트를
        `--landed-exit`로 부르는 편성에서만 나온다(이 저장소의 v1 프로젝트
        레이어가 게이트와 착지 대기 프로브를 그렇게 부른다).
        손으로 친 위 명령은 같은 상태를 `ready: landed -- ...`, exit 0으로
        답한다 — 출력 첫 줄이 그 문구면 같은 상태다. 커밋 없이 자른
        브랜치는 대상이 앞으로 가도 5가 아니다: 그 tip은 대상 자신의
        first-parent 줄 위에 있어 `ready: nothing to land -- ...`, 0으로
        답한다(claunch-gzi50). 그 경우 실을 것이 없다는 뜻이고, 그 판단은
        landing 스텝의 델타-0 갈래(escalate)가 맡는다. 5가 나왔으면 정렬할
        것도 재측정할 것도 없다: 착지한 일을 재측정 요청으로 읽고 여기
        다시 온 것이다(143회차 s753, claunch-dlq0o). 커밋을 더 얹어 게이트를
        초록으로 만들지 않는다.

      ── 표적 테스트를 생략한 일감 (TESTS SKIPPED 마커) ──
      이 브랜치의 일감이 전부 셀프 게이트로 표적 테스트를 생략했으면(이슈마다
      `TESTS SKIPPED @ <해시>:` 코멘트) 재측정할 표적 수치가 처음부터 없다.
      그래서 rebase(3)·re-measure(1)에서도 표적 테스트를 돌리지 않는다:
      · rebase(3) — `git rebase <대상>`과 충돌 해결은 그대로 한다. 충돌을
        풀며 내 변경에 동작을 바꾸는 줄이 들어갔으면 생략 판정이 더는
        서지 않는다 — 그때는 표적 테스트를 돌리고 그 수치를 보고한다.
        아니면 새 tip 해시와 「tests: skipped (마커 유지)」를 보고한다.
      · re-measure(1) — 위의 프리뷰 머지에서 측정 두 줄(`uv sync`,
        `changed_tests.py`)을 빼고 머지와 `git update-ref` 줄만 실행한다.
        게이트는 그 ref의 두 부모만 보므로 ready로 바뀐다. 보고와 코멘트에는
        프리뷰 머지 해시와 「표적 측정 생략(TESTS SKIPPED 마커)」을 적는다 —
        측정하지 않은 트리에 수치를 붙이지 않는다.
      배치에 표적 테스트를 돌린 일감이 하나라도 있으면 이 절을 쓰지 않고 위의
      일반 절차대로 그 일감의 수치를 다시 잰다.

      ── 재요청 ──
      상위의 재요청(rebase 재요청이면 미리 병합이 충돌한다는 것, 재측정
      요청이면 기준선이 움직였다는 것)으로 여기 왔으면 브랜치를 동결 해제하고
      게이트가 ready라고 답할 때까지 정렬한 뒤 갱신된 증거 묶음으로
      재요청한다 — PR 워크플로우처럼 재요청은 정렬 후에 간다.


      ── 스택 위에서 (restack) ──
      부모가 스택을 둔 워커면 대상은 intake에서 적은 기준 브랜치(부모의
      스택 브랜치 또는 선행 자식 브랜치)다. 부모가 restack 공지를 보내면(다른
      자식이 베이스에 착지해 tip이 움직였다, 또는 베이스가 master 위로
      재정렬됐다) 이 단계를 다시 밟는다: `git rebase <기준>` — 베이스에
      --no-ff로 이미 실린 커밋은 upstream에 있으므로 rebase가 건너뛰고 내
      커밋만 다시 얹힌다. 재확인 후 요청을 이미 올렸으면 갱신된 묶음으로
      재요청하고, 아직이면 새 기준 tip을 보고에 적어 둔다.

      ── 스택 컷을 실은 브랜치 ──
      이 회차 브랜치에 stack-merge의 머지 커밋이 있으면 재정렬은 `git
      rebase --rebase-merges <대상>`으로 한다. 옵션 없는 rebase는 머지
      커밋을 펼쳐 자식들의 커밋을 한 줄로 늘어놓는다 — 트리가 사라지고,
      stack 런이 착지 뒤 스택을 옮길 때 기준으로 쓰는 컷 tip도 더는 이
      브랜치에서 찾을 수 없다.

      ── 스택이 서 있을 때: 옛 tip을 보고에 싣는다 ──
      이 단계가 회차 브랜치를 다시 썼으면(rebase) 보고의 old_tip에 rebase 전
      tip(전체 SHA)을 싣는다. 엔진이 old_tip과 tip이 다르면 stack 런에
      `rebased` 신호를 보내고, stack 런이 스택 브랜치를 새 tip 위로 옮긴 뒤
      stacked 자식들에게 새 tip과 `git rebase --onto` 명령을 알린다 — 그 통지를
      손으로 보내지 않는다. 다시 쓰지 않았으면(ready였거나 프리뷰 재측정)
      old_tip을 비운다.
    done_when: |
      tools/merge_ready.py가 ready(0)라고 답하고, 그 답에 이르기까지 한
      일이 보고에 있다: 처음부터 ready였으면 그 사실 한 줄, 충돌이었으면
      rebase(충돌 해결 포함)와 재확인한 표적 수치·새 tip 해시, 기준선이
      움직였을 뿐이었으면 재정렬했는지 프리뷰 머지 위에서 재측정했는지와
      그 수치, 그리고 프리뷰라면 남긴 ref와 그 머지 커밋 해시. 표적 테스트를
      생략한 일감이면 수치 대신 TESTS SKIPPED 마커가 유지되는지와 그 근거.
      master는 건드리지 않았다.
    returns:
      ok: {tip: str, action: str, tried: list, old_tip: "str?"}
    effects: [git.rebase, git.commit, fs.write, test.run, board.write]
    # 회차 브랜치가 다시 쓰였으면 stack 런에 알린다(claunch-yq80p.9): 스택
    # 브랜치가 옛 tip 위에 서 있으므로 옮기고 stacked 자식에게 통지한다.
    do:
      - push: {to: signals, item: {name: "'rebased'", tip: "$result.rebase.value.tip",
                                   from: "$result.rebase.value.old_tip"}}
        when: >-
          $outcome == 'ok' and side('stack').live and $result.rebase.value.old_tip != null
          and $result.rebase.value.old_tip != $result.rebase.value.tip

  reviewer-ensure:
    title: 리뷰어 확보 (없으면 자식 리뷰어를 세운다)
    prompt: |
      다음 스텝(peer-review)의 질문이 리뷰어에게 갈 수 있는지 먼저 잰다:

          claunch cflow2 responders peer-review --role reviewer

      종료 코드가 판정이다 — 0이면 reviewer 그룹 중 하나가 답할 세션에
      닿는다(자식 리뷰어, 형제 리뷰어, 조상 리뷰어 순서), 1이면 아무
      그룹도 닿지 않는다, 2이면 재지 못했다(이 디렉터리에 v2 런이 없음,
      roster 무응답, 세션이 팀 메시 여럿에 있는데 런이 메시를 지정하지 않음 등).

      · 0 — 할 일이 없다. 출력(어느 그룹이 누구에게 닿는지와 그 관계)을
        보고에 옮기고 넘어간다. 이 런이 앞 회차에 세운 자식 리뷰어가
        살아 있으면 여기서 0이 나오고, 그 리뷰어를 그대로 다시 쓴다.
        예외: 시작 입력 reviewer_profile·reviewer_harness 중 하나라도
        있는데 0이 형제·조상 리뷰어로만 닿으면(자식 리뷰어 그룹이 비어
        있으면) 그 리뷰어는 사람이 고른 profile로 서 있지 않다 — 1과 같이
        자식 리뷰어를 세운다. peer-review는 자식 리뷰어를 먼저 묻는다.
      · 1 — 자식 리뷰어를 세운다. `children`으로 남은 슬롯을 본 뒤
        MCP `spawn`(또는 `claunch spawn`)에:
          handle: <내 세션>-rev  (이미 있으면 -rev2처럼 순번)
          role: reviewer
          workflow: '-'   (내 짝 default_child_cflow는 improv-worker-v2이고
                          그 filter_roles가 reviewer를 받지 않는다)
          no_issue: true  (리뷰어는 일감을 갖지 않는다 — 보드의 산출물을
                          만들지 않는 세션이다)
          fork 없음, worktree 없음 (내 대화를 물려받은 리뷰어는 독립된
                          눈이 아니다; 읽기만 하므로 체크아웃도 필요 없다)
          profile: 시작 입력 두 개로 정한다 — reviewer_profile
                   「${data.inputs.reviewer_profile}」, reviewer_harness
                   「${data.inputs.reviewer_harness}」(claunch-gqgcz).
                   둘 다 있으면 `<profile>:<harness>`, profile만 있으면
                   `<profile>`, harness만 있으면 `:<harness>`(데몬이 내
                   profile에 그 harness를 붙인다), 둘 다 비었으면 이 필드를
                   넣지 않는다(내 profile·harness를 물려받는다). 그 밖의
                   이유로 profile을 고르지 않는다. `harness` 필드는 쓰지
                   않는다 — 데몬이 거절한다.
          task: 아래 문안
        task 문안(그대로 쓰되 <> 안을 채운다):
          너는 <내 세션>의 리뷰어다 — 이 세션이 너를 세운 이유는 리뷰
          하나다. <내 세션>의 cflow 런이 peer-review에서 질문(decide)을
          보내면 `asks`로 열어 보고, 보드(`claunch beads comments <이슈>`)와
          브랜치(`git log/diff <base>..<tip>`)를 직접 읽어 판정한다 —
          목표 달성, 범위 이탈, 표적 테스트가 목표를 덮는가. 판정은 보드에
          `REVIEWED: pass @ <tip>` 또는 `CHANGES REQUESTED: <무엇을>`으로
          남기고 `answer`로 답한다. 코드 수정·커밋·머지·이슈 생성은 하지
          않는다; 테스트를 돌려야 하면 `$CLAUNCH_SCRATCH` 아래에 detached
          worktree를 만들어 거기서 돌린다. 질문이 없을 때는 기다린다 —
          같은 런의 다음 리뷰도 네게 온다.
        스폰 뒤 같은 명령을 다시 돌려 0을 확인한다(자식은 부모와 연결된
        채 태어나므로 배선할 것이 없다). 스폰이 정책으로 거절되면
        (`spawn.<키>`) 재시도하지 않는다 — 거절 문구를 보고에 옮기고
        넘어간다: peer-review는 리더에게 가거나 리뷰 없이 통과한다.
        profile을 넣은 스폰이 `spawn.allow_profile`로 거절됐을 때도
        같다: profile 없이 다시 세우지 않는다(시작 입력은 사람이 고른
        리뷰어다 — 다른 리뷰어로 바꾸는 것은 사람의 몫이다). 이슈에
        `REVIEWER PROFILE REFUSED: <selector> — <거절 문구>`를 남기고,
        보고에 그 문구와 「~/.claude-launcher/.claunch.yaml의 spawn.allow_profile을 켜거나
        시작 입력을 비우면 선다」를 적는다. profile·harness 이름이 틀려
        400으로 거절되면 그 문구도 같은 방식으로 남긴다.
        스폰한 리뷰어의 profile·harness(`children` 출력의 그 행)를 보고에
        적는다 — 시작 입력이 실제로 적용됐는지 되짚을 근거다.
      · 2 — 재지 못한 것은 없는 것이 아니다. 출력이 `several meshes`면
        리뷰어가 있는(또는 세울) 메시를 런에 지정한다 — `claunch cflow2 mesh
        <메시>` — 그리고 다시 잰다(claunch-5itbf; 런의 질문은 그 메시로
        나간다). 그 밖이면 한 번 더 재고, 그래도 2면 출력 그대로 보고에
        남기고 스폰 없이 넘어간다. 넘어간 peer-review가 명단을 못 읽으면
        review-unrouted 선택으로 온다.

      이 런이 세운 자식 리뷰어는 런이 끝날 때까지 산다 — 재리뷰(changes
      → work → … → peer-review)와 다음 회차의 리뷰에 다시 쓴다. 끝내는
      자리는 settle-check다(queue-recheck가 done을 낸 뒤라 남은 리뷰가
      없다). 거기서 끝내지 못한 리뷰어는 데몬이 종료한다 — 런이 done이
      된 뒤 이 세션을 끝내기 직전(kill-on-end, claunch-du6mx.1), keep-alive나
      사람의 재기동으로 이 세션이 남을 때도 런이 done이면 그때, 그리고 이
      세션이 런 done 이외의 이유(kill, wind-down, 크래시)로 끝날 때다
      (claunch-472wq.1; hold·pause·데몬 재기동은 종료가 아니라 리뷰어도
      남는다). 직속 자식이고 메시 role이 reviewer인 세션만이다. 메시에 속해 있지 않은 단독
      세션이면 1이 나오고, 스폰이 너와 자식 둘만의 메시를 연다 — 그
      리뷰어에게도 질문은 그대로 닿는다.
    done_when: |
      `claunch cflow2 responders peer-review --role reviewer`의 출력과 종료
      코드가 보고에 있다. 1이었으면 스폰한 자식 리뷰어의 세션·핸들과
      스폰 뒤 다시 잰 출력(0)이, 또는 스폰 거절 문구가 함께 있다.
      시작 입력 reviewer_profile·reviewer_harness가 있었으면 넘긴 selector와
      스폰된 리뷰어의 profile·harness(또는 거절 문구)가 있다.
    returns:
      ok: {code: int, reviewer: "str?", profile: "str?"}
    effects: [session.spawn]

  peer-review:
    title: 동료 리뷰 (리베이스 후, 요청 직전)
    # 응답자는 위계 순서로 찾는다(claunch-zgidu): reviewer는 [descendant,
    # sibling(connect), ancestor], 그다음 직속 부모 워커, 그다음 leader는
    # [ancestor, sibling]. 아무도 답하지 않으면 pass로 무응답 통과
    # (self:pass) — bare self는 워커에게 선택을 돌려 교착을 만든다(claunch-wdzd).
    # timeout 900이 안전장치다: 응답자가 받아 놓고 침묵해도 런이 굳지 않는다.
    ask:
      prompt: |
        이 메시의 워커 하나가 한 회차의 목표를 자기 브랜치에 커밋했고
        표적 테스트가 green이다(또는 셀프 게이트로 생략했다). 착지 요청을 올리기 전에 동료 판정을
        구하는 자리다 — 통과인가, 고칠 것이 있는가?

        질문을 보낸 세션이 그 워커다. 심사할 이슈와 브랜치는 이 회차가
        확정한 값이다:
          주 이슈: ${data.claim.issue}
          브랜치: ${result['branch-setup'].value.branch}
          이 브랜치에 함께 실린 이슈: ${result['items-pass'].value}
        주 이슈는 이 회차가 처음 잡은 일감이고, 아래 「함께 실린 이슈」는
        같은 회차가 같은 브랜치에 배치로 더 실은 일감이다(claunch-7r1qr).
        이 값은 `items-pass` 노드의 것이다 — 그 노드는 회차마다 완료되므로
        앞 회차의 목록이 여기 남지 않는다(claunch-0adj8: `result['items']`는
        일감 루프가 돈 회차에만 값이 있고, stack-only 회차에는 앞 회차 값이
        그대로 남았다).
        그 값이 `[]`면 이 회차는 단일 일감이다 — 심사 범위는 주 이슈 하나다.
        비어 있지 않으면 **그 전부가 이번 심사 범위**다: 각 항목의 `issue`가
        이슈 id이고 `n`은 그 배치에서의 순번이다. 항목마다 그 커밋이 그
        이슈의 목표를 달성했는지 따로 보고, 판정 코멘트도 이슈마다 남긴다
        (아래 판정 절). 하나라도 판정 밖에 두면 그 커밋은 심사 없이
        in_review로 간다 — ask가 그 목표를 단수로만 말하던 때 실제로 그렇게
        읽혔다(claunch-peer-review-batch-scope-x05sq).
        이 id들을 그대로 쓴다. 보드 목록에서 고르지 않는다 — 같은 세션이
        다른 이슈(HOLD된 앞 회차 이슈 등)를 in_progress로 쥐고 있을 수 있고,
        재정렬 뒤 다시 묻는 회차에는 이 회차 이슈가 이미 in_review다
        (claunch-106mn). 위 줄이 `${...}` 그대로 보이면 이슈 없는 회차이거나
        값이 아직 없다는 뜻이다 — 그때만 그 세션이 assignee인 항목을
        `claunch beads list --status in_progress --status in_review
        --json`에서 찾고, 후보가 둘 이상이면 추측하지 말고 abstain한다.
        근거는 보드와 브랜치에 있다: `claunch beads comments <id>`
        (목표·범위·브랜치·해시·수치)와 `git log --oneline <base>..<tip>`,
        `git diff <base>..<tip>`.

        보는 것은 셋이다: 커밋이 그 목표를 실제로 달성했는가, 범위 밖을
        건드리지 않았는가, 표적 테스트가 그 목표를 실제로 덮는가. 워커가
        표적 테스트를 셀프 게이트로 생략했으면(이슈에 `TESTS SKIPPED @
        <해시>:` 코멘트) 셋째 대신 그 생략이 정당한지를 본다 — diff의 모든
        파일이 동작을 바꾸지 않는 종류(스타일·문구·문서·주석)이고, 그
        파일을 이름으로 부르는 테스트가 없는가(`grep -rl "<파일 이름>"
        tests/`). 동작을 바꾸는 줄이 하나라도 보이면 CHANGES REQUESTED에
        「표적 테스트 필요: <파일>」을 적는다. 스타일과
        취향은 여기서 다루지 않는다 — 이 문이 막는 것은 잘못된 변경이지
        다른 변경이 아니다.

        판정은 이 답과 별개로 네가 보드에 남긴다:
        `claunch beads comments add <id> "REVIEWED: pass @ <tip>"` 또는
        `claunch beads comments add <id> "CHANGES REQUESTED: <무엇을>"`.
        **이슈마다 남긴다** — 주 이슈와 「함께 실린 이슈」의 각 id에 각각
        한 줄씩이다. 코멘트가 주 이슈에만 남으면 나머지 이슈는 판정 기록
        없이 in_review로 가고, 그 이슈를 맡을 다음 사람은 그 커밋이 심사된
        적이 있는지 보드에서 알아낼 수 없다. 묶음이 여럿인 회차에서는 그
        이슈 목록을 첫 줄에 `batch: <id1,id2,...>`로 적어 두면 어느 판정이
        같은 심사인지 보드에서 이어진다(통합 요청의 표기와 같다).
        고칠 것을 고르면 무엇을 고쳐야 하는지가 그 코멘트에 있어야 한다 —
        선택지만으로는 워커가 무엇을 할지 모른다. 상태는 건드리지 않는다:
        이슈는 지금 상태(in_progress, 재요청 회차면 in_review) 그대로이고,
        표를 움직이는 것은 워커의 착지 요청이다.

        근거를 못 읽었으면 추측하지 말고 abstain으로 넘긴다. 기권은 다음
        그룹으로 넘어가고, 아무도 답하지 않으면 리뷰 없이 통과한다 — 그
        경우 방어선은 리더의 통합 후 전체 스윕이다.
      from:
        - {role: reviewer, scope: descendant}
        - {role: reviewer, scope: sibling, connect: true}
        - {role: reviewer, scope: ancestor}
        - {role: worker, scope: ancestor}
        - {role: leader, scope: ancestor}
        - {role: leader, scope: sibling}
      otherwise: "self:pass"
      # 메시 명단을 읽어 낼 수 없어서(세션이 팀 메시 여럿에 있고 런이 메시를
      # 지정하지 않음, 메시 소속 없음, 데몬 무응답) 아무 그룹도 찾아보지 못한
      # 경우는 「응답자 없음」과 다르다 — self:pass로 조용히 통과하지 않고
      # unrouted로 끝나 review-unrouted 선택(에이전트)으로 간다(claunch-5itbf).
      on_unroutable: unrouted
      timeout: 900
      options:
        pass: {outcome: ok, description: 리뷰 통과 — 상위 통합 요청으로 간다}
        changes: {outcome: changes, description: 고칠 것이 있다(무엇을 고칠지는 보드의 CHANGES REQUESTED 코멘트다)}
    prompt: |
      이 단계는 네가 답하는 자리가 아니다 — 질문은 리뷰어에게(없으면 상위
      리더에게) 나가 있다. 네가 할 일은 답할 사람이 읽을 것을 갖춰 두고
      턴을 끝내는 것이다.

      이 자리가 리베이스 바로 뒤인 것이 요점이다: 리뷰어가 보는 트리가
      상위가 머지할 트리와 같아야 한다. 그래서 네가 남길 `REVIEWED: pass
      @ <hash>`와 다음 단계의 `LANDING REQUEST @ <hash>`는 같은 해시다 —
      다르면 그 사이에 뭔가 커밋된 것이고, 그건 리뷰를 안 거친 변경이다.

      갖출 것은 commit과 rebase 단계에서 이미 만들었다: 목표·범위, 브랜치,
      커밋 해시, 표적 테스트 수치, 그리고 리베이스가 있었으면 재정렬 후
      tip과 재확인 수치. 그 묶음이 없으면 지금 만든다 — `claunch beads
      comments add <id> -f <파일>`. 답하는 세션은 네 런 상태를 읽지
      않는다; 보드와 브랜치가 그가 보는 전부다.

      메시에 속해 있으면 nudge 한 줄만 보낸다: `<id> 리뷰 요청 —
      <브랜치> @ <tip>, 근거는 코멘트에.` 같은 내용을 본문에 다시 싣지
      않는다. 그리고 기다리지 않는다 — 질문이 누구에게 나가 있는지 한
      줄만 보고에 남기고 턴을 끝낸다.
    returns:
      ok: {}
      changes: {what: "str?"}
      unrouted: {reason: str, ask: "str?", mesh: "str?", meshes: "list?"}
    effects: [board.write, mesh.send]

  integration-request:
    title: 상위 통합 요청 (머지는 상위 세션 전권)
    prompt: |
      이 단계는 통합을 요청하는 단계다 — 머지를 실행하는 단계가 아니다.
      요청 대상은 시작 입력 relation(=${data.inputs.relation})이 정한다.
      stacked면 자신을 스폰한 상위 세션이다: 상위가 리더면 master 통합
      심사 요청(머지는 리더 워크플로우의 통합 단계), 상위가 워커면 내
      브랜치를 그 워커의 스택 브랜치에 --no-ff로 머지해 달라는 요청(실행은
      상위 워커의 stack 런 — 트리 구조가 한 단계씩 위로 접힌다). 상위가
      병합할 수 없으면(종료됐거나, 구동하는 런이 없거나, 그 런에 착지 큐가
      없으면) 대상은 그 위 직계 조상 중 병합할 수 있는 가장 가까운 세션이고,
      그런 조상도 없으면 mesh 리더다(이 세션이나 조상의 형제인 리더 — 부모가
      워크플로 없는 free-role 루트면 그 옆 루트 리더다).
      independent면 리더다(부모 워커를 건너뛴다): 착지 큐 레코드는 엔진이
      `leader:landing`으로 넣고, 부모 워커에게는 fyi 한 줄(이슈 id·tip)만
      보낸다 — 부모는 상태만 본다. 증거 묶음의 「상위 브랜치」는 master다.
      **이 스텝에서는 요청 nudge를 보내지 않는다.** 대상을 정하는 라우팅은
      데몬이 이 스텝을 떠날 때 한다(아래 leave trigger). 그래서 이 스텝 안에서는
      요청이 어느 세션의 큐에 실릴지, 실리기는 할지 알 수 없다 — 여기서 부모에게
      보낸 nudge는 큐를 갖지 않은 부모에게 가고, 라우팅이 skip이어도 아무도
      모른다(claunch-g0ttr.1, s332: 부모 s325에 nudge를 보낸 41초 뒤
      trigger_skipped가 저널에만 남았다). 데몬은 라우팅을 끝내면 이 세션
      터미널에 `landing request routed` 블록을 타이핑한다: `result: queued`면
      큐를 가진 세션(부모가 아니면 `fell back to '<세션>'`이 그 세션을
      적는다), `result: NOT queued`면 실리지 않은 사유다. 요청 nudge는
      await-landing의 첫 nudge(landing-nudge)가 그 블록을 읽고 보낸다.
      첫 행동은 보드다 — 요청의 본체는 코멘트이고 메시지는 그것을 가리키는
      nudge다: `claunch beads update <id> --status in_review` 와, 아래 증거
      묶음을 담은 `claunch beads comments add <id> -f <파일>` (그 코멘트의 첫
      줄은 `LANDING REQUEST @ <tip>`). 이 회차의 착지 매체가 pr이면
      (medium=${data.landing.medium}, pr=${data.landing.pr_url}) 마커 뒤에
      ` pr: <url>`을 붙이고, tip은 전체 40자 SHA와 원격 ref로 적는다:
      `LANDING REQUEST @ <sha> @ <remote>/<브랜치> pr: <url>` — 상위가 다른
      머신이어도 같은 커밋을 fetch로 확인할 수 있게 한다(docs/remote-commit-
      protocol.md). medium이 local이고 그 이유가 PR 불가였으면 묶음에 그
      이유를 한 줄 적는다. 상위의 통합 대기 표는 이 in_review
      목록이고, 이 전이가 없으면 요청은 표에 없다. rebase 재요청을 받아
      재정렬한 뒤에는 같은 전이와 새 마커 코멘트를 다시 낸다(상위가
      in_progress로 되돌려 두었다).
      ── 배치 회차(이 브랜치에 실린 일감이 둘 이상) ──
      실린 이슈 **전부**를 in_review로 전이한다 — 하나라도 in_progress로
      남으면 그 일감은 표에 없고, 머지 뒤 닫을 자격도 그 이슈에는 서지
      않는다. 증거 묶음은 주 이슈(오프닝의 `issue: <id>`) 코멘트 하나에
      담고 그 첫 줄은 `LANDING REQUEST @ <tip> batch: <id1,id2,...>`다.
      나머지 이슈에는 한 줄만 남긴다: `LANDING REQUEST @ <tip> (batch of
      <주 이슈 id>)`. 리더는 같은 tip의 행들을 후보 하나로 읽는다 —
      묶음을 이슈마다 복사하지 않는다. 뒤의 요청 nudge도 하나이고 첫 줄에 id
      목록을 싣는다.


      증거 묶음은 그 코멘트에 담는다 — 상위가 심사하는 자리가 거기다:
      - 리뷰 판정이 누구에 의한 것인지 — flow_status의
        `result['peer-review'].value.by`를 본다. 응답자의 핸들이면 묶음에
