      - rebase했으면 그 사실과 rebase 전후 tip 해시, 재확인된 표적
        테스트 수치(생략한 일감이면 마커 유지 여부)
      - 이 브랜치가 다른 세션의 브랜치를 포함하면(git branch --contains)
        함께 실리는 작업이 무엇인지 명시 — 하위 워커 브랜치를 --no-ff로
        모은 회차면 어느 자식의 어떤 브랜치가 어떤 머지 커밋으로
        실렸는지 트리 구조를 그대로 적는다
      - 시뮬레이션(시작 입력 simulation=${data.inputs.simulation}이 off가 아니면,
        claunch-qrh0a): `시뮬레이션: <sim_id> run <run_seq> — <assessment>
        (findings <findings>, open <미결 수>)` 한 줄. 값은 ${data.sim}이다.
        advisory면 미결이 있어도 착지를 막지 않으므로 미결 수를 그대로 적는다.
        실행할 수 없었으면 「시뮬레이션: unavailable — <사유>」라고 적는다
      - 스택 위치(부모가 스택을 둔 워커면): 기준 브랜치와 요청 시점의 그 tip
