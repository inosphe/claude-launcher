cflow: 2
name: oneshot-job-v2
description: >-
  일회성 job — 이 세션을 만든 오프닝 태스크 하나를 수행하고 결과를 넘긴 뒤,
  에이전트가 남은 일이 없다고 판정하면 런이 끝(done)에 닿고 데몬이 세션을 종료한다.

# 왜 이 워크플로가 있는가 (claunch-pbh7k)
# session 실행기의 자식(예: improv-worker-v2의 round-report)은 런 없이
# (`workflow: "-"`) 떠서 결과를 제출한 뒤에도 끝나지 않았다. 데몬의 v2
# kill-on-end(daemon/cflow_clock._scan_v2_ends)는 세션의 main 런이 done일
# 때만 그 세션을 끝내므로, 런이 없는 자식에게는 닿지 않는다. 위임 노드가
# `session_workflow: oneshot-job-v2`를 선언하면 자식이 이 런을 받아 뜨고,
# 아래 finish에서 done을 고르는 순간이 그 세션의 끝이 된다.
#
# 시작 입력 셋은 위임을 받은 자식에게 데몬이 채운다(daemon/cflow2_exec
# .DELEGATION_INPUTS). 사람이 이 워크플로로 직접 세션을 띄우면 비어 있고,
# 그때 일감은 오프닝 태스크 그 자체다.
#
# 이 런을 도는 세션의 메시 역할(claunch-imo9c). 위임 자식의 핸들은 `sN`이라
# 선두 단어로 역할이 추론되지 않고, 선언이 없으면 어휘의 기본값(free-role)으로
# 떨어진다 — 「아무도 네게 일을 주지 않았다」는 뜻의 역할을, 브리프 하나를 받은
# 세션이 달고 서 있게 된다. 그래서 런이 스스로 역할을 밝히고,
# `cflow2_exec.spawn_body`가 그 값을 스폰 본문에 실어 자식이 그 역할로 조인한다
# (`session_workflow_role`). pack: prompt_packs/role-oneshot.md.
default_role: oneshot
inputs:
  delegation:
    type: string
    label: 위임 id
    help: 이 job이 처리하는 부모 런의 위임(d1, d2, ...). 직접 띄운 job이면 비운다
    default: ""
  delegation_scope:
    type: string
    label: 위임한 런의 scope
    help: 부모 세션의 런 slot(예 s15@main). 직접 띄운 job이면 비운다
    default: ""
  delegation_cwd:
    type: string
    label: 위임한 런의 디렉터리
    default: ""

nodes:
  job:
    title: job 수행과 결과 전달
    prompt: |
      이 세션의 일감은 오프닝 태스크 하나다. 그 밖의 일은 받지 않는다 — 이
      세션은 그 일이 끝나면 종료되는 일회성 세션이다.

      위임: 「${data.inputs.delegation}」 / 런: 「${data.inputs.delegation_scope}」 /
      디렉터리: 「${data.inputs.delegation_cwd}」
      · 위임 id가 있으면 오프닝 태스크는 그 위임의 브리프다. 브리프의 작업을
        순서대로 하고, 결과 하나를 브리프가 적은 방법으로 제출한다 — MCP
        `flow_delegate(delegation=<위임 id>, scope=<위 런>, cwd=<위 디렉터리>,
        outcome, value)`, MCP가 없으면 브리프가 적은 영수증 파일. 제출이
        problems와 함께 거절되면 그것을 고쳐 한 번 더 제출한다. 부모 런의
        기록(저널·커밋·보고서 경로)을 읽는 명령에는 브리프대로 그 런의
        scope를 명시한다 — 네 `$CLAUNCH_SESSION`은 그 런의 주인이 아니다.
      · 위임 id가 비어 있으면 오프닝 태스크가 정한 자리(부모에게 보내는
        메시지, 보드 코멘트, 파일)에 결과를 남긴다.
      · 데몬이 위임을 끝냈다는 통지(`[cflow2] delegation ... ended`, 예산
        초과·취소)를 받았으면 그 작업을 멈추고 제출하지 않는다. 그때의
        result는 `ended`다.
      이 런을 끝내는 것이 이 세션을 끝내는 것이므로, 결과를 넘기기 전에는
      아래 finish로 가지 않는다.
    done_when: |
      결과가 넘겨졌다: 위임이면 flow_delegate가 결과를 받아들였다고 답했거나
      (영수증이면 그 파일을 rename까지 마쳤다), 위임이 데몬에 의해 끝났다는
      통지를 받았다. 위임이 아니면 오프닝 태스크가 정한 자리에 결과가 있다.
    returns:
      ok: {summary: str, result: str}

body:
  id: job-loop
  loop:
    while: "true"
    max: 5
    do:
      - job
      - id: finish
        choose:
          chooser: agent
          require_reason: true
          prompt: |
            이 세션을 끝내도 되는지 판정한다. done을 고르면 이 런이 done이 되고,
            데몬이 종결 기록을 남긴 뒤 이 턴이 끝나기를 기다렸다가 세션을
            종료한다(kill-on-end). 사용자에게 「닫아도 될까요」를 묻지 않는다 —
            이 세션은 처음부터 일이 끝나면 닫히도록 만들어졌다.
            셋이 모두 참이면 done이다:
            1. 결과가 넘겨졌다 — job의 done_when. 위임이면 근거는 flow_delegate의
               답이다. 확인이 더 필요하면 그 디렉터리에서 `claunch cflow2 status
               -t <위임한 런의 scope> --json`의 delegations에서 이 위임이 더는
               열려 있지 않은지(accepted·failed·timeout) 본다.
            2. 이 세션이 띄운 백그라운드 명령·서브에이전트가 남아 있지 않다.
            3. 이 세션이 만든 임시 파일을 작업 트리에 남기지 않았다
               (`$CLAUNCH_SCRATCH`는 남겨도 된다).
            하나라도 아니면 again이다 — job으로 돌아가 남은 것을 끝낸다. 무엇을
            확인해 무엇이 나왔는지 reason에 적는다.
          options:
            done:
              description: 결과가 넘겨졌고 남은 일이 없다 — 런을 끝내고, 데몬이 이 세션을 종료한다
              then: {break: job-loop}
            again:
              description: 제출이 거절됐거나 남은 일이 있다 — job으로 돌아간다
              then: {continue: job-loop}
