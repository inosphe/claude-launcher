cflow: 2
name: sample-v2
description: v2 문법 예시 — 조합자, 프로시저, fragment, 규칙, 명세를 한 파일에 담는다

params:
  goal: {type: str, required: true}

# 시작 입력(2.6): 새 세션 폼이 이 선언으로 칸을 그리고, 값은 $data.inputs에 실린다.
inputs:
  reviewer_note:
    type: text
    label: 리뷰 메모
    help: 자체 리뷰에서 특히 볼 것(선택)
    default: ""

# 컬렉션(2.7): 런이 단계에 걸쳐 쌓는 기록. intake가 떠날 때 목표를 하나
# 넣고(do: push), 본문의 wait until이 그 기록이 생겼는지를 엔진이 판정한다.
collections:
  notes:
    kind: queue
    key: topic
    item: {topic: str, text: "str?"}
    status: {values: [open, done], initial: open, settled: [done]}

fragments:
  scope-note: |
    범위 밖의 파일은 고치지 않는다.
  work-header: |
    목표: ${params.goal}
    ${frag:scope-note}

rules:
  no-master-merge:
    text: 워커는 master를 직접 머지하지 않는다.
    why: 통합은 리더가 한다.
    deliver: all
    effect: {deny: git.merge, target: master}

procedures:
  verify:
    params:
      target: {type: str, required: true}
    body:
      retry:
        do: run-tests
        max: 3
        between: fix-tests

nodes:
  intake:
    title: 목표 확인
    prompt: |
      ${frag:work-header}
      목표를 읽고 범위를 정한다.
    effects: [fs.read]
    do:
      - push: {to: notes, item: {topic: "$params.goal", text: "'intake'"}}
  work:
    title: 구현
    prompt: |
      ${frag:work-header}
      피처 브랜치에서 구현하고 커밋한다.
    done_when: 구현이 커밋으로 존재한다
    returns:
      ok: {summary: str}
      blocked: {reason: str}
    effects: [fs.write, git.commit]
  run-tests:
    title: 테스트 실행
    prompt: 변경된 범위의 테스트를 돌린다.
    effects: [test.run]
    executor: [session, inline]
  fix-tests:
    title: 테스트 수정
    prompt: 실패한 테스트를 고친다.
    effects: [fs.write, git.commit]
  lint:
    title: 린트
    prompt: 린트를 돌린다.
    effects: [test.run]
  review:
    title: 자체 리뷰
    prompt: |
      diff를 읽고 문제를 적는다.
      시작할 때 받은 리뷰 메모: ${data.inputs.reviewer_note}
    effects: [fs.read]
  report-blocked:
    title: 막힘 보고
    prompt: 막힌 이유를 리더에게 보고한다.
    effects: [mesh.send]
  wrapup:
    title: 마무리
    prompt: 결과를 정리하고 런을 끝낸다.
    effects: [fs.read]

body:
  seq:
    - intake
    - wait: {until: "count('notes', 'open') > 0", seconds: 60}
    - try: work
      catch:
        blocked: [report-blocked, end]
      finally: review
    - call: verify
      with: {target: "$params.goal"}
    - par:
        branches:
          lint: lint
          review: review
        settle: allSettled
    - choose:
        prompt: 마무리할까?
        chooser: agent
        options:
          done: {description: 끝낸다, then: wrapup}
          again: {description: 한 번 더 구현한다, then: [work, wrapup]}

spec:
  invariants:
    no-master-merge: {never_effect: git.merge, target: master}
  paths:
    review-before-end: {to: end, must_pass: [intake]}
    wrap-before-end: {to: wrapup, must_pass: [run-tests]}
