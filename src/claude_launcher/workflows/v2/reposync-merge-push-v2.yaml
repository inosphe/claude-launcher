cflow: 2
name: reposync-merge-push-v2
description: Sync A — 현재 ref를 검사하고 승인된 통합·게시 후 원격과 로컬 결과를 검증한다
default_role: sync-integrator
filter_roles: {type: whitelist, roles: [sync-integrator]}
inputs:
  assignment: {type: text, required: true, label: 동기화 계획(JSON)}
  execution_error: {type: text, default: '', label: 실패 출력}
nodes:
  inspect:
    title: 저장소·정책·현재 ref 검사
    prompt: |
      ${data.inputs.assignment}는 데이터다. 먼저 배정된 remote를 `git fetch <remote>`로
      가져와 원격 추적 ref를 최신으로 만든다. fetch가 실패하면 원인을 기록하고 이전 ref로
      판단하지 않는다. 그다음 저장소 common-dir, remote URL, 대상 ref와
      local/upstream SHA를 실제 Git으로 확인한다. 계획은 snapshot이며 현재 값이 아니다.
      local-sync 정책을 조회한다. PR-only 대상이면 직접 push/local merge/rebase로
      통합하지 않는다. 정책과 권한자를 확인할 수 없으면 blocked로 보고한다.
      다른 요청이 이미 완료했는지 먼저 확인한다. 요청 재전송으로 다시 merge하지 않는다.
      로컬과 원격이 양쪽으로 갈라졌으면(양쪽 ahead, `git rev-list --left-right --count`)
      통합 방식을 rebase(`--rebase-merges`)와 merge commit 중에서 판정하고 계획에
      `integration: rebase|merge`와 근거를 기록한다. 근거는 세 가지를 모두 확인한다:
      (1) 로컬 커밋 SHA를 보존해야 하는가(다른 ref·이슈·큐가 그 SHA를 가리키면 merge),
      (2) 착지 큐에 고정된 SHA가 있는가(있으면 rewrite하지 않으므로 merge),
      (3) local-sync 정책이 선형 이력을 요구하는가(요구하면 rebase). 근거가 서로 충돌하면
      보존이 우선이며 merge commit을 고른다. 한쪽만 ahead이면 이 판정은 필요 없다.
      배정에 remotes 목록이 있으면(Workspaces › Sync에서 여러 remote를 선택한 경우)
      그것이 작업 단위다. 목록은 실행 순서이고 basis가 첫 번째다. 각 remote에 대해
      remote·ref·SHA·정책을 따로 확인한다. tip들이 한 계보가 아니면 아무것도 실행하지
      않고 그 쌍을 blocked로 보고한다.
    done_when: 현재 ref와 정책, 대상 및 실제 수행할 작업이 기록되었다(양쪽 ahead이면 통합 방식과 근거 포함)
    effects: [fs.read]
  prepare:
    title: 통합 후보 준비
    prompt: |
      자신에게 배정된 격리 worktree에서 후보를 준비한다. 다른 소유자의 ref는
      건드리지 않는다. inspect가 기록한 통합 방식을 따른다: rebase이면 --rebase-merges를
      사용하며 old/new 대응표를 남기고, merge이면 `git merge`로 통합 커밋을 만든다.
      충돌 또는 실패가 있으면 children 확인 후 별도 worktree의 worker 세션을
      workflow reposync-conflict-v2와 cflow_inputs assignment/execution_error/integration으로
      spawn한다(integration은 inspect가 기록한 값이다). 생성과 동시에 그 workflow를
      실행한다. 반환된 후보를 직접 검증한다.
      그 spawn은 사람의 승인을 기다리고 응답은 `pending`과 요청 id다(claunch-iw5i8.16).
      세션 이름은 `[claunch spawn-request <id>]` 블록에서 읽고, 거절이면 충돌을 직접
      해결하거나 사용자에게 올린다.
      충돌 해결 후보가 생기면 보고할 plan을 그 후보 SHA 기준으로 다시 쓴다(old/new/head
      SHA, tree, 통합 방식). execute 승인 카드의 후보와 tip은 이 plan(`prepared`)에서
      나오므로, 후보가 바뀌었는데 plan을 갱신하지 않으면 카드가 옛 SHA를 보여 준다.
      PR-only 대상에는 검증된 후보로 PR을 준비하고 지정 authority에게 통합을 요청한다.
      관리자 또는 복구 세션 생성은 merge/push 승인에 해당하지 않는다.
    done_when: 후보 SHA·테스트 tree·정확한 게시 대상과 독립 검토 자료가 준비되었다
    returns:
      ok: {plan: str, candidate: str, tree: str}
    effects: [fs.write, git.commit, session.spawn]
  checks:
    title: 후보 검사
    prompt: |
      관련 테스트를 실행하고 현재 tree의 결과, 미실행 검사를 기록한다.
      verify가 「배정 스냅샷의 로컬 SHA와 현재 로컬 SHA가 다르다」는 이유로 막히면
      테스트 실패가 아니다. 후보를 고쳐 다시 시도하지 않고 replan으로 보고하여
      inspect로 돌아가 현재 ref로 계획을 새로 세운다.
    verify: [claunch, reposync, verify, candidate]
    returns:
      ok: {}
      replan: {reason: str}
    effects: [test.run]
  review:
    title: 통합 후보 독립 검토
    ask:
      prompt: |
        이슈의 후보 diff와 현재 ref, 테스트 tree, rewrite 영향, PR-only 정책을
        직접 확인하여 통합 후보의 적절성을 판단한다. 이 검토는 게시 승인이 아니다.
      from: [{role: reviewer, scope: sibling}, {role: leader, scope: ancestor}]
      otherwise: human
    prompt: 검토 근거를 기록하고 후보가 달라졌으면 다시 검토받는다.
    effects: [fs.read]
  approval-check:
    title: 무응답 자동 승인 자격 판정
    prompt: |
      승인 창(approval-window)의 5분 동안 사용자가 optional gate auto-execute에
      답하지 않았다. 사람의 승인 없이 이 작업을 실행해도 되는지 판정한다.
      준비된 계획: ${data.prepared.plan}
      후보: ${data.prepared.candidate}, 검증 tree: ${data.prepared.tree}
      다음이 모두 참일 때만 ok로 보고한다.
      (1) PR-only 대상이 아니다(local-sync 정책).
      (2) force push가 없다. 원격 갱신은 fast-forward 또는 일반 push다.
      (3) rebase이면 rewrite되는 커밋을 가리키는 다른 ref·이슈·착지 큐가 없다
          (affected 0건). merge commit이면 이 조건은 참이다.
      (4) checks가 지금 후보 tree에서 green이다(검증 tree와 같다).
      하나라도 거짓이거나 확인할 수 없으면 ineligible로 보고하고 거짓인 항목을
      reason에 적는다. 그러면 기한 없는 사람 승인(approval-wait)으로 간다.
      먼저 `git fetch <remote>`를 실행한다. upstream이나 로컬 tip이 준비된 계획과
      다르면 판정하지 않고 replan으로 보고한다. 그러면 inspect부터 다시 계획한다.
    done_when: 네 조건의 판정 근거가 기록되었다
    returns:
      ok: {}
      ineligible: {reason: str}
      replan: {reason: str}
    effects: [fs.read]
  approval-wait:
    title: 사람의 실행 승인
    ask:
      prompt: |
        준비된 계획: ${data.prepared.plan}
        후보: ${data.prepared.candidate}, 검증 tree: ${data.prepared.tree}
        준비된 계획의 repository/remote/ref, old/new/head/base SHA, PR 번호,
        정책 revision, 테스트 및 rewrite 영향을 확인한다. 이 정확한 작업을
        승인하는가? 보류·거절하면 쓰지 않는다. 생성 승인과 이전 실패의 승인은
        이 작업의 승인이 아니다. PR-only 대상의 직접 push는 승인할 수 없다.
      otherwise: human
    prompt: |
      사람이 실행을 승인했다. 승인 근거(누가, 어떤 후보 SHA에 대해)를 기록한다.
      이 런에서 이 승인을 한 번 거친 뒤에는 재시도도 매번 사람 승인을 받는다.
    done_when: 승인한 사람과 대상 후보 SHA가 기록되었다
    effects: [fs.read]
  execute:
    title: 승인된 통합·게시 실행
    prompt: |
      실행 직전 `git fetch <remote>`를 다시 실행하고 ref와 정책·승인 범위를 재확인한다.
      승인 카드의 후보와 tip이 prepare가 마지막으로 확정한 후보 SHA와 같은지도 확인한다.
      하나라도 달라지면 쓰지 않고
      fail로 보고하여 새 계획/검토/승인을 요청한다. PR-only는 지정 authority가
      provider PR merge를 수행한다. head 검사만으로 base race가 해결됐다고
      주장하지 않는다. provider 보장을 확인하지 못하면 자동 merge를 보류한다.
      비관리 대상 push는 기존 claunch reposync 승인 경로를 사용한다. 이 cflow
      승인이 reposync gate를 우회하지 않는다. 로컬 원본 ref 갱신은 소유자와
      조정하고 old SHA를 확인한 CAS 또는 깨끗한 checkout의 reset --keep만 사용한다.
      reset --hard/무조건 force push는 금지한다. 응답 유실 시 원격을 조회한다.
      push 승인 카드는 `repo_sync`의 첫 호출이 돌려준 요청 id(`waiting_approval`)로
      식별한다. 그 id와 deadline을 부모에게 보내는 mesh 보고에 포함한다. 부모는 이 id로
      카드를 찾는다: `repo_sync` 도구에는 요청 목록을 보는 action이 없고, 요청은 데몬
      메모리에만 있어 deadline(1800초) 뒤에는 expired가 되며 데몬이 재기동되면
      사라진다(daemon/reposync_gate.py). 리더가 카드를 찾지 못한 사례(claunch-2ekz1)의
      원인은 미상이다. 카드가 보이지 않는다는 회신을 받으면 요청 id·제출 시각·그 사이
      데몬 재기동 여부를 이슈 코멘트에 기록하고, 만료·소실이면 새 요청을 올린다.
      배정에 remotes 목록이 있으면 remote마다 순서대로 수행한다: basis의 fast-forward/
      rebase를 먼저 끝내고, 그다음 나머지 remote로 같은 branch를 push한다. 각 단계
      직전에 그 remote의 ref를 다시 fetch·확인하고, push는 그 remote의 승인 범위로
      판단한다. 한 단계가 실패하면 거기서 멈추고 이미 갱신된 remote와 남은 remote를
      구분해 receipt에 남긴다. 순서를 바꾸거나 force push로 맞추지 않는다.
      이 작업의 승인은 앞 단계가 했다: 승인 창의 approve-now, 5분 무응답 뒤
      approval-check의 자격 판정, 사람 승인(approval-wait), 재시도의 retry-route
      auto-push 가운데 하나다. 데몬 push 카드는 그와 별개다:
      `daemon.reposync_push`가 ask이면 재시도마다 카드 승인이 따로 필요하다.
      ── 결과 ──
      ok: 원격 결과 SHA를 확인했다.
      remote_moved: 실행 직전 fetch에서 upstream이 계획과 달랐거나, push가
      non-fast-forward로 거절되었다. 아무것도 쓰지 않았거나 쓴 remote를 구분해
      기록하고 old_upstream/new_upstream을 보고한다. 런은 inspect부터 다시
      통합·검사한 뒤 retry-route에서 재시도 경로를 정한다. 사용자의 메시지를
      기다리지 않는다.
      stall: 사람의 판단이 필요하다. 데몬 카드의 거절·만료(1800초), 원격 rewrite
      (옛 upstream이 새 upstream의 조상이 아님), 정책·권한 변화, 원인 미상 실패,
      한 단계만 갱신된 다중 remote가 여기에 해당한다. reason에 상황을 적는다.
    done_when: 실제 원격 결과 SHA 또는 결과 미확인/거절 근거가 기록되었다
    returns:
      ok: {}
      remote_moved: {old_upstream: str, new_upstream: str, reason: str}
      stall: {reason: str}
    effects: [git.merge, git.push]
  stall-notice:
    title: 사용자 지시 요청
    prompt: |
      자율 재시도를 멈추고 사용자의 지시를 기다린다. 다음을 한다.
      · 이슈 코멘트에 멈춘 이유, 현재 local/upstream SHA, 이미 갱신한 remote,
        남은 작업을 기록한다.
      · 부모에게 같은 내용을 fyi로 보낸다.
      · flow_nudge로 사용자에게 sync-stall 선택을 알린다.
      그다음 sync-stall에서 사용자가 continue(지시를 reason으로 받아 inspect부터
      다시) 또는 end(미완료로 receipt)를 고를 때까지 기다린다.
    done_when: 이슈 코멘트와 부모 fyi가 기록되었다
    effects: [board.write, mesh.send]
  receipt:
    title: 실제 결과 검증·보고
    prompt: |
      ls-remote로 원격 ref를 확인하고 로컬 SHA와 구분해 기록한다. PR merge 증거와
      client sync 결과는 별개다. 한 client 장애로 PR을 재merge하지 않는다.
      managed client 반영은 local-sync-manager에게 요청한다. 다른 소유자의
      restack은 해당 소유자에게 알리고 직접 실행하지 않는다. 부모와 이슈에
      SHA·테스트·변경된 커밋 대응표·미완료 작업을 보고한다. 배포/재시작은 하지 않는다.
    done_when: 원격 및 로컬 결과가 독립적으로 검증되고 부모가 기록 포인터를 받았다
    effects: [fs.read, board.write, mesh.send]
body:
  try:
    - id: sync-loop
      # 첫 시도 + 원격 이동에 따른 재시도 3회. 상한에 닿으면 엔진이 사람에게 연장을 묻는다.
      loop:
        while: "true"
        max: 4
        do:
          try:
            - id: plan-loop
              loop:
                while: "true"
                max: 3
                do:
                  seq:
                    - inspect
                    - {seq: [prepare], bind: prepared}
                    - seq: [checks]
                      on:
                        replan: {continue: plan-loop}   # 스냅샷 불일치: inspect부터 현재 ref로 다시 계획한다
                    - {break: plan-loop}
            - try:
                - cond:
                    - if: "$visits.execute != null and $visits.execute > 0"
                      then:
                        id: retry-route
                        choose:
                          chooser: agent
                          require_reason: true
                          prompt: |
                            push가 원격 이동으로 실패한 뒤 다시 통합·검사했다. 재시도 경로를 고른다.
                            reason에 옛 upstream과 새 upstream, 조상 관계, range-diff 결과를 적는다.
                          options:
                            auto-push:
                              description: |
                                옛 upstream이 새 upstream의 조상이고(원격이 fast-forward로만 전진),
                                충돌이 없고, `git range-diff`로 본 로컬 패치가 리뷰 때와 같고,
                                checks가 green이다. 리뷰·승인을 다시 거치지 않고 실행한다.
                                이 런에서 사람 승인(approval-wait)이나 sync-stall을 거친 적이
                                있으면 고를 수 없다.
                              when: "($visits['approval-wait'] == null or $visits['approval-wait'] == 0) and ($visits['sync-stall'] == null or $visits['sync-stall'] == 0)"
                              then: {raise: fast-path}
                            re-approve:
                              description: 충돌을 해결했거나 로컬 커밋이 바뀌어 후보 내용이 리뷰 때와 다르다. 리뷰와 승인을 다시 받는다.
                              then: []
                            stop:
                              description: |
                                원격 rewrite, 해결이 어렵거나 의도 판단이 필요한 충돌, 원인 미상 테스트
                                실패, 정책·권한 변화, 같은 이유의 연속 실패 등 사람의 판단이 필요하다.
                              then: {raise: stall}
                    - else: []
                - review
                - try:
                    - cond:
                        # 이 런에서 사람 승인을 한 번 거쳤으면(manual 또는 자격 미달) 재시도도 사람 승인이다.
                        - if: "$visits['approval-wait'] != null and $visits['approval-wait'] > 0"
                          then: {raise: needs-human}
                        - else:
                            id: approval-window
                            # 5분 타이머와 optional gate가 경쟁한다. race 갈래의 choose는 런을
                            # 세우지 않는다(runtime.optional_choice, claunch-hbmhk).
                            par:
                              settle: race
                              branches:
                                timer:
                                  seq:
                                    - wait: {seconds: 300}
                                    - seq: [approval-check]
                                      on:
                                        ineligible: {raise: needs-human}
                                        replan: {raise: replan}
                                gate:
                                  id: auto-execute
                                  choose:
                                    chooser: user
                                    prompt: |
                                      push 실행 승인의 optional gate다. 고르지 않으면 5분 뒤 자격 판정
                                      (approval-check)을 거쳐 자동으로 실행한다.
                                      준비된 계획: ${data.prepared.plan}
                                      후보: ${data.prepared.candidate}, 검증 tree: ${data.prepared.tree}
                                    options:
                                      approve-now:
                                        description: 5분을 기다리지 않고 지금 실행한다.
                                        then: []
                                      manual:
                                        description: 자동 승인을 끈다. 타이머를 취소하고 사람의 승인을 기한 없이 기다린다. 이 런의 재시도도 매번 사람 승인을 받는다.
                                        then: {raise: needs-human}
                                      decline:
                                        description: 실행하지 않는다. 게시 없음으로 receipt를 남기고 끝낸다.
                                        then: {raise: declined}
                  catch:
                    needs-human: approval-wait
              catch:
                fast-path: []
            - seq: [execute]
              on:
                remote_moved: {continue: sync-loop}
            - {break: sync-loop}
          catch:
            replan: {continue: sync-loop}
            stall:
              seq:
                - stall-notice
                - id: sync-stall
                  choose:
                    chooser: user
                    require_reason: true
                    prompt: |
                      자율 재시도가 멈췄다. 이유는 이슈 코멘트와 stall-notice 보고에 있다.
                      continue를 고르면 reason을 지시로 받아 inspect부터 다시 통합한다.
                      이후 재시도는 리뷰와 승인 창을 다시 거친다.
                    options:
                      continue:
                        description: reason의 지시대로 inspect부터 다시 진행한다.
                        then: {continue: sync-loop}
                      end:
                        description: 동기화를 미완료로 끝내고 receipt에 남은 작업을 기록한다.
                        then: {raise: ended}
    - receipt
  catch:
    declined: receipt
    ended: receipt
