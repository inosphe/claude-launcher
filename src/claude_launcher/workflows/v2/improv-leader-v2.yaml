cflow: 2
name: improv-leader-v2
description: >
  배치 머지를 처리하고 각 성공한 머지 결과를 고정 브랜치와 지속 검증 큐에
  기록하는 리더. 사후 스윕은 데몬 큐 실행 프로세스가 낮은 테스트 우선순위로
  수행하며 다음 머지 회차를 막지 않는다. 회귀 실패 시 해당 저장소의 새 일반
  머지를 중단하고 수정 자식 세션을 생성한다. 수정 머지의 전체 검증이 통과하면
  재개한다. restart_live 입력(기본 true)에 따라 배치 뒤 라이브 반영을 확인한다.
  전체 스윕 완료를 기다리지 않고 반영하므로 검증 전 코드가 라이브에 올라갈 수 있다.
  PR·로컬 후보의 심사와 착지 확인은
  기존과 같고, 회차가 끝나면 다음 회차를 자동으로 시작한다.

# 회차마다 다음 회차를 요청하고 데몬이 시작한다(docs/cflow-v2.md 2.1 recur).
# 사후 검증은 회차 밖의 지속 큐에 남는다. 다음 머지 회차는 스윕을 기다리지 않는다.
recur: {auto: true}

# 관제 런은 leader 역할 세션만 몬다. default_role은 두지 않는다: v1
# improv-leader가 leader 역할의 기본값이고, 둘이 함께 주장하면 위저드·폼의
# 자동 선택이 바뀐다(improv-worker-v2와 같은 이유). v1 퇴역 때 함께 넣는다.
filter_roles:
  type: whitelist
  roles: [leader]
# 이 런을 모는 리더가 spawn한 자식은 v2 워커 런을 돈다.
default_child_cflow: improv-worker-v2

include: [improv-common]

inputs:
  restart_live:
    type: bool
    default: true
    label: 라이브 반영·데몬 재기동
    help: 배치 뒤 필요한 재기동과 반영 확인을 수행한다. 전체 스윕 완료를 기다리지 않는다. false이면 라이브 반영을 생략한다

returns:
  # 교대 종료: done이지만 ok가 아니므로 다음 회차가 요청되지 않는다.
  wound_down: {}

collections:
  # 착지 큐(v1 landing_queue: {target: master}). 끝난 회차는 landed·rejected를
  # 버리고 나머지를 다음 회차로 넘긴다(deferred -> requested).
  landing: {type: landing-queue, env: {TARGET: master}}

fragments:
  remote-mesh: |
    먼저 대상 저장소의 PR-only 정책을 조회한다. 관리 대상이면 아래 ahead base
    직접 push를 실행하지 않고 recovery PR과 지정 authority 검증을 준비한다.
    로컬 갱신은 local-sync-manager에게 위임한다. 이 정책은 담당자 종료와
    무관하게 유지되며 PR 연결 실패가 local fallback을 허용하지 않는다.
    ── 원격 메시(다른 머신의 워커) ──
    판별: `claunch mesh members`의 machine이 리더와 다른 멤버가 있으면 그
    워커와의 git 동작은 공통 원격(`<remote>`, 보통 origin)만 거친다. 상대
    머신의 경로·로컬 브랜치를 기준으로 쓰지 않는다.
    · 후보 브랜치는 `git fetch <remote>` 뒤 `<remote>/<브랜치>`로 심사한다
      (`tools/merge_ready.py --branch <remote>/<브랜치>`).
    · 로컬 후보를 머지한 뒤에도 `git push <remote> master:refs/heads/<base>`로
      원격 base를 master와 같게 둔다(fast-forward인지 먼저 확인, --force 금지).
      배치가 끝날 때마다 한 번 더 확인한다. 원격 워커의 rebase와 착지 확인이
      이 base를 읽는다.
    · REBASE/REMEASURE 요청과 머지 통지에는 커밋을 `<40자 sha> @ <remote>/<ref>`
      형식으로 적는다(docs/remote-commit-protocol.md). 받은 참조는 판정 전에
      `tools/commit_check.py`로 확인하고, 없으면 작업하지 않고
      「NOT FOUND <sha> @ <remote>/<ref>」로 답한다.
    · 원격 워커의 착지 요청은 메시 메시지로 온다(부모 데몬에 닿지 않아
      enqueue-landing은 skipped다). 리더가 `flow_collection`(action push,
      collection landing)으로 직접 넣는다: issue, branch(`<remote>/<브랜치>`),
      tip(40자 sha), requested_by.
    · rebase 기준은 언제나 `<remote>/<base>`로 지시한다.
  pr-merge: |
    ── PR 후보 머지 절차(착지 항목에 pr_url이 있는 행) ──
    PR 후보의 머지는 원격에서 일어나고 로컬 master는 fetch로 따라간다. 그래서
    배치 안의 순서는 PR 후보 먼저, 로컬 후보 나중이다. 배치를 시작하기 전에
    로컬 master와 `<remote>/master`가 같은지 본다
    (`git fetch <remote>` 뒤 `git rev-list --left-right --count master...<remote>/master`가
    `0 0`). 로컬이 앞서면 먼저 push(fast-forward만), 뒤면 `git merge --ff-only`.
    항목의 base가 master가 아니면(중간 워커의 스택 등) 이 리더의 큐가 아니다 —
    deferred로 두고 note에 base를 적은 뒤 요청자에게 알린다.
    PR마다(-R <host>/<owner>/<repo>는 원격에서 도출한 값):
    1. `gh pr view <pr_number> --json headRefOid,baseRefName,state,mergeable,mergeStateStatus`.
       mergeable이 UNKNOWN이면 판정하지 않고 수 초 뒤 다시 조회한다(실측: 직후
       UNKNOWN, 수 초 뒤 CONFLICTING). 세 번 조회해도 UNKNOWN이면 이번 배치에서
       빼고(deferred, note에 「mergeable UNKNOWN 3회」) 다음 창에서 다시 본다.
       state가 OPEN이 아니면 제외하고 사유를 적는다. baseRefName이 master가
       아니면 큐 항목의 base와 무관하게 deferred다(note에 baseRefName) — PR의
       base는 갱신 경로에서 바뀌지 않으므로 GitHub 쪽 값으로 판정한다.
    2. headRefOid가 착지 항목의 tip(40자)과 같아야 한다. 다르면 바로 판정하지
       않고 수 초 뒤 다시 조회한다(실측: force push 직후 headRefOid가 이전 SHA로
       남아 있었다 — UNKNOWN과 같은 처리). 재조회에도 다르면 머지하지 않고
       워커에게 「tip 불일치: 큐 <tip>, PR head <headRefOid>」로 알린다.
    3. `gh pr diff <pr_number>`로 변경을 읽고 판정을 `gh pr review <pr_number>
       --approve --body <근거>` 또는 `--request-changes --body <사유>`로 남긴다.
       request-changes면 그 항목은 rejected(사유를 워커와 보드에)다.
       GitHub는 PR 작성자 계정의 approve·request-changes를 거절한다. 그래서 먼저
       PR 작성자(`gh pr view <pr_number> --json author --jq .author.login`)와 gh
       로그인 계정(`gh api user --jq .login`)을 비교한다. 같으면(리더와 워커가
       같은 gh 계정을 쓰는 편성) approve·request-changes 대신
       `gh pr review <pr_number> --comment --body "APPROVE: <근거>"`(또는
       "REQUEST CHANGES: <사유>")로 남긴다. 어느 쪽이든 판정의 정본은 보드다 —
       그 이슈에 `claunch beads comments add <이슈> "PR-REVIEW #<번호> <판정>: <근거>"`
       를 남기고 보고에 매체(review 또는 comment)를 적는다. 판정 자체(머지 여부)는
       매체와 무관하다.
    4. 먼저 `tools/delayed_sweep.py admit --repo <대상 저장소> --issue <이슈>`가
       통과하는지 다시 확인한다. 거절되면 deferred로 두고 머지하지 않는다.
       `gh pr merge <pr_number> --merge --match-head-commit <tip>`. 다른 tip이면
       gh가 거절한다(실측 `Head branch was modified`) — 그때는 1부터 다시 한다.
       다시 하는 것은 두 번까지다. 세 번째 거절이면 deferred로 두고 워커에게
       「PR head가 계속 바뀐다: 마지막 headRefOid <sha>」로 알린다.
       CONFLICTING/DIRTY면 머지하지 않고 워커에게 `<remote>/master @ <sha>` 기준
       rebase를 요청한다(deferred).
    5. `git fetch <remote>` 뒤 머지 커밋을 찾고(`gh pr view --json mergeCommit`)
       그 둘째 부모가 tip인지 `git log -1 --format=%P <merge>`로 확인한다.
       원격 base가 그 tip을 포함하는지 `tools/commit_check.py --remote <remote>
       --ref master --sha <tip> --contains`로 확인한다.
       이 시점에서 위 enqueue 명령으로 PR의 머지 SHA를 즉시 큐에 기록한다.
       로컬 FF에 실패해도 원격에서 성공한 머지의 검증 작업은 보존된다.
    6. 로컬 master를 `git merge --ff-only <remote>/master`로 맞춘다. 착지 큐의
       landed는 데몬 watch가 로컬 master 기준으로 잰다 — 손으로 set하지 않는다.
       ff-only가 거절되면(로컬 master에 원격에 없는 커밋이 있다) 강제로 맞추지
       않는다. 남은 PR 후보와 로컬 후보를 머지하지 않고 멈춘 뒤, 갈라진 커밋
       (`git log --oneline <remote>/master..master`)을 보고에 적고 integrate를
       결과 fail(reason, merges = 여기까지 머지된 것)로 끝낸다. 이미 원격에서
       머지된 PR 항목은 그 상태로 남고, batch-failed가 처리한다.
    7. 워커에게 `<merge sha> @ <remote>/master`를 통지한다(landed-notice에서
       검증 큐 상태와 함께 한 번 더).
  subagent-runs: |
    ── 실행은 subagent, 심사는 리더 ──
    머지는 subagent가 실행한다. 전체 스윕은 데몬의 지속 검증 큐 실행
    프로세스가 수행하며 리더는 스윕 완료를 기다리지 않는다. 한 subagent = 한 머지 실행. subagent가 가져온 해시·수치를 리더가 값싼 읽기 명령
    (`git rev-parse`, `git log -1`, 영수증 읽기)으로 되확인한 뒤 심사에만 쓴다.
    subagent가 실패를 가져오면 그 자리에서 고치지 않는다 — 실패 요약을 실어
    새 subagent를 띄우거나, 그 후보를 이번 배치에서 뺀다.

nodes:
  intake:
    title: 운영 확인
    prompt: |
      새 회차다(회차 번호는 flow_status의 round). 첫 회차면 운영 조건을 사용자와
      합의하고, 이후 회차면 바뀐 것이 없는지 한 줄로 확인하고 넘어간다.
      - 워커 편성: spawn에 workflow를 대지 않으면 짝인 improv-worker-v2가 붙는다
        (default_child_cflow). v1 워커(improv-worker)를 쓰는 자식은 spawn에
        workflow를 명시한다 — v1 워커의 착지 요청도 같은 landing 컬렉션에
        들어온다(docs/cflow-v2.md 10절 「v1 연결」).
      - 테스트 분업: 워커의 표적 테스트 실행 또는 생략 근거를 심사한다.
        각 성공한 머지 단계의 누적 결과(A, A+B, A+B+C)를 고정 브랜치로 보존하고
        전체 검증 큐에 넣는다. 기본 priority=-1, 수정 머지 검증은 priority=0이다.
        대기 중 사후 스윕은 일반 테스트를 막지 않으며, 이미 실행 중인 스윕은
        완료까지 독점한다. 유휴 자원이 없으면 대기는 길어질 수 있다.
      - 지속 큐: `tools/delayed_sweep.py status --repo <대상 저장소>`를 읽는다.
        큐는 회차와 리더 세션을 넘어 남으며 데몬이 재개한다. 활성 pauses가
        있으면 해당 저장소는 수정 이슈만 허용한다. 미위임 실패는 관제 대기의
        handle-regression으로 처리한다. 다른 저장소의 통합은 계속한다.
      - 라이브 반영: restart_live=${data.inputs.restart_live}(기본 true).
        true면 각 배치의 checkpoint-check 뒤 reflect/deployed-wait를 수행한다.
        전체 스윕을 기다리지 않으며 반영 후에도 사후 검증 대기/실패 상태는 유지한다.
        false면 재기동과 반영 확인을 생략하고 그 사실을 착지 통지에 적는다.
        재기동은 데몬의 restart: 경로와 기존 승인 게이트가 실행한다.
        이미 머지된 수정이 미반영이면 새 일반 머지 없이 reflect-pending을 고른다.
        반영 성공만으로 회귀 pause를 해제하지 않는다.
      - 원격 편성: 다른 머신의 워커가 있으면 아래 원격 메시 규칙을 이 회차에
        적용한다고 확인한다(원격 이름, base, `gh auth status --hostname <host>`).
      - 착지 큐: flow_status의 collections.landing에서 지난 회차에서 넘어온
        항목을 읽어 둔다.
      ${frag:remote-mesh}
      ${frag:beads-common}
    done_when: 이 회차의 운영 조건(편성, 원격 여부, 넘어온 착지 요청)이 보고에 있다
    effects: [board.write]

  integrate-preflight:
    title: 통합 심사
    prompt: |
      통합 창이 열렸다. 이번 배치의 후보를 정한다.
      0. 머지 대상 저장소를 정한다: 후보 브랜치가 있는 저장소의 절대경로이고,
         그 저장소 안에서 `git rev-parse --show-toplevel`이 출력한 값을 그대로
         쓴다(Windows에서는 `F:/...` 형식 — `/f/...` 형식은 절대경로로 읽히지
         않아 검증 큐의 저장소 판정이 불가로 멈춘다).
         이 런의 cwd(리더의 체크아웃)와 다를 수 있다 — 리더가 claude-launcher에
         서 있고 배치가 gds5로 간 회차가 실제로 있었다(claunch-6xg). 아래 심사·
         머지·스윕은 모두 이 저장소에서 한다. 한 배치는 한 저장소다 — 다른
         저장소의 후보는 deferred로 두고 note에 저장소를 적는다.
      1. 목록: flow_status의 collections.landing에서 status가 requested인 항목,
         그리고 `claunch beads list --status in_review --json`. 둘이 어긋나면
         (보드에는 있는데 큐에 없음 등) 이유를 적는다. 원격 워커의 요청은
         직접 넣었는지 확인한다.
      2. 각 후보를 넣기 전에 `uv run --no-sync python tools/delayed_sweep.py
         admit --repo <대상 저장소> --issue <이슈>`를 실행한다. 거절되면 그 후보는
         deferred(사유: 저장소 회귀 실패로 일반 머지 중단)다. 수정 이슈만 통과한다.
         그다음 각 후보를 `uv run --no-sync python tools/merge_ready.py --repo <대상 저장소>
         --branch <브랜치>`(원격이면 `<remote>/<브랜치>`)로 심사한다. 큐의 tip과 브랜치 tip이
         다르면 그 후보는 이번 배치에서 빼고 워커에게 tip 불일치를 알린다.
      3. 통과한 후보는 flow_collection set으로 status waiting, 이번에 넣지 않는
         후보는 deferred(사유 note), 거절은 rejected(사유를 워커와 보드에).
      4. PR 후보(pr_url이 있음)는 아래 PR 절차의 1–2(상태·mergeable·head 일치)까지
         여기서 확인한다. base가 master가 아닌 항목은 deferred.
      ${frag:pr-merge}
      ${frag:subagent-runs}
      ${frag:remote-mesh}
    returns:
      ok: {batch: list, repo: str}
      empty: {reason: str}
    done_when: |
      머지 대상 저장소의 절대경로, 배치에 넣은 후보(issue, branch, tip, 매체, PR이면 번호·headRefOid·mergeable)와
      각각의 merge_ready 결과, 뺀 후보의 사유가 보고에 있다. 넣을 후보가 없으면
      결과 empty로 관제 대기로 돌아간다.
    effects: [board.write]

  integrate:
    title: 배치 머지(PR 후보, 로컬 후보 --no-ff)
    prompt: |
      ── 관리 대상 정책 우선 ──
      먼저 repo_sync local_status 또는 claunch cflow2 pr-preflight로 대상 정책을
      조회한다. pr_only=true이면 아래의 로컬 통합·직접 base push·PR 실패 시
      local fallback·force_no_pr 경로는 사용할 수 없다. 정책 조회 실패도 보류다.
      child 결과를 받는 stack도 등록된 protected target이면 PR만 허용한다.
      지정된 target authority가 정확한 head/base와 독립 검증을 확인하고 PR을
      통합한다. 권한이 명확하지 않으면 구체적인 계획으로 사용자 승인을 받는다.
      manager는 로컬 복제만 맡으며 merge/push 권한을 받지 않는다.
      원격 착지 증거와 각 host의 로컬 반영은 구분하고, 로컬 FF는 manager에게
      요청한다. 한 host의 반영 실패로 PR을 다시 merge하지 않는다.
      이하의 로컬 방식은 관리 대상이 아닌 경우에만 적용한다.

      머지는 통합 심사가 정한 대상 저장소에서 한다(이 런의 cwd가 아닐 수 있다).
      먼저 PR 후보를 아래 PR 절차(3–7: 리뷰 기록, --match-head-commit 머지, fetch
      뒤 확인, 로컬 master fast-forward)대로 머지한다. 그다음
      배치의 로컬 후보를 master에 `git merge --no-ff <브랜치>`로 차례로 머지한다.
      각 PR 또는 로컬 머지를 시작하기 직전에 `tools/delayed_sweep.py admit
      --repo <대상 저장소> --issue <이슈>`를 다시 실행한다. 회귀 실패가 배치
      도중 확인되면 이미 시작한 머지의 결과를 기록하고, 이후 일반 후보는
      deferred로 둔다. 수정 이슈만 계속할 수 있다.
      성공한 머지는 매번 즉시 `uv run --no-sync python tools/delayed_sweep.py
      enqueue --repo <대상 저장소> --merge <40자 머지 SHA> --issue <이슈>
      --owner <이 리더 세션>`으로 기록한다. 다른 저장소의 스윕 명령은
      `--command`로 명시한다. 마지막 머지 뒤 한 번만 기록하지 않는다.
      반환되는 ref는 고정 브랜치다. 덮어쓰거나 삭제하지 않는다.
      enqueue 실패 시 다음 후보를 머지하지 않고 fail로 보고한다. 재실행은
      같은 SHA를 중복 생성하지 않는다. 테스트 작업은 여기서 기다리지 않는다.
      실행은 subagent 하나가 한다(머지 하나 = subagent 하나, 또는 배치 전체를
      한 subagent에 차례로 — 리더가 정한 순서대로). 충돌이 나면 그 후보는
      머지하지 않고 deferred로 돌리고 워커에게 `master @ <sha>` 기준 rebase를
      요청한다.
      머지 뒤: master tip을 리더가 `git -C <대상 저장소> rev-parse master`로 되확인하고, 각 머지
      커밋의 둘째 부모가 큐의 tip과 같은지 `git log -1 --format=%P <merge>`로
      확인한다. landed 표시는 데몬의 watch가 한다 — 손으로 set하지 않는다.
      원격이 있으면(PR 후보가 있었거나 원격 편성) 로컬 후보 머지 뒤 원격 base를
      master와 맞춘다(fast-forward push, 원격 메시 규칙).
      결과: 하나 이상 머지했으면 ok이고, `repo`에 master를 옮긴 저장소의
      절대경로(`git -C <대상 저장소> rev-parse --show-toplevel`의 출력)를,
      `master`에 그 저장소에서 되확인한 머지 뒤 tip의 전체 sha(40자, `git -C
      <대상 저장소> rev-parse master`의 출력)를 담는다 — 브랜치 이름이나 짧은
      sha는 판정 불가로 멈춘다. 게이트는 그
      master가 repo의 커밋이고 지금 master에 포함되는지 확인한다 — 둘이 다른
      저장소를 가리키면 판정 불가로 멈춘다. 이 값은 data.merged로 묶여 checkpoint-check가 해당 저장소의
      모든 머지 결과가 큐에 기록됐는지 검증하는 근거가 된다. 배치의 후보가 모두 머지 시점에 빠졌으면
      (충돌, review 거절, head 불일치) 결과 empty로 관제 대기로
      돌아간다. 머지 도중 멈춰야 했으면(ff-only 거절, 복구할 수 없는 git 오류)
      결과 fail에 repo와 사유, 그때까지 머지된 것을 적는다 — master는 되돌리지 않는다.
      ${frag:pr-merge}
      ${frag:subagent-runs}
      ${frag:remote-mesh}
    returns:
      ok: {merges: list, master: str, repo: str}
      empty: {reason: str}
      fail: {reason: str, merges: list, repo: str}
    done_when: |
      머지 커밋마다 (issue, 매체, tip, merge sha; PR이면 번호와 리뷰 판정)와 머지 후
      merges는 각 행 {issue, tip, merge_sha}이고, master tip(원격이 있으면 `<remote>/master`와 같음)이 보고에 있다
    effects: [git.merge, git.push, board.write]

  admission:
    title: 저장소 실패 상태 재확인
    prompt: |
      data.reviewed의 후보를 머지하기 전에 지속 큐의 저장소 pause를 재확인한다.
      활성 실패 때문에 후보가 거절되면 paused로 보고하고 관제 대기로 돌아간다.
      미위임 실패는 handle-regression으로 처리한다. ok는 verify가 다시 확인한다.
    returns: {ok: {}, paused: {reason: str}}
    verify: [uv, run, --no-sync, python, tools/delayed_sweep.py, check-batch,
             --env, CFLOW_DATA_REVIEWED]
    effects: [fs.read]
    done_when: 모든 후보가 현재 저장소의 머지 허용 정책을 통과한다

  checkpoint-check:
    title: 머지 단계별 검증 작업 기록 확인
    prompt: |
      data.merged.repo의 merges 각 행(issue, tip, merge_sha)에 대해 고정 브랜치와
      지속 검증 작업이 존재하는지 확인한다. 빠진 항목은 enqueue로 복구한다.
      전체 스윕을 기다리지 않는다. 영수증이 아직 없어도 정상 대기 상태다.
    verify: [uv, run, --no-sync, python, tools/delayed_sweep.py, check-enqueued,
             --env, CFLOW_DATA_MERGED]
    done_when: 성공한 모든 머지 단계의 고정 브랜치와 검증 작업이 기록되어 있다
    effects: [fs.read, fs.write]

  reflect:
    title: 라이브 서버 반영
    prompt: |
      이 작업에 들어오면 데몬의 cflow2 clock이 아래 restart 명령
      (tools/restart_live.*)을 실행한다. 리더는 그 명령도 `claunch daemon
      restart`도 직접 실행하지 않는다(AGENTS.md). 명령은 이 런의 드라이버 세션
      이름을 달고 나가므로 웹 UI 승인 게이트로 올라가고, 무응답이면 300초 뒤
      승인으로 나간다(daemon/restart_gate.py). 사용자는 연장을 횟수 제한 없이
      고를 수 있고, 카드에는 restart_live가 만든 재기동 이유(deploy_check
      판정과 아직 서빙되지 않은 master 커밋 목록)가 표시된다.
      restart 결과 블록이 오기 전에는 보고가 거절된다. 결과가 오면 새 데몬이
      섰는지 재기동 통지 블록이나 재기동 전후 pid로 판정하고(응답이 있다는
      사실은 판정이 아니다), 새 머지 커밋의 기능이 실제로 서빙되는지 하나
      이상 확인한다. 반영 판정 자체는 다음 대기(deployed-wait)의 checks가 한다.
    restart:
      windows: 'powershell -NoProfile -ExecutionPolicy Bypass -File tools/restart_live.ps1'
      linux: 'bash tools/restart_live.sh'
      # 게이트 밖에서 멈춘 스크립트를 끊는 상한이다. 게이트가 이 세션의
      # 요청을 붙들고 있는 동안에는 clock이 이 시한으로 셸을 죽이지 않는다
      # (restart_gate.holding, claunch-mm8zv; v1과 같음).
      timeout: 900
    done_when: |
      새 데몬을 무엇으로 판정했는지(통지 블록 또는 pid)와, 새 머지 커밋의
      기능이 서빙됨을 확인한 방법과 결과가 보고에 있다.
    effects: []

  reflect-pregate:
    title: 반영 재시도 판단
    prompt: |
      deployed-wait의 checks가 600초 안에 모두 통과하지 못했다. flow_status의
      대기 값(checks: 항목별 exit와 출력)과 저널의 restart_completed /
      restart_interrupted를 먼저 읽는다. deploy_check의 종료 코드로 갈린다:
      exit 1(옛 코드 서빙) — 재기동이 실행되지 않았거나 실패했다. exit 3(체크아웃이
      더러움) — 판정문의 미커밋 경로를 정리(다른 세션 것이면 요청)한다.
      exit 2(판정 불가) — 판정문의 원인을 고친다. 정리했으면 retry(reflect에
      다시 들어가 restart가 다시 실행된다), 이 턴에 정리할 수 없으면 close.

  reflect-closed:
    title: 반영 없이 마감 기록
    prompt: |
      이번 회차는 반영 없이 마감한다. 마지막 판정(checks의 exit와 출력)과 정리하지
      못한 이유를 보고에 남긴다. 재시도 5회를 모두 써서 여기에 온 경우도 같다 —
      저널의 restart_completed·checks_expired를 횟수와 함께 적는다. 다음 회차의
      reflect가 다시 시도한다.
    done_when: 마지막 판정과 정리하지 못한 이유가 보고에 있다
    effects: []

  handle-regression:
    title: 회귀 실패 수정 자식 생성
    prompt: |
      `tools/delayed_sweep.py status --repo <대상 저장소>`의 활성 pauses를 읽는다.
      실패 SHA, 영수증, 실패 테스트와 로그, 현재 master SHA를 확인한다.
      실패 원인이 미확인이면 「원인 미상」으로 기록한다. 이미 repair_issue가
      있으면 기존 자식의 진행 상태를 확인하고 중복으로 만들지 않는다.
      미위임 실패마다 원래 머지 이슈 아래에 수정 이슈를 만든다(중복 검색 먼저).
      이미 같은 실패의 수정 이슈를 맡은 살아 있는 자식이 있으면 새로 spawn하지
      않고 그 이슈와 자식을 복구해 repair로 등록한다.
      본문에 재현 명령·실패 SHA·현재 master·로그 경로·완료 기준을 기록한다.
      `children`으로 슬롯을 확인하고 `spawn`으로 worker 자식 세션을 만든다.
      별도 세션 접두사 worktree, issue=<수정 이슈>를 준다.
      cflow_inputs: {relation: independent}, workflow: improv-worker-v2를 명시한다.
      기준은 현재 master, 통합 요청 수신자는
      이 리더다. 자식이 실패를 재현·수정·표적 검증하고 수정 머지를 요청한다.
      생성 후 `tools/delayed_sweep.py repair --repo <대상 저장소> --job <실패 job>
      --issue <수정 이슈>`로 유일한 허용 후보를 등록한다. 슬롯이 없거나 생성이
      거절되면 위임 대기로 기록하고 pause를 유지한다 — 일반 머지 재개 근거가 아니다.
      수정 머지는 같은 enqueue 경로를 사용하며 검증 priority=0이 된다.
      실패 SHA를 포함하는 수정 머지의 전체 검증 통과를 큐가 확인하면 pause를
      해제한다. 자식의 표적 테스트 통과나 단순 머지 통지만으로 해제하지 않는다.
      로그·커밋·수정 이슈·자식 세션은 보드에, 메시는 이슈 포인터만 남긴다.
      같은 원격 저장소를 통합하는 다른 머신의 리더 또는 target authority에도
      실패 SHA와 수정 이슈를 알려 일반 머지 중단 정책을 적용하게 한다.
    done_when: 활성 실패마다 수정 이슈·자식과 repair 등록 또는 위임 대기 사유가 기록돼 있다
    effects: [board.write, session.spawn, fs.write]

  batch-failed:
    title: 머지 실행 중단 처리
    prompt: |
      머지 실행이 중단됐다. 성공한 부분의 repo와 merges(issue, tip, merge_sha)를
      기록하고 각 머지의 검증 작업을 enqueue로 복구한다. master는 되돌리지 않는다.
      실패 사유와 후속 작업을 보드에 남긴다. 전체 스윕은 지속 큐가 수행한다.
      하나도 머지하지 못했으면 nothing_merged로 관제 대기로 돌아간다.
    returns:
      ok: {repo: str, merges: list, failed: str, cause: str, followups: list}
      nothing_merged: {reason: str}
    done_when: 성공한 머지와 해당 검증 작업, 중단 사유 및 후속 작업이 기록되어 있다
    effects: [board.write, fs.write]

  landed-notice:
    title: 착지 통지
    prompt: |
      landed 항목마다 요청자에게 머지 SHA와 큐의 job/ref를 알린다. 상태를
      「머지 완료·사후 검증 대기」와 라이브 반영 상태를 구분한다.
      restart_live=false이면 「라이브 반영 생략」, true이면 deployed-wait의
      실제 판정에 따라 「반영 완료」 또는 reflect-closed의 「반영 실패/미확인」을
      적는다. 재기동 명령 exit0만으로 반영 완료를 단정하지 않는다.
      검증 결과는 지속 큐와 영수증으로 확인하고 실패는 handle-regression에서
      별도 수정 자식에 위임한다.
      통지는 요청자에게 항목별로 보낸다. 근거 묶음은 원래 이슈 코멘트에 남긴다.
    done_when: landed 항목마다 머지 SHA·검증 job·라이브 반영 완료/생략/실패 상태가 통지됐다
    effects: [board.write]

  wrapup:
    title: 교대 종료
    prompt: |
      워커마다 진행 중인 작업이 있는지 묻고, `claunch cflow2 status -t <세션>`으로
      교차 확인한다. 양쪽에서 유휴가 확인된 세션만 종료한다.
      데몬 검증 큐의 pending/queued/running/retry와 활성 실패·수정 자식은
      다음 리더에게 인계한다. 검증 작업과 고정 브랜치를 삭제하지 않는다.
      데몬 큐 실행 중인 작업의 scratch·worktree·basetemp는 아래 정리에서
      제외한다. 영수증과 실패 로그는 큐의 증거 경로로 보존한다. 아직 돌고 있는
      subagent가 있으면 그 결과를 받은 뒤 최종 보고를 쓴다. 최종 보고: 교대 동안의
      회차 요약(처리한 요청, 머지 커밋, 반영 여부, 남은 통합 대기)과 보드 잔량.
      **이 리더 세션이 직접 만든 테스트 부산물은 이 세션이 전부 지운다** —
      스윕·표적 실행의 basetemp와 그 아래에 판 미리보기 워크트리다. 저장소
      밖이라 git status에 안 잡히고, 이 세션이 지우지 않으면 아무도 지우지
      않는다(2026-10-10에 C:/t가 종료된 세션 소유분만 28.06GB까지 쌓여 C:
      여유 공간이 264MB로 떨어졌다, claunch-4zc51).

      ── 테스트 부산물 정리 (이 리더 세션이 만든 것만, 전부) ──
      basetemp에는 교대 동안 돈 스윕의 (시작 · 소요 · 워커 수 · 실행량)이
      남아 있다. 포렌식 기록은 최종 보고와 이슈 코멘트·회차 저널(실패한
      테스트 이름과 오류 꼬리)에 옮겨 두므로 교대를 넘어 디렉터리를 보존할
      이유가 없다. 조건 셋을 지킨다:
      · 지우는 자리는 교대 종료(이 스텝) 하나다. 회차 도중에는 지우지 않는다 —
        recur로 다음 회차의 스윕이 이어지고 basetemp 이름이 계속 쓰인다.
      · 네 값을 최종 보고에 옮긴 뒤에 지운다(아래 2).
      · 대상은 현재 세션 이름(`$CLAUNCH_SESSION`)으로 만든 경로뿐이다. 아직
        도는 sweep grant가 있으면(`claunch window status`에 이 세션의 holder가
        남아 있거나 스윕 subagent가 아직 돌고 있으면) 그 실행의 basetemp는
        제외하고, 그 결과를 받은 뒤에 이 절을 시작한다.
      1. 대상을 모은다 — 이름이 이 세션의 형식인 것만:
         `ls -d C:/t/${CLAUNCH_SESSION}w C:/t/${CLAUNCH_SESSION}w[0-9]* C:/t/${CLAUNCH_SESSION}c[0-9]* C:/t/${CLAUNCH_SESSION}-* 2>/dev/null`
         `<세션>w`는 `tools/sweep.py`의 기본 명령이 쓰는 이름이고,
         `<세션>w<숫자>…`는 스윕 subagent가 실행마다 이름을 바꿔 붙인
         것이다. `<세션>c<숫자>`는 `tools/changed_tests.py`의 기본
         이름이다. (POSIX 호스트의 루트는 C:/t가 아니라 런처 홈의
         basetemp 디렉터리다 — `claude_launcher.pytest_basetemp.root()`.)
         접두사만으로 고르지 않는다: `C:/t/s46*`은 s469의 것까지 잡는다.
         위 네 형식만 다른 세션의 이름과 겹치지 않는다.
      2. 지우기 전에 기록한다 — 대상마다 (시작 · 소요 · 워커 수 ·
         실행량)을 최종 보고에 한 줄씩 싣는다. 시작 = basetemp 생성
         시각, 소요 = 재귀 전체(파일 포함)의 최대 LastWriteTime − 시작
         (하한이다), 워커 수 = `popen-gw*` 개수, 실행량 = 워커 수가 0보다
         크면 Σ(각 `popen-gw*`의 하위 개수), 아니면 basetemp 하위 개수다.
         basetemp가 아닌 파일(출력을 저장한 `.txt` 등)은 경로와 크기만
         적는다.
      3. 대상 중 git 워크트리(`git worktree list`에 그 경로가 나오는 것 —
         미리보기 체크아웃 등)는 `git worktree remove --force <경로>`로
         지우고 `git worktree prune`을 돌린다. 디렉터리만 지우면 저장소에
         고아 워크트리 등록이 남는다. 미리보기 ref(`refs/claunch/preview/*`)는
         이 절의 대상이 아니다 — 아직 착지하지 않은 요청의 근거로
         `tools/merge_ready.py`가 그 ref를 읽는다.
      4. 나머지를 지운다. 잠겨서 지워지지 않으면 그 경로를 쥔 프로세스가
         살아 있다는 뜻이다: 이 세션이 띄운 프로세스면 종료하고 다시
         지우고, 아니면 남긴 채 경로와 사유를 보고에 적는다.
      5. 1의 명령을 다시 돌려 남은 것이 없음을 확인하고, 지운 개수와
         용량, 남긴 것(경로·사유)을 보고에 적는다.
      워커나 다른 세션의 항목은 그 세션이 이미 종료됐어도 여기서 지우지
      않는다 — 그 세션의 증거이고, 정리는 그 세션의 wrapup이나 사람이 한다.
    done_when: |
      유휴가 확인된 워커 세션이 종료되었고 교대 최종 보고가 있다. 이 리더
      세션의 basetemp(`C:/t/<세션>w`·`C:/t/<세션>w<숫자>…`·`C:/t/<세션>c<숫자>`·
      `C:/t/<세션>-*`)마다 (시작 · 소요 · 워커 수 · 실행량)이 보고에 있고, 그
      항목과 그 아래 미리보기 워크트리가 지워졌다(지우지 못한 것은 경로·사유가
      보고에 있다). 1의 명령을 다시 돌린 출력이 보고에 있다.
    effects: [fs.write, board.write]

procedures:
  reflect-live:
    description: restart_live 입력에 따라 기존 재기동·반영 확인·재시도 경로를 수행한다
    body:
      cond:
        - if: "$data.inputs.restart_live == true"
          then:
            - id: reflect-guard
              try:
                id: reflect-retry
                retry:
                  max: 5
                  do:
                    seq:
                      - reflect
                      - id: deployed-wait
                        wait:
                          describe: 라이브 데몬이 이번 머지 이후에 재기동됐다
                          poll: 30
                          seconds: 600
                          checks:
                            # 0 = 머지 이후 재기동 확인, 1 = 재기동 없음,
                            # 2 = 판정 불가, 3 = 체크아웃이 더러움(판정 불가로 센다)
                            - id: deployed
                              describe: 라이브 데몬이 master의 이번 머지 이후에 재기동됐다
                              probe: 'uv run --no-sync python tools/deploy_check.py --branch master'
                        # 만료(timeout)와 판정 불가(undecidable)는 같은 결정 자리로
                        # 간다(v1 checklist otherwise -> reflect-pregate).
                        on:
                          timeout: &pregate
                            seq:
                              - reflect-pregate
                              - choose:
                                  require_reason: true
                                  prompt: |
                                    원인을 정리했으면 retry로 reflect에 다시 들어가 재기동을
                                    다시 실행한다. 이 턴에 정리할 수 없으면 close로 반영 없이
                                    마감한다. reason에 종료 코드와 정리한 내용(또는 못 한
                                    이유)을 적는다.
                                  options:
                                    retry:
                                      description: 원인을 정리했다 — reflect로 다시 들어간다(새 방문, restart가 다시 실행된다)
                                      then: {continue: null}   # 감싸는 retry의 다음 시도
                                    close:
                                      description: 이 턴에 정리할 수 없다 — 반영 없이 마감하고 착지 통지로
                                      then: reflect-closed
                          undecidable: *pregate
              catch:
                "*": reflect-closed
        - else: []

body:
  seq:
    - intake
    - id: standby-loop
      loop:
        max: 200
        while: "true"
        do:
          id: standby
          choose:
            prompt: |
              관제 대기. 워커의 요청을 처리하고 증거를 수합한다. 착지 큐
              (collections.landing)에 requested 항목이 있고 그 증거(브랜치, tip,
              표적 테스트 수치)가 찼으면 지체 없이 integrate를 고른다 — 사람의
              지시를 기다리지 않는다. 직전 통합에서 300초가 안 됐으면 엔진이
              선택을 보류하고(waiting_window) 창이 열리면 데몬이 확정해 이
              터미널을 깨운다 — 턴을 끝내고 기다린다. 그사이 후보가 늘면 같은
              옵션을 다시 골라 reason을 갱신한다. 교대 종료 지시가 오면 wind-down.
              활성 회귀 실패의 수정 자식이 아직 없으면 handle-regression을 고른다.
              restart_live=true이고 이미 머지된 코드가 아직 라이브에 반영되지
              않았으면 reflect-pending을 고른다. pause가 있어도 이 경로는 허용된다.
              그 외에는 고르지 않고 관제를 계속한다. master가 움직였다는
              통지는 「그 해시로 잰 수치는 낡았다」만 뜻하게 하고, 착지 요청을
              올리지 않은 세션에 재정렬을 요구하지 않는다.
              ${frag:remote-mesh}
            options:
              integrate:
                description: 증거가 찬 착지 요청이 있다 — 통합 심사로(직전 통합에서 300초가 지나야 열린다)
                interval: 300
                then:
                  seq:
                    - {seq: [integrate-preflight], bind: reviewed}
                    - seq: [admission]
                      on:
                        paused: {continue: null}
                    - id: batch
                      try:
                        seq:
                          - {seq: [integrate], bind: merged}
                      catch:
                        empty: {continue: null}
                        fail:
                          seq: [batch-failed]
                          bind: merged
                          on:
                            nothing_merged: {continue: null}
                    - checkpoint-check
                    - call: reflect-live
                    - landed-notice
                    - {break: null}
                  on:
                    empty: {continue: null}
              reflect-pending:
                description: 이미 머지된 코드의 라이브 반영을 확인한다 — 새 머지 없이 pause 중에도 가능
                when: "$data.inputs.restart_live == true"
                then:
                  call: reflect-live
              handle-regression:
                description: 활성 회귀 실패의 수정 작업을 자식 세션에 위임한다
                then:
                  seq: [handle-regression]
              wind-down:
                description: 사용자가 교대 종료를 지시했다 — 사용자에게 종료를 확정받는다
                then:
                  seq:
                    # 교대 종료는 사용자의 결정이다 — ask-user의 기본 응답자는
                    # 사람뿐이고 timeout이 없다. 답이 없는 동안 런은 서 있다.
                    - id: wind-down-decision
                      call: ask-user
                      bind: wind_down
                      with:
                        require_reason: true
                        topic: |
                          사용자가 리더의 교대 종료를 지시했다. 종료를 확정할지 정한다.

                          end-shift: 워커들의 유휴 여부를 확인한 뒤 유휴인 세션을
                          종료하고 교대 최종 보고를 남긴다. 이 회차는 wound_down으로
                          끝나 다음 회차가 열리지 않는다. 남은 통합 대기는 보드
                          (in_review)와 착지 큐(collections.landing)에 남는다.
                          keep: 종료하지 않고 관제 대기로 돌아간다.

                          판단 근거: 착지 큐의 requested 항목 수, 진행 중인 워커
                          (`claunch cflow2 status -t <세션>`), 보드의 in_review 잔량.
                      cases:
                        end-shift:
                          seq:
                          - wrapup
                          - {return: wound_down}
                        keep: {continue: null}
                  # 세 번째 답도 reframe이면 질문을 접고 관제 대기로 돌아간다
                  on:
                    reframe: {continue: null}
