name: improv-worker
description: >
  자유 진행 워커 — 터미널 사용자(또는 리더 브리핑)가 주는 목표 하나가 한
  회차다: 목표 수립 -> 작업 -> 테스트(표적 실행, verify) -> 커밋·보고
  -> (상위 세션이 결정) 착지: 리더에게 master 통합 요청 또는 브랜치 동결 ->
  정리 -> 종료. master 머지는 리더 전권이다 — 워커는 어떤 경로로도 master를
  직접 머지하지 않는다. 워커가 하위 워커(improv-worker 자식 세션)를 둔
  중첩 편성이면 브랜치도 중첩된다 — 자식 브랜치들을 자기 브랜치에
  --no-ff로 모아 트리 구조를 보존하고, 상위 세션에는 다시 --no-ff 머지를
  요청한다. 머지 실행은 언제나 한 단계 위 세션의 몫이다. 부모가 중간
  워커(improv-mid)면 내 브랜치는 그 브랜치 위의 스택 PR(stacked pull
  request) 한 층이다 — 통합 요청은 그 부모에게, 기준 브랜치 대비로
  가고, 착지마다 오는 restack 공지에 기준 위로 다시 얹는다.
  전체 스윕 테스트(build+typecheck 포함)는 워커 몫이
  아니다 — 워커는 바꾼 영역의 테스트만 표적으로 돌리고, 전체는 리더가
  통합 시점에 모아 한 번, spawn한 subagent 안에서 돌린다. 이 워크플로우는
  recur하지 않는다 — 한 세션이 한 회차(목표 하나)를 돌고, 회차가 끝나면
  세션 자체를 종료(kill)한다. 목표 하나 = 세션 하나 = 저널 하나다.
start: intake

# 이 런의 드라이버는 worker 역할 세션이다 — 리더가 실수로 워커 런을 몰지
# 못하게 막는다. 메시 밖 단독 세션은 역할이 없어 필터가 성립하지 않으므로
# 그대로 시작되고, 그 사실이 저널에 남는다.
filter_roles:
  type: whitelist
  roles: [worker]

# 위저드의 Role 행이 worker를 고르면 이 워크플로를 자동 선택한다 —
# own filter_roles가 whitelist로 worker를 받으므로 모순이 없다.
default_role: worker

steps:
  intake:
    title: 목표 수립
    instructions: |
      새 회차다 — 이번 회차의 목표 하나를 확정한다. 출처는 둘 중 하나다:
      터미널 사용자의 직접 지시, 또는 리더의 브리핑. 목표가 아직 없으면
      여기서 대기한다(회차는 목표가 생길 때 시작된다). 다음을 정해 보고에
      남긴다:
      - 목표와 범위(무엇이 포함되고 무엇이 제외되는가)
      - 작업 브랜치 계획: 새 기능(feature) 목표면 새 피처 브랜치를 만들어
        그 위에서 작업한다 — 기존 브랜치에 다른 기능을 얹지 않는다(같은
        목표의 이어지는 수정만 예외). 지금 경로가 워크트리 브랜치면 그
        위의 피처 브랜치, master 작업 디렉터리면 새 피처 브랜치 —
        master에는 직접 커밋도 머지도 하지 않는다(master 반영은 리더의
        통합 단계 전권). 하위 워커를 스폰할 계획이면 각 자식에게
        워크트리(자체 브랜치)를 주어 브랜치가 트리를 이루게 한다 —
        자식 결과는 커밋 단계에서 --no-ff로 모은다
        — 그리고 이번 회차가 만드는 이름(워크트리·피처 브랜치)은 항상
        자기 세션($CLAUNCH_SESSION)을 접두사로 단다: <세션>-<요지>,
        예: s56-ctxsize-stash. 위저드가 만든 이름은 이미 세션을
        얹는다 — 이 규칙은 네가 직접 이름을 정할 때 지킨다.
      - 스택 기준(부모가 중간 워커일 때): 부모가 리더가 아니라 워커
        (improv-mid를 도는 중간 워커 — 생성 task나 리더의 reparent 공지가
        말해 준다)면 내 브랜치는 스택 PR(stacked pull request)의 한 층이다.
        통합 대상은 master가 아니라 부모의 브랜치(스택 베이스)이거나 부모가
        지정한 선행 자식 브랜치(내가 그 결과 위에서 작업할 때)다 — 그
        기준 브랜치와 스택 순서를 보고에 적는다. 내 브랜치가 master에서
        잘렸는데 기준의 tip이 master와 다르면 착수 전에 `git rebase
        <기준>`으로 얹는다(커밋 전이면 참조 이동뿐이다). 완료 보고·통합
        요청의 수신자도 리더가 아니라 그 부모다.
      - 작업 위치 점검: 부모 세션(이 세션을 만든 세션 — 생성 브리핑의
        parent)과 같은 체크아웃에 서 있으면, 작업 전에 새 워크트리를
        만들어 그 안에서 진행한다 — 한 체크아웃을 두 세션이 공유하면
        서로의 편집과 브랜치 전환을 밟는다. 판별 절차: 자기 이름은
        $CLAUNCH_SESSION, 부모 이름은 생성 브리핑에 있고, 각 세션의
        cwd는 `claunch sessions` 목록이 보여준다(들여쓰기가 부모-자식).
        자기 쪽 `git rev-parse --show-toplevel`과 부모 cwd에서의 같은
        명령(`git -C <부모 cwd> rev-parse --show-toplevel`)이 같은
        경로를 내면 공유다(경로 표기 차이를 git이 흡수한다). 부모
        cwd를 알 수 없으면(레코드 소거, 데몬 무응답) 보수적으로
        판정한다: `git rev-parse --git-dir`와 `--git-common-dir`가
        같으면 메인 체크아웃에 서 있는 것이므로 공유로 간주한다.
        새 워크트리는 관례 위치에 피처 브랜치로 만든다
        (git worktree add .claude/worktrees/<이름> -b <피처 브랜치>).
      - 완료 증거 기준: 테스트 수치(suite green N/N, 신규 K), 커밋 해시
      - 이슈(beads): 생성 task/context에 `issue: <id>`가 있으면(리더가 배정했든
        데몬이 오프닝 task에서 등록했든) `claunch beads show <id> --json`으로
        읽는다 — 그 본문이 목표이고, 같은 일로 이슈를 또 만들지 않는다.
        터미널 사용자의 직접 지시면 지금 만든다: `claunch beads create "<제목>"
        --type task --priority 2 --labels user-direct --assignee
        $CLAUNCH_SESSION --description "<규격>"`. 리더가 배정한 이슈가 따로
        있는데 사용자 지시가 다르면 사용자 쪽을 잡고, 리더 배정 이슈는
        `claunch beads update <그 id> --status open`으로 되돌린 뒤 `claunch
        beads comments add <그 id> "DECLINED: user-direct <새 id> took
        precedence"`를 남긴다(리더가 재배정한다) — 판단 없이 기계적으로.
        어느 쪽이든 마지막에 `claunch beads update <id> --status in_progress
        --external-ref <run id>` — 이 전이가 회차의 시작이고, id는 intake
        fyi에 함께 실린다.
      정본·공용 규칙(파서, 직렬화, 포맷, 공용 문서)에 닿는 목표면 착수 전에
      리더에게 fyi로 알려 다른 세션의 확정 규칙·진행 중 작업과 충돌하는지
      확인한다 — 같은 규칙을 두 세션이 다르게 정하는 사고를 여기서 막는다.
      메시에 속해 있으면 목표 요지를 이슈 id와 함께 리더에게 fyi로 남긴다.

      ── beads(br) 규칙 — 공통 ──
      일감의 정본은 beads다: 세션이 한 회차를 쓸 일, 다른 세션·회차로 넘어갈
      일은 이슈로 존재해야 한다(존재·제목·범위·완료 기준·assignee·상태·
      의존·부모). beads에 두지 않는 것: 실행 기록(cflow 저널), 대화·답장
      (mesh), 승인·선택(cflow ask/select), 머지 가능 판정(통합 단계의 git
      증거). 코멘트에는 포인터와 판정만 — run id, 커밋 해시, 테스트 수치,
      `REBASE REQUESTED @ <hash>` / `HOLD: <이유>` / `BLOCKED: <게이트>` /
      `merged <hash>`.
      호출은 항상 `claunch beads <br 인자>` — 워크트리에서도 저장소 루트의
      .beads/beads.db 하나를 쓰고(--db를 대신 붙인다), 쓰기에 --actor
      $CLAUNCH_SESSION을 붙이며, DB가 없으면 issues.jsonl에서 스스로
      만든다. 조회는 --json.
      이슈가 없을 때 만드는 자 = 그 일을 사람에게서 처음 받은 세션, 또는
      발견한 세션이다 — 리더가 아니다. 만들기 전에 `claunch beads search
      "<핵심어>" --json`과 open/in_progress/in_review 목록으로 중복을 본다;
      있으면 create 대신 comments add. 규격: 제목 한 줄「무엇을 어떻게」,
      --description은 `## 목표 / ## 범위(포함·제외) / ## 완료 증거 기준 /
      ## 출처(누가·언제·원문)`, --labels에 출처 하나(user | user-direct |
      leader | handoff | found | review). 우선순위: P1 사용자가 보고한
      라이브 데몬·UI 고장과 master 빨강 / P2 사용자 지시·리더 배정(기본) /
      P3 인수인계·발견·후속·후보 / P4 아이디어. type은 task 기본, bug는
      회귀·결함, epic은 스택 부모, doc은 참조 전용(ready에서 빼고 배정하지
      않는다). staged 순서: description이 먼저, --assignee가 마지막.
      상태 전이의 주인: open→in_progress는 assignee 워커(intake 끝,
      --external-ref에 run id) / in_progress→in_review는 assignee 워커
      (landing request) / in_review→in_progress는 리더(rebase 재요청) /
      in_review→closed는 리더만(`claunch beads close <id> --reason "merged
      <hash>, sweep N/M"`; 중간 워커는 자기 --parent 자식만) / 아무
      상태→blocked는 그 게이트에 걸린 세션(`BLOCKED: <스텝>`), 해소되면
      같은 세션이 되돌린다 / reopen은 리더만. update --status closed는
      없다 — close뿐이다.
      br가 실패하면(잠금·바이너리 없음) --lock-timeout 5000으로 한 번 더,
      그래도 안 되면 mesh fyi 첫 줄에 `NO-BEAD:` + 위 규격 그대로 — 리더가
      다음 관제 대기에서 대신 만들고 id를 답한다. 이슈 없이 착수하는
      것만은 금지다.
    done_when: |
      목표·범위, 브랜치 계획(새 기능이면 새 피처 브랜치), 작업 위치
      판정(부모와 체크아웃 공유 여부 — 공유였다면 새 워크트리로 이동
      완료), 완료 증거 기준, 이슈 id와 in_progress 전이가 보고에 기록되어
      있고, 정본 규칙에 닿는 목표라면 리더 fyi까지 나갔다.
    next: work

  work:
    title: 작업 실행
    instructions: |
      피처 브랜치에서 목표를 구현한다. 커밋은 작고 초점 있게, 범위 밖
      (master, 공용 문서, 다른 세션의 워크트리)은 건드리지 않는다. 작업 중
      정본 규칙과 어긋나는 선택지가 나타나면 혼자 정하지 말고 리더에게
      물어 단일 규칙으로 기록되게 한다. 범위 밖의 결함·회귀를 발견하면
      고치지 말고 그 자리에서 이슈로 남긴다 — `claunch beads create "<제목>"
      --type bug --priority 3 --labels found --description "<규격>"`(assignee
      없음) — 그리고 자기 일을 계속한다; 발견한 세션이 만드는 자다. 보고에는
      바꾼 파일과 접근 방식 요지, 발견 이슈 id를 남긴다.
    done_when: |
      intake에서 정한 범위의 구현이 피처 브랜치 커밋으로 존재하고(범위 밖
      파일은 건드리지 않았다), 바꾼 파일 목록과 접근 방식 요지, 범위 밖
      발견이 있었다면 그 이슈 id가 보고에 있다.
    next: review

  review:
    title: 테스트 (표적)
    instructions: |
      바꾼 영역을 덮는 유닛테스트를 추가·확장하고, **바꾼 영역의 테스트만**
      돌린다. 스위트 명령은 저장소마다 다르므로 정본은 명령을 박지
      않는다 — 저장소별 명령은 프로젝트 레이어(.claunch/workflows/
      오버라이드)가 verify로 담고, 오버라이드가 없으면 보고의 수치와
      저널이 판정 근거다. 보고에는 수치(돌린 모듈 N개 M/M, 신규 K)와
      커버한 시나리오를 남기고 **무엇을 골라 돌렸는지(모듈 목록)**를
      명시한다. 실제 화면·CLI 동작 확인이 의미 있는 변경이면 그
      증거(방법과 결과)도 함께 남긴다.

      ★ **전체 스위트는 워커가 어떤 경로로도 돌리지 않는다.** 표적
      실행만이 이 스텝의 몫이고, 전체 스윕(build+typecheck+전체 스위트)은
      리더가 통합 시점에 배치로 한 번, 그것도 spawn한 subagent 안에서
      돌린다. 이 금지는 손으로 치는 명령만이 아니라 **이 스텝의 verify
      필드에도 적용된다** — 아래 「무엇을 검증했는가」가 못박듯 verify는
      그 스텝을 떠날 때 엔진이 돌리는 스윕이고, 손으로 치지 않으므로
      가장 안 보이는 스윕이다. 오버라이드를 쓰는 저장소는 그 자리에
      전체 스위트가 아니라 표적 선택 명령을 담는다.

      왜 표적인가 — 두 가지가 실측으로 확인됐다:
      · **시간**: 전체 스위트는 회차를 막는다. 이 저장소 기준 -n 8로 178초,
        직렬 532초다.
      · **오염**: 워커가 도는 전체 스위트는 판정이 아니라 잡음이 된다.
        세션 여섯이 각자 -n 8로 같은 스텝을 떠나면 48 프로세스가 서로의
        측정을 흔들고, 저널에는 스윕이 돌았다는 사실조차 안 남는다.
        게다가 깨끗한 브랜치의 워커는 남의 미커밋 파일을 함께 수집한
        공유 체크아웃보다 **항상 몇 건 적게 나오고, 그것을 자기가 깼다고
        읽는다** — 실제로 오염된 1562와 깨끗한 1559가 둘 다 "정본
        대조군"으로 돌아다녔다. 표적 실행은 이 축을 아예 만들지 않는다.

      선택이 비면 그것은 통과다 — 산문·워크플로 yaml·문서만 바꾼 회차가
      실제로 있다(그런 회차를 빨갛게 만들면 게이트를 통과하려고 테스트를
      꾸미게 된다). 빈 선택 뒤에 서는 것은 이 스텝의 done_when이다:
      보고에 수치와 시나리오를 요구하는 쪽이 그 자리를 받친다.

      ── 무엇을 검증했는가 ──
      수치는 그 자체로 판정이 아니다. 어느 트리를 어느 환경에서, 무엇과
      나란히 돌린 수치인지가 붙어야 판정이 된다.

      · 검증 대상 트리: 런 cwd가 검증하려는 트리와 다르면 스위트 명령에
        `--directory <절대경로>`를 박는다(워커는 자기 워크트리, 리더는
        master 체크아웃 — 방향이 반대다). --directory가 보장하는 것은
        cwd이고 그래서 rootdir·pythonpath가 그 트리를 가리킨다 = 검증
        대상의 절반. 나머지 절반(인터프리터·패키지·플러그인)은 그
        워크트리에서 `uv sync --extra test`를 1회 돌려야 자기 것이 된다:
        pytest는 콘솔 스크립트라 PATH에서 풀리고 uv는 워크트리 Scripts를
        앞에 얹을 뿐 메인 것을 걷어내지 않으므로, 워크트리 venv가 비어
        있으면 죽지 않고 조용히 메인 패키지로 돈다. 「내 소스를 남의
        패키지로」 검증한 상태가 아무 신호 없이 지나간다.
      · 확인은 존재가 아니라 임포트로 한다 — `.venv`가 있다와 패키지가
        있다는 다른 사실이다:
        `uv run --no-sync python -c "import pytest, xdist; print(pytest.__file__, xdist.__version__)"`
        경로가 자기 워크트리면 트리·환경 두 축이 한 번에 답해진다.
      · 보고 규약은 순서가 있다. 뒤엣것은 앞엣것이 정해져야 뜻을 갖는다:
        1순위 **시작 시각과 소요 시간** — 구간이 정해진다. 잊었으면
              basetemp 디렉터리의 CreationTime이 시작 시각을 초 단위로
              돌려준다. 그래서 `--basetemp`는 실행마다 유일하게 준다:
              재사용하면 그 자리가 덮여 **연표가 지워진다**(충돌 방지보다
              이쪽이 큰 값이다). 다만 유일 접미사는 **자기 스냅샷
              (.cflow/runs/<세션>/workflow.yaml)에 손으로 박는다** —
              공유 오버라이드에는 못 쓴다: 엔진은 verify를 env 주입 없이
              돌리므로 cmd가 확장할 수 있는 것은 세션 환경에 원래 있는
              `%CLAUNCH_SESSION%`뿐이고, 회차 번호 같은 cflow 상태는
              확장할 이름이 없다. 임시책은 두 갈래인데 **성질이 다르고 둘 다
              반쪽**이다: **스냅샷에 박으면 게이트에는 적용되지만 회차마다
              사라진다**(스냅샷은 스코프당 한 파일이고 `start`마다 source에서
              새로 쓰이므로 손으로 박은 접미사도 `--directory`도 엔진이 덮어
              지운다 — 사람이 잊는 문제가 아니라 덮어쓰기 문제다). **손으로
              돌릴 때 인자로 주면 덮어쓰기에 안 죽지만 게이트에는 적용되지
              않는다.** 엔진이 verify 환경에 cflow 변수를 주입하기 전까지는
              어느 쪽도 전부를 덮지 못한다.
              (cmd의 `%RANDOM%`으로
              자동화하려 하지 마라: 시스템 시계 시드라 해상도가 낮아
              근접 호출이 같은 값을 낸다 — 실측 3회 연속 동일값 — 즉
              유일성이 필요한 바로 그 상황에서 충돌한다. `%TIME%`은
              콜론 때문에 경로로 못 쓴다.)
        2순위 **트리 해시** — 구간과 reflog로 검산된다. 스윕 도중 master가
              움직였으면 해시는 시작 시각 없이 정해지지 않는다.
        3순위 **통과·수집 수** — 해시가 확정될 때만 기준선과 비교한다.
              여섯 세션이 실제로 돌려 맞춘 대조라 지금 서 있는 검사다.
        4순위 **시간 배수** — 해시와 `-n`이 같을 때만. 근거 강도가 3순위와
              다르므로 한 쌍으로 적지 않는다: **검증 사례 1건 — 같은 트리·
              같은 명령·같은 `-n 8`으로 돈 5회에서 단독 3회(평균 64.3초)
              대 78초짜리 실제 스윕과 겹친 2회(평균 99.1초) = 1.54배.**
              겹침 여부와 상대의 규모는 라벨이 아니라 `C:/t` 연표에서
              복원해 확인했다(잔챙이 실행 다섯은 전부 2.4초 이하라 오염
              강도에서 제외됐고, 단독 3회는 직전 실행 종료 시각으로 단독임이
              확인됐다). **표본 5, 임계값은 미정** — 방향은 섰지만 어느
              배수부터 의심할지는 아직 정하지 않았다.
              그리고 같은 5회의 통과 수·실패 수·결과 집합은 전부 동일했다:
              **겹침은 시간을 늘렸지만 판정은 흔들지 않았다** — 시간을 못
              쓰는 것이 판정을 못 한다는 뜻은 아니므로, 배수 칸이 빈 수치도
              증거로 선다.
        그리고 수치는 항상 **(트리 해시, 축, 값)** 셋으로 적는다. 축을
        빼면 서로 다른 것을 센 수치가 같은 이름으로 돌아다닌다 — 실제로
        `-m "not worktree"` 축의 약 1450과 필터 없는 축의 1558이 둘 다
        "정본 대조군"으로 유통됐고, 100건 넘게 갈리는 것을 한동안 아무도
        안 물었다. 지금 이 편성에는 축이 셋이다: 워커의 **표적 선택**
        (회차마다 다르므로 고른 모듈 목록이 곧 축이다), 리더 스윕의
        **필터 없는 전체**, 그리고 과거 기록에 남아 있는 `-m "not
        worktree"`. 축을 옮길 때는 값만 옮기지 말고 축 이름을 같이
        옮긴다. (트리, 환경)도 함께 적는다.
        기준선 수집 수는 `--collect-only`(-n 없이, 1초 미만, 창을 쓰지
        않는다)로 얻는다 — 기준선을 얻으려고 스위트를 돌리지 않는다.
        수집 수는 「무엇을 돌릴 예정인가」이지 「무엇이 실제로 돌았는가」가
        아니다. 실행 축은 그 브랜치들을 실제로 합친 프리뷰 스윕이 덮는다 —
        각자 단독 수치만 있으면 그 칸은 비어 있는 것이다.
      · **죽은 실행의 세 값이 전부 `C:/t`에서 복원된다** — 라벨이나 산수로
        추정하지 마라. 세 값의 성격은 **시작 = 상한**(basetemp 생성이 명령
        시작보다 몇 초 늦다), **소요 = 하한**, **종료 = 하한**이고,
        **셋 다 같은 방향으로 보수적이라 겹침 판정에서 거짓 음성만 만든다**:
          시작 = basetemp 생성 시각
          종료 = **재귀 전체(파일 포함)의 최대 LastWriteTime — 종료의
                 「하한」이지 소요 추정치가 아니다** — 정확히는 「basetemp에
                 마지막으로 쓴 시각」이다. **끝까지 tmp를 쓰는 실행에서는**
                 실측과 1% 안쪽이었지만(11건), 마지막 90초 동안 tmp 쓰기가
                 없던 실행에서는 49% 짧게 나왔다. **그 반례는 깊이와 무관해
                 재귀에도 그대로 걸린다** — 아무 데도 안 썼으면 아무리 깊이
                 내려가도 그 시각을 못 만든다. **소요 근사로 쓰면 최대
                 절반이 잘리고 「겹친 게 없다」는 거짓 음성이 나온다.**
                 `Get-ChildItem <basetemp> -Recurse -Force |
                  Sort LastWriteTime -Desc | Select -First 1`
                 **이건 계측으로 고를 문제가 아니라 정의상 정해진다**:
                 세 후보(최상위 / popen-gw* 최대 / 재귀 전체 최대)는 전부
                 실제 종료의 하한이고 후보 집합이 포함관계(① ⊂ ② ⊂ ③)라
                 최대값은 후보를 넓히면 줄지 않는다 — **③ ≥ ② ≥ ①이 항상
                 참이고, 하한은 클수록 좋으므로 ③이 지배한다.** 어느 표본을
                 재도 ②가 ③보다 나을 수 없다. (참고로 한 기준 표본에서
                 ①은 실제의 0.8%, ②는 94%, ③은 98.3%였고, 다른 표본에서는
                 ②=③이었다 — 격차는 실행마다 다르므로 격차를 재서 고르면
                 결론이 흔들린다. 디렉터리 mtime은 자식이 추가·삭제될 때만
                 갱신되고 마지막 쓰기는 그 안의 파일에서 일어난다.)
                 workers=0이면 popen-gw*가 없으므로 재귀가 유일한 길이다
          규모 = `basetemp/popen-gw*` 개수(= 그 실행의 `-n`)
        **최상위 LastWrite는 종료가 아니다** — pytest가 하위에만 쓰므로
        일찍 멈춘다(실측 반례: 생성 21:26:34, 최상위 21:26:39, 실제 소요
        335.8초). 최상위로 교집합을 내면 「겹친 것이 없다」는 거짓 음성이
        나온다. **복원값은 어느 변종이든 하한이고 양쪽 끝이 다 잘린다**:
        **앞** — basetemp에 쓰기가 없는 수집·임포트 구간이 안 잡힌다
        (복원 0.2초 대 보고 2.50초); **뒤** — 마지막 구간에 워커 tmp 쓰기가
        없으면 그만큼 잘린다(복원 94.7초 대 실측 186.84초, 49% 손실).
        두 사례를 함께 읽어야 「하한」이 양방향이라는 것이 보인다.
        ②(popen-gw 디렉터리들의 최대)를 안 쓰는 이유가 하나 더 있다:
        **일관되게 낮은 게 아니라 때때로 맞고 때때로 낮아서** 보정할 수가
        없다(같은 세션의 손 실행 셋은 ②=③, 게이트분만 8초 벌어졌다 —
        마지막 쓰기가 디렉터리에 일어나면 같아지고 파일 내용으로 끝나면
        벌어진다).
        ★ **하한끼리 비교하면 「겹쳤다」는 확정할 수 있어도 「안 겹쳤다」는
        확정할 수 없다.** 오차가 한 방향(늘 실제보다 이르다)이라 거짓
        음성만 만들고 거짓 양성은 만들지 않기 때문이다. 그래서 **복원으로
        낸 「겹침 없음」은 전부 재확인 대상이고, 「겹침 있음」은 그대로
        유효하다** — 결론을 쓸 때도 「안 겹쳤다」가 아니라 「겹쳤다는 것을
        뒷받침하지 않는다」까지만 적는다. 정량 기준: **비겹침을 말하려면
        간격이 최소 2분은 되어야 하고, 그보다 좁으면 「미확정」으로 적는다**
        — 마지막 92초 동안 tmp에 안 쓴 실행이 실측됐으므로 수십 초짜리
        간격은 그 맹점 안에 통째로 들어간다.
        **규모와 지속 시간을 함께 읽어라**: 워커 0 + 수 초 = 탐침,
        규모 판별은 이 표로 한다:
          워커 ≥ 1 → xdist 스윕, 규모 = 워커 수. **실행량은 `popen-gw*`
                     안을 세야 나온다** — 워커가 있으면 최상위 하위는 늘
                     워커 수(예: 8)로 보이므로, 그 수를 직렬의 하위 수와
                     나란히 놓으면 규모를 거꾸로 읽는다
          워커 0 + 하위 수십 이하 + 수 초 → 탐침(무게 없음)
          워커 0 + 하위 수백 + 수 분 → **직렬 전체 스윕 — 창을 쓴다**
        `-n`이 없다는 것은 xdist를 안 썼다는 뜻이지 가볍다는 뜻이 아니다.
        실측에서 직렬 전체(하위 995, 387초+)가 `-n 8`(62~103초)보다 네 배
        오래 창을 물었다. 그리고 **개수로 규모를 읽지 마라** —
        직렬 실행도 프로세스는 여럿으로 보이고, 오늘 겹침 오귀속이 전부
        그 자리에서 났다. basetemp를 재사용하면 마지막 실행의 워커 수만
        남으므로, 유일 이름 규칙이 이 복원 전체의 전제다.
      · 겹침 판정의 시각은 **[생성, 종료]**로 잡는다(위 세 값으로 채운다).
      · 통과 수를 **귀속**에 쓰는 용법(이 수는 어느 트리에서만 나올 수
        있는가)은 `-q`가 rootdir을 지운 수치를 구제한다. 순서를 지켜라:
        **1순위는 rootdir을 안 지우는 것이고**, 이 서명은 이미 지워진
        수치를 사후에 건지는 도구다 — 뒤집으면 「어차피 수로 알 수 있으니
        `-q`로 돌려도 된다」가 되어 방금 겪은 문제로 되돌아간다. 그리고
        서명은 후보 트리들의 케이스 수가 서로 구별될 때만 트리를 지목한다:
        0개 추가는 서명이 없고, 같은 수를 더한 트리가 둘이면 서명이 겹친다.
      · 게이트 verify도 사후 복원된다 — 저널이 유일한 기록이 아니다.
        저널에는 명령 문자열만 남지만, `C:/t`의 basetemp가 나머지를 갖고
        있다: 시작·소요(하한)·규모에 더해 **실행량 = workers>0이면
        Σ(각 `popen-gw*`의 하위 개수), 아니면 basetemp 하위 개수.** 실측
        8건에서 그 실행이 보고한 수와 맞았고(실패가 있던 회차에서는
        통과 + 실패 = 실행량으로 맞았다) 값이 970·973·1075·1127로 갈리므로
        상수가 아니라 실제로 추적한다. **남는 것은 「어느 테스트가
        실패했는가」뿐이다.** 단 **실행량 ≈ 통과 + 실패이고 skip은 안
        센다** — skip은 tmp 픽스처가 돌기 전에 걸러진다. 수집 수와 비교할
        때는 skip 수를 빼라(이 저장소의 `-m "not worktree"` 축은 늘 1건을
        건너뛰므로 실행량 기준선은 970이다). 그리고 **테스트별 tmp가
        아닌 디렉터리가 섞이면 그만큼 늘어난다** — 모듈 스코프
        `tmp_path_factory` 하나가 하위를 하나 더 만들어 983 대신 985가
        나온 실사례가 있다. 즉 실행량은 「tmp를 쓴 단위 수」이지 테스트
        수 자체가 아니다. **그리고 이 값만 새는 방향이 반대다** —
        시작(상한)·소요·종료(하한)는 전부 보수적인데 실행량은 **과대 쪽**
        이다. 대조하기 전에 그 트리에 모듈·세션 스코프 tmp 픽스처가 있는지
        보고, 있으면 그 수만큼 빼거나 규모 지표로만 써라. 지금 이 저장소에
        그런 픽스처가 없어서 수가 정확히 맞는 것이고 파일 하나가 추가되면
        깨진다 — 저장소 상태의 성질이지 방법의 성질이 아니다.
      · 이 복원은 **basetemp가 안 덮였을 때만** 된다. 유일 이름 규칙과
        대체재가 아니라 보완재다 — 이름을 재사용하면 앞 실행의 연표도
        게이트 수치도 함께 지워진다.
      · 그래도 보고에 적을 수치는 자기가 재서 적는 편이 낫다 — 복원은
        가능하지만 다음 사람이 디스크를 뒤져야 하고, basetemp가 재사용되면
        그 자리가 덮인다. 그리고 같은 트리·같은 명령의 손 실행이 있으면
        **게이트 verify의 간접 대조군**이 된다(게이트는 stdout이 없어
        직접 대조가 안 되는데, 두 실행의 실행량·워커 수·소요가 나란히
        서면 서로를 검산한다) — 「수치는 자기가 돌려서 적는다」는 규율이
        그 대조군을 자동으로 만든다.
      · 단서: 이 저장소에서 실행량이 통과 수와 정확히 맞는 것은 `home`
        픽스처가 사실상 모든 테스트에 tmp를 만들기 때문이다 — **그건 이
        저장소의 성질이지 방법의 성질이 아니다.** 여기서는 정확한 값으로
        써도 되고, 다른 저장소에서는 「tmp를 쓴 테스트 수」로만 읽어라.
      · **추론하기 전에 자기 기록을 연다.** 남의 관측으로 추론하는 것보다
        자기 저널·로그를 여는 편이 늘 싸고, 답이 이미 거기 있는 경우가
        많다.

      ── 창을 확보하고 돌린다 ──
      다른 스윕이 도는 중의 green은 증거가 아니다. CPU로는 스윕의 존재를
      못 보므로(스위트는 CPU 바운드가 아니라 PTY·데몬 대기다) 스윕 유무는
      따로 확인한다. 세 층이고 순서가 있다:
      (1) 직접 측정 — 관할과 무관한 유일한 층. 아래 명령 그대로 쓴다.
      (2) 대기열 신호 — 우리끼리의 순서 조율(의도).
      (3) CPU ≤45% — 머신이 붐비는지(부하 게이트).
      ```powershell
      Get-CimInstance Win32_Process -Filter "Name='python.exe' OR Name='uv.exe' OR Name='pytest.exe' OR Name='py.test.exe'" |
        Where-Object { $_.CommandLine -like '*pytest*' -or $_.CommandLine -like '*uv*run*' }
      ```
      · Name 제한을 없애지 마라. 이름 무관으로 넓히면 재는 쪽이 자기를
        센다 — claude.exe는 커맨드라인에 시스템 프롬프트를 통째로 들고
        있어 우리 규약 문자열이 전부 문자열로 떠 있고, 거기서 basetemp가
        그대로 추출된다. 커맨드라인 매칭 탐지기는 「규약을 말한 것」과
        「규약을 실행한 것」을 못 가른다.
      · 개수는 존재만 답한다. 규모는 CommandLine의 `-n` 값으로, 동시
        스윕 수는 distinct basetemp로 읽는다. 워커는 execnet 부트스트랩
        (`<python> -u -c "import sys;exec(...)"`)으로 떠서 argv에 pytest도
        basetemp도 없다 — 한 스윕이 워커 수보다 적게 보인다.
      · 판정이 아니라 잡힌 행 전체를 보고에 붙인다. 프로세스는 사라지고
        판정만 남으면 나중에 그 판정을 검증할 수 없다.
      · 이 스캔에는 닫히지 않는 구멍이 있다: 명령을 시작하고 **1~3초**
        동안은 uv가 아직 파이썬을 띄우지 않아 **정본 명령도 0을 반환한다**
        (세 축이 그 범위에 모인다: 선언 시각과 basetemp 생성의 차 3초,
        하네스 10회의 wall−pytest 0.6~1.8초). 간격을 두고 두 번 재도,
        재자마자 착수해도 못 닫는다 — 두 세션이 그 몇 초 안에 각자 0을
        보면 둘 다 규칙을 지킨 채로 함께 출발한다. 구간이 짧아져도 성질은
        그대로이고, 그 구간에는 basetemp도 아직 없어 **프로세스 스캔과
        디스크 재구성이 함께 눈이 먼다.** 그래서
        **착수할 때 "지금 시작한다"를 먼저 한 줄 흘린다.** 지금 있는
        방어는 그것뿐이고, 스캔의 정밀도를 올려서 닫을 수 있는 구멍이
        아니다.
      · **창을 쓰는 기준은 「전체 스위트를 도는가」다 — `-n`의 유무가
        아니다.** 직렬 전체가 xdist 전체보다 오래 문다.
      · ★ **스텝 페이로드에 `verify` 필드가 있으면 그 스텝을 떠나는 것이
        스윕 시작이다.** 엔진이 그 자리에서 전체 스위트를 돌리는데, 손으로
        명령을 치지 않으므로 스윕으로 세지 않기 쉽다 — 남의 조용한 창을
        오염시킨 실사례가 게이트 verify였다. 그 필드는 명령 전문과 `-n`
        값까지 담고 **스텝에 들어가는 순간 이미 화면에 있으므로**,
        작업하는 동안 미리 차례를 잡아 두고 `next` 직전에 스캔·선언한다
        (떠나는 모든 경로에 해당한다). 그리고 그 실행은 저널에 수치를
        남기지 않는다: **가장 안 보이는 스윕이 가장 안 기록되는 스윕이다.**
      · 이 명령의 정본 위치는 저장소의 스윕 점검 스크립트가 되며, 그
        파일이 생기면 여기는 그 파일 참조로 대체한다.
      · 이 검사가 못 보는 것: 로컬 프로세스만 본다 — 릴레이가 살아나
        원격 세션이 붙는 편성에서는 같은 사고가 다시 열린다. 지금 릴레이가
        끊겨 있어 실효 100%인 것뿐이다.

      ── 재는 것과 주장하는 것 ──
      · 어떤 명령에 대한 주장인지와 실제로 실행한 명령이 같은지 먼저
        확인한다 — `python -c`로 `pytest`를 대신 재지 않는다.
      · 독립 확인은 결론이 같은지가 아니라 방법이 다른지를 본다. 같은
        방법으로 두 번 재면 표본만 늘어난 것이다.
      · 층이 다른 두 관측이 충돌하면, 어느 쪽도 틀리지 않고 둘을 가르는
        조건이 아직 안 드러난 것이다.
      · 철회도 근거가 닿는 데까지만 한다 — 「확정되지 않았다」와
        「아니다」는 다르다.
      · 「X로 읽지 마라」는 항상 「대신 Y로 읽어라」와 함께 쓴다. 금지만
        주면 재는 쪽이 흔들리고, 대체 측정을 주면 안 흔들린다.
      · 시각 범위로 증거를 거를 때는 **그 범위 자체가 미확정인지 먼저
        본다** — 미확정이면 범위 없이 훑는다. 남이 준 창 안에서만 찾으면
        그 창이 틀렸을 때 화면에 이미 있던 증거를 라벨이 가린다.
      · **표본 하나로 기법을 확정하지 않는다** — 두 변종이 그 표본에서만
        우연히 같은 값을 내면 차이가 안 보인다(위 종료 시각 셋이 그랬다:
        하위가 얕은 표본에서는 ②와 ③이 같다).
      · 프로세스 스캔과 디스크 재구성은 **앞머리에서 함께 눈이 먼다** —
        basetemp 생성은 명령 시작보다 몇 초 늦고, 그 구간이 스캔이 0을
        내는 구간과 같다. 층이 달라도 이 구간에서는 상관돼 있으므로
        **착수 선언이 앞구간을 덮는 유일한 축이다.** (그래서 복원된 소요는
        실측보다 계통적으로 짧다: 종료를 1초 안에 맞혀도 시작이 늦게
        잡힌다.)
      · **좁혀 적은 판정은 전파되면서 넓어진다** — 「s35에 대해 겹침
        없음」이 한 다리 건너 「겹침 없음」이 된다. 판정을 옮길 때는
        그것이 무엇에 대한 판정이었는지를 같이 옮겨라.
      · **두 수치가 안 맞는데 아무도 안 묻는 자리를 발견 신호로 쓴다.**
        서로의 결론은 부지런히 깎으면서 서로의 수치가 어긋나는 것은
        지나치기 쉽다 — 오늘 1~3초와 8초가 같은 공지에 나란히 실린 채로
        지나갔다.
      · **두 규칙이 각자 맞는데 서로를 무력화하는 자리를 아무도 안 본다.**
        각 규칙은 자기 자리에서만 읽히고 한 화면에 같이 뜨지 않기 때문이다
        — 정리 규칙이 포렌식 기록을 지우던 자리가 그 실례다.
    done_when: |
      바꾼 영역을 덮는 신규·확장 테스트가 존재하고, 보고에 수치(M/M,
      신규 K)와 **골라 돌린 모듈 목록**이 있다(전체 스위트를 돌린 수치가
      아니다 — 그것은 이 스텝의 것이 아니다). 수치에는 트리 해시와
      (트리, 환경)이 붙어 있고, 창 확보 절차를 밟았다면 잡힌 행이 보고에
      있다.
    # 저장소 특화 verify는 정본이 아니라 프로젝트 레이어(.claunch/workflows/)에.
    next: commit

  commit:
    title: 커밋·보고
    instructions: |
      저장소 관례(한 줄 요약 — 「무엇을 어떻게」)로 커밋한다. 워크트리
      브랜치 위에서 작업했으면 피처 브랜치를 워크트리 브랜치에 --no-ff로
      머지해 한 갈래로 정리한다 — 이 머지의 상한은 워크트리 브랜치까지다.
      단 이 상한은 **한 워크트리에 회차가 하나일 때**의 규칙이다. 접기
      전에 워크트리 브랜치의 상태를 먼저 본다 — 다음 둘 중 하나라도
      해당하면 접지 않고 **피처 브랜치 자체가 인계 단위**다:
      · **은퇴**: `git branch --contains <워크트리 브랜치> --list master`가
        master를 내놓으면 그 브랜치는 이미 통합돼 임무가 끝났다. 접으면
        master보다 뒤처진 갈래를 되살리는 셈이다.
      · **동결·심사 중**: 그 브랜치가 통합 대기로 올라가 있으면 접는 순간
        남이 심사 중인 브랜치의 tip이 내 손에 움직인다. 심사 중에 되돌릴
        수 없는 쪽을 고르지 않는다 — 머지는 나중에 언제든 할 수 있다.
      두 경우 모두 접지 않은 이유를 보고에 적는다. 회차가 여러 번 도는
      워크트리에서는 워크트리 브랜치가 여러 목표가 쌓인 곳이 되므로,
      무관한 목표를 한 갈래에 얹지 않는 것이 상한 규칙보다 우선한다.
      하위 워커를 둔 회차면 완료 보고가 온 자식 브랜치를 각각 자신의
      워크트리 브랜치에 --no-ff로 머지해 모은다 — 자식 하나당 머지 커밋
      하나, fast-forward로 뭉개지 않아 브랜치 이력이 트리 구조로 남게
      한다(자식이 손자 브랜치를 같은 방식으로 모았으면 그 트리가 통째로
      실린다). 아직 작업 중인 자식 브랜치는 모으지 않고 그 사실을 보고에
      남긴다. 단, 리더가 mesh-delegate로 세운 전담 중간 워커는 이
      워크플로가 아니라 improv-mid로 돌며 자식 착지는 거기 스택 착지
      절차(순서·restack 공지 포함)가 맡는다 — 여기 규칙은 한 회차 안에서
      스스로 자식을 둔 워커의 것이다.
      master는 어떤 경우에도 머지 대상이 아니다(머지는 리더 전권).
      그리고 완료 보고를 만든다: 목표, 브랜치,
      기능 커밋·머지 커밋 해시, 테스트 수치. 메시에 속해 있으면 같은 내용을
      리더에게 fyi로 보낸다 — 이 증거 묶음이 머지 심사의 근거가 된다.
    done_when: |
      커밋(워크트리 작업이면 --no-ff 머지까지, 단 워크트리 브랜치가 이미
      master에 포함된 은퇴 상태면 접기 없이 피처 브랜치가 인계 단위이고
      그 판별과 이유가 보고에 있다)이 만들어졌고, 완료 보고가 온 자식
      브랜치가 있으면 각각 --no-ff 머지 커밋으로 모였으며, 목표·브랜치·
      커밋 해시·테스트 수치가 담긴 완료 보고가 기록되었다(메시 가입 시
      리더 fyi 포함). master는 움직이지 않았다.
    next: landing

  landing:
    title: 착지 결정
    select:
      # 착지는 상위 세션의 결정이다 — 사람 문이 아니다. 이 문이 되돌릴 수
      # 없는 것을 지키지 않기 때문이다: request 갈래의 종점(integration-
      # request)은 master 머지를 명시적으로 금지하므로 요청은 상위의 통합
      # 대기 표에 줄 서는 것뿐이고, hold 갈래도 wrapup의 HOLD 코멘트와 상위
      # fyi로 같은 표에 돌아온다. 양쪽 다 가역이고, master를 지키는 방어는
      # 리더의 머지 전권과 통합 후 전체 스윕이지 이 select가 아니다. 리더
      # 쪽에는 이미 같은 판정이 내려져 있다 — improv-leader의 integrate는
      # 실제 master 머지인데도 사람 문을 폐지하고 self-decision으로 돈다.
      # 무거운 쪽이 안 묻는데 가벼운 쪽이 매번 사람을 세우고 있었다.
      prompt: |
        너에게 딸린 워커 하나가 이번 목표를 자기 브랜치에 커밋했고 표적
        테스트가 green이다. 지금 그 브랜치를 네 통합 대기 표에 올리게
        하는가(워커는 먼저 통합 대상 위로 rebase한 뒤 증거 묶음을 만들어
        요청을 보낸다), 아니면 브랜치를 동결해 두고 이 회차를 마감하게
        하는가?

        판단 근거는 이미 네 손에 있다: 그 워커의 커밋 단계 완료 보고
        fyi(목표·브랜치·커밋 해시·테스트 수치)가 그것이고, 모자라면
        `claunch cflow status -t <그 세션> --json`과 journal이 나머지를
        말해 준다. 지금 줄을 세울 여력이 있는지, 대기 중인 다른 브랜치와
        충돌하는지, 스윕 배치 타이밍이 맞는지 — 그 표의 상태를 아는 것은
        너다.

        어느 쪽을 골라도 이 워커가 머지하는 일은 없다. 머지 실행은 상위
        세션의 몫이고, master 머지는 그중 리더의 통합 단계에서만 일어난다.
      # 누가 답하는가 — 통합 대기 표의 주인, 곧 이 워커의 상위 세션이다.
      # 부모가 중간 워커(improv-mid)면 그 역할도 worker이므로 첫 그룹이
      # 받고(scope: ancestor + 스폰 시 wired라 닿는 상위는 직속 부모뿐이다),
      # 평면 편성이면 첫 그룹이 아무도 못 맞춰 skip되고 리더가 받는다 —
      # skip 사유는 저널에 남는다. chooser: agent는 쓰지 않는다: hold가
      # rebase와 증거 묶음을 건너뛰므로 고르는 자와 득 보는 자가 같아진다.
      # 상위가 없는 단독 편성이거나 30분 안에 답이 없으면 사람에게 간다 —
      # 그 자리에서만 이 결정이 사용자의 것이다.
      chooser:
        from:
          - {role: worker, scope: ancestor}
          - {role: leader, scope: ancestor}
        otherwise: human
        timeout: 1800
      options:
        request:
          description: 지금 상위 세션에 통합 요청 — 먼저 통합 대상 브랜치로 rebase해 최신화한 뒤 증거 묶음을 만들어 올린다(머지 실행은 상위 세션)
          next: rebase
        hold:
          description: 브랜치 동결(추가 커밋 없음) — 통합은 나중에, 정리로
          next: wrapup

  rebase:
    title: 리베이스 (머지 요청 전 정렬)
    instructions: |
      일반적인 pull request 워크플로우와 같다 — 요청은 rebase 후에 한다.
      통합 대상 브랜치(상위 세션이 머지할 브랜치: 상위가 리더면 master,
      상위가 워커면 그 워커의 브랜치)가 내 브랜치의 분기점 이후 앞으로
      움직였으면, 내 브랜치를 그 위로 rebase해 정렬한 뒤 요청한다.
      원격이 있는 편성이면 먼저 대상을 fetch한다(로컬 전용 편성은
      불필요).

      분기 판별 — git merge-base로 내 분기점을 구해 대상 tip과 비교한다:
        git merge-base <대상> <브랜치>
        git rev-parse <대상>
        git rev-list <브랜치>..<대상>      # 대상이 내 분기점 뒤에서 앞선 커밋
      rev-list가 비어 있으면 대상이 분기 이후 움직이지 않은 것이고
      rebase할 것이 없다 — 그 사실을 보고에 한 줄 남기고 다음으로
      넘어간다. 비어 있지 않으면 분기가 벌어진 것이다:
        git rebase <대상>
      충돌이 나면 대상이 정한 방향을 먼저 읽고 그 위에 내 변경을 얹어
      해결한다 — 충돌을 지웠다고 보고하지 않는다. rebase 후에는 표적
      테스트를 다시 돌려 여전히 green인지 확인하고, 그 수치와 rebase 후
      브랜치 tip 해시를 보고에 남긴다 — 이 재확인이 없으면 rebase가
      안전함을 아무도 보장하지 않는다.

      ── 금지의 경계 ──
      이 rebase는 내 브랜치의 기준점을 옮기는 것이지 master를 움직이는
      것이 아니다. master를 체크아웃해 커밋하거나 master로 push/merge하는
      금지(「워커는 master를 직접 머지하지 않는다」)는 이 단계에서도 그대로
      살아 있다. 리더가 rebase 재요청을 보내면(분기가 다시 벌어졌거나
      미리 병합이 충돌한다는 것) 브랜치를 동결 해제하고 이 rebase 단계를
      다시 밟아 최신 대상 위로 재정렬한 뒤 갱신된 증거 묶음으로 재요청한다
      — PR 워크플로우처럼 재요청은 rebase 후에 간다.

      ── 스택 위에서 (restack) ──
      부모가 중간 워커면 대상은 intake에서 적은 기준 브랜치(스택 베이스
      또는 선행 자식 브랜치)다. 중간 워커가 restack 공지를 보내면(다른
      자식이 베이스에 착지해 tip이 움직였다, 또는 베이스가 master 위로
      재정렬됐다) 이 단계를 다시 밟는다: `git rebase <기준>` — 베이스에
      --no-ff로 이미 실린 커밋은 upstream에 있으므로 rebase가 건너뛰고 내
      커밋만 다시 얹힌다. 재확인 후 요청을 이미 올렸으면 갱신된 묶음으로
      재요청하고, 아직이면 새 기준 tip을 보고에 적어 둔다.
    done_when: |
      통합 대상 브랜치와의 분기 유무를 git merge-base로 판별해, 분기가
      벌어졌으면 rebase(충돌 해결 포함)와 표적 테스트 재확인 수치,
      rebase 후 tip 해시를 보고에 남겼고, 분기가 안 벌어졌으면 그 사실을
      한 줄 남겼다. master는 건드리지 않았다.
    next: integration-request

  integration-request:
    title: 상위 통합 요청 (머지는 상위 세션 전권)
    instructions: |
      이 단계는 통합을 요청하는 단계다 — 머지를 실행하는 단계가 아니다.
      요청 대상은 자신을 스폰한 상위 세션이다: 상위가 리더면 master 통합
      심사 요청(머지는 리더 워크플로우의 통합 단계), 상위가 워커면 내
      브랜치를 그 워커의 브랜치에 --no-ff로 머지해 달라는 요청(실행은
      상위 워커의 커밋 단계 — 트리 구조가 한 단계씩 위로 접힌다).
      첫 행동은 보드다: `claunch beads update <id> --status in_review` 와
      `claunch beads comments add <id> "<브랜치> @ <tip>, tests N/M (표적),
      run <run id>"` — 상위의 통합 대기 표는 이 in_review 목록이고, 이 전이가
      없으면 요청은 표에 없다. rebase 재요청을 받아 재정렬한 뒤에는 같은
      전이를 다시 한다(상위가 in_progress로 되돌려 두었다).

      ── 금지: 워커는 master를 직접 머지하지 않는다 ──
      master로의 git merge 실행, master 체크아웃 후 커밋·리베이스·
      cherry-pick, fast-forward로 슬쩍 반영, master로의 push — 전부
      금지다. 사용자가 승인했다는 이유로도, 리더가 응답이 없다는 이유로도,
      충돌이 없어 안전해 보인다는 이유로도 예외가 아니다. master 반영
      경로는 리더 워크플로우(improv-leader)의 통합 단계 하나뿐이다.
      이 런에서 master를 움직였다면 그 자체가 사고다.

      요청은 상위 세션이 심사할 수 있는 증거 묶음으로 만든다:
      - 목표·범위, 브랜치 이름, 기능 커밋·머지 커밋 해시, 테스트 수치
        (표적 실행임을 명시하고 돌린 모듈을 적는다 — 전체 스윕은 리더의
        통합 단계에서 배치로 한 번, subagent 안에서 돈다)
      - git log <상위 브랜치>..<branch> / <branch>..<상위 브랜치> 양방향
        차이(상위가 리더면 상위 브랜치는 master) — 상위 브랜치가 분기
        이후 움직였으면 그 사실과 예상 충돌 지점을 명시 (요청 전 rebase
        단계에서 정렬했으므로 뒤처짐은 없어야 정상이다 — 남아 있으면
        rebase가 충분하지 않았던 것이므로 그 사실을 함께 적는다)
      - rebase했으면 그 사실과 rebase 전후 tip 해시, 재확인된 표적
        테스트 수치
      - 이 브랜치가 다른 세션의 브랜치를 포함하면(git branch --contains)
        함께 실리는 작업이 무엇인지 명시 — 하위 워커 브랜치를 --no-ff로
        모은 회차면 어느 자식의 어떤 브랜치가 어떤 머지 커밋으로
        실렸는지 트리 구조를 그대로 적는다
      - 스택 위치(부모가 중간 워커면): 기준 브랜치와 요청 시점의 그 tip
        해시(내 분기점과 같아야 한다 — 다르면 restack이 덜 된 것이다),
        스택 순서, 그리고 `git merge-tree $(git merge-base <기준> <branch>)
        <기준> <branch>` 프리뷰가 깨끗하다는 것. 중간 워커는 이 묶음을
        기준 대비로 심사해 자기 브랜치에 --no-ff로 착지하고, 남은 자식들
        에게 restack 공지를 보낸다(improv-mid의 착지 절차).
      이 묶음을 보고에 남기고 상위 세션에 통합 요청으로 보낸 뒤, 브랜치를
      동결한다(추가 커밋 없음). 상위가 없는 편성(메시 미가입)이면 같은
      묶음을 보고로 남기고 사용자에게 통합은 리더 세션 또는 사용자
      본인의 몫임을 안내한다 — 그 경우에도 이 워커가 대신 머지하지 않는다.
      리더가 rebase 재요청을 보내면(분기가 다시 벌어졌거나 미리 병합이
      충돌한다는 것) 브랜치를 동결 해제하고 rebase 단계로 돌아가 최신
      대상 위로 다시 정렬한 뒤, 갱신된 증거 묶음으로 재요청한다.
    done_when: |
      이슈가 in_review로 전이되었고(브랜치·tip·수치 코멘트 포함), 증거
      묶음(목표·범위, 브랜치, 해시, 수치, 양방향 diff, 포함 관계 —
      자식 브랜치를 모았으면 그 트리까지)이 보고에 있고 상위 세션에 통합
      요청이 나갔으며(상위 부재 시 사용자 안내로 대체), 브랜치는 동결
      상태다. master는 움직이지 않았다.
    next: wrapup

  wrapup:
    title: 회차 마감·정리
    instructions: |
      회차 잔류물을 정리하고 증거를 보고에 남긴다:
      - 잔류 테스트 서버·headless 브라우저 프로세스 종료 — 부모만 죽고
        자식 node가 살아남는 경우가 있으니 포트 점유(예: Get-NetTCPConnection)
        로 확인한다
      - 임시 파일(.tmp, DB 사본, 픽스처, 브라우저 프로필) 삭제, git status
        클린 확인
      - **basetemp는 지우지 않는다 — 포렌식 기록이다.** 이 정리의 목적은
        작업 트리를 깨끗이 두는 것인데 basetemp는 저장소 밖(예: C:/t)에
        있어 git status에 안 잡힌다. 그 안에 이 회차 실행들의 시작 시각·
        소요·워커 수·실행량이 남아 있고, 그것이 나중에 「이 수치가 무엇에
        대한 판정이었나」를 되짚는 유일한 원자료다. 그래도 지워야 하는
        사정이 있으면 **지우기 전에 (시작 · 소요 · 워커 수 · 실행량)
        네 값을 보고에 적어** 기록을 저널로 옮긴다. 보존 기간은 **그 배치가
        랜딩할 때까지**다 — 랜딩하면 수치가 심사에 쓰이고 나므로 지워도
        된다. 기한을 안 적으면 영구 보존으로 읽히거나, 디스크가 차서
        임의로 지우다 필요한 것을 날린다
      - 보드 정리: hold로 동결했으면 `claunch beads comments add <id> "HOLD:
        <이유>, <브랜치> @ <tip>"`(상태는 그대로 in_progress — 상위가 본다).
        다음 사람에게 넘길 것(범위 밖으로 미룬 일, 알아낸 결함, 후속)은
        항목마다 `claunch beads create "<제목>" --priority 3 --labels handoff
        --description "<규격>"`(assignee 없음) — 마감 fyi에 그 id들을 적는다.
        메시 메시지에만 남긴 인수인계는 다음 회차에 없다.
        워커가 하지 않는 것 셋: `beads close`(리더의 일 — 머지된 뒤에), `beads
        sync`(리더가 통합 뒤에 한 번), `.beads/`를 커밋하는 것(리더가 master
        에서만).
      최종 보고: 이 회차의 목표·이슈 id·커밋·테스트 수치·착지 상태(상위
      세션에 통합 요청됨 / 동결 — 브랜치 이름)를 요약한다. master는 이 런이
      건드리지 않았어야 정상이다. 동결 브랜치가 남았으면 상위 세션에
      fyi로 알려 통합 대기 목록에 오르게 한다.

      ── 세션 종료 (회차의 일부다 — 선택이 아니다) ──
      이 워크플로우는 recur하지 않는다 — 이 회차가 이 세션의 처음이자
      마지막 작업이다. 최종 보고와 상위 fyi까지 마쳤으면 next로 런을
      end까지 진행해 done으로 만들고, 그 다음 마지막 행동으로 자기
      세션을 종료한다:
        claunch kill-session $CLAUNCH_SESSION
      (mesh의 kill 도구는 자기 자신을 거부한다 — 하위 세션 전용이므로
      자기 종료는 이 CLI 경로만 있다.) 이 명령이 데몬에 닿는 순간 이
      pane이 닫히므로, 종료 뒤에 할 일을 남겨 두지 마라 — 보고·fyi·런
      done이 전부 이 명령보다 앞이다. 순서를 지켜야 하는 이유: 먼저
      죽으면 런이 wrapup에 걸린 채 남고, 보고가 안 나간 채 죽으면 이
      회차의 증거가 세션과 함께 사라진다.

      ★ **이 줄을 안 지키는 것이 이 워크플로우의 가장 흔한 미완료다.**
      보고까지 다 해 놓고 kill만 안 한 회차가 반복해서 나왔다. 원인은
      게으름이 아니라 **신중함으로 위장한 망설임**이고, 아래 넷이 그
      전형이다 — 어느 것도 종료를 미룰 사유가 되지 못한다:
      · 「사용자가 이 터미널에 있어 pane을 임의로 닫기 그렇다」 —
        이 세션은 이 회차를 돌라고 만들어졌고 **워크플로우의 이 줄이
        곧 그 승인**이다. 사용자는 이 종료에 이미 동의한 채로 세션을
        띄웠다. 새로 받아낼 허락이 없다.
      · 「리더가 rebase 재요청·restack을 보낼 수 있다」 — 브랜치와
        bead는 세션과 무관하게 남고, 리더는 죽은 세션의 브랜치도
        머지한다. 정말 사람 손이 필요하면 `claunch respawn`이 있다.
        **살아서 대기하는 것은 도움이 아니라 슬롯 점유다.**
      · 「머지 착지를 확인하고 닫겠다」 — 착지 확인은 이 회차의 완료
        조건이 아니다. 통합은 리더의 회차이고 며칠이 걸릴 수도 있다.
      · 「닫아도 될까요?」라고 사용자에게 되묻는 것 — **묻지 마라.**
        묻는 순간 사용자는 이미 정해 둔 답을 한 번 더 타이핑해야 하고,
        그 턴이 끝나 버려 명령은 영영 안 나간다.
      남아 있는 세션이 실제로 무는 값: 스폰 캡의 슬롯 하나, 리더
      roster의 가짜 [idle] 행, 그리고 나중에 사람이 손으로 하는
      clear-sessions.

      **예외는 하나뿐이다**: 이 세션의 사용자가 이 회차 안에서
      「닫지 말고 있어라」를 **명시적으로 말했을 때**. 리더의 말은
      해당하지 않고(리더는 세션이 아니라 브랜치를 기다린다), 네 추측도
      해당하지 않는다. 그 경우에도 최종 보고에 「사용자 지시로 종료
      보류」를 한 줄 남겨, 다음 사람이 이 세션이 왜 살아 있는지 알게
      한다.

      그리고 **예고하지 마라**. 「이제 닫겠습니다」를 써 놓고 턴을
      끝내면 그 턴이 마지막 턴이 되어 명령이 나가지 않는다 — 말만
      하고 실행하지 않은 채 두 턴을 보낸 실사례가 있다. 최종 보고를
      쓴 **같은 턴에서** kill-session을 실행한다: 보고가 그 명령의
      앞줄이지, 다음 턴의 예고가 아니다.
    done_when: |
      잔류 프로세스·임시 파일이 정리되어 git status가 클린하고, 회차 최종
      보고(목표·이슈 id·커밋·수치·착지 상태, 인수인계 이슈 id)가 기록되었다.
      (세션 종료 자체는 이 게이트 뒤의 일이다 — done 이후 claunch
      kill-session으로 실행한다. 게이트 뒤라는 것은 '나중에'도 '선택'도
      아니고 '이 게이트를 통과한 직후'라는 뜻이다: 이 보고를 쓴 같은
      턴에서 실행한다.)
    next: end
