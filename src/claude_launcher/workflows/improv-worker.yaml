name: improv-worker
description: >
  자유 진행 워커 — 터미널 사용자(또는 리더 브리핑)가 주는 목표 하나가 한
  회차다: 목표 수립 -> 작업 -> 테스트(verify) -> 커밋·보고 -> (사용자가
  결정) 착지: master --no-ff 머지 요청 또는 브랜치 동결 -> 정리 -> 종료.
  recur가 끝난 회차마다 다음 회차를 요청하므로 목표마다 저널이 분리된다.
  반복을 멈추는 것은 사용자다(claunch cflow request --cancel).
start: intake
recur: true

steps:
  intake:
    title: 목표 수립
    instructions: |
      새 회차다 — 이번 회차의 목표 하나를 확정한다. 출처는 둘 중 하나다:
      터미널 사용자의 직접 지시, 또는 리더의 브리핑. 목표가 아직 없으면
      여기서 대기한다(회차는 목표가 생길 때 시작된다). 다음을 정해 보고에
      남긴다:
      - 목표와 범위(무엇이 포함되고 무엇이 제외되는가)
      - 작업 브랜치 계획: 지금 경로가 워크트리 브랜치면 그 위의 피처
        브랜치, master 작업 디렉터리면 새 피처 브랜치 — master에 직접
        커밋하지 않는다
      - 완료 증거 기준: 테스트 수치(suite green N/N, 신규 K), 커밋 해시
      정본·공용 규칙(파서, 직렬화, 포맷, 공용 문서)에 닿는 목표면 착수 전에
      리더에게 fyi로 알려 다른 세션의 확정 규칙·진행 중 작업과 충돌하는지
      확인한다 — 같은 규칙을 두 세션이 다르게 정하는 사고를 여기서 막는다.
      메시에 속해 있으면 목표 요지를 리더에게 fyi로 남긴다.
    next: work

  work:
    title: 작업 실행
    instructions: |
      피처 브랜치에서 목표를 구현한다. 커밋은 작고 초점 있게, 범위 밖
      (master, 공용 문서, 다른 세션의 워크트리)은 건드리지 않는다. 작업 중
      정본 규칙과 어긋나는 선택지가 나타나면 혼자 정하지 말고 리더에게
      물어 단일 규칙으로 기록되게 한다. 보고에는 바꾼 파일과 접근 방식
      요지를 남긴다.
    next: review

  review:
    title: 테스트
    instructions: |
      바꾼 영역을 덮는 유닛테스트를 추가·확장하고 전체 스위트를 돌린다.
      verify가 같은 명령을 서버에서 재실행하므로, 보고에는 수치(전체 N/N,
      신규 K)와 커버한 시나리오를 남긴다. 실제 화면·CLI 동작 확인이 의미
      있는 변경이면 그 증거(방법과 결과)도 함께 남긴다.
    verify: "npm --prefix design-notebook run build && npm --prefix design-notebook test"
    next: commit

  commit:
    title: 커밋·보고
    instructions: |
      저장소 관례(한 줄 요약 — 「무엇을 어떻게」)로 커밋한다. 워크트리
      브랜치 위에서 작업했으면 피처 브랜치를 워크트리 브랜치에 --no-ff로
      머지해 한 갈래로 정리한다. 그리고 완료 보고를 만든다: 목표, 브랜치,
      기능 커밋·머지 커밋 해시, 테스트 수치. 메시에 속해 있으면 같은 내용을
      리더에게 fyi로 보낸다 — 이 증거 묶음이 머지 심사의 근거가 된다.
    next: landing

  landing:
    title: 착지 결정
    select:
      # 착지는 사용자 권한 — 워커가 스스로 master행을 정하지 않는다.
      prompt: |
        이번 목표가 브랜치에 커밋되고 스위트가 green이다. 지금 master에
        --no-ff 머지를 요청하는가, 아니면 브랜치를 동결해 두고(리더의 일괄
        통합 대기 등) 이 회차를 마감하는가?
      chooser: user
      options:
        merge:
          description: 지금 master 통합 심사로 — 승인되면 --no-ff 머지 실행
          next: merge-request
        hold:
          description: 브랜치 동결(추가 커밋 없음) — 통합은 나중에, 정리로
          next: wrapup

  merge-request:
    title: master 통합 (--no-ff)
    ask:
      # from 없음 = 순수 사용자 게이트. master 반영은 사용자 권한이다.
      prompt: |
        이 회차의 완료 증거 — 목표·범위, 브랜치, 커밋 해시, 테스트 수치 —
        가 저널의 커밋·보고 단계에 있다. 보고 문구가 아니라 그 증거 항목을
        근거로 심사하라. 해시나 수치가 비어 있으면 거절하라. master --no-ff
        머지를 승인하는가? (거절해도 브랜치는 동결 상태로 유지된다)
      timeout: 3600
      on_decline: wrapup
    instructions: |
      머지 전에 토폴로지를 명령으로 확인한다:
      - git log master..<branch> / <branch>..master 로 양방향 차이를 확인
        — master가 분기 이후 움직였으면 충돌 여부를 먼저 본다
      - 이 브랜치가 다른 세션의 브랜치를 포함하고 있으면(git branch
        --contains) 머지에 함께 실리는 작업이 무엇인지 보고에 명시한다
      머지는 반드시 --no-ff, 커밋 메시지는 저장소 관례를 따른다. verify가
      머지 결과 트리에서 스위트를 재실행한다. 머지 커밋 해시와 diffstat을
      보고에 남기고, 메시에 속해 있으면 master가 움직였음을 리더·동료에게
      fyi로 알린다(이후 작업은 새 master 기준 브랜치에서).
    verify: "npm --prefix design-notebook run build && npm --prefix design-notebook test"
    next: wrapup

  wrapup:
    title: 회차 마감·정리
    instructions: |
      회차 잔류물을 정리하고 증거를 보고에 남긴다:
      - 잔류 테스트 서버·headless 브라우저 프로세스 종료 — 부모만 죽고
        자식 node가 살아남는 경우가 있으니 포트 점유(예: Get-NetTCPConnection)
        로 확인한다
      - 임시 파일(.tmp, DB 사본, 픽스처, 브라우저 프로필) 삭제, git status
        클린 확인
      최종 보고: 이 회차의 목표·커밋·테스트 수치·착지 상태(master 반영 /
      동결 브랜치 이름)를 요약한다. 동결 브랜치가 남았으면 리더에게 fyi로
      알려 통합 대기 목록에 오르게 한다. 회차가 끝나면 recur가 다음 회차를
      요청한다 — 더 할 목표가 없다고 하면 사용자에게 반복 종료(claunch
      cflow request --cancel)를 안내한다.
    next: end
