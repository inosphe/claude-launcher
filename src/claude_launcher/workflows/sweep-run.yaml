# sweep-run — 한 트리를 한 번 스윕하고 끝나는 일회성 런.
#
# 왜 일회성인가가 이 파일의 설계 전부다. 데몬은 run 이 `done` 에 이른 것을
# 보면 그 세션을 회수한다(daemon/cflow_clock.py 의 kill-on-end). 발화 조건은
# 네 가지고, 그중 둘은 이 파일이 지고 있다:
#
#   1. 워크플로가 `recur` 를 선언하지 않았다       <- 이 파일이 진다
#   2. 끝나는 스텝이 `escalate` 를 선언하지 않았다  <- 이 파일이 진다
#   3. daemon.cflow_kill_on_end 가 켜져 있다       (기본값 True, store.py)
#   4. 세션에 keep_alive 가 걸려 있지 않다         (기본값 False, harness.py)
#
# 그래서 이 파일에 `recur:` 나 `escalate:` 를 더하면 문법은 통과하지만
# 세션이 끝나도 회수되지 않는다 — 사용자가 하나씩 확인해서 죽여야 하는
# 그 상태로 돌아간다. tests/test_cflow_sweep_run.py 가 이 두 가지를 못박는다.
#
# 지금 이 머신의 실측(2026-08-28): recur 를 선언한 것은 improv-leader·poll·
# brief 셋이고 — 상주 서비스 루프라 의도된 것이다 — 스텝 필드 `escalate:` 를
# 선언한 워크플로는 패키지·프로젝트·전역 어느 레이어에도 없다. 그러므로
# improv-worker 로 도는 일회성 세션이 남아 있다면 원인은 조건
# 1·2 가 아니라 조건 3(런이 done 에 닿지 못했다)이거나 조건 4(keep_alive)다.
# improv-worker 의 end-hold 스텝은 조건 4 를 의도적으로 거는 자리다
# (tools/keepalive_check.py 가 그 플래그를 확인한다).
#
# 조건 1·2 를 지켜도 run 이 `done` 에 닿지 못하면 아무 소용이 없다. 그래서
# 이 워크플로에는 막다른 길이 없다: 슬롯이 거절돼도, 스윕이 빨강이어도
# 각자의 보고 스텝을 거쳐 end 로 간다. 빨강을 막다른 길로 두는 것이
# 「일회성 세션이 안 죽는다」의 가장 흔한 원인이다 — 초록에서만 통과하는
# verify 를 스윕 스텝에 걸면 빨강인 날은 영원히 그 스텝에 선다.
name: sweep-run
description: >-
  지금 체크아웃된 트리의 전체 스위트를 한 번 돌려 영수증과 수치를 남기는
  일회성 런. 슬롯(동시 스윕 금지)은 리더 승인으로 열고, 초록 주장은
  영수증으로 재판정하며, 빨강이어도 보고하고 끝난다. 런이 끝나면 데몬이
  세션을 회수한다 — recur 도 escalate 도 선언하지 않는다.
  context = 무엇을 왜 재는지 한 줄(선택). 예: "r17 통합 배치 프리뷰".
start: preflight

# 드라이버는 worker 다. 리더가 이것을 직접 몰면 자기 턴이 스윕 시간만큼
# 막힌다 — improv-leader 의 sweep 게이트가 전체 스위트를 verify 로 걸었다가
# 리더의 next 를 178초 막았던 사고가 그것이고, 그 뒤로 스윕은 워커 몫이다
# (.claunch/workflows/improv-leader.yaml 의 sweep 스텝 주석).
filter_roles:
  type: whitelist
  roles: [worker]

steps:
  preflight:
    title: 딛고 선 자리를 먼저 적는다
    instructions: |
      3분을 쓰기 전에 무엇을 재는지부터 확정한다. 다음을 그대로 찍어
      보고에 옮긴다 — 나중에 「어느 트리의 수치인가」를 되물을 수 없다.

          git rev-parse --show-toplevel
          git rev-parse --abbrev-ref HEAD
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain

      두 가지를 판정한다.

      (1) 전제가 맞는가. 이 런의 `context` 나 오프닝 태스크가 기대 tip 을
          지정했으면 지금 HEAD 와 대조한다. 다르면 스윕하지 않는다 — 그
          사이에 브랜치가 움직인 것이고, 재 봐야 아무도 요청하지 않은
          트리의 수치다. 그 사실과 실제 HEAD 를 보고에 적고, 요청한 쪽에
          알린 뒤 판단을 받는다.

      (2) 트리가 깨끗한가. `git status --porcelain` 이 비어 있어야 한다.
          여기서는 판정만 하고 고치지 않는다: 더러운 트리는 tools/sweep.py
          가 스스로 거절하며, 몇 개의 경로 때문인지까지 말해 준다. 같은
          판정을 두 군데 적으면 갈리므로 여기서는 sweep.py 의 답을 그대로
          쓴다. `--allow-dirty` 는 쓰지 않는다 — 그것은 「이 커밋」이 아니라
          「이 커밋 + 굴러다니던 것」의 영수증이고, 명시적으로 신뢰 불가로
          기록된다.

      임시 파일을 쓸 일이 있으면 `$CLAUNCH_SCRATCH` 에 쓴다 — 데몬이 세션마다
      만들어 환경변수로 내보내는 디렉터리이고, 세션 이름에서 나오므로 두 세션이
      같은 경로를 잡는 일이 없다. 하네스가 따로 스크래치패드를 주면 그쪽도
      같다. `/tmp/<고정이름>` 은 이 머신 전역 한 디렉터리라 다른 세션이 말없이
      덮고, 자기 워크트리 안에 쏟으면 방금 (2)에서 잰 청결이 깨진다
      (CLAUDE.md 의 「중간 파일은 세션별 경로에 쓴다」).
    done_when: |
      repo·브랜치·HEAD·트리·워킹트리 상태가 보고에 그대로 적혔고, 기대 tip
      과의 대조 결과와 트리 청결 여부가 각각 판정으로 적혔다.
    next: sweep

  sweep:
    title: 스윕 (슬롯을 쥐고 도는 구간)
    # ask 는 스텝 '진입'을 막는다. 그래서 별도의 대기 스텝을 두지 않고
    # 실제로 비싼 일을 하는 이 스텝에 붙인다 — 승인이 오기 전에는 아래
    # instructions 자체가 전달되지 않는다.
    ask:
      prompt: |
        전체 스위트를 한 번 돌릴 슬롯을 요청합니다. 지금 열어도 됩니까?

        이 저장소는 전체 스윕을 한 번에 하나만 돌립니다. 두 개가 겹치면
        양쪽 수치가 함께 무효가 되고, 무효라는 사실이 수치에 나타나지
        않는다는 것이 문제입니다 — 그럴듯하게 틀린 값이 남습니다.

        판단 기준은 지금 다른 전체 스위트가 도는 중인지 하나입니다.
        표적 몇 모듈만 도는 짧은 실행은 겹쳐도 됩니다. 프로세스 스캔에는
        사각이 있어 「매칭 0건」만으로는 근거가 서지 않으니, 지금 슬롯을
        쥐고 있다고 선언한 세션이 있는지로 답해 주십시오.
        애매하면 거절이 기본값입니다 — 거절해도 이 런은 그 사실을 적고
        정상 종료하며, 다시 요청하는 쪽이 겹친 수치를 버리는 것보다
        쌉니다.
      # 슬롯은 권한 판단이라 자기 지휘 계통에 묻는다.
      from: [{role: leader, scope: ancestor}]
      # 여기만 self 다. 규칙은 「self 를 기본값으로 쓰지 말고, 배포·삭제·
      # 게시 스텝에는 절대 쓰지 말라」이고 스윕은 셋 중 무엇도 아니다.
      # 그리고 이 자리에서 human 을 고르면 이 워크플로가 없애려는 바로 그
      # 증상이 된다 — 아무도 답하지 않는 게이트 앞에서 세션이 밤새 살아
      # 있는 것. 답이 없으면 저널에 「승인 아님, 무응답」으로 남고, 아래
      # instructions 가 그 사실을 수치와 함께 보고하게 한다.
      otherwise: self
      timeout: 1800
      on_decline: standdown
    instructions: |
      슬롯을 쥐었다. 세 가지를 한다: 선언, 실행, 관측.

      1. 선언한다. 요청한 쪽에 「지금 시작한다」를 한 줄 보낸다. 프로세스
         스캔에는 사각이 있어서 「매칭 0건」만으로는 남이 시작 근거를 세울
         수 없다. 승인이 아니라 무응답으로 여기 왔다면(저널이 그렇게 적혀
         있다) 그 사실도 같은 줄에 적는다 — 받는 쪽이 이 수치를 얼마나
         믿을지 정하는 근거다.

      2. 돌린다. 표준출력과 표준에러를 전부 파일 하나로 남긴다. 파일은
         `$CLAUNCH_SCRATCH` 에 쓴다(데몬이 세션마다 만들어 내보내는
         디렉터리다) — `/tmp/<고정이름>` 은 전역 한 디렉터리라 다른 세션이
         말없이 덮고, 워크트리 안에 쏟으면 preflight 에서 잰 청결이 깨진다.

             uv run --no-sync python tools/sweep.py run --branch <이 브랜치>

         `--branch` 에는 지금 서 있는 브랜치 이름을 그대로 쓴다. 영수증은
         브랜치 이름이 아니라 커밋 sha 로 철해지므로 이름은 읽는 사람을
         위한 것이고, sweep.py 는 HEAD 와 `--branch` 의 sha 가 다르면
         거절한다 — 아무도 테스트하지 않은 커밋의 영수증을 막는 장치다.

         이 명령은 몇 분이 걸린다. 끝날 때까지 다른 pytest 를 띄우지
         않는다.

      3. 관측한다. 스윕이 도는 동안 다른 pytest 프로세스가 보였으면 그
         사실을 적는다. 재지 않은 것은 재지 않았다고 적는다 — 시작 직전
         에만 표본을 떴다면 「도는 동안은 표본을 뜨지 않았으므로 그 구간에
         대한 근거가 없다」라고 쓴다. 「없었다」와 「보지 않았다」를 같은
         문장으로 적으면 읽는 쪽이 단독 실행을 실제보다 더 믿는다.

      실패를 고치지 않는다. 이 런은 재는 런이다. 코드를 만지면 다음 스텝의
      판정이 방금 잰 트리의 판정이 아니게 된다 — 고칠 것이 보이면 보고에
      적어 별도 회차로 넘긴다.
    done_when: |
      sweep.py 가 끝나 영수증을 남겼고, 표준출력·표준에러 전부가
      스크래치패드의 로그 파일 하나에 있으며, 그 파일 경로와 종료 코드,
      그리고 동시 실행에 대해 실제로 관측한 것(과 관측하지 않은 구간)이
      보고에 적혔다.
    next: verdict

  verdict:
    title: 초록인가 빨강인가
    select:
      prompt: |
        방금 돈 스윕은 초록입니까 빨강입니까?

        기억이나 화면에 스쳐 간 인상이 아니라 명령의 종료 코드로
        답하십시오:

            uv run --no-sync python tools/sweep.py check --branch HEAD

        이것은 영수증만 읽는 밀리초짜리 명령이고 스위트를 다시 돌리지
        않습니다. 종료 코드 0 이면 green, 아니면 red 입니다.
      # 사실 판단이라 드라이버가 답한다. 자기에게 유리한 쪽인 green 은
      # 다음 스텝의 verify 가 같은 명령으로 되잽으므로 틀리게 고르면
      # 스스로 막힌다 — 자기교정된다. red 를 고르는 쪽에는 유리할 것이
      # 없다(없는 실패를 적어야 한다).
      chooser: agent
      options:
        green:
          description: 실패 0건 — 영수증으로 되확인한 뒤 수치를 넘긴다
          next: handoff
        red:
          description: 실패가 있다 — FAILED 줄 전부와 첫 실패 줄을 적어 넘긴다
          next: failures

  handoff:
    title: 초록 — 수치를 넘긴다
    instructions: |
      요청한 쪽에 다음을 보낸다. 「초록이었다」한 줄은 보고가 아니다.

      - 합격 여부와 sweep.py 의 종료 코드
      - 수치 그대로: `N failed / M passed / K skipped`, 수집 수, 소요 시간.
        요약하지 말고 pytest 가 찍은 줄을 그대로 옮긴다.
      - 영수증 경로와 그 안의 commit·tree·dirty·session
      - 로그 파일 경로. 세션이 회수되면 터미널은 사라지고 이 파일만 남는다.
      - 동시 실행에 대해 관측한 것과 관측하지 않은 구간

      보내는 것은 사본이 아니라 포인터다. 로그 전문을 메시지에 붙이면 남의
      터미널에 타이핑되어 그쪽 컨텍스트로 값을 치르고, 그쪽 회차가 끝나면
      사라진다. 파일은 남는다.

      이 스텝의 next 가 이 런의 마지막이다. 먼저 두 가지를 끝낸다: 쥐고
      있는 이슈가 있으면 상태와 코멘트를 정리하고, 남겨야 할 파일이
      워크트리 밖(스크래치패드)에 있는지 확인한다. `next` 를 부르면 run 이
      `done` 이 되고 데몬이 그것을 보고 이 세션을 회수한다. 회수 전에
      진행 중인 턴이 끝나기를 기다려 주지만(cflow_kill_on_end_grace, 기본
      120초) 그 유예를 정리 시간으로 쓰지 않는다. 보고를 보낸 뒤 턴을
      마친다.

      회수가 일어나지 않는 경우가 하나 있다: 이 세션에 keep-alive 가 걸려
      있으면 기록만 남고 살아 있는다. 확인은
      `uv run --no-sync python tools/keepalive_check.py` — 종료 코드 0 은
      플래그가 걸려 있다는 뜻이고, 그때는 세션이 남는다는 사실을 보고에
      적는다. 끄는 것은 요청한 쪽의 판단이다.
    # 초록 주장을 기계가 되잽는 자리. 영수증만 읽으므로 밀리초다.
    # `--branch HEAD` 로 쓰는 이유: verify 는 정적 문자열이라 런의 context
    # 를 끼워 넣을 수 없는데, 영수증은 브랜치 이름이 아니라 커밋 sha 로
    # 철해지므로 HEAD 로 물어도 같은 파일에 닿는다.
    verify: 'uv run --no-sync python tools/sweep.py check --branch HEAD'
    done_when: |
      수치·영수증 경로·로그 경로·동시 실행 관측이 요청한 쪽에 전달됐고,
      쥐고 있던 이슈 정리와 남길 파일 확인이 끝났다.
    next: end

  failures:
    title: 빨강 — 실패를 그대로 옮긴다
    instructions: |
      빨강도 결과다. 고치지 않는다 — 귀속과 대응은 요청한 쪽이 정한다.
      다음을 보낸다.

      - 종료 코드와 수치 그대로: `N failed / M passed / K skipped`,
        수집 수, 소요 시간
      - FAILED 줄 전부. 로그에서 뽑는다: `grep '^FAILED' <로그파일>`.
        골라 담지 않는다 — 어느 것이 이번 변경 탓이고 어느 것이 이미
        알려진 불안정 실패인지는 받는 쪽의 판정이고, 그 판정에는 전부가
        필요하다.
      - 각 실패의 첫 실패 줄(assert 한 줄, 또는 예외 한 줄)
      - 미리 알려진 불안정 실패 목록을 받았다면 이번 실패가 그 이름들과
        일치하는지. 일치하지 않는 이름이 하나라도 있으면 그쪽은 실패 줄
        주변을 더 넓게 떠서 함께 보낸다 — 새 실패가 이번 변경의 문제일
        가능성이 크다.
      - 영수증 경로와 로그 파일 경로

      이 스텝의 next 가 이 런의 마지막이다. handoff 와 같다: 쥐고 있는
      이슈를 정리하고, 남길 파일이 워크트리 밖에 있는지 확인한 뒤 `next`
      를 부르고 턴을 마친다. 데몬이 세션을 회수한다.
    done_when: |
      FAILED 줄 전부와 각 실패의 첫 실패 줄, 수치, 영수증·로그 경로가
      요청한 쪽에 전달됐고, 알려진 불안정 실패와의 대조 결과가 적혔다.
    next: end

  standdown:
    title: 슬롯이 거절됐다 — 재지 않고 끝낸다
    instructions: |
      슬롯이 거절됐다. 스윕을 돌리지 않는다.

      거절은 실패가 아니라 답이다. 지금 다른 전체 스위트가 도는 중이면
      겹쳐서 낸 수치는 양쪽을 함께 버리게 만든다. 요청한 쪽에 다음을 적어
      보낸다: 재지 않았다는 사실, 거절 사유(저널에 있다), preflight 에서
      찍은 HEAD·트리 — 다음에 다시 요청할 때 같은 자리인지 대조할 근거다.

      그리고 끝낸다. 슬롯이 열릴 때까지 여기서 기다리지 않는다. 기다리는
      세션은 회수되지 않고, 그 사이 브랜치가 움직이면 지금 찍은 전제도
      만료된다. 다시 재는 것은 새 런이다.
    done_when: |
      재지 않았다는 사실과 거절 사유, preflight 에서 찍은 HEAD·트리가
      요청한 쪽에 전달됐다.
    next: end
