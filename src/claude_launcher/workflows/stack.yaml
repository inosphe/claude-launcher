# stack — 워커 세션이 자식 세션(하위 워커)들을 거느릴 때, 그 자식들의
# 브랜치를 모으는 스택을 관제하는 서브 런(kind: subflow).
#
# 왜 서브 런인가. 자식을 둔 워커는 두 가지 일을 동시에 한다: 자기 회차
# (improv-worker의 작업 -> 착지)와, 자식들의 통합 요청을 심사해 스택에
# 착지시키는 관제. 전에는 둘째를 improv-mid라는 별도 정의가 맡았고, 한
# 세션은 둘 중 하나만 돌 수 있었다. 그래서 자기 일감을 가진 워커가 자식을
# 거느리게 되면(s733) 관제 절차가 산문으로만 남거나, 회차 도중 런을 goto로
# 옮겨야 했다. 이 정의는 그 관제를 메인 런 옆의 슬롯 하나
# (`runs/<세션>/sub/stack/`)로 떼어 낸다. 두 런은 서로의 스텝 위치를 모른
# 채 각자 진행하고, 만나는 자리는 아래 마일스톤 넷뿐이다.
#
# 수명은 세션이다 — 회차마다 새로 세우지 않는다. 자식은 부모의 회차와
# 무관하게 아무 때나 생기고 끝나므로, 스택도 첫 자식이 생길 때 한 번
# 서고 세션이 끝날 때 닫힌다. 부모 회차와의 경계는 컷(cut)이다: 부모가
# 착지를 요청하려 할 때마다(cut-wanted) 스택은 그때까지 착지한 자식을
# 한 덩어리로 끊어 내놓고(cut), 부모는 그 컷을 자기 브랜치에 --no-ff로
# 한 번 머지한다.
#
# 마일스톤(엔진: model.Awaits, engine._publish_milestones):
#   메인 -> 스택  cut-wanted  메인 stack-cut 스텝을 떠날 때 (착지 전)
#   스택 -> 메인  cut         이 정의의 cut 스텝을 떠날 때
#   메인 -> 스택  frozen      메인 integration-request를 떠날 때 (요청 제출)
#   메인 -> 스택  landed      메인 landed 체크리스트가 열릴 때 (master 착지)
# 각 대기는 개수로 센다: 스텝을 떠날 때 본 게시 횟수가 기록되고, 그보다
# 큰 횟수가 「새 것」이다. 그래서 먼저 게시된 것도 잃지 않는다.
#
# 서브 정의가 못 갖는 것은 found-issue.yaml 머리 주석과 같다. 이 정의가
# 갖는 것 하나는 landing_queue다: 자식의 enqueue-landing 트리거는 부모
# 세션에서 landing_queue를 가진 런으로 가고(daemon/cflow_clock.
# _enqueue_landing), 한 세션에 그런 런은 하나다(engine._sub_start_checks).
name: stack
kind: subflow
description: >-
  자식 세션들의 브랜치를 모으는 스택의 관제 런(세션 수명). 입력 issue =
  스택을 연 회차의 이슈 id(첫 STACK 표가 여기 붙는다), base = 스택을 연
  시점의 내 회차 브랜치 tip. 자식의 통합 요청을 심사해 스택 브랜치
  `<세션>-stack`에 --no-ff로 착지시키고, 부모 런이 착지를 요청할 때마다
  컷을 내며, 부모가 master에 착지하면 스택을 새 master 위로 옮긴다.
inputs:
  issue:
    required: true
  base:
    required: true
start: open

# 자식의 착지 요청이 쌓이는 자리. 착지(landed)는 데몬이 자식의 tip이 이
# 세션의 스택 브랜치의 조상인지 git으로 재어 표시한다 — {session}은 이
# 런을 모는 세션의 이름이다(model.LandingQueueSpec.branch). 이 런은 세션이
# 끝날 때까지 end에 닿지 않으므로, 착지·거절로 정리된 항목은 컷마다
# 비운다(reset_at: cut — 컷이 이 스택의 회차 경계다).
landing_queue: {target: '{session}-stack', reset_at: cut}

steps:
  open:
    title: 스택 개설
    instructions: |
      이 서브 런은 메인 런(improv-worker)의 work 스텝에서 첫 자식을 spawn할
      때 세웠다. 메인 런은 그 사이 자기 스텝에 그대로 서 있다. 이 런의
      도구 호출(report·next·select)에는 언제나 `run: stack`을 준다 —
      run을 생략한 호출은 메인 런이다.

      - 스택 브랜치: `<세션>-stack`을 입력 `base`(내 회차 브랜치의 지금
        tip)에서 자르고, 전용 워크트리에 체크아웃한다 —
        `git worktree add <내 워크트리의 형제 경로>/<세션>-stack -b
        <세션>-stack <base>`. 착지는 전부 그 워크트리에서 하고, 내 회차
        워크트리는 건드리지 않는다: 두 런이 한 워크트리를 나눠 쓰면 한
        쪽의 미커밋 변경이 다른 쪽의 판정에 섞인다.
        **스택 브랜치에는 머지 커밋만 쌓인다.** 기능 커밋은 자식의 몫이다.
      - 자식의 기준(base): 기본은 스택 브랜치다(부채꼴 — 서로 독립인
        자식들). 한 자식이 다른 자식의 결과 위에서 작업해야 하면 그
        자식의 브랜치를 기준으로 삼는다(사슬 — 아래가 먼저 착지한다).
      - 자식 spawn(이후에도 같다): role worker, workflow improv-worker,
        `worktree: <세션>-<요지>`, **`rebase_onto: <세션>-stack`**, `issue:
        <자식 이슈 id>`(`claunch beads create ... --parent <회차 이슈>`로
        먼저 만든다). task에 반드시 세 줄: **기준 브랜치 = <세션>-stack @
        <tip>, 통합 대상 = 그 브랜치(master 아님), 완료 보고·착지 요청
        수신자 = 나.** 1회성 심부름 자식은 스택 워커가 아니므로 workflow:
        errand를 댄다.
      - 스택 표: 자식 세션 | 브랜치 | 기준 | 상태(작업 중 / 요청됨 / 착지
        <머지 해시> / 컷 <n> / 넘어감) — 이 표가 컷의 근거이고, 사는 곳은
        보드 코멘트다(`claunch beads comments add <issue> -f <파일>`, 첫 줄
        `STACK @ <스택 tip>`). 메시지로 돌리지 않는다.
    done_when: |
      스택 브랜치 `<세션>-stack`과 그 워크트리 경로, 시작 tip(= 입력 base),
      첫 자식의 세션·이슈 id, `STACK @ <tip>` 코멘트가 보고에 있다.
    next: standby

  standby:
    title: 스택 관제
    instructions: |
      자식들을 상대로 상주 근무한다. 수신(자식의 요청, 메인 런의 게시)이
      깨움이므로 폴링하지 않는다. 사건이 없으면 이 스텝에 머문다.
      - 자식 요청 처리: 질문 응답, 재브리핑, 막힌 자식 확인. 침묵은 추측하지
        않고 런 상태를 먼저 읽는다 — `claunch cflow status -t <세션> --json`.
        자식의 waiting_selection은 그 자식의 사용자 게이트다: 대신 넘지 않는다.
      - 통합 요청 심사(기준 브랜치 대비 — master 대비가 아니다): (a) 기준
        대비 양방향 diff, (b) 요청이 선 기준 tip이 지금 스택 tip(또는 기준
        자식의 tip)과 같다, (c) 표적 테스트 수치(트리 해시 포함), (d) `git
        merge-tree $(git merge-base <세션>-stack <자식>) <세션>-stack <자식>`
        프리뷰가 깨끗하다 — 하나라도 비면 되돌려 보충을 요청한다.
      - 자식끼리 같은 함수·계약을 만진다고 알려 오면 mesh-wire 스킬(connect)로
        둘을 직접 잇는다. 재정렬을 시키지 않는다.
    select:
      # chooser: agent — 조건이 전부 관측 가능한 사실이다(자식의 요청은
      # 보드의 in_review와 LANDING REQUEST 코멘트, 메인 런의 게시는
      # `claunch cflow published`의 종료 코드).
      chooser: agent
      require_reason: true
      prompt: |
        어느 사건이 발생했는가? 먼저 메인 런의 게시를 잰다 — 종료 코드가
        답이다(0 = 새 게시가 있다):
          `claunch cflow published main cut-wanted --step cut --run stack`
          `claunch cflow published main frozen --step submitted --run stack`
          `claunch cflow published main landed --step restack --run stack`
        (이 저장소에서는 같은 인자로 `uv run --no-sync python
        tools/published.py`.)
        고르는 순서:
        · **restack** — landed가 새 것이다(부모가 master에 착지했다). 다른
          무엇보다 먼저: 스택 브랜치가 옛 기준 위에 서 있는 동안 착지한
          것은 전부 다시 옮겨야 한다.
        · **land** — 심사를 통과한 자식 요청이 있고 그 기준이 이미 착지돼
          있다. cut-wanted가 새 것이어도 이미 착지를 요청한 자식이 남아
          있으면 land가 먼저다 — **컷 규칙: 착지를 요청한 자식은 기다린다.**
          심사에서 떨어진 요청은 기다리지 않는다(되돌려 보내고 표에
          「넘어감」).
        · **cut** — cut-wanted가 새 것이고, 요청한 자식이 더 남아 있지
          않다. 아직 작업 중인 자식은 기다리지 않는다 — 다음 컷으로
          넘어간다. 작업 중인 자식을 이번 컷에 싣는 것은 **사용자가 그렇게
          지시했을 때만**이고, 그때는 그 자식이 착지할 때까지 cut을
          고르지 않는다(reason에 지시의 출처를 적는다).
        · **submitted** — frozen이 새 것이다(부모가 컷을 실은 브랜치로
          통합을 요청했다).
        · **seal** — 살아 있는 자식이 없고(`children`), 마지막 컷 뒤에
          착지한 것이 없으며(`git rev-list --count <마지막 컷 tip>..<세션>-
          stack`이 0), 메인 런이 세션 종료로 가고 있다(queue-recheck의
          done 뒤). 스택이 이 세션과 함께 끝난다.
        · 아무것도 아니면 고르지 않고 머문다.
      options:
        land:
          description: 심사 통과한 자식 브랜치 하나를 스택 브랜치에 --no-ff로 착지
          next: land
        cut:
          description: 부모가 컷을 요청했다(cut-wanted) — 지금까지 착지한 것을 끊어 내놓는다
          next: cut
        submitted:
          description: 부모가 컷을 실은 브랜치로 통합을 요청했다(frozen) — 실린 자식에게 알린다
          next: submitted
        restack:
          description: 부모가 master에 착지했다(landed) — 스택을 새 master 위로 옮긴다
          next: restack
        seal:
          description: 자식도 컷 안 된 착지도 없고 세션이 끝난다 — 스택을 닫는다
          next: seal

  land:
    title: 스택 착지 (자식 브랜치 -> 스택 브랜치, --no-ff)
    instructions: |
      스택 워크트리에서 자식 브랜치 하나를 착지한다:
      - 프리체크: `git merge-tree $(git merge-base <세션>-stack <자식>)
        <세션>-stack <자식>` — 충돌이 있으면 머지하지 않는다. 충돌 지점을
        적어 그 자식에게 restack 요청(기준 위로 rebase 후 재요청)을 보내고
        표에 「restack 필요」로 적은 뒤 관제로 돌아간다.
      - 머지: `git merge --no-ff <자식 브랜치>` — 자식 하나당 머지 커밋
        하나. fast-forward로 뭉개지 않아야 스택이 트리로 남는다.
      - 확인: 착지 결과 트리에서 바꾼 영역의 표적 테스트를 한 번 돌린다
        (창 확보와 수치 표기는 improv-worker review 절과 같다). 수치는
        「스택 브랜치 기준」으로 적는다.
      - 보드: `claunch beads close <자식 이슈> --reason "landed <머지 해시>
        on <세션>-stack"` — 닫을 자격은 그 머지 해시다. 표를 `STACK @ <새
        tip>` 코멘트로 갱신한다.
      - ONE batch send(자식마다 section). **미착지 자식을 둘로 가른다.**
        · 착지한 자식: 「착지됨(머지 해시) — 브랜치 동결 유지, 네 wrapup을
          진행하라」
        · 착지 요청을 이미 올린 자식: restack 공지 — 「스택이 <옛 tip> ->
          <새 tip>. `git rebase <네 기준>` 후 표적 테스트를 재확인하고
          갱신된 묶음으로 재요청하라」
        · 아직 요청하지 않은 자식: 새 tip만 알린다 — 「스택 tip이 <새
          tip>이다. 이 해시 이전에 잰 수치는 낡았다. 지금 할 일은 없다」.
          재정렬을 요구하지 않는다(판정: claunch-no-premature-rebase-lhcz).
      master도 내 회차 브랜치도 머지 대상이 아니다 — 내 회차 브랜치에
      스택을 싣는 것은 메인 런의 stack-merge 스텝이 컷 하나당 한 번 한다.
    done_when: |
      자식 브랜치 하나가 --no-ff 머지 커밋으로 스택 브랜치에 실렸고(또는
      충돌로 착지하지 않고 restack 요청을 보낸 사실이 적혔고), 표적 테스트
      수치와 새 스택 tip, 닫은 자식 이슈 id, `STACK @ <새 tip>` 코멘트가
      보고에 있으며, batch 공지가 나갔다.
    next: standby

  cut:
    title: 컷 (부모의 착지에 실을 것을 끊어 내놓는다)
    instructions: |
      메인 런이 착지를 요청하려 한다(cut-wanted). 스택 표를 둘로 나눈다:
      - **실림**: 마지막 컷 뒤에 스택 브랜치에 착지한 자식 전부(머지 해시).
      - **넘어감**: 아직 작업 중인 자식, 심사에서 되돌린 자식 — 다음 컷의
        후보다. 그들에게는 아무것도 요구하지 않는다(새 tip이 없으므로
        알릴 것도 없다).
      컷 tip은 지금 스택 브랜치의 tip이다. 실린 것이 없으면 컷 tip은
      마지막 컷 tip과 같고, 그것도 컷이다 — 메인 런은 머지할 것이 없다는
      것을 그 해시로 안다.
      메인 런의 회차 이슈에 `CUT <n> @ <컷 tip>` 코멘트를 남긴다: 실림
      (자식 세션·이슈·머지 해시) / 넘어감(자식 세션·이슈·사유). 메인 런의
      stack-merge는 그 코멘트를 읽어 컷 tip을 머지한다.
      이 스텝을 떠나는 순간 `cut`이 게시되고, 메인 런의 대기가 풀린다.
    done_when: |
      컷 번호와 컷 tip, 실림/넘어감 두 목록(세션·이슈·머지 해시 또는 사유)이
      보고에 있고, 메인 런의 회차 이슈에 `CUT <n> @ <컷 tip>` 코멘트가 있다.
    publishes: [cut]
    # 대기는 떠나는 것을 막지 않으므로 같은 질문을 verify로도 건다 —
    # 새 cut-wanted 없이 떠나면 소비가 한 회차 어긋난다(improv-worker
    # stack-merge의 주석과 같은 이유).
    verify: 'claunch cflow published main cut-wanted --step cut --run stack'
    # 이 스텝의 대기는 소비를 기록하는 자리다: 떠날 때 본 cut-wanted의
    # 횟수가 적히므로, 다음 cut-wanted가 새 것으로 보인다. 관제(standby)가
    # 이미 새 것임을 확인하고 들어오므로 대기 자체가 울릴 일은 없다.
    awaits:
      main: cut-wanted
      describe: 메인 런이 컷을 요청했다
    next: standby

  submitted:
    title: 제출 통지 (컷을 실은 부모 브랜치가 통합 요청됐다)
    instructions: |
      메인 런이 컷을 실은 회차 브랜치로 상위에 통합을 요청했다(frozen).
      이번 컷에 실린 자식들에게 ONE batch send로 알린다: 「네 작업이 <내
      회차 브랜치> @ <tip>에 실려 <회차 이슈>로 통합 요청됐다」. 할 일을
      요구하지 않는 fyi다. 같은 컷으로 다시 요청한 것이면(rebase·재측정 후
      재요청) 알리지 않고 보고에 그렇게만 적는다.
    done_when: |
      요청된 회차 브랜치·tip·회차 이슈와 알린 자식(또는 재요청이라 알리지
      않았다는 사실)이 보고에 있다.
    # 대기는 떠나는 것을 막지 않으므로 같은 질문을 verify로도 건다 —
    # 새 frozen 없이 떠나면 소비가 한 회차 어긋난다(improv-worker
    # stack-merge의 주석과 같은 이유).
    verify: 'claunch cflow published main frozen --step submitted --run stack'
    awaits:
      main: frozen
      describe: 메인 런이 컷을 실은 브랜치로 통합을 요청했다
    next: standby

  restack:
    title: 스택 이전 (부모가 master에 착지한 뒤)
    instructions: |
      메인 런의 회차가 master에 착지했다(landed). 컷에 실렸던 머지들은
      이제 master에 있다 — 다만 메인 런의 rebase(`--rebase-merges`)가
      해시를 새로 찍었을 수 있으므로, 스택 브랜치의 옛 커밋은 master의
      조상이 아닐 수 있다. 그래서 마지막 컷 뒤의 것만 옮긴다:
      `git -C <스택 워크트리> rebase --rebase-merges --onto master <마지막 컷
      tip> <세션>-stack` (컷 뒤에 착지한 것이 없으면 스택 브랜치는 master
      tip이 된다). 충돌이 나면 멈추고(`git rebase --abort`) 충돌한 자식
      머지를 적어 사용자에게 알린다 — 스스로 푼 트리를 스택에 얹지 않는다.
      넘어간 자식(작업 중)에게 ONE batch send: 「스택이 <옛 tip> -> <새
      tip>으로 옮겨졌다. 지금 할 일은 없다. 네 rebase 단계에서 `git rebase
      --onto <세션>-stack <옛 스택 tip>`으로 네 커밋만 다시 얹어라」.
      표를 `STACK @ <새 tip>` 코멘트로 갱신한다(다음 회차 이슈가 아직 없으면
      방금 착지한 회차 이슈에).
    done_when: |
      옛 스택 tip과 새 스택 tip, 옮긴 머지 수(0일 수 있다), 공지한 자식,
      `STACK @ <새 tip>` 코멘트가 보고에 있다. 충돌로 멈췄으면 그 사실과
      충돌 지점이 있다.
    # 대기는 떠나는 것을 막지 않으므로 같은 질문을 verify로도 건다 —
    # 새 landed 없이 떠나면 소비가 한 회차 어긋난다(improv-worker
    # stack-merge의 주석과 같은 이유).
    verify: 'claunch cflow published main landed --step restack --run stack'
    awaits:
      main: landed
      describe: 메인 런의 회차가 master에 착지했다
    next: standby

  seal:
    title: 스택 마감
    instructions: |
      스택 워크트리를 치운다(`git worktree remove <경로>`). 스택 브랜치는
      지우지 않는다 — 착지한 머지들의 기록이다. 마지막 `STACK @ <tip>`
      표에 「마감」을 적는다. 이 런이 끝나면 메인 런의 settle-check가 이
      서브 런을 더 기다리지 않는다.
    done_when: |
      스택 워크트리를 지웠고, 마지막 스택 tip과 마감 코멘트가 보고에 있다.
