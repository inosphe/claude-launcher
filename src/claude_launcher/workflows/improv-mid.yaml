name: improv-mid
description: >
  중간 워커(mid-worker) — 리더가 한 영역에 몰린 워커들을 mesh-delegate
  스킬로 내 밑에 옮기면(reparent) 시작되는, 그 영역의 스택 PR(stacked
  pull request) 관제 런. 메시 역할은 그대로 worker(리더에게는 워커 하나)
  지만 런의 형태는 리더의 관제 루프다: 스택 개설 -> 스택 관제(자식의
  통합 요청을 순서대로 심사) -> 착지(자식 브랜치를 내 브랜치 = 스택
  베이스에 --no-ff, 남은 자식에게 restack 공지) -> ... -> 상위 통합 요청:
  스택 전체를 브랜치 하나로 리더에게(기계 확인이 깨끗하면 스스로 올리고,
  깨졌을 때만 리더가 결정) -> 리더 착지 대기 ->
  정리·종료. 스택의 층마다 머지 주체가 하나씩이다: 자식 브랜치의 머지는
  이 세션의 몫이고 master 머지는 리더 전권이다 — 이 세션은 어떤 경로로도
  master를 직접 머지하지 않는다. recur하지 않는다: 영역 하나 = 스택 하나
  = 세션 하나 = 저널 하나.
start: intake

# 스택 관제 ⇄ 착지는 자식 하나당 한 바퀴이고 restack·재요청이 바퀴를
# 더한다 — 자식 수(spawn.max_children, 기본 4)의 몇 배가 상한이다.
max_visits: 60

# 이 런의 드라이버는 worker 역할 세션이다 — 중간 워커는 리더가 아니라
# 워커다(리더는 메시에 하나뿐이고, 통합 권한은 그 하나의 것이다).
filter_roles:
  type: whitelist
  roles: [worker]

# default_role은 일부러 없다 — worker 역할의 기본 런은 improv-worker이고,
# 이 런은 mesh-delegate 스킬이 spawn에 workflow: improv-mid 로 지목할 때만
# 돈다. 위저드의 Role 행이 worker를 고른다고 이 런이 뽑히면 안 된다.

# 반대로 이 런을 도는 중간 워커가 spawn하는 자식은 워커다 — 아래 intake가
# "spawn에 role worker, workflow improv-worker"라고 이미 지시하는 그 짝을
# 여기 한 줄로 못박는다(자식 spawn이 workflow를 대지 않으면 이것이 붙는다).
# 스택은 층이 하나 더 생기는 것이 아니라 자식이 워커 런을 도는 것이다:
# improv-mid를 다시 물리려면 mesh-delegate처럼 spawn에서 직접 대야 한다.
default_child_cflow: improv-worker

steps:
  intake:
    title: 스택 개설
    instructions: |
      이 세션은 리더가 한 영역(파일·모듈·화면)에 몰린 워커들을 맡기려고
      세웠다 — 생성 task와 `children` 도구가 명단이다(리더가 reparent로
      옮긴 워커 + 내가 spawn할 워커). 다음을 정해 보고에 남긴다:
      - 스택 베이스: 내 워크트리 브랜치가 스택 베이스다(spawn이 잘라 준
        브랜치 — master에서 잘렸다). tip 해시를 적는다. **베이스에는
        머지 커밋만 쌓인다** — 영역의 코드가 더 필요하면 자식을 하나 더
        spawn하지, 베이스에 기능 커밋을 직접 얹지 않는다(얹는 순간
        베이스가 곧 PR이 되어 자식들의 기준이 흔들린다).
      - 스택 순서와 기준: 자식 브랜치마다 「기준(base)」을 정한다. 기본은
        스택 베이스(부채꼴 — 서로 독립인 자식들). 한 자식이 다른 자식의
        결과 위에서 작업해야 하면 그 자식의 브랜치를 기준으로 삼는다
        (사슬 — 그 자식이 착지한 뒤에만 이쪽이 착지한다: 스택은 아래에서
        위로 착지한다). 순서는 착지 순서다.
      - 옮겨온 자식(리더가 reparent한 워커): 브랜치가 master 기준으로
        잘려 있다. 스택 베이스의 tip이 master와 같으면 그대로 두고,
        아니면 `git rebase <스택 베이스>`를 그 자식에게 요청한다.
      - 새 자식 spawn: `spawn`에 role worker, workflow improv-worker,
        세션 접두사를 단 worktree, 그리고 **`rebase_onto: <스택 베이스
        브랜치>`** — 새 워크트리는 그 브랜치에서 잘리므로 자식은 처음부터
        스택 위에서 시작한다. task에는 기준 브랜치·스택 순서·통합 요청
        대상이 나(리더가 아니다)라는 것을 적는다. 먼저 `children`의
        depth/max_depth로 자리를 확인한다. 커밋·머지·테스트처럼 작업
        하나를 위임하고 끝나는 1회성 자식은 스택 워커가 아니므로
        workflow: errand를 댄다 — 완료되면 런이 done이 되고 데몬이
        세션을 자동 종료하므로 내가 kill할 것이 없다.
      - 스택 표: 순서 | 자식 세션 | 브랜치 | 기준 | 상태(작업 중 / 요청됨 /
        착지 <머지 해시> / restack 필요) — 이 표가 이 런의 수합 표이고
        상위 통합 요청의 증거다. 표의 본체는 보드다: 이 영역의 이슈(리더가
        배정한 내 이슈)를 부모로 자식 한 명당 이슈 하나 — 새 자식은
        `claunch beads create "<제목>" --parent <내 이슈> --priority <P>
        --labels leader --description "<규격>"` 후 spawn context에 `issue:
        <id>`; 옮겨온 자식의 기존 이슈는 `claunch beads update <id> --parent
        <내 이슈>`로 내 밑에 건다. 착지 순서·기준은 표에, 상태는 보드에.
      명단 전원에게 ONE batch send(자식마다 section)로 알린다: 네 기준
      브랜치와 스택 순서, 완료 보고·통합 요청의 수신자는 리더가 아니라
      나, restack 공지가 오면 rebase 후 재요청. 옮겨온 자식의 브리핑은
      여전히 리더를 부모로 적고 있으므로 이 공지는 생략할 수 없다.
      스택 표가 사는 곳은 내 이슈의 코멘트다(`claunch beads comments add
      <내 이슈> -f <파일>`, 첫 줄 `STACK @ <베이스 tip>`) — 리더에게는 그
      id와 자식 수 한 줄이면 된다. 표는 착지마다 바뀌는 기록이라 메시지로
      돌리면 같은 표가 회차마다 리더의 컨텍스트에 다시 쌓인다.

      ── beads(br) 규칙 — 공통 ──
      일감의 정본은 beads다: 세션이 한 회차를 쓸 일, 다른 세션·회차로 넘어갈
      일은 이슈로 존재해야 한다(존재·제목·범위·완료 기준·assignee·상태·
      의존·부모). beads에 두지 않는 것: 실행 기록(cflow 저널), 승인·선택
      (cflow ask/select), 그리고 사건 — 대화·답장·정정, restack 공지, 창
      순번처럼 지금 이 순간에만 뜻이 있고 되짚어 읽히지 않는 것(mesh).
      ── 기록은 코멘트에, 신호는 메시지에 ──
      되짚어 읽힐 것은 전부 코멘트다: 증거 묶음(브랜치·tip·기능/머지 해시,
      테스트 수치와 그 축·트리·환경, 양방향 diff, 포함 관계, 스택 위치,
      merge-tree 결과), 심사 한계와 테스트가 세우지 못하는 것, 그리고 판정
      마커 — `LANDING REQUEST @ <hash>` / `REBASE REQUESTED @ <hash>` /
      `REMEASURE REQUESTED @ <hash>` /
      `REVIEWED: pass @ <hash>` / `CHANGES REQUESTED: <무엇을>` /
      `HOLD: <이유>` / `BLOCKED: <게이트>` / `merged <hash>`. 코멘트는 산문
      문단이 아니라 (축, 트리, 값)의 줄로 적는다 — 보드는 저장소에 커밋되므로
      산문은 무게만 늘리고 되짚을 때 읽히지 않는다. 긴 묶음은 파일로 붙인다:
      `claunch beads comments add <id> -f <파일>`.
      **같은 것을 메시지 본문에 다시 싣지 않는다.** 메시는 상대 터미널에
      타이핑되므로 본문은 수신자 수만큼 곱해 남의 컨텍스트에서 나가고, 기록으로
      보낸 것은 아무에게도 답을 요구하지 않으면서 그 값을 치른다. 메시지는
      nudge다 — 네 줄 안에 이슈 id와 상태, 코멘트 마커, 판정을 바꾸는 값 한 줄
      (델타·미해결 한계 유무), 상대가 할 일. 상대는 그 id로 당겨 읽는다
      (`claunch beads show <id> --json`, `claunch beads comments <id>`; 표
      전체는 `claunch beads list --status in_review --json` 한 번이다).
      이 갈래가 서지 않는 자리가 하나 있다: 다른 머신의 멤버는 이 저장소의
      보드에 닿지 않는다(`claunch mesh members`의 machine이 다르면 그렇다).
      그 상대에게만은 묶음을 메시지로 보낸다.
      정본 규칙(파서·직렬화·포맷 같은 공용 규약, 판정식, 기준선)은 이슈가
      아니지만 되짚어 읽히므로 보드에 산다: `--type doc` 이슈 하나를 세우고
      (assignee 없음 — `in_ready`로 전이하지 않는다) 갱신을 갈래로 나눠 쌓는다:
      **규범 내용(규약·정의·판정식)은 본문에 두고, 고칠 때 본문을 고친다.**
      코멘트에는 그 판정이 어떻게 서고 어떻게 정정됐는지의 이력을 쌓는다.
      doc에서만 앞 갈래가 뒤집히는 이유는 용도다 — 참조하러 온 사람은 본문
      하나를 읽고 닫으므로 본문이 지금 값이어야 한다. 규약을 코멘트로만
      쌓으면 본문이 낡고, 낡았다는 것을 알리는 경고도 exit code도 없다
      (`claunch-qj03` 실측).
      전원 브로드캐스트로 규칙을 배포하지 않는다 — 수신자 수만큼 곱해지는 데다
      나중에 합류한 사람에게는 닿지 않는다. 배포는 doc 이슈 id 한 줄이다.
      호출은 항상 `claunch beads <br 인자>` — 워크트리에서도 저장소 루트의
      .beads/beads.db 하나를 쓰고(--db를 대신 붙인다), 쓰기에 --actor
      $CLAUNCH_SESSION을 붙이며, DB가 없으면 `claunch beads`가 issues.jsonl에서
      스스로 만든다. 조회는 --json.
      **`.beads/issues.jsonl`을 직접 고치는 것은 금지다.** 보드의 실체는
      `.beads/beads.db`이고 jsonl은 그것을 내보낸 산출물이다. 손으로 쓴 줄은
      DB에 들어가지 않는다. 다음에 어느 세션이든 `claunch beads sync
      --flush-only`를 돌리면 DB 내용이 그 파일을 덮어쓰고, 손으로 쓴 내용은
      에러도 경고도 없이 사라진다. 반대로 jsonl에만 있고 DB에 없는 이슈가
      생기면 export의 stale 가드가 걸려 그 저장소의 flush가 전부 멈춘다
      (`claunch beads sync --help`). Edit·Write·`sed -i`·리다이렉션 어느
      것으로도 그 파일에 쓰지 않는다. 이슈를 만들고 고치고 닫는 길은
      `claunch beads` 하나다. jsonl에서 DB로 되돌리는 것이 정말 필요하면
      `claunch beads sync --import-only`이고, 그것도 사람의 판단이 있을 때다.
      이슈가 없을 때 만드는 자 = 그 일을 사람에게서 처음 받은 세션, 또는
      발견한 세션이다 — 리더가 아니다. 만들기 전에 `claunch beads search
      "<핵심어>" --json`과 open/in_ready/in_progress/in_review 목록으로 중복을 본다;
      있으면 create 대신 comments add. 규격: 제목 한 줄「무엇을 어떻게」,
      --description은 `## 목표 / ## 범위(포함·제외) / ## 완료 증거 기준 /
      ## 출처(누가·언제·원문)`, --labels에 출처 하나(user | user-direct |
      leader | handoff | found | review). 우선순위: P1 사용자가 보고한
      라이브 데몬·UI 고장과 master 빨강 / P2 사용자 지시·리더 배정(기본) /
      P3 인수인계·발견·후속·후보 / P4 아이디어. type은 task 기본, bug는
      회귀·결함, epic은 스택 부모, doc은 참조 전용(`in_ready`로 전이하지 않고 배정하지
      않는다). staged 순서: description이 먼저, --assignee가 마지막.
      상태 전이의 주인: open→in_ready는 리더(규격·우선순위 검토 완료) /
      open 또는 in_ready→in_progress는 assignee 워커(intake 끝,
      --external-ref에 run id; 터미널 사용자 직접 지시는 open에서 시작할 수 있음) /
      in_ready→open은 리더(규격·우선순위 재검토 필요) /
      in_progress→in_review는 assignee 워커
      (landing request) / in_review→in_progress는 리더(rebase·재측정 재요청) /
      in_review→closed는 assignee 세션이다 — 누가 배정했든 그 이슈를 끝까지
      관리하는 것은 assignee다. assignee 세션이 종료돼도 in_ready는 검토 결과를 유지하고,
      다음 adoption이 종료된 assignee를 교체한다. 닫는 자리는 wrapup 하나, 닫을 자격은 landed가
      git으로 증명한 머지 커밋 해시다(`claunch beads close <id> --reason
      "merged <머지 해시>"`; 중간 워커는 자기 --parent 자식을 같은 방식으로
      닫는다). 리더가 닫는 것은 둘뿐이다: assignee가 비었거나 그 세션이
      exited인 고아와, 중간 워커 자신의 스택 이슈 — improv-mid에는 landed에
      해당하는 게이트가 없어 자기 착지를 git으로 증명할 수단이 없고, 증명
      없이 닫는 것은 이 규칙이 막으려던 바로 그것이다(중간 워커가 닫는 것은
      landed 증거가 있는 자기 --parent 자식뿐이다). 그 둘에 한해 리더가
      닫고, 사유에 스윕 수치를 붙일 수 있으면 붙인다 / 아무
      상태→blocked는 그 게이트에 걸린 세션(`BLOCKED: <스텝>`), 해소되면
      같은 세션이 되돌린다 / reopen은 리더만. update --status closed는
      없다 — close뿐이다.
      ── open 풀 판정 기준 ──
      open 이슈 수는 그 자체로 정보가 아니다 — 라벨·배정·코멘트 마커를
      가르지 않은 원값은 살아 있는 일감 수를 과대 센다. 측정은
      `claunch beads list --status open --limit 0 --json`으로 우선순위·
      assignee·첫 라벨·코멘트 마커를 센 뒤 말한다(기본 행 제한 50은 판정
      근거가 아니다).
      살아 있는 일감: assignee가 살아 있는 세션이고 intake에서 in_progress
      전이(external-ref에 run id)를 한 것 / 리더가 배정·보류를 코멘트로
      남긴 것 / 위 우선순위 절의 P1에 맞는 것.
      정리 대상은 셋이고 판정은 개별이다 — 여럿을 한 번에 닫는 일괄 변경은
      없다:
      (1) merged 해시가 코멘트에 있는데 open인 것 — 닫을 자격은 이미
          증명됐다. assignee가 살아 있으면 그 wrapup에서, 없거나 소멸했으면
          리더가 닫는다.
      (2) 같은 규격(목표·범위·출처·우선순위)의 중복 — 존재 쪽을 남기고
          중복 쪽을 닫는다(사유에 존재 쪽 id). create 전 search가 생성을
          막고, 이 갈래는 이미 생긴 중복의 처리다. assignee가 없거나
          소멸했으면 리더가 닫는다.
      (3) SESSION ENDED 코멘트가 있고 assignee 없이 3일 지난 open — 리더의
          정리 대상이며 재배정이 먼저다: 배정 후보·우선순위·최근 갱신
          가운데 하나라도 있으면 재배정하고, 셋 다 없으면 닫는다(사유에
          판정 근거, 재발하면 리더만이 reopen한다).
      ── 큐(queue)·배치(batch) 규칙 ──
      세션의 큐는 보드에서 assignee가 그 세션인 활성 이슈(open·in_ready·
      in_progress·in_review)다 — 세션 레코드에 따로 적지 않고 보드 하나가
      정본이다. 순서는 priority 오름차순, 같으면 created_at 순. 읽는 명령은
      `claunch beads list --assignee <세션> --status open --status in_ready
      --status in_progress --limit 0 --json`. 배정(assignee 쓰기)은 리더·
      운영자의 것이다(예외: 세션이 스스로 만든 이슈 — 아래 「스스로 만든
      이슈는 만든 세션이 처리한다」 절) — 대시보드 Beads 페이지의 Queues 탭에서 카드를 세션
      행으로 끌면 데몬이 `update <id> --assignee <세션>` 하나를 대신 치고
      `QUEUED`/`UNQUEUED` 코멘트를 남긴다; 상태(status)는 손대지 않는다.
      한 세션의 큐는 브랜치 하나 위에서 배치로 처리된다: 일감마다
      in_progress 전이 → 작업·테스트·커밋 → 다음 일감, 큐가 비면(또는 배치
      상한 5개에 닿으면) 배치의 이슈 전부를 in_review로 올려 착지 요청은 한
      번이다. 마커는 이슈마다 `LANDING REQUEST @ <tip>`이고 주 이슈(오프닝의
      `issue: <id>`)의 마커 뒤에 `batch: <id,...>`가 붙으며 증거 묶음은 그 주
      이슈 코멘트 하나에 있다. 리더는 같은 tip의 행들을 후보 하나로 심사해
      한 번 머지하고, 닫는 것은 assignee가 이슈마다 `merged <해시>`로 한다.
      착수하지 않은 큐 일감은 회차 마감 뒤 워커의 queue-recheck가 다시
      읽는다 — 착수할 수 있으면 같은 런 안에서 다음 회차의 주 이슈가 되고
      (intake로 루프), 착수할 수 없는 것(blocked·다른 저장소 영역)만
      `update <id> --assignee ""`와 `UNQUEUED: <세션> landed without it`
      코멘트로 풀에 되돌린다.
      ── 스스로 만든 이슈는 만든 세션이 처리한다 ──
      워커가 회차 중 스스로 만든 이슈(work의 `found`, wrapup의 `handoff`)는
      만든 세션이 같은 런 안에서 처리한다(claunch-034c4, 2026-09-23 사용자
      지시 — claunch-qac7 Q1의 「워커 자기 배정은 원칙적으로 금지, 좁은
      self 예외만 제안」을 대체한다). 만들고 assignee 없이 backlog로 두는
      것이 기본값이던 동안 그 이슈들은 처리되지 않고 쌓였다(s586). 그래서
      배정은 wrapup의 생성 이슈 정산에서 워커가 직접 친다 — 항목마다:
      (1) **spawn** — 살아 있는 자식(`children`)이 있고 그 이슈가 그 자식의
      영역이며 그 자식의 런이 아직 queue-recheck 앞에 있으면(`claunch
      cflow status -t <자식> --json`의 `step_id`가 queue-recheck·settle-*·
      end-*가 아니고 런이 done이 아니다 — 지난 자식은 큐를 다시 읽지
      않는다) 그 자식에게(`update <id> --assignee <자식> --add-label
      delegated` + `DELEGATED: from <원회차 id> to <자식>` 코멘트 + 자식에게
      mesh 한 줄 — 자식의 queue-next/queue-recheck가 보드로 읽는다; 자식이
      착수 전에 종료되면 데몬이 `delegated` 라벨을 보고 풀에 되돌리고
      `DELEGATION RELEASED` 코멘트를 남긴다), 또는 work의 위임 조건을
      만족하면 새 자식을 `--issue <id>`로 세운다; (2) **self** — 그 밖에는
      자기에게(`update <id> --assignee $CLAUNCH_SESSION` + `SELF-QUEUED:
      from <원회차 id>` 코멘트) — queue-recheck가 그것을 읽어 같은 런
      안에서 다음 회차로 돈다; (3) **pool** — assignee 없이 남기는 것은 이
      세션이 착수할 수 없는 것(다른 저장소 영역, blocked, 범위·우선순위를
      사용자나 리더가 정해야 하는 것)뿐이고, 그 처분은 상위에게 ask로
      묻는다. self에는 런 단위 상한이 있다: 이 런의 intake 방문 수
      (`claunch cflow status --json`의 `visits.intake`)가 10 이상이면 self
      대신 pool로 보낸다 — 엔진의 loop guard(max_visits 25)는 26번째
      intake에서 런을 사람의 승인(`loop_limit`)으로 세우는데, 그 전에 범위
      판단을 상위에게 넘기기 위해서다. 리더는 거부권을 가진다(`update <id>
      --assignee ""` + `UNQUEUED by leader: <이유>`); 거부된 이슈는
      pool과 같이 상위의 처분을 따른다. 세션이 만든 활성
      이슈가 전부 누군가의 손(살아 있는 세션의 assignee, 또는 리더의
      `HOLD:` 코멘트)에 있어야 세션이 끝난다 — 워커의 settle-check가
      그것을 확인하고, 미충족이면 settle-wait가 시계로 기다린다(사람이나
      상위에게 묻지 않는다). 타이머가 여섯 번 깨우는 동안에도 안 서면
      settle-stall로 사람이 처분한다. 그러므로 이 리더가 그 보드 쓰기를
      하는 자리는 wrapup의 pool ask와 거부권 둘이다 — pool ask에 답하지
      않으면 워커는 기다리다 사람에게 넘어간다.
      br가 실패하면(잠금·바이너리 없음) --lock-timeout 5000으로 한 번 더,
      그래도 안 되면 mesh fyi 첫 줄에 `NO-BEAD:` + 위 규격 그대로 — 리더가
      다음 관제 대기에서 대신 만들고 id를 답한다. 이슈 없이 착수하는
      것만은 금지다.
    done_when: |
      스택 베이스 브랜치와 tip 해시, 스택 표(순서·기준 포함)와 자식 이슈
      id(--parent 연결), 자식 전원 batch 공지, 리더 fyi가 보고에 기록되어
      있다.
    next: standby

  standby:
    title: 스택 관제
    instructions: |
      자식들을 상대로 상주 근무한다. 수신이 곧 깨움이므로 폴링하지 않고,
      사건이 없으면 이 단계에 머문다.
      - 자식 요청 처리: 질문 응답, 재브리핑, 막힌 자식 확인. 침묵은
        추측하지 말고 런 상태를 먼저 읽는다 — claunch cflow status -t
        <세션> --json / journal -t <세션> -n 20. waiting_selection은 그
        자식의 landing(사용자 게이트)이다: 대신 넘지 말고 리더를 거쳐
        사용자에게 알린다. cflow CLI는 읽기만 쓴다(approve/select/goto/
        abort는 사람의 문).
      - 통합 요청 심사(기준 브랜치 대비 — master 대비가 아니다): 요청
        묶음에 (a) 기준 브랜치 대비 양방향 diff, (b) 요청이 선 기준 tip이
        **지금** 스택 tip(또는 기준 자식의 현재 tip)과 같다는 것,
        (c) 간소화·표적 테스트 green 수치(트리 해시 포함), (d) `git
        merge-tree $(git merge-base <베이스> <자식>) <베이스> <자식>`
        프리뷰가 깨끗하다는 것 — 하나라도 비면 되돌려 보충을 요청한다.
        기준이 미착지 자식 브랜치인 요청은 그 자식이 먼저다(아래→위).
      - 자식끼리 같은 함수·계약을 만진다고 알려 오면 mesh-wire 스킬
        (connect 도구)로 둘을 직접 연결한다 — 내 서브트리이므로 내 권한이다.
      - 스택 표의 갱신은 이 단계를 떠나는 select의 reason에 싣는다 —
        관제는 select 단계라 report가 거부되고, 착지마다 여기로 돌아오므로
        착지 1회당 표 하나가 저널에 쌓인다.
      이 단계를 떠나는 방아쇠는 관측 가능한 사실이다: 심사를 통과한 요청이
      있고 그 기준이 착지돼 있으면 land, 표의 자식이 전부 착지(또는
      hold로 동결)됐으면 complete. 사람의 지시를 기다리지 않는다.
    select:
      # chooser: agent — 조건은 사람의 지시가 아니라 에이전트가 관측할 수
      # 있는 사실이어야 한다(리더 standby와 같은 규칙).
      prompt: |
        어느 사건이 발생했는가? 심사를 통과한 자식 통합 요청이 있고 그
        기준 브랜치가 이미 착지돼 있으면 land. 스택 표의 자식이 전부
        착지됐거나(남은 것은 hold로 동결된 브랜치뿐이거나) 리더가 지금까지
        착지된 것을 올리라고 했으면 complete. 둘 다 아니면 머문다.
      chooser: agent
      options:
        land:
          description: 심사 통과한 자식 브랜치 하나를 스택 베이스에 --no-ff로 착지
          next: land
        complete:
          description: 스택이 완결됐다 — 상위 통합 요청 여부를 사용자에게 (착지 결정)
          next: landing

  land:
    title: 스택 착지 (자식 브랜치 -> 스택 베이스, --no-ff)
    instructions: |
      내 워크트리(스택 베이스)에서 자식 브랜치 하나를 착지한다:
      - 프리체크: `git merge-tree $(git merge-base <베이스> <자식>) <베이스>
        <자식>` — 충돌이 있으면 머지하지 않는다. 충돌 지점을 적어 그
        자식에게 restack 요청을 보내고(기준 위로 rebase 후 재요청)
        표에 "restack 필요"로 적은 뒤 관제로 돌아간다. 충돌 트리를
        베이스에 강제로 얹지 않는다.
      - 머지: `git merge --no-ff <자식 브랜치>` — 자식 하나당 머지 커밋
        하나, 커밋 메시지는 저장소 관례(한 줄 요약). fast-forward로
        뭉개지 않아야 스택이 트리로 남는다(자식이 손자 브랜치를 같은
        방식으로 모았으면 그 트리가 통째로 실린다).
      - 확인: 착지 결과 트리에서 간소화 스위트를 한 번 돌린다 — 창 확보
        절차와 수치 표기(트리 해시·축·값)는 improv-worker의 review 절과
        같고, 메시에 스윕 순번 규칙이 있으면 따른다. 수치는 "스택 베이스
        기준"으로 적는다. 전체 스윕은 리더의 통합 단계 몫이다.
      - 표 갱신: 그 자식을 "착지 <머지 해시>"로, 스택 tip 해시를 새로. 보드:
        `claunch beads close <자식 이슈> --reason "landed <머지 해시> on
        <베이스>"` — 중간 워커가 닫는 것은 자기 --parent 자식뿐이고, 부모
        이슈(스택 자체)는 리더가 master 머지 뒤에 닫는다.
      - ONE batch send(section별). **미착지 자식을 둘로 가른다 — 이미
        착지 요청을 올린 자식과, 아직 작업 중인 자식은 받는 것이 다르다.**
        · 착지한 자식: "착지됨(머지 해시) — 브랜치는 동결 유지, 네
          wrapup을 진행하라"
        · **착지 요청을 이미 올린** 미착지 자식: **restack 공지** —
          "스택 베이스가 <옛 tip>→<새 tip>으로 움직였다. `git rebase
          <네 기준>` — 베이스에 --no-ff로 이미 실린 커밋은 upstream에
          있으므로 rebase가 건너뛰고 네 커밋만 다시 얹힌다. 표적 테스트를
          재확인하고 갱신된 묶음으로 재요청하라"
        · **아직 요청하지 않은** 자식: **새 tip만 알린다. 재정렬을 요구하지
          않는다** — "스택 베이스가 <새 tip>이다. 이 해시 이전에 잰 수치는
          낡았다. 지금 할 일은 없다". 그들에게 base 신선도는 값이 0이고,
          형제가 하나 실릴 때마다 베이스가 또 움직이므로 미리 맞춘 값은
          다시 낡는다 — 자식 넷짜리 스택이면 넷째가 자기 착지 전에 세 번
          리베이스하게 된다. **표면이 겹쳐도 예외가 아니다**: 겹침은 양쪽이
          끝나야 알 수 있으므로 내 `land` 프리체크(merge-tree)와 리더의
          머지 단계가 푼다. 겹치는 둘을 발견하면 재정렬이 아니라 mesh-wire로
          잇는다(위 항목). (판정: claunch-no-premature-rebase-lhcz —
          improv-worker/work가 그 요구를 거절할 근거를 갖고 있고, 그
          「상위」에는 중간 워커인 나도 포함된다.)
        restack 공지는 기록이 아니라 사건이라 메시가 맞는 자리다 — 받는
        자식이 지금 재요청을 갱신해야 한다. 갱신된 스택 표는 내 이슈에
        코멘트로 쌓고 (`STACK @ <새 tip>`), 리더에게는 그 사실을 fyi 한 줄로.
      master는 어떤 경우에도 머지 대상이 아니다.
    done_when: |
      자식 브랜치 하나가 --no-ff 머지 커밋으로 스택 베이스에 실렸고(또는
      충돌로 착지하지 않고 restack 요청을 보낸 사실이 적혔고), 간소화
      스위트 수치와 새 스택 tip이 보고에 있고, 갱신된 스택 표는 내 이슈의
      `STACK @ <새 tip>` 코멘트로 남았으며, batch 공지(착지 통보 + restack
      공지)와 리더 fyi 한 줄이 나갔다. master는 움직이지 않았다.
    next: standby

  landing:
    title: 착지 결정 (깨끗하면 스스로 요청한다)
    select:
      # improv-worker의 landing과 같은 이유로 같은 모양이다 — 그쪽 주석이
      # 근거의 정본이다(저널 22건 전부 request / hold 0건, 리더 턴 하나,
      # 그리고 착지 문 하나가 서면 통합 창에 모이는 후보가 줄어 스윕이
      # 늘어난다는 리더 자신의 preflight 보고). 다만 중간 워커의 상위는
      # 언제나 리더이므로 escalate 뒤의 후보 그룹이 하나다.
      #
      # 여기서 agent가 고를 수 있는 것은 request와 escalate뿐이고 hold에
      # 혼자 닿는 길은 없다 — 일을 줄이는 쪽은 여전히 리더의 답이다.
      chooser: agent
      prompt: |
        스택이 완결됐다 — 자식 브랜치들이 스택 베이스에 --no-ff로 착지돼
        있고 간소화 스위트가 green이다. 이 스택에 「특별히 이슈가 없는가」를
        기계로 확인해 스스로 정한다 — 리더에게 물어 그 턴을 하나 쓰는 것은
        확인이 깨졌을 때뿐이다.

        ── 먼저: 실을 델타가 있는가 ──
        아래 다섯은 「깨끗한가」를 묻는다. 그 앞에 「실을 것이 있는가」가
        있고, 이것이 0이면 다섯이 전부 참이어도 request가 아니다:
            git rev-list --count $(git merge-base master HEAD)..HEAD
        0이면 **escalate**다. hold가 아니다 — 동결은 여전히 리더의 답이다.
        스택에서 이것이 0인 모양은 자식이 하나도 착지하지 않았거나 베이스가
        이미 master에 포함된 은퇴 상태다. 어느 쪽이든 실을 것이 없다.
        판별식은 보드의 정본과 같은 값이어야 한다 —
        claunch-hold-round-cannot-close-hkkh 의 델타-0 변별자다.

        ── 그다음: 다섯이 전부 참이면 request다 ──
        하나라도 아니면 escalate다.
        참·거짓은 짐작이 아니라 명령의 출력으로 정하고, 무엇을 돌려 무엇이
        나왔는지 reason에 적는다(그 reason이 저널에 남아 리더가 읽는다).
        1. 작업 트리가 깨끗하다 — `git status --porcelain` 이 0줄
        2. 스택 표의 자식 브랜치가 전부 베이스에 실렸고, 마지막 착지
           이후 베이스가 안 움직였다 — `git branch --merged <베이스>` 가
           스택 표의 자식 전부를 내고(남은 자식이 있으면 스택은 완결이
           아니다), `git diff --name-only <마지막 수치를 잰 커밋> <베이스>`
           가 0줄이다. restack으로 베이스가 다시 찍혔으면 그 수치는 다른
           트리의 판정이므로 다시 재거나 escalate한다
        3. master 위로 미리 병합이 깨끗하다 —
           `git merge-tree $(git merge-base master <베이스>) master <베이스>`
           에 충돌 표시 0행
        4. 스택 부모 이슈와 자식 이슈에 열린 제동 마커가 없다 —
           CHANGES REQUESTED / HOLD / BLOCKED 중 해소되지 않은 것이 없다
        5. 리더가 걸어 둔 동결·정지 지시가 없다(메시로 온 freeze/hold 공지)

        확인이 깨졌거나 내가 정할 수 없는 사정이면 escalate다 — 모르는 것을
        request로 밀지 않는다. 반대로 다섯이 다 참인데 「그래도 물어보는
        편이 안전하지 않나」로 escalate하지도 않는다: request는 리더의 통합
        대기 표에 줄 서는 것일 뿐이고 master 머지도 배치 편성도 여전히
        리더의 것이다. 이 문이 지키는 것은 master가 아니라 리더의 턴이다.
      options:
        request:
          description: 확인 다섯이 전부 참 — master 위로 정렬(--rebase-merges)한 뒤 스택 표를 증거로 리더에게 올린다(머지 실행은 리더)
          next: handoff
        escalate:
          description: 확인이 하나라도 깨졌다 — 착지 여부를 리더에게 묻는다
          next: landing-review

  landing-review:
    title: 착지 결정 (리더에게 묻는다)
    select:
      # landing의 기계 확인이 깨졌을 때만 들어오는 자리다. 옛 landing의
      # 위임이 그대로 여기로 옮겨 왔다 — 후보도 otherwise도 timeout도 같고,
      # 바뀐 것은 빈도뿐이다.
      #
      # 착지는 리더의 결정이다 — 사람 문이 아니다. 이 문이 되돌릴 수 없는
      # 것을 지키지 않기 때문이다: request 갈래의 종점(handoff)은 master
      # 머지를 금지하므로 요청은 리더의 통합 대기 표에 줄 서는 것뿐이고,
      # hold도 마감 fyi로 같은 표에 돌아온다. master를 지키는 방어는 리더의
      # 머지 전권과 통합 후 전체 스윕이지 이 select가 아니다. improv-worker의
      # landing-review와 같은 이유로 같은 모양이다 — 다만 중간 워커의 상위는
      # 언제나 리더이므로 후보 그룹이 하나다.
      #
      # 그리고 같은 이유로 문도 둘이다. 사람 문이 아니라는 것과 사람이 못
      # 들어온다는 것은 다르다 — 위임은 결정을 런에게서 가져가는 것이지
      # 사용자에게서 가져가는 것이 아니다. 이 질문이 리더에게 나가 있는
      # 동안에도 터미널의 사용자는 언제든
      # `claunch cflow select request|hold`(또는 대시보드의 옵션 버튼)로
      # 같은 결정을 내릴 수 있고, 그 답이 리더의 답보다 먼저 성립한다.
      # 엔진이 그렇게 동작한다: 사람의 select는 열린 ask를 그 자리에서 닫고
      # (engine._settled_by_person), 제쳐진 응답자에게는 질문이 닫혔다는
      # 통지가 간다. 저널에는 override로 누구를 제쳤는지가 남는다.
      # 그러니 충돌은 없다 — 먼저 온 답이 아니라 사용자의 답이 이긴다.
      # 다만 문이지 게이트가 아니다: 중간 워커는 이 결정을 사용자에게 올려
      # 세워 두고 기다리지 않는다. 리더에게 나가 있다는 사실과 사용자가
      # 원하면 직접 답할 수 있다는 한 줄만 남기고 턴을 끝낸다.
      prompt: |
        너에게 딸린 중간 워커의 스택이 완결됐다 — 자식 브랜치들이 스택
        베이스에 --no-ff로 착지돼 있고 간소화 스위트가 green이다. 지금 그
        스택 전체를 브랜치 하나로 네 통합 대기 표에 올리게 하는가(중간
        워커는 먼저 master 위로 --rebase-merges 정렬한 뒤 스택 표를 증거로
        올린다), 아니면 베이스를 동결해 두고 이 런을 마감하게 하는가?

        이 질문이 너에게 온 것 자체가 값이다. 깨끗한 스택은 중간 워커가
        스스로 올려 너를 부르지 않는다 — 기계 확인(작업 트리 깨끗, 자식
        전부 베이스에 실림, master 위 미리 병합 충돌 0, 열린 제동 마커
        없음, 동결 지시 없음) 중 하나가 깨졌을 때만 이 문이 열린다.
        무엇이 깨졌는지는 그 세션이 select의 reason에 적어 저널에 남겼다:
        `claunch cflow journal -t <그 세션> -n 10` 이 그것이고 거기부터 읽는다.

        나머지 판단 근거는 이미 네 손에 있다: 착지마다 온 fyi에 스택 표(순서·
        자식 브랜치·기준·머지 해시·수치)가 실려 있고, 모자라면 `claunch cflow
        status -t <그 세션> --json`이 나머지를 말해 준다.

        어느 쪽이든 master 머지는 네 통합 단계에서만 일어난다.

        이 질문에는 문이 둘이다. 터미널의 사용자도 같은 결정을 동시에
        내릴 수 있고, 사용자가 먼저 답하면 네 답은 성립하지 않는다 —
        그때는 질문이 닫혔다는 통지가 너에게 간다. 밀린 것이 아니라
        규칙이다: 충돌하면 사용자 지침이 이긴다. 그러니 답할 수 있으면
        지금 답하고, 근거가 없으면 추측하지 말고 abstain으로 넘긴다.
      # 상위가 없는 단독 편성이거나 30분 안에 답이 없으면 이 질문은 사람
      # 앞에 선다(otherwise: human) — 그때는 사용자가 유일한 응답자다.
      # 그 전까지도 사용자의 문은 닫혀 있지 않다: 위 주석대로 병행이다.
      # timeout은 사용자를 기다리는 시계가 아니라 리더가 침묵할 때 질문이
      # 굳지 않게 하는 시계다.
      chooser:
        from:
          - {role: leader, scope: ancestor}
        otherwise: human
        timeout: 1800
      options:
        request:
          description: 지금 리더에게 스택 통합 요청 — 먼저 master 위로 정렬(--rebase-merges)한 뒤 스택 표를 증거로 올린다(머지 실행은 리더)
          next: handoff
        hold:
          description: 스택 베이스 동결(추가 착지 없음) — 통합은 나중에, 정리로
          next: wrapup

  handoff:
    title: 상위 통합 요청 (스택을 브랜치 하나로 — 머지는 리더 전권)
    instructions: |
      일반적인 stacked PR과 같다 — 스택의 바닥(베이스)이 상위 대상(master)
      위에 정렬된 뒤에 요청한다.
      - 분기 판별: `git rev-list <베이스>..master`가 비면 정렬할 것이
        없다 — 그 사실을 한 줄 남긴다. 비어 있지 않으면 정렬한다:
        **`git rebase --rebase-merges master`** — 스택 베이스는 --no-ff
        머지 커밋을 품고 있어 보통의 rebase는 트리를 평탄화하고 자식
        브랜치의 이력을 지운다; --rebase-merges가 머지 커밋을 다시 만들어
        스택을 보존한다. 충돌은 master가 정한 방향을 먼저 읽고 그 위에
        얹어 해결한다. 정렬 후 간소화 스위트를 다시 돌린다(리더의 완화
        규칙: 충돌 없는 rebase + 표적 green이면 통합 대기에 오를 수 있다 —
        전체 스윕은 리더 통합 단계의 게이트다).
      - 미착지 자식이 남아 있으면 정렬로 베이스의 커밋 해시가 전부
        바뀌므로 restack 공지를 보낸다(`git rebase --onto <새 베이스>
        <옛 베이스 tip> <자식>`). 여기서는 **사실이 달라졌으므로 전원에게
        알리되, 지금 실행하는 것은 이미 착지 요청을 올린 자식뿐이다** —
        아직 작업 중인 자식은 옛 베이스 tip과 새 베이스를 적어 두었다가
        자기 `rebase` 단계에서 그 `--onto`로 한 번에 푼다(잃는 것은 없다:
        그 자식의 커밋은 자기 브랜치에서 그대로 닿는다). 그래서 handoff는
        되도록 스택이 다 착지된 뒤에 한다.
      - 증거 묶음: 스택 표(순서·자식 세션·브랜치·기준·머지 해시·수치),
        `git log master..<베이스>` / `<베이스>..master` 양방향 diff,
        `git merge-tree` 프리뷰, `git branch --contains <베이스>`가 아니라
        **`git branch --merged <베이스>`**로 함께 실리는 자식 브랜치 목록
        (= 스택의 트리 구조), 정렬 후 tip 해시와 간소화 스위트 수치(스택
        베이스 기준).
      - 이 묶음이 가는 곳은 보고(cflow 저널)와 내 이슈의 코멘트다:
        `claunch beads update <내 이슈> --status in_review`와 `claunch beads
        comments add <내 이슈> -f <파일>`(첫 줄 `LANDING REQUEST @ <tip>,
        stack of N`) — 리더의 통합 대기 표는 그 in_review 목록이고, 심사는
        그 코멘트에서 이뤄진다. 리더에게는 nudge만 회신 기대(ask)로 보낸다:
        이슈 id와 in_review, 마커, 스택 크기와 미해결 한계 유무 한 줄,
        「--no-ff 머지 요청, 베이스 동결했다」.
        묶음을 메시지 본문에 다시 싣지 않는다. 보낸 뒤 베이스를 동결한다
        (추가 착지 없음).
      ── 금지: master를 직접 머지하지 않는다 ──
      master로의 merge·push, master 체크아웃 후 커밋·리베이스·cherry-pick,
      fast-forward로 슬쩍 반영 — 전부 금지다. 사용자가 승인했다는 이유로도,
      리더가 응답이 없다는 이유로도 예외가 아니다. master 반영 경로는
      리더 워크플로우(improv-leader)의 통합 단계 하나뿐이다.
    done_when: |
      master와의 분기 판별(정렬했으면 --rebase-merges 사실과 전후 tip,
      재확인 수치)과 증거 묶음(스택 표, 양방향 diff, merge-tree, 함께
      실리는 브랜치 목록)이 보고와 `LANDING REQUEST @ <tip>` 코멘트에
      있고, 리더에게는 그것을 가리키는 nudge가 나갔으며(묶음을 메시지
      본문에 다시 싣지 않았다) 베이스는 동결 상태다. master는 움직이지
      않았다.
    next: await-landing

  await-landing:
    title: 리더 착지 대기
    select:
      # 요청이 나간 뒤 세션을 바로 끝내지 않는다 — 스택은 브랜치 하나지만
      # 그 안의 트리가 크므로, 리더의 rebase 재요청(뒤처짐·merge-tree 충돌)
      # 을 받아 restack할 사람이 남아 있어야 한다.
      prompt: |
        리더의 답이 왔는가? master에 머지됐다는 fyi(머지 해시)가 오면
        landed. rebase 재요청(분기가 다시 벌어졌거나 미리 병합이 충돌한다)
        이 오면 restack — 베이스 동결을 해제하고 handoff로 돌아가 최신
        master 위로 다시 정렬한 뒤 갱신된 묶음으로 재요청한다. 둘 다
        아니면 머문다.
      chooser: agent
      options:
        landed:
          description: 리더가 스택을 master에 --no-ff로 머지했다(해시 수신) — 정리로
          next: wrapup
        restack:
          description: 리더의 rebase 재요청 — 동결 해제, master 위로 재정렬 후 재요청
          next: handoff

  wrapup:
    title: 스택 마감·정리
    instructions: |
      - 자식: 착지된 자식은 자기 wrapup에서 스스로 종료한다. `children`으로
        남은 자식을 보고, 런 상태(claunch cflow status -t <세션>)로 유휴가
        확인된 것만 kill 도구로 종료해 슬롯을 돌려준다. hold로 동결된
        미착지 자식 브랜치는 리더에게 fyi로 알려 통합 대기 목록에 오르게
        한다(그 자식 이슈는 in_progress 그대로 — `comments add <id> "HOLD:
        …"`가 있는지 본다). 부모 이슈는 닫지 않는다 — 리더가 닫는다.
      - 잔류 테스트 서버·headless 브라우저 프로세스 종료, 임시 파일 삭제,
        git status 클린 확인. basetemp는 지우지 않는다(포렌식 기록 —
        지워야 하면 시작·소요·워커 수·실행량 네 값을 먼저 보고에 적는다).
      - 최종 보고: 스택 표 최종본, 리더의 머지 해시(착지됐으면), 남은
        브랜치(동결)를 요약한다. master는 이 런이 건드리지 않았어야
        정상이다.
      ── 세션 종료 (회차의 일부다 — 선택이 아니다) ──
      이 워크플로우는 recur하지 않는다. 최종 보고와 리더 fyi까지 마쳤으면
      next로 런을 end까지 진행해 done으로 만든다. **세션을 죽이라는 명령은
      실행하지 않는다** — 데몬이 done 전이를 보는 즉시, 이 회차의 종결
      기록을 이 세션의 transcript에 내구 기록(append+flush — WAL)한 뒤
      세션을 끝내 슬롯을 돌려준다. 이 워크플로우에 `claunch kill-session`은
      더 없다 — 네가 세션을 종료하는 것은 데몬 몫을 훔치는 것이고, 보고만
      하고 명령을 안 누르던 옛 실패는 구조적으로 사라졌다.

      ★ **보고까지 쓰고 done으로 진행하지 않은 채 턴을 끝내는 것이 이
      자리의 실패 지점이다.** 데몬은 done을 기다리므로, 보고를 쓴
      **같은 턴에서** next로 end까지 밟아 런을 done으로 만든다 — 데몬이
      그 뒤(종결 기록, 종료)를 맡는다. 종료를 미루던 옛 망설임은 전부
      이 구조에 흡수됐다:
      · 「사용자가 이 터미널에 있어 pane을 임의로 닫기 그렇다」 —
        pane을 닫는 것은 이제 데몬이고, 이 워크플로우의 end가 곧 그
        승인이다. 새로 받아낼 허락이 없다.
      · 「리더가 rebase 재요청·restack을 보낼 수 있다」 — 브랜치와
        bead는 세션과 무관하게 남고, 리더는 죽은 세션의 브랜치도
        머지한다. 필요하면 `claunch respawn`이다. **살아서 대기하는
        것은 도움이 아니라 슬롯 점유다.**
      · 「스택 착지를 확인하고 닫겠다」 — 착지 확인은 이 회차의 완료
        조건이 아니다. 통합은 리더의 회차다.
      · 「닫아도 될까요?」라고 되묻는 것 — **묻지 마라.** 종료는 네
        결정이 아니라 워크플로우의 마지막 단계다. 남은 것은 보고와 next다.
      다만 중간 워커에는 순서가 하나 더 있다: **자식이 먼저다.** 남은
      자식의 처리(유휴 확인 후 종료 / 동결 브랜치 리더 fyi)가 끝나기
      전에 이 스텝을 떠나면 그 자식들은 부모 없이 남는다 — done_when의
      그 항목이 이 종료보다 앞이지, 종료를 미룰 사유는 아니다.

      **예외는 하나뿐이다**: 이 세션의 사용자가 이 회차 안에서
      「닫지 말고 있어라」를 **명시적으로 말했을 때**. 리더의 말은
      해당하지 않는다. 그 경우 **`claunch keep-alive $CLAUNCH_SESSION`**을
      실행해 keep-alive 플래그를 세운다 — 데몬은 종결 기록만 남기고
      세션은 건드리지 않는다. 그리고 최종 보고에 「사용자 지시로 종료
      보류」를 한 줄 남긴다. 그 컨텍스트가 다 쓰이면
      **`claunch keep-alive $CLAUNCH_SESSION off`**로 내리고 end로
      진행한다 — 그 뒤의 종료는 데몬이 맡는다.

      done으로 진행한 뒤에는 **예고하지 마라**. 「이제 끝냅니다」를
      써 놓고 턴을 끝내지 말고, 보고를 쓴 **같은 턴에서** next로
      end까지 밟아라 — 예고는 그 턴을 마지막으로 만들어 done이 다음
      턴으로 밀리는 옛 실패 모양 그대로다.
    done_when: |
      남은 자식의 처리(유휴 확인 후 종료 / 동결 브랜치 리더 fyi)가 끝났고,
      잔류 프로세스·임시 파일이 정리되어 git status가 클린하며, 스택 최종
      보고가 기록되었다. (세션 종료는 이 게이트 뒤의 일이다 — done 이후
      데몬이 종결 기록을 남기고 종료한다. 게이트 뒤라는 것은 '나중에'도
      '선택'도 아니고 이 보고를 쓴 같은 턴에서 next로 end까지 밟아 done으로
      만든다는 뜻이다 — 데몬이 그 뒤를 맡는다.)
    next: end
