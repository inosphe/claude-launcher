name: improv-mid
description: >
  중간 워커(mid-worker) — 리더가 한 영역에 몰린 워커들을 mesh-delegate
  스킬로 내 밑에 옮기면(reparent) 시작되는, 그 영역의 스택 PR(stacked
  pull request) 관제 런. 메시 역할은 그대로 worker(리더에게는 워커 하나)
  지만 런의 형태는 리더의 관제 루프다: 스택 개설 -> 스택 관제(자식의
  통합 요청을 순서대로 심사) -> 착지(자식 브랜치를 내 브랜치 = 스택
  베이스에 --no-ff, 남은 자식에게 restack 공지) -> ... -> (리더가 결정)
  상위 통합 요청: 스택 전체를 브랜치 하나로 리더에게 -> 리더 착지 대기 ->
  정리·종료. 스택의 층마다 머지 주체가 하나씩이다: 자식 브랜치의 머지는
  이 세션의 몫이고 master 머지는 리더 전권이다 — 이 세션은 어떤 경로로도
  master를 직접 머지하지 않는다. recur하지 않는다: 영역 하나 = 스택 하나
  = 세션 하나 = 저널 하나.
start: intake

# 스택 관제 ⇄ 착지는 자식 하나당 한 바퀴이고 restack·재요청이 바퀴를
# 더한다 — 자식 수(spawn.max_children, 기본 4)의 몇 배가 상한이다.
max_visits: 60

# 이 런의 드라이버는 worker 역할 세션이다 — 중간 워커는 리더가 아니라
# 워커다(리더는 메시에 하나뿐이고, 통합 권한은 그 하나의 것이다).
filter_roles:
  type: whitelist
  roles: [worker]

# default_role은 일부러 없다 — worker 역할의 기본 런은 improv-worker이고,
# 이 런은 mesh-delegate 스킬이 spawn에 workflow: improv-mid 로 지목할 때만
# 돈다. 위저드의 Role 행이 worker를 고른다고 이 런이 뽑히면 안 된다.

# 반대로 이 런을 도는 중간 워커가 spawn하는 자식은 워커다 — 아래 intake가
# "spawn에 role worker, workflow improv-worker"라고 이미 지시하는 그 짝을
# 여기 한 줄로 못박는다(자식 spawn이 workflow를 대지 않으면 이것이 붙는다).
# 스택은 층이 하나 더 생기는 것이 아니라 자식이 워커 런을 도는 것이다:
# improv-mid를 다시 물리려면 mesh-delegate처럼 spawn에서 직접 대야 한다.
default_child_cflow: improv-worker

steps:
  intake:
    title: 스택 개설
    instructions: |
      이 세션은 리더가 한 영역(파일·모듈·화면)에 몰린 워커들을 맡기려고
      세웠다 — 생성 task와 `children` 도구가 명단이다(리더가 reparent로
      옮긴 워커 + 내가 spawn할 워커). 다음을 정해 보고에 남긴다:
      - 스택 베이스: 내 워크트리 브랜치가 스택 베이스다(spawn이 잘라 준
        브랜치 — master에서 잘렸다). tip 해시를 적는다. **베이스에는
        머지 커밋만 쌓인다** — 영역의 코드가 더 필요하면 자식을 하나 더
        spawn하지, 베이스에 기능 커밋을 직접 얹지 않는다(얹는 순간
        베이스가 곧 PR이 되어 자식들의 기준이 흔들린다).
      - 스택 순서와 기준: 자식 브랜치마다 「기준(base)」을 정한다. 기본은
        스택 베이스(부채꼴 — 서로 독립인 자식들). 한 자식이 다른 자식의
        결과 위에서 작업해야 하면 그 자식의 브랜치를 기준으로 삼는다
        (사슬 — 그 자식이 착지한 뒤에만 이쪽이 착지한다: 스택은 아래에서
        위로 착지한다). 순서는 착지 순서다.
      - 옮겨온 자식(리더가 reparent한 워커): 브랜치가 master 기준으로
        잘려 있다. 스택 베이스의 tip이 master와 같으면 그대로 두고,
        아니면 `git rebase <스택 베이스>`를 그 자식에게 요청한다.
      - 새 자식 spawn: `spawn`에 role worker, workflow improv-worker,
        세션 접두사를 단 worktree, 그리고 **`rebase_onto: <스택 베이스
        브랜치>`** — 새 워크트리는 그 브랜치에서 잘리므로 자식은 처음부터
        스택 위에서 시작한다. task에는 기준 브랜치·스택 순서·통합 요청
        대상이 나(리더가 아니다)라는 것을 적는다. 먼저 `children`의
        depth/max_depth로 자리를 확인한다.
      - 스택 표: 순서 | 자식 세션 | 브랜치 | 기준 | 상태(작업 중 / 요청됨 /
        착지 <머지 해시> / restack 필요) — 이 표가 이 런의 수합 표이고
        상위 통합 요청의 증거다. 표의 본체는 보드다: 이 영역의 이슈(리더가
        배정한 내 이슈)를 부모로 자식 한 명당 이슈 하나 — 새 자식은
        `claunch beads create "<제목>" --parent <내 이슈> --priority <P>
        --labels leader --description "<규격>"` 후 spawn context에 `issue:
        <id>`; 옮겨온 자식의 기존 이슈는 `claunch beads update <id> --parent
        <내 이슈>`로 내 밑에 건다. 착지 순서·기준은 표에, 상태는 보드에.
      명단 전원에게 ONE batch send(자식마다 section)로 알린다: 네 기준
      브랜치와 스택 순서, 완료 보고·통합 요청의 수신자는 리더가 아니라
      나, restack 공지가 오면 rebase 후 재요청. 옮겨온 자식의 브리핑은
      여전히 리더를 부모로 적고 있으므로 이 공지는 생략할 수 없다.
      리더에게는 스택 표를 fyi로 남긴다.

      ── beads(br) 규칙 — 공통 ──
      일감의 정본은 beads다: 세션이 한 회차를 쓸 일, 다른 세션·회차로 넘어갈
      일은 이슈로 존재해야 한다(존재·제목·범위·완료 기준·assignee·상태·
      의존·부모). beads에 두지 않는 것: 실행 기록(cflow 저널), 대화·답장
      (mesh), 승인·선택(cflow ask/select), 머지 가능 판정(통합 단계의 git
      증거). 코멘트에는 포인터와 판정만 — run id, 커밋 해시, 테스트 수치,
      `REBASE REQUESTED @ <hash>` / `HOLD: <이유>` / `BLOCKED: <게이트>` /
      `merged <hash>`.
      호출은 항상 `claunch beads <br 인자>` — 워크트리에서도 저장소 루트의
      .beads/beads.db 하나를 쓰고(--db를 대신 붙인다), 쓰기에 --actor
      $CLAUNCH_SESSION을 붙이며, DB가 없으면 issues.jsonl에서 스스로
      만든다. 조회는 --json.
      이슈가 없을 때 만드는 자 = 그 일을 사람에게서 처음 받은 세션, 또는
      발견한 세션이다 — 리더가 아니다. 만들기 전에 `claunch beads search
      "<핵심어>" --json`과 open/in_progress/in_review 목록으로 중복을 본다;
      있으면 create 대신 comments add. 규격: 제목 한 줄「무엇을 어떻게」,
      --description은 `## 목표 / ## 범위(포함·제외) / ## 완료 증거 기준 /
      ## 출처(누가·언제·원문)`, --labels에 출처 하나(user | user-direct |
      leader | handoff | found | review). 우선순위: P1 사용자가 보고한
      라이브 데몬·UI 고장과 master 빨강 / P2 사용자 지시·리더 배정(기본) /
      P3 인수인계·발견·후속·후보 / P4 아이디어. type은 task 기본, bug는
      회귀·결함, epic은 스택 부모, doc은 참조 전용(ready에서 빼고 배정하지
      않는다). staged 순서: description이 먼저, --assignee가 마지막.
      상태 전이의 주인: open→in_progress는 assignee 워커(intake 끝,
      --external-ref에 run id) / in_progress→in_review는 assignee 워커
      (landing request) / in_review→in_progress는 리더(rebase 재요청) /
      in_review→closed는 리더만(`claunch beads close <id> --reason "merged
      <hash>, sweep N/M"`; 중간 워커는 자기 --parent 자식만) / 아무
      상태→blocked는 그 게이트에 걸린 세션(`BLOCKED: <스텝>`), 해소되면
      같은 세션이 되돌린다 / reopen은 리더만. update --status closed는
      없다 — close뿐이다.
      br가 실패하면(잠금·바이너리 없음) --lock-timeout 5000으로 한 번 더,
      그래도 안 되면 mesh fyi 첫 줄에 `NO-BEAD:` + 위 규격 그대로 — 리더가
      다음 관제 대기에서 대신 만들고 id를 답한다. 이슈 없이 착수하는
      것만은 금지다.
    done_when: |
      스택 베이스 브랜치와 tip 해시, 스택 표(순서·기준 포함)와 자식 이슈
      id(--parent 연결), 자식 전원 batch 공지, 리더 fyi가 보고에 기록되어
      있다.
    next: standby

  standby:
    title: 스택 관제
    instructions: |
      자식들을 상대로 상주 근무한다. 수신이 곧 깨움이므로 폴링하지 않고,
      사건이 없으면 이 단계에 머문다.
      - 자식 요청 처리: 질문 응답, 재브리핑, 막힌 자식 확인. 침묵은
        추측하지 말고 런 상태를 먼저 읽는다 — claunch cflow status -t
        <세션> --json / journal -t <세션> -n 20. waiting_selection은 그
        자식의 landing(사용자 게이트)이다: 대신 넘지 말고 리더를 거쳐
        사용자에게 알린다. cflow CLI는 읽기만 쓴다(approve/select/goto/
        abort는 사람의 문).
      - 통합 요청 심사(기준 브랜치 대비 — master 대비가 아니다): 요청
        묶음에 (a) 기준 브랜치 대비 양방향 diff, (b) 요청이 선 기준 tip이
        **지금** 스택 tip(또는 기준 자식의 현재 tip)과 같다는 것,
        (c) 간소화·표적 테스트 green 수치(트리 해시 포함), (d) `git
        merge-tree $(git merge-base <베이스> <자식>) <베이스> <자식>`
        프리뷰가 깨끗하다는 것 — 하나라도 비면 되돌려 보충을 요청한다.
        기준이 미착지 자식 브랜치인 요청은 그 자식이 먼저다(아래→위).
      - 자식끼리 같은 함수·계약을 만진다고 알려 오면 mesh-wire 스킬
        (connect 도구)로 둘을 직접 연결한다 — 내 서브트리이므로 내 권한이다.
      - 스택 표의 갱신은 이 단계를 떠나는 select의 reason에 싣는다 —
        관제는 select 단계라 report가 거부되고, 착지마다 여기로 돌아오므로
        착지 1회당 표 하나가 저널에 쌓인다.
      이 단계를 떠나는 방아쇠는 관측 가능한 사실이다: 심사를 통과한 요청이
      있고 그 기준이 착지돼 있으면 land, 표의 자식이 전부 착지(또는
      hold로 동결)됐으면 complete. 사람의 지시를 기다리지 않는다.
    select:
      # chooser: agent — 조건은 사람의 지시가 아니라 에이전트가 관측할 수
      # 있는 사실이어야 한다(리더 standby와 같은 규칙).
      prompt: |
        어느 사건이 발생했는가? 심사를 통과한 자식 통합 요청이 있고 그
        기준 브랜치가 이미 착지돼 있으면 land. 스택 표의 자식이 전부
        착지됐거나(남은 것은 hold로 동결된 브랜치뿐이거나) 리더가 지금까지
        착지된 것을 올리라고 했으면 complete. 둘 다 아니면 머문다.
      chooser: agent
      options:
        land:
          description: 심사 통과한 자식 브랜치 하나를 스택 베이스에 --no-ff로 착지
          next: land
        complete:
          description: 스택이 완결됐다 — 상위 통합 요청 여부를 사용자에게 (착지 결정)
          next: landing

  land:
    title: 스택 착지 (자식 브랜치 -> 스택 베이스, --no-ff)
    instructions: |
      내 워크트리(스택 베이스)에서 자식 브랜치 하나를 착지한다:
      - 프리체크: `git merge-tree $(git merge-base <베이스> <자식>) <베이스>
        <자식>` — 충돌이 있으면 머지하지 않는다. 충돌 지점을 적어 그
        자식에게 restack 요청을 보내고(기준 위로 rebase 후 재요청)
        표에 "restack 필요"로 적은 뒤 관제로 돌아간다. 충돌 트리를
        베이스에 강제로 얹지 않는다.
      - 머지: `git merge --no-ff <자식 브랜치>` — 자식 하나당 머지 커밋
        하나, 커밋 메시지는 저장소 관례(한 줄 요약). fast-forward로
        뭉개지 않아야 스택이 트리로 남는다(자식이 손자 브랜치를 같은
        방식으로 모았으면 그 트리가 통째로 실린다).
      - 확인: 착지 결과 트리에서 간소화 스위트를 한 번 돌린다 — 창 확보
        절차와 수치 표기(트리 해시·축·값)는 improv-worker의 review 절과
        같고, 메시에 스윕 순번 규칙이 있으면 따른다. 수치는 "스택 베이스
        기준"으로 적는다. 전체 스윕은 리더의 통합 단계 몫이다.
      - 표 갱신: 그 자식을 "착지 <머지 해시>"로, 스택 tip 해시를 새로. 보드:
        `claunch beads close <자식 이슈> --reason "landed <머지 해시> on
        <베이스>"` — 중간 워커가 닫는 것은 자기 --parent 자식뿐이고, 부모
        이슈(스택 자체)는 리더가 master 머지 뒤에 닫는다.
      - ONE batch send(section별): 착지한 자식에게 "착지됨(머지 해시) —
        브랜치는 동결 유지, 네 wrapup을 진행하라"; 미착지 자식 전원에게
        **restack 공지**: "스택 베이스가 <옛 tip>→<새 tip>으로 움직였다.
        `git rebase <네 기준>` — 베이스에 --no-ff로 이미 실린 커밋은
        upstream에 있으므로 rebase가 건너뛰고 네 커밋만 다시 얹힌다.
        표적 테스트를 재확인하고, 요청을 이미 올렸으면 갱신된 묶음으로
        재요청, 아니면 새 기준 tip을 적어 두라"; 리더에게 스택 표 갱신을
        fyi 한 줄로.
      master는 어떤 경우에도 머지 대상이 아니다.
    done_when: |
      자식 브랜치 하나가 --no-ff 머지 커밋으로 스택 베이스에 실렸고(또는
      충돌로 착지하지 않고 restack 요청을 보낸 사실이 적혔고), 간소화
      스위트 수치와 새 스택 tip, 갱신된 스택 표, batch 공지(착지 통보 +
      restack 공지)와 리더 fyi가 보고에 있다. master는 움직이지 않았다.
    next: standby

  landing:
    title: 착지 결정
    select:
      # 착지는 리더의 결정이다 — 사람 문이 아니다. 이 문이 되돌릴 수 없는
      # 것을 지키지 않기 때문이다: request 갈래의 종점(handoff)은 master
      # 머지를 금지하므로 요청은 리더의 통합 대기 표에 줄 서는 것뿐이고,
      # hold도 마감 fyi로 같은 표에 돌아온다. master를 지키는 방어는 리더의
      # 머지 전권과 통합 후 전체 스윕이지 이 select가 아니다. improv-worker의
      # landing과 같은 이유로 같은 모양이다 — 다만 중간 워커의 상위는 언제나
      # 리더이므로 후보 그룹이 하나다.
      prompt: |
        너에게 딸린 중간 워커의 스택이 완결됐다 — 자식 브랜치들이 스택
        베이스에 --no-ff로 착지돼 있고 간소화 스위트가 green이다. 지금 그
        스택 전체를 브랜치 하나로 네 통합 대기 표에 올리게 하는가(중간
        워커는 먼저 master 위로 --rebase-merges 정렬한 뒤 스택 표를 증거로
        올린다), 아니면 베이스를 동결해 두고 이 런을 마감하게 하는가?

        판단 근거는 이미 네 손에 있다: 착지마다 온 fyi에 스택 표(순서·자식
        브랜치·기준·머지 해시·수치)가 실려 있고, 모자라면 `claunch cflow
        status -t <그 세션> --json`과 journal이 나머지를 말해 준다.

        어느 쪽이든 master 머지는 네 통합 단계에서만 일어난다.
      # 상위가 없는 단독 편성이거나 30분 안에 답이 없으면 사람에게 간다.
      chooser:
        from:
          - {role: leader, scope: ancestor}
        otherwise: human
        timeout: 1800
      options:
        request:
          description: 지금 리더에게 스택 통합 요청 — 먼저 master 위로 정렬(--rebase-merges)한 뒤 스택 표를 증거로 올린다(머지 실행은 리더)
          next: handoff
        hold:
          description: 스택 베이스 동결(추가 착지 없음) — 통합은 나중에, 정리로
          next: wrapup

  handoff:
    title: 상위 통합 요청 (스택을 브랜치 하나로 — 머지는 리더 전권)
    instructions: |
      일반적인 stacked PR과 같다 — 스택의 바닥(베이스)이 상위 대상(master)
      위에 정렬된 뒤에 요청한다.
      - 분기 판별: `git rev-list <베이스>..master`가 비면 정렬할 것이
        없다 — 그 사실을 한 줄 남긴다. 비어 있지 않으면 정렬한다:
        **`git rebase --rebase-merges master`** — 스택 베이스는 --no-ff
        머지 커밋을 품고 있어 보통의 rebase는 트리를 평탄화하고 자식
        브랜치의 이력을 지운다; --rebase-merges가 머지 커밋을 다시 만들어
        스택을 보존한다. 충돌은 master가 정한 방향을 먼저 읽고 그 위에
        얹어 해결한다. 정렬 후 간소화 스위트를 다시 돌린다(리더의 완화
        규칙: 충돌 없는 rebase + 표적 green이면 통합 대기에 오를 수 있다 —
        전체 스윕은 리더 통합 단계의 게이트다).
      - 미착지 자식이 남아 있으면 정렬로 베이스의 커밋 해시가 전부
        바뀌므로 restack 공지를 보낸다(`git rebase --onto <새 베이스>
        <옛 베이스 tip> <자식>`). 그래서 handoff는 되도록 스택이 다 착지된
        뒤에 한다.
      - 증거 묶음: 스택 표(순서·자식 세션·브랜치·기준·머지 해시·수치),
        `git log master..<베이스>` / `<베이스>..master` 양방향 diff,
        `git merge-tree` 프리뷰, `git branch --contains <베이스>`가 아니라
        **`git branch --merged <베이스>`**로 함께 실리는 자식 브랜치 목록
        (= 스택의 트리 구조), 정렬 후 tip 해시와 간소화 스위트 수치(스택
        베이스 기준).
      - 이 묶음을 보고에 남기고 리더(부모)에게 --no-ff 머지 요청을
        회신 기대(ask)로 보낸 뒤, 베이스를 동결한다(추가 착지 없음). 보드:
        `claunch beads update <내 이슈> --status in_review`와 `comments add
        <내 이슈> "<베이스> @ <tip>, stack of N, tests N/M (간소화)"` —
        리더의 통합 대기 표는 그 in_review 목록이다.
      ── 금지: master를 직접 머지하지 않는다 ──
      master로의 merge·push, master 체크아웃 후 커밋·리베이스·cherry-pick,
      fast-forward로 슬쩍 반영 — 전부 금지다. 사용자가 승인했다는 이유로도,
      리더가 응답이 없다는 이유로도 예외가 아니다. master 반영 경로는
      리더 워크플로우(improv-leader)의 통합 단계 하나뿐이다.
    done_when: |
      master와의 분기 판별(정렬했으면 --rebase-merges 사실과 전후 tip,
      재확인 수치)과 증거 묶음(스택 표, 양방향 diff, merge-tree, 함께
      실리는 브랜치 목록)이 보고에 있고, 리더에게 통합 요청이 나갔으며
      베이스는 동결 상태다. master는 움직이지 않았다.
    next: await-landing

  await-landing:
    title: 리더 착지 대기
    select:
      # 요청이 나간 뒤 세션을 바로 끝내지 않는다 — 스택은 브랜치 하나지만
      # 그 안의 트리가 크므로, 리더의 rebase 재요청(뒤처짐·merge-tree 충돌)
      # 을 받아 restack할 사람이 남아 있어야 한다.
      prompt: |
        리더의 답이 왔는가? master에 머지됐다는 fyi(머지 해시)가 오면
        landed. rebase 재요청(분기가 다시 벌어졌거나 미리 병합이 충돌한다)
        이 오면 restack — 베이스 동결을 해제하고 handoff로 돌아가 최신
        master 위로 다시 정렬한 뒤 갱신된 묶음으로 재요청한다. 둘 다
        아니면 머문다.
      chooser: agent
      options:
        landed:
          description: 리더가 스택을 master에 --no-ff로 머지했다(해시 수신) — 정리로
          next: wrapup
        restack:
          description: 리더의 rebase 재요청 — 동결 해제, master 위로 재정렬 후 재요청
          next: handoff

  wrapup:
    title: 스택 마감·정리
    instructions: |
      - 자식: 착지된 자식은 자기 wrapup에서 스스로 종료한다. `children`으로
        남은 자식을 보고, 런 상태(claunch cflow status -t <세션>)로 유휴가
        확인된 것만 kill 도구로 종료해 슬롯을 돌려준다. hold로 동결된
        미착지 자식 브랜치는 리더에게 fyi로 알려 통합 대기 목록에 오르게
        한다(그 자식 이슈는 in_progress 그대로 — `comments add <id> "HOLD:
        …"`가 있는지 본다). 부모 이슈는 닫지 않는다 — 리더가 닫는다.
      - 잔류 테스트 서버·headless 브라우저 프로세스 종료, 임시 파일 삭제,
        git status 클린 확인. basetemp는 지우지 않는다(포렌식 기록 —
        지워야 하면 시작·소요·워커 수·실행량 네 값을 먼저 보고에 적는다).
      - 최종 보고: 스택 표 최종본, 리더의 머지 해시(착지됐으면), 남은
        브랜치(동결)를 요약한다. master는 이 런이 건드리지 않았어야
        정상이다.
      ── 세션 종료 (회차의 일부다 — 선택이 아니다) ──
      이 워크플로우는 recur하지 않는다. 최종 보고와 리더 fyi까지 마쳤으면
      next로 런을 end까지 진행해 done으로 만들고, 그 다음 마지막 행동으로
      자기 세션을 종료한다:
        claunch kill-session $CLAUNCH_SESSION
      (mesh의 kill 도구는 자기 자신을 거부한다.) 이 명령이 데몬에 닿는
      순간 pane이 닫히므로 종료 뒤에 할 일을 남겨 두지 마라 — 보고·fyi·
      런 done이 전부 이 명령보다 앞이다.

      ★ **보고까지 다 해 놓고 kill만 안 하는 것이 이 자리의 가장 흔한
      미완료다.** 원인은 게으름이 아니라 **신중함으로 위장한 망설임**
      이고, 아래가 그 전형이다 — 어느 것도 종료를 미룰 사유가 아니다:
      · 「사용자가 이 터미널에 있어 pane을 임의로 닫기 그렇다」 —
        이 세션은 이 스택을 접으라고 만들어졌고 **워크플로우의 이 줄이
        곧 그 승인**이다. 새로 받아낼 허락이 없다.
      · 「리더가 rebase 재요청·restack을 보낼 수 있다」 — 브랜치와
        bead는 세션과 무관하게 남고, 리더는 죽은 세션의 브랜치도
        머지한다. 필요하면 `claunch respawn`이다. **살아서 대기하는
        것은 도움이 아니라 슬롯 점유다.**
      · 「스택 착지를 확인하고 닫겠다」 — 착지 확인은 이 회차의 완료
        조건이 아니다. 통합은 리더의 회차다.
      · 「닫아도 될까요?」라고 되묻는 것 — **묻지 마라.** 묻는 순간
        그 턴이 끝나 버려 명령은 영영 안 나간다.
      다만 중간 워커에는 순서가 하나 더 있다: **자식이 먼저다.** 남은
      자식의 처리(유휴 확인 후 종료 / 동결 브랜치 리더 fyi)가 끝나기
      전에 죽으면 그 자식들은 부모 없이 남는다 — done_when의 그 항목이
      이 종료보다 앞이지, 종료를 미룰 사유는 아니다.

      **예외는 하나뿐이다**: 이 세션의 사용자가 이 회차 안에서
      「닫지 말고 있어라」를 **명시적으로 말했을 때**. 리더의 말은
      해당하지 않는다. 그 경우에도 최종 보고에 「사용자 지시로 종료
      보류」를 한 줄 남긴다.

      그리고 **예고하지 마라**. 「이제 닫겠습니다」를 쓰고 턴을 끝내면
      그 턴이 마지막 턴이 되어 명령이 나가지 않는다. 최종 보고를 쓴
      **같은 턴에서** 실행한다.
    done_when: |
      남은 자식의 처리(유휴 확인 후 종료 / 동결 브랜치 리더 fyi)가 끝났고,
      잔류 프로세스·임시 파일이 정리되어 git status가 클린하며, 스택 최종
      보고가 기록되었다. (세션 종료 자체는 이 게이트 뒤의 일이다 —
      '나중에'도 '선택'도 아니고 이 보고를 쓴 같은 턴에서 실행한다.)
    next: end
