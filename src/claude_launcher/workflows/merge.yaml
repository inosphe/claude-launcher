name: merge
description: >
  프리뷰가 미리 측정한 통합 배치를 대상 브랜치에 순차 --no-ff 로 얹는 실행자
  한 회차 — 자리 확인(겹침·재개 확인 포함) -> 프리뷰 사슬의 기대 트리 전개 ->
  (리더 판정) 이 배치에 프리뷰 예외가 서는가 -> 후보마다 게이트를 부르고 얹고
  결과 트리를 기대값과 대조 -> 대상 브랜치에 대한 스윕 게이트 -> 해시 보고로
  끝난다.
  실행자의 일은 실행하고 해시를 가져오는 데까지다: push 하지 않고, 브랜치를
  지우지 않고, 이슈를 닫지 않고, 실패한 것을 고치지 않는다. 판정은 이 회차를
  맡긴 리더의 것이고, 이 세션은 실행과 측정만 한다.
start: stance

# 이 워크플로를 모는 것은 리더가 통합 배치를 맡기려고 띄운 실행자 세션이다.
# 배치에 무엇을 넣을지·예외를 세울지는 리더가 정하고 이 세션은 그것을 실행한다
# — 그래서 whitelist 는 worker 다. 리더가 이것을 직접 몰면 improv-leader 의
# integrate 스텝이 세운 「실행은 subagent, 심사는 리더」가 무너진다.
filter_roles:
  type: whitelist
  roles: [worker]
# default_role 은 두지 않는다. improv-worker 가 이미 worker 의 기본값이고,
# 같은 역할에 둘이 자원하면 priority 하나로 갈리는 자리가 생긴다. 이 워크플로는
# 리더가 spawn 할 때 workflow 를 지목해서 열린다.

steps:
  stance:
    title: 자리 확인 — 어느 체크아웃의 어느 tip 에서 시작하는가, 그리고 나 말고 누가 서 있는가
    instructions: |
      ── 서 있는 자리를 못박는다 ──
      머지는 명령이 아니라 작업 트리에서 일어난다. 그러니 먼저 자기가 어디에
      서 있는지를 값으로 남긴다:
      - `git rev-parse --abbrev-ref HEAD` — 대상 브랜치 위에 서 있어야 한다.
        git 은 한 브랜치를 두 워크트리에 동시에 체크아웃하지 못하므로, 대상
        브랜치 위에 서 있다는 것은 곧 머지가 실제로 일어날 트리에 서 있다는
        뜻이다.
      - `git rev-parse HEAD` — 시작 시점의 tip 40자. 이 회차의 모든 대조가 이
        값에서 출발한다.
      - `git rev-parse HEAD^{tree}` — 시작 시점의 트리.
      - `git status --porcelain` — 지금 이 트리의 상태.
      게이트 `tools/merge_ready.py --checkout` 은 머지가 실제로 일어날 트리를
      재서 「머지가 쓸 파일」과 「그 트리가 더러운 파일」의 교집합을 본다. 다른
      체크아웃에서 부르면 엉뚱한 트리를 재고, 그 답으로 낸 판정은 그럴듯하게
      틀린다.

      ── 체크아웃은 여러 세션이 공유한다 ──
      `stash`, `checkout --`, `reset`, `clean` 은 어떤 형태로도 쓰지 않는다.
      stash 스택은 워크트리 전체가 함께 쓰기 때문에 남의 미커밋 작업을 지운다.
      `.beads/issues.jsonl` 이 수정된 상태로 보이는 것은 정상이고 건드리지
      않는다 — 데몬이 보드를 쓰는 자리다.

      ── 나 말고 누가 이 과제를 들고 있는가 ──
      실행자 세션은 회차 도중에 사라질 수 있고, 그러면 리더는 같은 과제를 쓴
      대체 실행자를 낸다. 원래 세션이 나중에 깨어나 같은 과제를 다시 집으면
      두 실행자가 한 체크아웃에 선다. 실측된 사고다(2026-08-28 17회차: 원래
      실행자가 판정을 기다리는 턴에서 종료됐고, 리더의 승인이 배달 대기로
      되돌아왔으며, 대체 실행자가 남은 세 머지를 썼고, 그 뒤 원래 세션이
      깨어났다). 사고의 본체는 리더가 「원래 세션이 되살아날 수 있다」를
      계산에 넣지 않은 것보다 한 층 아래에 있었다: 두 실행자 사이에 간선이
      없어서 어느 쪽도 상대의 존재를 스스로 알아챌 수 없었다. 계산을 잘하더라도
      간선이 없으면 같은 사고가 다시 난다.

      그래서 배치의 규칙은 이렇다(리더 s127 의 판정):

          대체 실행자를 낼 때는 원래 실행자와 간선을 먼저 열고, 대체의 과제에
          「너는 대체이며 원래 실행자는 누구이고 그가 깨어나면 먼저 물어라」를
          박는다.

      실행자가 이 스텝에서 확인할 것은 그 규칙의 자기 쪽 절반이다:
      - **대체 실행자로 열렸다면**: 과제에 원래 실행자의 이름이 박혀 있고 그
        세션과 간선이 열려 있는지 확인한다. 둘 중 하나라도 없으면 머지를
        시작하지 않고 리더에게 요청한다 — 간선 없이 도는 대체 실행자가 오늘
        사고의 원인이다.
      - **되살아난 원래 실행자라면**: 체크아웃을 만지기 전에 첫 턴에 대체
        실행자에게 직접 묻는다(누가 어디까지 썼는가). 순서는 간선 → 과제 명시
        → 되살아난 쪽의 질문이고, 이 순서를 앞당기거나 건너뛰지 않는다.

      어느 쪽이든, 재개했든 처음이든 다음을 확인한 뒤에야 다음으로 간다:
      - 대상 브랜치의 tip 을 지금 다시 읽는다. 과제에 적힌 시작 tip 과 다르면
        그 사이에 누군가 썼다는 뜻이다.
      - 후보마다 `git branch --contains <후보 tip>` 또는 게이트로 이미 얹혀
        있는지(landed)를 확인한다. 이미 얹힌 후보는 다시 얹지 않는다.
      - 누가 썼는지는 커밋의 `Claunch-Session` 트레일러로 구분한다
        (`git log -1 --format=%B <머지 커밋>`). 17회차에서 경위를 복원할 수
        있게 한 유일한 단서가 이것이었다.
      - 겹쳐 도는 실행자를 발견하면 혼자 정하지 않는다. 그 사실과 두 쪽이 쓴
        해시를 리더에게 보고하고 지시를 받는다.
      중복 실행이 안전했던 것은 장치가 있어서가 아니라 두 과제가 같은 순서와
      같은 커밋 메시지를 못박고 있었기 때문이다. 그러니 과제에 후보 순서와
      커밋 메시지가 못박혀 있는지 여기서 확인한다. 없으면 지어내지 말고 리더에게
      받아 적은 뒤에 다음으로 간다.
    # 이 자리에는 verify 를 두지 않는다 — 정본에도, 프로젝트 레이어에도.
    # 후보로 잰 것은 「HEAD 가 master 인가」를 종료 코드로 답하는 git 한 줄이었고,
    # 리더 s127 이 그것을 승인하지 않았다: 대상 브랜치는 이 워크플로의 실행
    # 파라미터인데 고정된 master 비교는 다른 대상을 쓰는 실행에서 틀린 답을 낸다.
    # 그래서 자리 확인은 done_when 이 받친다.
    #
    # sweepgate 의 verify 도 --branch master 를 박는 **같은 한계**를 지닌다.
    # 그런데도 그쪽만 무장한 이유는 값을 치를 이유가 그쪽에만 있기 때문이다:
    # outcome 스텝의 chooser: agent 를 받치는 기계 백스톱이 그 한 줄뿐이고,
    # 그것이 없으면 「끝까지 갔다」는 답을 아무것도 검산하지 않는다. 여기는
    # 그 자리가 아니다 — 자리가 어긋난 실행은 뒤따르는 게이트와 트리 대조가
    # 전부 어긋난 값을 내므로 스스로 드러난다.
    # 두 줄이 같은 한계인데 하나만 서 있는 것은 대칭이 깨진 것이 아니라
    # 이 차이 때문이다. 나머지를 채워 넣지 마라.
    done_when: |
      시작 시점의 tip 40자·트리 해시·`git status --porcelain` 출력이 보고에
      있고, 서 있는 브랜치가 대상 브랜치임을 값으로 확인했다.
      대체 실행자로 열렸다면 과제에 원래 실행자가 명시되어 있고 그 세션과
      간선이 열려 있음을 확인했다. 되살아난 원래 실행자라면 체크아웃을 만지기
      전에 대체 실행자에게 물었고 그 답이 보고에 있다.
      재개·대체 실행자라면 지금 다시 읽은 tip, 이미 얹혀 있는 후보 목록, 그
      머지 커밋을 쓴 세션(`Claunch-Session` 트레일러)이 보고에 있다.
      과제가 후보 순서와 커밋 메시지를 못박고 있음을 확인했다.
    next: preview

  preview:
    title: 프리뷰 사슬 전개 — 각 단계의 기대 트리를 미리 뽑는다
    instructions: |
      이 워크플로가 얹는 것은 아무 배치가 아니라 프리뷰 스윕이 초록으로 끝난
      배치다. 그 프리뷰는 대상 tip 에서 잘라 같은 후보를 같은 순서로 --no-ff
      로 얹은 커밋이므로, 그 조상 사슬이 곧 이번에 일어날 머지의 기대값이다.
      머지를 시작하기 전에 그 값을 뽑아 표로 만든다:

          git log --format='%H%n parents: %p%n tree: %T%n subj: %s' <프리뷰 tip>

      표의 한 행은 (프리뷰 커밋, 그 단계에서 얹힌 후보 브랜치, 결과 트리 해시)
      다. 17회차에서 이 명령으로 후보 넷의 순차 머지 사슬이 그대로 나왔고, 각
      단계의 기대 트리를 여기서 얻었다.
      그리고 프리뷰 tip 의 트리에 초록 영수증이 있는지 확인한다:

          uv run --no-sync python tools/sweep.py check --branch <프리뷰 브랜치>

      출력과 종료 코드를 보고에 그대로 옮긴다. 영수증이 없거나 빨강이면 이
      배치에는 프리뷰 예외가 서지 않는다 — 그 사실을 다음 스텝의 판정자에게
      숨기지 않는다.
      ── 이 스텝은 merge 스텝의 트리 대조가 서기 위한 선행 조건이다 ──
      트리 대조가 사후 장치로 성립하려면 기대 트리값이 **머지 이전에 이미
      존재해야** 한다. 그 값을 만드는 것이 이 스텝이다. 그래서 둘이 함께 서야
      한다:
      - 프리뷰를 먼저 만들고 단계별 트리를 기록한다(이 스텝).
      - 머지 순서를 프리뷰와 동일하게 유지한다(merge 스텝).
      두 번째가 특히 중요하다. 순서가 달라지면 중간 트리가 달라지므로, 최종
      트리가 같더라도 단계별 대조는 성립하지 않는다.
      표를 만들지 못하면 머지를 시작하지 않는다. 기대 트리가 없으면 실행자는
      대조할 대상이 없고, 그러면 게이트 종료 코드 1 을 판단 없이 넘기는 것과
      같아진다.
    done_when: |
      프리뷰 tip 의 커밋 해시 40자와 트리 해시, 그리고 각 단계의 (프리뷰 커밋,
      후보 브랜치, 결과 트리) 표가 보고에 있다.
      그 표의 후보와 순서가 이번에 얹을 후보·순서와 같은지 대조한 결과가 보고에
      있다.
      프리뷰 브랜치에 대한 `tools/sweep.py check` 의 출력 전문과 종료 코드가
      보고에 있다.
    next: batch

  batch:
    title: 배치 판정 — 이 배치에 프리뷰 예외가 서는가
    select:
      prompt: |
        한 실행자가 통합 배치를 순차 --no-ff 로 얹으려 한다. 판정할 것은 하나다:
        이 배치에 보드 이슈 claunch-iavq 의 프리뷰 예외가 서는가.

        그 예외가 무엇인지. `tools/merge_ready.py` 는 대상이 분기점보다 앞서 있고
        머지는 깨끗할 때 종료 코드 1(`re-measure: baseline moved, merge is
        clean`)을 낸다. 후보들이 같은 base 를 공유하는 배치에서는 첫 후보를
        얹는 순간 대상이 전진하므로, 두 번째 후보부터는 어떤 경우에도 0 이
        나오지 않는다. 「1 이면 건너뛴다」를 문자 그대로 적용하면 순차 머지
        배치 자체가 성립하지 않는다. 그런데 프리뷰를 머지할 그대로 지은
        배치에서는 기준선을 움직인 것이 바로 프리뷰가 이미 측정한 커밋이다.
        claunch-iavq 는 그 경우에 한해 1 을 재측정 사유로 보지 않고, 대신 머지
        한 건마다 결과 트리를 프리뷰 사슬의 대응 단계와 대조하도록 판정했다.

        예외가 서려면 셋이 모두 성립해야 한다:
        1. 프리뷰를 대상 tip 에서 잘라 같은 후보를 같은 순서로 --no-ff 로
           얹었다.
        2. 그 프리뷰 트리에 전체 스윕이 돌아 초록 영수증이 있다.
        3. 머지마다 결과 트리를 프리뷰 사슬의 대응 단계와 대조하고, 다르면
           그 자리에서 멈춘다.

        실행자의 보고가 아니라 저장소를 직접 읽어서 답한다. 실행자의 보고에서
        가져올 것은 프리뷰 브랜치 이름과 후보 목록뿐이고, 판정은 이 명령들로
        한다:
          git log --format='%H%n parents: %p%n tree: %T%n subj: %s' <프리뷰 tip>
          uv run --no-sync python tools/sweep.py check --branch <프리뷰 브랜치>
        하나라도 확인되지 않거나 애매하면 unbacked 로 답한다.
      chooser:
        # 예외를 세우는 것은 claunch-iavq 를 낸 리더의 판정이고, 실행자는 그
        # 답으로 게이트 하나를 통과한다 — 곧 묻는 쪽에 이해관계가 있다.
        # 그래서 chooser: agent 로 두지 않는다.
        # scope 는 기본값 any 다: 이것은 저장소를 읽으면 답이 나오는 능력
        # 판정이고, 옆에 선 다른 리더가 답해도 답이 달라지지 않는다.
        from:
          - {role: leader}
        otherwise: human
        timeout: 1800
      options:
        chained:
          description: 프리뷰가 이 배치를 그대로 측정했다 — 예외를 세우고 순차 머지로 간다(머지마다 트리 대조가 게이트를 대신한다)
          next: merge
        unbacked:
          description: 프리뷰가 없거나 후보·순서가 다르거나 영수증이 초록이 아니다 — 아무것도 얹지 않고 리더에게 되돌린다
          next: handoff

  merge:
    title: 순차 머지 — 게이트를 부르고, 얹고, 결과 트리를 기대값과 대조한다
    instructions: |
      후보를 프리뷰 사슬과 같은 순서로 하나씩 처리한다. 한 후보의 처리는
      「게이트 → 판정 → 머지 → 트리 대조」 넷이고, 넷을 다 마치기 전에 다음
      후보로 넘어가지 않는다.

      ── 1. 매 머지 직전에 게이트를 다시 부른다 ──

          uv run --no-sync python tools/merge_ready.py --branch <후보> --target <대상> --checkout

      `--branch` 를 빼지 마라. 대상 브랜치 위에 서서 그냥 부르면 게이트는
      「이 체크아웃은 통합 대상 자신 위에 있어 착지 후보가 아니다」라며 종료 코드
      2 를 낸다(merge_ready.py 의 `_same_branch(branch_name, target)` 갈래).
      `--checkout` 도 빼지 마라. 그것이 「머지가 일어날 트리가 이 머지를 거부하지
      않는가」를 재는 유일한 자리이고, 배치 안에서 움직이는 것은 대상 브랜치만이
      아니다.
      게이트는 매 후보 직전에 다시 부른다. 배치 시작 시점의 판정은 첫 후보를
      얹는 순간 낡는다.

      ── 2. 종료 코드를 읽는다. 0 은 갈래가 넷이므로 첫 줄도 읽는다 ──
      - 0 — 얹을 수 있다. 다만 첫 줄이 어느 갈래인지 본다:
        - `ready: aligned -- ...` / `ready: re-measured on <sha> -- ...`
          → 얹는다.
        - `ready: landed -- <대상> already contains <tip>` → 이미 얹혀 있다.
          다시 얹지 않는다. 정상 분기다. 누가 얹었는지를 `Claunch-Session`
          트레일러로 확인해 보고에 적고, 지금 tip 의 트리가 그 단계의 기대
          트리와 같은지 대조한다(대조는 건너뛰지 않는다).
        - `ready: nothing to land -- <후보> is <대상>` 또는
          `ready: nothing to land -- <tip> is on <대상>'s own first-parent line`
          → 후보 지정이 잘못됐거나 커밋 없이 자른 브랜치다(뒤의 것은 대상이
          앞서 나간 뒤의 같은 경우다, claunch-gzi50). 얹을 것이 없다.
          멈추고 보고한다.
      - 1 — `re-measure: baseline moved, merge is clean`.
        **프리뷰를 쓰는 배치에서 1 은 예외 상황이 아니라 정상 경로다.** 후보들의
        merge-base 가 같은 커밋이므로 첫 머지가 대상을 미는 순간 나머지가 전부
        뒤진 베이스가 된다 — 곧 두 번째 후보부터는 1 이 기본값이다. 이것을
        예외 처리로 읽으면 다음 실행자가 그 자리에서 멈춘다.
        이 배치는 앞 스텝에서 프리뷰 예외가 선 배치로 판정됐으므로, 기준선을 움직인 것이
        프리뷰가 이미 측정한 커밋인지를 확인한다: 지금 대상 tip 이 이 배치의
        앞선 머지로 도달한 커밋이고 그 트리가 프리뷰 사슬의 대응 단계와 같으면,
        움직인 원인이 측정 안에 들어 있다는 뜻이다 — 얹는다. 그 조건이 서지
        않으면(다른 행위자가 프리뷰 밖의 커밋을 얹었다면) 멈추고 보고한다.
        17회차에서 s254·s268·s267 이 전부 이 갈래였고 게이트 자신은 셋 모두를
        "merge is clean" 으로 판정했다.
      - 2 — `cannot tell`. 멈춘다. 판정이 서지 않은 것은 판정이 없는 것이고,
        없는 판정 위에 머지를 얹지 않는다.
      - 3 — `rebase`. 예외 없이 멈춘다. 충돌 트리를 대상에 강제로 얹지 않는다.
      - 4 — `dirty checkout`. 예외 없이 멈춘다. 막고 있는 것은 그 후보가 아니라
        머지가 일어날 트리다 — 재정렬도 재측정도 이것을 못 고친다. 게이트가 낸
        막는 파일 목록을 그대로 보고에 싣는다.

      ── 3. 얹는다 ──
      반드시 `--no-ff`. 커밋 메시지는 과제에 못박힌 그대로 쓴다(저장소 관례:
      `Merge branch '<후보>' — <무엇을 어떻게>`). 지어내지 않는다 — 대체 실행자와
      원래 실행자가 겹쳐 돌아도 결과가 깨지지 않았던 것이 순서와 메시지가 과제에
      못박혀 있었기 때문이다. `Claunch-Session` 트레일러를 남긴다(commit-stamp).

      ── 4. 결과 트리를 기대값과 대조한다. 이것이 게이트를 대신하는 확인이다 ──

          git rev-parse HEAD^{tree}

      프리뷰 사슬의 대응 단계 트리와 같아야 한다. 하나라도 다르면 그 자리에서
      멈추고 다음 머지로 넘어가지 않는다. 트리가 갈라진 뒤의 머지는 프리뷰가
      측정하지 않은 트리를 쌓는 것이라 초록 영수증이 더 이상 그 트리를 가리키지
      않는다.
      게이트의 0 은 「지금 얹으면 깨끗하다」를 말하고, 트리 대조는 「얹은 결과가
      스윕이 초록을 낸 바로 그 트리다」를 말한다. 두 번째가 더 많은 것을
      보증한다.

      이 대조가 서려면 preview 스텝의 단계별 표가 머지 이전에 이미 있어야 하고,
      머지 순서가 프리뷰와 같아야 한다. 순서가 달라지면 중간 트리가 달라지므로,
      최종 트리가 같더라도 단계별 대조는 성립하지 않는다.

      ── 트리 대조는 두 가지를 잡는다. 하나로 줄이지 않는다 ──
      이 대조를 「게이트가 1 을 냈을 때의 대체 확인」으로만 읽으면 절반이
      보이지 않는다. 서는 자리가 둘이다:
      - **실행자가 하나일 때** — 얹은 결과를 프리뷰 영수증이 여전히 가리키는지
        확인하는 장치다. 트리가 갈라지면 그 초록은 더 이상 이 트리의 것이 아니다.
      - **실행자가 둘이 되는 사고에서** — 그 사고가 결과를 바꿨는지 잡는 사후
        장치다. 누가 썼든, 트리가 기대값과 다르면 그 자리에서 멈춘다.
      앞 스텝(stance)의 간선은 겹침을 **미리** 막고, 이 대조는 겹침이 결과를
      바꿨는지 **사후에** 잡는다. 두 장치는 서는 시점이 다르고 서로를 대신하지
      못한다. 17회차에는 뒤쪽만 서 있었고 그것으로 결과를 구했다 — 앞쪽이
      없었으므로 결과가 맞았다는 것을 아무도 미리 보장하지는 못했다.
      그러므로 「어차피 게이트가 있으니 트리 대조는 생략해도 된다」로 줄이지
      않는다. 게이트는 겹침을 보지 못한다.

      ── 머지 중 충돌이 나면 해소하지 않는다 ──
      `git merge --abort` 로 되돌리고, 어느 후보의 어느 파일이 충돌했는지 보고한다.
      프리뷰에서 깨끗하게 붙은 배치에서 충돌이 났다면 그 사실 자체가 보고할
      값이다 — 프리뷰와 지금 트리가 어긋났다는 뜻이므로 남은 후보도 얹지 않는다.

      ── 하지 않을 것 ──
      push 하지 않는다. 브랜치를 지우지 않는다. 이슈를 닫지 않는다. 실패한 것을
      고치지 않는다. 실행자의 일은 실행하고 해시를 가져오는 데까지다 — 고치기
      시작하는 순간 리더가 심사할 대상이 「무엇이 일어났는가」에서 「무엇을
      고쳤는가」로 바뀐다.
    done_when: |
      후보마다 다음이 보고에 있다: 게이트 종료 코드와 판정 첫 줄, 머지 커밋
      해시 40자, `git show --stat` 요약 줄, 결과 트리 해시와 기대값 일치 여부.
      얹지 않은 후보는 그 사유가 landed(누가 얹었는지 포함)인지, 종료 코드
      2·3·4 인지, 앞선 후보에서 멈춰 도달하지 못한 것인지로 구분되어 있다.
      머지를 멈춘 회차라면 어디서 왜 멈췄는지와, 충돌이면 후보·파일 목록이
      보고에 있다.
      대상 브랜치의 마지막 tip 40자·트리 해시와 `git status --porcelain` 이
      보고에 있다.
      push·브랜치 삭제·이슈 종료·수정은 하지 않았다.
    next: outcome

  outcome:
    title: 배치 결과 — 끝까지 갔는가, 도중에 멈췄는가
    select:
      prompt: |
        이 배치의 후보가 전부 처리됐고(얹었거나 이미 얹혀 있었거나) 머지마다의
        결과 트리가 기대값과 같았는가, 아니면 도중에 멈췄는가.
      # chooser: agent 인 이유. 이 답은 에이전트가 방금 읽은 해시에서 그대로
      # 나오는 사실이고, 틀리게 답하면 다음 스텝의 게이트가 잡는다: 도중에
      # 멈춘 트리는 프리뷰 tip 의 트리가 아니므로 그 트리에 대한 초록 영수증이
      # 없고, 스윕 게이트가 빨강으로 답한다. 그리고 유인이 반대로 서 있다 —
      # halted 는 실패를 적어 내는 쪽이라 고르고 싶은 답이 아니다.
      chooser: agent
      options:
        complete:
          description: 후보가 전부 처리됐고 트리가 전부 일치했다 — 대상 브랜치에 대한 스윕 게이트로 간다
          next: sweepgate
        halted:
          description: 충돌·트리 불일치·게이트 2/3/4 로 도중에 멈췄다 — 스윕 게이트를 지나지 않고 멈춘 자리를 그대로 보고한다
          next: handoff

  sweepgate:
    title: 스윕 게이트 — 최종 트리에 초록 영수증이 서는가
    instructions: |
      마지막 확인은 대상 브랜치에 대한 스윕 게이트다.

          uv run --no-sync python tools/sweep.py check --branch <대상>

      최종 트리가 프리뷰 트리와 같으면 커밋이 달라도 초록이 난다. 스윕은
      역사가 아니라 내용을 판정하므로 영수증의 sha 는 주소일 뿐이고,
      `find_receipt_by_tree` 가 트리로 영수증을 찾는다(tools/sweep.py). 17회차의
      출력이 그 증거다:

          via the receipt for 4d99ed40aea2: a different commit, the same tree 91a3af58

      게이트를 직접 한 번 실행해 출력 전문과 종료 코드를 보고에 옮긴다.
      영수증이 트리로 찾아졌으면 위와 같은 `via the receipt for ...` 줄을 그대로
      싣는다 — 어느 sha 의 영수증을 딛고 섰는지가 이 초록의 근거다.
      빨강이면 이 턴에서 스위트를 돌리지 않는다. 게이트의 출력이 시키는 것은
      깨끗한 트리에서 `tools/sweep.py run` 을 돌릴 subagent 를 띄우는 것이고,
      그것은 이 실행자의 일이 아니다. 빨강을 그대로 리더에게 보고하고 이 스텝을
      떠나지 않는다.
    # 저장소 특화 verify 는 정본이 아니라 프로젝트 레이어(.claunch/workflows/)에.
    # 여기 설 것은 improv-leader 의 sweep 스텝과 같은 한 줄이다 — 이 저장소의
    # 스윕 영수증을 읽는 값싼 검사이고, 스윕 자체가 아니다(엔진은 verify 를
    # 스텝을 떠날 때 동기로 돌리므로 전체 스위트를 걸면 회차가 그 자리에서
    # 막힌다). 명령이 tools/ 에 있으므로 패키지 정본이 담지 못한다.
    # 그 한 줄은 --branch master 를 박으므로 다른 대상을 쓰는 실행에서는 틀린
    # 답을 낸다. 그 한계를 안고도 여기만 무장한 이유는 stance 의 주석에 있다:
    # outcome 의 chooser: agent 를 받치는 기계 백스톱이 이 한 줄뿐이다.
    #
    # 그 백스톱이 잡는 거짓 complete 는 **절반**이다. 도중에 멈춘 뒤 complete 는
    # 잡는다 — 중간 트리에는 영수증이 없다. 한 건도 얹지 못한 뒤 complete 는 못
    # 잡는다 — 대상 트리가 직전 배치의 트리 그대로라 그 영수증이 그대로 선다
    # (17회차가 닫힌 직후의 master 가 `via the receipt for 4d99ed40aea2 ... the
    # same tree 91a3af589fa6` 로 exit 0 을 낸다). 이 게이트가 재는 것은 「지금
    # 대상 트리가 스윕된 트리인가」이고 「이번 회차가 무엇을 했는가」가 아니다.
    # 남는 절반은 handoff 의 done_when 이 사람 쪽에서 메운다. 이 게이트를 「거짓
    # complete 를 막는 장치」로 읽지 마라 — 절반만 참이다.
    done_when: |
      스윕 게이트의 출력 전문과 종료 코드가 보고에 있고, 영수증이 트리로
      찾아졌으면 그 `via the receipt for ...` 줄이 그대로 실려 있다.
      이 턴에서 스위트를 돌리지 않았다.
    next: handoff

  handoff:
    title: 완료 보고 — 해시를 가져오는 데까지가 실행자의 일이다
    instructions: |
      이번 회차에서 실제로 일어난 것을 리더에게 보고한다. 보고는 산문 요약이
      아니라 값이다 — 리더는 이 값을 값싼 읽기 명령으로 되확인해서 심사에
      쓴다. 그러니 되확인할 수 있는 형태로 적는다.
      아무것도 얹지 않고 되돌아온 회차(배치 판정이 unbacked 였거나 도중에 멈춘
      경우)도 같은 자리에 보고한다. 「아무 일도 없었다」가 아니라 어디까지 갔고
      무엇이 그것을 막았는지가 결과물이다.
      마지막으로 다시 확인한다: push 하지 않았고, 브랜치를 지우지 않았고, 이슈를
      닫지 않았고, 실패한 것을 고치지 않았다.
    done_when: |
      보고에 다음이 전부 있다:
      후보마다의 게이트 종료 코드, 머지 커밋 해시 40자, `git show --stat` 요약 줄,
      머지마다의 결과 트리 해시와 기대값 일치 여부, 최종 tip 과 트리,
      `git status --porcelain`, 스윕 게이트의 출력과 종료 코드, 건너뛴 후보의 사유.
      겹쳐 돈 실행자를 발견했으면 그 사실과 양쪽이 쓴 해시·세션 이름이 적혀 있다.
      push·브랜치 삭제·이슈 종료·수정을 하지 않았음이 적혀 있다.
      이 보고가 실제로 리더에게 전달되었다(메시 메시지 id 가 보고에 있다).
    next: end
