# Session faults: the messages a harness prints when it is stopped by the
# account, the credentials or the service rather than by the work
# (claunch-pczoc). The daemon scans the bottom of a session's screen
# (daemon/session_fault.py) and marks the session while a message here is
# seen; the rail draws a red pill and the `session_faults` MCP tool lists it.
#
# This file is the extension point, and the reason it is data: the messages
# are collected as they are observed on live terminals. Adding one is a
# YAML entry plus a `sample` line -- no code change. `tests/test_session_fault.py`
# matches every `sample` against its declared kind, so a pattern that stops
# matching the real message fails the suite.
#
# Which entry decides is not catalogue order. The detector reads the bottom
# of the screen (daemon/session_fault.py, claunch-pczoc.2.1.1) and the match
# whose row sits lowest wins -- the line painted last is the one the session
# stopped on. Order inside a list only breaks a tie between two entries that
# start at the same character, and it is the one reason `common` is read
# before a harness's own list: a provider's message can be painted by any
# harness (the Kimi 429 in the samples below was printed by a `claude`
# session).
#
# `fallback: true` marks an entry that names no cause -- a bare status code,
# or the client saying it gave up. It decides only when nothing else in the
# scanned window matched, whichever row either one sits on. That is how a
# provider's quota sentence beats the bare 429 beside it.
#
# Every kind also carries `resolved_by`, the grade of what clears the stop:
# `input` (a keystroke on that terminal), `account` (billing, plan, login),
# `provider` (the service recovers, or time passes), or `policy` (the
# session changes how it asks). The kind is the diagnosis; this is the fix,
# and it is what keeps a prompt waiting for a keystroke from reading like an
# exhausted plan (claunch-pczoc.3).

version: 1

# The kinds a fault can have, and how long it stays on the rail after its
# message was last seen. A message that names an absolute reset time
# ("resets Oct 26, 9am (Asia/Seoul)") overrides the window with that time.
kinds:
  usage_limit:
    label: usage limit
    action: wait for the reset, or raise the plan
    window: 86400
    resolved_by: account
  account_suspended:
    label: account suspended
    action: check the provider's billing and payment
    window: 86400
    resolved_by: account
  rate_limit:
    label: rate limit
    action: wait for the rate window to pass
    window: 900
    resolved_by: provider
  # The provider answers but is out of capacity (529 Overloaded). The harness
  # retries by itself, so the window is shorter than api_status's: a session
  # that is still here after five minutes is not waiting out one retry.
  overloaded:
    label: provider overloaded
    action: wait a few minutes; if it stays, the provider is degraded
    window: 300
    resolved_by: provider
  auth:
    label: login
    action: run the harness's login again
    window: 21600
    resolved_by: account
  api_status:
    label: API error
    action: check the provider's status; retry later
    window: 1800
    resolved_by: provider
  network:
    label: network
    action: check connectivity and DNS
    window: 900
    resolved_by: provider
  policy_blocked:
    label: policy block
    action: rephrase, or switch model
    window: 3600
    resolved_by: policy
  # The harness is waiting for a keystroke: a prompt it will not leave on its
  # own (s1735, 2026-10-25). Nothing is wrong with the account or the
  # service, and no amount of waiting clears it -- the person at that
  # terminal is the one who does. It is read here because it is the same
  # kind of stop (nobody else can move the session), and `resolved_by:
  # input` is what keeps it apart from the account and service faults above.
  # The window is the length of the other short faults; detection reads the
  # screen and cannot see that the key was pressed, so the badge stays for
  # the window after the prompt is gone. Nothing acts on this record --
  # there is no send-keys and no auto-release (claunch-pczoc.3).
  awaiting_input:
    label: waiting for input
    action: answer the prompt on the session's terminal
    window: 900
    resolved_by: input

common:
  # Fireworks, 2026-10-23 (s1342): "API Error: 412 Account
  # yusanghyun-uuplax3zp is suspended, possibly due to reaching the monthly
  # spending limit or failure to pay past invoices." A suspended account is
  # its own fault: waiting out a usage window does not bring it back.
  - kind: account_suspended
    pattern: |-
      Account \S+ is suspended
    sample: |-
      API Error: 412 Account yusanghyun-uuplax3zp is suspended, possibly due to reaching the monthly spending limit or failure to pay past invoices. Please go to https://fireworks.ai/account/billing for more information.
  # The status code alone, when the body says nothing more readable. A bare
  # code is a `fallback` (see the note at the top of this file).
  - kind: account_suspended
    fallback: true
    pattern: |-
      API Error: 412\b
  # Observed 2026-10-24 on a claude session: "API Error: 529 Overloaded —
  # retrying in 30s (attempt 3/10)". It sits in `common` because the wording
  # is the provider's. Both entries below it are `fallback`, so a bare 529
  # gets the shorter `overloaded` window instead of `api_status`'s 1800
  # seconds when the word "Overloaded" is there, and the code entry above the
  # generic status pattern settles it by list order when it is not. Only 529
  # is read this way — no 503 or other 5xx message has been collected, and
  # `api_status` already covers them.
  - kind: overloaded
    fallback: true
    pattern: |-
      API Error: 529\b
    sample: |-
      API Error: 529 Overloaded — retrying in 30s (attempt 3/10)
  - kind: overloaded
    pattern: |-
      API Error:[^\n]{0,60}\bOverloaded\b
  # Kimi / Anthropic subscriptions: "You've reached your weekly (7-day)
  # usage limit. Your quota will reset when the current 7-day window ends."
  - kind: usage_limit
    pattern: |-
      Your quota will reset when the current (?:5-hour|7-day) window ends
    sample: |-
      API Error: Request rejected (429) · You've reached your weekly (7-day) usage limit. Your quota will reset when the current 7-day window ends.
  - kind: usage_limit
    pattern: |-
      You'?ve reached your (?:weekly|5-hour|7-day|daily) usage limit
    sample: |-
      API Error: Request rejected (429) · You've reached your 5-hour usage limit. Your quota will reset when the current 5-hour window ends.
  # Claude Code's own exhausted-plan wording; it lived in `harnesses.claude`
  # until claunch-pczoc.2.1. It is in `common` because only `claude` has been
  # seen to paint it, and a harness added later still reads it. When the
  # timeout entries below joined `common`, a screen showing this line and a
  # `Request timed out` row together read as `network` (measured,
  # 2026-10-24) -- a 15-minute connectivity fault instead of the 24-hour
  # plan wait. The timeout entries are `fallback` now, so this line wins
  # wherever the two sit (claunch-pczoc.2.1.1).
  - kind: usage_limit
    pattern: |-
      You'?ve hit your (?:weekly|5-hour|daily) limit
    sample: |-
      You've hit your weekly limit · resets Oct 26, 9am (Asia/Seoul)
  # A provider answering with a JSON error body, whatever harness painted it.
  - kind: auth
    pattern: |-
      The API key you provided is invalid
    sample: |-
      401: {"message":"The API key you provided is invalid.","param":null,"code":"UNAUTHORIZED","type":"error"}
  - kind: auth
    pattern: |-
      "code"\s*:\s*"UNAUTHORIZED"
  # The two codes that were only readable inside a harness list (401 as
  # `Please run /login`, 429 as `Request rejected`). Stated here by code, so
  # every harness reads them. Both are `fallback`: a bare code yields to the
  # quota sentences above when a 429 names one, because that is an exhausted
  # plan and not a rate window.
  - kind: auth
    fallback: true
    pattern: |-
      API Error: 401\b
  - kind: rate_limit
    pattern: |-
      "code"\s*:\s*"rate_limit_error"|"type"\s*:\s*"rate_limit_error"
  - kind: rate_limit
    pattern: |-
      Error: 429: .{0,160}"rate limit
  - kind: rate_limit
    fallback: true
    pattern: |-
      API Error: 429\b
  # Claude Code's wording for a 429 that names no quota. It stayed in
  # `harnesses.claude` until claunch-pczoc.2.1 and lost to the timeout entries
  # below whenever the two shared a window (measured: `rate_limit` alone,
  # `network` with a timeout row). The code-level entry above does not cover
  # it -- this line says "Request rejected (429)", not "API Error: 429".
  - kind: rate_limit
    pattern: |-
      Request rejected \(429\)
  - kind: network
    pattern: |-
      \b(?:ECONNREFUSED|ENOTFOUND|EAI_AGAIN)\b
  - kind: network
    pattern: |-
      Error: Connection error
  # The login prompt and the policy refusal, stated here for the same reason
  # as the exhausted-plan line above: both are painted by one harness
  # (`claude`'s "Please run /login", pi's "Use /login to log into a provider",
  # `claude`'s "safeguards flagged this message") and both sat in that
  # harness's list until claunch-pczoc.2.1. With the timeout entries below in
  # `common`, a screen showing either line beside a timeout row read as
  # `network` -- measured for both harnesses, and a regression for `claude`
  # (it read `policy_blocked` before). The timeout entries are `fallback`
  # now, so the more specific reading survives a shared window in either
  # order.
  - kind: auth
    pattern: |-
      Please run /login
    sample: |-
      ●Please run /login · API Error: 401 Invalid bearer token
  - kind: auth
    pattern: |-
      Use /login to log into a provider
    sample: |-
      Use /login to log into a provider via OAuth or API key. See: /home/user/.pi/agent/install/releases/1.1.0/n...
  - kind: policy_blocked
    pattern: |-
      safeguards flagged this message
    sample: |-
      API Error: Opus 5.5's safeguards flagged this message (https://www.anthropic.com/legal/aup).
  # pi, 2026-10-24 (s1736): the screen showed "Error: Request timed out."
  # four times and then "Error: Retry failed after 3 attempts: Request
  # timed out." -- the client's own retry loop gave up. Both lines are the
  # transport failing, so both are `network`, and both are `fallback`: they
  # say the client stopped, not why. A screen that ends with the exhausted
  # line records that line, because it is the lowest of the matches. They sit
  # in `common` because the wording belongs to the provider client and not to
  # one harness: `claude` painted it too, and pi painted it here (it lived in
  # `harnesses.claude` until claunch-pczoc.2.1, so every other harness read
  # nothing).
  - kind: network
    fallback: true
    pattern: |-
      Retry failed after \d+ attempts
    sample: |-
      Error: Retry failed after 3 attempts: Request timed out.
  - kind: network
    fallback: true
    pattern: |-
      Request timed out
    sample: |-
      Error: Request timed out.
  # Claude Code, 2026-10-27 (s3568): "* Waiting for API response · will retry
  # in 1m 24s · check your network". The client is between attempts and
  # counting down, so this is the same stop the two entries above describe: no
  # answer arrived, and whatever explains it is elsewhere on the screen (a
  # quota sentence, a status code). It stays a `fallback` for that reason --
  # a state it enters only decides when nothing in the window names a cause,
  # or the named cause is itself a fallback and sits above it. `network` and
  # not `api_status`: the line says the transport is the suspect ("check your
  # network"), and the provider has not answered with a status at all.
  # `common`, by the same rule as the plan line above: only `claude` has been
  # seen to paint it, and a harness added later reads it without a list
  # (claunch-pczoc.2.1).
  - kind: network
    fallback: true
    pattern: |-
      Waiting for API response
    sample: |-
      * Waiting for API response · will retry in 1m 24s · check your network
  # The generic status fallback: any "API Error: <code>", reached only when
  # nothing above matched. It lives here, last in `common`, so a provider's
  # status error is read in every harness and not only in `claude` (where it
  # was collected). The code is reported in the fault's ``code`` field, so a
  # new status needs no new pattern to be visible -- only a kind if it
  # deserves its own reading.
  - kind: api_status
    fallback: true
    pattern: |-
      API Error: \d{3,}
    sample: |-
      API Error: 500 Internal Server Error

harnesses:
  claude:
    # The exhausted-plan line ("You've hit your weekly limit · resets Oct 26,
    # 9am (Asia/Seoul)"), the login prompt and the policy refusal are in
    # `common` now (claunch-pczoc.2.1): each of them can share a screen with
    # the provider client's timeout wording, which is also in `common`, and a
    # `fallback` entry never outranks a line that names a cause.
    # The footer a modal paints while it waits for a keystroke (s1735,
    # 2026-10-25). Two wordings were collected: "Enter to confirm · Esc to
    # cancel" on the auto-mode setup prompt, and "Enter to continue · Esc to
    # cancel" on the auto-mode billing notice. The separator between the two
    # halves is a dot on some screens and a plain space on others, so the
    # pattern spans it rather than naming it. These stay in this harness's
    # list, not in `common`: both collections came from `claude`, and the
    # footer is the harness's own furniture.
    - kind: awaiting_input
      pattern: |-
        Enter to (?:confirm|continue)[^\n]{0,40}Esc to cancel
      sample: |-
        Enter to confirm · Esc to cancel
    - kind: auth
      pattern: |-
        API Error: 401[^\n]{0,160}
      sample: |-
        API Error: 401 Invalid bearer token
    # 429 without a quota sentence is a rate window, not an exhausted plan;
    # that wording is in `common` (see the note above it).
    # "API Error: Can't reach the API server — check your internet or DNS (EAI_AGAIN)"
    - kind: network
      pattern: |-
        Can't reach the API server
      sample: |-
        API Error: Can't reach the API server — check your internet or DNS (EAI_AGAIN)
    # "Request timed out" and "Retry failed after N attempts" are in
    # `common` -- pi painted the same lines (claunch-pczoc.2.1), so they are
    # the provider client's wording rather than this harness's.
    # The generic "API Error: <code>" fallback, and the 401/429 by code, are
    # in `common`, so every harness reads them; the wording above stays here
    # because it is this harness's.

  pi:
    # pi's login prompt ("Use /login to log into a provider via OAuth or API
    # key. See: ...") moved to `common` in claunch-pczoc.2.1, for the same
    # reason as claude's lines: the provider client's timeout wording is in
    # `common` too, and the login prompt names a cause while the timeout
    # entries only say the client gave up.

  # Nothing observed yet on this machine's Codex sessions (127 output logs
  # searched, 2026-10-23). Its own error wording goes here when it is
  # collected; until then only `common` applies.
  codex: []

  # The Kimi CLI's own wording was not in the collected logs -- the 429
  # messages that name kimi.com were painted by `claude` sessions in the
  # `common` list above.
  kimi: []

  agent: []
  devin: []
