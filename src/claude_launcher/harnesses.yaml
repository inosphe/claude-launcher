version: 1

harnesses:

  claude:
    builtin: true
    models: [haiku, sonnet, opus, fable]
    # Launches pass the alias itself (--model=opus); this prefix is what
    # reads a reported id (claude-opus-5) back into that alias.
    model_id_prefix: claude
    auth: claude
    token_env: ANTHROPIC_AUTH_TOKEN
    empty_env: [ANTHROPIC_API_KEY]
    opening_transport: argv
    input_readiness: bracketed-paste
    # Claude Code reads an image off the clipboard on Alt+V, which is what the
    # web session line's image paste sends after the daemon fills the machine
    # clipboard. tmux key names: M- is Alt.
    image_paste_keys: [M-v]
    skip_permissions_args: [--dangerously-skip-permissions]
    btw:
      command: /btw
      aliases: []
      minimum_version: "2.1.73"
      requires_started_conversation: false
      available_while_busy: true
      context: current-conversation
      history: ephemeral
      tool_access: none
      response_mode: single-response
    description: >-
      Claude Code, run under a claunch profile (isolated config dir, provider
      and token). Needs --profile; the executable is CLAUDE_LAUNCHER_BIN.

  codex:
    command: codex
    models: [luna, terra, sol, astra]
    efforts: [none, low, medium, high, xhigh, max]
    model_aliases:
      luna: gpt-5.6-luna
      terra: gpt-5.6-terra
      sol: gpt-5.6-sol
      astra: gpt-6-astra
    model_args: [-c, "model={model}"]
    effort_args: [-c, "model_reasoning_effort={effort}"]
    btw:
      command: /btw
      aliases: [/side]
      minimum_version: "0.133.0"
      requires_started_conversation: true
      available_while_busy: true
      context: reference-parent
      history: ephemeral
      tool_access: restricted
      response_mode: conversation
    args: [--dangerously-bypass-approvals-and-sandbox]
    restore_args: [resume, --last]
    home_env: CODEX_HOME
    auth: oauth
    clear_env: [OPENAI_API_KEY, CODEX_API_KEY, CODEX_ACCESS_TOKEN]
    login_args: [login]
    heartbeat_args: [exec, --skip-git-repo-check]
    skip_permissions_args: [--approval-mode, full-auto]
    full_access_args: [--sandbox, danger-full-access]
    full_access_off_args: [--sandbox, workspace-write]
    mode_conflict_args: [--dangerously-bypass-approvals-and-sandbox]
    usage: codex-app-server
    opening_transport: argv
    input_readiness: bracketed-paste
    submit_strategy: screen
    paste_enter_delay: 0.2
    description: OpenAI's Codex CLI.

  pi:
    command: pi
    home_env: PI_CODING_AGENT_DIR
    auth: api-key
    token_env: ANTHROPIC_API_KEY
    provider_adapter: pi
    efforts: [low, medium, high]
    effort_args: [--thinking, "{effort}"]
    # pi's TUI enables DECSET 2004 at startup; wait for it (and a quiet
    # screen) before typing the opening task -- pasted at 'immediate' the
    # lines after the first were lost while pi was still coming up
    # (measured 2026-09-11: only the delivery stamp reached the model).
    input_readiness: bracketed-paste
    # pi prints tool results untruncated with truecolour (60–280 KiB/s per
    # session, measured 2026-09-11); the daemon renders its screen only
    # while a viewer is attached and judges idle/busy from output timing.
    background_render: false
    # claunch's own tools, registered by the packaged pi_tools.mjs extension.
    # A profile's harness_options.pi.tools switches them per profile; a
    # session's `tools` (create/spawn forms, --tools) overrides per session.
    tools: [full_read]
    heartbeat_args: [-p]
    description: >-
      The pi CLI agent using the packaged Anthropic API-key route and claunch
      provider projection.

  kimi:
    command: kimi
    home_env: KIMI_CODE_HOME
    auth: oauth
    clear_env: [KIMI_API_KEY]
    login_args: [login]
    heartbeat_args: [-p]
    usage: kimi-web-server
    description: Moonshot AI's Kimi Code CLI.

  agent:
    command: agent
    home_env: CURSOR_CONFIG_DIR
    auth: oauth
    clear_env: [CURSOR_API_KEY]
    login_args: [login]
    heartbeat_args: [-p]
    description: Cursor Agent CLI.

  devin:
    command: devin
    # OAuth harness: the account session lives in devin's own home and
    # claunch never hands it the launcher token. No home_env is declared,
    # and that is a measurement rather than an omission -- devin is the one
    # harness with no environment variable that relocates its home.
    # Measured 2026-09-20 on win32: XDG_CONFIG_HOME and APPDATA are both
    # ignored (devin resolves the directory through the Win32 known-folder
    # API, reproduced from a native shell as well as Git Bash), and
    # `--config PATH` replaces only config.json, leaving credentials.toml
    # machine-wide. A home_env nothing honours would be a setting that
    # silently does nothing. install.py therefore targets devin's real
    # machine-wide home, and reports it as machine-wide.
    auth: oauth
    login_args: [auth, login]
    # An unattended session cannot answer devin's workspace-trust prompt,
    # and no directory is trusted by default (there is no trust record for
    # any path on this machine). Interactive sessions would block on a
    # question the daemon cannot type an answer to, so the waiver is
    # packaged here for the same reason codex packages its approvals
    # bypass. Non-interactive mode refuses outright without it.
    # The value is quoted on purpose: a bare YAML `false` parses to a
    # boolean, and claunch stringifies argv elements, so the harness would
    # receive `--respect-workspace-trust False` -- which devin's argument
    # parser rejects (its possible values are the lowercase spellings).
    args: [--respect-workspace-trust, "false"]
    # devin's print mode: `devin ... -p <prompt>` runs once and exits.
    # With the trust waiver in `args` this composes to
    # `devin --respect-workspace-trust false -p <prompt>`, which was run
    # against a live account and answered.
    heartbeat_args: [-p]
    # `-c/--continue` reopens the most recent conversation in the working
    # directory, which is the same shape as codex's `resume --last`.
    # `-r/--resume` without an id opens an interactive picker instead.
    restore_args: [--continue]
    # devin's own short names (``devin models list`` prints an `aliases:`
    # line per family); claunch hands the choice over as `--model=<alias>`.
    models: [opus, sonnet, haiku, gemini, gpt, swe, codex]
    skip_permissions_args: [--permission-mode, dangerous]
    # `--sandbox` is deliberately not declared for the full-access group:
    # its help text scopes it to macOS seatbelt and Linux bwrap+seccomp,
    # so its behaviour here (win32) is unmeasured, and devin's unswitched
    # default already has no sandbox.
    opening_transport: pty
    input_readiness: bracketed-paste
    description: >-
      Devin CLI, signed in with the account's own OAuth session. The config
      home is machine-wide, so profiles do not isolate its credentials.
