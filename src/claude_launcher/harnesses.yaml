version: 1

harnesses:

  claude:
    builtin: true
    models: [haiku, sonnet, opus, fable]
    auth: claude
    token_env: ANTHROPIC_AUTH_TOKEN
    empty_env: [ANTHROPIC_API_KEY]
    opening_transport: argv
    input_readiness: bracketed-paste
    skip_permissions_args: [--dangerously-skip-permissions]
    btw:
      command: /btw
      aliases: []
      minimum_version: "2.1.73"
      requires_started_conversation: false
      available_while_busy: true
      context: current-conversation
      history: ephemeral
      tool_access: none
      response_mode: single-response
    description: >-
      Claude Code, run under a claunch profile (isolated config dir, provider
      and token). Needs --profile; the executable is CLAUDE_LAUNCHER_BIN.

  codex:
    command: codex
    models: [luna, terra, sol]
    efforts: [low, medium, high]
    model_args: [-c, "model=gpt-5.6-{model}"]
    effort_args: [-c, "model_reasoning_effort={effort}"]
    btw:
      command: /btw
      aliases: [/side]
      minimum_version: "0.133.0"
      requires_started_conversation: true
      available_while_busy: true
      context: reference-parent
      history: ephemeral
      tool_access: restricted
      response_mode: conversation
    args: [--dangerously-bypass-approvals-and-sandbox]
    restore_args: [resume, --last]
    home_env: CODEX_HOME
    auth: oauth
    clear_env: [OPENAI_API_KEY, CODEX_API_KEY, CODEX_ACCESS_TOKEN]
    login_args: [login]
    heartbeat_args: [exec, --skip-git-repo-check]
    skip_permissions_args: [--approval-mode, full-auto]
    full_access_args: [--sandbox, danger-full-access]
    full_access_off_args: [--sandbox, workspace-write]
    mode_conflict_args: [--dangerously-bypass-approvals-and-sandbox]
    usage: codex-app-server
    opening_transport: argv
    input_readiness: bracketed-paste
    submit_strategy: screen
    paste_enter_delay: 0.2
    description: OpenAI's Codex CLI.

  pi:
    command: pi
    home_env: PI_CODING_AGENT_DIR
    auth: api-key
    token_env: ANTHROPIC_API_KEY
    provider_adapter: pi
    heartbeat_args: [-p]
    description: >-
      The pi CLI agent using the packaged Anthropic API-key route and claunch
      provider projection.

  kimi:
    command: kimi
    home_env: KIMI_CODE_HOME
    auth: oauth
    clear_env: [KIMI_API_KEY]
    login_args: [login]
    heartbeat_args: [-p]
    usage: kimi-web-server
    description: Moonshot AI's Kimi Code CLI.

  agent:
    command: agent
    home_env: CURSOR_CONFIG_DIR
    auth: oauth
    clear_env: [CURSOR_API_KEY]
    login_args: [login]
    heartbeat_args: [-p]
    description: Cursor Agent CLI.
